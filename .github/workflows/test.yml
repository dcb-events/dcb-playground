# The same guardrail as the pre-commit hook, run on every push and pull
# request: the four suites, the generated schemas being current, and no
# bare .replace() in a suite. It runs the hook itself, so the two cannot
# drift apart.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh .githooks/pre-commit
