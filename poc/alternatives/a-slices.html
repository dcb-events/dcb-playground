<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A · Slices — DCB Playground</title>
<link rel="stylesheet" href="shared.css">
<style>
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 45px); }
  .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 0; }
  .rail h4 { padding: 0 16px 8px; }
  .rail a {
    display: block; padding: 6px 16px; font-size: 13px;
    color: var(--text); text-decoration: none; border-left: 3px solid transparent;
  }
  .rail a:hover { background: var(--command-soft); }
  .rail a.on { border-left-color: var(--command); background: var(--command-soft); font-weight: 600; }
  .rail a .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .rail .add { padding: 10px 16px 0; display: flex; gap: 6px; }

  /* Two levels: a feature, and the commands that make it up. */
  .group {
    display: flex; align-items: baseline; gap: 6px;
    padding: 9px 16px 3px; font-size: 12px; font-weight: 600;
  }
  .group .caret { cursor: pointer; color: var(--muted); font-size: 10px; width: 10px; }
  .group .gname { cursor: pointer; flex: 1; }
  .group .gname:hover { color: var(--command); }
  .group .gcount {
    font-weight: 400; font-size: 10px; color: var(--muted);
    background: var(--bg); border-radius: 999px; padding: 0 6px;
  }
  .rail a.cmd { padding-left: 32px; }
  .gempty { padding: 2px 16px 4px 32px; font-size: 11px; color: var(--muted); font-style: italic; }

  /* The stored identifier, for anyone who wants to see it. */
  .tech {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-left: 6px; font-weight: 400;
  }

  /* Inline forms, everywhere a name is needed — never a browser dialog. */
  .inline-form {
    border: 1px dashed var(--command); border-radius: 6px;
    padding: 8px 10px; margin: 6px 0; background: var(--command-soft);
  }
  .inline-form .q { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .inline-form .adder { margin-top: 0; }
  .rail .inline-form { margin: 6px 16px; }
  .becomes { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .feature-of { display: flex; align-items: center; gap: 7px; margin-top: 9px; }

  .blank { max-width: 470px; padding: 40px 0; }
  .blank h2 { margin-bottom: 6px; }
  .blank p { margin-bottom: 14px; }

  /* Draft: a command being described, before it exists. */
  .draft { max-width: 640px; }
  .draft .qblock { margin-bottom: 20px; }
  .draft .qblock > label {
    display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px;
  }
  .draft .qblock .why { font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }
  .draft input.big { width: 330px; font-size: 14px; padding: 6px 9px; }
  .draft .actions { display: flex; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); }

  /* Entity manager */
  .ecard {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 12px 14px; margin-bottom: 12px;
  }
  .ehead { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .erows { border-top: 1px dashed var(--border); }
  .erow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px;
  }
  .erow .nm { min-width: 165px; }
  .erow.dead { opacity: .55; }
  .erow.dead .nm::after { content: " · unused"; color: var(--danger); font-size: 10px; }
  .chip.initial { background: #fffbeb; border-color: #fde68a; color: #92400e; }

  .slice { padding: 22px 30px 70px; max-width: 800px; }
  .slice > header { margin-bottom: 22px; }
  .slice > header .name { font-size: 20px; font-weight: 600; }

  /* Each step of the slice, in the order you meet it. */
  .step { position: relative; padding: 0 0 4px 26px; margin-bottom: 22px; }
  .step::before {
    content: ""; position: absolute; left: 7px; top: 20px; bottom: -22px;
    width: 2px; background: var(--border);
  }
  .step:last-of-type::before { display: none; }
  .step > .dot {
    position: absolute; left: 0; top: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 3px solid var(--surface); background: var(--border-strong);
  }
  .step.trigger > .dot { background: var(--command); }
  .step.reads > .dot, .step.changes > .dot { background: var(--entity); }
  .step.rules > .dot { background: var(--text); }
  .step.emits > .dot { background: var(--event); }
  .step > h4 { margin-bottom: 7px; }

  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 10px 13px; margin-bottom: 7px;
  }
  .card.event { border-left: 3px solid var(--event); }
  .card.entity { border-left: 3px solid var(--entity); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 6px; }
  .row .grow { flex: 1; }
  .sentence { font-size: 13px; }
  .sentence .op { font-family: var(--mono); font-size: 12px; background: var(--type-soft);
                  border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .sentence .verb { color: var(--muted); }
  .fields { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .field { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
  .field .nm { min-width: 170px; }
  .adder { display: flex; gap: 6px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .dcb { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; }
  .dcb .k { color: var(--muted); }
  .dcb .t { color: var(--entity); }
  .dcb .y { color: var(--event); }

  /* An entity chip is a way in: click it anywhere and the thing itself
     slides in beside what you were reading, rather than replacing it. */
  .chip.entity, .op.ent { cursor: pointer; }
  .chip.entity:hover, .op.ent:hover { outline: 1px solid var(--entity); }

  .inspector {
    position: fixed; top: 45px; right: 0; bottom: 0; width: 380px;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: -10px 0 30px rgba(15,23,42,.10);
    overflow: auto; padding: 16px 18px 60px; z-index: 30;
  }
  .inspector .close { float: right; }
  .inspector h3 { margin-bottom: 2px; }
  .inspector .sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .prop { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 7px; }
  .prop.reserved { background: var(--entity-soft); border-color: #bbf7d0; }
  .prop .top { display: flex; align-items: baseline; gap: 7px; }
  .prop .nm { font-size: 12px; font-weight: 600; }
  .prop .use { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
  .prop .use b { font-weight: 600; color: var(--text); cursor: pointer; }
</style>
</head>
<body>

<div class="app-bar">
  <a class="home" href="index.html">← about</a>
  <h1>A · Slices</h1>
  <span class="muted small">features, and the commands that make them up</span>
  <span class="spacer"></span>
  <span id="picker"></span>
  <span id="mode"></span>
</div>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main class="slice" id="main"></main>
</div>
<div id="inspector-host"></div>

<script src="model.js"></script>
<script src="shared.js"></script>
<script>
// ============================================================
// A · Slices
//
// Two levels. A *feature* ("Course management") is a heading over the
// *commands* that make it up; a command is the unit of work, and
// everything it touches lives on one page — the events it records and
// the state those events change included.
//
// Three rules this interface holds to:
//   - names are written the way you would say them ("define course"),
//     and the PascalCase the schema wants is derived, not typed;
//   - a new command is described in the page, not in a dialog — there
//     are no browser prompts anywhere in here;
//   - the machinery (identifier schemas, custom types, sequences, the
//     derived boundary, the entity manager) only appears in Advanced.
// ============================================================

const state = {
  view: 'slice',            // 'slice' | 'draft' | 'entities'
  slice: null,
  openEvent: null,
  collapsed: {},            // feature name -> collapsed in the rail
  inspect: null,            // entity shown in the inspector
  draft: null,              // a command being described
  newFeature: false,        // inline form open in the rail
  renamingFeature: null,
  newEntityAt: null,        // 'reads' | 'changes:<Event>' | 'manager'
  addingProp: null,         // { eventName }
  addingState: null,        // { entity, eventName } | { entity, at }
  renamingEntity: null,
  confirmRemove: null,
  newContext: false,        // naming form for a brand-new context
};

// Called by the context picker in shared.js, which owns no forms itself.
function onNewContext() { closeForms(); state.newContext = true; render(); }

const NEW = ' new';         // sentinel row in a picker

// ---------- small helpers ----------

function patch(kind, name, mutate) {
  const ctx = activeContext();
  const body = deepClone(ctx[DEF_COLLECTIONS[kind]][name]);
  mutate(body);
  run(() => updateDefinition(kind, ctx.id, name, body));
}
const patchSlice = (mutate) => patch('command-definition', state.slice, mutate);

// A name as a modeler reads it, with the stored identifier alongside
// once they have asked to see that sort of thing.
function named(name, cls) {
  return h('span', { class: cls || '' }, readable(name),
    advanced() ? h('span', { class: 'tech' }, name) : null);
}

function typeChoices(ctx) {
  if (advanced()) return allTypeNames(ctx);
  return [...SIMPLE_TYPES, ...Object.keys(ctx['entity-definitions']).sort().map(idTypeOf)];
}
function typeOptions(ctx) {
  return typeChoices(ctx).map((t) => [t, readable(t)]);
}

function pick(options, value, onchange, placeholder) {
  const sel = h('select', { onchange: (e) => onchange(e.target.value) });
  if (placeholder) sel.appendChild(h('option', { value: '' }, placeholder));
  for (const o of options) {
    const [v, text] = Array.isArray(o) ? o : [o, o];
    sel.appendChild(h('option', { value: v, selected: v === value }, text));
  }
  return sel;
}

// The one thing that replaces every prompt(): a labelled field, a live
// preview of what it will be stored as, and two buttons.
function inlineForm({ question, placeholder, value = '', showsIdentifier, onSubmit, onCancel }) {
  let text = value;
  const preview = h('span', { class: 'becomes' }, '');
  const paint = () => {
    preview.innerHTML = '';
    if (showsIdentifier && text.trim()) preview.appendChild(document.createTextNode('→ ' + toPascal(text)));
  };
  const input = h('input', {
    type: 'text', value, placeholder, style: 'width:210px',
    oninput: (e) => { text = e.target.value; paint(); },
    onkeydown: (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
    },
  });
  const submit = () => {
    if (!text.trim()) return toast('Give it a name.', true);
    onSubmit(text.trim());
  };
  paint();
  setTimeout(() => input.focus(), 0);
  return h('div', { class: 'inline-form' },
    question ? h('div', { class: 'q' }, question) : null,
    h('div', { class: 'adder' }, input, preview,
      h('button', { class: 'btn primary', onclick: submit }, 'Add'),
      h('button', { class: 'btn ghost', onclick: onCancel }, 'Cancel')));
}

const closeForms = () => {
  state.newFeature = false; state.renamingFeature = null; state.newEntityAt = null;
  state.addingProp = null; state.addingState = null; state.renamingEntity = null;
  state.confirmRemove = null; state.newContext = false;
};

// ---------- rail ----------

function renderRail() {
  const ctx = activeContext();
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  rail.appendChild(h('h4', {}, 'Features'));

  for (const group of featureGroups(ctx)) {
    if (state.renamingFeature === group.name) {
      rail.appendChild(inlineForm({
        question: 'Rename this feature', value: group.name,
        onSubmit: (v) => { renameFeature(ctx, group.name, v); },
        onCancel: () => { state.renamingFeature = null; render(); },
      }));
    } else {
      const collapsed = !!state.collapsed[group.name];
      rail.appendChild(h('div', { class: 'group' },
        h('span', {
          class: 'caret', onclick: () => { state.collapsed[group.name] = !collapsed; render(); },
        }, collapsed ? '▸' : '▾'),
        h('span', {
          class: 'gname',
          title: group.name === UNGROUPED ? '' : 'Rename',
          onclick: () => {
            if (group.name === UNGROUPED) return;
            closeForms(); state.renamingFeature = group.name; render();
          },
        }, group.name),
        h('span', { class: 'gcount' }, group.commands.length)));
      if (collapsed) continue;
    }

    for (const name of group.commands) {
      const slice = sliceOf(ctx, name);
      rail.appendChild(h('a', {
        href: '#', class: 'cmd' + (name === state.slice && state.view === 'slice' ? ' on' : ''),
        onclick: (e) => {
          e.preventDefault(); closeForms();
          state.slice = name; state.openEvent = null; state.view = 'slice'; render();
        },
      }, named(name), h('span', { class: 'sub' },
        slice.emits.map((x) => readable(x.emission.name)).join(', ') || 'records nothing')));
    }
    if (!group.commands.length) rail.appendChild(h('div', { class: 'gempty' }, 'nothing in it yet'));
  }

  rail.appendChild(h('div', { class: 'add' },
    h('button', { class: 'btn', onclick: () => startDraft(ctx) }, '+ Command'),
    h('button', {
      class: 'btn ghost', onclick: () => { closeForms(); state.newFeature = true; render(); },
    }, '+ Feature')));

  if (state.newFeature) {
    rail.appendChild(inlineForm({
      question: 'What should this group of commands be called?',
      placeholder: 'Course management',
      onSubmit: (v) => {
        if (featureGroups(ctx).some((g) => g.name === v)) return toast('That feature already exists.', true);
        addPendingFeature(v); state.newFeature = false; render();
      },
      onCancel: () => { state.newFeature = false; render(); },
    }));
  }

  if (advanced()) {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Model'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'entities' ? 'on' : '',
      onclick: (e) => {
        e.preventDefault(); closeForms();
        state.view = 'entities'; state.inspect = null; render();
      },
    }, 'Entities', h('span', { class: 'sub' },
      Object.keys(ctx['entity-definitions']).length + ' kinds of thing')));
  }

  const loose = orphans(ctx);
  if (loose.events.length || loose.entities.length) {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Nothing uses these'));
    for (const n of loose.events) rail.appendChild(h('div', {},
      h('span', { class: 'chip event', style: 'margin:2px 16px' }, readable(n))));
    for (const n of loose.entities) rail.appendChild(h('div', {},
      h('span', { class: 'chip entity', style: 'margin:2px 16px',
        onclick: () => { state.inspect = n; render(); } }, readable(n))));
  }
}

function renameFeature(ctx, from, to) {
  if (from === UNGROUPED || to === from) { state.renamingFeature = null; return render(); }
  run(() => {
    for (const [cmd, body] of Object.entries(activeContext()['command-definitions'])) {
      if (featureOf(body) !== from) continue;
      const next = deepClone(body);
      next.feature = to;
      updateDefinition('command-definition', ctx.id, cmd, next);
    }
    setPendingFeatures(pendingFeatures().filter((p) => p !== from).concat(to));
    state.renamingFeature = null;
  });
}

// ---------- describing a new command ----------

function startDraft(ctx) {
  closeForms();
  const current = state.slice && ctx['command-definitions'][state.slice]
    ? featureOf(ctx['command-definitions'][state.slice]) : UNGROUPED;
  state.draft = { name: '', event: '', eventTouched: false, copyFields: true, payload: [], feature: current };
  state.view = 'draft';
  render();
}

function renderDraft(ctx, main) {
  const d = state.draft;
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'A new command'),
    h('div', { class: 'muted small' },
      'Nothing is written until you create it. Everything else — what it reads, what it '
      + 'changes — is added afterwards, on this same page.')));

  const box = h('div', { class: 'draft' });

  // 1. the command
  const eventInput = h('input', {
    type: 'text', class: 'big', value: d.event, placeholder: 'course defined',
    oninput: (e) => { d.event = e.target.value; d.eventTouched = true; paintEventTech(); },
  });
  const eventTech = h('span', { class: 'becomes' }, '');
  const paintEventTech = () => {
    eventTech.innerHTML = '';
    const stored = toPascal(d.event);
    if (!stored) return;
    const known = !!ctx['event-definitions'][stored];
    eventTech.appendChild(document.createTextNode(
      '→ ' + stored + (known ? '  · already recorded elsewhere' : '')));
  };

  const nameInput = h('input', {
    type: 'text', class: 'big', value: d.name, placeholder: 'define course',
    oninput: (e) => {
      d.name = e.target.value;
      nameTech.innerHTML = '';
      if (toPascal(d.name)) nameTech.appendChild(document.createTextNode('→ ' + toPascal(d.name)));
      // The event follows the command until you say otherwise.
      if (!d.eventTouched) {
        d.event = readable(suggestEventName(d.name));
        eventInput.value = d.event;
        paintEventTech();
      }
    },
  });
  const nameTech = h('span', { class: 'becomes' }, '');

  box.appendChild(h('div', { class: 'qblock' },
    h('label', {}, 'What can someone do?'),
    h('div', { class: 'why' }, 'Say it as an instruction. Capitals and punctuation do not matter.'),
    h('div', { class: 'adder' }, nameInput, nameTech)));

  // 2. its input
  const rows = d.payload.map((p, i) => h('div', { class: 'field' },
    h('span', { class: 'nm' }, named(p.name)),
    h('span', { class: 'chip' }, readable(typeLabel(p))),
    h('span', { class: 'grow', style: 'flex:1' }),
    h('button', { class: 'btn tiny danger', onclick: () => { d.payload.splice(i, 1); render(); } }, '×')));
  let fieldName = '', fieldType = 'string', fieldList = false;
  box.appendChild(h('div', { class: 'qblock' },
    h('label', {}, 'What do they have to provide?'),
    h('div', { class: 'why' }, 'Only what the caller knows. Leave it empty if nothing.'),
    h('div', { class: 'card' },
      rows.length ? rows : h('div', { class: 'empty' }, 'Nothing.'),
      h('div', { class: 'adder' },
        h('input', { type: 'text', placeholder: 'course id', oninput: (e) => { fieldName = e.target.value; } }),
        pick(typeOptions(ctx), fieldType, (v) => { fieldType = v; }),
        h('label', { class: 'tiny muted' },
          h('input', { type: 'checkbox', onchange: (e) => { fieldList = e.target.checked; } }), ' many'),
        h('button', {
          class: 'btn', onclick: () => {
            if (!fieldName.trim()) return toast('Give the field a name.', true);
            d.payload.push({ name: toCamel(fieldName), propertyType: fieldType, isOptional: false, isList: fieldList });
            render();
          },
        }, '+ Add')))));

  // 3. what it records
  box.appendChild(h('div', { class: 'qblock' },
    h('label', {}, 'What happened, once it worked?'),
    h('div', { class: 'why' },
      'Past tense — a fact, not an instruction. Suggested from the command; change it freely.'),
    h('div', { class: 'adder' }, eventInput, eventTech),
    h('label', { class: 'tiny muted', style: 'display:block;margin-top:7px' },
      h('input', {
        type: 'checkbox', checked: d.copyFields,
        onchange: (e) => { d.copyFields = e.target.checked; },
      }),
      ' record the same fields it was given')));

  // 4. where it belongs
  box.appendChild(h('div', { class: 'qblock' },
    h('label', {}, 'Part of which feature?'),
    pick([...featureNames(ctx).map((n) => [n, n]), [UNGROUPED, '— none for now —']],
      d.feature, (v) => { d.feature = v; })));

  box.appendChild(h('div', { class: 'actions' },
    h('button', { class: 'btn primary', onclick: () => commitDraft(ctx) }, 'Create command'),
    h('button', {
      class: 'btn ghost',
      onclick: () => { state.draft = null; state.view = 'slice'; render(); },
    }, 'Cancel')));

  main.appendChild(box);
  paintEventTech();
}

function commitDraft(ctx) {
  const d = state.draft;
  const commandName = toPascal(d.name);
  const eventName = toPascal(d.event);
  if (!commandName) return toast('The command needs a name.', true);
  if (!eventName) return toast('A command has to record something.', true);

  run(() => {
    const existing = activeContext()['event-definitions'][eventName];
    if (!existing) {
      addDefinition('event-definition', ctx.id, eventName, {
        properties: d.copyFields ? deepClone(d.payload) : [],
      });
    }
    // Wire every event field the command was given a value for.
    const fields = activeContext()['event-definitions'][eventName].properties || [];
    const parameters = {};
    for (const f of fields) {
      if (d.payload.some((p) => p.name === f.name)) parameters[f.name] = { parameterName: f.name };
    }
    const body = {
      properties: deepClone(d.payload), boundary: [], conditions: [],
      publishes: [{ name: eventName, parameters }],
    };
    if (d.feature !== UNGROUPED) body.feature = d.feature;
    addDefinition('command-definition', ctx.id, commandName, body);
    state.draft = null; state.view = 'slice'; state.slice = commandName; state.openEvent = eventName;
  });
}

// ---------- the slice ----------

function render() {
  const ctx = activeContext();
  document.getElementById('picker').innerHTML = '';
  document.getElementById('picker').appendChild(contextPicker());
  document.getElementById('mode').innerHTML = '';
  document.getElementById('mode').appendChild(modeSwitch());

  const names = Object.keys(ctx['command-definitions']);
  if (state.view === 'slice' && (!state.slice || !names.includes(state.slice))) {
    state.slice = names[0] || null;
  }
  if (state.view === 'entities' && !advanced()) state.view = 'slice';
  renderRail();

  const main = document.getElementById('main');
  main.innerHTML = '';
  renderInspector(ctx);

  if (state.newContext) {
    main.appendChild(h('header', {}, h('div', { class: 'name' }, 'A new model')));
    main.appendChild(inlineForm({
      question: 'What is this model called?', placeholder: 'Course subscriptions',
      onSubmit: (v) => { state.newContext = false; state.slice = null; createNamedContext(v); },
      onCancel: () => { state.newContext = false; render(); },
    }));
    return;
  }

  if (state.view === 'draft') return renderDraft(ctx, main);
  if (state.view === 'entities') return renderEntities(ctx, main);

  if (!state.slice) {
    main.appendChild(h('div', { class: 'blank' },
      h('h2', {}, 'Nothing here yet'),
      h('p', { class: 'muted small' },
        'Start with something someone can do. Name it and the thing it records, and the rest '
        + 'of the model — what it reads, what it changes, the things themselves — gets built '
        + 'from inside it.'),
      h('button', { class: 'btn primary', onclick: () => startDraft(ctx) }, '+ First command')));
    return;
  }

  const slice = sliceOf(ctx, state.slice);
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, named(slice.name)),
    h('div', { class: 'muted small' },
      'Reads ' + (slice.reads.length || 'nothing') + ' · '
      + slice.rules.length + ' rule' + (slice.rules.length === 1 ? '' : 's') + ' · records '
      + (slice.emits.map((e) => readable(e.emission.name)).join(', ') || 'nothing')),
    featurePicker(ctx, slice)));

  main.appendChild(stepTrigger(ctx, slice));
  main.appendChild(stepReads(ctx, slice));
  main.appendChild(stepRules(ctx, slice));
  main.appendChild(stepEmits(ctx, slice));
  main.appendChild(stepChanges(ctx, slice));
  if (advanced()) main.appendChild(stepConsistency(ctx, slice));
  else main.appendChild(h('div', { class: 'muted tiny', style: 'padding-left:26px' },
    'Switch to Advanced to see the consistency boundary this command derives.'));
}

function featurePicker(ctx, slice) {
  const current = featureOf(slice.body);
  if (state.newFeature === 'slice') {
    return inlineForm({
      question: 'What should the new feature be called?', placeholder: 'Course management',
      onSubmit: (v) => { state.newFeature = false; patchSlice((b) => { b.feature = v; }); },
      onCancel: () => { state.newFeature = false; render(); },
    });
  }
  return h('div', { class: 'feature-of' },
    h('span', { class: 'muted tiny' }, 'part of'),
    pick([...featureNames(ctx).map((n) => [n, n]), [UNGROUPED, '— ungrouped —'], [NEW, '+ New feature…']],
      current, (v) => {
        if (v === NEW) { state.newFeature = 'slice'; return render(); }
        patchSlice((b) => { if (v === UNGROUPED) delete b.feature; else b.feature = v; });
      }));
}

function step(kind, title, ...body) {
  return h('section', { class: 'step ' + kind }, h('span', { class: 'dot' }), h('h4', {}, title), ...body);
}

function stepTrigger(ctx, slice) {
  const rows = slice.payload.map((p, i) => h('div', { class: 'field' },
    h('span', { class: 'nm' }, named(p.name)),
    h('span', { class: 'chip' }, readable(typeLabel(p))),
    h('span', { class: 'grow', style: 'flex:1' }),
    h('button', {
      class: 'btn tiny danger',
      onclick: () => patchSlice((b) => { b.properties.splice(i, 1); }),
    }, '×')));
  if (!rows.length) rows.push(h('div', { class: 'empty' }, 'Takes no input.'));

  let name = '', type = 'string', isList = false;
  return step('trigger', 'Someone asks for this, providing',
    h('div', { class: 'card' }, rows,
      h('div', { class: 'adder' },
        h('input', { type: 'text', placeholder: 'course id', oninput: (e) => { name = e.target.value; } }),
        pick(typeOptions(ctx), type, (v) => { type = v; }),
        h('label', { class: 'tiny muted' },
          h('input', { type: 'checkbox', onchange: (e) => { isList = e.target.checked; } }), ' many'),
        h('button', {
          class: 'btn', onclick: () => {
            if (!name.trim()) return toast('Give the field a name.', true);
            patchSlice((b) => b.properties.push({
              name: toCamel(name), propertyType: type, isOptional: false, isList }));
          },
        }, '+ Add input'))));
}

function stepReads(ctx, slice) {
  const cards = slice.reads.map((binding, i) => {
    const r = readParts(ctx, slice.body, binding);
    return h('div', { class: 'card entity' }, h('div', { class: 'row' },
      h('span', { class: 'sentence' },
        h('span', { class: 'chip entity', title: 'Open ' + readable(r.entity),
          onclick: () => { state.inspect = r.entity; render(); } }, readable(r.entity)),
        ' as ', h('span', { class: 'op' }, r.alias),
        h('span', { class: 'verb' }, r.plural ? ' — one for each ' : ' — identified by '),
        h('span', { class: 'op' }, r.from),
        r.excluding ? h('span', {}, h('span', { class: 'verb' }, ' except '),
          h('span', { class: 'op' }, r.excluding)) : null),
      h('span', { class: 'grow' }),
      h('button', {
        class: 'btn tiny danger',
        onclick: () => patchSlice((b) => { b.boundary.splice(i, 1); }),
      }, '×')));
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Reads nothing — it decides unconditionally.'));

  const sources = [
    ...slice.payload.map((p) => [JSON.stringify({ parameterName: p.name }), 'given · ' + readable(p.name)]),
    ...slice.reads.flatMap((b) => {
      const entity = ctx['entity-definitions'][b.entity];
      return (entity ? entity.properties : []).map((p) =>
        [JSON.stringify({ alias: b.alias, property: p.name }), `${b.alias}.${p.name}`]);
    }),
    ...uniq(slice.sequences.concat(advanced() ? Object.keys(ctx['sequence-definitions']) : []))
      .map((s) => [JSON.stringify({ sequence: s }), 'numbered by ' + readable(s)]),
  ];
  const entityNames = Object.keys(ctx['entity-definitions']).sort();
  let entity = entityNames[0] || '';
  let source = sources.length ? sources[0][0] : '';

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'reads') {
    body.push(inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => { state.newEntityAt = null; createEntity(ctx, v); },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else if (!entityNames.length) {
    // With nothing to choose between, a picker whose only row is
    // "+ New…" could never fire — so offer the button itself.
    body.push(h('div', { class: 'card' }, h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'Nothing to read yet.'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'reads'; render(); },
      }, '+ New kind of thing'))));
  } else {
    body.push(h('div', { class: 'card' }, h('div', { class: 'adder' },
      pick([...entityNames.map((n) => [n, readable(n)]), [NEW, '+ New kind of thing…']], entity, (v) => {
        if (v === NEW) { closeForms(); state.newEntityAt = 'reads'; return render(); }
        entity = v;
      }),
      h('span', { class: 'muted tiny' }, 'identified by'),
      pick(sources, source, (v) => { source = v; }, sources.length ? null : '— nothing in scope yet —'),
      h('button', {
        class: 'btn', onclick: () => {
          if (!entity || !source) return toast('Pick a thing and where its id comes from.', true);
          patchSlice((b) => b.boundary.push({
            alias: uniqueAlias(defaultAlias(entity), b.boundary.map((x) => x.alias)),
            entity, id: JSON.parse(source) }));
        },
      }, '+ Read something'))));
  }
  return step('reads', 'To decide, it reads', ...body);
}

function stepRules(ctx, slice) {
  const cards = slice.rules.map((condition, i) => {
    const p = conditionParts(condition);
    return h('div', { class: 'card' }, h('div', { class: 'row' },
      h('span', { class: 'sentence' },
        h('span', { class: 'op' }, p.left), ' ', h('span', { class: 'verb' }, p.verb),
        p.right ? h('span', {}, ' ', h('span', { class: 'op' }, p.right)) : null),
      h('span', { class: 'grow' }),
      h('button', {
        class: 'btn tiny danger',
        onclick: () => patchSlice((b) => { b.conditions.splice(i, 1); }),
      }, '×')));
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'No rules — always allowed.'));

  const lefts = slice.reads.flatMap((b) => {
    const entity = ctx['entity-definitions'][b.entity];
    return (entity ? entity.properties : []).map((p) =>
      [JSON.stringify({ alias: b.alias, property: p.name }), `${b.alias}.${p.name}`]);
  });
  const rights = [
    ...slice.payload.map((p) => [JSON.stringify({ parameterName: p.name }), 'given · ' + readable(p.name)]),
    ...lefts,
    ...allStateMembers(ctx).map((m) => [JSON.stringify({ enumMember: m }), 'state · ' + readable(m)]),
  ];
  let left = lefts.length ? lefts[0][0] : '';
  let predicate = 'equals';
  let right = rights.length ? rights[0][0] : '';
  let negate = false;

  return step('rules', 'It is only allowed if', h('div', {}, cards),
    h('div', { class: 'card' }, h('div', { class: 'adder' },
      pick(lefts, left, (v) => { left = v; }, lefts.length ? null : '— read something first —'),
      h('label', { class: 'tiny muted' },
        h('input', { type: 'checkbox', onchange: (e) => { negate = e.target.checked; } }), ' not'),
      pick(BINARY_PREDICATES.concat(UNARY_PREDICATES).map((p) => [p, readable(p).toLowerCase()]),
        predicate, (v) => { predicate = v; }),
      pick(rights, right, (v) => { right = v; }),
      h('button', {
        class: 'btn', onclick: () => {
          if (!left) return toast('Read something before adding a rule about it.', true);
          patchSlice((b) => {
            const c = { leftHandSide: JSON.parse(left), predicate };
            if (!UNARY_PREDICATES.includes(predicate)) c.rightHandSide = JSON.parse(right);
            if (negate) c.negate = true;
            b.conditions.push(c);
          });
        },
      }, '+ Add rule'))));
}

function stepEmits(ctx, slice) {
  const cards = slice.emits.map(({ emission, event }, i) => {
    const open = state.openEvent === emission.name;
    const params = event ? (event.properties || []) : [];
    return h('div', { class: 'card event' },
      h('div', { class: 'row' },
        h('span', { class: 'chip event' }, readable(emission.name)),
        advanced() ? h('span', { class: 'tech' }, emission.name) : null,
        h('span', { class: 'muted tiny' }, params.length + ' field' + (params.length === 1 ? '' : 's')),
        h('span', { class: 'grow' }),
        h('button', {
          class: 'btn tiny',
          onclick: () => { state.openEvent = open ? null : emission.name; render(); },
        }, open ? 'Hide fields' : 'Fields'),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchSlice((b) => { b.publishes.splice(i, 1); }),
        }, '×')),
      open ? eventFields(ctx, emission, event) : null);
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Records nothing yet.'));

  const existing = Object.keys(ctx['event-definitions']).sort()
    .filter((n) => !slice.emits.some((e) => e.emission.name === n));
  let chosen = existing[0] || '';

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'event') {
    body.push(inlineForm({
      question: 'What happened?  (past tense)',
      placeholder: readable(suggestEventName(slice.name)), showsIdentifier: true,
      onSubmit: (v) => {
        const name = toPascal(v);
        state.newEntityAt = null;
        run(() => {
          if (!activeContext()['event-definitions'][name]) {
            addDefinition('event-definition', ctx.id, name, { properties: [] });
          }
          patchSlice((b) => b.publishes.push({ name, parameters: {} }));
          state.openEvent = name;
        });
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    body.push(h('div', { class: 'card' }, h('div', { class: 'adder' },
      existing.length ? pick(existing.map((n) => [n, readable(n)]), chosen, (v) => { chosen = v; }) : null,
      existing.length ? h('button', {
        class: 'btn',
        onclick: () => patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} })),
      }, '+ Record something already known') : null,
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'event'; render(); },
      }, '+ New event'))));
  }
  return step('emits', 'When it succeeds, this happened', ...body);
}

function eventFields(ctx, emission, event) {
  if (!event) return h('div', { class: 'fields empty' }, 'This event no longer exists.');
  const command = activeContext()['command-definitions'][state.slice];
  const options = [
    ...(command.properties || []).map((q) =>
      [JSON.stringify({ parameterName: q.name }), 'given · ' + readable(q.name)]),
    ...(command.boundary || []).flatMap((b) => {
      const entity = ctx['entity-definitions'][b.entity];
      return (entity ? entity.properties : []).map((q) =>
        [JSON.stringify({ alias: b.alias, property: q.name }), `${b.alias}.${q.name}`]);
    }),
    ...Object.keys(ctx['sequence-definitions']).map((s) =>
      [JSON.stringify({ sequence: s }), 'numbered by ' + readable(s)]),
  ];
  const rows = (event.properties || []).map((p, i) => {
    const bound = (emission.parameters || {})[p.name];
    return h('div', { class: 'field' },
      h('span', { class: 'nm' }, named(p.name)),
      h('span', { class: 'chip' }, readable(typeLabel(p))),
      h('span', { class: 'muted tiny' }, '←'),
      pick(options, bound === undefined ? '' : JSON.stringify(bound),
        (v) => patchSlice((b) => {
          const e = b.publishes.find((x) => x.name === emission.name);
          e.parameters = e.parameters || {};
          e.parameters[p.name] = JSON.parse(v);
        }), '— unset —'),
      h('span', { class: 'grow', style: 'flex:1' }),
      h('button', {
        class: 'btn tiny danger', title: 'Remove this field from the event',
        onclick: () => patch('event-definition', emission.name, (b) => { b.properties.splice(i, 1); }),
      }, '×'));
  });

  let name = '', type = 'string', isList = false;
  return h('div', { class: 'fields' },
    rows.length ? rows : h('div', { class: 'empty' }, 'Carries nothing yet.'),
    h('div', { class: 'adder' },
      h('input', { type: 'text', placeholder: 'course id', oninput: (e) => { name = e.target.value; } }),
      pick(typeOptions(ctx), type, (v) => { type = v; }),
      h('label', { class: 'tiny muted' },
        h('input', { type: 'checkbox', onchange: (e) => { isList = e.target.checked; } }), ' many'),
      h('button', {
        class: 'btn', onclick: () => {
          if (!name.trim()) return toast('Give the field a name.', true);
          patch('event-definition', emission.name, (b) => b.properties.push({
            name: toCamel(name), propertyType: type, isOptional: false, isList }));
        },
      }, '+ Add field')));
}

function stepChanges(ctx, slice) {
  const cards = [];
  for (const { emission, effects } of slice.emits) {
    const rows = effects.map((effect) => {
      const p = effectParts(effect);
      return h('div', { class: 'row' },
        h('span', { class: 'sentence' },
          h('span', { class: 'op ent', title: 'Open ' + readable(effect.entity),
            onclick: () => { state.inspect = effect.entity; render(); } }, p.subject), ' ',
          h('span', { class: 'verb' }, p.verb), ' ',
          h('span', { class: 'op' }, p.object)),
        h('span', { class: 'grow' }),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patch('entity-definition', effect.entity, (b) => {
            const prop = b.properties.find((q) => q.name === effect.property.name);
            prop.handlers = prop.handlers.filter((x) => x.event !== emission.name);
          }),
        }, '×'));
    });
    cards.push(h('div', { class: 'card entity' },
      h('div', { class: 'row' }, h('span', { class: 'chip event' }, readable(emission.name)),
        h('span', { class: 'muted tiny' }, 'changes')),
      h('div', { style: 'margin-top:6px' },
        rows.length ? rows : h('div', { class: 'empty' }, 'Changes nothing we know.')),
      changeAdder(ctx, emission.name)));
  }
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Nothing to change until it records something.'));
  return step('changes', 'Which changes what we know', h('div', {}, cards));
}

function changeAdder(ctx, eventName) {
  const event = ctx['event-definitions'][eventName];

  if (state.newEntityAt === 'changes:' + eventName) {
    return inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => { state.newEntityAt = null; createEntity(ctx, v); },
      onCancel: () => { state.newEntityAt = null; render(); },
    });
  }
  if (!Object.keys(ctx['entity-definitions']).length) {
    return h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'Nothing to change yet.'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'changes:' + eventName; render(); },
      }, '+ New kind of thing'));
  }

  const targets = [
    ...Object.entries(ctx['entity-definitions']).flatMap(([name, entity]) =>
      (entity.properties || []).map((p) =>
        [JSON.stringify([name, p.name]), `${readable(name)} · ${readable(p.name)}`])),
    [NEW, '+ New thing to know…'],
  ];
  const values = [
    ...(event ? event.properties : []).map((p) =>
      [JSON.stringify({ eventProperty: p.name }), "the event's " + readable(p.name)]),
    ...allStateMembers(ctx).map((m) => [JSON.stringify({ enumMember: m }), 'state · ' + readable(m)]),
    [JSON.stringify(1), 'the number 1'],
    [NEW, '+ New state…'],
  ];
  let target = targets.length > 1 ? targets[0][0] : '';
  let operation = 'set';
  let value = values.length ? values[0][0] : '';

  const targetSel = pick(targets, target, (v) => {
    if (v === NEW) { closeForms(); state.addingProp = { eventName }; return render(); }
    target = v;
  });
  const valueSel = pick(values, value, (v) => {
    if (v === NEW) {
      const t = targetSel.value;
      if (!t || t === NEW) { toast('Pick what changes first.', true); return render(); }
      closeForms(); state.addingState = { entity: JSON.parse(t)[0], eventName }; return render();
    }
    value = v;
  });

  const rows = [h('div', { class: 'adder' }, targetSel,
    pick(Object.entries(OPERATION_WORDS), operation, (v) => { operation = v; }), valueSel,
    h('button', {
      class: 'btn', onclick: () => {
        if (!target || target === NEW) return toast('Pick what changes.', true);
        const [entityName, propertyName] = JSON.parse(target);
        patch('entity-definition', entityName, (b) => {
          const prop = b.properties.find((q) => q.name === propertyName);
          prop.handlers = (prop.handlers || []).filter((x) => x.event !== eventName);
          prop.handlers.push({ event: eventName, operation, value: JSON.parse(value) });
        });
      },
    }, '+ Record a change'))];

  if (state.addingProp && state.addingProp.eventName === eventName) rows.push(newPropertyForm(ctx));
  if (state.addingState && state.addingState.eventName === eventName) {
    rows.push(inlineForm({
      question: `What else can a ${readable(state.addingState.entity)} be?`,
      placeholder: 'archived', showsIdentifier: true,
      onSubmit: (v) => {
        const entity = state.addingState.entity;
        state.addingState = null;
        patch('entity-definition', entity, (b) => b.states.push(toPascal(v)));
      },
      onCancel: () => { state.addingState = null; render(); },
    }));
  }
  return h('div', {}, rows);
}

// ---------- creating things ----------

function createEntity(ctx, label) {
  const name = toPascal(label);
  if (!name) return toast('Give it a name.', true);
  // Every entity needs a lifecycle and the reserved state property. In
  // Simple mode both exist but are never named: you say "it exists" by
  // recording a change, not by declaring an enum.
  return run(() => {
    addDefinition('entity-definition', ctx.id, name, {
      identifierSchema: { type: 'string' },
      states: [...DEFAULT_STATES],
      properties: [{
        name: STATE_PROPERTY, propertyType: stateTypeOf(name),
        isOptional: false, isList: false,
        initialValue: { enumMember: DEFAULT_STATES[0] }, handlers: [],
      }],
    });
    return name;
  });
}

function newPropertyForm(ctx) {
  let entity = Object.keys(ctx['entity-definitions'])[0] || '';
  let name = '', type = 'integer', isList = false;
  return h('div', { class: 'inline-form' },
    h('div', { class: 'q' }, 'What else should we know, and about what?'),
    h('div', { class: 'adder' },
      pick(Object.keys(ctx['entity-definitions']).sort().map((n) => [n, readable(n)]),
        entity, (v) => { entity = v; }),
      h('input', { type: 'text', placeholder: 'seat count', oninput: (e) => { name = e.target.value; } }),
      pick(typeOptions(ctx), type, (v) => { type = v; }),
      h('label', { class: 'tiny muted' },
        h('input', { type: 'checkbox', onchange: (e) => { isList = e.target.checked; } }), ' many'),
      h('button', {
        class: 'btn primary', onclick: () => {
          if (!name.trim()) return toast('Give it a name.', true);
          const property = { name: toCamel(name), propertyType: type, isOptional: false, isList };
          property.initialValue = defaultInitialValue(ctx, property);
          property.handlers = [];
          state.addingProp = null;
          patch('entity-definition', entity, (b) => b.properties.push(property));
        },
      }, 'Add'),
      h('button', { class: 'btn ghost', onclick: () => { state.addingProp = null; render(); } }, 'Cancel')));
}

// ---------- the entity manager ----------

function renderEntities(ctx, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Things we know about'),
    h('div', { class: 'muted small' },
      'Each property is folded from the events tagged with one of these — so a property '
      + 'nothing moves is a property nothing knows.')));

  for (const name of Object.keys(ctx['entity-definitions']).sort()) {
    const entity = ctx['entity-definitions'][name];
    const readers = new Set();
    const writers = new Set();
    for (const property of entity.properties || []) {
      const usage = propertyUsage(ctx, name, property.name);
      usage.readBy.forEach((c) => readers.add(c));
      usage.changedBy.forEach((u) => writers.add(u.command));
    }

    const card = h('div', { class: 'ecard' });

    if (state.renamingEntity === name) {
      card.appendChild(inlineForm({
        question: 'Rename — every reference is rewritten with it',
        value: readable(name), showsIdentifier: true,
        onSubmit: (v) => {
          const next = toPascal(v);
          state.renamingEntity = null;
          if (next && next !== name) run(() => renameDefinition('entity-definition', ctx.id, name, next));
          else render();
        },
        onCancel: () => { state.renamingEntity = null; render(); },
      }));
    } else {
      card.appendChild(h('div', { class: 'ehead' },
        h('span', { class: 'chip entity', onclick: () => { state.inspect = name; render(); } },
          readable(name)),
        advanced() ? h('span', { class: 'tech' }, name) : null,
        h('span', { class: 'muted tiny' },
          `${(entity.properties || []).length} properties · ${(entity.states || []).length} states · `
          + `moved by ${writers.size}, read by ${readers.size}`),
        h('span', { style: 'flex:1' }),
        h('button', {
          class: 'btn tiny',
          onclick: () => { closeForms(); state.renamingEntity = name; render(); },
        }, 'Rename'),
        state.confirmRemove === name
          ? h('button', {
              class: 'btn tiny danger',
              onclick: () => { state.confirmRemove = null; run(() => removeDefinition('entity-definition', ctx.id, name)); },
            }, 'Really remove?')
          : h('button', {
              class: 'btn tiny danger',
              onclick: () => { closeForms(); state.confirmRemove = name; render(); },
            }, 'Remove')));
    }

    card.appendChild(h('div', { class: 'erows' }, (entity.properties || []).map((property) => {
      const reserved = property.name === STATE_PROPERTY;
      const usage = propertyUsage(ctx, name, property.name);
      const dead = !usage.changedBy.length && !usage.readBy.length && !reserved;
      return h('div', { class: 'erow' + (dead ? ' dead' : '') },
        h('span', { class: 'nm' }, reserved && !advanced() ? 'what state it is in' : named(property.name)),
        h('span', { class: 'chip' }, reserved && !advanced()
          ? (entity.states || []).map(readable).join(' / ') : readable(typeLabel(property))),
        advanced() ? h('span', { class: 'tiny muted' },
          'from ', h('code', {}, operandWords(property.initialValue))) : null,
        h('span', { style: 'flex:1' }),
        h('span', { class: 'tiny muted' }, usage.changedBy.length
          ? 'moved by ' + uniq(usage.changedBy.map((u) => readable(u.command))).join(', ')
          : 'never moves'),
        h('span', { class: 'tiny muted' }, usage.readBy.length
          ? ' · read by ' + usage.readBy.map(readable).join(', ') : ' · never read'),
        reserved ? h('span', { class: 'chip' }, 'built in') : h('button', {
          class: 'btn tiny danger',
          onclick: () => patch('entity-definition', name, (b) => {
            b.properties = b.properties.filter((p) => p.name !== property.name);
          }),
        }, '×'));
    })));

    if (state.addingState && state.addingState.at === 'manager' && state.addingState.entity === name) {
      card.appendChild(inlineForm({
        question: `What else can a ${readable(name)} be?`, placeholder: 'archived', showsIdentifier: true,
        onSubmit: (v) => { state.addingState = null; patch('entity-definition', name, (b) => b.states.push(toPascal(v))); },
        onCancel: () => { state.addingState = null; render(); },
      }));
    }

    let pname = '', ptype = 'integer', plist = false;
    card.appendChild(h('div', { class: 'adder' },
      h('input', { type: 'text', placeholder: 'seat count', oninput: (e) => { pname = e.target.value; } }),
      pick(typeOptions(ctx), ptype, (v) => { ptype = v; }),
      h('label', { class: 'tiny muted' },
        h('input', { type: 'checkbox', onchange: (e) => { plist = e.target.checked; } }), ' many'),
      h('button', {
        class: 'btn', onclick: () => {
          if (!pname.trim()) return toast('Give it a name.', true);
          const property = { name: toCamel(pname), propertyType: ptype, isOptional: false, isList: plist };
          property.initialValue = defaultInitialValue(ctx, property);
          property.handlers = [];
          patch('entity-definition', name, (b) => b.properties.push(property));
        },
      }, '+ Property'),
      h('span', { style: 'flex:1' }),
      h('span', { class: 'tiny muted' }, 'can be: '),
      ...(entity.states || []).map((s, i) => h('span', {
        class: 'chip' + (i === 0 ? ' initial' : ''), style: 'margin-right:3px',
        title: i === 0 ? 'before anything has happened' : null,
      }, readable(s))),
      h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.addingState = { entity: name, at: 'manager' }; render(); },
      }, '+ state'),
      advanced() ? h('span', { class: 'tiny muted' }, ' id: ',
        h('code', {}, JSON.stringify(entity.identifierSchema || { type: 'string' }))) : null));

    main.appendChild(card);
  }

  if (state.newEntityAt === 'manager') {
    main.appendChild(inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => { state.newEntityAt = null; createEntity(ctx, v); },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'manager'; render(); },
      }, '+ New kind of thing')));
  }
}

// ---------- the entity inspector ----------

function renderInspector(ctx) {
  const host = document.getElementById('inspector-host');
  host.innerHTML = '';
  if (!state.inspect || !ctx['entity-definitions'][state.inspect]) return;

  const name = state.inspect;
  const entity = ctx['entity-definitions'][name];
  const panel = h('aside', { class: 'inspector' });

  panel.appendChild(h('button', {
    class: 'btn ghost close', onclick: () => { state.inspect = null; render(); },
  }, '×'));
  panel.appendChild(h('h3', {}, named(name)));
  panel.appendChild(h('div', { class: 'sub' }, 'everything we know about each one, and who moves it'));

  for (const property of entity.properties || []) {
    const reserved = property.name === STATE_PROPERTY;
    const usage = propertyUsage(ctx, name, property.name);
    const card = h('div', { class: 'prop' + (reserved ? ' reserved' : '') });

    card.appendChild(h('div', { class: 'top' },
      h('span', { class: 'nm' }, reserved && !advanced() ? 'what state it is in' : named(property.name)),
      h('span', { class: 'chip' }, reserved && !advanced()
        ? (entity.states || []).map(readable).join(' / ') : readable(typeLabel(property))),
      h('span', { style: 'flex:1' }),
      reserved ? null : h('button', {
        class: 'btn tiny danger', title: 'Stop tracking this',
        onclick: () => patch('entity-definition', name, (b) => {
          b.properties = b.properties.filter((p) => p.name !== property.name);
        }),
      }, '×')));

    if (advanced() && !reserved) {
      card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:3px' },
        'starts as ', h('code', {}, operandWords(property.initialValue))));
    }

    const jump = (command) => h('b', {
      onclick: () => { state.slice = command; state.view = 'slice'; state.inspect = null; render(); },
    }, readable(command));

    card.appendChild(h('div', { class: 'use' },
      usage.changedBy.length
        ? h('div', {}, 'moved by ', ...uniq(usage.changedBy.map((u) => u.command))
            .flatMap((c, i) => (i ? [', ', jump(c)] : [jump(c)])))
        : h('div', {}, 'nothing moves it'),
      usage.readBy.length
        ? h('div', {}, 'consulted by ', ...usage.readBy
            .flatMap((c, i) => (i ? [', ', jump(c)] : [jump(c)])))
        : h('div', {}, 'nothing reads it')));

    panel.appendChild(card);
  }

  if (state.addingProp && state.addingProp.at === 'inspector') {
    let pname = '', ptype = 'integer', plist = false;
    panel.appendChild(h('div', { class: 'inline-form' },
      h('div', { class: 'q' }, `What else should we know about each ${readable(name)}?`),
      h('div', { class: 'adder' },
        h('input', { type: 'text', placeholder: 'seat count', style: 'width:120px',
          oninput: (e) => { pname = e.target.value; } }),
        pick(typeOptions(ctx), ptype, (v) => { ptype = v; }),
        h('label', { class: 'tiny muted' },
          h('input', { type: 'checkbox', onchange: (e) => { plist = e.target.checked; } }), ' many'),
        h('button', {
          class: 'btn primary', onclick: () => {
            if (!pname.trim()) return toast('Give it a name.', true);
            const property = { name: toCamel(pname), propertyType: ptype, isOptional: false, isList: plist };
            property.initialValue = defaultInitialValue(ctx, property);
            property.handlers = [];
            state.addingProp = null;
            patch('entity-definition', name, (b) => b.properties.push(property));
          },
        }, 'Add'),
        h('button', { class: 'btn ghost', onclick: () => { state.addingProp = null; render(); } }, 'Cancel'))));
  } else {
    panel.appendChild(h('div', { class: 'adder', style: 'margin-top:10px' },
      h('button', {
        class: 'btn',
        onclick: () => { closeForms(); state.addingProp = { at: 'inspector' }; render(); },
      }, '+ Track something else')));
  }

  if (advanced()) {
    const box = h('div', {});
    box.appendChild(h('div', { class: 'small' }, (entity.states || []).map((s, i) =>
      h('span', { class: 'chip' + (i === 0 ? ' initial' : ''), style: 'margin-right:4px' },
        readable(s) + (i === 0 ? ' · initial' : '')))));
    if (state.addingState && state.addingState.at === 'inspector') {
      box.appendChild(inlineForm({
        question: `What else can a ${readable(name)} be?`, placeholder: 'archived', showsIdentifier: true,
        onSubmit: (v) => { state.addingState = null; patch('entity-definition', name, (b) => b.states.push(toPascal(v))); },
        onCancel: () => { state.addingState = null; render(); },
      }));
    } else {
      box.appendChild(h('div', { class: 'adder' }, h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.addingState = { entity: name, at: 'inspector' }; render(); },
      }, '+ state')));
    }
    box.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:8px' },
      'identifier — ', h('code', {}, JSON.stringify(entity.identifierSchema || { type: 'string' }))));
    panel.appendChild(h('details', { class: 'advanced', open: true },
      h('summary', {}, 'States and identity'), box));
  }

  host.appendChild(panel);
}

function stepConsistency(ctx, slice) {
  const lines = slice.dcb.items.map((item, i) => h('div', {},
    i === 0 ? '  ' : h('span', { class: 'k' }, 'or '),
    item.sequence
      ? h('span', {}, h('span', { class: 'k' }, 'types '), h('span', { class: 'y' }, item.types.join(', ')),
          h('span', { class: 'k' }, '  (global — no tag)'))
      : h('span', {}, h('span', { class: 'k' }, 'tag '), h('span', { class: 't' }, item.tag),
          h('span', { class: 'k' }, ' and '),
          h('span', { class: 'y' }, item.types.join(', ') || 'any type'),
          item.fannedOut ? h('span', { class: 'k' }, '  — one per element') : null)));
  return step('consistency', 'Which nothing else may have changed',
    h('div', { class: 'card dcb' },
      lines.length ? lines : h('div', { class: 'empty' }, 'Unguarded.'),
      h('div', { style: 'margin-top:6px' },
        h('span', { class: 'k' }, 'appends '),
        h('span', { class: 't' }, slice.dcb.writes.join(', ') || 'no tags'))),
    slice.coverage.length
      ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
          h('span', { class: 'small' }, 'Writes a tag it never read: '
            + slice.coverage.map((c) => readable(c.entity)).join(', ')))
      : null);
}

window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
