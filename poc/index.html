<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCB Playground</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="stylesheet" href="shared.css">
<style>
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - var(--topbar-h)); }
  /* Nothing loaded means no rail to show — the splash takes the whole
     row rather than sitting in a column sized for a rail that isn't
     there. */
  .layout.no-rail { grid-template-columns: 1fr; }
  .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 0; }
  .rail-backdrop { display: none; }
  /* Below the breakpoint the rail stops being a grid column and
     becomes a drawer over the content instead — .layout falls back to
     one column so .main never sits in a column sized for a rail that
     is no longer there. Opening it is the menu button in the bar
     (`.menu-btn`); a backdrop and picking an actual link both close it
     — see `renderRail` and the delegated click listener on #rail. */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .rail {
      position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 25;
      width: 82vw; max-width: 300px; overflow-y: auto;
      box-shadow: 2px 0 20px rgba(15, 23, 42, .2);
      transform: translateX(-100%); transition: transform .18s ease;
    }
    .rail.open { transform: translateX(0); }
    .rail-backdrop.open {
      display: block; position: fixed; inset: var(--topbar-h) 0 0 0;
      background: rgba(15, 23, 42, .35); z-index: 24;
    }
  }
  .rail h4 { padding: 0 16px 8px; }
  .rail a {
    display: block; padding: 6px 16px; font-size: 13px;
    color: var(--text); text-decoration: none; border-left: 3px solid transparent;
  }
  .rail a:hover { background: var(--command-soft); }
  .rail a.on { border-left-color: var(--command); background: var(--command-soft); font-weight: 600; }
  .rail .add { padding: 10px 16px 0; display: flex; gap: 6px; }
  .rail .loose { display: flex; align-items: center; gap: 6px; padding: 2px 16px; }
  .group .rm { display: inline-flex; }
  .group .rm .btn { visibility: hidden; padding: 0 5px; }
  .group:hover .rm .btn, .group .rm.on .btn, .group .rm .btn:focus { visibility: visible; }

  /* Two levels: a feature, and the commands that make it up. */
  .group {
    display: flex; align-items: baseline; gap: 6px;
    padding: 9px 16px 3px; font-size: 12px; font-weight: 600;
  }
  .group .caret { cursor: pointer; color: var(--muted); font-size: 10px; width: 10px; }
  .group .gname { cursor: pointer; flex: 1; }
  .group .gname:hover { color: var(--command); }
  .group .gcount {
    font-weight: 400; font-size: 10px; color: var(--muted);
    background: var(--bg); border-radius: 999px; padding: 0 6px;
  }
  .rail a.cmd { padding-left: 32px; }
  /* The count used to sit hard against the label — "Sandbox14" — because
     an <a> lays its children out as text, not as a row. This one alone
     needs a row: the label on the left, the count held to the right. */
  .rail a.sandbox { display: flex; align-items: center; gap: 8px; }
  .rail a.sandbox .grow { flex: 1; }
  /* A thing in the rail is in the colour things are in everywhere else,
     so the rail says which of the two lists you are in without a
     heading having to. */
  .rail a.ent:hover { background: var(--entity-soft); }
  .rail a.ent.on { border-left-color: var(--entity); background: var(--entity-soft); }
  .gempty { padding: 2px 16px 4px 32px; font-size: 11px; color: var(--muted); font-style: italic; }

  /* The stored identifier, for anyone who wants to see it. */
  .tech {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-left: 6px; font-weight: 400;
  }

  /* Inline forms, everywhere a name is needed — never a browser dialog. */
  .inline-form {
    border: 1px dashed var(--command); border-radius: 6px;
    padding: 8px 10px; margin: 6px 0; background: var(--command-soft);
  }
  .inline-form .q { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  /* Choosing a mark is not naming something — it belongs to the thing
     it is on, so it is dressed in that thing's colour. */
  .inline-form.icons { border-color: var(--entity); background: var(--entity-soft); }
  .inline-form.icons.event { border-color: var(--event); background: var(--event-soft); }
  .inline-form .adder { margin-top: 0; }
  .rail .inline-form { margin: 6px 16px; }
  .becomes { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .feature-of { display: flex; align-items: center; gap: 7px; margin-top: 9px; }

  .blank { max-width: 470px; padding: 40px 0; }
  .blank h2 { margin-bottom: 6px; }
  .blank p { margin-bottom: 14px; }

  /* A definition as a card, with its members listed under it: value
     types and projections are shown this way. */
  .ecard {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 12px 14px; margin-bottom: 12px;
  }
  .ehead { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .erows { border-top: 1px dashed var(--border); }
  .erow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px;
  }
  .erow .nm { min-width: 165px; }
  /* Removing a part of a definition, from inside the chip that shows it. */
  .chip .x {
    border: 0; background: transparent; font: inherit; font-size: 11px;
    padding: 0 0 0 5px; margin: 0; color: inherit; opacity: .5; cursor: pointer;
  }
  .chip .x:hover { opacity: 1; color: var(--danger); }

  .slice { padding: 22px 30px 70px; max-width: 800px; }
  /* Pinned while its steps scroll by, so which command you are inside
     is the one thing the page never loses. */
  .slice > header {
    position: sticky; top: var(--topbar-h); z-index: 10;
    background: var(--bg); margin: 0 -30px 22px; padding: 8px 30px;
  }
  .slice > header .name { font-size: 20px; font-weight: 600; }

  /* Each step of the slice, in the order you meet it. */
  .step { position: relative; padding: 0 0 4px 26px; margin-bottom: 22px; }
  .step::before {
    content: ""; position: absolute; left: 7px; top: 20px; bottom: -22px;
    width: 2px; background: var(--border);
  }
  .step:last-of-type::before { display: none; }
  .step > .dot {
    position: absolute; left: 0; top: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 3px solid var(--surface); background: var(--border-strong);
  }
  .step.trigger > .dot { background: var(--command); }
  .step.reads > .dot, .step.changes > .dot, .step.now > .dot { background: var(--entity); }
  .step.rules > .dot { background: var(--rule); }
  .card.rule { border-left: 3px solid var(--rule); }
  .step.emits > .dot { background: var(--event); }
  .step > .shead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }

  /* ---------- quiet rows ----------
     A row shows the thing itself. The machinery around it — the type,
     the stored identifier, the button that removes it — waits inside a
     .reveal until the row is clicked. */
  .qrow > .reveal { display: none; align-items: center; gap: 8px; }
  .qrow.open > .reveal { display: inline-flex; }
  .qrow:focus { outline: 1px solid var(--command); outline-offset: 1px; }
  .qrow { cursor: pointer; }
  .qrow:hover, .qrow.open { background: var(--command-soft); }
  /* The collapsed adder: one quiet button where a row of empty controls
     used to sit. */
  .adder .btn.ghost { color: var(--muted); }
  .adder .btn.ghost:hover { color: var(--command); }

  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 10px 13px; margin-bottom: 7px;
  }
  .card.event { border-left: 3px solid var(--event); }
  .card.entity { border-left: 3px solid var(--entity); }
  /* What the command itself is: its input, in its own colour, like
     everything else on the page. */
  .card.command { border-left: 3px solid var(--command); }
  .card.projection { border-left: 3px solid var(--projection); }
  /* Code. Set apart from everything around it on purpose: this is the
     one part of a model the tooling neither checks nor understands, and
     it should not look like the parts it does. */
  .script {
    margin: 4px 0 10px 14px; padding: 8px 10px;
    border-left: 2px dashed var(--border-strong); display: grid; gap: 6px;
  }
  .script-handler { display: grid; gap: 3px; }
  .script-handler .tiny { display: flex; align-items: center; gap: 6px; }
  .script textarea, .script-handler textarea {
    width: 100%; box-sizing: border-box; resize: vertical;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 11px; line-height: 1.5; padding: 7px 9px;
  }
  .script textarea:focus, .script-handler textarea:focus {
    outline: none; border-color: var(--command);
  }
  /* Envelope metadata: on the page so "every event carries this" is
     visible where events are, and unmistakably not authored. */
  .field.envelope { opacity: .6; }
  /* Rounds. The header carries the cost — how many times this command
     goes to the log — and the note under a card carries the reason it
     could not go earlier. Neither is authored: both are read off the
     operands already written. */
  .round-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
  .round-head:first-child { margin-top: 0; }
  .round-head .rule { flex: 0 0 18px; height: 1px; background: var(--border); }
  .round-head .label { font-size: 10px; text-transform: uppercase;
                       letter-spacing: 0.06em; color: var(--muted); }
  .waits { font-size: 11px; color: var(--muted); padding: 2px 0 0 12px; }
  .waits .op { font-family: var(--mono); font-size: 10px; }
  /* A member opened for editing: the row it replaces, expanded. */
  .member-editor { padding: 4px 0 4px 8px; border-left: 2px solid var(--command);
                   margin: 2px 0; background: var(--surface); }
  .member-editor .adder { flex-wrap: wrap; }
  .chip.editable { cursor: pointer; }
  .chip.editable:hover { border-color: var(--command); color: var(--command); }
  /* A field offered rather than authored — dashed, like the adders it
     sits beside, so it reads as "not here yet" rather than as one more
     fact about the event. */
  .chip.suggest {
    font: inherit; font-size: 11px; cursor: pointer; color: var(--muted);
    border-style: dashed; background: transparent;
  }
  .chip.suggest:hover { border-color: var(--command); color: var(--command); background: var(--command-soft); }
  .copy-missing { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 6px; }
  .row .grow { flex: 1; }
  .sentence { font-size: 13px; }
  .sentence .op { font-family: var(--mono); font-size: 12px; background: var(--type-soft);
                  border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .sentence .verb { color: var(--muted); }
  /* A reference, and the row it refers to. */
  .op.ref { cursor: pointer; }
  .op.ref:hover, .op.ref:focus, .op.ref.pinned {
    border-color: var(--command); color: var(--command); outline: none;
  }
  .lit { box-shadow: 0 0 0 2px var(--command); border-radius: 5px; }
  .fields { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
  .field .nm { min-width: 170px; }
  .adder { display: flex; gap: 9px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .dcb { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; }
  .dcb .k { color: var(--muted); }
  .dcb .t { color: var(--entity); }
  .dcb .y { color: var(--event); }

  /* An entity chip is a way in: click it anywhere and the thing itself
     slides in beside what you were reading, rather than replacing it. */
  .chip.entity, .op.ent { cursor: pointer; }
  .chip.entity:hover, .op.ent:hover { outline: 1px solid var(--entity); }

  /* A chip that is a way to something else, wherever a definition
     turns up as a cross-reference rather than as itself. Its own kind
     already colours it (chip.command, chip.event, chip.projection); this
     only adds the affordance, in the same colour. */
  .chip.linkable { cursor: pointer; }
  .chip.linkable:hover { outline: 1px solid currentColor; }

  /* ---------- one thing, on its own page ----------
     A property row, wherever it is shown: the name and what it holds on
     the first line, who moves it and who reads it on the second. The
     two questions are different questions, so they do not share a line
     and fight for the space. */
  .prop {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); padding: 8px 11px; margin-bottom: 7px;
  }
  .prop .top { display: flex; align-items: baseline; gap: 7px; }
  .prop .top .grow { flex: 1; }
  .prop .nm { font-size: 12.5px; font-weight: 600; }
  .prop .use { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .prop .use b { font-weight: 600; color: var(--text); cursor: pointer; }
  .prop .use b:hover { color: var(--command); }
  .prop.dead { opacity: .6; }
  .prop.dead .nm::after { content: " · unused"; color: var(--danger); font-size: 10px; font-weight: 400; }

  /* Identity. Set apart from the properties below it because it is a
     different kind of statement: what makes one of these one of these,
     rather than something we happen to know about it. Nobody added the
     identifier — it comes with the thing — and a page that lists it
     alongside "capacity" says otherwise. */
  .ident {
    border: 1px solid var(--entity); border-left-width: 3px;
    border-radius: var(--radius); background: var(--entity-soft);
    padding: 11px 14px 12px; margin-bottom: 22px;
  }
  .ident > h4 { color: var(--entity); }
  .ident .why { margin: 3px 0 10px; }
  .ident .irow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    padding: 5px 0; font-size: 12px;
  }
  .ident .irow + .irow { border-top: 1px dashed var(--border); }
  .ident .irow > .nm { min-width: 110px; color: var(--muted); font-size: 11px; }
  .ident .prop { margin: 8px 0 0; }
  .esection { margin-bottom: 18px; }
  .esection > h4 { margin-bottom: 8px; }

  /* The mark that stands for a thing, wherever the thing is named. */
  .ic { font-style: normal; margin-right: 5px; }
  .chip .ic { margin-right: 4px; }
  .icon-btn {
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    width: 34px; height: 34px; flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
  }
  .icon-btn:hover { border-color: var(--entity); }
  .icon-btn.event:hover { border-color: var(--event); }
  .icons .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
    gap: 4px; margin-bottom: 8px; max-width: 460px;
  }
  .ic-opt {
    font: inherit; font-size: 17px; line-height: 1; cursor: pointer;
    height: 30px; padding: 0; border-radius: 6px;
    border: 1px solid transparent; background: var(--surface);
  }
  .ic-opt:hover { border-color: var(--entity); }
  .ic-opt.on { border-color: var(--entity); background: var(--entity-soft); }
  .icons.event .ic-opt:hover { border-color: var(--event); }
  .icons.event .ic-opt.on { border-color: var(--event); background: var(--event-soft); }

  /* ---------- settings ----------
     Everything that decides how the interface behaves rather than what
     the model says. It lives in one place so the bar at the top can go
     back to being about the model, and so the next such choice has an
     obvious home. The backdrop is thin on purpose: these settings
     change the page behind it, and you should see them land. */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(15, 23, 42, .22);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 64px 16px 24px;
  }
  .modal {
    width: 540px; max-width: 100%; max-height: calc(100vh - 100px); overflow: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 18px 50px rgba(15, 23, 42, .28);
    padding: 16px 20px 18px;
  }
  .modal > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .modal > header .grow { flex: 1; }
  .setting { margin-top: 18px; }
  .setting > h4 { margin-bottom: 3px; }
  .setting .why { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); padding: 8px 11px; margin-bottom: 6px;
  }
  .opt:hover { border-color: var(--command); }
  .opt.on { border-color: var(--command); background: var(--command-soft); }
  .opt .mark {
    flex: none; width: 13px; height: 13px; margin-top: 3px;
    border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface);
  }
  .opt.on .mark { border: 4px solid var(--command); }
  .opt .label { font-size: 13px; font-weight: 600; }
  .opt .desc { font-size: 11.5px; color: var(--muted); }

  /* ---------- import & export ----------
     One dialog for both directions a model crosses this browser's
     boundary: pulling one in, from a URL or pasted JSON, and sending
     this one out the same two ways. Tabs rather than a picker, since
     unlike Settings there is a natural default per tab (a URL, JSON) an
     answer usually only needs one of. */
  .ie-tabs { display: flex; margin: 14px 0 16px; border-bottom: 1px solid var(--border); }
  .ie-tab {
    font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 4px; margin-right: 22px;
    border: 0; background: none; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .ie-tab:hover { color: var(--text); }
  .ie-tab.on { color: var(--command); border-bottom-color: var(--command); }

  .ie-subtoggle {
    display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px;
    overflow: hidden; margin-bottom: 14px;
  }
  .ie-pill {
    font: inherit; font-size: 12.5px; padding: 6px 13px; border: 0;
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .ie-pill + .ie-pill { border-left: 1px solid var(--border-strong); }
  .ie-pill.on { background: var(--command-soft); color: var(--command); font-weight: 600; }
  .ie-pill:hover:not(.on) { color: var(--text); }

  .ie-check-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--muted); }
  .ie-check-label { font-weight: 600; }
  .ie-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); }
  .ie-check input { margin: 0; }

  .ie-field label {
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700; margin-bottom: 5px;
  }
  .ie-field input[type=text], .ie-field textarea {
    width: 100%; font: inherit; font-size: 13px; padding: 9px 11px;
    border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--surface); color: var(--text); resize: vertical;
  }
  .ie-field input:focus, .ie-field textarea:focus { outline: none; border-color: var(--command); }
  .ie-field textarea.mono, .ie-field input.mono { font-family: var(--mono); font-size: 11.5px; }
  .ie-field textarea[readonly], .ie-field input[readonly] { background: #fbfcfe; color: var(--muted); }
  body.f-dark .ie-field textarea[readonly], body.f-dark .ie-field input[readonly] { background: #101827; }
  .ie-field .why { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
  .ie-actions { display: flex; justify-content: flex-end; margin-top: 12px; }

  /* ---------- quick open ----------
     Everything in the model, by name, from anywhere. It sits higher and
     tighter than the settings modal because it is passed through rather
     than read. */
  .palette {
    width: 520px; max-width: 100%; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 22px 60px rgba(15, 23, 42, .34); overflow: hidden;
  }
  .palette input {
    width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0;
    padding: 13px 15px; font-size: 15px; background: transparent;
  }
  .palette input:focus { outline: none; }
  .palette .hits { max-height: 340px; overflow: auto; padding: 5px; }
  .palette .hit {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .palette .hit.on { background: var(--command-soft); }
  .palette .hit .what {
    flex: none; font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); width: 74px;
  }
  .palette .hit .where { margin-left: auto; font-size: 11px; color: var(--muted); }
  .palette .none { padding: 16px; font-size: 12px; color: var(--muted); font-style: italic; }
  .palette footer {
    border-top: 1px solid var(--border); padding: 6px 12px;
    font-size: 10.5px; color: var(--muted); display: flex; gap: 12px;
  }

  /* ---------- loose ends ---------- */
  .issue {
    display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
    font: inherit; font-size: 12.5px; color: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); padding: 8px 11px; margin-bottom: 6px;
  }
  .issue:hover { border-color: var(--command); }
  .issue .why { font-size: 11px; color: var(--muted); }
  .badge {
    font-size: 10px; border-radius: 999px; padding: 0 6px; margin-left: 5px;
    background: var(--danger); color: #fff;
  }
  .badge.clear { background: var(--entity); }

  /* ---------- first-run splash ----------
     The full page shown in #main while nothing is loaded — see
     `renderSplash`. Its own max-width and centering, independent of
     `.slice`, since this is a landing page rather than a model view. */
  .splash { max-width: 860px; margin: 0 auto; padding: 56px 24px 80px; }

  .splash-hero { text-align: center; margin-bottom: 32px; }
  .splash-mark { width: 56px; height: 56px; display: block; margin: 0 auto 16px; }
  .splash-hero h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  .splash-tagline { color: var(--muted); font-size: 15px; margin: 0; }

  .splash-intro { max-width: 600px; margin: 0 auto 30px; text-align: center; font-size: 15px; line-height: 1.65; }

  .splash-cta { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 6px; }
  .splash-cta .btn.primary { font-size: 15px; padding: 13px 30px; }
  .splash-hint { font-size: 12.5px; color: var(--muted); }
  .splash .inline-form { max-width: 380px; margin: 0 auto 6px; }

  .splash-import-link { margin-top: 18px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .splash-import-link a { font-weight: 600; }

  .splash-section { margin-top: 52px; }
  .splash-section h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 16px; text-align: center; font-weight: 700;
  }

  .splash-examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .splash-examples { grid-template-columns: 1fr; } }
  .splash-example {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 14px 16px; cursor: pointer;
  }
  .splash-example:hover { border-color: var(--command); }
  .splash-example .name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .splash-example .desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .splash-video {
    border: 1px dashed var(--border-strong); border-radius: var(--radius);
    background: var(--surface); aspect-ratio: 16 / 6.2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted);
  }
  .splash-video .play {
    width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
  }
  .splash-video .caption { font-size: 12.5px; }

  .splash-faq { border-top: 1px solid var(--border); }
  .splash-faq-item { border-bottom: 1px solid var(--border); }
  .splash-faq-q {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    font: inherit; font-size: 14px; font-weight: 600; background: none; border: 0;
    padding: 14px 2px; cursor: pointer; color: var(--text);
  }
  .splash-faq-q:hover { color: var(--command); }
  .splash-faq-q .chev { flex: none; color: var(--muted); transition: transform .15s; display: flex; }
  .splash-faq-a { padding: 0 2px 16px; font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 620px; }

  .splash-footer { margin-top: 56px; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------- the command, kept in view ----------
     Once the header has scrolled under its own sticky position, the
     parts of it that are not the answer to "which one" stand down. */
  body.scrolled .slice > header {
    border-bottom: 1px solid var(--border); box-shadow: 0 6px 14px -12px rgba(15,23,42,.5);
  }
  body.scrolled .slice > header .summary,
  body.scrolled .slice > header .feature-of { display: none; }

  /* A row the interface just moved you to. Long enough to find it,
     short enough not to become part of the page. */
  @keyframes landed {
    from { background: var(--command-soft); }
    to { background: transparent; }
  }
  .landed { animation: landed 1.1s ease-out; }

  /* ---------- scenarios ----------
     A scenario reads as a sentence in three parts, so its detail is
     three labelled blocks rather than a form. The status carries the
     colour: agreement is quiet, a difference is not. */
  .tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 12px; margin-bottom: -1px; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--command); border-bottom-color: var(--command); }

  .scenarios { display: flex; flex-direction: column; gap: 7px; }
  .scenario {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); padding: 7px 11px;
  }
  .scenario.open { border-color: var(--border-strong); }
  .scenario-row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .sc-name {
    background: none; border: none; font: inherit; color: inherit;
    cursor: pointer; text-align: left; padding: 0;
  }
  .sc-name:hover { color: var(--command); }
  .sc-mark {
    width: 18px; height: 18px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border: 1px solid;
  }
  .sc-mark.s-current { color: var(--entity); border-color: var(--entity); background: var(--entity-soft); }
  .sc-mark.s-drifted { color: var(--event); border-color: var(--event); background: var(--event-soft); }
  .sc-mark.s-broken { color: var(--danger); border-color: var(--danger); background: var(--surface); }
  .sc-mark.s-held { color: var(--muted); border-color: var(--border-strong); background: var(--surface); }

  .sc-body { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border); }
  .sc-line { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }
  .sc-line .y { color: var(--event); }
  .sc-line .c { color: var(--command); }
  .sc-line .k { color: var(--muted); }
  .sc-body .card { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; margin-top: 4px; }
  .sc-body .card .k { color: var(--muted); }
  .sc-body .card .t { color: var(--entity); }
  .sc-body .card .y { color: var(--event); }

  /* Two outcomes side by side, because the question is which of them
     you meant — not which of them is correct. */
  .drift { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .drift .adder { grid-column: 1 / -1; }
  @media (max-width: 720px) { .drift { grid-template-columns: 1fr; } }

  .sc-editor { margin-top: 9px; }
  .sc-step { margin-top: 6px; }
  .vpayload, .vgroup { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: flex-start; }
  .vfield { display: flex; flex-direction: column; gap: 2px; }
  .vlabel { font-size: 11px; color: var(--muted); }
  .vwrap { display: inline-flex; }
  .vin {
    font: inherit; font-size: 12px; padding: 3px 7px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--text); min-width: 110px;
  }
  .vin:focus { outline: none; border-color: var(--command); }
  .vin.tiny-in { min-width: 70px; width: 70px; }
  .vlist { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .vrow { display: flex; gap: 5px; align-items: flex-start; }
  .vgroup {
    border: 1px dashed var(--border); border-radius: 5px; padding: 5px 8px;
  }

  /* ---------- sandbox ----------
     A run of events, read as the icons they carry rather than the
     count of them — a session is scanned as a shape before it is read
     as a number, and any position in it is reached by pointing at the
     icon that was there. */
  .timeline { display: flex; flex-direction: column; gap: 7px; }
  .trow { display: flex; align-items: center; gap: 9px; }
  .escrub {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
    padding: 5px 3px; margin: 0 -3px; border-radius: 8px;
    cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .escrub:active { cursor: grabbing; }
  .escrub:focus-visible { outline: 2px solid var(--command); outline-offset: 2px; }
  .estep {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
    transition: opacity .12s ease, border-color .12s ease, background .12s ease;
  }
  /* Icons from the same command sit close together; the next command's
     get a little more air, so the run reads in decisions, not just in
     events. */
  .estep.step-end { margin-right: 7px; }
  .estep:hover { border-color: var(--event); }
  .estep.played { border-color: var(--event-soft); background: var(--event-soft); color: var(--text); }
  .estep.current {
    border-color: var(--event); background: var(--event-soft); color: var(--text);
    box-shadow: 0 0 0 2px var(--event-soft);
  }
  /* Still on the timeline — scrubbing back does not shorten the run,
     it only looks away from the rest of it. */
  .estep.upcoming { opacity: .38; }
  .eplayhead { flex: none; width: 2px; align-self: stretch; min-height: 26px; background: var(--command); border-radius: 2px; }

  .pin {
    background: none; border: none; cursor: pointer; padding: 0 5px 0 0;
    color: var(--muted); font-size: 12px;
  }
  .pin:hover { color: var(--event); }
  .pin.on { color: var(--event); }

  /* A picker whose options start with an icon (an entity, a type)
     builds its <option> text label-first so arrow-key type-ahead
     matches the name a person actually types — native <option> has no
     way to search on anything else. Where the browser supports
     customizable <select> (`::picker(select)`, `<selectedcontent>`),
     this puts the icon back in front visually without touching that
     word order; everywhere else it just falls back to "Name 🔖", which
     is still readable and still keyboard-searchable. */
  @supports (appearance: base-select) {
    select.icon-select { appearance: base-select; }
    select.icon-select option { display: flex; align-items: center; gap: 4px; }
    select.icon-select option .icon,
    select.icon-select selectedcontent .icon { order: -1; }
    select.icon-select selectedcontent { display: flex; align-items: center; gap: 4px; }
  }

  /* The two overview pages read across every command at once rather
     than down one of them, so they earn more width than an ordinary
     slice — capped, not unbounded, so a model with many events still
     scrolls its matrix instead of running the page edge to edge. */
  .slice.wide { max-width: 1100px; }

  /* ---------- coupling ---------- */
  .coupling-legend { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
  .coupling-legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .coupling-mark { display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; }
  .coupling-mark.produces { background: var(--command); }
  .coupling-mark.consumes { border: 2px solid var(--event); }
  .coupling-mark.both { background: var(--command); border: 2px solid var(--event); }
  .coupling-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .coupling-grid {
    display: grid; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
  }
  .coupling-corner { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  /* Read normally — left to right, upright — rather than rotated:
     sideways text reads slower at any length, and rotating it only
     traded a wide header for a very tall one. Wrapping across a few
     lines instead costs far less height for a typical name, and the
     row still sizes itself to the longest one — nothing here needs
     to estimate a pixel height in JS to avoid clipping. A name long
     enough to still run past a handful of lines is clamped with an
     ellipsis; the full name is always one hover away. */
  .coupling-colhead {
    position: relative; border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border); background: var(--bg); cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 10px 6px; text-align: center;
  }
  .coupling-colhead:hover { background: var(--event-soft); }
  .coupling-colhead.cluster-start { border-left: 2px solid var(--border-strong); }
  .coupling-colhead span {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
    overflow: hidden; font-family: var(--mono); font-size: 11px; line-height: 1.4;
    color: var(--text);
  }
  .coupling-grouprow {
    grid-column: 1 / -1; padding: 5px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .coupling-rowlabel {
    display: flex; align-items: center; padding: 0 12px; font-size: 12px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface); min-height: 40px; cursor: pointer;
  }
  .coupling-rowlabel:hover { color: var(--command); background: var(--command-soft); }
  .coupling-cell {
    position: relative; display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    min-height: 40px;
  }
  .coupling-cell.cluster-start { border-left: 2px solid var(--border-strong); }

  /* ---------- rule map ---------- */
  .rulemap-feature { margin: 22px 0 10px; font-size: 13px; color: var(--muted); }
  .rulemap-feature:first-child { margin-top: 0; }
  .rulemap-row { display: flex; align-items: flex-start; gap: 12px; }
  .rulemap-cmd { flex: 0 0 190px; padding-top: 2px; }
  .rulemap-arrow { flex: 0 0 16px; color: var(--muted); padding-top: 6px; text-align: center; }
  .rulemap-rules { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .rulemap-events { flex: 0 0 180px; display: flex; flex-direction: column; gap: 6px; }
  .rulemap-rule {
    border-left: 3px solid var(--rule); background: var(--rule-soft);
    border-radius: 0 6px 6px 0; padding: 6px 10px; font-size: 12px; line-height: 1.5;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="disclaimer">Experimental — everything here is subject to change.</div>
  <div class="app-bar">
    <span id="menu-toggle"></span>
    <button type="button" class="brand-link" title="Home — examples, FAQ, and starting a new model"
            onclick="closeForms(); state.splash = true; render();">
      <img class="brand-mark" src="logo-mark.png" alt="" aria-hidden="true">
      <h1>DCB Playground</h1>
    </button>
    <span id="model-switch"></span>
    <span id="tools"></span>
    <span class="spacer"></span>
    <span id="jump"></span>
    <span id="actions"></span>
  </div>
</div>

<div class="layout">
  <div class="rail-backdrop" id="rail-backdrop" onclick="state.railOpen = false; render();"></div>
  <aside class="rail" id="rail"></aside>
  <main class="slice" id="main"></main>
</div>
<div id="modal-host"></div>
<div id="palette-host"></div>

<script src="model.js"></script>
<script src="evaluate.js"></script>
<script src="shared.js"></script>
<script>
// ============================================================
// A · Slices
//
// Two levels. A *feature* ("Course management") is a heading over the
// *commands* that make it up; a command is the unit of work, and
// everything it touches lives on one page — the events it records and
// the state those events change included.
//
// Three rules this interface holds to:
//   - names are written the way you would say them ("define course"),
//     and the PascalCase the schema wants is derived, not typed;
//   - a new command is described in the page, not in a dialog — there
//     are no browser prompts anywhere in here;
//   - the machinery (identifier schemas, custom types, projections, the
//     derived boundary, the entity manager) only appears in Advanced.
// ============================================================

const state = {
  view: 'slice',            // 'slice' | 'entity' | 'types' | 'projections' | 'events'
  slice: null,
  sel: null,                // the row being attended to
  adder: null,              // which "add another" is unfolded
  projDraft: null,          // { name, body } — a projection being edited
  newProjection: null,      // a projection being described
  renamingProjection: null,
  newEvent: null,           // { name } — a bare event being described
  renamingEvent: null,
  renamingCommand: null,
  editMember: null,         // { where, name } — the member being edited
  editRule: null,           // index of the condition being edited
  editBinding: null,        // alias of the boundary binding being edited
  bindingDraft: null,       // in-progress edits to that binding
  ruleDraft: null,          // in-progress edits to a condition
  changeDraft: null,        // in-progress "what this event changes" row
  readDraft: null,          // in-progress "read something" row
  openEvent: null,
  collapsed: {},            // feature name -> collapsed in the rail
  entitiesCollapsed: false, // the entity list in the rail
  entity: null,             // the thing whose own page is open
  namingCommand: false,     // inline form open, naming a brand-new command
  newFeature: false,        // inline form open in the rail
  renamingFeature: null,
  newEntityAt: null,        // 'reads' | 'changes:<Event>' | 'rail'
  addingProp: null,         // { eventName } | { at }
  addingMember: null,       // { type, eventName? } — adding a member to an enum custom type
  renamingEntity: null,
  iconPicker: null,         // the entity whose mark is being chosen
  eventIconPicker: null,    // the event whose mark is being chosen
  commandIconPicker: null,  // the command whose mark is being chosen
  confirmRemove: null,
  splash: false,            // showing the splash on top of a model that's still loaded — see `paintPage`
  models: false,            // the Models modal, opened on request — switch, load, or manage
  newContext: false,        // naming form for a brand-new context — on the splash or in the modal
  loadingUrl: false,        // within the Models modal: form open, asking for a URL to load
  loadingJson: false,       // within the Models modal: form open, asking for pasted JSON
  splashFaqOpen: { 0: true }, // which FAQ entries are expanded, on the first-run splash
  pendingImport: null,      // a decoded share envelope waiting on the scripted-code confirm
  settings: false,          // the settings modal
  problems: false,          // the loose-ends-and-drifted-scenarios panel
  railOpen: false,          // the rail, as an off-canvas drawer on a narrow screen
  importExport: false,      // the Import & Export modal
  ieTab: 'import',          // within it: 'import' | 'export'
  ieImportMode: 'url',      // within Import: 'url' | 'json'
  ieExportMode: 'json',     // within Export: 'json' | 'link'
  ieIncludeScenarios: true, // within Export: leave scenarios out of what is sent
  ieIncludeSandbox: true,   // within Export: leave the recorded sandbox steps out
  ieLink: null,             // within Export: the computed share link, once it resolves
  ieCopiedJson: false,      // brief "Copied ✓" state on the Copy JSON button
  ieCopiedLink: false,      // brief "Copied ✓" state on the Copy link button
  palette: false,           // quick open is up
  lit: null,                // a reference pinned to its source
  land: null,               // a row to bring on screen after the repaint
  tab: 'definition',        // 'definition' | 'scenarios' on a command page
  openScenario: null,       // the scenario whose detail is unfolded
  scenarioDraft: null,      // { key, body } — a scenario being written
  renamingScenario: null,   // the scenario whose name is being overwritten
  sandboxDraft: null,       // { command, arguments } — a command about to be driven
  entityTab: 'definition',  // 'definition' | 'property-scenarios' on an entity page
  editHandler: null,        // { entity, property, event } — the handler row open for editing
  entityHandlerDraft: null, // in-progress edits to that handler, from the entity page
  entityPropertyDraft: null, // in-progress "+ property" row on the entity page
  openPropertyScenario: null,  // the property scenario whose detail is unfolded
  propertyScenarioDraft: null, // { key, body } — a property scenario being written
  renamingPropertyScenario: null, // the property scenario whose name is being overwritten
};

// A decoded share envelope, on its way in — from the URL fragment on
// page load, or from any of the Models modal's ways to load one.
// Scripted content is the one thing worth pausing for: everything else
// an untrusted import might get wrong is caught by the same validating
// commands manual editing goes through.
function beginImport(envelope) {
  if (envelopeHasScript(envelope)) { state.pendingImport = envelope; render(); return; }
  finishImport(envelope);
}

function finishImport(envelope) {
  run(() => {
    const ctxId = importContextFromEnvelope(envelope);
    localStorage.setItem(CONTEXT_KEY, ctxId);
    state.slice = null; state.view = 'slice';
    // A model is now loaded, so whatever asked the Models modal or the
    // splash to open — a menu click, the brand mark, or nothing having
    // been loaded yet — is answered.
    state.models = false;
    state.splash = false;
    const steps = (envelope.sandbox && envelope.sandbox.steps) || [];
    if (steps.length) {
      sessionReset();
      const ctx = projectState()[ctxId];
      for (const step of steps) sessionRun(ctx, step.command, step.args);
    }
  });
}

// ---------- which model is open ----------
//
// Every model this browser knows about, and the three ways to get
// another one: a URL someone else hosts, JSON pasted directly, or one
// of the examples this page ships — loaded the same way as any other
// shared model, over a relative fetch, so there is only one import path
// to trust rather than two. Shown on request, from the bar's model
// button or from the first-run splash below — see `renderSplash` for
// the page shown instead of this, unrequested, while nothing is loaded.

function jsonLoadForm(onSubmit, onCancel) {
  let text = '';
  const textarea = h('textarea', {
    placeholder: 'Paste a shared model’s JSON here…',
    style: 'width:100%; min-height:140px; font-family:var(--mono); font-size:11px;',
    oninput: (e) => { text = e.target.value; },
    onkeydown: (e) => { if (e.key === 'Escape') { e.preventDefault(); onCancel(); } },
  });
  setTimeout(() => textarea.focus(), 0);
  return h('div', { class: 'inline-form' },
    h('div', { class: 'q' }, 'Paste the model’s JSON'),
    textarea,
    h('div', { class: 'adder', style: 'margin-top:8px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          let envelope;
          try { envelope = JSON.parse(text); } catch { return toast('That is not valid JSON.', true); }
          onSubmit(envelope);
        },
      }, 'Load'),
      h('button', { class: 'btn ghost', onclick: onCancel }, 'Cancel')));
}

function modelsModal() {
  const activeId = activeContextId();
  const saved = Object.values(projectState()).sort((a, b) => a.name.localeCompare(b.name));
  const close = () => {
    state.models = false;
    state.newContext = false; state.loadingUrl = false; state.loadingJson = false;
    render();
  };

  const startNew = state.newContext
    ? inlineForm({
        question: 'What is this model called?', placeholder: 'Course subscriptions',
        onSubmit: (v) => {
          state.newContext = false; state.splash = false; createNamedContext(v); close();
        },
        onCancel: () => { state.newContext = false; render(); },
      })
    : state.loadingUrl
      ? inlineForm({
          question: 'Where is the model hosted?', placeholder: 'https://…', submitLabel: 'Load',
          onSubmit: (v) => {
            state.loadingUrl = false;
            runAsync(async () => beginImport(await loadContextFromUrl(v)));
          },
          onCancel: () => { state.loadingUrl = false; render(); },
        })
      : state.loadingJson
        ? jsonLoadForm(
            (envelope) => { state.loadingJson = false; beginImport(envelope); },
            () => { state.loadingJson = false; render(); })
        : h('div', { class: 'adder' },
            h('button', { class: 'btn', onclick: () => { state.newContext = true; render(); } },
              '+ New empty model'),
            h('button', { class: 'btn', onclick: () => { state.loadingUrl = true; render(); } },
              'From a URL…'),
            h('button', { class: 'btn', onclick: () => { state.loadingJson = true; render(); } },
              'From JSON…'));

// ---------- import & export modal ----------
//
// `buildShareEnvelope` (model.js) always carries everything — property
// scenarios and the recorded sandbox steps included, since ⌘S and the
// generated examples both want full fidelity. The modal offers to leave
// either out, so a model can be sent without the walkthrough that
// exercises it or the steps someone happened to be mid-sandbox on; that
// trimming is a UI concern, not something the shared builder needs to
// know about.
function exportEnvelope(ctx, { includeScenarios, includeSandbox }) {
  const steps = includeSandbox ? session.steps.map(({ command, args }) => ({ command, args })) : [];
  const envelope = buildShareEnvelope(ctx, steps);
  if (!includeScenarios) {
    envelope.context.scenarioDefinitions = [];
    delete envelope.propertyScenarioDefinitions;
  }
  return envelope;
}

// The same wrapping `buildShareLink` does, but around a caller-built
// envelope instead of a freshly-built full one.
async function computeExportLink(envelope) {
  const encoded = await gzipToBase64Url(JSON.stringify(envelope));
  return location.origin + location.pathname + '#context=' + encoded;
}

function refreshExportLink() {
  const ctx = activeContext();
  runAsync(async () => {
    const envelope = exportEnvelope(ctx, {
      includeScenarios: state.ieIncludeScenarios, includeSandbox: state.ieIncludeSandbox,
    });
    const link = await computeExportLink(envelope);
    history.replaceState(null, '', link);
    state.ieLink = link;
  });
}

function openImportExport() {

function renderModals() {
  const host = document.getElementById('modal-host');
  host.innerHTML = '';
  // One host, one overlay: every panel here is "the page, with
  // something in front of it", and two of them at once would be a
  // stack with no way back down it. The import gate wins over
  // everything — it is not a panel someone opened, it is standing
  // between them and whatever they were about to do. The Models modal
  // comes last, and only when someone asked for it — while nothing is
  // loaded, `renderSplash` is the page rather than a panel over it.
  if (state.pendingImport) { host.appendChild(renderImportGate()); return; }
  if (state.problems) { host.appendChild(problemsPanel()); return; }
  if (state.settings) { renderSettingsModal(host); return; }
  if (state.importExport) { host.appendChild(renderImportExportModal()); return; }
  if (state.models) { host.appendChild(modelsModal()); return; }
}

// A modal, and the thin backdrop that closes it. Clicking the backdrop
// only counts when it is the backdrop that was clicked — a click that
// started inside the modal and drifted out of it is not a dismissal.
function overlayAround(modal, close) {
  return h('div', {
    class: 'overlay',
    onclick: (e) => { if (e.target === e.currentTarget) close(); },
  }, modal);
}

// The one confirmation an import can force: the model it would build
// runs authored code the moment anything touches it. Everything else an
// untrusted import might get wrong is caught by the validating commands
// `finishImport` replays it through, so there is nothing else to ask.
function renderImportGate() {
  const envelope = state.pendingImport;
  const close = () => { state.pendingImport = null; render(); };
  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Import shared model'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'setting' },
      h('h4', {}, envelope.name || 'Untitled model'),
      h('div', { class: 'why' },
        'This model includes custom code that will run in your browser as soon as anything '
        + 'exercises it — an entity property or a projection with a script. Only import it if '
        + 'you trust where this came from.')),
    h('div', { class: 'adder', style: 'margin-top:18px' },
      h('button', {
        class: 'btn primary',
        onclick: () => { state.pendingImport = null; finishImport(envelope); },
      }, 'Import anyway'),
      h('button', { class: 'btn ghost', onclick: close }, 'Cancel')));
  setTimeout(() => modal.focus(), 0);
  return overlayAround(modal, close);
}

  const ctx = activeContext();

  let urlValue = '';
  let jsonValue = '';

  const doImportLoad = () => {
    if (state.ieImportMode === 'url') {
      if (!urlValue.trim()) return;
      state.importExport = false;
      runAsync(async () => beginImport(await loadContextFromUrl(urlValue.trim())));
    } else {
      if (!jsonValue.trim()) return;
      let envelope;
      try { envelope = JSON.parse(jsonValue); } catch { return toast('That is not valid JSON.', true); }

  async function copyToClipboard(text, flagKey) {
    try {

      toast('Could not copy — select the text and copy it manually.', true);

  const setInclude = (key) => (e) => {

    h('div', { class: 'adder', style: 'margin-top:18px' },
      h('button', { class: 'btn', onclick: close }, 'Done')));

  setTimeout(() => modal.focus(), 0);
  return overlayAround(modal, close);
}

// ============================================================
// Interface conveniences: undo, the loose-ends count, quick open, and
// row-to-row arrow keys. Each of these used to be optional; all four
// are just how the page behaves now.
// ============================================================

// ---------- undo ----------
//
// The model is an append-only log and the state is a fold over it, so
// the last change is undone by dropping what it appended off the end —
// not by a second history kept beside the first. The entries that come
// off are held so redo can put them back exactly as they were, sequence
// numbers included, which is only sound because they came off the end.

const UNDO_KEY = 'dcb-playground:undo';

function undoLog() {
  try {
    const stored = JSON.parse(localStorage.getItem(UNDO_KEY));
    if (stored && Array.isArray(stored.done) && Array.isArray(stored.undone)) return stored;
  } catch (e) { /* a corrupt stack is an empty one */ }
  return { done: [], undone: [] };
}
function saveUndoLog(next) { localStorage.setItem(UNDO_KEY, JSON.stringify(next)); }

// What a change was, read off what it appended. `event-definition-updated`
// carrying `CourseDefined` becomes "updated event: Course defined".
function changeLabel(appended) {
  const last = appended[appended.length - 1];
  const parts = last.type.split('-');
  const verb = parts.pop();
  const subject = parts.join(' ').replace(/^dcb /, '').replace(/ definition$/, '');
  const name = last.data && last.data.name;
  return verb + ' ' + subject + (name ? ': ' + readable(name) : '')
    + (appended.length > 1 ? ` (+${appended.length - 1} more)` : '');
}

// Every model change in the app goes through `run`, so the mark that
// says where a change began is taken here rather than at each of the
// hundred call sites.
const runOnce = run;
run = function (fn) {
  const before = loadEvents().length;
  const out = runOnce(fn);
  const appended = loadEvents().slice(before);
  if (!appended.length) return out;
  const log = undoLog();
  log.done.push({ at: before, label: changeLabel(appended) });
  // Redoing after a new change would mean re-appending entries that no
  // longer sit at the end of the log, so the branch is dropped.
  log.undone = [];
  if (log.done.length > 60) log.done.shift();
  saveUndoLog(log);
  render();
  return out;
};

function undo() {
  const log = undoLog();
  const mark = log.done.pop();
  if (!mark) return toast('Nothing to undo.');
  const events = loadEvents();
  localStorage.setItem(EVENT_LOG_KEY, JSON.stringify(events.slice(0, mark.at)));
  log.undone.push({ events: events.slice(mark.at), label: mark.label });
  saveUndoLog(log);
  closeForms();
  toast('Undone — ' + mark.label);
  render();
}

function redo() {
  const log = undoLog();
  const step = log.undone.pop();
  if (!step) return toast('Nothing to redo.');
  const events = loadEvents();
  localStorage.setItem(EVENT_LOG_KEY, JSON.stringify([...events, ...step.events]));
  log.done.push({ at: events.length, label: step.label });
  saveUndoLog(log);
  closeForms();
  toast('Redone — ' + step.label);
  render();
}

// ---------- loose ends ----------
//
// Nothing here is an error: a model under construction is supposed to
// have ends that are not tied yet. What it is for is that they are
// findable — an event no command records is invisible from a page built
// around commands, and it is the interface's job to say so.

function looseEnds(ctx) {
  const found = [];
  const loose = orphans(ctx);
  for (const name of loose.events) {
    found.push({
      what: readable(name), why: 'no command records this event',
      go: () => goToEvent(name),
    });
  }
  for (const name of loose.entities) {
    found.push({
      what: readable(name), why: 'no command reads this',
      go: () => { state.view = 'entity'; state.entity = name; },
    });
  }
  for (const slice of allSlices(ctx)) {
    const open = (why) => found.push({
      what: readable(slice.name), why,
      go: () => { state.view = 'slice'; state.slice = slice.name; },
    });
    if (!slice.emits.length) open('records nothing — nothing it decides is kept');
    if (!slice.payload.length) open('takes no input');
    for (const gap of slice.coverage) {
      open('writes ' + readable(gap.entity) + ' without reading it first');
    }
  }
  for (const [entity, body] of Object.entries(ctx['entity-definitions'])) {
    for (const property of body.properties || []) {
      const usage = propertyUsage(ctx, entity, property.name);
      if (usage.changedBy.length || usage.readBy.length) continue;
      found.push({
        what: readable(entity) + ' · ' + propertyWords(property.name),
        why: 'nothing changes it and nothing reads it',
        go: () => { state.view = 'entity'; state.entity = entity; },
      });
    }
  }
  return found;
}

// Loose ends and scenarios the model no longer agrees with, gathered
// into one list — everything wrong with this model that nobody had to
// go looking for, each one a way back to it.
function problems(ctx) {
  const found = looseEnds(ctx).map((end) => ({ what: end.what, why: end.why, go: end.go }));
  for (const { key, body, result } of scenarioTrouble(ctx)) {
    found.push({
      what: scenarioName(body, readable),
      why: STATUS_WORDS[result.status][2],
      go: () => {
        state.view = 'slice'; state.slice = body.command;
        state.tab = 'scenarios'; state.openScenario = key;
      },
    });
  }
  return found;
}

// Shown only when there is something to show — a clean model gets no
// badge to reassure it is clean, the way "Loose ends ✓" used to.
function problemsButton(ctx) {
  const found = problems(ctx);
  if (!found.length) return null;
  return h('button', {
    class: 'btn ghost', title: 'Problems in this model',
    onclick: () => { closeForms(); state.problems = true; render(); },
  }, 'Problems', h('span', { class: 'badge' }, found.length));
}

function problemsPanel() {
  const ctx = activeContext();
  const found = problems(ctx);
  const close = () => { state.problems = false; render(); };
  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Problems'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'muted small', style: 'margin-bottom:14px' },
      'Loose ends this model has not tied yet, and scenarios it no longer agrees with. '
      + 'Not mistakes — just ways back to what still needs attention.'),
    found.map((p) => h('button', {
      class: 'issue',
      onclick: () => { close(); p.go(); render(); },
    }, h('span', {}, p.what), h('span', { class: 'why' }, p.why))),
    h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', { class: 'btn primary', onclick: close }, 'Done')));
  const overlay = overlayAround(modal, close);
  setTimeout(() => modal.focus(), 0);
  return overlay;
}

// ---------- quick open ----------
//
// The rail lists commands. This lists everything: the features they sit
// in, the things themselves, the events, the projections, the value
// types — each with the one thing it does when chosen.
//
// It builds its own DOM once and updates only the result list as you
// type, because a repaint of the whole page under a text field is a
// repaint that takes the caret with it.

function paletteEntries(ctx) {
  const entries = [];
  const add = (what, label, where, go) => entries.push({ what, label, where, go, key: label + ' ' + where });

  for (const group of featureGroups(ctx)) {
    for (const name of group.commands) {
      add('command', commandIcon(ctx, name) + ' ' + readable(name), group.name, () => {
        state.view = 'slice'; state.slice = name;
      });
    }
    if (group.name !== UNGROUPED) {
      add('feature', group.name, group.commands.length + ' commands', () => {
        state.collapsed[group.name] = false;
        if (group.commands.length) { state.view = 'slice'; state.slice = group.commands[0]; }
      });
    }
  }
  for (const name of Object.keys(ctx['entity-definitions'])) {
    add('entity', entityIcon(ctx, name) + ' ' + readable(name), 'the things themselves', () => {
      state.entitiesCollapsed = false; state.view = 'entity'; state.entity = name;
    });
  }
  const records = {};
  for (const slice of allSlices(ctx)) {
    for (const emit of slice.emits) records[emit.emission.name] = slice.name;
  }
  for (const name of Object.keys(ctx['event-definitions'])) {
    const from = records[name];
    add('event', eventIcon(ctx, name) + ' ' + readable(name),
      from ? 'recorded by ' + readable(from) : 'recorded by nothing', () => goToEvent(name));
  }
  for (const name of Object.keys(ctx['projection-definitions'])) {
    add('projection', readable(name), 'projections', () => goToProjection(name));
  }
  if (advanced()) {
    for (const name of Object.keys(ctx['custom-type-definitions'])) {
      add('custom type', readable(name), 'custom types', () => goToCustomType(name));
    }
  }
  add('do', 'New command…', '', () => beginNewCommand(activeContext()));
  add('do', 'Models…', 'switch, load, or start a model', () => { state.models = true; });
  add('do', 'Settings', '', () => { state.settings = true; });
  add('do', advanced() ? 'Switch to Simple' : 'Switch to Advanced', '',
    () => setMode(advanced() ? 'simple' : 'advanced'));
  return entries;
}

// Letters in order, anywhere in the text. A run that starts the text
// beats one that starts a word, which beats one scattered through it —
// enough ranking that typing "sub" puts "Subscribe student" first.
function fuzzyScore(query, text) {
  if (!query) return 0;
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  const at = t.indexOf(q);
  if (at === 0) return 1000;
  if (at > 0) return 800 - at - (t[at - 1] === ' ' ? 0 : 100);
  let i = 0;
  let score = 400;
  for (const ch of t) {
    if (ch === q[i]) i += 1;
    if (i === q.length) return score;
    score -= 1;
  }
  return -1;
}

let paletteEl = null;

function closePalette() {
  state.palette = false;
  paletteEl = null;
  const host = document.getElementById('palette-host');
  if (host) host.innerHTML = '';
}

function openPalette() {
  closeForms();
  state.settings = false; state.problems = false; state.models = false;
  state.palette = true;
  render();
}

function renderPalette() {
  const host = document.getElementById('palette-host');
  if (!state.palette) { host.innerHTML = ''; paletteEl = null; return; }
  // Already up and holding the caret: nothing about a repaint of the
  // page behind it should reach in here.
  if (paletteEl) return;

  const entries = paletteEntries(activeContext());
  let hits = entries.slice(0, 12);
  let active = 0;

  const list = h('div', { class: 'hits' });
  const paint = () => {
    list.innerHTML = '';
    if (!hits.length) { list.appendChild(h('div', { class: 'none' }, 'Nothing by that name.')); return; }
    hits.forEach((hit, i) => list.appendChild(h('div', {
      class: 'hit' + (i === active ? ' on' : ''),
      onmouseenter: () => { active = i; paint(); },
      onclick: () => choose(hit),
    }, h('span', { class: 'what' }, hit.what), h('span', {}, hit.label),
      hit.where ? h('span', { class: 'where' }, hit.where) : null)));
    const on = list.children[active];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  };

  const choose = (hit) => {
    if (!hit) return;
    closePalette();
    hit.go();
    render();
  };

  const input = h('input', {
    type: 'text', placeholder: 'Quick open…', 'aria-label': 'Quick open',
    oninput: (e) => {
      const q = e.target.value.trim();
      hits = entries
        .map((entry) => ({ entry, score: fuzzyScore(q, entry.key) }))
        .filter((x) => x.score >= 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 12)
        .map((x) => x.entry);
      active = 0;
      paint();
    },
    onkeydown: (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, hits.length - 1); paint(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); paint(); }
      else if (e.key === 'Enter') { e.preventDefault(); choose(hits[active]); }
      // Escape belongs to the palette while the palette is up, and the
      // handler at the bottom of this file must not also act on it.
      else if (e.key === 'Escape') { e.preventDefault(); closePalette(); render(); }
    },
  });

  paletteEl = h('div', { class: 'palette', role: 'dialog', 'aria-modal': 'true' },
    input, list,
    h('footer', {},
      h('span', {}, '↑↓ to move'), h('span', {}, '↵ to open'), h('span', {}, 'esc to close')));
  paint();
  host.appendChild(h('div', {
    class: 'overlay', style: 'padding-top:14vh',
    onclick: (e) => { if (e.target === e.currentTarget) { closePalette(); render(); } },
  }, paletteEl));
  setTimeout(() => input.focus(), 0);
}

// ---------- arrow keys between rows ----------
//
// Tab reaches every button on the way down a command. The arrows reach
// only the rows, which is how the page is read rather than edited.

function rovingRows() {
  return [...document.querySelectorAll('#main .qrow[tabindex], #rail .qrow[tabindex]')];
}

function moveRow(step) {
  const rows = rovingRows();
  if (!rows.length) return false;
  const at = rows.indexOf(document.activeElement);
  const next = at < 0
    ? rows[step > 0 ? 0 : rows.length - 1]
    : rows[Math.min(Math.max(at + step, 0), rows.length - 1)];
  if (!next) return false;
  next.focus();
  next.scrollIntoView({ block: 'nearest' });
  return true;
}

// ---------- bringing a row on screen ----------
//
// Following a reference to its source, and landing on a row after the
// interface moved you somewhere.

function landOn(selector) {
  const target = document.querySelector(selector);
  if (!target) return;
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  // Restarting an animation that may still be running: the class comes
  // off, the layout is read to make the removal take effect, and it
  // goes back on — all in this frame, so nothing depends on a callback
  // the browser is free to defer.
  target.classList.remove('landed');
  void target.offsetWidth;
  target.classList.add('landed');
}

// Whether a row's machinery is on screen outright — a row opens on
// click, and stays open until another one is clicked.
function revealed(key) {
  return state.sel === key;
}

// The part of a row that waits to be asked for.
function reveal(...children) { return h('span', { class: 'reveal' }, ...children); }

// ---------- where a value came from ----------
//
// A sentence in one step refers to something declared in another: the
// input the command was handed, the instance it read, the field its
// event carries. The reference and the row that produces it now carry
// the same key, so pointing at one lights the other — which is the only
// way to see, without reading the whole page, that the "course id" in
// this sentence is the "course id" listed further up.

function sourceKey(operand, eventName) {
  switch (operandSource(operand)) {
    case 'parameter': return 'param:' + operand.parameterName;
    case 'alias-property': return 'alias:' + operand.alias;
    case 'event-property':
      return eventName ? 'evprop:' + eventName + '.' + operand.eventProperty : null;
    default: return null;
  }
}

// A hovered key lights up for as long as the pointer is on it; a clicked
// one is pinned and survives the pointer leaving, and a repaint.
function paintLit(hovered) {
  const key = hovered || state.lit;
  for (const node of document.querySelectorAll('.lit')) node.classList.remove('lit');
  if (!key) return;
  for (const node of document.querySelectorAll(`[data-src~="${key}"]`)) node.classList.add('lit');
}

// An operand as a chip that points back at its source.
function opRef(operand, eventName, text) {
  const label = text === undefined ? operandWords(operand) : text;
  const key = sourceKey(operand, eventName);
  if (!key) return h('span', { class: 'op' }, label);
  return h('span', {
    class: 'op ref' + (state.lit === key ? ' pinned' : ''),
    tabindex: 0, title: 'Where this comes from',
    onmouseenter: () => paintLit(key),
    onmouseleave: () => paintLit(),
    onfocus: () => paintLit(key),
    onblur: () => paintLit(),
    onclick: (e) => {
      e.stopPropagation();
      state.lit = state.lit === key ? null : key;
      // Lighting up a source three steps further up the page is only
      // half an answer while it is off screen.
      if (state.lit) state.land = `[data-src~="${CSS.escape(key)}"]`;
      render();
    },
  }, label);
}

// A row that is quiet by default: `key` names it, `src` for anything
// that refers back to it. Arrow keys always move along the page's flow
// — see `navFlow` — and Backspace removes the row when `onRemove` is
// given.
function qrow(tag, { cls = '', key, src, onRemove }, ...children) {
  const open = revealed(key);
  const toggle = () => { state.sel = state.sel === key ? null : key; render(); };
  return h(tag, {
    class: (cls ? cls + ' ' : '') + 'qrow' + (open ? ' open' : ''),
    'data-src': src || null,
    // Named in the document as well as in the state, so the keyboard
    // can be put back on the row it was on after a repaint.
    'data-key': key || null,
    tabindex: 0,
    onclick: (e) => {
      // A click meant for a control inside the row is not a click on
      // the row.
      if (e.target.closest('button, select, input, label, a, .chip.entity, .chip.linkable, .op.ent')) return;
      toggle();
    },
    onkeydown: (e) => {
      if (e.target !== e.currentTarget) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { navFlow(e); return; }
      if ((e.key === 'Backspace' || e.key === 'Delete') && onRemove) {
        e.preventDefault();
        const at = flowStops().indexOf(e.currentTarget);
        onRemove();
        if (at >= 0) focusFlowStopNear(Math.max(0, at - 1));
      }
    },
  }, ...children);
}

// "Add another one", folded into a single button until it is wanted.
// `flow-adder` marks that button as a stop of its own — see `navFlow`
// — so the row above it and the step below it are both one arrow key
// away, exactly the way an unfolded row would be.
function adderSlot(key, stepKey, label, build) {
  if (state.adder === key) return build();
  return h('div', { class: 'adder' }, h('button', {
    class: 'btn ghost tiny flow-adder',
    onclick: () => { closeForms(); state.adder = key; render(); focusOpenedAdder(stepKey); },
    onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
  }, label));
}

// Opening one adder from its folded button can also fold another —
// `state.adder` holds one key for the whole page, so a reads form left
// open collapses the instant a rule form opens. That is two sections
// changing shape in the same repaint, which is more than the generic
// by-position focus restore in `render` can track: it lands wherever
// the old button's position now falls in the new page, not on the form
// that actually replaced it. Landing explicitly on the new form's own
// first control — it is always the step's last child — is what keeps
// Enter-to-submit-then-Tab reaching the *next* step reliable.
function focusOpenedAdder(stepKey) {
  if (!stepKey) return;
  const section = document.querySelector('.step.' + stepKey);
  const last = section && section.lastElementChild;
  const el = last && last.querySelector('select, input, textarea, button');
  if (el) el.focus();
}

// ---------- removing things ----------
//
// Two gestures, and the difference is what is being removed.
//
// A *part* of something — a field, a rule, an instance the command
// reads, a change an event makes — goes on one click. It is a line in a
// list you are editing, the model still holds everything it was made
// of, and asking twice would make ordinary editing feel dangerous.
//
// A *definition* — a command, an event, an entity, a value type, a
// numbering, a whole model — asks once, and the button becomes its own
// confirmation rather than opening a dialog over the thing in question.
// The model refuses either way while anything still references it, so
// the question is only ever about work you meant to keep.
function removeButton(key, { label = '×', title, confirm = 'Really remove?', onRemove }) {
  if (state.confirmRemove === key) {
    return h('button', {
      class: 'btn tiny danger',
      onclick: () => { state.confirmRemove = null; onRemove(); },
    }, confirm);
  }
  // Not closeForms(): in the click-to-reveal variant that would close
  // the very row the confirmation lives in.
  return h('button', {
    class: 'btn tiny danger', title,
    onclick: () => { state.confirmRemove = key; render(); },
  }, label);
}

// The name / type / many / add row that four different lists all want.
// Enter anywhere in the row adds the field — the type select and the
// two checkboxes included, which is why the row itself listens rather
// than just the name field — the same as clicking the button, so a
// field is typically typed, tabbed through, and added without the hand
// ever leaving the keyboard. Backspace in an empty name field is the
// reverse: it pops the row just added. An empty name field is also
// where a list ends: Enter there with nothing typed means "done with
// these", which is `onEmptyEnter`'s to interpret.
function propertyAdder(ctx, {
  placeholder = 'course id', label = '+ Add', type = 'string',
  onAdd, onRemoveLast, onEmptyEnter,
}) {
  let name = '', chosen = type, isList = false, isOptional = false;
  const add = () => {
    if (!name.trim()) return toast('Give the field a name.', true);
    onAdd({ name: toCamel(name), propertyType: chosen, isOptional, isList });
  };
  const input = h('input', {
    type: 'text', placeholder, class: 'flow-entry',
    oninput: (e) => { name = e.target.value; },
    onkeydown: (e) => {
      if (e.key === 'Backspace' && !name && onRemoveLast) { e.preventDefault(); onRemoveLast(); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e);
    },
  });
  setTimeout(() => input.focus(), 0);
  return h('div', {
    class: 'adder',
    onkeydown: (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!name.trim() && onEmptyEnter) { onEmptyEnter(); return; }
      add();
    },
  },
    input,
    pick(typeOptions(ctx), chosen, (v) => { chosen = v; }),
    h('label', { class: 'tiny muted' },
      h('input', { type: 'checkbox', onchange: (e) => { isList = e.target.checked; } }), ' many'),
    h('label', { class: 'tiny muted' },
      h('input', { type: 'checkbox', onchange: (e) => { isOptional = e.target.checked; } }), ' optional'),
    h('button', { class: 'btn', onclick: add }, label));
}

// ---------- moving through a command's steps ----------
//
// One list, top to bottom, spanning every step on the page: the rows
// already declared — a property, a read, a rule, whatever a step
// holds — and each step's own "add another", its folded button while
// closed, its own entry field once open (see `adderSlot` and
// `propertyAdder`). Arrow keys walk it in either direction, crossing
// from one step into the next exactly where the page already draws
// the line between them — nothing here knows "trigger" from "rules",
// it only ever asks the document what comes next.
function flowStops() {
  const main = document.getElementById('main');
  if (!main) return [];
  return [...main.querySelectorAll('.qrow[tabindex], .flow-adder, .flow-entry')];
}
function navFlow(e) {
  const stops = flowStops();
  const at = stops.indexOf(document.activeElement);
  if (at < 0) return;
  const next = stops[at + (e.key === 'ArrowDown' ? 1 : -1)];
  if (next) { e.preventDefault(); next.focus(); next.scrollIntoView({ block: 'nearest' }); }
}
// Where to land after the stop at `index` is gone: whatever is now in
// its place, or the last stop if it was the very end of the list.
function focusFlowStopNear(index) {
  // The removal repaints the page, and if an adder stays open that
  // repaint mounts a fresh field which focuses itself the same way —
  // scheduled at the same 0ms delay, registered a moment later. A 0ms
  // timer of ours would lose that race every time; one tick later, its
  // self-focus has already happened and this is free to overrule it.
  setTimeout(() => {
    const stops = flowStops();
    if (!stops.length) return;
    const target = stops[Math.min(index, stops.length - 1)];
    if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
  }, 1);
}

// ---------- editing a member ----------
//
// A property, a field, a payload entry, a projection parameter — all
// the same shape, all editable the same way: rename it, retype it, say
// whether there are many and whether it may be absent.
//
// Renaming goes through `renameMember`, which rewrites every reference
// in the same append; the rest is an ordinary body update. They are
// separate calls because they are separate kinds of change — a rename
// touches other definitions, a retype does not.
//
// Which member is open is held in one place, so opening a second one
// closes the first.
function editingMember(where, name) {
  return state.editMember && state.editMember.where === where && state.editMember.name === name;
}
function openMember(where, name) {
  closeForms();
  state.editMember = { where, name };
  render();
}

// Retyping a property invalidates whatever it started from, and can
// invalidate its handlers: `append` means nothing on a scalar,
// `increment` nothing on a string. Rather than let the model refuse
// the update, the ones that no longer apply are dropped and said so.
function retypeProperty(ctx, property, changes) {
  const next = { ...property, ...changes };
  // A scripted property has neither an initial value nor an operation
  // to invalidate: retyping changes what a condition reads out of it,
  // and the code is left exactly as written. It may now be wrong —
  // nothing here can tell, which is what the escape hatch costs.
  if (next.script) return next;
  if (next.propertyType !== property.propertyType
      || next.isList !== property.isList
      || next.isOptional !== property.isOptional) {
    next.initialValue = defaultInitialValue(ctx, next);
    if (next.handlers) {
      const allowed = operationsFor(ctx, next);
      const kept = next.handlers.filter((h) => allowed.includes(h.operation));
      if (kept.length !== next.handlers.length) {
        toast(`Dropped ${next.handlers.length - kept.length} handler(s) that no longer apply to `
          + `${readable(typeLabel(next))}.`);
      }
      next.handlers = kept;
    }
  }
  return next;
}

// The editable form of one member. `onReplace` receives the whole
// member back; `onRename` is given only the new name, because a rename
// is the model's job rather than a body edit.
//
// `allow` says which knobs this site has: an event property has no
