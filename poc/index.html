  return h('div', { class: 'row-list' }, rows);
}

function entityPropertyListEditor({ state, ctx, rerender }) {
  const cards = state.properties.map((property, idx) =>
    entityPropertyCard({ property, idx, state, ctx, rerender })
  );
  cards.push(h('button', {
    class: 'btn btn-xs btn-secondary add-row',
    onclick: () => {
      state.properties.push({
        name: '', propertyType: '', isOptional: false, isList: false,
        initialValue: null, handlers: [],
      });
      rerender();
    },
  }, '+ Add property'));
  return h('div', { class: 'row-list' }, cards);
}

function entityPropertyCard({ property, idx, state, ctx, rerender }) {
  const reserved = property.name === STATE_PROPERTY;
  const eventNames = Object.keys(ctx['event-definitions']).sort();
  const members = enumMembersFor(ctx, property.propertyType);
  const operations = operationsFor(ctx, property);

  const head = reserved
    ? h('div', { class: 'prop-card-head' },
        h('div', { class: 'locked' }, 'state'),
        h('div', { class: 'locked derived-state-name' }, property.propertyType),
        h('span', {}), h('span', {}),
        h('span', { class: 'initial-badge' }, 'reserved')
      )
    : h('div', { class: 'prop-card-head' },
        textInput({ value: property.name, placeholder: 'propertyName', oninput: (v) => { property.name = v; } }),
        selectInput({
          value: property.propertyType,
          options: typeOptions(ctx),
          placeholder: '— type —',
          onchange: (v) => {
            property.propertyType = v;
            property.handlers = [];
            property.initialValue = defaultInitialValue(ctx, property);
            rerender();
          },
        }),
        checkboxInput({
          value: property.isOptional,
          onchange: (v) => { property.isOptional = v; rerender(); },
          label: 'optional',
        }),
        checkboxInput({
          value: property.isList,
          onchange: (v) => {
            property.isList = v;
            property.handlers = [];
            property.initialValue = defaultInitialValue(ctx, property);
            rerender();
          },
          label: 'list',
        }),
        h('button', {
          class: 'btn btn-xs btn-danger',
          onclick: () => { state.properties.splice(idx, 1); rerender(); },
        }, '×')
      );

  const handlerRows = (property.handlers || []).map((handler, hIdx) => {
    const event = ctx['event-definitions'][handler.event];
    return h('div', { class: 'handler-row' },
      selectInput({
        value: handler.event || '',
        options: eventNames.map((n) => ({ value: n, label: n })),
        placeholder: '— event —',
        onchange: (v) => { handler.event = v; rerender(); },
      }),
      selectInput({
        value: handler.operation || '',
        options: operations.map((o) => ({ value: o, label: o })),
        placeholder: null,
        onchange: (v) => { handler.operation = v; rerender(); },
      }),
      handlerOperandEditor({
        get: () => handler.value,
        set: (v) => { handler.value = v; },
        event, members, ctx, rerender,
      }),
      h('button', {
        class: 'btn btn-xs btn-danger',
        onclick: () => { property.handlers.splice(hIdx, 1); rerender(); },
      }, '×')
    );
  });

  if (handlerRows.length === 0) {
    handlerRows.push(h('div', { class: 'empty-rows' }, 'No handlers — this property never changes.'));
  }
  handlerRows.push(h('button', {
    class: 'btn btn-xs btn-secondary add-row',
    onclick: () => {
      property.handlers = property.handlers || [];
      property.handlers.push({ event: '', operation: operations[0], value: defaultHandlerValue(members) });
      rerender();
    },
  }, '+ Add handler'));

  return h('div', { class: 'prop-card' + (reserved ? ' reserved-prop' : '') },
    head,
    h('div', { class: 'sub-label' }, 'Initial value'),
    reserved
      ? h('div', { class: 'kv' }, state.states[0] || '(no states)', ' — pinned to the first state')
      : initialValueEditor({ property, members, rerender }),
    h('div', { class: 'sub-label' }, 'Handlers'),
    h('div', {}, handlerRows)
  );
}

function defaultInitialValue(ctx, property) {
  if (property.isList) return [];
  const members = enumMembersFor(ctx, property.propertyType);
  if (members) return { enumMember: members[0] || '' };
  if (property.isOptional) return null;
  if (property.propertyType === 'integer') return 0;
  if (property.propertyType === 'boolean') return false;
  return '';
}

function defaultHandlerValue(members) {
  return members ? { enumMember: members[0] || '' } : '';
}

function initialValueEditor({ property, members, rerender }) {
  if (property.isList) {
    property.initialValue = [];
    return h('div', { class: 'kv' }, '[] — a list projection always starts empty');
  }
  if (members) {
    return selectInput({
      value: operandSource(property.initialValue) === 'enum-member' ? property.initialValue.enumMember : '',
      options: members.map((m) => ({ value: m, label: m })),
      placeholder: '— state —',
      onchange: (v) => { property.initialValue = { enumMember: v }; rerender(); },
    });
  }
  if (property.isOptional) {
    const isNull = property.initialValue === null;
    return h('div', { class: 'operand-editor' },
      selectInput({
        value: isNull ? 'null' : 'literal',
        placeholder: null,
        options: [{ value: 'null', label: 'null' }, { value: 'literal', label: 'Literal' }],
        onchange: (v) => { property.initialValue = v === 'null' ? null : ''; rerender(); },
      }),
      isNull ? null : literalInput(property.initialValue, (v) => { property.initialValue = v; })
    );
  }
  return literalInput(property.initialValue, (v) => { property.initialValue = v; });
}

function sequenceForm({ state, ctx, getName, rerender }) {
  const eventNames = Object.keys(ctx['event-definitions']).sort();
  const name = (getName() || '').trim() || 'this sequence';

  const rows = (state.advancedBy || []).map((advance, idx) => {
    const event = ctx['event-definitions'][advance.event];
    // Only properties that could actually carry the issued value are
    // worth offering: same type, single, required.
    const candidates = event
      ? (event.properties || []).filter(
          (p) => p.propertyType === state.valueType && !p.isList && !p.isOptional)
      : [];
    return h('div', { class: 'boundary-row' },
      selectInput({
        value: advance.event || '',
        options: eventNames.map((n) => ({ value: n, label: n })),
        placeholder: '— event —',
        onchange: (v) => { advance.event = v; advance.property = ''; rerender(); },
      }),
      selectInput({
        value: advance.property || '',
        options: candidates.map((p) => ({ value: p.name, label: p.name })),
        placeholder: event
          ? (candidates.length > 0 ? '— property —' : `— no ${state.valueType || '?'} property —`)
          : '— pick an event first —',
        onchange: (v) => { advance.property = v; rerender(); },
      }),
      h('button', {
        class: 'btn btn-xs btn-danger',
        onclick: () => { state.advancedBy.splice(idx, 1); rerender(); },
      }, '×')
    );
  });

  if (rows.length === 0) {
    rows.push(h('div', { class: 'empty-rows' }, 'Nothing advances this sequence — it would issue its initial value forever.'));
  }
  rows.push(h('button', {
    class: 'btn btn-xs btn-secondary add-row',
    onclick: () => { state.advancedBy.push({ event: '', property: '' }); rerender(); },
  }, '+ Add advancing event'));

  return [
    labeled('Issues', '— the type of the values this sequence hands out',
      selectInput({
        value: state.valueType,
        options: typeOptions(ctx),
        placeholder: '— type —',
        onchange: (v) => {
          state.valueType = v;
          // The property picker is scoped by type, so stale picks go.
          for (const advance of state.advancedBy) advance.property = '';
          rerender();
        },
      })
    ),
    labeled('Initial value', '— issued until an advancing event exists; the only place a prefix is stated',
      literalInput(state.initialValue, (v) => { state.initialValue = v; })
    ),
    labeled('Advanced by', '— the events that consume values, and the property carrying the value consumed',
      h('div', { class: 'binding-list' }, rows)
    ),
    labeled('Resulting query', '— derived, read-only',
      h('div', { class: 'dcb-panel' },
        h('div', {},
          h('span', { class: 'q-key' }, 'read:  '),
          h('span', { class: 'q-type' },
            (state.advancedBy || []).map((a) => a.event).filter(Boolean).join(', ') || '(nothing)'),
          h('span', { class: 'q-none' }, '  — newest matching event only, never a fold')
        ),
        h('div', {},
          h('span', { class: 'q-key' }, 'guard: '),
          h('span', { class: 'q-none' }, `every command reading ${name} is serialised against every other`)
        )
      )
    ),
  ];
}

// ============================================================
// Command form.
// ============================================================

// The payload properties typed with an entity identifier. Each one is an
// instance the command necessarily consults, so each one earns a binding.
function idTypedProperties(state, ctx) {
  const out = [];
  for (const property of state.properties || []) {
    const cls = classifyType(ctx, property.propertyType);
    if (cls.kind === 'derived' && cls.role === 'id' && CAMEL_RE.test(property.name || '')) {
      out.push({ entity: cls.entity, parameterName: property.name });
    }
  }
  return out;
}

// Every binding whose identifier is a parameter reference belongs to the
// sync — one rule, so a stale binding left by a rename or a retype is
// indistinguishable from a fresh one and gets cleaned up either way.
// Hand-added bindings take their identifier from somewhere else (a
// literal, another instance's property) and are never touched.
function isManagedBinding(binding) {
  return !!binding
    && !!binding.id
    && typeof binding.id === 'object'
    && !Array.isArray(binding.id)
    && binding.id.parameterName !== undefined;
}

// Reconciles the boundary against the payload: exactly one binding per
// entity-id property. An alias already given to a binding is preserved,
// so renaming one sticks; renaming the underlying property re-derives it.
function syncBoundaryToProperties(state, ctx) {
  const wanted = idTypedProperties(state, ctx);
  const boundary = state.boundary || [];
  const manual = boundary.filter((b) => !isManagedBinding(b));
  const managed = boundary.filter(isManagedBinding);

  const derived = [];
  const taken = manual.map((b) => b.alias);
  for (const w of wanted) {
    const found = managed.find(
      (b) => b.entity === w.entity && b.id.parameterName === w.parameterName
    );
    const alias = found && !taken.includes(found.alias)
      ? found.alias
      : uniqueAlias(aliasFromProperty(w.parameterName), taken);
    taken.push(alias);
    derived.push({ alias, entity: w.entity, id: { parameterName: w.parameterName } });
  }
  state.boundary = [...derived, ...manual];
  return wanted;
}

function commandForm({ state, ctx, rerender }) {
  state.boundary = state.boundary || [];
  state.conditions = state.conditions || [];
  state.publishes = state.publishes || [];

  // Derived before anything reads the boundary — operandArgs closes over it.
  syncBoundaryToProperties(state, ctx);

  // Shut by default: a fully derived boundary needs no attention. It opens
  // itself only when a hand-added binding is present, since those are the
  // ones that still have to be authored.
  if (state.boundaryOpen === undefined) {
    state.boundaryOpen = state.boundary.some((b) => !isManagedBinding(b));
  }

  const entityNames = Object.keys(ctx['entity-definitions']).sort();
  const eventNames = Object.keys(ctx['event-definitions']).sort();
  const operandArgs = { commandProperties: state.properties, boundary: state.boundary, ctx, rerender };

  return [
    labeled('Properties', '— the command payload; every entity-id property binds its instance below',
      propertyListEditor({ properties: state.properties, ctx, rerender })
    ),
    collapsible({
      label: 'Boundary',
      hint: '— the entity instances this command consults; this list is the DCB',
      open: state.boundaryOpen,
      summary: boundarySummary(state.boundary),
      ontoggle: () => { state.boundaryOpen = !state.boundaryOpen; rerender(); },
    },
      boundaryEditor({ state, entityNames, operandArgs, rerender })
    ),
    labeled('Conditions', '— all must hold before any event is emitted',
      conditionListEditor({ state, operandArgs, rerender })
    ),
    labeled('Publishes', '— events emitted on success',
      publishesEditor({ state, eventNames, operandArgs, ctx, rerender })
    ),
    labeled('Resulting DCB', '— derived, read-only',
      dcbPanel(ctx, stateToBodyPreview(state))
    ),
  ];
}

function boundarySummary(boundary) {
  if (!boundary || boundary.length === 0) return 'nothing bound';
  return boundary
    .map((b) => `${b.alias || '?'}: ${b.entity || '?'}(${operandText(b.id)})`)
    .join('   ·   ');
}

function boundaryEditor({ state, entityNames, operandArgs, rerender }) {
  // Only hand-added bindings can be reordered; derived ones are rebuilt
  // ahead of them on every render, so moving one would not stick.
  const manualPositions = state.boundary
    .map((b, i) => (isManagedBinding(b) ? -1 : i))
    .filter((i) => i >= 0);

  const rows = state.boundary.map((binding, idx) => {
    // Derived bindings follow the payload: only the alias is authored,
    // since changing the entity or the identifier here would just be
    // overwritten on the next render.
    if (isManagedBinding(binding)) {
      return h('div', { class: 'binding-card' },
        h('div', { class: 'boundary-row' },
          textInput({ value: binding.alias, placeholder: 'alias', oninput: (v) => { binding.alias = v; } }),
          h('div', { class: 'locked' }, binding.entity),
          h('div', { class: 'locked' }, `id = ${operandText(binding.id)}`),
          h('span', { class: 'initial-badge' }, 'from property')
        )
      );
    }
    // Declaration order is the chain, so a binding may only take its
    // identifier from an instance bound above it — which is exactly the
    // slice of the boundary the operand editor is allowed to offer.
    const above = state.boundary.slice(0, idx);
    const manualAt = manualPositions.indexOf(idx);
    const swapWith = (other) => {
      const tmp = state.boundary[idx];
      state.boundary[idx] = state.boundary[other];
      state.boundary[other] = tmp;
      rerender();
    };

    return h('div', { class: 'binding-card' },
      h('div', { class: 'boundary-row' },
        textInput({ value: binding.alias, placeholder: 'alias', oninput: (v) => { binding.alias = v; } }),
        selectInput({
          value: binding.entity,
          options: entityNames.map((n) => ({ value: n, label: n })),
          placeholder: '— entity —',
          onchange: (v) => { binding.entity = v; rerender(); },
        }),
        commandOperandEditor({
          get: () => binding.id,
          set: (v) => { binding.id = v; },
          ...operandArgs,
          boundary: above,
        }),
        h('button', {
          class: 'btn btn-xs btn-secondary',
          disabled: manualAt <= 0,
          onclick: () => { if (manualAt > 0) swapWith(manualPositions[manualAt - 1]); },
        }, '↑'),
        h('button', {
          class: 'btn btn-xs btn-secondary',
          disabled: manualAt < 0 || manualAt >= manualPositions.length - 1,
          onclick: () => {
            if (manualAt >= 0 && manualAt < manualPositions.length - 1) swapWith(manualPositions[manualAt + 1]);
          },
        }, '↓'),
        h('button', {
          class: 'btn btn-xs btn-danger',
          onclick: () => { state.boundary.splice(idx, 1); rerender(); },
        }, '×')
      )
    );
  });

  if (rows.length === 0) {
    rows.push(h('div', { class: 'empty-rows' },
      'Nothing bound — give the command an entity-id property and its instance binds itself.'));
  }
  if (entityNames.length === 0) {
    rows.push(h('div', { class: 'binding-warning' }, 'No entities exist in this context yet.'));
  } else {
    rows.push(renderAddPicker({
      available: entityNames,
      placeholder: '+ Bind an entity instance',
      onpick: (entityName) => {
        const taken = state.boundary.map((b) => b.alias);
        state.boundary.push({
          alias: uniqueAlias(defaultAlias(entityName), taken),
          entity: entityName,
          id: null,
        });
        rerender();
      },
    }));
  }
  return h('div', { class: 'binding-list' }, rows);
}

const COUNT_PREDICATES = ['countEquals', 'countLessThan', 'countGreaterThan'];

// What the right-hand side is being compared against: the left operand's
// type, narrowed by the predicate — `contains` over a list compares an
// element, and the count predicates compare an integer.
function expectedRightType(leftType, predicate) {
  if (!leftType) return null;
  if (COUNT_PREDICATES.includes(predicate)) return { propertyType: 'integer', isList: false };
  if (predicate === 'contains' && leftType.isList) {
    return { propertyType: leftType.propertyType, isList: false };
  }
  return leftType;
}

function conditionListEditor({ state, operandArgs, rerender }) {
  const ctx = operandArgs.ctx;
  const cards = state.conditions.map((condition, idx) => {
    const isBinary = condition.rightHandSide !== undefined;
    const predicates = (isBinary ? BINARY_PREDICATES : UNARY_PREDICATES).map((p) => ({ value: p, label: p }));

    // A condition always talks about a bound instance, so the left side is
    // fixed to an entity property — no source picker.
    const leftType = resolveOperandType(condition.leftHandSide, operandArgs);
    const expected = expectedRightType(leftType, condition.predicate);
    const rightMembers = expected ? enumMembersFor(ctx, expected.propertyType) : null;
    const rightSources = rightMembers
      ? ['enum-member', 'alias-property']
      : ['parameter', 'alias-property', 'static'];

    const grid = h('div', { class: 'condition-grid' + (isBinary ? '' : ' unary') },
      h('div', {},
        h('label', {}, 'Left'),
        commandOperandEditor({
          get: () => condition.leftHandSide,
          set: (v) => { condition.leftHandSide = v; },
          ...operandArgs,
          sources: ['alias-property'],
        })
      ),
      h('div', {},
        h('label', {}, 'Predicate'),
        selectInput({
          value: condition.predicate,
          options: predicates,
          placeholder: null,
          onchange: (v) => { condition.predicate = v; rerender(); },
        })
      ),
      isBinary
        ? h('div', {},
            h('label', {}, 'Right'),
            commandOperandEditor({
              get: () => condition.rightHandSide,
              set: (v) => { condition.rightHandSide = v; },
              ...operandArgs,
              sources: rightSources,
              enumMembers: rightMembers || undefined,
            })
          )
        : null
    );

    return h('div', { class: 'condition-card' },
      h('div', { class: 'condition-head' },
        h('div', { class: 'condition-preview' }, conditionText(condition)),
        selectInput({
          value: isBinary ? 'binary' : 'unary',
          placeholder: null,
          options: [{ value: 'unary', label: '1 operand' }, { value: 'binary', label: '2 operands' }],
          onchange: (v) => {
            if (v === 'binary' && !isBinary) {
              condition.rightHandSide = { parameterName: '' };
              condition.predicate = 'equals';
            } else if (v === 'unary' && isBinary) {
              delete condition.rightHandSide;
              condition.predicate = 'isEmpty';
            }
            rerender();
          },
        }),
        checkboxInput({ value: condition.negate, onchange: (v) => { condition.negate = v; rerender(); }, label: 'not' }),
        h('button', {
          class: 'btn btn-xs btn-danger',
          onclick: () => { state.conditions.splice(idx, 1); rerender(); },
        }, '×')
      ),
      grid
    );
  });

  if (cards.length === 0) {
    cards.push(h('div', { class: 'empty-rows' },
      'No conditions — the append is still guarded by the derived DCB below.'));
  }
  cards.push(h('button', {
    class: 'btn btn-xs btn-secondary add-row',
    onclick: () => {
      // Seeded as a state check against the first bound instance — by far
      // the most common condition, and the one you'd otherwise assemble
      // from four dropdowns.
      const binding = state.boundary[0];
      const entity = binding ? ctx['entity-definitions'][binding.entity] : null;
      const states = entity ? (entity.states || []) : [];
      state.conditions.push({
        leftHandSide: { alias: (binding || {}).alias || '', property: STATE_PROPERTY },
        predicate: 'equals',
        rightHandSide: { enumMember: states[1] || states[0] || '' },
      });
      rerender();
    },
  }, '+ Add condition'));

  return h('div', { class: 'binding-list' }, cards);
}

function publishesEditor({ state, eventNames, operandArgs, ctx, rerender }) {
  const rows = state.publishes.map((emission, idx) => {
    const event = ctx['event-definitions'][emission.name];
    const targetProperties = event ? (event.properties || []) : [];
    emission.parameters = reconcileParameters(targetProperties, emission.parameters);

    const issues = coverageIssues(ctx, { boundary: state.boundary, publishes: [emission] });

    return h('div', { class: 'binding-card' },
      h('div', { class: 'binding-header' },
        h('div', { class: 'binding-title' }, emission.name || '(unknown)'),
        h('button', {
          class: 'btn btn-xs btn-danger',
          onclick: () => { state.publishes.splice(idx, 1); rerender(); },
        }, '×')
      ),
      event
        ? renderParameterBindings(targetProperties, emission.parameters, operandArgs)
        : h('div', { class: 'binding-warning' }, `Referenced event "${emission.name}" no longer exists.`),
      ...issues.map((issue) => h('div', { class: 'coverage-issue' },
        h('span', {},
          `Writes tag ${issue.entity}:${operandText(issue.operand)} — not consulted by the boundary.`),
        h('button', {
          class: 'btn btn-xs',
          onclick: () => {
            const taken = state.boundary.map((b) => b.alias);
            state.boundary.push({
              alias: uniqueAlias(defaultAlias(issue.entity), taken),
              entity: issue.entity,
              id: issue.operand === undefined ? null : deepClone(issue.operand),
            });
            rerender();
          },
        }, 'Add to boundary')
      ))
    );
  });

  if (rows.length === 0) {
    rows.push(h('div', { class: 'empty-rows' }, 'No events yet — pick at least one below.'));
  }
  if (eventNames.length === 0) {
    rows.push(h('div', { class: 'binding-warning' }, 'No event definitions exist in this context yet.'));
  } else {
    rows.push(renderAddPicker({
      available: eventNames,
      placeholder: '+ Add event emission',
      onpick: (name) => {
        const event = ctx['event-definitions'][name];
        state.publishes.push({ name, parameters: reconcileParameters((event && event.properties) || [], {}) });
        rerender();
      },
    }));
  }
  return h('div', { class: 'binding-list' }, rows);
}

// Reconciles a binding map with the target's shape on every render, so
// properties added to the target appear as fresh slots and removed ones
// are dropped silently.
function reconcileParameters(targetProperties, parameters) {
  const next = (parameters && typeof parameters === 'object') ? parameters : {};
  const targetNames = new Set(targetProperties.map((p) => p.name));
  for (const key of Object.keys(next)) {
    if (!targetNames.has(key)) delete next[key];
  }
  for (const property of targetProperties) {
    if (!(property.name in next)) next[property.name] = { parameterName: '' };
  }
  return next;
}

function renderParameterBindings(targetProperties, parameters, operandArgs) {
  if (targetProperties.length === 0) {
    return h('div', { class: 'binding-empty' }, '(no parameters)');
  }
  return h('div', { class: 'param-bindings' },
    targetProperties.map((property) => {
      const typeText = `${property.propertyType}${property.isList ? '[]' : ''}${property.isOptional ? '?' : ''}`;
      return h('div', { class: 'param-binding-row' },
        h('div', { class: 'param-name' }, property.name, ': ', h('span', { class: 'param-type' }, typeText)),
        commandOperandEditor({
          get: () => parameters[property.name],
          set: (v) => { parameters[property.name] = v; },
          ...operandArgs,
        })
      );
    })
  );
}

function renderAddPicker({ available, placeholder, onpick }) {
  const sel = h('select', {
    onchange: (e) => {
      const v = e.target.value;
      if (v) { onpick(v); sel.value = ''; }
    },
  });
  sel.appendChild(h('option', { value: '' }, placeholder));
  for (const name of available) sel.appendChild(h('option', { value: name }, name));
  return h('div', { class: 'add-binding' }, sel);
}

// ============================================================
// DCB rendering.
// ============================================================

function dcbPanel(ctx, body) {
  const dcb = deriveDcb(ctx, body);
  const lines = [];

  if (dcb.items.length === 0) {
    lines.push(h('div', { class: 'q-none' }, 'No boundary — the append is unconditional.'));
  } else {
    lines.push(h('div', {}, h('span', { class: 'q-key' }, 'query:')));
    dcb.items.forEach((item, idx) => {
      const lead = ['  ', idx === 0 ? '  ' : 'or '];
      // A sequence is global: its query is scoped by event type alone,
      // and it is the only item here that carries no tag.
      if (item.sequence) {
        lines.push(h('div', {},
          ...lead,
          h('span', { class: 'q-key' }, 'types '),
          h('span', { class: 'q-type' }, item.types.join(', ') || '(none)'),
          h('span', { class: 'q-none' }, `  (no tag — sequence ${item.sequence} is global)`)
        ));
        return;
      }
      lines.push(h('div', {},
        ...lead,
        h('span', { class: 'q-key' }, 'tag '),
        h('span', { class: 'q-tag' }, item.tag),
        // No property read means no type restriction, which matches
        // *every* event carrying the tag — a stronger guard, not a
        // weaker one.
        item.types.length > 0
          ? h('span', {}, h('span', { class: 'q-key' }, ' and types '),
              h('span', { class: 'q-type' }, item.types.join(', ')))
          : h('span', {}, h('span', { class: 'q-key' }, ' and '),
              h('span', { class: 'q-type' }, 'any type'),
              h('span', { class: 'q-none' }, ' (no property read)'))
      ));
    });
  }

  lines.push(h('div', {},
    h('span', { class: 'q-key' }, 'appends tags: '),
    dcb.writes.length > 0
      ? h('span', { class: 'q-write' }, dcb.writes.join(', '))
      : h('span', { class: 'q-none' }, 'none')
  ));

  return h('div', { class: 'dcb-panel' }, lines);
}

// ============================================================
// Definition editor: dispatch per kind, build form, save.
// ============================================================

function initialBodyForKind(kind) {
  if (kind === 'custom-type-definition') return { schema: { type: 'string' } };
  if (kind === 'event-definition') return { properties: [] };
  if (kind === 'entity-definition') {
    return {
      identifierSchema: { type: 'string' },
      states: [...DEFAULT_STATES],
      properties: [{
        name: STATE_PROPERTY,
        propertyType: '',
        isOptional: false,
        isList: false,
        initialValue: { enumMember: DEFAULT_STATES[0] },
        handlers: [],
      }],
    };
  }
  if (kind === 'sequence-definition') {
    return { valueType: '', initialValue: '', advancedBy: [] };
  }
  if (kind === 'command-definition') {
    return { properties: [], boundary: [], conditions: [], publishes: [] };
  }
  return {};
}

function bodyToState(kind, body) {
  if (kind === 'custom-type-definition') {
    return { schemaText: JSON.stringify(body.schema == null ? { type: 'string' } : body.schema, null, 2) };
  }
  if (kind === 'event-definition') {
    return { properties: deepClone(body.properties || []) };
  }
  if (kind === 'entity-definition') {
    return {
      identifierSchemaText: JSON.stringify(
        body.identifierSchema == null ? { type: 'string' } : body.identifierSchema, null, 2),
      states: deepClone(body.states || DEFAULT_STATES),
      properties: deepClone(body.properties || []),
    };
  }
  if (kind === 'sequence-definition') {
    return {
      valueType: body.valueType || '',
      initialValue: body.initialValue === undefined ? '' : body.initialValue,
      advancedBy: deepClone(body.advancedBy || []),
    };
  }
  if (kind === 'command-definition') {
    return {
      properties: deepClone(body.properties || []),
      boundary: deepClone(body.boundary || []),
      conditions: deepClone(body.conditions || []),
      publishes: deepClone(body.publishes || []),
    };
  }
  return {};
}

// A best-effort body used only to preview the derived DCB while
// editing — it never throws.
function stateToBodyPreview(state) {
  return {
    properties: state.properties || [],
    boundary: state.boundary || [],
    conditions: state.conditions || [],
    publishes: state.publishes || [],
  };
}

function stateToBody(kind, state, name) {
  if (kind === 'custom-type-definition') {
    return { schema: parseJsonObject(state.schemaText, 'Schema') };
  }
  if (kind === 'event-definition') {
    return { properties: cleanProperties(state.properties) };
  }
  if (kind === 'entity-definition') {
    const states = (state.states || []).map((s) => (s || '').trim()).filter(Boolean);
    if (states.length < 2) throw new DomainError('An entity must declare at least two states.');
    const properties = cleanEntityProperties(state.properties, name, states);
    return {
      identifierSchema: parseJsonObject(state.identifierSchemaText, 'Identifier schema'),
      states,
      properties,
    };
  }
  if (kind === 'sequence-definition') {
    if (!state.valueType) throw new DomainError('A sequence must say what type it issues.');
    const advancedBy = [];
    for (const advance of state.advancedBy || []) {
      if (!advance.event && !advance.property) continue;
      if (!advance.event) throw new DomainError('An "advanced by" entry has no event.');
      if (!advance.property) {
        throw new DomainError(`"Advanced by ${advance.event}" does not say which property carries the value.`);
      }
      advancedBy.push({ event: advance.event, property: advance.property });
    }
    return { valueType: state.valueType, initialValue: state.initialValue, advancedBy };
  }
  if (kind === 'command-definition') {
    const boundary = (state.boundary || []).map((binding, i) => {
      if (!binding.alias) throw new DomainError(`Boundary binding #${i + 1} has no alias.`);
      if (!binding.entity) throw new DomainError(`Boundary binding "${binding.alias}" has no entity.`);
      return { alias: binding.alias.trim(), entity: binding.entity, id: binding.id };
    });
    const conditions = (state.conditions || []).map((condition, i) => {
      if (!condition.predicate) throw new DomainError(`Condition #${i + 1} has no predicate.`);
      const out = { leftHandSide: condition.leftHandSide, predicate: condition.predicate };
      if (condition.rightHandSide !== undefined) out.rightHandSide = condition.rightHandSide;
      if (condition.negate) out.negate = true;
      return out;
    });
    const publishes = (state.publishes || []).map((emission, i) => {
      if (!emission || !emission.name) throw new DomainError(`Event emission #${i + 1} is missing a name.`);
      const out = { name: emission.name };
      if (emission.parameters && Object.keys(emission.parameters).length > 0) {
        out.parameters = emission.parameters;
      }
      return out;
    });
    return { properties: cleanProperties(state.properties), boundary, conditions, publishes };
  }
  return {};
}

function parseJsonObject(text, label) {
  let parsed;
  try { parsed = JSON.parse((text || '').trim() || '{}'); }
  catch (e) { throw new DomainError(`${label} is not valid JSON: ${e.message}`); }
  if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
    throw new DomainError(`${label} must be a JSON object.`);
  }
  return parsed;
}

function cleanProperties(properties) {
  const cleaned = [];
  for (const p of properties || []) {
    if (!p.name && !p.propertyType) continue;
    if (!p.name) throw new DomainError('A property is missing a name.');
    if (!CAMEL_RE.test(p.name)) throw new DomainError(`Property name "${p.name}" must be camelCase.`);
    if (!p.propertyType) throw new DomainError(`Property "${p.name}" is missing a type.`);
    cleaned.push({
      name: p.name,
      propertyType: p.propertyType,
      isOptional: !!p.isOptional,
      isList: !!p.isList,
    });
  }
  return cleaned;
}

function cleanEntityProperties(properties, entityName, states) {
  const cleaned = [];
  for (const p of properties || []) {
    const reserved = p.name === STATE_PROPERTY;
    if (!reserved && !p.name && !p.propertyType) continue;
    if (!p.name) throw new DomainError('A property is missing a name.');
    if (!CAMEL_RE.test(p.name)) throw new DomainError(`Property name "${p.name}" must be camelCase.`);

    const propertyType = reserved ? stateTypeOf(entityName) : p.propertyType;
    if (!propertyType) throw new DomainError(`Property "${p.name}" is missing a type.`);

    const handlers = [];
    for (const handler of p.handlers || []) {
      if (!handler.event && !handler.operation) continue;
      if (!handler.event) throw new DomainError(`A handler on "${p.name}" has no event.`);
      if (!handler.operation) throw new DomainError(`A handler on "${p.name}" has no operation.`);
      if (!OPERATIONS.includes(handler.operation)) {
        throw new DomainError(`Unknown operation "${handler.operation}" on "${p.name}".`);
      }
      handlers.push({ event: handler.event, operation: handler.operation, value: handler.value });
    }

    cleaned.push({
      name: p.name,
      propertyType,
      isOptional: reserved ? false : !!p.isOptional,
      isList: reserved ? false : !!p.isList,
      initialValue: reserved ? { enumMember: states[0] } : normaliseInitialValue(p),
      handlers,
    });
  }
  return cleaned;
}

function normaliseInitialValue(property) {
  if (property.isList) return [];
  return property.initialValue === undefined ? null : property.initialValue;
}

function definitionEditor({ mode, kind, ctxId, existingName, existingBody }) {
  const ctx = projectState()[ctxId];
  if (!ctx) { showToast('Context not found.'); return; }

  let nameValue = mode === 'add' ? '' : existingName;
  const state = bodyToState(kind, existingBody || initialBodyForKind(kind));

  const titles = { add: `Add ${humanize(kind)}`, edit: `Edit ${humanize(kind)}`, rename: `Rename ${humanize(kind)}` };
  const example = nameExample(kind);

  openModal((rerender) => {
    const errorEl = h('div', { class: 'error', style: 'display:none' });
    function showErr(msg) { errorEl.textContent = msg; errorEl.style.display = 'block'; }

    const rows = [h('h3', {}, titles[mode]), errorEl];

    if (mode !== 'edit') {
      rows.push(labeled(
        `${humanize(kind)} name`,
        `— PascalCase, e.g. "${example}"`,
        textInput({
          value: nameValue,
          placeholder: example,
          oninput: (v) => {
            nameValue = v;
            // Never rerender here — it would destroy the focused input.
            if (kind === 'entity-definition') refreshDerivedTypeLabels(v);
          },
        })
      ));
    }

    if (mode !== 'rename') {
      const fresh = projectState()[ctxId] || ctx;
      rows.push(...renderFormForKind(kind, {
        state,
        ctx: fresh,
        getName: () => (mode === 'edit' ? existingName : nameValue),
        rerender,
      }));
    }

    function submit() {
      try {
        // The payload name field does not rerender as you type, so a
        // property named after its type was chosen would otherwise be
        // saved without its binding.
        if (kind === 'command-definition' && mode !== 'rename') {
          syncBoundaryToProperties(state, projectState()[ctxId] || ctx);
        }
        if (mode === 'add') {
          runCommand(() => addDefinition(kind, ctxId, nameValue, stateToBody(kind, state, (nameValue || '').trim())));
        } else if (mode === 'edit') {
          runCommand(() => updateDefinition(kind, ctxId, existingName, stateToBody(kind, state, existingName)));
        } else {
          runCommand(() => renameDefinition(kind, ctxId, existingName, nameValue));
        }
        closeModal();
      } catch (err) {
        if (err instanceof DomainError) showErr(err.message); else throw err;
      }
    }

    rows.push(h('div', { class: 'actions' },
      h('button', { class: 'btn btn-ghost', onclick: closeModal }, 'Cancel'),
      h('button', { class: 'btn', onclick: submit }, 'Save')
    ));

    return rows;
  });
}

function renderFormForKind(kind, args) {
  switch (kind) {
    case 'custom-type-definition': return customTypeForm(args);
    case 'event-definition': return eventForm(args);
    case 'entity-definition': return entityForm(args);
    case 'sequence-definition': return sequenceForm(args);
    case 'command-definition': return commandForm(args);
  }
  return [];
}

function nameExample(kind) {
  return {
    'custom-type-definition': 'EmailAddress',
    'event-definition': 'CourseDefined',
    'entity-definition': 'Course',
    'sequence-definition': 'CourseNumbering',
    'command-definition': 'SubscribeStudentToCourse',
  }[kind];
}

// Rendering.

function render() {
  renderBreadcrumb();
  const root = document.getElementById('root');
  root.innerHTML = '';
  if (ui.view === 'list') root.appendChild(renderListView());
  else if (ui.view === 'detail') root.appendChild(renderDetailView());
}

function renderBreadcrumb() {
  const nav = document.getElementById('breadcrumb');
  nav.innerHTML = '';
  if (ui.view === 'list') { nav.textContent = 'Contexts'; return; }
  const ctx = projectState()[ui.selectedContextId];
  nav.appendChild(h('a', { onclick: navigateToList }, 'Contexts'));
  nav.appendChild(document.createTextNode(' / '));
  nav.appendChild(document.createTextNode(ctx ? ctx.name : '(deleted)'));
}

function renderListView() {
  const contexts = Object.values(projectState()).sort((a, b) => a.name.localeCompare(b.name));

  const newButton = h('button', {
    class: 'btn',
    onclick: () => promptModal({
      title: 'New DCB Context',
      label: 'Context name',
      confirmLabel: 'Create',
      onConfirm: (val) => { const id = createDcbContext(val); render(); navigateToContext(id); },
    }),
  }, '+ New Context');

  const exampleButton = h('button', {
    class: 'btn btn-ghost',
    onclick: () => runCommand(() => { const id = seedExample(); navigateToContext(id); }),
  }, 'Load example');

  if (contexts.length === 0) {
    return h('div', {},
      h('div', { class: 'page-header' }, h('h2', {}, 'DCB Contexts'), renderLegend()),
      h('div', { class: 'empty-state' },
        h('h2', {}, 'No contexts yet'),
        h('p', {}, 'Create your first DCB Context — or load the course-subscription example to see entities in action.'),
        h('div', { class: 'actions' }, newButton, exampleButton))
    );
  }

  return h('div', {},
    h('div', { class: 'page-header' },
      h('h2', {}, 'DCB Contexts'),
      h('div', { style: 'display:flex; gap:16px; align-items:center;' }, renderLegend(), exampleButton, newButton)
    ),
    h('div', { class: 'context-list' }, contexts.map(renderContextCard))
  );
}

function renderLegend() {
  return h('div', { class: 'legend' },
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-entity)' }), 'Entities'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-event)' }), 'Events'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-command)' }), 'Commands'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-custom-type)' }), 'Custom Types')
  );
}

function renderContextCard(ctx) {
  return h('div', { class: 'context-card' },
    h('h3', { onclick: () => navigateToContext(ctx.id) }, ctx.name),
    h('div', { class: 'counts' },
      h('span', { class: 'count-pill pill-entity' }, String(Object.keys(ctx['entity-definitions']).length), ' entities'),
      h('span', { class: 'count-pill pill-event' }, String(Object.keys(ctx['event-definitions']).length), ' events'),
      h('span', { class: 'count-pill pill-command' }, String(Object.keys(ctx['command-definitions']).length), ' commands'),
      h('span', { class: 'count-pill pill-custom-type' }, String(Object.keys(ctx['custom-type-definitions']).length), ' types')
    ),
    h('div', { class: 'actions' },
      h('button', { class: 'btn btn-sm', onclick: () => navigateToContext(ctx.id) }, 'Open'),
      h('button', {
        class: 'btn btn-sm btn-ghost',
        onclick: () => promptModal({
          title: 'Rename Context',
          label: 'New name',
          value: ctx.name,
          confirmLabel: 'Rename',
          onConfirm: (val) => runCommand(() => renameDcbContext(ctx.id, val)),
        }),
      }, 'Rename'),
      h('button', {
        class: 'btn btn-sm btn-danger',
        onclick: () => confirmModal({
          title: 'Delete Context',
          body: `Delete "${ctx.name}"? Its events stay in the log (this is a soft delete).`,
          confirmLabel: 'Delete',
          destructive: true,
          onConfirm: () => runCommand(() => deleteDcbContext(ctx.id)),
        }),
      }, 'Delete')
    )
  );
}

function renderDetailView() {
  const ctx = projectState()[ui.selectedContextId];
  if (!ctx) {
    return h('div', { class: 'empty-state' },
      h('h2', {}, 'Context not found'),
      h('p', {}, 'It may have been deleted.'),
      h('button', { class: 'btn', onclick: navigateToList }, 'Back to contexts'));
  }

  return h('div', {},
    h('div', { class: 'detail-header' },
      h('h2', {}, ctx.name),
      h('div', { class: 'actions' },
        h('button', {
          class: 'btn btn-sm btn-ghost',
          onclick: () => promptModal({
            title: 'Rename Context',
            label: 'New name',
            value: ctx.name,
            confirmLabel: 'Rename',
            onConfirm: (val) => runCommand(() => renameDcbContext(ctx.id, val)),
          }),
        }, 'Rename Context'),
        h('button', {
          class: 'btn btn-sm btn-danger',
          onclick: () => confirmModal({
            title: 'Delete Context',
            body: `Delete "${ctx.name}"? Its events stay in the log.`,
            confirmLabel: 'Delete',
            destructive: true,
            onConfirm: () => { runCommand(() => deleteDcbContext(ctx.id)); navigateToList(); },
          }),
        }, 'Delete Context'))
    ),
    h('div', { class: 'definition-sections' }, DEF_KINDS.map((k) => renderDefinitionSection(ctx, k)))
  );
}

function renderDefinitionSection(ctx, kind) {
  const coll = ctx[DEF_COLLECTIONS[kind]];
  const names = Object.keys(coll).sort();

  const body = h('div', { class: 'body' });
  if (names.length === 0) {
    body.appendChild(h('div', { class: 'empty' }, `No ${KIND_SECTION_TITLE[kind].toLowerCase()} yet.`));
  } else {
    for (const name of names) body.appendChild(renderDefinitionCard(ctx, kind, name, coll[name]));
  }

  return h('section', { class: `definition-section ${KIND_COLOR_CLASS[kind]}` },
    h('div', { class: 'section-header' },
      h('h3', {}, KIND_SECTION_TITLE[kind]),
      h('button', {
        class: 'btn btn-sm add-btn',
        onclick: () => definitionEditor({ mode: 'add', kind, ctxId: ctx.id }),
      }, '+ Add')
    ),
    body
  );
}

function renderDefinitionCard(ctx, kind, name, body) {
  const expandable = kind === 'entity-definition' || kind === 'command-definition';
  const key = `${kind}:${name}`;
  const open = !!ui.expanded[key];
  const refs = computeReferences(ctx, kind, body);

  const refChips = [];
  for (const targetKind of DEF_KINDS) {
    for (const n of refs[targetKind]) {
      if (targetKind === kind && n === name) continue;
      refChips.push(h('span', { class: `ref-chip ${targetKind}` }, n));
    }
  }

  return h('div', { class: 'definition-card' },
    h('div', { class: 'name-row' },
      h('div', {},
        h('div', { class: 'name' },
          expandable
            ? h('button', { class: 'disclosure', onclick: () => toggleExpanded(key) }, open ? '▼' : '▶')
            : null,
          name
        ),
        h('div', { class: 'summary' }, summariseBody(ctx, kind, body) || '')
      )
    ),
    refChips.length > 0 ? h('div', { class: 'refs' }, refChips) : null,
    expandable && open ? renderExpanded(ctx, kind, name, body) : null,
    h('div', { class: 'actions' },
      h('button', {
        class: 'btn btn-sm',
        onclick: () => definitionEditor({ mode: 'edit', kind, ctxId: ctx.id, existingName: name, existingBody: body }),
      }, 'Edit'),
      h('button', {
        class: 'btn btn-sm btn-ghost',
        onclick: () => definitionEditor({ mode: 'rename', kind, ctxId: ctx.id, existingName: name, existingBody: body }),
      }, 'Rename'),
      h('button', {
        class: 'btn btn-sm btn-danger',
        onclick: () => confirmModal({
          title: `Remove ${humanize(kind)}`,
          body: `Remove "${name}"?`,
          confirmLabel: 'Remove',
          destructive: true,
          onConfirm: () => runCommand(() => removeDefinition(kind, ctx.id, name)),
        }),
      }, 'Remove')
    )
  );
}

function renderExpanded(ctx, kind, name, body) {
  if (kind === 'entity-definition') return renderEntityDetail(ctx, name, body);
  return renderCommandDetail(ctx, body);
}

function renderEntityDetail(ctx, name, body) {
  const states = body.states || [];
  const idSchema = JSON.stringify(body.identifierSchema || { type: 'string' });

  const propertyRows = (body.properties || []).map((property) => {
    const reserved = property.name === STATE_PROPERTY;
    const signature = `${property.name}: ${property.propertyType}` +
      `${property.isList ? '[]' : ''}${property.isOptional ? '?' : ''}` +
      ` = ${operandText(property.initialValue)}`;
    const handlers = (property.handlers || []).map(handlerText);
    return h('div', { class: 'prop-row' },
      h('div', { class: 'prop-sig' }, signature,
        reserved ? h('span', { class: 'reserved' }, 'reserved') : null),
      handlers.length > 0
        ? h('div', { class: 'prop-handlers' }, handlers.join('   ·   '))
        : h('div', { class: 'prop-handlers' }, 'never changes')
    );
  });

  return h('div', { class: 'expanded' },
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, 'Derived types'),
      h('div', { class: 'kv' }, `${idTypeOf(name)} — ${idSchema}`),
      h('div', { class: 'kv' }, `${stateTypeOf(name)} — enum`)
    ),
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, 'States'),
      h('div', {}, states.map((member, idx) =>
        h('span', { class: 'state-chip' + (idx === 0 ? ' initial' : '') }, member)))
    ),
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, `Properties (${(body.properties || []).length} projections)`),
      h('div', {}, propertyRows)
    )
  );
}

function renderCommandDetail(ctx, body) {
  const boundaryLines = (body.boundary || []).map((binding) =>
    h('div', { class: 'cond-line' }, `${binding.alias}: ${binding.entity}(id = ${operandText(binding.id)})`));
  const conditionLines = (body.conditions || []).map((condition) =>
    h('div', { class: 'cond-line' }, conditionText(condition)));
  const emissionLines = (body.publishes || []).map((emission) => {
    const args = Object.entries(emission.parameters || {})
      .map(([k, v]) => `${k}: ${operandText(v)}`).join(', ');
    return h('div', { class: 'cond-line' }, `${emission.name}(${args})`);
  });

  return h('div', { class: 'expanded' },
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, 'Boundary'),
      boundaryLines.length > 0 ? h('div', {}, boundaryLines) : h('div', { class: 'prop-handlers' }, 'nothing bound')
    ),
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, 'Conditions'),
      conditionLines.length > 0
        ? h('div', {}, conditionLines)
        : h('div', { class: 'prop-handlers' }, 'none — the derived DCB alone guards this append')
    ),
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, 'Publishes'),
      h('div', {}, emissionLines)
    ),
    h('div', { class: 'block' },
      h('div', { class: 'block-title' }, 'Resulting DCB'),
      dcbPanel(ctx, body)
    )
  );
}

function summariseBody(ctx, kind, body) {
  if (!body || typeof body !== 'object') return null;
  if (kind === 'custom-type-definition') {
    return (body.schema && body.schema.type) ? body.schema.type : 'object';
  }
  if (kind === 'event-definition') {
    const properties = body.properties || [];
    const tags = properties
      .map((p) => classifyType(ctx, p.propertyType))
      .filter((cls) => cls.kind === 'derived' && cls.role === 'id')
      .map((cls) => cls.entity);
    const tagText = tags.length > 0 ? ` · tags ${uniq(tags).join(', ')}` : ' · untagged';
    return `${properties.length} ${properties.length === 1 ? 'property' : 'properties'}${tagText}`;
  }
  if (kind === 'entity-definition') {
    const count = (body.properties || []).length;
    return `${count} ${count === 1 ? 'property' : 'properties'} · ${(body.states || []).length} states`;
  }
  if (kind === 'sequence-definition') {
    const events = (body.advancedBy || []).map((a) => a && a.event).filter(Boolean);
    return `${body.valueType || '?'} from ${operandText(body.initialValue)} · advanced by `
      + (events.length > 0 ? events.join(', ') : 'nothing');
  }
  if (kind === 'command-definition') {
    const bound = (body.boundary || []).length;
    const conditions = (body.conditions || []).length;
    const publishes = (body.publishes || []).length;
    return `binds ${bound} · ${conditions} ${conditions === 1 ? 'condition' : 'conditions'} · publishes ${publishes}`;
  }
  return null;
}

// ============================================================
// Seed: the canonical course-subscription model.
//
// Built through the ordinary commands, in an order that keeps every
// reference resolvable at each step — entities first without handlers
// (nothing to reference yet), then the events, then the entities again
// with their handlers, then the commands.
// ============================================================

function seedExample() {
  const ctxId = createDcbContext('Course Subscriptions');

  const property = (name, type, initialValue, extra = {}) => ({
    name, propertyType: type, isOptional: false, isList: false,
    initialValue, handlers: [], ...extra,
  });
  const stateProperty = (entity, first) =>
    property(STATE_PROPERTY, stateTypeOf(entity), { enumMember: first });

  // 1. Entities without handlers. Student first, since Course refers
  //    to StudentId.
  addDefinition('entity-definition', ctxId, 'Student', {
    identifierSchema: { type: 'string' },
    states: ['NonExistent', 'Existent'],
    properties: [
      stateProperty('Student', 'NonExistent'),
      property('subscriptionCount', 'integer', 0),
    ],
  });
  addDefinition('entity-definition', ctxId, 'Course', {
    identifierSchema: { type: 'string', pattern: '^c[0-9]+$' },
    states: ['NonExistent', 'Existent', 'Archived'],
    properties: [
      stateProperty('Course', 'NonExistent'),
      property('capacity', 'integer', 0),
      property('subscriptionCount', 'integer', 0),
      property('subscribedStudentIds', 'StudentId', [], { isList: true }),
    ],
  });

  // 2. Events. Their entity-id properties are what carry the tags.
  const event = (name, properties) =>
    addDefinition('event-definition', ctxId, name, { properties });
  const prop = (name, type) => ({ name, propertyType: type, isOptional: false, isList: false });

  event('CourseDefined', [prop('courseId', 'CourseId'), prop('capacity', 'integer')]);
  event('CourseCapacityChanged', [prop('courseId', 'CourseId'), prop('newCapacity', 'integer')]);
  event('CourseArchived', [prop('courseId', 'CourseId')]);
  event('StudentRegistered', [prop('studentId', 'StudentId')]);
  event('StudentSubscribedToCourse', [prop('courseId', 'CourseId'), prop('studentId', 'StudentId')]);
  event('StudentUnsubscribedFromCourse', [prop('courseId', 'CourseId'), prop('studentId', 'StudentId')]);

  // 3. Entities again, now with handlers.
  const handler = (event, operation, value) => ({ event, operation, value });

  updateDefinition('entity-definition', ctxId, 'Student', {
    identifierSchema: { type: 'string' },
    states: ['NonExistent', 'Existent'],
    properties: [
      { ...stateProperty('Student', 'NonExistent'),
        handlers: [handler('StudentRegistered', 'set', { enumMember: 'Existent' })] },
      { ...property('subscriptionCount', 'integer', 0),
        handlers: [
          handler('StudentSubscribedToCourse', 'increment', 1),
          handler('StudentUnsubscribedFromCourse', 'decrement', 1),
        ] },
    ],
  });
  updateDefinition('entity-definition', ctxId, 'Course', {
    identifierSchema: { type: 'string', pattern: '^c[0-9]+$' },
    states: ['NonExistent', 'Existent', 'Archived'],
    properties: [
      { ...stateProperty('Course', 'NonExistent'),
        handlers: [
          handler('CourseDefined', 'set', { enumMember: 'Existent' }),
          handler('CourseArchived', 'set', { enumMember: 'Archived' }),
        ] },
      { ...property('capacity', 'integer', 0),
        handlers: [
          handler('CourseDefined', 'set', { eventProperty: 'capacity' }),
          handler('CourseCapacityChanged', 'set', { eventProperty: 'newCapacity' }),
        ] },
      { ...property('subscriptionCount', 'integer', 0),
        handlers: [
          handler('StudentSubscribedToCourse', 'increment', 1),
          handler('StudentUnsubscribedFromCourse', 'decrement', 1),
        ] },
      { ...property('subscribedStudentIds', 'StudentId', [], { isList: true }),
        handlers: [
          handler('StudentSubscribedToCourse', 'append', { eventProperty: 'studentId' }),
          handler('StudentUnsubscribedFromCourse', 'remove', { eventProperty: 'studentId' }),
        ] },
    ],
  });

  // 4. Sequences. Not partitioned by a tag — a numbering is global, so
  //    its query is scoped by event type alone. Reading it is one
  //    backwards lookup; the prefix rides on the initial value.
  addDefinition('sequence-definition', ctxId, 'CourseNumbering', {
    valueType: 'CourseId',
    initialValue: 'c1',
    advancedBy: [{ event: 'CourseDefined', property: 'courseId' }],
  });

  // 5. Commands. The boundary is the DCB.
  const param = (name) => ({ parameterName: name });
  const of = (alias, property) => ({ alias, property });
  const bind = (alias, entity, idParam) => ({ alias, entity, id: param(idParam) });
  const command = (name, body) => addDefinition('command-definition', ctxId, name, body);

  // No payload identifier, no bindings, no conditions — and still safely
  // guarded. Reading CourseNumbering contributes `types CourseDefined`
  // to the append condition, so a course defined concurrently
  // invalidates this append. That is what makes the numbering
  // monotonic, and it is why no "id not yet used" check is needed.
  command('DefineCourse', {
    properties: [prop('capacity', 'integer')],
    boundary: [],
    conditions: [],
    publishes: [{
      name: 'CourseDefined',
      parameters: { courseId: { sequence: 'CourseNumbering' }, capacity: param('capacity') },
    }],
  });

  command('ChangeCourseCapacity', {
    properties: [prop('courseId', 'CourseId'), prop('newCapacity', 'integer')],
    boundary: [bind('course', 'Course', 'courseId')],
    conditions: [
      { leftHandSide: of('course', 'state'), predicate: 'equals', rightHandSide: { enumMember: 'Existent' } },
      { leftHandSide: of('course', 'subscriptionCount'), predicate: 'lessThanOrEquals', rightHandSide: param('newCapacity') },
    ],
    publishes: [{
      name: 'CourseCapacityChanged',
      parameters: { courseId: param('courseId'), newCapacity: param('newCapacity') },
    }],
  });

  command('ArchiveCourse', {
    properties: [prop('courseId', 'CourseId')],
    boundary: [bind('course', 'Course', 'courseId')],
    conditions: [
      { leftHandSide: of('course', 'state'), predicate: 'equals', rightHandSide: { enumMember: 'Existent' } },
    ],
    publishes: [{ name: 'CourseArchived', parameters: { courseId: param('courseId') } }],
  });

  command('RegisterStudent', {
    properties: [prop('studentId', 'StudentId')],
    boundary: [bind('student', 'Student', 'studentId')],
    conditions: [
      { leftHandSide: of('student', 'state'), predicate: 'equals', rightHandSide: { enumMember: 'NonExistent' } },
    ],
    publishes: [{ name: 'StudentRegistered', parameters: { studentId: param('studentId') } }],
  });

  command('SubscribeStudentToCourse', {
    properties: [prop('courseId', 'CourseId'), prop('studentId', 'StudentId')],
    boundary: [bind('course', 'Course', 'courseId'), bind('student', 'Student', 'studentId')],
    conditions: [
      { leftHandSide: of('course', 'state'), predicate: 'equals', rightHandSide: { enumMember: 'Existent' } },
      { leftHandSide: of('student', 'state'), predicate: 'equals', rightHandSide: { enumMember: 'Existent' } },
      { leftHandSide: of('course', 'subscriptionCount'), predicate: 'lessThan', rightHandSide: of('course', 'capacity') },
      { leftHandSide: of('course', 'subscribedStudentIds'), predicate: 'contains', rightHandSide: param('studentId'), negate: true },
      { leftHandSide: of('student', 'subscriptionCount'), predicate: 'lessThan', rightHandSide: 10 },
    ],
    publishes: [{
      name: 'StudentSubscribedToCourse',
      parameters: { courseId: param('courseId'), studentId: param('studentId') },
    }],
  });

  command('UnsubscribeStudentFromCourse', {
    properties: [prop('courseId', 'CourseId'), prop('studentId', 'StudentId')],
    boundary: [bind('course', 'Course', 'courseId'), bind('student', 'Student', 'studentId')],
    conditions: [
      { leftHandSide: of('course', 'state'), predicate: 'equals', rightHandSide: { enumMember: 'Existent' } },
      { leftHandSide: of('course', 'subscribedStudentIds'), predicate: 'contains', rightHandSide: param('studentId') },
    ],
    publishes: [{
      name: 'StudentUnsubscribedFromCourse',
      parameters: { courseId: param('courseId'), studentId: param('studentId') },
    }],
  });

  return ctxId;
}

window.addEventListener('DOMContentLoaded', render);
</script>
