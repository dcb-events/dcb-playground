<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DCB Playground</title>
<style>
  :root {
    --color-command: #2563eb;
    --color-command-hover: #1d4ed8;
    --color-event: #f97316;
    --color-projection: #16a34a;
    --color-constraint: #9333ea;
    --color-custom-type: #6b7280;
    --color-bg: #f8fafc;
    --color-surface: #ffffff;
    --color-border: #e2e8f0;
    --color-text: #0f172a;
    --color-text-muted: #475569;
    --color-danger: #dc2626;
    --color-danger-hover: #b91c1c;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.05);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.5;
  }

  header.app-header {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header.app-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header.app-header nav { font-size: 14px; color: var(--color-text-muted); }
  header.app-header nav a {
    color: var(--color-command);
    text-decoration: none;
    cursor: pointer;
  }
  header.app-header nav a:hover { text-decoration: underline; }

  main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  /* Buttons — commands are always blue. */
  .btn {
    background: var(--color-command);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s;
  }
  .btn:hover:not(:disabled) { background: var(--color-command-hover); }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-xs { padding: 2px 8px; font-size: 11px; }
  .btn-ghost {
    background: transparent;
    color: var(--color-command);
    border: 1px solid var(--color-command);
  }
  .btn-ghost:hover:not(:disabled) {
    background: var(--color-command);
    color: #fff;
  }
  .btn-danger { background: var(--color-danger); }
  .btn-danger:hover:not(:disabled) { background: var(--color-danger-hover); }
  .btn-secondary {
    background: #e2e8f0;
    color: var(--color-text);
  }
  .btn-secondary:hover:not(:disabled) {
    background: #cbd5e1;
  }

  /* List view */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--color-text-muted);
  }
  .empty-state h2 { margin: 0 0 8px; color: var(--color-text); }
  .empty-state p { margin: 0 0 24px; }

  .context-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .context-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .context-card h3 {
    margin: 0 0 12px;
    font-size: 16px;
    cursor: pointer;
    color: var(--color-command);
  }
  .context-card h3:hover { text-decoration: underline; }
  .context-card .counts {
    font-size: 11px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .count-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
    color: #fff;
  }
  .pill-custom-type { background: var(--color-custom-type); }
  .pill-event { background: var(--color-event); }
  .pill-projection { background: var(--color-projection); }
  .pill-constraint { background: var(--color-constraint); }
  .pill-command { background: var(--color-command); }
  .context-card .actions {
    display: flex;
    gap: 8px;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-header h2 { margin: 0; }

  /* Detail view */
  .detail-header {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
  }
  .detail-header h2 { margin: 0; font-size: 22px; }
  .detail-header .actions { display: flex; gap: 8px; }

  .definition-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .definition-section {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .definition-section .section-header {
    padding: 12px 16px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .definition-section .section-header h3 {
    margin: 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .definition-section.custom-type .section-header { background: var(--color-custom-type); }
  .definition-section.event .section-header { background: var(--color-event); }
  .definition-section.projection .section-header { background: var(--color-projection); }
  .definition-section.constraint .section-header { background: var(--color-constraint); }
  .definition-section.command .section-header { background: var(--color-command); }

  .definition-section .add-btn {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.5);
  }
  .definition-section .add-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.4);
  }

  .definition-section .body {
    padding: 12px 16px;
    flex: 1;
    min-height: 80px;
  }
  .definition-section .empty {
    color: var(--color-text-muted);
    font-style: italic;
    font-size: 13px;
    padding: 16px 0;
    text-align: center;
  }
  .definition-card {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .definition-card:last-child { margin-bottom: 0; }
  .definition-card .name {
    font-weight: 600;
    margin-bottom: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
  }
  .definition-card .summary {
    font-size: 11px;
    color: var(--color-text-muted);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .definition-card .refs {
    font-size: 11px;
    color: var(--color-text-muted);
    margin-bottom: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .ref-chip {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 999px;
    color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
  }
  .ref-chip.custom-type-definition { background: var(--color-custom-type); }
  .ref-chip.event-definition { background: var(--color-event); }
  .ref-chip.projection-definition { background: var(--color-projection); }
  .ref-chip.constraint-definition { background: var(--color-constraint); }
  .ref-chip.command-definition { background: var(--color-command); }
  .definition-card .actions {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal {
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 24px;
    width: 90%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  }
  .modal h3 { margin: 0 0 16px; }
  .modal .form-row { margin-bottom: 14px; }
  .modal label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
    color: var(--color-text-muted);
  }
  .modal label .hint {
    font-weight: 400;
    font-style: italic;
    color: #94a3b8;
    margin-left: 4px;
  }
  .modal input[type="text"],
  .modal input[type="number"],
  .modal select,
  .modal textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  .modal textarea {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    min-height: 100px;
    resize: vertical;
  }
  .modal .inline-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 400;
    color: var(--color-text);
    font-size: 13px;
    margin-right: 16px;
    cursor: pointer;
  }

  .row-list {
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 8px;
    background: #fafbfc;
  }
  .row-list-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr auto auto auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .row-list-row:last-child { margin-bottom: 0; }
  .row-list-row input[type="text"],
  .row-list-row select {
    padding: 4px 8px;
    font-size: 13px;
  }
  .row-list .add-row {
    margin-top: 4px;
  }
  .row-list .empty-rows {
    color: var(--color-text-muted);
    font-style: italic;
    font-size: 13px;
    padding: 4px;
  }

  .handler-row {
    display: grid;
    grid-template-columns: minmax(140px, 1fr) 3fr auto;
    gap: 6px;
    margin-bottom: 6px;
    align-items: flex-start;
  }
  .handler-row select { padding: 4px 8px; font-size: 13px; }
  .handler-row textarea {
    min-height: 60px;
    font-size: 12px;
  }
  .handler-row .remove-btn {
    align-self: start;
  }

  .checkbox-list {
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 8px;
    max-height: 140px;
    overflow-y: auto;
    background: #fafbfc;
  }
  .checkbox-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 400;
    color: var(--color-text);
    margin-bottom: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .checkbox-list label:last-child { margin-bottom: 0; }
  .checkbox-list .empty {
    color: var(--color-text-muted);
    font-style: italic;
    font-size: 13px;
    padding: 4px;
  }

  .condition-builder {
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 10px;
    background: #fafbfc;
  }
  .condition-builder .field-row {
    margin-bottom: 8px;
  }
  .condition-builder .field-row:last-child { margin-bottom: 0; }
  .condition-builder .field-row > label {
    font-size: 12px;
    color: var(--color-text-muted);
    margin-bottom: 4px;
  }
  .operand-editor {
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: 8px;
    background: #fff;
  }
  .operand-editor .row {
    margin-bottom: 6px;
  }
  .operand-editor .row:last-child { margin-bottom: 0; }

  .modal .error {
    color: var(--color-danger);
    font-size: 13px;
    background: #fee2e2;
    border: 1px solid #fecaca;
    border-radius: var(--radius);
    padding: 8px 12px;
    margin-bottom: 14px;
  }
  .modal .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--color-text-muted);
    flex-wrap: wrap;
  }
  .legend-swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-danger);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    z-index: 200;
    font-size: 14px;
    max-width: 600px;
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>DCB Playground</h1>
  <nav id="breadcrumb"></nav>
</header>

<main id="root"></main>

<div id="modal-container"></div>
<div id="toast-container"></div>

<script>
'use strict';

// ============================================================
// Constants.
// ============================================================
const EVENT_LOG_KEY = 'dcb-playground:events:v2';

const DEF_KINDS = [
  'custom-type-definition',
  'event-definition',
  'projection-definition',
  'constraint-definition',
  'command-definition',
];
const DEF_COLLECTIONS = {
  'custom-type-definition': 'custom-type-definitions',
  'event-definition': 'event-definitions',
  'projection-definition': 'projection-definitions',
  'constraint-definition': 'constraint-definitions',
  'command-definition': 'command-definitions',
};
const KIND_COLOR_CLASS = {
  'custom-type-definition': 'custom-type',
  'event-definition': 'event',
  'projection-definition': 'projection',
  'constraint-definition': 'constraint',
  'command-definition': 'command',
};

const SIMPLE_TYPES = ['boolean', 'integer', 'string'];

const PASCAL_RE = /^[A-Z][A-Za-z0-9]+$/;
const CAMEL_RE = /^[a-z][A-Za-z0-9]+$/;

const UNARY_PREDICATES = ['isEmpty', 'isNotEmpty', 'isTrue', 'isFalse'];
const BINARY_PREDICATES = [
  'equals',
  'countEquals',
  'countLessThan',
  'countGreaterThan',
  'contains',
  'lessThan',
  'lessThanOrEquals',
  'greaterThan',
  'greaterThanOrEquals',
  'startsWith',
  'endsWith',
];

// ============================================================
// Event store (localStorage-backed append-only log).
// ============================================================

function loadEvents() {
  try {
    return JSON.parse(localStorage.getItem(EVENT_LOG_KEY) || '[]');
  } catch {
    return [];
  }
}

function appendEvents(newEvents) {
  const log = loadEvents();
  const startSeq = log.length;
  const stamped = newEvents.map((e, i) => ({
    sequence: startSeq + i,
    timestamp: new Date().toISOString(),
    type: e.type,
    data: e.data,
  }));
  localStorage.setItem(EVENT_LOG_KEY, JSON.stringify([...log, ...stamped]));
}

function generateId() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

// ============================================================
// Projection: derive current state from the event log.
// Mirrors `dcb-context-overview` in the ESDM model.
// ============================================================

function emptyContext(id, name) {
  const ctx = { id, name };
  for (const kind of DEF_KINDS) ctx[DEF_COLLECTIONS[kind]] = {};
  return ctx;
}

function projectState() {
  const contexts = {};
  for (const event of loadEvents()) apply(contexts, event);
  return contexts;
}

function apply(contexts, event) {
  const { type, data } = event;
  const ctxId = data['dcb-context-id'];

  if (type === 'dcb-context-created') {
    contexts[ctxId] = emptyContext(ctxId, data.name);
    return;
  }
  if (type === 'dcb-context-renamed') {
    if (contexts[ctxId]) contexts[ctxId].name = data.name;
    return;
  }
  if (type === 'dcb-context-deleted') {
    delete contexts[ctxId];
    return;
  }

  const ctx = contexts[ctxId];
  if (!ctx) return;

  for (const kind of DEF_KINDS) {
    const coll = ctx[DEF_COLLECTIONS[kind]];
    if (type === `${kind}-added`) {
      coll[data.name] = data.body;
      return;
    }
    if (type === `${kind}-updated`) {
      if (coll[data.name] !== undefined) coll[data.name] = data.body;
      return;
    }
    if (type === `${kind}-renamed`) {
      const prev = coll[data['previous-name']];
      if (prev !== undefined) {
        delete coll[data['previous-name']];
        coll[data.name] = prev;
      }
      return;
    }
    if (type === `${kind}-removed`) {
      delete coll[data.name];
      return;
    }
  }
}

// ============================================================
// Reference computation and rewriting.
//
// References are derived from the body shape (per the DCB-Context
// schema) — not stored alongside it. computeReferences returns
// the set of names referenced by a body, grouped by referenced
// kind. rewriteReferences returns a new body with every reference
// to `oldName` of `targetKind` replaced by `newName`.
// ============================================================

function emptyRefs() {
  const out = {};
  for (const k of DEF_KINDS) out[k] = [];
  return out;
}

function uniq(arr) { return [...new Set(arr)]; }

function pushTypeRef(refs, propertyType) {
  if (!propertyType || SIMPLE_TYPES.includes(propertyType)) return;
  refs['custom-type-definition'].push(propertyType);
}

function scanOperandForProjection(operand, refs) {
  if (!operand || typeof operand !== 'object') return;
  if (operand.projectionName) refs['projection-definition'].push(operand.projectionName);
}

function computeReferences(kind, body) {
  const refs = emptyRefs();
  if (!body || typeof body !== 'object') return refs;

  switch (kind) {
    case 'custom-type-definition':
      // Outbound refs not modeled (schema is opaque JSON Schema).
      break;
    case 'event-definition':
      for (const p of body.properties || []) pushTypeRef(refs, p.propertyType);
      break;
    case 'projection-definition':
      pushTypeRef(refs, body.partition);
      pushTypeRef(refs, body.projectionType);
      for (const evName of Object.keys(body.handlers || {})) {
        refs['event-definition'].push(evName);
      }
      break;
    case 'constraint-definition':
      for (const p of body.properties || []) pushTypeRef(refs, p.propertyType);
      if (body.condition) {
        scanOperandForProjection(body.condition.leftHandSide, refs);
        scanOperandForProjection(body.condition.rightHandSide, refs);
      }
      break;
    case 'command-definition':
      for (const p of body.properties || []) pushTypeRef(refs, p.propertyType);
      for (const c of body.constraints || []) refs['constraint-definition'].push(c);
      for (const e of body.publishes || []) refs['event-definition'].push(e);
      break;
  }

  for (const k of DEF_KINDS) refs[k] = uniq(refs[k]);
  return refs;
}

function rewriteOperand(operand, oldName, newName) {
  if (!operand || typeof operand !== 'object') return operand;
  if (operand.projectionName === oldName) {
    return { ...operand, projectionName: newName };
  }
  return operand;
}

function rewriteReferences(kind, body, targetKind, oldName, newName) {
  const next = JSON.parse(JSON.stringify(body));
  switch (kind) {
    case 'event-definition':
      if (targetKind === 'custom-type-definition') {
        for (const p of next.properties || []) {
          if (p.propertyType === oldName) p.propertyType = newName;
        }
      }
      break;
    case 'projection-definition':
      if (targetKind === 'custom-type-definition') {
        if (next.partition === oldName) next.partition = newName;
        if (next.projectionType === oldName) next.projectionType = newName;
      }
      if (targetKind === 'event-definition') {
        if (next.handlers && oldName in next.handlers) {
          const code = next.handlers[oldName];
          delete next.handlers[oldName];
          next.handlers[newName] = code;
        }
      }
      break;
    case 'constraint-definition':
      if (targetKind === 'custom-type-definition') {
        for (const p of next.properties || []) {
          if (p.propertyType === oldName) p.propertyType = newName;
        }
      }
      if (targetKind === 'projection-definition' && next.condition) {
        next.condition.leftHandSide = rewriteOperand(next.condition.leftHandSide, oldName, newName);
        next.condition.rightHandSide = rewriteOperand(next.condition.rightHandSide, oldName, newName);
      }
      break;
    case 'command-definition':
      if (targetKind === 'custom-type-definition') {
        for (const p of next.properties || []) {
          if (p.propertyType === oldName) p.propertyType = newName;
        }
      }
      if (targetKind === 'event-definition') {
        next.publishes = (next.publishes || []).map((e) => (e === oldName ? newName : e));
      }
      if (targetKind === 'constraint-definition') {
        next.constraints = (next.constraints || []).map((c) => (c === oldName ? newName : c));
      }
      break;
  }
  return next;
}

function findReferencers(ctx, targetKind, targetName) {
  const out = [];
  for (const referrerKind of DEF_KINDS) {
    const coll = ctx[DEF_COLLECTIONS[referrerKind]];
    for (const [name, body] of Object.entries(coll)) {
      const refs = computeReferences(referrerKind, body);
      if (refs[targetKind].includes(targetName)) {
        out.push({ kind: referrerKind, name, body });
      }
    }
  }
  return out;
}

// ============================================================
// Commands — DCB-style consult-and-check, then append.
// ============================================================

class DomainError extends Error {
  constructor(message) {
    super(message);
    this.name = 'DomainError';
  }
}

function validateName(value, label = 'Name') {
  const trimmed = (value || '').trim();
  if (!trimmed) throw new DomainError(`${label} must not be empty.`);
  if (!PASCAL_RE.test(trimmed)) {
    throw new DomainError(`${label} must be PascalCase (e.g. "CourseDefined") — got "${trimmed}".`);
  }
  if (trimmed.length > 100) throw new DomainError(`${label} must be 100 characters or fewer.`);
  return trimmed;
}

function validateContextName(value) {
  const trimmed = (value || '').trim();
  if (!trimmed) throw new DomainError('Context name must not be empty.');
  return trimmed;
}

// Context lifecycle ------------------------------------------------------

function createDcbContext(name) {
  const trimmed = validateContextName(name);
  const id = generateId();
  appendEvents([{ type: 'dcb-context-created', data: { 'dcb-context-id': id, name: trimmed } }]);
  return id;
}

function renameDcbContext(id, newName) {
  const trimmed = validateContextName(newName);
  const state = projectState();
  if (!state[id]) throw new DomainError('Context does not exist.');
  appendEvents([{ type: 'dcb-context-renamed', data: { 'dcb-context-id': id, name: trimmed } }]);
}

function deleteDcbContext(id) {
  const state = projectState();
  if (!state[id]) throw new DomainError('Context does not exist.');
  appendEvents([{ type: 'dcb-context-deleted', data: { 'dcb-context-id': id } }]);
}

// Definitions ------------------------------------------------------------

function getCtxOrThrow(ctxId) {
  const state = projectState();
  const ctx = state[ctxId];
  if (!ctx) throw new DomainError('Context does not exist (it may have been deleted).');
  return ctx;
}

function validateReferences(ctx, kind, body) {
  const refs = computeReferences(kind, body);
  for (const targetKind of DEF_KINDS) {
    const coll = ctx[DEF_COLLECTIONS[targetKind]];
    for (const targetName of refs[targetKind]) {
      if (!(targetName in coll)) {
        throw new DomainError(
          `Reference does not resolve: ${humanize(targetKind)} "${targetName}" does not exist in this context.`
        );
      }
    }
  }
  // Schema-driven extra check: projection.partition must be a custom-type with isTag=true.
  if (kind === 'projection-definition' && body && body.partition) {
    const tag = ctx['custom-type-definitions'][body.partition];
    if (tag && tag.isTag !== true) {
      throw new DomainError(
        `Projection partition must reference a custom type with isTag=true; "${body.partition}" is not a tag.`
      );
    }
  }
}

function addDefinition(kind, ctxId, name, body) {
  const ctx = getCtxOrThrow(ctxId);
  const trimmed = validateName(name, `${humanize(kind)} name`);
  const coll = ctx[DEF_COLLECTIONS[kind]];
  if (trimmed in coll) {
    throw new DomainError(`A ${humanize(kind)} named "${trimmed}" already exists in this context.`);
  }
  validateReferences(ctx, kind, body);
  appendEvents([{ type: `${kind}-added`, data: { 'dcb-context-id': ctxId, name: trimmed, body } }]);
}

function updateDefinition(kind, ctxId, name, body) {
  const ctx = getCtxOrThrow(ctxId);
  const coll = ctx[DEF_COLLECTIONS[kind]];
  if (!(name in coll)) {
    throw new DomainError(`No ${humanize(kind)} named "${name}" exists in this context.`);
  }
  validateReferences(ctx, kind, body);
  appendEvents([{ type: `${kind}-updated`, data: { 'dcb-context-id': ctxId, name, body } }]);
}

function renameDefinition(kind, ctxId, previousName, newName) {
  const ctx = getCtxOrThrow(ctxId);
  const trimmed = validateName(newName, `New ${humanize(kind)} name`);
  const coll = ctx[DEF_COLLECTIONS[kind]];
  if (!(previousName in coll)) {
    throw new DomainError(`No ${humanize(kind)} named "${previousName}" exists in this context.`);
  }
  if (trimmed === previousName) return;
  if (trimmed in coll) {
    throw new DomainError(`A ${humanize(kind)} named "${trimmed}" already exists in this context.`);
  }

  const referencers = findReferencers(ctx, kind, previousName);
  const events = [{
    type: `${kind}-renamed`,
    data: { 'dcb-context-id': ctxId, 'previous-name': previousName, name: trimmed },
  }];
  for (const ref of referencers) {
    const rewritten = rewriteReferences(ref.kind, ref.body, kind, previousName, trimmed);
    events.push({
      type: `${ref.kind}-updated`,
      data: { 'dcb-context-id': ctxId, name: ref.name, body: rewritten },
    });
  }
  appendEvents(events);
}

function removeDefinition(kind, ctxId, name) {
  const ctx = getCtxOrThrow(ctxId);
  const coll = ctx[DEF_COLLECTIONS[kind]];
  if (!(name in coll)) {
    throw new DomainError(`No ${humanize(kind)} named "${name}" exists in this context.`);
  }
  const referencers = findReferencers(ctx, kind, name);
  if (referencers.length > 0) {
    const list = referencers.map((r) => `${humanize(r.kind)} "${r.name}"`).join(', ');
    throw new DomainError(`Cannot remove ${humanize(kind)} "${name}" — still referenced by: ${list}.`);
  }
  appendEvents([{ type: `${kind}-removed`, data: { 'dcb-context-id': ctxId, name } }]);
}

const ui = { view: 'list', selectedContextId: null };

function navigateToList() { ui.view = 'list'; ui.selectedContextId = null; render(); }
function navigateToContext(id) { ui.view = 'detail'; ui.selectedContextId = id; render(); }

// ============================================================
// DOM helpers.
// ============================================================
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.setAttribute('style', v);
    else if (k.startsWith('on') && typeof v === 'function') el[k.toLowerCase()] = v;
    else if (k === 'value') el.value = v == null ? '' : v;
    else if (k === 'checked') el.checked = !!v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    if (typeof child === 'string' || typeof child === 'number') {
      el.appendChild(document.createTextNode(String(child)));
    } else {
      el.appendChild(child);
    }
  }
  return el;
}

function showToast(message) {
  const container = document.getElementById('toast-container');
  container.innerHTML = '';
  const toast = h('div', { class: 'toast' }, message);
  container.appendChild(toast);
  setTimeout(() => { if (container.contains(toast)) container.removeChild(toast); }, 4000);
}

function runCommand(fn) {
  try {
    const result = fn();
    render();
    return result;
  } catch (err) {
    if (err instanceof DomainError) showToast(err.message);
    else { console.error(err); showToast('Unexpected error: ' + err.message); }
  }
}

function humanize(kind) {
  return kind.split('-').map((s) => s[0].toUpperCase() + s.slice(1)).join(' ');
}

// ============================================================
// Modal helpers.
// ============================================================
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function openModal(buildContent) {
  // buildContent is a function returning an array of nodes — called whenever the modal re-renders.
  const container = document.getElementById('modal-container');
  container.innerHTML = '';
  function rerender() {
    const inner = h('div', { class: 'modal' }, buildContent(rerender));
    backdrop.innerHTML = '';
    backdrop.appendChild(inner);
  }
  const backdrop = h('div', {
    class: 'modal-backdrop',
    onclick: (e) => { if (e.target === backdrop) closeModal(); },
  });
  container.appendChild(backdrop);
  rerender();
}

function promptModal({ title, label, value = '', confirmLabel, onConfirm }) {
  let current = value;
  openModal(() => {
    const errorEl = h('div', { class: 'error', style: 'display:none' });
    const input = h('input', {
      type: 'text',
      value: current,
      oninput: (e) => { current = e.target.value; },
      onkeydown: (e) => { if (e.key === 'Enter') submit(); },
    });
    function submit() {
      try { onConfirm(current); closeModal(); }
      catch (err) {
        if (err instanceof DomainError) { errorEl.textContent = err.message; errorEl.style.display = 'block'; }
        else throw err;
      }
    }
    setTimeout(() => input.focus(), 0);
    return [
      h('h3', {}, title),
      errorEl,
      h('div', { class: 'form-row' }, h('label', {}, label), input),
      h('div', { class: 'actions' },
        h('button', { class: 'btn btn-ghost', onclick: closeModal }, 'Cancel'),
        h('button', { class: 'btn', onclick: submit }, confirmLabel)),
    ];
  });
}

function confirmModal({ title, body, confirmLabel, destructive, onConfirm }) {
  openModal(() => [
    h('h3', {}, title),
    h('p', {}, body),
    h('div', { class: 'actions' },
      h('button', { class: 'btn btn-ghost', onclick: closeModal }, 'Cancel'),
      h('button', {
        class: 'btn' + (destructive ? ' btn-danger' : ''),
        onclick: () => { onConfirm(); closeModal(); },
      }, confirmLabel)),
  ]);
}

// ============================================================
// Form components.
// ============================================================

function labeled(labelText, hint, ...children) {
  const lbl = h('label', {}, labelText, hint ? h('span', { class: 'hint' }, hint) : null);
  return h('div', { class: 'form-row' }, lbl, ...children);
}

function textInput({ value, oninput, placeholder }) {
  return h('input', {
    type: 'text',
    value: value == null ? '' : value,
    placeholder: placeholder || '',
    oninput: (e) => oninput(e.target.value),
  });
}

function checkboxInput({ value, onchange, label }) {
  const cb = h('input', { type: 'checkbox', checked: !!value, onchange: (e) => onchange(e.target.checked) });
  return h('label', { class: 'inline-check' }, cb, label);
}

function selectInput({ value, options, onchange, placeholder }) {
  const sel = h('select', { onchange: (e) => onchange(e.target.value || '') });
  sel.appendChild(h('option', { value: '' }, placeholder || '— select —'));
  for (const opt of options) {
    const optEl = h('option', { value: opt.value }, opt.label || opt.value);
    if (opt.value === value) optEl.selected = true;
    sel.appendChild(optEl);
  }
  return sel;
}

function textareaInput({ value, oninput, rows }) {
  return h('textarea', {
    rows: rows || 4,
    oninput: (e) => oninput(e.target.value),
  }, value == null ? '' : value);
}

// Property list editor — used by event, constraint, command bodies.
function propertyListEditor({ properties, customTypes, rerender }) {
  properties = properties || [];
  const typeOptions = [
    ...SIMPLE_TYPES.map((t) => ({ value: t, label: t })),
    ...customTypes.map((t) => ({ value: t, label: t })),
  ];
  const rows = properties.length === 0
    ? [h('div', { class: 'empty-rows' }, 'No properties — click + Add property to add one.')]
    : properties.map((prop, idx) => {
        return h('div', { class: 'row-list-row' },
          textInput({
            value: prop.name,
            placeholder: 'propertyName',
            oninput: (v) => { prop.name = v; },
          }),
          selectInput({
            value: prop.propertyType,
            options: typeOptions,
            onchange: (v) => { prop.propertyType = v; },
            placeholder: '— type —',
          }),
          checkboxInput({
            value: prop.isOptional,
            onchange: (v) => { prop.isOptional = v; },
            label: 'optional',
          }),
          checkboxInput({
            value: prop.isList,
            onchange: (v) => { prop.isList = v; },
            label: 'list',
          }),
          h('button', { class: 'btn btn-xs btn-danger', onclick: () => { properties.splice(idx, 1); rerender(); } }, '×')
        );
      });
  rows.push(h('button', {
    class: 'btn btn-xs btn-secondary add-row',
    onclick: () => { properties.push({ name: '', propertyType: '', isOptional: false, isList: false }); rerender(); }
  }, '+ Add property'));
  return h('div', { class: 'row-list' }, rows);
}

// Handler list editor — for projection.handlers (event-name -> code string).
function handlerListEditor({ handlers, eventNames, rerender }) {
  // handlers is an object — we work with entries.
  const entries = Object.entries(handlers || {});
  const eventOptions = eventNames.map((e) => ({ value: e, label: e }));
  const rows = entries.length === 0
    ? [h('div', { class: 'empty-rows' }, 'No handlers — click + Add handler to add one.')]
    : entries.map(([evName, code], idx) => {
        return h('div', { class: 'handler-row' },
          selectInput({
            value: evName,
            options: eventOptions,
            placeholder: '— event —',
            onchange: (v) => {
              if (v === evName) return;
              const newHandlers = {};
              for (const [k, val] of Object.entries(handlers)) {
                if (k === evName) newHandlers[v || ''] = val;
                else newHandlers[k] = val;
              }
              // Remove temp empty-string key if user picked nothing meaningful
              for (const k of Object.keys(handlers)) delete handlers[k];
              for (const [k, val] of Object.entries(newHandlers)) handlers[k] = val;
              rerender();
            },
          }),
          textareaInput({
            value: code,
            rows: 2,
            oninput: (v) => { handlers[evName] = v; },
          }),
          h('button', { class: 'btn btn-xs btn-danger remove-btn', onclick: () => { delete handlers[evName]; rerender(); } }, '×')
        );
      });
  rows.push(h('button', {
    class: 'btn btn-xs btn-secondary add-row',
    onclick: () => {
      // Add a placeholder slot. The user picks an event and gives it code.
      // Use a unique placeholder key so we don't collide.
      let key = '';
      for (let i = 1; key in handlers || key === ''; i++) key = `__new_${i}`;
      handlers[key] = '';
      rerender();
    }
  }, '+ Add handler'));
  return h('div', { class: 'row-list' }, rows);
}

function checkboxList({ available, selected, onchange }) {
  if (available.length === 0) {
    return h('div', { class: 'checkbox-list' },
      h('div', { class: 'empty' }, 'Nothing to choose from yet.'));
  }
  const set = new Set(selected || []);
  const labels = available.map((name) => {
    const cb = h('input', {
      type: 'checkbox',
      value: name,
      checked: set.has(name),
      onchange: (e) => {
        if (e.target.checked) set.add(name); else set.delete(name);
        onchange([...set]);
      },
    });
    return h('label', {}, cb, h('span', {}, name));
  });
  return h('div', { class: 'checkbox-list' }, labels);
}

// Operand editor — reads/writes via getter/setter so the parent owns the value
// (the operand may be a primitive, an object, or null, so swapping types
// requires replacing the whole reference).
function operandEditor2({ get, set, ownProperties, ctx, rerender }) {
  const cur = get();
  let source;
  if (cur == null) source = 'parameter';
  else if (typeof cur !== 'object') source = 'static';
  else if (cur.projectionName !== undefined) source = 'projection-result';
  else if (cur.parameterName !== undefined) source = 'parameter';
  else source = 'parameter';

  const propertyOptions = ownProperties
    .filter((p) => p.name && CAMEL_RE.test(p.name))
    .map((p) => ({ value: p.name, label: p.name }));
  const projectionOptions = Object.keys(ctx['projection-definitions']).sort()
    .map((n) => ({ value: n, label: n }));

  const rows = [];

  rows.push(h('div', { class: 'row' },
    h('label', {}, 'Source'),
    selectInput({
      value: source,
      options: [
        { value: 'parameter', label: 'Parameter' },
        { value: 'projection-result', label: 'Projection result' },
        { value: 'static', label: 'Static value' },
      ],
      onchange: (v) => {
        if (v === 'parameter') set({ parameterName: '' });
        else if (v === 'projection-result') set({ projectionName: '', parameterName: '' });
        else set('');
        rerender();
      },
    })
  ));

  if (source === 'parameter') {
    rows.push(h('div', { class: 'row' },
      h('label', {}, 'Parameter name'),
      selectInput({
        value: cur && cur.parameterName || '',
        options: propertyOptions,
        placeholder: '— pick a property —',
        onchange: (v) => { set({ parameterName: v }); rerender(); },
      })
    ));
  } else if (source === 'projection-result') {
    rows.push(h('div', { class: 'row' },
      h('label', {}, 'Projection'),
      selectInput({
        value: cur && cur.projectionName || '',
        options: projectionOptions,
        placeholder: '— pick a projection —',
        onchange: (v) => { const next = { ...cur, projectionName: v }; set(next); rerender(); },
      })
    ));
    rows.push(h('div', { class: 'row' },
      h('label', {}, 'Parameter name (binding)'),
      selectInput({
        value: cur && cur.parameterName || '',
        options: propertyOptions,
        placeholder: '— pick a property —',
        onchange: (v) => { const next = { ...cur, parameterName: v }; set(next); rerender(); },
      })
    ));
  } else if (source === 'static') {
    rows.push(h('div', { class: 'row' },
      h('label', {}, 'Value', h('span', { class: 'hint' }, '— "true"/"false"/numbers will be parsed accordingly')),
      textInput({
        value: cur == null ? '' : String(cur),
        oninput: (v) => {
          if (v === 'true') set(true);
          else if (v === 'false') set(false);
          else if (v !== '' && !isNaN(Number(v))) set(Number(v));
          else set(v);
        },
      })
    ));
  }

  return h('div', { class: 'operand-editor' }, rows);
}

function conditionEditor({ condition, ownProperties, ctx, rerender }) {
  // condition may be undefined (treat as new unary).
  if (!condition) condition = { leftHandSide: { parameterName: '' }, predicate: 'isEmpty' };

  const isBinary = condition.rightHandSide !== undefined;
  const predicateOptions = (isBinary ? BINARY_PREDICATES : UNARY_PREDICATES).map((p) => ({ value: p, label: p }));

  const rows = [];

  rows.push(h('div', { class: 'field-row' },
    h('label', {}, 'Type'),
    selectInput({
      value: isBinary ? 'binary' : 'unary',
      options: [
        { value: 'unary', label: 'Unary (1 operand)' },
        { value: 'binary', label: 'Binary (2 operands)' },
      ],
      onchange: (v) => {
        if (v === 'binary' && !isBinary) {
          condition.rightHandSide = { parameterName: '' };
          condition.predicate = 'equals';
        } else if (v === 'unary' && isBinary) {
          delete condition.rightHandSide;
          condition.predicate = 'isEmpty';
        }
        rerender();
      },
    })
  ));

  rows.push(h('div', { class: 'field-row' },
    h('label', {}, 'Left operand'),
    operandEditor2({
      get: () => condition.leftHandSide,
      set: (v) => { condition.leftHandSide = v; },
      ownProperties, ctx, rerender,
    })
  ));

  rows.push(h('div', { class: 'field-row' },
    h('label', {}, 'Predicate'),
    selectInput({
      value: condition.predicate,
      options: predicateOptions,
      onchange: (v) => { condition.predicate = v; rerender(); },
    })
  ));

  if (isBinary) {
    rows.push(h('div', { class: 'field-row' },
      h('label', {}, 'Right operand'),
      operandEditor2({
        get: () => condition.rightHandSide,
        set: (v) => { condition.rightHandSide = v; },
        ownProperties, ctx, rerender,
      })
    ));
  }

  return { node: h('div', { class: 'condition-builder' }, rows), normalised: condition };
}

// ============================================================

// shared `state` object passed from the definitionEditor frame.

function customTypeForm({ state, ctx, rerender }) {

}

function eventForm({ state, ctx, rerender }) {
  const customTypes = Object.keys(ctx['custom-type-definitions']).sort();
  return [
    labeled('Properties', '',
      propertyListEditor({ properties: state.properties, customTypes, rerender })

}

function projectionForm({ state, ctx, rerender }) {
  const customTypes = Object.keys(ctx['custom-type-definitions']).sort();
  const tagTypes = customTypes.filter((n) => ctx['custom-type-definitions'][n].isTag === true);
  const eventNames = Object.keys(ctx['event-definitions']).sort();
  return [
    labeled('Partition', '— must be a custom type with isTag=true',

        value: state.partition,

    ),
    labeled('Projection type', '— simple type or custom type',
      selectInput({
        value: state.projectionType,
        options: [
          ...SIMPLE_TYPES.map((t) => ({ value: t, label: t })),
          ...customTypes.map((t) => ({ value: t, label: t })),
        ],
        placeholder: '— pick a type —',
        onchange: (v) => { state.projectionType = v; },
      })
    ),
    labeled('Flags', '',
      h('div', {},
        checkboxInput({
          value: state.isOptional,
          onchange: (v) => { state.isOptional = v; },
          label: 'isOptional',
        }),
        checkboxInput({
          value: state.isList,
          onchange: (v) => { state.isList = v; },
          label: 'isList',
        })
      )
    ),
    labeled('Initial state', '— string expression (e.g. "null", "0", "[]")',
      textInput({
        value: state.initialState,
        placeholder: 'null',
        oninput: (v) => { state.initialState = v; },
      })
    ),
    labeled('Handlers', '— map an event onto a state-update expression',
      handlerListEditor({ handlers: state.handlers, eventNames, rerender })
    ),
  ];
}

function constraintForm({ state, ctx, rerender }) {
  const customTypes = Object.keys(ctx['custom-type-definitions']).sort();
  const conditionRes = conditionEditor({
    condition: state.condition,
    ownProperties: state.properties,
    ctx,
    rerender,
  });
  state.condition = conditionRes.normalised;
  return [
    labeled('Properties', '— the parameters the constraint accepts',
      propertyListEditor({ properties: state.properties, customTypes, rerender })
    ),
    labeled('Condition', '',
      conditionRes.node
    ),
  ];
}

function commandForm({ state, ctx, rerender }) {
  const customTypes = Object.keys(ctx['custom-type-definitions']).sort();
  const constraintNames = Object.keys(ctx['constraint-definitions']).sort();
  const eventNames = Object.keys(ctx['event-definitions']).sort();
  return [
    labeled('Properties', '— the command payload',
      propertyListEditor({ properties: state.properties, customTypes, rerender })
    ),
    labeled('Constraints', '— the constraints that must hold (the DCB consult surface)',
      checkboxList({
        available: constraintNames,
        selected: state.constraints,
        onchange: (next) => { state.constraints = next; },
      })
    ),
    labeled('Publishes', '— events emitted on success (at least one required)',
      checkboxList({
        available: eventNames,
        selected: state.publishes,
        onchange: (next) => { state.publishes = next; },
      })
    ),
  ];
}

// ============================================================
// Definition editor: dispatch per kind, build form, save.
// ============================================================

function initialBodyForKind(kind) {
  if (kind === 'custom-type-definition') return { schema: { type: 'string' }, isTag: false };
  if (kind === 'event-definition') return { properties: [] };
  if (kind === 'projection-definition') return {
    partition: '', projectionType: '', isOptional: false, isList: false,
    initialState: '', handlers: {},
  };
  if (kind === 'constraint-definition') return {
    properties: [],
    condition: { leftHandSide: { parameterName: '' }, predicate: 'isEmpty' },
  };
  if (kind === 'command-definition') return { properties: [], constraints: [], publishes: [] };
  return {};
}

function bodyToState(kind, body) {
  if (kind === 'custom-type-definition') {
    return {
      schemaText: JSON.stringify(body.schema == null ? { type: 'string' } : body.schema, null, 2),
      isTag: !!body.isTag,
    };
  }
  if (kind === 'event-definition') {
    return { properties: deepClone(body.properties || []) };
  }
  if (kind === 'projection-definition') {
    return {
      partition: body.partition || '',
      projectionType: body.projectionType || '',
      isOptional: !!body.isOptional,
      isList: !!body.isList,
      initialState: body.initialState || '',
      handlers: deepClone(body.handlers || {}),
    };
  }
  if (kind === 'constraint-definition') {
    return {
      properties: deepClone(body.properties || []),
      condition: deepClone(body.condition || { leftHandSide: { parameterName: '' }, predicate: 'isEmpty' }),
    };
  }
  if (kind === 'command-definition') {
    return {
      properties: deepClone(body.properties || []),
      constraints: [...(body.constraints || [])],
      publishes: [...(body.publishes || [])],
    };
  }
  return {};
}

function stateToBody(kind, state) {
  if (kind === 'custom-type-definition') {
    let schema;
    try { schema = JSON.parse((state.schemaText || '').trim() || '{}'); }
    catch (e) { throw new DomainError('Schema is not valid JSON: ' + e.message); }
    if (typeof schema !== 'object' || schema === null) throw new DomainError('Schema must be a JSON object.');
    return { schema, isTag: !!state.isTag };
  }
  if (kind === 'event-definition') {
    return { properties: cleanProperties(state.properties) };
  }
  if (kind === 'projection-definition') {
    if (!state.partition) throw new DomainError('Projection must have a partition.');
    if (!state.projectionType) throw new DomainError('Projection must have a projectionType.');
    if (state.initialState == null || state.initialState === '') {
      throw new DomainError('Projection must have an initialState.');
    }
    return {
      partition: state.partition,
      projectionType: state.projectionType,
      isOptional: !!state.isOptional,
      isList: !!state.isList,
      initialState: state.initialState,
      handlers: cleanHandlers(state.handlers),
    };
  }
  if (kind === 'constraint-definition') {
    const cond = state.condition;
    if (!cond || !cond.predicate || !cond.leftHandSide) {
      throw new DomainError('Constraint must have a condition with a left operand and a predicate.');
    }
    return { properties: cleanProperties(state.properties), condition: cond };
  }
  if (kind === 'command-definition') {
    if (!state.publishes || state.publishes.length === 0) {
      throw new DomainError('Command must publish at least one event.');
    }
    return {
      properties: cleanProperties(state.properties),
      constraints: [...state.constraints],
      publishes: [...state.publishes],
    };
  }
  return {};
}

function cleanProperties(props) {
  const cleaned = [];
  for (const p of (props || [])) {
    if (!p.name && !p.propertyType) continue;
    if (!p.name) throw new DomainError('Property is missing a name.');
    if (!CAMEL_RE.test(p.name)) {
      throw new DomainError(`Property name "${p.name}" must be camelCase.`);
    }
    if (!p.propertyType) {
      throw new DomainError(`Property "${p.name}" is missing a type.`);
    }
    cleaned.push({
      name: p.name,
      propertyType: p.propertyType,
      isOptional: !!p.isOptional,
      isList: !!p.isList,
    });
  }
  return cleaned;
}

function cleanHandlers(handlers) {
  const cleaned = {};
  for (const [k, v] of Object.entries(handlers || {})) {
    if (k.startsWith('__new_')) {
      // skip placeholder slot the user didn't fill in
      continue;
    }
    if (!k) continue;
    if (!PASCAL_RE.test(k)) {
      throw new DomainError(`Handler event name "${k}" must be PascalCase.`);
    }
    cleaned[k] = v || '';
  }
  return cleaned;
}

function deepClone(v) { return JSON.parse(JSON.stringify(v)); }

function definitionEditor({ mode, kind, ctxId, existingName, existingBody }) {
  // mode: 'add' | 'edit' | 'rename'
  const ctx = projectState()[ctxId];
  if (!ctx) { showToast('Context not found.'); return; }

  let nameValue = mode === 'rename' ? existingName : (mode === 'edit' ? existingName : '');
  const state = bodyToState(kind, existingBody || initialBodyForKind(kind));

  const titles = { add: `Add ${humanize(kind)}`, edit: `Edit ${humanize(kind)}`, rename: `Rename ${humanize(kind)}` };
  const example = nameExample(kind);

  openModal((rerender) => {
    const errorEl = h('div', { class: 'error', style: 'display:none' });
    function showErr(msg) { errorEl.textContent = msg; errorEl.style.display = 'block'; }

    const rows = [h('h3', {}, titles[mode]), errorEl];

    if (mode !== 'edit') {
      rows.push(labeled(
        `${humanize(kind)} name`,
        `— PascalCase, e.g. "${example}"`,
        textInput({
          value: nameValue,
          placeholder: example,
          oninput: (v) => { nameValue = v; },
        })
      ));
    }

    if (mode !== 'rename') {
      // Build the per-kind form.
      const fresh = projectState()[ctxId] || ctx;
      const formRows = renderFormForKind(kind, { state, ctx: fresh, rerender });
      rows.push(...formRows);
    }

    function submit() {
      try {
        if (mode === 'add') {
          const body = stateToBody(kind, state);
          runCommand(() => addDefinition(kind, ctxId, nameValue, body));
        } else if (mode === 'edit') {
          const body = stateToBody(kind, state);
          runCommand(() => updateDefinition(kind, ctxId, existingName, body));
        } else if (mode === 'rename') {
          runCommand(() => renameDefinition(kind, ctxId, existingName, nameValue));
        }
        closeModal();
      } catch (err) {
        if (err instanceof DomainError) showErr(err.message); else throw err;
      }
    }

    rows.push(h('div', { class: 'actions' },
      h('button', { class: 'btn btn-ghost', onclick: closeModal }, 'Cancel'),
      h('button', { class: 'btn', onclick: submit }, 'Save')
    ));

    return rows;
  });
}

function renderFormForKind(kind, args) {
  switch (kind) {
    case 'custom-type-definition': return customTypeForm(args);
    case 'event-definition': return eventForm(args);
    case 'projection-definition': return projectionForm(args);
    case 'constraint-definition': return constraintForm(args);
    case 'command-definition': return commandForm(args);
  }
  return [];
}

function nameExample(kind) {
  return {
    'custom-type-definition': 'CourseId',
    'event-definition': 'CourseDefined',
    'projection-definition': 'CourseCapacity',
    'constraint-definition': 'CourseExists',
    'command-definition': 'SubscribeStudentToCourse',
  }[kind];
}

// ============================================================
// Rendering.
// ============================================================
function render() {
  renderBreadcrumb();
  const root = document.getElementById('root');
  root.innerHTML = '';
  if (ui.view === 'list') root.appendChild(renderListView());
  else if (ui.view === 'detail') root.appendChild(renderDetailView());
}

function renderBreadcrumb() {
  const nav = document.getElementById('breadcrumb');
  nav.innerHTML = '';
  if (ui.view === 'list') { nav.textContent = 'Contexts'; return; }
  const state = projectState();
  const ctx = state[ui.selectedContextId];
  nav.appendChild(h('a', { onclick: navigateToList }, 'Contexts'));
  nav.appendChild(document.createTextNode(' / '));
  nav.appendChild(document.createTextNode(ctx ? ctx.name : '(deleted)'));
}

function renderListView() {
  const state = projectState();
  const contexts = Object.values(state).sort((a, b) => a.name.localeCompare(b.name));

  const newButton = h('button', {
    class: 'btn',
    onclick: () => promptModal({
      title: 'New DCB Context',
      label: 'Context name',
      confirmLabel: 'Create',
      onConfirm: (val) => {
        const id = createDcbContext(val);
        render();
        navigateToContext(id);
      },
    }),
  }, '+ New Context');

  if (contexts.length === 0) {
    return h('div', {},
      h('div', { class: 'page-header' }, h('h2', {}, 'DCB Contexts'), renderLegend()),
      h('div', { class: 'empty-state' },
        h('h2', {}, 'No contexts yet'),
        h('p', {}, 'Create your first DCB Context to start modeling.'),
        newButton)
    );
  }

  return h('div', {},
    h('div', { class: 'page-header' },
      h('h2', {}, 'DCB Contexts'),
      h('div', { style: 'display:flex; gap:16px; align-items:center;' }, renderLegend(), newButton)
    ),
    h('div', { class: 'context-list' }, contexts.map(renderContextCard))
  );
}

function renderLegend() {
  return h('div', { class: 'legend' },
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-command)' }), 'Commands'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-event)' }), 'Events'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-projection)' }), 'Projections'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-constraint)' }), 'Constraints'),
    h('span', {}, h('span', { class: 'legend-swatch', style: 'background:var(--color-custom-type)' }), 'Custom Types')
  );
}

function renderContextCard(ctx) {
  return h('div', { class: 'context-card' },
    h('h3', { onclick: () => navigateToContext(ctx.id) }, ctx.name),
    h('div', { class: 'counts' },
      h('span', { class: 'count-pill pill-custom-type' }, String(Object.keys(ctx['custom-type-definitions']).length), ' types'),
      h('span', { class: 'count-pill pill-event' }, String(Object.keys(ctx['event-definitions']).length), ' events'),
      h('span', { class: 'count-pill pill-projection' }, String(Object.keys(ctx['projection-definitions']).length), ' projections'),
      h('span', { class: 'count-pill pill-constraint' }, String(Object.keys(ctx['constraint-definitions']).length), ' constraints'),
      h('span', { class: 'count-pill pill-command' }, String(Object.keys(ctx['command-definitions']).length), ' commands')
    ),
    h('div', { class: 'actions' },
      h('button', { class: 'btn btn-sm', onclick: () => navigateToContext(ctx.id) }, 'Open'),
      h('button', {
        class: 'btn btn-sm btn-ghost',
        onclick: () => promptModal({
          title: 'Rename Context',
          label: 'New name',
          value: ctx.name,
          confirmLabel: 'Rename',
          onConfirm: (val) => runCommand(() => renameDcbContext(ctx.id, val)),
        }),
      }, 'Rename'),
      h('button', {
        class: 'btn btn-sm btn-danger',
        onclick: () => confirmModal({
          title: 'Delete Context',
          body: `Delete "${ctx.name}"? Its events stay in the log (this is a soft delete).`,
          confirmLabel: 'Delete',
          destructive: true,
          onConfirm: () => runCommand(() => deleteDcbContext(ctx.id)),
        }),
      }, 'Delete')
    )
  );
}

function renderDetailView() {
  const state = projectState();
  const ctx = state[ui.selectedContextId];
  if (!ctx) {
    return h('div', { class: 'empty-state' },
      h('h2', {}, 'Context not found'),
      h('p', {}, 'It may have been deleted.'),
      h('button', { class: 'btn', onclick: navigateToList }, 'Back to contexts'));
  }

  return h('div', {},
    h('div', { class: 'detail-header' },
      h('h2', {}, ctx.name),
      h('div', { class: 'actions' },
        h('button', {
          class: 'btn btn-sm btn-ghost',
          onclick: () => promptModal({
            title: 'Rename Context',
            label: 'New name',
            value: ctx.name,
            confirmLabel: 'Rename',
            onConfirm: (val) => runCommand(() => renameDcbContext(ctx.id, val)),
          }),
        }, 'Rename Context'),
        h('button', {
          class: 'btn btn-sm btn-danger',
          onclick: () => confirmModal({
            title: 'Delete Context',
            body: `Delete "${ctx.name}"? Its events stay in the log.`,
            confirmLabel: 'Delete',
            destructive: true,
            onConfirm: () => { runCommand(() => deleteDcbContext(ctx.id)); navigateToList(); },
          }),
        }, 'Delete Context'))
    ),
    h('div', { class: 'definition-grid' },
      ...DEF_KINDS.map((k) => renderDefinitionSection(ctx, k))
    )
  );
}

function renderDefinitionSection(ctx, kind) {
  const coll = ctx[DEF_COLLECTIONS[kind]];
  const names = Object.keys(coll).sort();

  const addBtn = h('button', {
    class: 'btn btn-sm add-btn',
    onclick: () => definitionEditor({ mode: 'add', kind, ctxId: ctx.id }),
  }, '+ Add');

  const body = h('div', { class: 'body' });
  if (names.length === 0) {
    body.appendChild(h('div', { class: 'empty' }, `No ${humanize(kind)}s yet.`));
  } else {
    for (const name of names) body.appendChild(renderDefinitionCard(ctx, kind, name, coll[name]));
  }

  return h('section', { class: `definition-section ${KIND_COLOR_CLASS[kind]}` },
    h('div', { class: 'section-header' },
      h('h3', {}, humanize(kind) + 's'),
      addBtn
    ),
    body
  );
}

function renderDefinitionCard(ctx, kind, name, body) {
  // Summary line — tiny human hint of what the body holds.
  const summary = summariseBody(kind, body);
  const refs = computeReferences(kind, body);

  const refChips = [];
  for (const targetKind of DEF_KINDS) {
    for (const n of refs[targetKind]) {
      refChips.push(h('span', { class: `ref-chip ${targetKind}` }, n));
    }
  }

  return h('div', { class: 'definition-card' },
    h('div', { class: 'name' }, name),
    summary ? h('div', { class: 'summary' }, summary) : null,
    refChips.length > 0 ? h('div', { class: 'refs' }, refChips) : null,
    h('div', { class: 'actions' },
      h('button', { class: 'btn btn-sm', onclick: () => definitionEditor({ mode: 'edit', kind, ctxId: ctx.id, existingName: name, existingBody: body }) }, 'Edit'),
      h('button', { class: 'btn btn-sm btn-ghost', onclick: () => definitionEditor({ mode: 'rename', kind, ctxId: ctx.id, existingName: name, existingBody: body }) }, 'Rename'),
      h('button', { class: 'btn btn-sm btn-danger', onclick: () => confirmModal({
        title: `Remove ${humanize(kind)}`,
        body: `Remove "${name}"?`,
        confirmLabel: 'Remove',
        destructive: true,
        onConfirm: () => runCommand(() => removeDefinition(kind, ctx.id, name)),
      }) }, 'Remove')
    )
  );
}

function summariseBody(kind, body) {
  if (!body || typeof body !== 'object') return null;
  if (kind === 'custom-type-definition') {
    const isTag = body.isTag ? ', tag' : '';
    const type = body.schema && body.schema.type ? body.schema.type : 'object';
    return `${type}${isTag}`;
  }
  if (kind === 'event-definition') {
    const n = (body.properties || []).length;
    return `${n} ${n === 1 ? 'property' : 'properties'}`;
  }
  if (kind === 'projection-definition') {
    const t = body.projectionType || '?';
    const part = body.partition ? ` by ${body.partition}` : '';
    return `${body.isList ? '[]' : ''}${t}${body.isOptional ? '?' : ''}${part}`;
  }
  if (kind === 'constraint-definition') {
    return body.condition && body.condition.predicate ? `predicate: ${body.condition.predicate}` : null;
  }
  if (kind === 'command-definition') {
    const ps = (body.publishes || []).length;
    const cs = (body.constraints || []).length;
    return `${ps} publishes, ${cs} constraints`;
  }
  return null;
}

// ============================================================
// Boot.
// ============================================================
window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
