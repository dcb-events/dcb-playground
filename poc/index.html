        b.properties.push({
          name: property.name, propertyType: property.propertyType,
          isOptional: property.isOptional, isList: property.isList,
        });
      }
    });
    patchSlice((b) => {
      const e = b.publishes.find((x) => x.name === emission.name);
      e.parameters = e.parameters || {};
      for (const property of properties) e.parameters[property.name] = { parameterName: property.name };
    });
  };

  return h('div', { class: 'fields' },
    rows.length ? rows : h('div', { class: 'empty' }, 'Carries nothing yet.'),
    // The envelope, shown where events are: nobody writes these and
    // nobody can remove them, so they are on the page greyed rather
    // than left as a claim only the schema makes. A handler may read
    // one; a condition may not.
    ...EVENT_METADATA.map((m) => h('div', { class: 'field envelope' },
      h('span', { class: 'nm' }, propertyWords(m.name)),
      h('span', { class: 'muted tiny' }, '← the store'),
      h('span', { class: 'grow', style: 'flex:1' }),
      h('span', { class: 'chip' }, readable(typeLabel(m))),
      h('span', { class: 'muted tiny' }, 'always carried'))),
    missing.length ? h('div', { class: 'copy-missing' },
      h('span', { class: 'muted tiny' }, 'Given but not recorded: '),
      missing.map((p) => h('button', {
        class: 'chip suggest',
        title: 'Add ' + propertyWords(p.name) + ' to this event, carried through unchanged',
        onclick: () => copyFromCommand([p]),
      }, '+ ' + propertyWords(p.name))),
      // The common case — an event that just records what it was given,
      // field for field — is one click rather than one per field.
      missing.length > 1 ? h('button', {
        class: 'chip suggest flow-adder',
        title: `Add all ${missing.length} of these at once, each carried through unchanged`,
        onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
        onclick: () => copyFromCommand(missing),
      }, `+ all ${missing.length}, same as the command`) : null) : null,
    h('div', { class: 'adder', style: 'margin-top:6px' },
      h('button', {
        class: 'btn ghost tiny',
        onclick: () => goToEvent(emission.name),
      }, 'Rename, retype or add fields on ' + readable(emission.name) + ' →')));
}

function stepChanges(ctx, slice) {
  const cards = [];
  for (const { emission, effects } of slice.emits) {
    const rows = effects.map((effect) => {
      const p = effectParts(effect);
      // A scripted handler has no operation/value for this form to
      // pre-fill — it is edited where its code is, via scriptPanel.
      const scripted = effect.handler.code !== undefined;
      return qrow('div', {
        cls: 'row',
        key: 'chg:' + emission.name + ':' + effect.entity + '.' + effect.property.name,
      },
        h('span', { class: 'sentence' },
          entityRef(ctx, effect.entity, { cls: 'op ent', text: p.subject }), ' ',
          h('span', { class: 'verb' }, p.verb), ' ',
          opRef(effect.handler.value, emission.name, p.object)),
        h('span', { class: 'grow' }),
        reveal(
          scripted ? null : h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.changeDraft = draftFromOperand({
                eventName: emission.name,
                target: JSON.stringify([effect.entity, effect.property.name]),
                operation: effect.handler.operation,
              }, 'value', effect.handler.value);
              state.adder = 'chg:' + emission.name;
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger',
            onclick: () => patch('entity-definition', effect.entity, (b) => {
              const prop = b.properties.find((q) => q.name === effect.property.name);
              prop.handlers = prop.handlers.filter((x) => x.event !== emission.name);
            }),
          }, '×')));
    });
    cards.push(h('div', { class: 'card entity' },
      h('div', { class: 'row' }, h('span', { class: 'chip event' },
          h('i', { class: 'ic' }, eventIcon(ctx, emission.name)), readable(emission.name)),
        h('span', { class: 'muted tiny' }, 'changes')),
      h('div', { style: 'margin-top:6px' },
        rows.length ? rows : h('div', { class: 'empty' }, 'Changes nothing we know.')),
      changeAdder(ctx, emission.name)));
  }
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Nothing to change until it records something.'));
  return step('changes', 'Which changes what we know', h('div', {}, cards));
}

function changeAdder(ctx, eventName) {
  const event = ctx['event-definitions'][eventName];

  if (state.newEntityAt === 'changes:' + eventName) {
    return inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => { state.newEntityAt = null; createEntity(ctx, v); },
      onCancel: () => { state.newEntityAt = null; render(); },
    });
  }
  if (!Object.keys(ctx['entity-definitions']).length) {
    return h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'Nothing to change yet.'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'changes:' + eventName; render(); },
      }, '+ New entity'));
  }

  // A scripted property is not offered here: this form writes an
  // operation and an operand, and a scripted property takes neither.
  // Its handlers are edited where its code is.
  const targets = [
    ...Object.entries(ctx['entity-definitions']).flatMap(([name, entity]) =>
      (entity.properties || []).filter((p) => !p.script).map((p) =>
        [JSON.stringify([name, p.name]),
          `${entityIcon(ctx, name)} ${readable(name)} · ${propertyWords(p.name)}`])),
    [NEW, '+ New property…'],
  ];
  // The draft outlives a repaint, which a typed literal needs: the
  // picker rebuilds on every keystroke otherwise.
  const draft = state.changeDraft && state.changeDraft.eventName === eventName
    ? state.changeDraft
    : (state.changeDraft = {
        eventName,
        target: targets.length > 1 ? targets[0][0] : '',
        operation: 'set',
        value: '',
      });

  // What a handler may take in: a property of the event, the value the
  // property already holds, a member of whichever enum the currently
  // targeted property is typed with — not any other enum, which
  // nothing here could ever hold — the one *after* something, or a
  // typed literal.
  const [targetEntity, targetPropertyName] =
    draft.target && draft.target !== NEW ? JSON.parse(draft.target) : [null, null];
  const targetProperty = targetEntity
    ? (ctx['entity-definitions'][targetEntity].properties || []).find((p) => p.name === targetPropertyName)
    : null;
  const targetEnumMembers = targetProperty ? enumMembersFor(ctx, targetProperty.propertyType) : null;
  const values = [
    ...(event ? event.properties : []).flatMap((p) => [
      [JSON.stringify({ eventProperty: p.name }), "the event's " + propertyWords(p.name)],
      [JSON.stringify({ successor: { eventProperty: p.name } }),
        "the one after the event's " + propertyWords(p.name)],
    ]),
    [JSON.stringify({ currentValue: true }), 'its current value'],
    ...(targetEnumMembers || []).map((m) =>
      [JSON.stringify({ enumMember: m }), propertyWords(targetPropertyName) + ' · ' + readable(m)]),
    ...(targetEnumMembers ? [[NEW, '+ New member…']] : []),
  ];
  if (!draft.value) draft.value = values.length ? values[0][0] : '';

  const targetSel = pick(targets, draft.target, (v) => {
    if (v === NEW) { closeForms(); state.addingProp = { eventName }; return render(); }
    draft.target = v;
    render();
  });

  // Once a target and a value are chosen, Enter anywhere in the row
  // records the change — the same as clicking the button.
  const submitChange = () => {
    if (!draft.target || draft.target === NEW) return toast('Pick what changes.', true);
    if (draft.value === NEW) {
      closeForms();
      state.addingMember = { type: targetProperty.propertyType, eventName };
      return render();
    }
    const value = draftOperand(draft, 'value');
    if (value === undefined) return toast('Say what it changes to.', true);
    const [entityName, propertyName] = JSON.parse(draft.target);
    const operation = draft.operation;
    state.changeDraft = null;
    patch('entity-definition', entityName, (b) => {
      const prop = b.properties.find((q) => q.name === propertyName);
      prop.handlers = (prop.handlers || []).filter((x) => x.event !== eventName);
      prop.handlers.push({ event: eventName, operation, value });
    });
  };

  const rows = [adderSlot('chg:' + eventName, 'changes', '+ change', () =>
    h('div', {
      class: 'adder',
      onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); submitChange(); } },
    }, targetSel,
      pick(Object.entries(OPERATION_WORDS), draft.operation, (v) => { draft.operation = v; }),
      ...operandPicker(values, draft, 'value', { allowLiteral: !targetEnumMembers }),
      h('button', { class: 'btn', onclick: submitChange }, '+ Record a change')))];

  if (state.addingProp && state.addingProp.eventName === eventName) rows.push(newPropertyForm(ctx));
  if (state.addingMember && state.addingMember.eventName === eventName) {
    rows.push(addEnumMemberForm(ctx, state.addingMember.type));
  }
  return h('div', {}, rows);
}

// The entity-page mirror of changeAdder's "+ change" form: the target
// property is already known — this is opened from its own card — so
// only the event, operation and operand are asked. Passing `existing`
// opens it pre-filled to edit that handler in place rather than add a
// new one; the event is fixed then, since changing it would leave the
// original handler behind rather than move it.
function entityHandlerAdder(ctx, entityName, property, existing) {
  const key = entityName + '.' + property.name;
  const draft = state.entityHandlerDraft && state.entityHandlerDraft.key === key
    ? state.entityHandlerDraft
    : (state.entityHandlerDraft = existing
        ? draftFromOperand({ key, event: existing.event, operation: existing.operation }, 'value', existing.value)
        : { key, event: '', operation: 'set', value: '' });

  // Only events that actually carry a tag for this entity — anything
  // else could never identify one of its instances.
  const eventNames = Object.keys(ctx['event-definitions'])
    .filter((n) => (ctx['event-definitions'][n].properties || [])
      .some((p) => idLeavesOfType(ctx, p.propertyType)
        .some((leaf) => entityOfIdType(ctx, leaf.identifierType) === entityName)))
    .filter((n) => existing || !(property.handlers || []).some((h) => h.event === n))
    .sort();

  const chosenEventName = existing ? existing.event : draft.event;
  const chosenEvent = ctx['event-definitions'][chosenEventName];
  const values = [
    ...(chosenEvent ? chosenEvent.properties : []).flatMap((p) => [
      [JSON.stringify({ eventProperty: p.name }), "the event's " + propertyWords(p.name)],
      [JSON.stringify({ successor: { eventProperty: p.name } }),
        "the one after the event's " + propertyWords(p.name)],
    ]),
    [JSON.stringify({ currentValue: true }), 'its current value'],
    ...(enumMembersFor(ctx, property.propertyType) || [])
      .map((m) => [JSON.stringify({ enumMember: m }), propertyWords(property.name) + ' · ' + readable(m)]),
  ];
  const propEnumMembers = enumMembersFor(ctx, property.propertyType);

  const close = () => { state.editHandler = null; state.entityHandlerDraft = null; render(); };

  return h('div', { class: 'adder' },
    existing
      ? h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(ctx, existing.event)), readable(existing.event))
      : pick(eventNames.map((n) => [n, eventIcon(ctx, n) + ' ' + readable(n)]), draft.event,
          (v) => { draft.event = v; render(); },
          eventNames.length ? '— which event? —' : '— nothing fits this yet —'),
    pick(Object.entries(OPERATION_WORDS), draft.operation, (v) => { draft.operation = v; }),
    ...operandPicker(values, draft, 'value', { allowLiteral: !propEnumMembers }),
    h('button', {
      class: 'btn', onclick: () => {
        const eventName = existing ? existing.event : draft.event;
        if (!eventName) return toast('Pick which event.', true);
        const value = draftOperand(draft, 'value');
        if (value === undefined) return toast('Say what it changes to.', true);
        const operation = draft.operation;
        state.editHandler = null;
        state.entityHandlerDraft = null;
        patch('entity-definition', entityName, (b) => {
          const prop = b.properties.find((q) => q.name === property.name);
          prop.handlers = (prop.handlers || []).filter((x) => x.event !== eventName);
          prop.handlers.push({ event: eventName, operation, value });
        });
      },
    }, existing ? 'Save' : '+ Wire this event'),
    existing ? h('button', { class: 'btn ghost tiny', onclick: close }, 'Cancel') : null);
}

// ---------- creating things ----------

function createEntity(ctx, label) {
  const name = toPascal(label);
  if (!name) return toast('Give it a name.', true);
  // A lifecycle is not required — but almost every entity wants one, so
  // it is offered as a convenience: an ordinary enum custom type plus an
  // ordinary `status` property typed with it, both named the way anyone
  // would type them by hand. In Simple mode neither is ever named: you
  // say "it exists" by recording a change, not by declaring an enum.
  const statusType = name + 'Status';
  return run(() => {
    addDefinition('custom-type-definition', ctx.id, statusType,
      { schema: { type: 'string', enum: [...DEFAULT_STATUSES] } });
    addDefinition('entity-definition', ctx.id, name, {
      properties: [{
        name: STATUS_PROPERTY, propertyType: statusType,
        isOptional: false, isList: false,
        initialValue: { enumMember: DEFAULT_STATUSES[0] }, handlers: [],
      }],
    });
    return name;
  });
}

function newPropertyForm(ctx) {
  let entity = Object.keys(ctx['entity-definitions'])[0] || '';
  let name = '', type = 'integer', isList = false;
  return h('div', { class: 'inline-form' },
    h('div', { class: 'q' }, 'What else should we know, and about what?'),
    h('div', { class: 'adder' },
      pick(Object.keys(ctx['entity-definitions']).sort()
        .map((n) => [n, entityIcon(ctx, n) + ' ' + readable(n)]),
        entity, (v) => { entity = v; }),
      h('input', { type: 'text', placeholder: 'seat count', oninput: (e) => { name = e.target.value; } }),
      pick(typeOptions(ctx), type, (v) => { type = v; }),
      h('label', { class: 'tiny muted' },
        h('input', { type: 'checkbox', onchange: (e) => { isList = e.target.checked; } }), ' many'),
      h('button', {
        class: 'btn primary', onclick: () => {
          if (!name.trim()) return toast('Give it a name.', true);
          const property = { name: toCamel(name), propertyType: type, isOptional: false, isList };
          property.initialValue = defaultInitialValue(ctx, property);
          property.handlers = [];
          state.addingProp = null;
          patch('entity-definition', entity, (b) => b.properties.push(property));
        },
      }, 'Add'),
      h('button', { class: 'btn ghost', onclick: () => { state.addingProp = null; render(); } }, 'Cancel')));
}

// The members of a string-only enum, wherever a property typed with it
// is shown — on the value type's own card, or inline on an entity's
// property. Renaming goes through the model, which rewrites every
// enum-member operand that resolves to *this* type; removing goes
// through the same guard an ordinary drop does, and refuses while a
// command still compares against the member.
function enumMemberChips(ctx, typeName) {
  const body = ctx['custom-type-definitions'][typeName];
  const members = (body && body.schema && body.schema.enum) || [];
  const where = 'member:' + typeName;
  const chips = members.map((member) => {
    if (editingMember(where, member)) {
      return inlineForm({
        question: `Rename this member of ${readable(typeName)}`, submitLabel: 'Rename',
        value: readable(member), showsIdentifier: true,
        onSubmit: (v) => {
          const next = toPascal(v);
          state.editMember = null;
          if (next && next !== member) {
            run(() => renameMember('custom-type-definition', ctx.id, typeName, 'member', member, next));
          } else render();
        },
        onCancel: () => { state.editMember = null; render(); },
      });
    }
    return h('span', { class: 'chip', style: 'margin-right:3px' }, h('span', {
      class: 'editable', title: 'Rename this member',
      onclick: () => openMember(where, member),
    }, readable(member)), h('button', {
      class: 'x', title: 'Remove this member',
      onclick: () => {
        if (members.length === 1) return toast('An enum needs at least one member.', true);
        run(() => updateDefinition('custom-type-definition', ctx.id, typeName,
          { ...body, schema: { ...body.schema, enum: members.filter((x) => x !== member) } }));
      },
    }, '×'));
  });
  chips.push(h('button', {
    class: 'btn tiny ghost',
    onclick: () => { closeForms(); state.addingMember = { type: typeName }; render(); },
  }, '+ member'));
  if (state.addingMember && state.addingMember.type === typeName && !state.addingMember.eventName) {
    chips.push(addEnumMemberForm(ctx, typeName));
  }
  return chips;
}

// The "+ New member" form, shared between the enum's own card and
// wherever else a member is added inline (wiring a handler that sets
// one that does not exist yet).
function addEnumMemberForm(ctx, typeName) {
  const body = ctx['custom-type-definitions'][typeName];
  const members = (body && body.schema && body.schema.enum) || [];
  return inlineForm({
    question: `What else can a ${readable(typeName)} be?`, placeholder: 'archived',
    showsIdentifier: true,
    onSubmit: (v) => {
      const member = toPascal(v);
      state.addingMember = null;
      run(() => updateDefinition('custom-type-definition', ctx.id, typeName,
        { ...body, schema: { ...body.schema, enum: [...members, member] } }));
    },
    onCancel: () => { state.addingMember = null; render(); },
  });
}

// A scripted property, on the page: the code that advances it, one
// body per event, and the arguments it asks a binding for.
//
// The textarea stores and nothing more — no evaluation happens here,
// and the model does not parse what is typed. That is the price of the
// escape hatch, so the panel says it outright rather than implying a
// safety it does not have.
function scriptPanel(ctx, entityName, property) {
  const script = property.script;
  const apply = (mutate) => patch('entity-definition', entityName, (b) => {
    mutate(b.properties.find((x) => x.name === property.name));
  });

  return h('div', { class: 'script' },
    h('div', { class: 'tiny muted' },
      'Scripted. Each handler is a body of code over ',
      h('code', {}, 'state'), ', ', h('code', {}, 'event'), ' and ', h('code', {}, 'args'),
      ', returning the next state. Nothing here runs or checks it.'),

    h('div', { class: 'tiny muted' }, 'starts as ',
      h('code', {}, JSON.stringify(script.initialState)),
      script.exposes ? h('span', {}, ', reads as ', h('code', {}, script.exposes)) : null),

    (script.arguments || []).length
      ? h('div', { class: 'tiny muted' }, 'asks each binding for ',
          ...(script.arguments || []).flatMap((a, i) => [
            i ? ', ' : null, h('code', {}, `${a.name}: ${a.propertyType}`),
          ]))
      : null,

    ...(property.handlers || []).map((handler) => h('div', { class: 'script-handler' },
      h('div', { class: 'tiny' },
        h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(ctx, handler.event)), readable(handler.event)),
        h('button', {
          class: 'btn tiny danger',
          title: 'Stop handling this event',
          onclick: () => apply((p) => {
            p.handlers = p.handlers.filter((x) => x.event !== handler.event);
          }),
        }, '\u00d7')),
      h('textarea', {
        class: 'mono', rows: Math.min(16, String(handler.code || '').split('\n').length + 1),
        value: handler.code || '',
        onblur: (e) => {
          const text = e.target.value;
          if (text === handler.code) return;
          if (!text.trim()) return toast('A scripted handler needs code.', true);
          apply((p) => { p.handlers.find((x) => x.event === handler.event).code = text; });
        },
      }))),

    h('div', { class: 'adder' },
      pick(
        Object.keys(ctx['event-definitions']).sort()
          .filter((e) => !(property.handlers || []).some((h2) => h2.event === e))
          .map((e) => [e, readable(e)]),
        '',
        (event) => {
          if (!event) return;
          apply((p) => p.handlers.push({ event, code: 'state' }));
        },
        '+ handle an event'
      )));
}

// The template rendering a tag-marked custom type's value into its tag
// — `{type}` and `{value}`, in whichever order it states them. Unlike
// the type's own name, changing this never moves a reference — it
// changes what an event carrying it writes as its tag, not what
// anything is called — so it goes through `patch` like any other
// field.
function tagSchemaField(name, body) {
  const current = body.tagSchema || '{type}:{value}';
  return h('div', { class: 'irow' },
    h('span', { class: 'nm' }, 'tag schema'),
    h('input', {
      type: 'text', class: 'mono', value: current, style: 'width:16ch',
      title: 'Renders the value into a tag — interpolates {type} and {value}',
      onblur: (e) => {
        const text = e.target.value.trim() || '{type}:{value}';
        if (text === current) return;
        patch('custom-type-definition', name, (b) => { b.tagSchema = text; });
      },
      onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
    }));
}

// ---------- one thing, on its own page ----------
//
// A thing is opened from the rail, or from any mention of it anywhere,
// and it gets the whole page. It used to get two: a manager listing
// every entity at once, and a panel that slid in over whatever you were
// reading — so the same thing was on screen twice, in two shapes,
// saying different amounts. One page, one shape.
//
// The page is in two parts, and the split is the point. What makes one
// of these one of these — the identifier every event about it is
// tagged with — is not something a modeler added, and it does not
// belong in the same list as "capacity". It sits above, in its own
// block. Everything below it, a lifecycle included, is what this model
// happens to know, and every row of that is a fold over events.

// The entity page's own "+ property" form. Declaring a property's
// shape is enough for the ordinary case — its handlers get wired
// afterward, from here or from a command's page — but a scripted one
// cannot: `validateScript` refuses a scripted property with no
// handler at all ("nothing would ever run"), so this asks for the
// first one, and the state it starts from, up front. Kept separate
// from `propertyAdder` rather than extending it, since that function
// is shared with event fields and command inputs, neither of which
// have scripts.
function entityPropertyAdder(ctx, entityName) {
  const draft = state.entityPropertyDraft && state.entityPropertyDraft.entity === entityName
    ? state.entityPropertyDraft
    : (state.entityPropertyDraft = {
        entity: entityName, name: '', propertyType: 'integer', isList: false, isOptional: false,
        scripted: false, initialStateText: '', handlerEvent: '', handlerCode: 'state',
      });

  const eventNames = Object.keys(ctx['event-definitions'])
    .filter((n) => (ctx['event-definitions'][n].properties || [])
      .some((p) => idLeavesOfType(ctx, p.propertyType)
        .some((leaf) => entityOfIdType(ctx, leaf.identifierType) === entityName)))
    .sort();

  const scriptedFields = draft.scripted ? [
    h('span', { class: 'tiny muted' }, 'starts as'),
    h('input', {
      type: 'text', class: 'mono', style: 'width:110px', value: draft.initialStateText,
      oninput: (e) => { draft.initialStateText = e.target.value; },
    }),
    h('span', { class: 'tiny muted' }, 'handles'),
    pick(eventNames.map((n) => [n, readable(n)]), draft.handlerEvent,
      (v) => { draft.handlerEvent = v; },
      eventNames.length ? '— which event? —' : '— nothing fits this yet —'),
    h('textarea', {
      class: 'mono', rows: 2, style: 'width:100%', value: draft.handlerCode,
      oninput: (e) => { draft.handlerCode = e.target.value; },
    }),
  ] : [];

  return h('div', { class: 'adder' },
    h('input', {
      type: 'text', placeholder: 'seat count', value: draft.name,
      oninput: (e) => { draft.name = e.target.value; },
    }),
    pick(typeOptions(ctx), draft.propertyType, (v) => { draft.propertyType = v; }),
    h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.isList,
        onchange: (e) => { draft.isList = e.target.checked; },
      }), ' many'),
    h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.isOptional,
        onchange: (e) => { draft.isOptional = e.target.checked; },
      }), ' optional'),
    advanced() ? h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.scripted,
        onchange: (e) => {
          draft.scripted = e.target.checked;
          if (draft.scripted && !draft.initialStateText) {
            draft.initialStateText = JSON.stringify(defaultInitialValue(ctx,
              { propertyType: draft.propertyType, isList: draft.isList, isOptional: draft.isOptional }));
          }
          render();
        },
      }), ' scripted') : null,
    ...scriptedFields,
    h('button', {
      class: 'btn', onclick: () => {
        if (!draft.name.trim()) return toast('Give the field a name.', true);
        const property = {
          name: toCamel(draft.name), propertyType: draft.propertyType,
          isOptional: draft.isOptional, isList: draft.isList,
        };
        if (draft.scripted) {
          if (!draft.handlerEvent) return toast('A scripted property needs at least one event to handle.', true);
          let initialState;
          try { initialState = JSON.parse(draft.initialStateText); }
          catch { return toast('That starting value is not valid JSON.', true); }
          property.script = { initialState };
          property.handlers = [{ event: draft.handlerEvent, code: draft.handlerCode || 'state' }];
        } else {
          property.initialValue = defaultInitialValue(ctx, property);
          property.handlers = [];
        }
        state.entityPropertyDraft = null;
        patch('entity-definition', entityName, (b) => b.properties.push(property));
      },
    }, '+ Property'));
}

function renderEntity(ctx, main) {
  const name = state.entity;
  const entity = ctx['entity-definitions'][name];
  if (!entity) return;
  const properties = entity.properties || [];

  const readers = new Set();
  const writers = new Set();
  for (const property of properties) {
    const usage = propertyUsage(ctx, name, property.name);
    usage.readBy.forEach((c) => readers.add(c));
    usage.changedBy.forEach((u) => writers.add(u.command));
  }

  if (state.renamingEntity === name) {
    main.appendChild(h('header', {}, inlineForm({
      question: 'Rename — every reference is rewritten with it', submitLabel: 'Rename',
      value: readable(name), showsIdentifier: true,
      onSubmit: (v) => {
        const next = toPascal(v);
        state.renamingEntity = null;
        if (next && next !== name) {
          run(() => {
            renameDefinition('entity-definition', ctx.id, name, next);
            state.entity = next;
          });
        } else render();
      },
      onCancel: () => { state.renamingEntity = null; render(); },
    })));
  } else {
    main.appendChild(h('header', {},
      qrow('div', { cls: 'row', key: 'ent:' + name },
        // The mark leads, because it is what this thing will be
        // recognised by everywhere else. Clicking it is how it is
        // chosen — there is nowhere else to put a setting that belongs
        // to one entity and to nothing else.
        h('button', {
          class: 'icon-btn', title: 'Choose the mark this is shown with',
          onclick: () => {
            const open = state.iconPicker === name;
            closeForms();
            state.iconPicker = open ? null : name;
            render();
          },
        }, entityIcon(ctx, name)),
        h('div', { class: 'name' }, named(name)),
        h('span', { class: 'grow' }),
        reveal(
          h('button', {
            class: 'btn tiny',
            onclick: () => { closeForms(); state.renamingEntity = name; render(); },
          }, 'Rename'),
          removeButton('entity:' + name, {
            label: 'Remove', title: 'Remove this entity entirely',
            onRemove: () => run(() => {
              removeDefinition('entity-definition', ctx.id, name);
              state.entity = null;
            }),
          }))),
      h('div', { class: 'muted small summary' },
        `${properties.length} propert${properties.length === 1 ? 'y' : 'ies'} · `
        + `moved by ${writers.size} command${writers.size === 1 ? '' : 's'}, `
        + `read by ${readers.size}`)));
  }

  if (state.iconPicker === name) main.appendChild(iconPicker(ctx, name, entity));

  main.appendChild(entityTabs(ctx, name));
  if (state.entityTab === 'property-scenarios') {
    main.appendChild(propertyScenarioPanel(ctx, name));
    return;
  }

  main.appendChild(identityBlock(ctx, name, entity));

  const section = h('section', { class: 'esection' },
    h('h4', {}, 'What we know about each one'),
    h('div', { class: 'muted tiny', style: 'margin:-4px 0 9px' },
      'Each of these is folded from the events tagged with one of these things — so a '
      + 'property nothing moves is a property nothing knows.'));

  if (!properties.length) {
    section.appendChild(h('div', { class: 'empty' }, 'Nothing yet.'));
  }
  for (const property of properties) section.appendChild(propertyCard(ctx, name, entity, property));

  section.appendChild(adderSlot('prop:' + name, null, '+ property',
    () => entityPropertyAdder(ctx, name)));
  main.appendChild(section);
}

// The half of an entity nobody authored: the identifier is the only
// kind of tag a DCB context has, and nothing declared it — it comes
// with being a thing at all. A lifecycle, unlike the identifier, is not
// part of this: it is an ordinary enum property, listed below with
// everything else a modeler chose to track.
//
// The identifier itself is an ordinary custom type, created alongside
// the entity — this row is a read-only pointer at it, not an editor.
// Changing its schema, composing it, or renaming it all happen in
// Custom Types, which is what the chip opens.
function identityBlock(ctx, name, entity) {
  const idType = idTypeOf(ctx, name);
  const box = h('section', { class: 'ident' },
    h('h4', {}, 'Identity'),
    h('div', { class: 'muted tiny why' },
      'What makes one of these one of these. Nobody added this row: the identifier is the '
      + 'tag every event about this thing carries, and it comes with being a thing at all.'));

  box.appendChild(h('div', { class: 'irow' },
    h('span', { class: 'nm' }, 'identified by'),
    h('span', {
      class: 'chip editable', title: 'Open ' + readable(idType) + ' in Custom Types',
      onclick: () => goToCustomType(idType),
    }, readable(idType), advanced() ? h('span', { class: 'tech' }, idType) : null),
    h('span', { class: 'tiny muted' }, 'one per thing — and the tag every event about it carries')));

  return box;
}

// Every handler that moves this property, in one place — the entity's
// own record of it, rather than something only visible by visiting
// each command that happens to touch it. `usage.changedBy` carries one
// entry per command that publishes a handled event, so several
// entries can share the same handler; this collapses that back down to
// one row per event, which is what can actually be edited or removed.
function handlerList(ctx, entityName, property, usage) {
  const byEvent = new Map();
  for (const u of usage.changedBy) byEvent.set(u.event, u);

  const rows = [...byEvent.values()].map((u) => {
    const editing = state.editHandler
      && state.editHandler.entity === entityName
      && state.editHandler.property === property.name
      && state.editHandler.event === u.event;
    if (editing) return entityHandlerAdder(ctx, entityName, property, u.handler);
    const p = effectParts({ entity: entityName, property, handler: u.handler });
    return h('div', { class: 'row' },
      h('span', { class: 'sentence' },
        h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(ctx, u.event)), readable(u.event)), ' ',
        h('span', { class: 'verb' }, p.verb), ' ', opRef(u.handler.value, u.event, p.object)),
      h('span', { class: 'grow' }),
      reveal(
        h('button', {
          class: 'btn tiny',
          onclick: () => {
            closeForms();
            state.editHandler = { entity: entityName, property: property.name, event: u.event };
            render();
          },
        }, 'Edit'),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patch('entity-definition', entityName, (b) => {
            const prop = b.properties.find((q) => q.name === property.name);
            prop.handlers = prop.handlers.filter((x) => x.event !== u.event);
          }),
        }, '×')));
  });

  return h('div', { class: 'handlers' },
    rows.length ? rows : h('div', {}, 'nothing moves it'),
    adderSlot('wire:' + entityName + '.' + property.name, null, '+ wire an event',
      () => entityHandlerAdder(ctx, entityName, property)));
}

// One property: what it is called and what it holds on the first line,
// who moves it and who reads it on the second. Two different questions,
// so they do not share a line and fight for the room.
function propertyCard(ctx, entityName, entity, property) {
  const where = 'entity:' + entityName;

  if (editingMember(where, property.name)) {
    const index = (entity.properties || []).findIndex((p) => p.name === property.name);
    return memberEditor(ctx, {
      member: property, where, allow: { initialValue: true },
      onReplace: (next) => patch('entity-definition', entityName, (b) => { b.properties[index] = next; }),
      onRename: (to) => renameMember('entity-definition', ctx.id, entityName, 'property', property.name, to),
    });
  }

  const usage = propertyUsage(ctx, entityName, property.name);
  const dead = !usage.changedBy.length && !usage.readBy.length;
  const jump = (command) => h('b', {
    title: 'Open ' + readable(command),
    onclick: () => { closeForms(); state.slice = command; state.view = 'slice'; render(); },
  }, readable(command));
  const listed = (commands) => commands.flatMap((c, i) => (i ? [', ', jump(c)] : [jump(c)]));

  // A property typed with another thing's identifier is a reference to
  // that thing, so it carries that thing's mark — the same one the rail
  // and every command show it under.
  const referenced = entityOfIdType(ctx, property.propertyType);
  // A string-only enum gets its members editable right here, wherever a
  // property of that type is shown — the same convenience a lifecycle
  // status used to get for free, now available to any enum property.
  const enumType = isStringEnumType(ctx, property.propertyType) ? property.propertyType : null;

  return h('div', { class: 'prop' + (dead ? ' dead' : '') },
    qrow('div', { cls: 'top', key: 'prop:' + entityName + '.' + property.name },
      h('span', { class: 'nm' }, propertyWords(property.name)),
      // A row's type is what the row is about, so it stays on screen.
      // Only the machinery around it — the stored name, where it starts,
      // the button that removes it — waits to be asked for.
      h('span', {
        class: 'chip editable', title: 'Rename or retype this',
        onclick: () => openMember(where, property.name),
      }, referenced ? h('i', { class: 'ic' }, entityIcon(ctx, referenced)) : null,
        readable(typeLabel(property))),
      // A scripted property stays marked on screen: a value arrived at
      // by code is a different kind of claim from one arrived at by a
      // declaration, and a rule reading it should say so.
      scriptLabel(property) ? h('span', { class: 'chip' }, scriptLabel(property)) : null,
      h('span', { class: 'grow' }),
      reveal(
        advanced() ? h('span', { class: 'tech' }, property.name) : null,
        advanced() ? h('span', { class: 'tiny muted' }, 'starts as ',
          h('code', {}, property.script
            ? JSON.stringify(property.script.initialState)
            : operandWords(property.initialValue))) : null,
        h('button', {
          class: 'btn tiny danger', title: 'Stop tracking this',
          onclick: () => patch('entity-definition', entityName, (b) => {
            b.properties = b.properties.filter((p) => p.name !== property.name);
          }),
        }, '×'))),
    enumType ? h('div', { class: 'use' },
      h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(ctx, enumType)) : null,
    h('div', { class: 'use' },
      // A scripted property's handlers live in its own code, in
      // scriptPanel below — this list is for the declarative ones,
      // where an event/operation/value row can actually be edited here.
      property.script
        ? h('div', {}, usage.changedBy.length
            ? ['moved by ', ...listed(uniq(usage.changedBy.map((u) => u.command)))]
            : 'nothing moves it')
        : handlerList(ctx, entityName, property, usage),
      h('div', {}, usage.readBy.length
        ? ['read by ', ...listed(usage.readBy)]
        : 'nothing reads it')),
    // The code sits under the row rather than behind the type chip: it
    // is the whole definition of the property, not a detail of it.
    // Advanced only — a scripted property is not something to meet
    // before the declarative ones make sense.
    property.script && advanced() ? scriptPanel(ctx, entityName, property) : null);
}

// The marks on offer. A grid rather than a text field, because the
// point of a mark is that it is recognised, and a modeler asked to type
// one will type the first thing that comes to hand. Anything can still
// be typed — the field is beside the grid, not instead of it.
const ICON_CHOICES = [
  '📚', '🎓', '🧑‍🎓', '👤', '👥', '🏫', '🏢', '🏬', '🏠', '🛏️',
  '📦', '🧾', '🛒', '💳', '💰', '🏷️', '🎟️', '🎫', '📄', '📋',
  '🗓️', '⏰', '⏳', '📍', '🧭', '✈️', '🚗', '🚚', '🍽️', '☕',
  '🔑', '🔒', '⚙️', '🧩', '🔧', '🧱', '🌱', '🐾', '⭐', '🔥',
  '💡', '🎯', '🧪', '🩺', '📈', '📊', '🎵', '🎬', '⚽', '♟️',
];

function iconPicker(ctx, name, entity) {
  const current = entityIcon(ctx, name);
  let typed = entity.icon || '';
  const set = (icon) => {
    state.iconPicker = null;
    patch('entity-definition', name, (b) => {
      const next = String(icon || '').trim();
      if (next) b.icon = next;
      else delete b.icon;
    });
  };
  return h('div', { class: 'inline-form icons' },
    h('div', { class: 'q' },
      `The mark ${readable(name)} is shown with — in the rail, in every command that reads it, `
      + 'and in every change it takes.'),
    h('div', { class: 'grid' }, ICON_CHOICES.map((icon) => h('button', {
      class: 'ic-opt' + (icon === current ? ' on' : ''), title: 'Use this',
      onclick: () => set(icon),
    }, icon))),
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: typed, placeholder: 'or type one', style: 'width:110px',
        oninput: (e) => { typed = e.target.value; },
        onkeydown: (e) => {
          if (e.key === 'Enter') { e.preventDefault(); set(typed); }
          if (e.key === 'Escape') { e.preventDefault(); state.iconPicker = null; render(); }
        },
      }),
      h('button', { class: 'btn', onclick: () => set(typed) }, 'Use'),
      entity.icon ? h('button', {
        class: 'btn ghost', title: 'Back to the neutral mark',
        onclick: () => set(''),
      }, 'Clear') : null,
      h('button', {
        class: 'btn ghost', onclick: () => { state.iconPicker = null; render(); },
      }, 'Done')));
}

// The event analogue of iconPicker. Kept as its own function rather
// than a parameterised one — a rename or a patch call reads plainly
// this way, and the two forms are alike by coincidence of shape, not
// by being the same form on two collections.
function eventIconPicker(ctx, name, event) {
  const current = eventIcon(ctx, name);
  let typed = event.icon || '';
  const set = (icon) => {
    state.eventIconPicker = null;
    patch('event-definition', name, (b) => {
      const next = String(icon || '').trim();
      if (next) b.icon = next;
      else delete b.icon;
    });
  };
  return h('div', { class: 'inline-form icons event' },
    h('div', { class: 'q' },
      `The mark ${readable(name)} is shown with — in the sandbox timeline, in every Given that `
      + 'records it, and everywhere it is recorded.'),
    h('div', { class: 'grid' }, ICON_CHOICES.map((icon) => h('button', {
      class: 'ic-opt' + (icon === current ? ' on' : ''), title: 'Use this',
      onclick: () => set(icon),
    }, icon))),
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: typed, placeholder: 'or type one', style: 'width:110px',
        oninput: (e) => { typed = e.target.value; },
        onkeydown: (e) => {
          if (e.key === 'Enter') { e.preventDefault(); set(typed); }
          if (e.key === 'Escape') { e.preventDefault(); state.eventIconPicker = null; render(); }
        },
      }),
      h('button', { class: 'btn', onclick: () => set(typed) }, 'Use'),
      event.icon ? h('button', {
        class: 'btn ghost', title: 'Back to the neutral mark',
        onclick: () => set(''),
      }, 'Clear') : null,
      h('button', {
        class: 'btn ghost', onclick: () => { state.eventIconPicker = null; render(); },
      }, 'Done')));
}

// The command analogue of iconPicker and eventIconPicker. A command's
// icon is also the default mark for whichever single event it
// publishes (see `eventIcon`), so clearing it back to the neutral mark
// changes that event's default too, unless the event has a mark of its

function commandIconPicker(ctx, name, command) {
  const current = commandIcon(ctx, name);
  let typed = command.icon || '';
  const set = (icon) => {
    state.commandIconPicker = null;
    patch('command-definition', name, (b) => {

  return h('div', { class: 'inline-form icons' },
    h('div', { class: 'q' },
      `The mark ${readable(name)} is shown with — and, by default, the event it records on `
      + 'success, unless that event has a mark of its own.'),
    h('div', { class: 'grid' }, ICON_CHOICES.map((icon) => h('button', {
      class: 'ic-opt' + (icon === current ? ' on' : ''), title: 'Use this',
      onclick: () => set(icon),
    }, icon))),
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: typed, placeholder: 'or type one', style: 'width:110px',
        oninput: (e) => { typed = e.target.value; },
        onkeydown: (e) => {
          if (e.key === 'Enter') { e.preventDefault(); set(typed); }
          if (e.key === 'Escape') { e.preventDefault(); state.commandIconPicker = null; render(); }
        },
      }),
      h('button', { class: 'btn', onclick: () => set(typed) }, 'Use'),
      command.icon ? h('button', {
        class: 'btn ghost', title: 'Back to the neutral mark',
        onclick: () => set(''),
      }, 'Clear') : null,
      h('button', {
        class: 'btn ghost', onclick: () => { state.commandIconPicker = null; render(); },
      }, 'Done')));
}

// ---------- value types ----------
//
// A value type is either one value described by a JSON Schema, or a
// record of named fields. The composite form is the one that matters
// here: because a field may be typed with an entity's identifier, a
// list of composites is what lets a single event record something that
// happened to many instances at once.
//
// Fields are offered as name-and-type only. There are no list or
// optional controls, because a composite's fields may be neither — the
// editor declines to ask rather than asking and then refusing.
function renderCustomTypes(ctx, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Custom types'),
    h('div', { class: 'muted small' },
      'Records with no identity of their own — a price, an order line — and identifiers: a '
      + 'scalar type marked "represented as a tag" is what every event carrying it is tagged '
      + 'with. An entity’s own derived identifier lives here too, created automatically '
      + 'alongside it, and stays pinned as a tag for as long as the entity owns it.')));

  const names = Object.keys(ctx['custom-type-definitions']).sort();
  if (!names.length) {
    main.appendChild(h('div', { class: 'empty' }, 'None yet.'));
  }

  for (const name of names) {
    const body = ctx['custom-type-definitions'][name];
    const composite = Array.isArray(body.properties);
    const owner = entityOfIdType(ctx, name);
    const card = h('div', { class: 'ecard' });

    if (state.renamingType === name) {
      card.appendChild(inlineForm({
        question: 'Rename — every reference is rewritten with it', submitLabel: 'Rename',
        value: readable(name), showsIdentifier: true,
        onSubmit: (v) => {
          const next = toPascal(v);
          state.renamingType = null;
          if (next && next !== name) run(() => renameDefinition('custom-type-definition', ctx.id, name, next));
          else render();
        },
        onCancel: () => { state.renamingType = null; render(); },
      }));
    } else {
      const tags = composite
        ? idLeavesOfType(ctx, name).map((l) =>
            `${readable(entityOfIdType(ctx, l.identifierType) || l.identifierType)} (from ${readable(l.field)})`)
        : [];
      card.appendChild(qrow('div', { cls: 'ehead', key: 'type:' + name },
        h('span', { class: 'chip' }, readable(name)),
        h('span', { class: 'muted tiny' }, composite
          ? `${body.properties.length} field${body.properties.length === 1 ? '' : 's'}`
          : 'one value'),
        owner ? h('span', {
          class: 'chip entity', title: 'Open ' + readable(owner),
          onclick: () => openEntity(owner),
        }, h('i', { class: 'ic' }, entityIcon(ctx, owner)), 'identifier of ' + readable(owner)) : null,
        tags.length
          ? h('span', { class: 'muted tiny' }, ' · tags whatever carries it: ' + tags.join(', '))
          : null,
        h('span', { style: 'flex:1' }),
        h('span', { class: 'reveal' }, h('span', { class: 'tech' }, name), h('button', {
          class: 'btn tiny',
          onclick: () => { closeForms(); state.renamingType = name; render(); },
        }, 'Rename'),
        owner
          ? h('button', {
              class: 'btn tiny danger', disabled: true,
              title: `Remove the ${readable(owner)} entity instead — its identifier goes with it.`,
            }, 'Remove')
          : removeButton('custom-type:' + name, {
              label: 'Remove', title: 'Remove this custom type',
              onRemove: () => run(() => removeDefinition('custom-type-definition', ctx.id, name)),
            }))));
    }

    if (composite) {
      const where = 'field:' + name;
      card.appendChild(h('div', { class: 'erows' }, body.properties.map((field, i) => {
        // A field is always singular and always required — that is
        // what keeps a list of records the same length as the bindings
        // fanned out over it — so arity is not offered here.
        if (editingMember(where, field.name)) {
          return memberEditor(ctx, {
            member: field, where, allow: { arity: false }, types: fieldTypeOptions(ctx),
            onReplace: (next) => patch('custom-type-definition', name, (b) => {
              b.properties[i] = { name: next.name, propertyType: next.propertyType };
            }),
            onRename: (to) => renameMember('custom-type-definition', ctx.id, name, 'field', field.name, to),
          });
        }
        const cls = classifyType(ctx, field.propertyType);
        const isId = cls.kind === 'value' && !cls.composite && cls.isTag;
        // A standalone tag-marked type has no owning entity — nothing
        // to mark it with and nothing to name in the sentence below.
        const ownerEntity = isId ? cls.ownerEntity : null;
        const enumType = isStringEnumType(ctx, field.propertyType) ? field.propertyType : null;
        // A record field is its type — that one stays on screen even
        // here, because with it hidden the row would say nothing.
        return [
          qrow('div', { cls: 'erow', key: 'field:' + name + '.' + field.name },
            h('span', { class: 'nm' }, propertyWords(field.name)),
            h('span', {
              class: (ownerEntity ? 'chip entity' : 'chip') + ' editable',
              title: 'Rename or retype this field',
              onclick: () => openMember(where, field.name),
            }, ownerEntity ? h('i', { class: 'ic' }, entityIcon(ctx, ownerEntity)) : null,
              readable(field.propertyType)),
            isId ? h('span', { class: 'tiny muted' },
              ownerEntity
                ? ('identifies a ' + entityIcon(ctx, ownerEntity) + ' ' + readable(ownerEntity)
                  + ' — every event carrying this is tagged with it')
                : 'a standalone tag — every event carrying this is tagged with it') : null,
            h('span', { style: 'flex:1' }),
            reveal(
              advanced() ? h('span', { class: 'tech' }, field.name) : null,
              h('button', {
              class: 'btn tiny danger',
              onclick: () => {
                if (body.properties.length === 1) {
                  return toast('A record needs at least one field. Remove the type instead.', true);
                }
                patch('custom-type-definition', name, (b) => {
                  b.properties = b.properties.filter((f) => f.name !== field.name);
                });
              },
            }, '×'))),
          enumType ? h('div', { class: 'use' },
            h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(ctx, enumType)) : null,
        ];
      })));

      let fname = '', ftype = 'string';
      card.appendChild(adderSlot('field:' + name, null, '+ field', () => h('div', { class: 'adder' },
        h('input', { type: 'text', placeholder: 'price', oninput: (e) => { fname = e.target.value; } }),
        pick(fieldTypeOptions(ctx), ftype, (v) => { ftype = v; }),
        h('button', {
          class: 'btn', onclick: () => {
            if (!fname.trim()) return toast('Give the field a name.', true);
            patch('custom-type-definition', name, (b) => {
              b.properties.push({ name: toCamel(fname), propertyType: ftype });
            });
          },
        }, '+ Field'),
        h('span', { style: 'flex:1' }),
        h('span', { class: 'tiny muted' }, 'fields are single and required'))));
    } else if (isStringEnumType(ctx, name)) {
      // An enum is not a distinct form of type — it is a scalar whose
      // schema carries `enum` — so this is the same card as any other
      // scalar, just with a chip editor over that one keyword instead
      // of a raw-text view of the whole schema.
      card.appendChild(h('div', { class: 'irow' }, ...enumMemberChips(ctx, name)));
    } else {
      let text = JSON.stringify(body.schema == null ? { type: 'string' } : body.schema);
      card.appendChild(h('div', { class: 'adder' },
        h('input', {
          type: 'text', value: text, style: 'flex:1;font-family:var(--mono);font-size:11px',
          oninput: (e) => { text = e.target.value; },
        }),
        h('button', {
          class: 'btn', onclick: () => run(() => {
            let parsed;
            try { parsed = JSON.parse(text); }
            catch (e) { throw new DomainError('That is not valid JSON: ' + e.message); }
            updateDefinition('custom-type-definition', ctx.id, name, { ...body, schema: parsed });
          }),
        }, 'Save')));
    }

    // "Represented as a tag" applies only to the scalar form — a
    // composite is never itself a tag, only whichever of its fields are
    // (see the field rows above). Pinned on and undisabled for an
    // entity-owned type: it must stay a tag for the entity to be
    // bindable at all, so this is where that invariant is enforced in
    // the UI rather than only caught after the fact by validation.
    if (!composite) {
      card.appendChild(h('div', { class: 'irow' },
        h('span', { class: 'nm' }, 'represented as a tag'),
        h('label', { class: 'tiny muted' },
          h('input', {
            type: 'checkbox', checked: !!body.isTag, disabled: !!owner,
            onchange: (e) => patch('custom-type-definition', name, (b) => {
              if (e.target.checked) b.isTag = true; else delete b.isTag;
            }),
          }),
          owner ? ` required — this is ${readable(owner)}’s identifier` : '')));
      if (body.isTag && !owner) card.appendChild(tagSchemaField(name, body));
    }

    main.appendChild(card);
  }

  if (state.newType) {
    main.appendChild(inlineForm({
      question: 'What is this value called?',
      placeholder: state.newType === 'enum' ? 'course status' : 'order line',
      showsIdentifier: true,
      onSubmit: (v) => {
        const typeName = toPascal(v);
        const form = state.newType;
        state.newType = null;
        run(() => addDefinition('custom-type-definition', ctx.id, typeName,
          form === 'composite'
            // A record needs a field to exist at all, so it starts with
            // one the modeler is expected to rename rather than with an
            // empty body the model would reject.
            ? { properties: [{ name: 'value', propertyType: 'string' }] }
            : form === 'enum'
              // Same for an enum: one member to rename, rather than a
              // legal-but-useless empty list.
              ? { schema: { type: 'string', enum: ['Member'] } }
              : { schema: { type: 'string' } }));
      },
      onCancel: () => { state.newType = null; render(); },
    }));
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newType = 'composite'; render(); },
      }, '+ New record'),
      h('button', {
        class: 'btn',
        onclick: () => { closeForms(); state.newType = 'enum'; render(); },
      }, '+ New enum'),
      h('button', {
        class: 'btn',
        onclick: () => { closeForms(); state.newType = 'scalar'; render(); },
      }, '+ New single value')));
  }
}

// What a composite field may be typed with: anything except another
// composite, since records do not nest.
function fieldTypeOptions(ctx) {
  return typeChoices(ctx)
    .filter((t) => {
      const cls = classifyType(ctx, t);
      return !(cls.kind === 'value' && cls.composite);
    })
    .map((t) => [t, readable(t)]);
}

// ---------- projections ----------
//
// A projection is an entity property that lost its entity: same machinery,
// same handlers, same operands. What replaces the owner is
// `parameters` — the tags a command supplies when it binds one.
// Declare none and the query carries no tag at all, which is what a
// global numbering is, and the only tagless query in a DCB context.
//
// Numbering is not a concept here, it is a use: a value set to the
// *successor* of what an event carried holds the next number to issue
// at every point in its life.
//
// What it holds, where it starts, how it is partitioned and which
// events move it are one decision rather than four — the value type
// decides which event properties are even offerable — so this is the
// one editor in here that collects a change and applies it on Save
// instead of as you type. A half-edited projection would otherwise be
// refused by the model on every keystroke.

// What a projection may hold: any scalar — including an enum — but
// never a composite, since there is no single value there to advance.
function projectionTypeOptions(ctx) {
  return allTypeNames(ctx)
    .filter((t) => {
      const cls = classifyType(ctx, t);
      if (cls.kind === 'value') return !cls.composite;
      return t === 'integer' || t === 'string';
    })
    .map((t) => [t, readable(t)]);
}

// The JSON Schema a type bottoms out in, so the first value can be read
// as the number it is rather than as a string of digits. A composite
// has no single scalar schema to bottom out in — its value is a plain
// object matching its fields — so this reads null for one, which every
// caller here already treats as "not a number".
function underlyingSchema(ctx, typeName) {
  const cls = classifyType(ctx, typeName);
  if (cls.kind === 'simple') return { type: typeName === 'timestamp' ? 'integer' : typeName };
  if (cls.kind === 'value' && !cls.composite) {
    return ctx['custom-type-definitions'][typeName].schema || { type: 'string' };
  }
  return null;
}

function projectionLiteral(ctx, valueType, text) {
  const schema = underlyingSchema(ctx, valueType);
  const numeric = schema && (schema.type === 'integer' || schema.type === 'number');
  if (!numeric) return text;
  const n = Number(text);
  return text.trim() === '' || Number.isNaN(n) ? text : n;
}

// A projection in one sentence, for the card that is not being edited.
function projectionWords(ctx, body) {
  const moves = (body.handlers || []).map((handler) => readable(handler.event)).join(', ');
  const held = `holds ${readable(body.valueType)}${body.isList ? ' (a list)' : ''}`;
  // A scripted projection has no parameters to partition by and states
  // its own tags, so the sentence reads them off the tag filter.
  if (body.script) {
    const tags = (body.script.tagFilter || []).join(', ');
    return `${held}, scripted, starting at ${JSON.stringify(body.script.initialState)}`
      + (tags ? `, over ${tags}` : '')
      + (moves ? ` — moved by ${moves}` : ' — nothing moves it yet');
  }
  const partition = (body.parameters || []).length
    ? `, one per ${(body.parameters || []).map((p) => propertyWords(p.name)).join(' and ')}`
    : ', global';
  return `${held}, starting at ${JSON.stringify(body.initialValue)}${partition}`
    + (moves ? ` — moved by ${moves}` : ' — nothing moves it yet');
}

// The types on offer as a partition. Only a tag can narrow a query, so
// nothing else appears — an entity's own derived identifier as much as
// a standalone tag-marked type, scalar or composite (through its
// tag-marked fields) either way.
function partitionTypeOptions(ctx) {
  return allTypeNames(ctx)
    .filter((t) => classifyType(ctx, t).kind === 'value' && isTagBearing(ctx, t))
    .map((t) => [t, readable(t)]);
}

// A projection's handler value, offered as the small set that makes
// sense for the type it holds. `successor` is what turns a plain
// projection into a numbering, so it is a value on this list rather
// than a concept of its own.
function handlerValueChoices(ctx, draft, event) {
  const properties = event ? (event.properties || []) : [];
  const matching = properties.filter(
    (p) => p.propertyType === draft.valueType && !p.isList && !p.isOptional);
  const out = [];
  for (const p of matching) {
    out.push([JSON.stringify({ eventProperty: p.name }), propertyWords(p.name)]);
    out.push([JSON.stringify({ successor: { eventProperty: p.name } }),
      `the one after ${propertyWords(p.name)}`]);
  }
  out.push([JSON.stringify({ currentValue: true }), 'its current value']);
  const enumMembers = enumMembersFor(ctx, draft.valueType);
  if (enumMembers) {
    for (const m of enumMembers) out.push([JSON.stringify({ enumMember: m }), readable(m)]);
  }
  return out;
}

// What the parameter at this position is called in the stored
// definition — null while a projection is still being described, and
// null for a parameter added to the draft but not yet saved.
function savedParameterName(ctx, draft, index) {
  if (!state.projDraft || state.projDraft.body !== draft) return null;
  const stored = ctx['projection-definitions'][state.projDraft.name];
  const parameter = stored && (stored.parameters || [])[index];
  return parameter ? parameter.name : null;
}

// The fields of a projection, shared by the editor and the new-one
// form. `draft` is mutated in place and only reaches the model on Save.
function projectionFields(ctx, draft) {
  const eventNames = Object.keys(ctx['event-definitions']).sort();
  const partitionOptions = partitionTypeOptions(ctx);

  // A scripted projection is read here and edited nowhere: this form
  // writes parameters, operations and operands, and a scripted one has
  // none of the three. Authoring one is a text-file job until the
  // editor grows a place for code that stands on its own.
  if (draft.script) {
    return [
      h('div', { class: 'tiny muted' },
        'Scripted, so this form cannot edit it. It holds ',
        h('code', {}, typeLabel({ propertyType: draft.valueType, isList: draft.isList })),
        ', starts at ', h('code', {}, JSON.stringify(draft.script.initialState)),
        draft.script.exposes ? h('span', {}, ', reads as ', h('code', {}, draft.script.exposes)) : null,
        '.'),
      h('div', { class: 'tiny muted' }, 'over ',
        h('code', {}, (draft.script.tagFilter || []).join(', ') || 'nothing')),
      ...(draft.handlers || []).map((handler) => h('div', { class: 'script-handler' },
        h('div', { class: 'tiny' }, h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(ctx, handler.event)), readable(handler.event))),
        h('textarea', { class: 'mono', rows: 6, value: handler.code || '', readonly: true }))),
    ];
  }

  // A parameter's name is edited in the draft like everything else
  // here, but a *saved* projection's parameter is a name commands
  // supply by key — so renaming one has to rewrite those bindings, and
  // that goes through `renameMember` rather than the draft. `saved` is
  // the name this parameter currently has in the stored definition, or
  // null while the projection is still being described.
  const parameterRows = (draft.parameters || []).map((parameter, i) => {
    const saved = savedParameterName(ctx, draft, i);
    return h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: parameter.name || '', placeholder: 'tenantId',
        oninput: (e) => { parameter.name = e.target.value; },
      }),
      // Shown whenever the parameter is already stored, not only once
      // the text differs — the input does not repaint as it is typed,
      // so a button conditional on the typed value would never appear.
      saved ? h('button', {
        class: 'btn tiny', title: 'Rename it, rewriting every binding that supplies it',
        onclick: () => {
          if (toCamel(parameter.name) === saved) return;
          run(() => {
            renameMember('projection-definition', ctx.id, state.projDraft.name,
              'parameter', saved, toCamel(parameter.name));
            state.projDraft = null;
          });
        },
      }, 'Rename') : null,
      h('span', { class: 'muted tiny' }, 'identifying a'),
      pick(partitionOptions, parameter.propertyType,
        (v) => { parameter.propertyType = v; render(); }, '— which thing? —'),
      h('button', {
        class: 'btn tiny danger',
        onclick: () => { draft.parameters.splice(i, 1); render(); },
      }, '×'));
  });

  const handlerRows = (draft.handlers || []).map((handler, i) => {
    const event = ctx['event-definitions'][handler.event];
    const values = handlerValueChoices(ctx, draft, event);
    const operations = operationsFor(ctx, draft);
    return h('div', { class: 'adder' },
      pick(eventNames.map((n) => [n, eventIcon(ctx, n) + ' ' + readable(n)]), handler.event,
        (v) => { handler.event = v; handler.value = ''; render(); }, '— which event? —'),
      pick(operations.map((op) => [op, op]), handler.operation,
        (v) => { handler.operation = v; render(); }, '— do what? —'),
      pick(values, handler.value === undefined ? '' : JSON.stringify(handler.value),
        (v) => { handler.value = JSON.parse(v); render(); },
        event
          ? (values.length ? '— to what? —' : `— it carries no single ${readable(draft.valueType)} —`)
          : '— pick an event first —'),
      h('button', {
        class: 'btn tiny danger',
        onclick: () => { draft.handlers.splice(i, 1); render(); },
      }, '×'));
  });

  const enumType = isStringEnumType(ctx, draft.valueType) ? draft.valueType : null;

  return [
    h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'it holds'),
      pick(projectionTypeOptions(ctx), draft.valueType, (v) => {
        draft.valueType = v;
        // The value picker is scoped by type, so stale picks go with it.
        for (const handler of draft.handlers || []) handler.value = '';
        render();
      }, '— which type? —')),
    enumType ? h('div', { class: 'use' },
      h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(ctx, enumType)) : null,
    h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'starting at'),
      h('input', {
        type: 'text', value: draft.initialValue === undefined ? '' : String(draft.initialValue),
        placeholder: 'c1',
        oninput: (e) => { draft.initialValue = projectionLiteral(ctx, draft.valueType, e.target.value); },
      }),
      h('span', { class: 'muted tiny' }, 'for a numbering, the only place a prefix is stated — c1, then c2, c3…')),
    h('div', { style: 'margin-top:8px' },
      h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
        'kept separately for each — these become the tags of its query, so nothing but an '
        + 'identifier can appear here:'),
      parameterRows.length
        ? parameterRows
        : h('div', { class: 'empty' }, 'Nothing — one value for the whole system, and a query with no tag.'),
      partitionOptions.length
        ? h('div', { class: 'adder' }, h('button', {
            class: 'btn ghost tiny',
            onclick: () => {
              (draft.parameters = draft.parameters || []).push({ name: '', propertyType: partitionOptions[0][0] });
              render();
            },
          }, '+ kept separately for each'))
        : null),
    h('div', { style: 'margin-top:8px' },
      h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
        'and it moves when one of these is recorded:'),
      handlerRows.length
        ? handlerRows
        : h('div', { class: 'empty' }, 'Nothing moves it — it would read its first value forever.'),
      h('div', { class: 'adder' }, h('button', {
        class: 'btn ghost tiny',
        onclick: () => {
          (draft.handlers = draft.handlers || []).push({ event: '', operation: 'set', value: '' });
          render();
        },
      }, '+ event that moves it'))),
    advanced()
      ? h('div', { class: 'card dcb', style: 'margin-top:8px' },
          h('div', {}, h('span', { class: 'k' }, 'query  '),
            h('span', { class: 't' },
              (draft.parameters || []).length
                // A parameter's own type may be a composite identifier,
                // which has no tag of its own — its *leaves* each do —
                // so this walks them and renders each through its own
                // identifier's tagSchema, exactly as the query really
                // will. Assuming the parameter's type name works
                // directly here was the bug this replaced.
                ? (draft.parameters || []).flatMap((p) =>
                    idLeavesOfType(ctx, p.propertyType).map((leaf) => {
                      const identifierType = identifierTypeOf(ctx, leaf.identifierType);
                      const placeholder = `<${p.name || '?'}${leaf.field ? '.' + leaf.field : ''}>`;
                      return identifierType ? renderTag(identifierType, placeholder)
                        : `${leaf.identifierType}:${placeholder}`;
                    })).join(' and ')
                : ''),
            (draft.parameters || []).length ? h('span', { class: 'k' }, ' and ') : null,
            h('span', { class: 'y' },
              (draft.handlers || []).map((handler) => handler.event).filter(Boolean).join(', ') || '(nothing)')),
          h('div', {}, h('span', { class: 'k' }, 'guard  '),
            h('span', { class: 'k' }, (draft.parameters || []).length
              ? 'readers of the same partition are serialised against each other'
              : 'no tag — every reader is serialised against every other')))
      : null,
  ];
}

function renderProjections(ctx, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Projections'),
    h('div', { class: 'muted small' },
      'A projection folds events into a value. An ', h('b', {}, 'entity projection'),
      ' is one scoped to an entity’s own identity — what everywhere else on this page calls a '
      + 'property. A ', h('b', {}, 'standalone projection'),
      ' is the same machinery kept for something else instead: nothing at all, which is what a '
      + 'global numbering is, or a declared tag, which is what a numbering kept per tenant is. '
      + 'Standalone projections are created and edited here; entity projections are indexed here '
      + 'and edited on their entity’s own page.')));

  main.appendChild(h('h4', {}, 'Standalone projections'));
  const names = Object.keys(ctx['projection-definitions']).sort();
  if (!names.length && !state.newProjection) {
    main.appendChild(h('div', { class: 'empty' }, 'No projections yet.'));
  }

  for (const name of names) {
    const body = ctx['projection-definitions'][name];
    const card = h('div', { class: 'ecard' });
    const editing = state.projDraft && state.projDraft.name === name;

    if (state.renamingProjection === name) {
      card.appendChild(inlineForm({
        question: 'Rename — every reference is rewritten with it', submitLabel: 'Rename',
        value: readable(name), showsIdentifier: true,
        onSubmit: (v) => {
          const next = toPascal(v);
          state.renamingProjection = null;
          if (next && next !== name) run(() => renameDefinition('projection-definition', ctx.id, name, next));
          else render();
        },
        onCancel: () => { state.renamingProjection = null; render(); },
      }));
    } else {
      card.appendChild(qrow('div', { cls: 'ehead', key: 'projection:' + name },
        h('span', { class: 'chip projection' }, readable(name)),
        h('span', { class: 'muted tiny' }, projectionWords(ctx, body)),
        h('span', { style: 'flex:1' }),
        reveal(
          advanced() ? h('span', { class: 'tech' }, name) : null,
          h('button', {
            class: 'btn tiny',
            onclick: () => {
              state.newProjection = null; state.renamingProjection = null;
              state.projDraft = editing ? null : { name, body: deepClone(body) };
              render();
            },
          }, editing ? 'Close' : 'Edit'),
          h('button', {
            class: 'btn tiny',
            onclick: () => { closeForms(); state.renamingProjection = name; render(); },
          }, 'Rename'),
          removeButton('projection:' + name, {
            label: 'Remove', title: 'Remove this projection',
            onRemove: () => run(() => removeDefinition('projection-definition', ctx.id, name)),
          }))));
    }

    if (editing) {
      const draft = state.projDraft.body;
      card.appendChild(h('div', { class: 'card projection' },
        ...projectionFields(ctx, draft),
        h('div', { class: 'adder', style: 'margin-top:10px' },
          h('button', {
            class: 'btn primary',
            onclick: () => run(() => {
              updateDefinition('projection-definition', ctx.id, name, draft);
              state.projDraft = null;
            }),
          }, 'Save'),
          h('button', {
            class: 'btn ghost',
            onclick: () => { state.projDraft = null; render(); },
          }, 'Discard changes'))));
    }

    main.appendChild(card);
  }

  if (state.newProjection) {
    const draft = state.newProjection;
    const card = h('div', { class: 'ecard' });
    card.appendChild(h('div', { class: 'q', style: 'font-size:11px;color:var(--muted);margin-bottom:6px' },
      'What is this projection of?'));
    card.appendChild(h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, placeholder: 'course numbering',
        oninput: (e) => { draft.name = e.target.value; },
      })));
    card.appendChild(h('div', { class: 'card projection' }, ...projectionFields(ctx, draft.body)));
    card.appendChild(h('div', { class: 'adder', style: 'margin-top:10px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const projectionName = toPascal(draft.name);
          if (!projectionName) return toast('Give the projection a name.', true);
          run(() => {
            addDefinition('projection-definition', ctx.id, projectionName, draft.body);
            state.newProjection = null;
          });
        },
      }, 'Create'),
      h('button', { class: 'btn ghost', onclick: () => { state.newProjection = null; render(); } }, 'Cancel')));
    main.appendChild(card);
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          closeForms();
          state.newProjection = {
            name: '',
            body: {
              valueType: projectionTypeOptions(ctx)[0] ? projectionTypeOptions(ctx)[0][0] : 'string',
              initialValue: '', advancedBy: [{ event: '', property: '' }],
            },
          };
          render();
        },
      }, '+ New projection')));
  }

  // Entity projections, indexed rather than edited: the entity's own
  // page already does that, and a second form editing the same stored
  // property is exactly the drift two independent editors invite.
  const entityNames = Object.keys(ctx['entity-definitions']).sort()
    .filter((n) => (ctx['entity-definitions'][n].properties || []).length);
  if (entityNames.length) {
    main.appendChild(h('h4', { style: 'margin-top:28px' }, 'Entity projections'));
    for (const entityName of entityNames) {
      const entity = ctx['entity-definitions'][entityName];
      main.appendChild(h('div', { class: 'ecard' },
        h('div', { class: 'ehead' }, entityRef(ctx, entityName)),
        h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:8px' },
          (entity.properties || []).map((p) => h('span', {
            class: 'chip entity linkable', title: 'Open ' + readable(entityName) + ' to edit this',
            onclick: () => openEntity(entityName),
          }, propertyWords(p.name))))));
    }
  }
}

// ---------- events ----------
//
// The one place every event definition lives, recorded or not. A
// command's publish list only ever showed the events *it* records, and
// an event nothing records yet had nowhere to be shown at all — this
// page is both of those, for every event, at once. Shape — name, mark,
// fields — is owned here; a command's own page keeps only how *it*
// maps its own values into an already-declared field
// (see `eventFields`).
function renderEvents(ctx, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Events'),
    h('div', { class: 'muted small' },
      'Everything that has ever happened, named and shaped. An event may be recorded by no '
      + 'command, one, or several — and read by no projection, one, or several — which is why it '
      + 'has a page of its own rather than living on any one of theirs.')));

  const names = Object.keys(ctx['event-definitions']).sort();
  if (!names.length && !state.newEvent) {
    main.appendChild(h('div', { class: 'empty' }, 'No events yet.'));
  }

  for (const name of names) main.appendChild(eventCard(ctx, name));

  if (state.newEvent) {
    const draft = state.newEvent;
    const card = h('div', { class: 'ecard' });
    card.appendChild(h('div', { class: 'q', style: 'font-size:11px;color:var(--muted);margin-bottom:6px' },
      'What happened?  (past tense)'));
    card.appendChild(h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, placeholder: 'course capacity reached',
        oninput: (e) => { draft.name = e.target.value; },
      })));
    card.appendChild(h('div', { class: 'adder', style: 'margin-top:10px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const eventName = toPascal(draft.name);
          if (!eventName) return toast('Give the event a name.', true);
          run(() => {
            addDefinition('event-definition', ctx.id, eventName, { properties: [] });
            state.newEvent = null;
            state.openEvent = eventName;
          });
        },
      }, 'Create'),
      h('button', { class: 'btn ghost', onclick: () => { state.newEvent = null; render(); } }, 'Cancel')));
    main.appendChild(card);
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        title: 'An event does not need a command yet — record it later from any command’s '
          + '"record something already known".',
        onclick: () => { closeForms(); state.newEvent = { name: '' }; render(); },
      }, '+ New event')));
  }
}

function eventCard(ctx, name) {
  const event = ctx['event-definitions'][name];
  const open = state.openEvent === name;
  const publishers = publishersOf(ctx, name);
  const subscribers = [...effectsOf(ctx, name), ...projectionsHandling(ctx, name)];
  const scenarios = scenariosReferencingEvent(ctx, name);
  const card = h('div', { class: 'ecard' });

  // Renaming rewrites every entity handler, every projection handler,
  // every command's `publishes` and every scenario that names it, all
  // in the same append.
  if (state.renamingEvent === name) {
    card.appendChild(inlineForm({
      question: 'Rename — every reference is rewritten with it', submitLabel: 'Rename',
      value: readable(name), showsIdentifier: true,
      onSubmit: (v) => {
        const next = toPascal(v);
        state.renamingEvent = null;
        if (next && next !== name) {
          run(() => {
            warnScripted(ctx, name);
            renameDefinition('event-definition', ctx.id, name, next);
            if (state.openEvent === name) state.openEvent = next;
          });
        } else render();
      },
      onCancel: () => { state.renamingEvent = null; render(); },
    }));
    return card;
  }

  const pickingIcon = state.eventIconPicker === name;
  card.appendChild(qrow('div', { cls: 'ehead', key: 'event:' + name },
    h('button', {
