// initial value to state, a projection parameter is always a single
// required identifier.
function memberEditor(ctx, { member, where, types, allow = {}, onReplace, onRename }) {
  const close = () => { state.editMember = null; render(); };
  let name = member.name;
  const options = types || typeOptions(ctx);
  const doRename = () => {
    const next = toCamel(name);
    if (!next) return toast('Give it a name.', true);
    if (next === member.name) return close();
    state.editMember = { where, name: next };
    run(() => onRename(next));
  };

  return h('div', { class: 'member-editor' },
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: member.name, style: 'width:190px',
        oninput: (e) => { name = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } },
      }),
      h('button', {
        class: 'btn tiny', title: 'Rename, rewriting every reference to it',
        onclick: doRename,
      }, 'Rename'),
      h('span', { class: 'muted tiny' }, 'is a'),
      pick(options, member.propertyType, (v) => onReplace(retypeProperty(ctx, member, { propertyType: v }))),
      allow.arity === false ? null : h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: !!member.isList,
          onchange: (e) => onReplace(retypeProperty(ctx, member, { isList: e.target.checked })),
        }), ' many'),
      allow.arity === false ? null : h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: !!member.isOptional,
          onchange: (e) => onReplace(retypeProperty(ctx, member, { isOptional: e.target.checked })),
        }), ' optional'),
      h('button', { class: 'btn ghost tiny', onclick: close }, 'Done')),
    allow.initialValue ? initialValueField(ctx, member, onReplace) : null);
}

// What a property reads before any event has been applied. Offered as
// a picker over the enum's members when it has one, and as a literal
// otherwise — a list or an optional property has only one sensible
// starting value, so neither is asked about.
function initialValueField(ctx, property, onReplace) {
  if (property.isList || property.isOptional) {
    return h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'starts as ',
        h('code', {}, property.isList ? 'nothing yet' : 'unset')));
  }
  const members = enumMembersFor(ctx, property.propertyType);
  if (members) {
    return h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'starts as'),
      pick(members.map((m) => [m, readable(m)]),
        operandSource(property.initialValue) === 'enum-member' ? property.initialValue.enumMember : '',
        (v) => onReplace({ ...property, initialValue: { enumMember: v } })));
  }
  return h('div', { class: 'adder' },
    h('span', { class: 'muted tiny' }, 'starts as'),
    h('input', {
      type: 'text', style: 'width:150px',
      value: property.initialValue === undefined || property.initialValue === null
        ? '' : String(property.initialValue),
      onblur: (e) => {
        const parsed = literalOfType(ctx, property.propertyType, e.target.value);
        if (parsed === undefined) return toast('That is not a ' + readable(property.propertyType) + '.', true);
        onReplace({ ...property, initialValue: parsed });
      },
      onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
    }));
}

// Reads a typed literal out of what someone typed. `undefined` means
// it does not belong to the type, which is a refusal rather than a
// silent coercion.
function literalOfType(ctx, typeName, text) {
  const trimmed = (text || '').trim();
  const schema = underlyingSchema(ctx, typeName);
  const kind = schema && schema.type;
  if (kind === 'integer' || kind === 'number') {
    const n = Number(trimmed);
    return trimmed === '' || Number.isNaN(n) ? undefined : n;
  }
  if (kind === 'boolean') {
    if (/^(true|yes)$/i.test(trimmed)) return true;
    if (/^(false|no)$/i.test(trimmed)) return false;
    return undefined;
  }
  return trimmed;
}

// ---------- picking an operand ----------
//
// Most operands are chosen from what is in scope, but a literal is
// typed, so the picker carries one extra row for it. Choosing that row
// swaps in a text input; the text lives beside the choice in the
// draft, so a repaint between keystrokes does not lose it.
const LITERAL = ' literal';

// Reads the operand a draft field currently describes, or undefined
// when it describes nothing.
function draftOperand(draft, key) {
  const choice = draft[key];
  if (choice === undefined || choice === '') return undefined;
  if (choice !== LITERAL) return JSON.parse(choice);
  const text = (draft[key + 'Text'] || '').trim();
  if (text === '') return undefined;
  // Untyped here on purpose: the operand has no declared type of its
  // own, and the model checks it against whatever it is compared with.
  if (/^-?\d+(\.\d+)?$/.test(text)) return Number(text);
  if (/^(true|false)$/i.test(text)) return /^true$/i.test(text);
  return text;
}

// Sets a draft field from an operand that already exists, so opening
// an editor shows what is there rather than a blank.
function draftFromOperand(draft, key, operand) {
  if (operand === undefined) { draft[key] = ''; return draft; }
  if (operand !== null && typeof operand === 'object') {
    draft[key] = JSON.stringify(operand);
  } else {
    draft[key] = LITERAL;
    draft[key + 'Text'] = String(operand);
  }
  return draft;
}

function operandPicker(choices, draft, key, { placeholder, allowLiteral = true } = {}) {
  const rows = allowLiteral ? [...choices, [LITERAL, '— a value…']] : choices;
  const control = [pick(rows, draft[key], (v) => {
    draft[key] = v;
    render();
  }, placeholder)];
  if (draft[key] === LITERAL) {
    control.push(h('input', {
      type: 'text', style: 'width:110px', placeholder: 'e.g. 10',
      value: draft[key + 'Text'] || '',
      oninput: (e) => { draft[key + 'Text'] = e.target.value; },
    }));
  }
  return control;
}

// Everything readable at a given point in a command's boundary: the
// payload, and the bindings declared *above* this one. A binding may
// only draw from what came before it, so the list is what makes that
// rule visible instead of only enforced.
function operandChoicesAbove(ctx, slice, index) {
  const out = [...payloadChoices(ctx, slice.payload)];
  slice.reads.slice(0, index === undefined ? undefined : index).forEach((b) => {
    if (b.projection) {
      out.push([JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]);
      return;
    }
    const entity = ctx['entity-definitions'][b.entity];
    (entity ? entity.properties : []).forEach((p) =>
      out.push([JSON.stringify({ alias: b.alias, property: p.name }),
        entityIcon(ctx, b.entity) + ' ' + memberWords(b.alias, p.name)]));
  });
  return out;
}

// ---------- small helpers ----------

function patch(kind, name, mutate) {
  const ctx = activeContext();
  const body = deepClone(ctx[DEF_COLLECTIONS[kind]][name]);
  mutate(body);
  run(() => updateDefinition(kind, ctx.id, name, body));
}
const patchSlice = (mutate) => patch('command-definition', state.slice, mutate);

// A name as a modeler reads it, with the stored identifier alongside
// once they have asked to see that sort of thing.
function named(name, cls) {
  return h('span', { class: cls || '' }, readable(name),
    advanced() ? h('span', { class: 'tech' }, name) : null);
}

// A thing has one page, and every mention of it is the way there. It
// replaces what it was next to rather than sliding in over it: two
// things half on screen is how the old panel got unreadable, and the
// rail keeps the way back.
function openEntity(name) {
  closeForms();
  state.entitiesCollapsed = false;
  state.view = 'entity';
  state.entity = name;
  state.entityTab = 'definition';
  render();
}

// Every mention of a thing, anywhere: its mark, its name, and the way
// in. One shape, so the mark is worth learning.
function entityRef(ctx, name, { cls = 'chip entity', text } = {}) {
  return h('span', {
    class: cls, title: 'Open ' + readable(name),
    onclick: () => openEntity(name),
  }, h('i', { class: 'ic' }, entityIcon(ctx, name)),
    text === undefined ? readable(name) : text);
}

// An event has its own page too, for the same reason an entity does:
// it is named from more than one place — a command's publish list, an
// entity's or a projection's handlers, a scenario's Given — and every
// one of those is the way there.
function goToEvent(name) {
  closeForms();
  state.view = 'events';
  state.openEvent = name;
  state.land = `[data-key="${CSS.escape('event:' + name)}"]`;
  render();
}
function eventRef(ctx, name, { cls = 'chip event linkable', text } = {}) {
  return h('span', {
    class: cls, title: 'Open ' + readable(name),
    onclick: () => goToEvent(name),
  }, h('i', { class: 'ic' }, eventIcon(ctx, name)), text === undefined ? readable(name) : text);
}

// A custom type has no page of its own — it lives as a card in Custom
// Types — so opening one means landing on that card rather than
// switching to a dedicated view the way an entity or event does.
function goToCustomType(name) {
  closeForms();
  state.view = 'types';
  state.land = `[data-key="${CSS.escape('type:' + name)}"]`;
  render();
}

function goToCommand(name) {
  closeForms();
  state.view = 'slice';
  state.slice = name;
  state.tab = 'definition';
  render();
}
function commandRef(ctx, name, { cls = 'chip command linkable', text } = {}) {
  return h('span', {
    class: cls, title: 'Open ' + readable(name),
    onclick: () => goToCommand(name),
  }, text === undefined ? readable(name) : text);
}

function goToProjection(name) {
  closeForms();
  state.view = 'projections';
  state.land = `[data-key="${CSS.escape('projection:' + name)}"]`;
  render();
}
function projectionRef(ctx, name, { cls = 'chip projection linkable', text } = {}) {
  return h('span', {
    class: cls, title: 'Open ' + readable(name),
    onclick: () => goToProjection(name),
  }, text === undefined ? readable(name) : text);
}

// A specific scenario, wherever it is shown, is always reached the
// same way — see `problems`, which this mirrors.
function goToScenario(ctx, key) {
  const body = ctx['scenario-definitions'][key];
  if (!body) return;
  closeForms();
  state.view = 'slice';
  state.slice = body.command;
  state.tab = 'scenarios';
  state.openScenario = key;
  render();
}
function goToPropertyScenario(ctx, key) {
  const body = ctx['property-scenario-definitions'][key];
  if (!body) return;
  closeForms();
  state.view = 'entity';
  state.entity = body.entity;
  state.entityTab = 'property-scenarios';
  state.openPropertyScenario = key;
  render();
}

function typeChoices(ctx) {
  if (advanced()) return allTypeNames(ctx);
  return [...SIMPLE_TYPES, ...Object.keys(ctx['entity-definitions']).sort().map((n) => idTypeOf(ctx, n))];
}
function typeOptions(ctx) {
  return typeChoices(ctx).map((t) => [t, readable(t)]);
}

// An option built as "🔖 Name" reads fine, but a native <option> has
// no separate accessible label — arrow-key type-ahead searches the
// same text a screen reader gets, so it can only ever match the first
// character actually typed, which here is the icon. Splitting the icon
// into its own trailing span puts the name first in that text without
// giving up the icon (see the `.icon-select` CSS, which puts it back
// in front visually on browsers that support customizable <select>).
const ICON_PREFIX = /^(?:\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)+\s*/u;

// The same "alias · property" text that makes a flat list readable —
// "given · course id", "course · capacity", "status · Existent" —
// says exactly where an <optgroup> belongs: one per alias, holding
// just the properties, so a list naming three things a command read
// stops looking like nine unrelated rows. A prefix with only one
// property under it stays a plain option in its full "alias ·
// property" form — a group of one is not a group, and the context
// would otherwise be lost.
const GROUP_SEP = ' · ';

function pick(options, value, onchange, placeholder) {
  const sel = h('select', { onchange: (e) => onchange(e.target.value) });
  if (placeholder) sel.appendChild(h('option', { value: '' }, placeholder));

  const buckets = new Map(); // prefix -> [{v, suffix}]
  const sequence = []; // {text} | {prefix}, in first-seen order
  for (const o of options) {
    const [v, text] = Array.isArray(o) ? o : [o, o];
    const at = text.indexOf(GROUP_SEP);
    if (at === -1) { sequence.push({ v, text }); continue; }
    const prefix = text.slice(0, at);
    if (!buckets.has(prefix)) { buckets.set(prefix, []); sequence.push({ prefix }); }
    buckets.get(prefix).push({ v, suffix: text.slice(at + GROUP_SEP.length) });
  }

  let hasIcon = false;
  const appendOption = (parent, v, text) => {
    const match = text.match(ICON_PREFIX);
    if (match) {
      hasIcon = true;
      parent.appendChild(h('option', { value: v, selected: v === value },
        h('span', { class: 'label' }, text.slice(match[0].length)),
        h('span', { class: 'icon' }, match[0].trimEnd())));
    } else {
      parent.appendChild(h('option', { value: v, selected: v === value }, text));
    }
  };

  for (const entry of sequence) {
    if ('text' in entry) { appendOption(sel, entry.v, entry.text); continue; }
    const rows = buckets.get(entry.prefix);
    if (rows.length === 1) {
      appendOption(sel, rows[0].v, entry.prefix + GROUP_SEP + rows[0].suffix);
      continue;
    }
    const group = h('optgroup', { label: entry.prefix });
    for (const { v, suffix } of rows) appendOption(group, v, suffix);
    sel.appendChild(group);
  }

  if (hasIcon) {
    sel.classList.add('icon-select');
    sel.insertBefore(h('button', {}, h('selectedcontent', {})), sel.firstChild);
  }
  return sel;
}

// The one thing that replaces every prompt(): a labelled field, a live
// preview of what it will be stored as, and two buttons.
function inlineForm({ question, placeholder, value = '', showsIdentifier, submitLabel, onSubmit, onCancel }) {
  let text = value;
  const preview = h('span', { class: 'becomes' }, '');
  const paint = () => {
    preview.innerHTML = '';
    if (showsIdentifier && text.trim()) preview.appendChild(document.createTextNode('→ ' + toPascal(text)));
  };
  const input = h('input', {
    type: 'text', value, placeholder, style: 'width:280px',
    oninput: (e) => { text = e.target.value; paint(); },
    onkeydown: (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
    },
  });
  const submit = () => {
    if (!text.trim()) return toast('Give it a name.', true);
    onSubmit(text.trim());
  };
  paint();
  setTimeout(() => input.focus(), 0);
  return h('div', { class: 'inline-form' },
    question ? h('div', { class: 'q' }, question) : null,
    h('div', { class: 'adder' }, input, preview,
      h('button', { class: 'btn primary', onclick: submit }, submitLabel || 'Add'),
      h('button', { class: 'btn ghost', onclick: onCancel }, 'Cancel')));
}

// Every form that can be open: something being named, renamed, or
// filled in. They are listed rather than written out one by one because
// Escape has to know whether any of them is on screen, and the two
// answers must not drift apart.
const FORM_KEYS = [
  'namingCommand', 'newFeature', 'renamingFeature', 'newEntityAt', 'addingProp', 'addingMember',
  'renamingEntity', 'iconPicker', 'eventIconPicker', 'commandIconPicker', 'confirmRemove', 'newType', 'renamingType',
  'newProjection', 'renamingProjection', 'projDraft', 'newEvent', 'renamingEvent',
  'renamingCommand', 'editMember', 'editRule', 'editBinding',
  'scenarioDraft', 'renamingScenario', 'sandboxDraft',
  'editHandler', 'propertyScenarioDraft', 'renamingPropertyScenario',
  'pendingImport',
];

// What a form was holding while it was open. These outlive the form
// that filled them — a folded-away adder leaves its half-written row
// behind — so they are cleared with the forms but never taken as
// evidence that one is open.
const DRAFT_KEYS = ['bindingDraft', 'ruleDraft', 'changeDraft', 'readDraft', 'entityHandlerDraft', 'entityPropertyDraft'];

const formOpen = () => FORM_KEYS.some((key) => state[key]);

const closeForms = () => {
  for (const key of [...FORM_KEYS, ...DRAFT_KEYS]) state[key] = null;
  state.sel = null; state.adder = null; state.lit = null;
};

// ---------- rail ----------

function renderRail() {
  const ctx = activeContext();
  const rail = document.getElementById('rail');
  // Only meaningful on a narrow screen — off-canvas there, an ordinary
  // column everywhere else, entirely by CSS. See `.rail` / media query.
  rail.classList.toggle('open', !!state.railOpen);
  document.getElementById('rail-backdrop').classList.toggle('open', !!state.railOpen);
  rail.innerHTML = '';
  rail.appendChild(h('h4', {}, 'Features'));

  for (const group of featureGroups(ctx)) {
    if (state.renamingFeature === group.name) {
      rail.appendChild(inlineForm({
        question: 'Rename this feature', value: group.name, submitLabel: 'Rename',
        onSubmit: (v) => { renameFeature(ctx, group.name, v); },
        onCancel: () => { state.renamingFeature = null; render(); },
      }));
    } else {
      const collapsed = !!state.collapsed[group.name];
      rail.appendChild(h('div', { class: 'group' },
        h('span', {
          class: 'caret', onclick: () => { state.collapsed[group.name] = !collapsed; render(); },
        }, collapsed ? '▸' : '▾'),
        h('span', {
          class: 'gname',
          title: group.name === UNGROUPED ? '' : 'Rename',
          onclick: () => {
            if (group.name === UNGROUPED) return;
            closeForms(); state.renamingFeature = group.name; render();
          },
        }, group.name),
        h('span', { class: 'gcount' }, group.commands.length),
        // A feature is not a definition — it exists because commands
        // name it — so removing one leaves its commands where they are,
        // ungrouped.
        group.name === UNGROUPED ? null : h('span', {
          class: 'rm' + (state.confirmRemove === 'feature:' + group.name ? ' on' : ''),
        },
          removeButton('feature:' + group.name, {
            title: 'Remove this feature. Its commands stay, ungrouped.',
            onRemove: () => removeFeature(ctx, group.name),
          }))));
      if (collapsed) continue;
    }

    for (const name of group.commands) {
      rail.appendChild(h('a', {
        href: '#', class: 'cmd' + (name === state.slice && state.view === 'slice' ? ' on' : ''),
        // Only the name. What this command records is on the page it
        // opens, where it can be changed; the stored identifier waits
        // for the pointer rather than sitting under every row.
        title: name,
        onclick: (e) => {
          e.preventDefault(); closeForms();
          state.slice = name; state.openEvent = null; state.view = 'slice'; render();
        },
      }, readable(name)));
    }
    if (!group.commands.length) rail.appendChild(h('div', { class: 'gempty' }, 'nothing in it yet'));
  }

  rail.appendChild(h('div', { class: 'add' },
    h('button', { class: 'btn', onclick: () => beginNewCommand(ctx) }, '+ Command'),
    h('button', {
      class: 'btn ghost', onclick: () => { closeForms(); state.newFeature = true; render(); },
    }, '+ Feature')));

  if (state.namingCommand) {
    rail.appendChild(inlineForm({
      question: 'What can someone do?', placeholder: 'define course', showsIdentifier: true,
      onSubmit: (v) => createCommand(ctx, v),
      onCancel: () => { state.namingCommand = false; render(); },
    }));
  }

  if (state.newFeature) {
    rail.appendChild(inlineForm({
      question: 'What should this group of commands be called?',
      placeholder: 'Course management',
      onSubmit: (v) => {
        if (featureGroups(ctx).some((g) => g.name === v)) return toast('That feature already exists.', true);
        addPendingFeature(v); state.newFeature = false; render();
      },
      onCancel: () => { state.newFeature = false; render(); },
    }));
  }

  // Projections are advanced by nature, but a context that already has
  // one has to offer a way in whatever mode you are in — otherwise the
  // model holds something the interface refuses to show.
  const projectionNames = Object.keys(ctx['projection-definitions']);
  {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Model'));
    // The things themselves are not an advanced idea: a first model is
    // mostly deciding what they are. Only what a modeler never has to
    // state — value types, identifier schemas — waits for Advanced.
    //
    // They are listed one by one, like the commands above: a thing has
    // a page, and the rail is where you get to it and where you see
    // how many of them the model has grown.
    rail.appendChild(renderEntityRail(ctx));
    if (advanced()) {
      rail.appendChild(h('a', {
        href: '#', class: state.view === 'types' ? 'on' : '',
        title: Object.keys(ctx['custom-type-definitions']).length + ' declared',
        onclick: (e) => {
          e.preventDefault(); closeForms();
          state.view = 'types'; render();
        },
      }, 'Custom types'));
    }
    if (advanced() || projectionNames.length) rail.appendChild(h('a', {
      href: '#', class: state.view === 'projections' ? 'on' : '',
      // A slice that binds a projection points here: the projection is
      // the source, and it lives nowhere else on that page.
      'data-src': projectionNames.map((n) => 'projection:' + n).join(' ') || null,
      title: projectionNames.length
        ? projectionNames.map(readable).join(', ')
        : 'nothing projected outside an entity yet',
      onclick: (e) => {
        e.preventDefault(); closeForms();
        state.view = 'projections'; render();
      },
    }, 'Projections'));
    const eventNames = Object.keys(ctx['event-definitions']);
    if (advanced() || eventNames.length) rail.appendChild(h('a', {
      href: '#', class: state.view === 'events' ? 'on' : '',
      'data-src': eventNames.map((n) => 'event:' + n).join(' ') || null,
      title: eventNames.length ? eventNames.map(readable).join(', ') : 'nothing recorded yet',
      onclick: (e) => {
        e.preventDefault(); closeForms();
        state.view = 'events'; render();
      },
    }, 'Events'));
  }

  // Neither of these is a definition of its own — each reads across
  // every command at once rather than living on any one of theirs,
  // the way Events reads across every command that publishes one.
  if (Object.keys(ctx['command-definitions']).length) {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Overview'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'coupling' ? 'on' : '',
      title: 'Which commands write or read back which events',
      onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'coupling'; render(); },
    }, 'Coupling'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'rulemap' ? 'on' : '',
      title: 'Every command, its rules, and what it records',
      onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'rulemap'; render(); },
    }, 'Rule map'));
  }

  // The sandbox belongs to no definition, so it hangs off nothing in
  // the lists above. It is last because it is where you go once there
  // is something to try.
  rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Try it'));
  rail.appendChild(h('a', {
    href: '#', class: 'sandbox' + (state.view === 'sandbox' ? ' on' : ''),
    title: session.log.length
      ? session.log.length + ' event' + (session.log.length === 1 ? '' : 's') + ' in this session'
      : 'Drive the commands and watch what happens',
    onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'sandbox'; render(); },
  }, h('span', { class: 'grow' }, 'Sandbox'), session.log.length
    ? h('span', { class: 'gcount' }, session.log.length)
    : null));


  // Where an entity ends up once the last thing that used it is gone.
  // Nothing references it, so this is the one place its removal can
  // never be refused. An orphaned event is not shown here any more —
  // the Events page above is now the one place for those, recorded or
  // not.
  const loose = orphans(ctx);
  if (loose.entities.length) {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Nothing uses these'));
    const looseRow = (kind, name, chip) => rail.appendChild(
      qrow('div', { cls: 'loose', key: 'loose:' + name }, chip, h('span', { style: 'flex:1' }),
        reveal(removeButton(kind + ':' + name, {
          title: 'Remove this definition', onRemove: () => run(() =>
            removeDefinition('entity-definition', ctx.id, name)),
        }))));
    for (const n of loose.entities) {
      looseRow('entity', n, entityRef(ctx, n));
    }
  }
}

// The things themselves, in the rail: one entry each, under a heading
// that folds them away — the same two levels the features above use,
// because they are read the same way.
function renderEntityRail(ctx) {
  const names = Object.keys(ctx['entity-definitions']).sort();
  const collapsed = state.entitiesCollapsed;
  const toggle = () => { state.entitiesCollapsed = !collapsed; render(); };
  const box = h('div', {});

  box.appendChild(h('div', { class: 'group' },
    h('span', { class: 'caret', onclick: toggle }, collapsed ? '▸' : '▾'),
    h('span', { class: 'gname', title: 'Show or hide', onclick: toggle }, 'Entities'),
    h('span', { class: 'gcount' }, names.length)));
  if (collapsed) return box;

  for (const name of names) {
    box.appendChild(h('a', {
      href: '#',
      class: 'cmd ent' + (state.view === 'entity' && state.entity === name ? ' on' : ''),
      title: name,
      onclick: (e) => { e.preventDefault(); openEntity(name); },
    }, h('i', { class: 'ic' }, entityIcon(ctx, name)), readable(name)));
  }
  if (!names.length) box.appendChild(h('div', { class: 'gempty' }, 'nothing modelled yet'));

  if (state.newEntityAt === 'rail') {
    box.appendChild(inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => {
        state.newEntityAt = null;
        const created = createEntity(ctx, v);
        if (created) openEntity(created);
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    box.appendChild(h('div', { class: 'add' }, h('button', {
      class: 'btn ghost',
      onclick: () => { closeForms(); state.newEntityAt = 'rail'; render(); },
    }, '+ Entity')));
  }
  return box;
}

// The feature name comes off every command that carries it; the
// commands themselves are untouched.
function removeFeature(ctx, name) {
  run(() => {
    for (const [command, body] of Object.entries(activeContext()['command-definitions'])) {
      if (featureOf(body) !== name) continue;
      const next = deepClone(body);
      delete next.feature;
      updateDefinition('command-definition', ctx.id, command, next);
    }
    setPendingFeatures(pendingFeatures().filter((p) => p !== name));
  });
}

function renameFeature(ctx, from, to) {
  if (from === UNGROUPED || to === from) { state.renamingFeature = null; return render(); }
  run(() => {
    for (const [cmd, body] of Object.entries(activeContext()['command-definitions'])) {
      if (featureOf(body) !== from) continue;
      const next = deepClone(body);
      next.feature = to;
      updateDefinition('command-definition', ctx.id, cmd, next);
    }
    setPendingFeatures(pendingFeatures().filter((p) => p !== from).concat(to));
    state.renamingFeature = null;
  });
}

// ---------- describing a new command ----------

// Naming is the only thing a command cannot do without, so it is the
// only question asked up front — an inline field, not a page of its
// own. Everything else (what it takes, what it reads, what it decides,
// what it records) is added afterwards, on the command's own page,
// the same way it would be for a command that already existed.
function beginNewCommand(ctx) {
  closeForms();
  state.namingCommand = true;
  render();
}

function createCommand(ctx, label) {
  const name = toPascal(label);
  if (!name) return toast('Give it a name.', true);
  const current = state.slice && ctx['command-definitions'][state.slice]
    ? featureOf(ctx['command-definitions'][state.slice]) : UNGROUPED;
  // A command with nothing it records is not one the model can hold —
  // so a starting event comes along with it, guessed from the command's
  // own name the same way the event field always was. It is an ordinary
  // event from here on: rename it, retarget it, add fields to it, all
  // on this same page.
  const eventName = toPascal(suggestEventName(label));
  run(() => {
    if (!activeContext()['event-definitions'][eventName]) {
      addDefinition('event-definition', ctx.id, eventName, { properties: [] });
    }
    const body = {
      properties: [], boundary: [], conditions: [],
      publishes: [{ name: eventName, parameters: {} }],
    };
    if (current !== UNGROUPED) body.feature = current;
    addDefinition('command-definition', ctx.id, name, body);
    state.namingCommand = false;
    state.view = 'slice'; state.slice = name; state.openEvent = eventName;
    // Straight into typing the first input — no click required to get
    // there.
    state.adder = 'in';
  });
}

// ---------- the slice ----------

// A repaint tears #main down and rebuilds it, which drops whatever the
// keyboard was on — the element is gone, so the browser has nothing to
// blur from and focus falls back to the document, where the next Tab
// starts over at the top rather than continuing from where the user
// was. Restoring by position — the Nth focusable thing in #main, not
// which one it was — is what keeps Tab (and Shift+Tab) moving through
// the page instead of restarting at the command title on every edit.
function mainFocusStops() {
  const main = document.getElementById('main');
  if (!main) return [];
  return [...main.querySelectorAll('a[href], button, select, input, textarea, [tabindex]')]
    .filter((el) => !el.disabled && el.tabIndex !== -1 && el.offsetParent !== null);
}
function mainFocusRank() {
  const main = document.getElementById('main');
  if (!main || !main.contains(document.activeElement)) return null;
  const at = mainFocusStops().indexOf(document.activeElement);
  return at < 0 ? null : at;
}
function restoreMainFocusRank(rank) {
  if (rank === null) return;
  const stops = mainFocusStops();
  if (stops.length) stops[Math.min(rank, stops.length - 1)].focus();
}

// A repaint, and the one thing that has to happen after every one of
// them whichever view it drew: bringing a row the interface moved you
// to on screen. It is out here because the painter below returns early
// once it knows which view it is drawing.
function render() {
  const focusRank = mainFocusRank();
  paintPage();
  restoreMainFocusRank(focusRank);
  if (!state.land) return;
  const selector = state.land;
  state.land = null;
  landOn(selector);
}

function paintPage() {
  const ctx = activeContext();
  // The splash also shows over a model that's still loaded — reached
  // from the brand mark, see the button below. Escape (and picking a
  // model, starting a new one, or loading one) clears `state.splash`
  // and lands back here with `ctx` unchanged.
  const showSplash = !ctx || state.splash;

  document.body.className = [
    isDark() ? 'f-dark' : null,
    window.scrollY > 60 ? 'scrolled' : null].filter(Boolean).join(' ');

  // Which model is open, front and center where the old dropdown used
  // to be. Off the splash it switches models, loads another, or starts
  // one; on the splash with a model still loaded, it is the way back
  // to it instead — no dialog needed for that trip.
  const modelSwitch = document.getElementById('model-switch');
  modelSwitch.innerHTML = '';
  modelSwitch.appendChild(h('button', {
    class: 'btn ghost', type: 'button',
    title: !ctx ? 'Load a model' : state.splash ? 'Back to ' + ctx.name : 'Switch or manage models',
    onclick: ctx && state.splash
      ? () => { state.splash = false; render(); }
      : () => { closeForms(); state.models = true; render(); },
  }, !ctx
    ? 'Load a model…'
    : state.splash
      ? ['← Back to ', h('span', { class: 'model-name' }, ctx.name)]
      : h('span', { class: 'model-name' }, ctx.name)));

  const tools = document.getElementById('tools');
  tools.innerHTML = '';
  const jump = document.getElementById('jump');
  jump.innerHTML = '';
  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  const menuToggle = document.getElementById('menu-toggle');
  menuToggle.innerHTML = '';

  document.querySelector('.layout').classList.toggle('no-rail', showSplash);

  if (showSplash) {
    // Nothing to search, share, or report a problem with while it's
    // up, and no rail to open — the splash is the entire page.
    actions.appendChild(settingsButton());
    document.getElementById('rail').innerHTML = '';
    const main = document.getElementById('main');
    main.innerHTML = '';
    main.className = '';
    renderSplash(main);
    renderModals();
    renderPalette();
    return;
  }

  // The rail's own toggle — visible only on a narrow screen, where the
  // rail is an off-canvas drawer rather than a permanent column. See
  // `.rail` and `.rail-backdrop` for the mobile layout.
  menuToggle.appendChild(h('button', {
    class: 'icon-btn menu-btn', type: 'button', title: 'Features and entities',
    'aria-label': 'Menu', 'aria-expanded': state.railOpen ? 'true' : 'false',
    onclick: () => { state.railOpen = !state.railOpen; render(); },
  }, h('span', { html: MENU_ICON_SVG })));

  // A scenario that no longer agrees with its command, or a loose end
  // nobody has tied — the one count of what needs attention, shown
  // only when there is any.
  const problemsBtn = problemsButton(ctx);
  if (problemsBtn) tools.appendChild(problemsBtn);

  jump.appendChild(h('button', {
    class: 'trigger', type: 'button', onclick: openPalette, 'aria-label': 'Quick open',
  }, h('span', { html: SEARCH_ICON_SVG }), h('span', { class: 'label' }, 'Quick open…'),
    h('span', { class: 'kbd' }, '⌘K')));

  actions.appendChild(h('button', {
    class: 'icon-btn', type: 'button', title: 'Import & export — ⌘S copies a link',
    'aria-label': 'Import and export', onclick: openImportExport,
  }, importExportIcon()));
  actions.appendChild(settingsButton());

  renderModals();
  renderPalette();

  const names = Object.keys(ctx['command-definitions']);
  if (state.view === 'slice' && (!state.slice || !names.includes(state.slice))) {
    state.slice = names[0] || null;
    state.tab = 'definition';
  }
  if (state.view === 'types' && !advanced()) state.view = 'slice';
  if (state.view === 'projections' && !advanced() && !Object.keys(ctx['projection-definitions']).length) {
    state.view = 'slice';
  }
  if (state.view === 'events' && !advanced() && !Object.keys(ctx['event-definitions']).length) {
    state.view = 'slice';
  }
  if ((state.view === 'coupling' || state.view === 'rulemap') && !names.length) {
    state.view = 'slice';
  }
  // A thing removed from under its own page leaves the page with
  // nothing to show; the next one along is a better answer than a blank.
  if (state.view === 'entity' && !ctx['entity-definitions'][state.entity]) {
    const rest = Object.keys(ctx['entity-definitions']).sort();
    state.entity = rest[0] || null;
    state.entityTab = 'definition';
    if (!state.entity) state.view = 'slice';
  }
  renderRail();

  const main = document.getElementById('main');
  main.innerHTML = '';
  main.className = 'slice' + (state.view === 'coupling' || state.view === 'rulemap' ? ' wide' : '');

  if (state.view === 'sandbox') return renderSandbox(ctx, main);
  if (state.view === 'entity') return renderEntity(ctx, main);
  if (state.view === 'types') return renderCustomTypes(ctx, main);
  if (state.view === 'projections') return renderProjections(ctx, main);
  if (state.view === 'events') return renderEvents(ctx, main);
  if (state.view === 'coupling') return renderCoupling(ctx, main);
  if (state.view === 'rulemap') return renderRuleMap(ctx, main);

  if (!state.slice) {
    // With nothing to keep track of, a command has no identifier to be
    // given and every event it records is tagless — a model that cannot
    // say what any of it is *about*. So an empty context is pointed at a
    // thing first, and only then at what someone can do to one.
    if (!Object.keys(ctx['entity-definitions']).length) {
      main.appendChild(h('div', { class: 'blank' },
        h('h2', {}, 'Nothing here yet'),
        h('p', { class: 'muted small' },
          'Start with something the model keeps track of — a course, a student, an order. '
          + 'It brings an identifier with it, and that identifier is what every event about '
          + 'one of them is tagged with. Commands come next, and everything else gets built '
          + 'from inside them.'),
        state.newEntityAt === 'blank'
          ? inlineForm({
              question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
              showsIdentifier: true,
              onSubmit: (v) => {
                state.newEntityAt = null;
                const created = createEntity(ctx, v);
                if (created) openEntity(created);
              },
              onCancel: () => { state.newEntityAt = null; render(); },
            })
          : h('div', { class: 'adder' },
              h('button', {
                class: 'btn primary',
                onclick: () => { closeForms(); state.newEntityAt = 'blank'; render(); },
              }, '+ First entity'),
              // Not a dead end: a model whose first move really is a
              // command should not have to argue with the page.
              h('button', { class: 'btn ghost', onclick: () => beginNewCommand(ctx) },
                'or start with a command'))));
      return;
    }
    main.appendChild(h('div', { class: 'blank' },
      h('h2', {}, 'Nothing here yet'),
      h('p', { class: 'muted small' },
        'Start with something someone can do. Name it and the rest of the model — what it '
        + 'reads, what it decides, what it records, what it changes, the things themselves — '
        + 'gets built from inside it.'),
      h('button', { class: 'btn primary', onclick: () => beginNewCommand(ctx) }, '+ First command')));
    return;
  }

  const slice = sliceOf(ctx, state.slice);
  main.appendChild(h('header', {},
    state.renamingCommand === slice.name
      ? inlineForm({
          // Commands are leaves on the reference graph — nothing names
          // one — so this rewrites nothing but itself.
          question: 'Rename this command', submitLabel: 'Rename',
          value: readable(slice.name), showsIdentifier: true,
          onSubmit: (v) => {
            const next = toPascal(v);
            const from = state.renamingCommand;
            state.renamingCommand = null;
            if (next && next !== from) {
              run(() => {
                renameDefinition('command-definition', ctx.id, from, next);
                state.slice = next;
              });
            } else render();
          },
          onCancel: () => { state.renamingCommand = null; render(); },
        })
      : qrow('div', { cls: 'row', key: 'cmd:' + slice.name },
          h('button', {
            class: 'icon-btn', title: 'Choose the mark this is shown with',
            onclick: () => {
              const open = state.commandIconPicker === slice.name;
              closeForms();
              state.commandIconPicker = open ? null : slice.name;
              render();
            },
          }, commandIcon(ctx, slice.name)),
          h('div', { class: 'name' }, named(slice.name)),
          h('span', { class: 'grow' }),
          // The command itself. Nothing in the model references a
          // command, so removal is never refused — which is exactly
          // why it asks first.
          reveal(
            h('button', {
              class: 'btn tiny',
              onclick: () => { closeForms(); state.renamingCommand = slice.name; render(); },
            }, 'Rename'),
            removeButton('command:' + slice.name, {
              label: 'Remove command',
              title: 'Remove this command. The events it recorded and the things it read stay.',
              onRemove: () => run(() => {
                removeDefinition('command-definition', ctx.id, slice.name);
                state.slice = null;
              }),
            }))),
    h('div', { class: 'muted small summary' },
      'Reads ' + (slice.reads.length || 'nothing')
      // Round trips, not bindings: a command that reads three things
      // in one go is cheaper than one that reads two in sequence, and
      // the summary should not hide the difference.
      + (slice.rounds.length > 1 ? ` in ${slice.rounds.length} passes over the log` : '')
      + ' · '
      + slice.rules.length + ' rule' + (slice.rules.length === 1 ? '' : 's') + ' · records '
      + (slice.emits.map((e) => readable(e.emission.name)).join(', ') || 'nothing')),
    featurePicker(ctx, slice)));

  if (state.commandIconPicker === slice.name) {
    main.appendChild(commandIconPicker(ctx, slice.name, ctx['command-definitions'][slice.name]));
  }

  main.appendChild(scenarioTabs(ctx, slice));

  if (state.tab === 'scenarios') {
    main.appendChild(scenarioPanel(ctx, slice.name));
    paintLit();
    return;
  }

  main.appendChild(stepTrigger(ctx, slice));
  main.appendChild(stepReads(ctx, slice));
  main.appendChild(stepRules(ctx, slice));
  main.appendChild(stepEmits(ctx, slice));
  main.appendChild(stepChanges(ctx, slice));
  if (advanced()) main.appendChild(stepConsistency(ctx, slice));
  else main.appendChild(h('div', { class: 'muted tiny', style: 'padding-left:26px' },
    'Switch to Advanced to see the consistency boundary this command derives.'));

  // A pinned reference outlives the repaint that follows clicking it.
  paintLit();
}

function featurePicker(ctx, slice) {
  const current = featureOf(slice.body);
  if (state.newFeature === 'slice') {
    return inlineForm({
      question: 'What should the new feature be called?', placeholder: 'Course management',
      onSubmit: (v) => { state.newFeature = false; patchSlice((b) => { b.feature = v; }); },
      onCancel: () => { state.newFeature = false; render(); },
    });
  }
  return h('div', { class: 'feature-of' },
    h('span', { class: 'muted tiny' }, 'part of'),
    pick([...featureNames(ctx).map((n) => [n, n]), [UNGROUPED, '— ungrouped —'], [NEW, '+ New feature…']],
      current, (v) => {
        if (v === NEW) { state.newFeature = 'slice'; return render(); }
        patchSlice((b) => { if (v === UNGROUPED) delete b.feature; else b.feature = v; });
      }));
}

function step(kind, title, ...body) {
  return h('section', { class: 'step ' + kind },
    h('span', { class: 'dot' }),
    h('div', { class: 'shead' }, h('h4', {}, title)),
    ...body);
}

function stepTrigger(ctx, slice) {
  const where = 'payload:' + slice.name;
  // A stale reference from before `removeEventField` existed would
  // otherwise refuse this removal for a reason no longer visible
  // anywhere — see the comment there.
  const dropProperty = (i) => patchSlice((b) => {
    pruneDanglingEmissionParameters(ctx, b);
    b.properties.splice(i, 1);
  });
  const rows = slice.payload.map((p, i) => {
    if (editingMember(where, p.name)) {
      return memberEditor(ctx, {
        member: p, where,
        onReplace: (next) => patchSlice((b) => { b.properties[i] = next; }),
        onRename: (name) => renameMember('command-definition', ctx.id, slice.name, 'property', p.name, name),
      });
    }
    const enumType = isStringEnumType(ctx, p.propertyType) ? p.propertyType : null;
    return [
      qrow('div', {
        cls: 'field', key: 'in:' + p.name, src: 'param:' + p.name,
        onRemove: () => dropProperty(i),
      },
        h('span', { class: 'nm' }, propertyWords(p.name)),
        h('span', { class: 'grow', style: 'flex:1' }),
        reveal(
          h('span', {
            class: 'chip editable', title: 'Rename or retype this input',
            onclick: () => openMember(where, p.name),
          }, readable(typeLabel(p))),
          advanced() ? h('span', { class: 'tech' }, p.name) : null,
          h('button', { class: 'btn tiny danger', onclick: () => dropProperty(i) }, '×'))),
      enumType ? h('div', { class: 'use' },
        h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(ctx, enumType)) : null,
    ];
  });
  if (!rows.length) rows.push(h('div', { class: 'empty' }, 'Takes no input.'));

  return step('trigger', 'Someone asks for this, providing',
    h('div', { class: 'card command' }, rows,
      adderSlot('in', 'trigger', '+ input', () => propertyAdder(ctx, {
        label: '+ Add input',
        onAdd: (property) => patchSlice((b) => b.properties.push(property)),
        onRemoveLast: slice.payload.length ? () => dropProperty(slice.payload.length - 1) : undefined,
        onEmptyEnter: beginReadAdder,
      }))));
}

// One binding, as a card. `index` is its position in the authored
// boundary, which is what removal needs — the rounds regroup the cards
// but never renumber the list underneath them.
function readCard(ctx, slice, binding, index, waitsFor) {
  const r = readParts(ctx, slice.body, binding);
  const sentence = r.projection
    ? h('span', { class: 'sentence' },
        h('span', { class: 'chip projection', title: 'Open ' + readable(r.projection),
          onclick: () => { closeForms(); state.view = 'projections'; render(); } },
          readable(r.projection)),
        ' as ', h('span', { class: 'op' }, r.alias),
        // No arguments means no tag: the query is scoped by event type
        // alone, which is what a global numbering is.
        r.arguments.length
          ? h('span', {}, h('span', { class: 'verb' }, ' — for '),
              ...r.arguments.flatMap((arg, i) => [
                i ? h('span', { class: 'verb' }, ' and ') : null,
                opRef((binding.arguments || {})[arg.name], null, arg.words),
              ]))
          : h('span', { class: 'verb' }, ' — the whole log'))
    : h('span', { class: 'sentence' },
        entityRef(ctx, r.entity),
        ' as ', h('span', { class: 'op' }, r.alias),
        h('span', { class: 'verb' }, r.plural ? ' — one for each ' : ' — identified by '),
        opRef(binding.id, null, r.from),
        r.excluding ? h('span', {}, h('span', { class: 'verb' }, ' except '),
          opRef(binding.excluding, null, r.excluding)) : null,
        // Arguments only appear on a binding that reads something
        // scripted, so the sentence names them rather than hiding them
        // behind the property that asked.
        r.arguments.length
          ? h('span', {}, h('span', { class: 'verb' }, ' — with '),
              ...r.arguments.flatMap((arg, i) => [
                i ? h('span', { class: 'verb' }, ' and ') : null,
                opRef((binding.arguments || {})[arg.name], null, `${arg.name} = ${arg.words}`),
              ]))
          : null);

  return h('div', { class: 'card ' + (r.projection ? 'projection' : 'entity'),
      'data-src': 'alias:' + binding.alias },
    qrow('div', { cls: 'row', key: 'read:' + binding.alias },
      sentence,
      h('span', { class: 'grow' }),
      reveal(
        h('button', {
          class: 'btn tiny',
          onclick: () => {
            closeForms();
            state.editBinding = binding.alias;
            render();
          },
        }, 'Edit'),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchSlice((b) => { b.boundary.splice(index, 1); }),
        }, '×'))),
    state.editBinding === binding.alias ? bindingEditor(ctx, slice, binding, index) : null,
    // Which read this one had to wait for. The round header carries
    // the cost; this carries the reason, and stays useful once a round
    // holds more than one card.
    (waitsFor || []).length
      ? h('div', { class: 'waits' }, '↳ needs ',
          ...waitsFor.flatMap((alias, i) => [
            i ? ' and ' : null, h('span', { class: 'op' }, alias),
          ]))
      : null);
}

// A binding opened for editing. Everything about a read is here: what
// it is called, where its identifier comes from, and the two fields
// that only apply in particular circumstances.
//
// `excluding` is offered only on a binding that fans out — there is
// nothing to exclude something *from* otherwise — and an argument row
// appears once for each argument a scripted property it reads asks
// for, which is the same rule the model enforces. A field that could
// not mean anything here is left off the page rather than shown and
// then refused.
function bindingEditor(ctx, slice, binding, index) {
  const close = () => { state.editBinding = null; render(); };
  const expected = binding.projection ? [] : argumentsExpected(ctx, slice.body, binding);
  const draft = state.bindingDraft && state.bindingDraft.alias === binding.alias
    ? state.bindingDraft
    : (state.bindingDraft = expected.reduce(
        (acc, argument) =>
          draftFromOperand(acc, 'arg:' + argument.name, (binding.arguments || {})[argument.name]),
        {
          alias: binding.alias,
          name: binding.alias,
          ...draftFromOperand({}, 'id', binding.id),
          ...draftFromOperand({}, 'excluding', binding.excluding),
        }
      ));

  const above = operandChoicesAbove(ctx, slice, index);
  const fanned = isFannedOut(ctx, slice.body, binding);

  const apply = (mutate) => patchSlice((b) => mutate(b.boundary[index]));

  return h('div', { class: 'member-editor' },
    h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, style: 'width:130px',
        oninput: (e) => { draft.name = e.target.value; },
      }),
      h('button', {
        class: 'btn tiny',
        title: 'Rename this read. The alias is local to this command, so nothing else moves.',
        onclick: () => {
          const next = toCamel(draft.name);
          if (!next) return toast('Give the read a name.', true);
          if (next === binding.alias) return close();
          if (slice.reads.some((b) => b.alias === next)) {
            return toast(`"${next}" is already bound in this command.`, true);
          }
          state.bindingDraft = null;
          state.editBinding = next;
          patchSlice((b) => {
            // Every operand naming the old alias moves with it. The
            // alias is this command's own word for the instance, so
            // nothing outside the command can be referring to it.
            forEachCommandOperand(b, (operand) => {
              if (operandSource(operand) === 'alias-property' && operand.alias === binding.alias) {
                operand.alias = next;
              }
            });
            b.boundary[index].alias = next;
          });
        },
      }, 'Rename')),

    binding.projection ? null : h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'identified by'),
      ...operandPicker(above, draft, 'id', { allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'id');
          if (operand === undefined) return toast('Pick where the identifier comes from.', true);
          apply((b) => { b.id = operand; });
        },
      }, 'Set')),

    binding.projection || !fanned ? null : h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'except'),
      ...operandPicker(above, draft, 'excluding', { placeholder: '— nothing —', allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'excluding');
          apply((b) => {
            if (operand === undefined) delete b.excluding; else b.excluding = operand;
          });
        },
      }, 'Set'),
      h('span', { class: 'muted tiny' },
        'drops one from the set — a course rescheduling itself is in every subscriber’s list')),

    ...expected.map((argument) => h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'with ', h('code', {}, argument.name)),
      ...operandPicker(above, draft, 'arg:' + argument.name, { allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'arg:' + argument.name);
          apply((b) => {
            const next = { ...(b.arguments || {}) };
            if (operand === undefined) delete next[argument.name];
            else next[argument.name] = operand;
            if (Object.keys(next).length) b.arguments = next; else delete b.arguments;
          });
        },
      }, 'Set'),
      h('span', { class: 'muted tiny' },
        `required — a scripted property it reads asks for one ${argument.propertyType}`))),

    h('div', { class: 'adder' },
      h('button', { class: 'btn ghost tiny', onclick: () => { state.bindingDraft = null; close(); } }, 'Done')));
}

// Headers appear only when there is more than one round: a lone
// "first" over a single card is noise, and most commands decide in one
// trip. Shown in both modes — "we must read the courses before we know
// which students to look at" is a fact about the domain, not about the
// store.
const ROUND_WORDS = ['first', 'then, using what came back', 'then again'];
function roundLabel(index, total) {
  if (index < ROUND_WORDS.length) return ROUND_WORDS[index];
  return `and again (${index + 1} of ${total})`;
}

// What Enter on an empty property name means: that list is done, and
// the next thing a command needs is what it reads. Opens the same
// adder "+ read something" opens, and reaches for its first control —
// best effort, since a model with no entity yet offers a button in its
// place, not a field.
function beginReadAdder() {
  closeForms();
  state.adder = 'read';
  render();
  setTimeout(() => {
    const el = document.querySelector('.step.reads select, .step.reads input');
    if (el) el.focus();
  }, 0);
}

function stepReads(ctx, slice) {
  const rounds = slice.rounds || [];
  const indexOfBinding = new Map(slice.reads.map((b, i) => [b, i]));

  let cards;
  if (rounds.length > 1) {
    cards = rounds.flatMap((round, i) => [
      h('div', { class: 'round-head' },
        h('span', { class: 'rule' }),
        h('span', { class: 'label' }, roundLabel(i, rounds.length))),
      ...round.map((entry) =>
        readCard(ctx, slice, entry.binding, indexOfBinding.get(entry.binding), entry.waitsFor)),
    ]);
  } else {
    cards = slice.reads.map((binding, i) => readCard(ctx, slice, binding, i, []));
  }
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Reads nothing — it decides unconditionally.'));

  const sources = [
    ...payloadChoices(ctx, slice.payload),
    ...slice.reads.flatMap((b) => {
      if (b.projection) return [[JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]];
      const entity = ctx['entity-definitions'][b.entity];
      return (entity ? entity.properties : []).map((p) =>
        [JSON.stringify({ alias: b.alias, property: p.name }),
          entityIcon(ctx, b.entity) + ' ' + memberWords(b.alias, p.name)]);
    }),
  ];
  const entityNames = Object.keys(ctx['entity-definitions']).sort();
  const projectionNames = Object.keys(ctx['projection-definitions']).sort();
  // Projections are offered in the same picker as entities, prefixed
  // so the two never look like the same kind of thing.
  const readables = [
    ...entityNames.map((n) => [n, entityIcon(ctx, n) + ' ' + readable(n)]),
    ...projectionNames.map((n) => ['projection:' + n, readable(n) + ' (projection)']),
  ];
  // Held in `state` rather than in a local: picking a projection has to
  // repaint — the form below it changes shape — and a local would be
  // reset by the very repaint it asked for.
  const draft = state.readDraft && state.readDraft.slice === slice.name
    ? state.readDraft
    : (state.readDraft = {
        slice: slice.name,
        entity: readables.length ? readables[0][0] : '',
        source: sources.length ? sources[0][0] : '',
      });
  if (!readables.some(([v]) => v === draft.entity)) {
    draft.entity = readables.length ? readables[0][0] : '';
  }
  if (draft.source && !sources.some(([v]) => v === draft.source)) {
    draft.source = sources.length ? sources[0][0] : '';
  }

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'reads') {
    body.push(inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => { state.newEntityAt = null; createEntity(ctx, v); },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else if (!entityNames.length) {
    // With nothing to choose between, a picker whose only row is
    // "+ New…" could never fire — so offer the button itself.
    body.push(h('div', { class: 'card' }, h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'Nothing to read yet.'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'reads'; render(); },
      }, '+ New entity'))));
  } else {
    // A projection asks for one operand per parameter — none at all
    // when it has none, which is what a global numbering looks like.
    const chosenProjection = draft.entity.startsWith('projection:')
      ? ctx['projection-definitions'][draft.entity.slice('projection:'.length)]
      : null;
    const parameters = chosenProjection ? (chosenProjection.parameters || []) : [];

    // Once something is chosen, Enter anywhere in the row reads it — the
    // same as clicking the button — so a read picked entirely from the
    // keyboard never needs the mouse to land.
    const submit = () => {
      if (!draft.entity) return toast('Pick something to read.', true);
      if (chosenProjection) {
        const name = draft.entity.slice('projection:'.length);
        const args = {};
        for (const p of parameters) {
          const chosen = draft['arg:' + p.name] || (sources[0] && sources[0][0]);
          if (!chosen) return toast(`Say what ${readable(name)} is kept separately for.`, true);
          args[p.name] = JSON.parse(chosen);
        }
        state.readDraft = null;
        patchSlice((b) => b.boundary.push({
          alias: uniqueAlias(defaultAlias(name), b.boundary.map((x) => x.alias)),
          projection: name, arguments: args }));
        return focusReadAdderButton();
      }
      if (!draft.source) return toast('Pick a thing and where its id comes from.', true);
      const entity = draft.entity;
      const source = draft.source;
      state.readDraft = null;
      patchSlice((b) => b.boundary.push({
        alias: uniqueAlias(defaultAlias(entity), b.boundary.map((x) => x.alias)),
        entity, id: JSON.parse(source) }));
      focusReadAdderButton();
    };
    // A read just added leaves the form open for the next one, freshly
    // reset to the first entity again — so the button, not the entity
    // picker, is where Enter should leave the keyboard: Tab from here
    // reaches the next step directly, and Shift+Tab still reaches the
    // reset picker for anyone who does want another read.
    function focusReadAdderButton() {
      // Direct child, not just any button under the adder: an
      // icon-select's own customizable-select markup nests a button of
      // its own ahead of this one in the document, and a plain
      // descendant selector would land on that instead.
      const btn = document.querySelector('.step.reads .card .adder > button');
      if (btn) btn.focus();
    }

    body.push(adderSlot('read', 'reads', '+ read something', () =>
      h('div', { class: 'card' }, h('div', {
        class: 'adder',
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } },
      },
        pick([...readables, [NEW, '+ New entity…']], draft.entity, (v) => {
          if (v === NEW) { closeForms(); state.newEntityAt = 'reads'; return render(); }
          draft.entity = v;
          render();
        }),
        chosenProjection
          ? (parameters.length
              ? parameters.flatMap((p) => [
                  h('span', { class: 'muted tiny' }, 'for its ' + propertyWords(p.name)),
                  pick(sources, draft['arg:' + p.name] || (sources[0] && sources[0][0]),
                    (v) => { draft['arg:' + p.name] = v; },
                    sources.length ? null : '— nothing in scope yet —'),
                ])
              : h('span', { class: 'muted tiny' }, '— the whole log, no tag'))
          : [
              h('span', { class: 'muted tiny' }, 'identified by'),
              pick(sources, draft.source, (v) => { draft.source = v; },
                sources.length ? null : '— nothing in scope yet —'),
            ],
        h('button', { class: 'btn', onclick: submit }, '+ Read something')))));
  }
  return step('reads', 'To decide, it reads', ...body);
}

function stepRules(ctx, slice) {
  const cards = slice.rules.map((condition, i) => {
    if (state.editRule === i) return h('div', { class: 'card rule' }, ruleEditor(ctx, slice, i));
    const p = conditionParts(condition);
    const quantifier = quantifierWords(ctx, slice.body, condition);
    return h('div', { class: 'card rule' },
      qrow('div', { cls: 'row', key: 'rule:' + i },
        h('span', { class: 'sentence' },
          quantifier ? h('span', { class: 'verb' }, quantifier + ', ') : null,
          opRef(condition.leftHandSide, null, p.left), ' ', h('span', { class: 'verb' }, p.verb),
          p.right ? h('span', {}, ' ', opRef(condition.rightHandSide, null, p.right)) : null),
        h('span', { class: 'grow' }),
        reveal(
          h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.editRule = i;
              state.ruleDraft = draftFromOperand(
                draftFromOperand({ predicate: condition.predicate, negate: !!condition.negate },
                  'left', condition.leftHandSide),
                'right', condition.rightHandSide);
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger',
            onclick: () => patchSlice((b) => { b.conditions.splice(i, 1); }),
          }, '×'))));
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'No rules — always allowed.'));

  return step('rules', 'It is only allowed if', h('div', {}, cards),
    adderSlot('rule', 'rules', '+ rule', () => h('div', { class: 'card' }, ruleEditor(ctx, slice, null))));
}

// One condition, open for editing — the same form whether it already
// exists or is being written for the first time.
//
// Both sides are picked from what the command has read, plus a typed
// literal: "fewer than 10 subscribers" is a rule about a number nobody
// declared anywhere, so it has to be typeable. A unary predicate takes
// no right-hand side at all, so that half of the form goes away when
// one is chosen rather than being ignored.
function ruleEditor(ctx, slice, index) {
  // A rule being edited always has a draft; a rule about to be created
  // grows one the first time it is painted, and keeps it across every
  // repaint a keystroke causes from then on.
  const draft = state.ruleDraft || (state.ruleDraft = { predicate: 'equals', negate: false, left: '', right: '' });
  const scope = operandChoicesAbove(ctx, slice);
  // A rule's left side says what it's about, and that's always
  // something read — a value the command was merely given belongs on
  // the right, compared against. Left keeps only what came off the
  // boundary, not the "given · …" entries `scope` also carries for the
  // right side's sake.
  const leftScope = scope.filter(([v]) => !('parameterName' in JSON.parse(v)));
  const leftType = resolveOperandType(draftOperand(draft, 'left'),
    { boundary: slice.reads, commandProperties: slice.payload, ctx });

  // The predicate list narrows to what the left side's type supports —
  // "starts with" against an integer could never be true — and the
  // current choice is pulled back onto the list when it no longer fits,
  // the same way a stale entity/source choice snaps back elsewhere.
  const predicateChoices = BINARY_PREDICATES.concat(UNARY_PREDICATES)
    .filter((p) => predicatesForType(leftType).includes(p));
  if (!predicateChoices.includes(draft.predicate)) {
    draft.predicate = predicateChoices[0] || draft.predicate;
  }
  const unary = UNARY_PREDICATES.includes(draft.predicate);

  // The right side is filtered to what the predicate demands of it —
  // the same type as the left side for most predicates, a bare integer
  // for the count predicates, and so on — so a capacity (an integer)
  // does not sit alongside a list of ids as things to compare it with.
  // Whatever the left side already names is dropped too: "capacity
  // equals capacity" is never a rule anyone meant to write.
  const rightType = rightHandExpectedType(draft.predicate, leftType);
  const rightScope = (rightType
    ? scope.filter(([v]) => {
        const resolved = resolveOperandType(JSON.parse(v),
          { boundary: slice.reads, commandProperties: slice.payload, ctx });
        return resolved && resolved.propertyType === rightType.propertyType
          && resolved.isList === rightType.isList;
      })
    : scope).filter(([v]) => v !== draft.left);
  // Enum options on the right only make sense once the left side names
  // an enum-typed property, and only that property's own enum —
  // offering every enum's members would let "course · capacity equals
  // shipped" through, which nothing could ever satisfy.
  const leftOperand = draftOperand(draft, 'left');
  const leftPropertyName = leftOperand && (leftOperand.property || leftOperand.parameterName);
  const enumMembers = leftType ? enumMembersFor(ctx, leftType.propertyType) : null;
  const enums = (enumMembers && rightType && !rightType.isList
    && rightType.propertyType === leftType.propertyType)
    ? enumMembers.map((m) =>
        [JSON.stringify({ enumMember: m }), propertyWords(leftPropertyName) + ' · ' + readable(m)])
    : [];
  const rightRows = [...rightScope, ...enums];
  if (draft.right && draft.right !== LITERAL && !rightRows.some(([v]) => v === draft.right)) {
    draft.right = '';
  }

  const close = () => { state.editRule = null; state.ruleDraft = null; state.adder = null; render(); };

  // Once both sides are chosen, Enter anywhere in the row submits it —
  // the same as clicking the primary button — so a rule typed and
  // picked entirely from the keyboard never needs the mouse to land.
  const submit = () => {
    const left = draftOperand(draft, 'left');
    if (left === undefined) return toast('Say what the rule is about.', true);
    const condition = { leftHandSide: left, predicate: draft.predicate };
    if (!unary) {
      const right = draftOperand(draft, 'right');
      if (right === undefined) return toast('Say what to compare it with.', true);
      condition.rightHandSide = right;
    }
    if (draft.negate) condition.negate = true;
    state.editRule = null;
    state.ruleDraft = null;
    state.adder = null;
    patchSlice((b) => {
      if (index === null) b.conditions.push(condition);
      else b.conditions[index] = condition;
    });
  };

  return h('div', {
    class: 'adder',
    onkeydown: (e) => {
      if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      submit();
    },
  },
    ...operandPicker(leftScope, draft, 'left',
      { placeholder: leftScope.length ? '— what? —' : '— read something first —' }),
    h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: !!draft.negate,
        onchange: (e) => { draft.negate = e.target.checked; },
      }), ' not'),
    pick(predicateChoices.map((p) => [p, readable(p).toLowerCase()]),
      draft.predicate, (v) => { draft.predicate = v; render(); }),
    ...(unary ? [] : operandPicker(rightRows, draft, 'right',
      { placeholder: '— what? —', allowLiteral: !enums.length })),
    h('button', { class: 'btn primary', onclick: submit }, index === null ? 'Add rule' : 'Save'),
    h('button', { class: 'btn ghost tiny', onclick: close }, 'Cancel'));
}

function stepEmits(ctx, slice) {
  const cards = slice.emits.map(({ emission, event }, i) => {
    const open = state.openEvent === emission.name;
    const params = event ? (event.properties || []) : [];
    // The event's own shape — its name, its mark, its fields — is
    // edited on its own page now (see `renderEvents`): an event may be
    // published by more than one command, and one card editing what
    // every other card shows was the risk, not the convenience. This
    // card keeps only what is specific to *this* publish binding: which
    // of this command's values fills which of the event's fields.
    return h('div', { class: 'card event' },
      qrow('div', { cls: 'row', key: 'emit:' + emission.name },
        event ? eventRef(ctx, emission.name)
          : h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(ctx, emission.name)), readable(emission.name)),
        h('span', { class: 'muted tiny' }, params.length + ' field' + (params.length === 1 ? '' : 's')),
        h('span', { class: 'grow' }),
        reveal(
          advanced() ? h('span', { class: 'tech' }, emission.name) : null,
          h('button', {
            class: 'btn tiny',
            onclick: () => { state.openEvent = open ? null : emission.name; render(); },
          }, open ? 'Hide fields' : 'Fields'),
          h('button', {
            class: 'btn tiny danger',
            title: 'Stop recording this. The event itself stays — remove it from its own '
              + 'page once no command records it.',
            onclick: () => patchSlice((b) => { b.publishes.splice(i, 1); }),
          }, '×'))),
      open ? eventFields(ctx, emission, event) : null);
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Records nothing yet.'));

  const existing = Object.keys(ctx['event-definitions']).sort()
    .filter((n) => !slice.emits.some((e) => e.emission.name === n));
  let chosen = existing[0] || '';

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'event') {
    body.push(inlineForm({
      question: 'What happened?  (past tense)',
      placeholder: readable(suggestEventName(slice.name)), showsIdentifier: true,
      onSubmit: (v) => {
        const name = toPascal(v);
        state.newEntityAt = null;
        run(() => {
          if (!activeContext()['event-definitions'][name]) {
            addDefinition('event-definition', ctx.id, name, { properties: [] });
          }
          patchSlice((b) => b.publishes.push({ name, parameters: {} }));
          state.openEvent = name;
        });
        // A brand new event has nothing this command gave it yet to
        // record — copying all of it in one more keystroke is the
        // common case, so that is where focus lands next.
        if (slice.payload.length) {
          setTimeout(() => {
            const chips = document.querySelectorAll('.copy-missing button');
            const target = chips[chips.length - 1];
            if (target) target.focus();
          }, 0);
        }
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    body.push(adderSlot('emit', 'emits', '+ record something', () =>
      h('div', { class: 'card' }, h('div', {
        class: 'adder',
        // Enter records the picked event — unless focus is on a button,
        // which already knows what Enter on it means.
        onkeydown: existing.length ? (e) => {
          if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
          e.preventDefault();
          patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} }));
        } : null,
      },
        existing.length ? pick(existing.map((n) => [n, readable(n)]), chosen, (v) => { chosen = v; }) : null,
        existing.length ? h('button', {
          class: 'btn',
          onclick: () => patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} })),
        }, '+ Record something already known') : null,
        h('button', {
          class: 'btn primary',
          onclick: () => { closeForms(); state.newEntityAt = 'event'; render(); },
        }, '+ New event')))));
  }
  return step('emits', 'When it succeeds, this happened', ...body);
}

// Renaming an event or one of its fields rewrites every declared
// operand naming it. It cannot rewrite code: nothing here parses a
// script, and a textual pass over an unparsed language would sooner or
// later rewrite a comment or a string literal. So the rename goes
// through and this says which scripts to go and read.
function warnScripted(ctx, eventName) {
  const scripted = scriptedHandlersOf(ctx, eventName);
  if (!scripted.length) return;
  toast(`Renamed. ${scripted.join(', ')} handle${scripted.length === 1 ? 's' : ''} `
    + `${readable(eventName)} in code, which was not rewritten — check ${
      scripted.length === 1 ? 'it' : 'them'}.`);
}

// A key in `publishes[].parameters` that no longer names a property on
// the event it targets is not a reference to anything — the field it
// once read is gone. The only way there is one is a leftover from
// before `removeEventField` cleaned up after itself; swept here, on
// every payload edit, so a leftover like that never blocks removing the
// value it still, invisibly, claimed to use.
function pruneDanglingEmissionParameters(ctx, body) {
  for (const emission of body.publishes || []) {
    if (!emission.parameters) continue;
    const eventDef = ctx['event-definitions'][emission.name];
    const known = new Set((eventDef ? eventDef.properties : []).map((q) => q.name));
    for (const key of Object.keys(emission.parameters)) {
      if (!known.has(key)) delete emission.parameters[key];
    }
  }
}

// A field leaves the event, and takes its binding with it. The binding
// lives on the *command* side — `publishes[].parameters`, keyed by this
// field's own name — and every command that emits the event can hold
// one. Dropped only from the event, that key would go on pointing at
// whatever command value it read, invisibly, since nothing on the page
// still shows a field for it to belong to. Left in place, it keeps
// "using" that value forever, which is what later refuses to let the
// value itself be removed for a reason no longer visible anywhere.
function removeEventField(ctx, eventName, index, propertyName) {
  run(() => {
    const eventBody = deepClone(activeContext()['event-definitions'][eventName]);
    eventBody.properties.splice(index, 1);
    updateDefinition('event-definition', ctx.id, eventName, eventBody);

    for (const [name, body] of Object.entries(activeContext()['command-definitions'])) {
      const bound = (body.publishes || [])
        .some((e) => e.name === eventName && e.parameters && propertyName in e.parameters);
      if (!bound) continue;
      const next = deepClone(body);
      for (const e of next.publishes || []) {
        if (e.name === eventName && e.parameters) delete e.parameters[propertyName];
      }
      updateDefinition('command-definition', ctx.id, name, next);
    }
  });
}

// What this command's publish binding does: map this command's own
// values into the event's fields. The fields themselves — their names,
// their types, how many there are — are no longer edited here; an
// event may be published by more than one command, so their shape has
// exactly one home, on the event's own page (`eventFieldsEditor`).
// This stays specific to *this* binding for the same reason
// `copyFromCommand` below has to: only this command knows what it was
// given.
function eventFields(ctx, emission, event) {
  if (!event) return h('div', { class: 'fields empty' }, 'This event no longer exists.');
  const command = activeContext()['command-definitions'][state.slice];
  const boundary = command.boundary || [];
  const commandProperties = command.properties || [];
  const options = [
    ...commandProperties.map((q) =>
      [JSON.stringify({ parameterName: q.name }), 'given · ' + propertyWords(q.name)]),
    // Everything the command reads is bound, so everything it can emit
    // comes off an alias — a projection's value included.
    ...boundary.flatMap((b) => {
      if (b.projection) {
        return [[JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]];
      }
      const entity = ctx['entity-definitions'][b.entity];
      const icon = entityIcon(ctx, b.entity) + ' ';
      const props = (entity ? entity.properties : []).map((q) =>
        [JSON.stringify({ alias: b.alias, property: q.name }), icon + memberWords(b.alias, q.name)]);
      // An alias identified straight off a payload parameter already
      // has that same value in scope under "given · …", so naming it
      // again here would just be a second label on the one thing. One
      // found by tracing through another alias' property has no such
      // shortcut — that path is not what an event wants to say — so its
      // own identity is worth offering directly.
      const ownId = b.id !== undefined && operandSource(b.id) !== 'parameter'
        ? [[JSON.stringify(b.id), icon + memberWords(b.alias, 'id')]]
        : [];
      return [...props, ...ownId];
    }),
  ];

  const rows = (event.properties || []).map((p) => {
    const bound = (emission.parameters || {})[p.name];
    // Only options whose resolved type actually matches this field are
    // offered — a field typed `StudentId` has no use for a capacity.
    const fieldOptions = options.filter(([v]) => {
      const resolved = resolveOperandType(JSON.parse(v), { boundary, commandProperties, ctx });
      return resolved && resolved.propertyType === p.propertyType && resolved.isList === !!p.isList;
    });
    return h('div', { class: 'field', 'data-src': 'evprop:' + emission.name + '.' + p.name },
      h('span', { class: 'nm' }, propertyWords(p.name)),
      h('span', { class: 'muted tiny' }, readable(typeLabel(p))),
      h('span', { class: 'muted tiny' }, '←'),
      pick(fieldOptions, bound === undefined ? '' : JSON.stringify(bound),
        (v) => patchSlice((b) => {
          const e = b.publishes.find((x) => x.name === emission.name);
          e.parameters = e.parameters || {};
          e.parameters[p.name] = JSON.parse(v);
        }), '— unset —'));
  });

  // What the command was given but this event does not yet carry. A
  // field copied from here is not a guess at what the event should say —
  // it is a value already in the command's own vocabulary, so the copy
  // both declares the field and wires it to that value in one step. It
  // stays here rather than on the event's page because it reads *this*
  // command's payload — an event published by several commands has no
  // one "given" to offer.
  const missing = commandProperties.filter((q) => !(event.properties || []).some((p) => p.name === q.name));
  const copyFromCommand = (properties) => {
    patch('event-definition', emission.name, (b) => {
      for (const property of properties) {
