      class: 'icon-btn event', title: 'Choose the mark this is shown with',
      onclick: () => {
        const wasOpen = pickingIcon;
        closeForms();
        state.eventIconPicker = wasOpen ? null : name;
        render();
      },
    }, eventIcon(ctx, name)),
    h('span', { class: 'chip event' }, readable(name)),
    h('span', { class: 'muted tiny' },
      (event.properties || []).length + ' field' + ((event.properties || []).length === 1 ? '' : 's')),
    h('span', { class: 'muted tiny' }, publishers.length ? 'recorded by '
      + publishers.map((p) => readable(p.command)).join(', ') : 'recorded by nothing yet'),
    h('span', { style: 'flex:1' }),
    reveal(
      advanced() ? h('span', { class: 'tech' }, name) : null,
      h('button', {
        class: 'btn tiny',
        onclick: () => { state.openEvent = open ? null : name; render(); },
      }, open ? 'Hide details' : 'Details'),
      h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.renamingEvent = name; render(); },
      }, 'Rename'),
      removeButton('event:' + name, {
        label: 'Remove', title: 'Remove this event',
        onRemove: () => run(() => removeDefinition('event-definition', ctx.id, name)),
      }))));

  if (pickingIcon) card.appendChild(eventIconPicker(ctx, name, event));

  if (open) {
    card.appendChild(h('div', { class: 'card event' },
      eventFieldsEditor(ctx, name, event),
      h('div', { class: 'refs', style: 'margin-top:12px' },
        h('div', { class: 'muted tiny' }, 'Recorded by'),
        publishers.length
          ? h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
              publishers.map((p) => commandRef(ctx, p.command)))
          : h('div', { class: 'empty tiny' }, 'no command records this yet')),
      h('div', { class: 'refs', style: 'margin-top:10px' },
        h('div', { class: 'muted tiny' }, 'Handled by'),
        subscribers.length
          ? h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
              subscribers.map((s) => s.entity
                ? entityRef(ctx, s.entity, { text: readable(s.entity) + ' · ' + propertyWords(s.property.name) })
                : projectionRef(ctx, s.projection)))
          : h('div', { class: 'empty tiny' }, 'nothing reads this yet')),
      scenarios.length ? h('div', { class: 'refs', style: 'margin-top:10px' },
        h('div', { class: 'muted tiny' }, 'Referenced by'),
        h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
          scenarios.map((s) => h('span', {
            class: 'chip linkable', title: 'Open this scenario',
            onclick: () => (s.property ? goToPropertyScenario(ctx, s.key) : goToScenario(ctx, s.key)),
          }, s.property ? propertyScenarioName(s.body, readable) : scenarioName(s.body, readable))))) : null));
  }

  return card;
}

// ---------- coupling ----------
//
// Every command against every event type it writes or reads back,
// gathered once into a matrix — the same boundary each command's own
// page derives one at a time (`stepConsistency`), read here across all
// of them at once rather than one command deep.
function renderCoupling(ctx, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Coupling'),
    h('div', { class: 'muted small' },
      'Every command against every event type it writes, or reads back to decide — the same '
      + 'boundary each command derives on its own page, laid out as one matrix. A filled mark '
      + 'writes the event; a ringed mark reads it back first.')));

  const matrix = couplingMatrix(ctx);
  if (!matrix.events.length || !matrix.groups.length) {
    main.appendChild(h('div', { class: 'empty' },
      matrix.events.length ? 'No commands yet.' : 'No events yet.'));
    return;
  }

  const orderMode = state.couplingOrder === 'coupling' ? 'coupling' : 'feature';
  const tab = (key, label) => h('button', {
    class: 'tab' + (orderMode === key ? ' on' : ''),
    'aria-pressed': orderMode === key ? 'true' : 'false',
    onclick: () => { state.couplingOrder = key; render(); },
  }, label);
  main.appendChild(h('div', { class: 'tabs', style: 'margin-bottom:16px' },
    tab('feature', 'By feature'), tab('coupling', 'By coupling')));

  main.appendChild(h('div', { class: 'coupling-legend' },
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark produces' }), 'produces'),
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark consumes' }), 'consumes'),
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark both' }), 'both'),
    orderMode === 'coupling'
      ? h('span', { class: 'coupling-legend-item' },
          h('span', { class: 'chip rule tiny' }, 'bridge'),
          'the one coupling still joining two clusters')
      : null));

  // A lookup from (command, event) to its cell, so either ordering can
  // read the same underlying matrix without recomputing it.
  const cellIndex = {};
  for (const group of matrix.groups) {
    for (const row of group.commands) {
      cellIndex[row.name] = {};
      row.cells.forEach((cell, i) => { cellIndex[row.name][matrix.events[i]] = cell; });
    }
  }

  let orderedEvents;
  let rows; // [{ isGroup, label }] | [{ isCommand, name, isBridge, cells }]
  let isBridgeEvent = () => false;
  let clusterStartsAt = () => false;

  if (orderMode === 'coupling') {
    const clusters = couplingClusters(matrix);
    orderedEvents = clusters.eventOrder;
    isBridgeEvent = clusters.isBridgeEvent;

    const clusterLabel = (rank) => {
      const info = clusters.clusters[rank];
      if (info.commands + info.events === 1) return 'Isolated — coupled to nothing';
      const c = info.commands + ' command' + (info.commands === 1 ? '' : 's');
      const e = info.events + ' event' + (info.events === 1 ? '' : 's');
      return 'Cluster ' + (rank + 1) + ' · ' + c + ', ' + e;
    };
    rows = [];
    let lastRank = null;
    for (const name of clusters.commandOrder) {
      const rank = clusters.clusterOfCommand(name);
      if (rank !== lastRank) { rows.push({ isGroup: true, label: clusterLabel(rank) }); lastRank = rank; }
      rows.push({
        isCommand: true, name, isBridge: clusters.isBridgeCommand(name),
        cells: orderedEvents.map((ev) => cellIndex[name][ev]),
      });
    }
    let lastEventRank = null;
    clusterStartsAt = (i) => {
      const rank = clusters.clusterOfEvent(orderedEvents[i]);
      const isStart = i > 0 && rank !== clusters.clusterOfEvent(orderedEvents[i - 1]);
      return isStart;
    };
    if (clusters.clusters.length > 1) {
      main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:14px' },
        clusters.clusters.length + ' clusters — nothing couples one to another. Splitting the model '
        + 'along those seams would leave each cluster as its own bounded context.'));
    } else {
      main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:14px' },
        'Everything here is one connected cluster — no command or event stands apart from the rest yet.'));
    }
  } else {
    orderedEvents = matrix.events;
    rows = matrix.groups.flatMap((group) => [
      { isGroup: true, label: group.name },
      ...group.commands.map((row) => ({ isCommand: true, name: row.name, isBridge: false, cells: row.cells })),
    ]);
  }

  const colWidth = 104;
  const grid = h('div', {
    class: 'coupling-grid',
    style: `grid-template-columns: 210px repeat(${orderedEvents.length}, ${colWidth}px); `
      + `width: ${210 + orderedEvents.length * colWidth}px`,
  });
  grid.appendChild(h('div', { class: 'coupling-corner' }));
  orderedEvents.forEach((event, i) => {
    const bridge = isBridgeEvent(event);
    // A non-breaking space between the icon and the first word keeps
    // them on the same line — an icon stranded alone on its own line
    // is the one wrapping outcome worth avoiding.
    const label = eventIcon(ctx, event) + ' ' + readable(event);
    grid.appendChild(h('div', {
      class: 'coupling-colhead' + (clusterStartsAt(i) ? ' cluster-start' : ''),
      title: (bridge ? 'Bridge — removing this splits its cluster in two. ' : '') + 'Open ' + readable(event),
      onclick: () => goToEvent(event),
    }, h('span', { style: bridge ? 'color:var(--rule)' : '' }, label)));
  });

  for (const row of rows) {
    if (row.isGroup) { grid.appendChild(h('div', { class: 'coupling-grouprow' }, row.label)); continue; }
    grid.appendChild(h('div', {
      class: 'coupling-rowlabel', title: 'Open ' + readable(row.name), onclick: () => goToCommand(row.name),
    }, h('span', {}, readable(row.name)),
      row.isBridge ? h('span', {
        class: 'chip rule tiny', style: 'margin-left:7px',
        title: 'Bridge — removing this splits its cluster in two',
      }, 'bridge') : null));
    row.cells.forEach((cell, i) => {
      const markClass = cell.produces && cell.consumes ? 'both'
        : cell.produces ? 'produces' : cell.consumes ? 'consumes' : null;
      const label = eventIcon(ctx, cell.event) + ' ' + readable(cell.event);
      const tip = !markClass ? null
        : cell.produces && cell.consumes
          ? label + ' — written here, read back via ' + cell.via.join(', ')
          : cell.produces ? label + ' — written here'
            : label + ' — read via ' + cell.via.join(', ');
      grid.appendChild(h('div', {
        class: 'coupling-cell' + (clusterStartsAt(i) ? ' cluster-start' : ''),
        title: tip,
      }, markClass ? h('div', { class: 'coupling-mark ' + markClass }) : null));
    });
  }
  main.appendChild(h('div', { class: 'coupling-scroll' }, grid));
}

// ---------- rule map ----------
//
// Every command, the rules guarding it, and what it records once they
// all hold — the same conditions and emissions from `stepRules` and
// `stepEmits`, read here across every command at once.
function renderRuleMap(ctx, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Rule map'),
    h('div', { class: 'muted small' },
      'Every command, the rules guarding it, and what it records once they all hold — the same '
      + 'conditions and emissions from each command’s own page, gathered across all of them.')));

  const groups = featureGroups(ctx).filter((g) => g.commands.length);
  if (!groups.length) {
    main.appendChild(h('div', { class: 'empty' }, 'No commands yet.'));
    return;
  }

  for (const group of groups) {
    main.appendChild(h('h3', { class: 'rulemap-feature' }, group.name));
    for (const name of group.commands) {
      const slice = sliceOf(ctx, name);
      const rules = slice.rules.map((condition) => ruleSentence(ctx, slice.body, condition));
      main.appendChild(h('div', { class: 'card command rulemap-row' },
        h('div', { class: 'rulemap-cmd' }, commandRef(ctx, name)),
        h('div', { class: 'rulemap-arrow' }, '→'),
        h('div', { class: 'rulemap-rules' },
          rules.length
            ? rules.map((text) => h('div', { class: 'rulemap-rule' }, text))
            : h('div', { class: 'empty tiny' }, 'always allowed')),
        h('div', { class: 'rulemap-arrow' }, '→'),
        h('div', { class: 'rulemap-events' },
          slice.emits.length
            ? slice.emits.map(({ emission }) => eventRef(ctx, emission.name))
            : h('div', { class: 'empty tiny' }, 'records nothing yet'))));
    }
  }
}

// The event's own shape: rename a field, retype it, remove it, add
// one. The one thing this does *not* do is say what fills it from any
// particular command — that mapping is `eventFields`' job, on the
// command's own page, because it is specific to that command's payload
// and this page is not.
function eventFieldsEditor(ctx, name, event) {
  const where = 'event:' + name;
  const rows = (event.properties || []).map((p, i) => {
    if (editingMember(where, p.name)) {
      // An event property has no initial value — nothing projects it,
      // it is simply carried.
      return memberEditor(ctx, {
        member: p, where,
        onReplace: (next) => patch('event-definition', name, (b) => { b.properties[i] = next; }),
        onRename: (newName) => {
          warnScripted(ctx, name);
          return renameMember('event-definition', ctx.id, name, 'property', p.name, newName);
        },
      });
    }
    const enumType = isStringEnumType(ctx, p.propertyType) ? p.propertyType : null;
    const dropField = () => removeEventField(ctx, name, i, p.name);
    return [
      qrow('div', {
        cls: 'field', key: 'evown:' + name + ':' + p.name,
        onRemove: dropField,
      },
        h('span', { class: 'nm' }, propertyWords(p.name)),
        h('span', { class: 'grow', style: 'flex:1' }),
        reveal(
          h('span', {
            class: 'chip editable', title: 'Rename or retype this field',
            onclick: () => openMember(where, p.name),
          }, readable(typeLabel(p))),
          advanced() ? h('span', { class: 'tech' }, p.name) : null,
          h('button', {
            class: 'btn tiny danger', title: 'Remove this field',
            onclick: dropField,
          }, '×'))),
      enumType ? h('div', { class: 'use' },
        h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(ctx, enumType)) : null,
    ];
  });

  return h('div', { class: 'fields' },
    rows.length ? rows : h('div', { class: 'empty' }, 'Carries nothing yet.'),
    ...EVENT_METADATA.map((m) => h('div', { class: 'field envelope' },
      h('span', { class: 'nm' }, propertyWords(m.name)),
      h('span', { class: 'muted tiny' }, '← the store'),
      h('span', { class: 'grow', style: 'flex:1' }),
      h('span', { class: 'chip' }, readable(typeLabel(m))),
      h('span', { class: 'muted tiny' }, 'always carried'))),
    adderSlot('evown:' + name, null, '+ field', () => propertyAdder(ctx, {
      label: '+ Add field',
      onAdd: (property) => patch('event-definition', name, (b) => b.properties.push(property)),
      onRemoveLast: rows.length
        ? () => removeEventField(ctx, name, event.properties.length - 1,
            event.properties[event.properties.length - 1].name)
        : undefined,
    })));
}

function stepConsistency(ctx, slice) {
  // Every item is a binding, projections included — there is no
  // longer a query that arrives from outside the boundary. An item's
  // tags are ANDed with each other and with its types; the items are
  // ORed. No tags at all is a type-only query, which is what a
  // projection with no parameters reads.
  const lines = slice.dcb.items.map((item, i) => h('div', {},
    i === 0 ? '  ' : h('span', { class: 'k' }, 'or '),
    item.tags.length
      ? h('span', {}, h('span', { class: 'k' }, 'tag '),
          ...item.tags.flatMap((tag, j) => [
            j ? h('span', { class: 'k' }, ' and ') : null,
            h('span', { class: 't' }, tag),
          ]),
          h('span', { class: 'k' }, ' and '))
      : null,
    h('span', { class: 'y' }, item.types.join(', ') || 'any type'),
    item.tags.length ? null : h('span', { class: 'k' }, '  (no tag — the whole log)'),
    item.fannedOut ? h('span', { class: 'k' }, '  — one per element') : null));
  return step('consistency', 'Which nothing else may have changed',
    h('div', { class: 'card dcb' },
      lines.length ? lines : h('div', { class: 'empty' }, 'Unguarded.'),
      h('div', { style: 'margin-top:6px' },
        h('span', { class: 'k' }, 'appends '),
        h('span', { class: 't' }, slice.dcb.writes.join(', ') || 'no tags'))),
    slice.coverage.length
      ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
          h('span', { class: 'small' }, 'Writes a tag it never read: '
            + slice.coverage.map((c) => readable(c.entity)).join(', ')))
      : null);
}


// ============================================================
// C · Scenarios
//
// One command, exercised. A Given of events written by hand, a When
// naming the arguments, and a Then nobody types — it is derived from
// the definitions and frozen beside the other two, so the next run
// either agrees with it or reports that something changed.
//
// Accepting a difference is the whole gesture this interface exists
// for. It is the same move as approving a diff: you are not told the
// model is wrong, you are shown what it now does and asked whether that
// is what you meant.
//
// Three statuses, and they are not degrees of one thing. **Current** is
// agreement. **Drifted** has two outcomes to compare, and is answered by
// reading the difference. **Broken** has one — the command deleted, an
// event gone, a property added since — and is answered by repairing the
// scenario. A count that merged the last two would say less the more of
// them there were.
// ============================================================

// ---------- running them ----------
//
// A scenario that reads a scripted projection is never run unprompted.
// The code is authored JavaScript with nothing between it and the page,
// so a body that loops forever takes the tab with it — and a hang while
// the page is painting itself leaves no way back in to fix the script
// that caused it. Everything else runs on every repaint, the way the
// whole model is already reprojected on every repaint.
// The placement switch itself sits with the other interface switches
// near the top of this file. Everything below is what it chooses
// between.

const heldRuns = new Map();

function scenarioResult(ctx, key, body) {
  if (!scenarioTouchesScript(ctx, body)) return runScenario(ctx, body);
  const cached = heldRuns.get(key);
  // The log length stands in for "nothing has changed since": every
  // edit to this model is an append, so a run made before one is a run
  // made against different definitions.
  if (cached && cached.at === loadEvents().length) return cached.result;
  return {
    status: 'held',
    reason: 'This scenario reads a scripted projection, so it runs when you ask and not before.',
  };
}

function runHeldScenario(ctx, key, body) {
  heldRuns.set(key, { at: loadEvents().length, result: runScenario(ctx, body) });
  render();
}

const STATUS_WORDS = {
  current: ['✓', 'Current', 'What this command does is what this scenario says it does'],
  drifted: ['≠', 'Drifted', 'This command behaves differently now than when this was accepted'],
  broken: ['!', 'Broken', 'This could not be run at all — something it names is gone'],
  held: ['·', 'Not run', 'Reads a script, so it runs only when asked'],
};

function scenariosOf(ctx, commandName) {
  return Object.entries(ctx['scenario-definitions'] || {})
    .filter(([, body]) => body.command === commandName)
    .map(([key, body]) => ({ key, body }));
}

// Every scenario in the model that is not saying "current" — what
// `problems` folds in alongside loose ends.
function scenarioTrouble(ctx) {
  const out = [];
  for (const [key, body] of Object.entries(ctx['scenario-definitions'] || {})) {
    const result = scenarioResult(ctx, key, body);
    if (result.status === 'current' || result.status === 'held') continue;
    out.push({ key, body, result });
  }
  return out;
}

// ---------- values ----------
//
// A payload is written rather than chosen, which is the one place in
// this interface where a modeler types a value the model will act on.
// Identifiers get the strongest help available short of picking from a
// list that does not exist yet: every identifier of the same kind
// already written anywhere in this scenario is offered as you type. A
// new instance is still just typed, because before the first event
// mentions one there is nothing to have picked.

let suggestionSeq = 0;

// A value is addressed by where it sits in the draft, never by a copy
// of what it was when the field was drawn.
//
// Two things follow, and both are bugs this shape does not have. A
// field that closed over the payload as it was at paint time would
// undo the edit before it the moment two fields were filled between
// repaints. And a repaint under a text field takes the caret with it —
// which is why filling one does not cause one: the inputs are
// uncontrolled and the draft is the only copy, so there is nothing to
// bring back into agreement. Only a change of *shape* — another list
// element, a different event — redraws.

function atPath(root, path) {
  return path.reduce((node, key) => (node === null || node === undefined ? undefined : node[key]), root);
}

function setAtPath(root, path, value) {
  let node = root;
  for (let i = 0; i < path.length - 1; i++) {
    if (node[path[i]] === null || node[path[i]] === undefined) {
      node[path[i]] = typeof path[i + 1] === 'number' ? [] : {};
    }
    node = node[path[i]];
  }
  node[path[path.length - 1]] = value;
  return root;
}

// Every identifier of a given entity already written anywhere in a
// scenario. Read at the moment the field is used rather than the moment
// it was drawn, so an id typed into the Given is offered in the When
// without anything having to repaint in between.
function identifiersInUse(ctx, body, entityName) {
  const found = new Set();
  const harvest = (values, properties) => {
    for (const property of properties || []) {
      const value = (values || {})[property.name];
      if (value === undefined || value === null) continue;
      const elements = property.isList ? (Array.isArray(value) ? value : []) : [value];
      for (const leaf of idLeavesOfType(ctx, property.propertyType)) {
        if (entityOfIdType(ctx, leaf.identifierType) !== entityName) continue;
        for (const element of elements) {
          const held = leaf.field === null ? element : (element || {})[leaf.field];
          if (held !== undefined && held !== null && held !== '') found.add(String(held));
        }
      }
    }
  };
  for (const step of body.given || []) {
    harvest(step.data, (ctx['event-definitions'][step.event] || {}).properties);
  }
  harvest((body.when || {}).arguments, (ctx['command-definitions'][body.command] || {}).properties);
  return [...found].sort();
}

// One value of one declared type, at one place in the draft. Lists
// repeat it, composites nest it, and everything else is a field with
// the type's own vocabulary behind it.
function valueEditor(ctx, property, path, where) {
  const draft = where.root;
  // A composite value's fields — whether the type is tag-bearing (an
  // entity's own derived identifier, say) or an ordinary record — are
  // one shape, `{name, propertyType}`, so the recursion below does not
  // have to know which kind it is nesting into.
  const fields = compositeFieldsOf(ctx, property.propertyType);

  const scalar = (at) => {
    const held = atPath(draft(), at);
    const enumMembers = enumMembersFor(ctx, property.propertyType);
    if (enumMembers) {
      return h('span', { class: 'vwrap' },
        pick(enumMembers.map((m) => [m, readable(m)]),
          held === undefined || held === null ? '' : String(held),
          (v) => setAtPath(draft(), at, v), '— choose —'));
    }
    const entity = entityOfIdType(ctx, property.propertyType);
    const listId = entity ? `sug-${++suggestionSeq}` : null;
    const options = () => where.suggest(entity);
    return h('span', { class: 'vwrap' },
      h('input', {
        class: 'vin', value: held === undefined || held === null ? '' : String(held),
        placeholder: readable(property.propertyType), list: listId,
        // Rebuilt as the field is reached, not as it is drawn: an
        // identifier typed a moment ago is offered here without a
        // repaint having to carry it over.
        onfocus: listId ? (e) => {
          const list = document.getElementById(listId);
          if (!list) return;
          list.innerHTML = '';
          for (const value of options()) list.appendChild(h('option', { value }));
        } : null,
        onchange: (e) => {
          const parsed = literalOfType(ctx, property.propertyType, e.target.value);
          if (parsed === undefined) {
            return toast('That is not a ' + readable(property.propertyType) + '.', true);
          }
          setAtPath(draft(), at, parsed);
        },
      }),
      listId ? h('datalist', { id: listId }) : null);
  };

  const composite = (at) => h('span', { class: 'vgroup' },
    fields.map((field) => h('span', { class: 'vfield' },
      h('span', { class: 'vlabel' }, propertyWords(field.name)),
      valueEditor(ctx, { ...field, isList: false }, [...at, field.name], where))));

  const one = fields ? composite : scalar;

  if (!property.isList) return one(path);

  const elements = atPath(draft(), path);
  const held = Array.isArray(elements) ? elements : [];
  return h('span', { class: 'vlist' },
    held.map((element, index) => h('span', { class: 'vrow' },
      one([...path, index]),
      h('button', {
        class: 'btn tiny danger', title: 'Remove this one',
        onclick: () => {
          setAtPath(draft(), path, held.filter((e, i) => i !== index));
          render();
        },
      }, '×'))),
    h('button', {
      class: 'btn tiny',
      onclick: () => {
        setAtPath(draft(), path, [...held, fields ? {} : '']);
        render();
      },
    }, '+ one more'));
}

// The payload of one event or one command call: every property it
// declares, in the order it declares them.
function payloadEditor(ctx, properties, path, where) {
  if (!(properties || []).length) {
    return h('span', { class: 'muted tiny' }, 'nothing to fill in');
  }
  return h('span', { class: 'vpayload' },
    (properties || []).map((property) => h('span', { class: 'vfield' },
      h('span', { class: 'vlabel' }, propertyWords(property.name)),
      valueEditor(ctx, property, [...path, property.name], where))));
}

// Where a payload being written lives, and what it can be helped with.
// A scenario suggests the identifiers written elsewhere in itself,
// because nothing else exists yet. The sandbox suggests the ones that
// actually do — every instance its log has mentioned — which is a
// stronger answer and only available because a session has a history.
function scenarioWhere(ctx) {
  return {
    root: () => state.scenarioDraft.body,
    suggest: (entity) => identifiersInUse(ctx, state.scenarioDraft.body, entity),
  };
}

function sandboxWhere(ctx) {
  return {
    root: () => state.sandboxDraft,
    suggest: (entity) => sessionInstances(ctx)
      .filter((tag) => tag.startsWith(entity + ':'))
      .map((tag) => tag.slice(entity.length + 1)),
  };
}

// ---------- reading one back ----------

function payloadText(values) {
  const entries = Object.entries(values || {});
  if (!entries.length) return 'nothing';
  return entries.map(([k, v]) => `${propertyWords(k)} ${JSON.stringify(v)}`).join(', ');
}

function outcomeCard(ctx, outcome, title) {
  if (!outcome) return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'nothing'));
  const rule = outcome.failedRule;
  return h('div', { class: 'card' },
    h('div', { class: 'muted tiny' }, title),
    outcome.outcome === 'rejected'
      ? h('div', {},
          h('span', { class: 'k' }, 'refused by '),
          h('span', { class: 't' }, (rule || {}).text || 'a rule'),
          rule && rule.rightValue !== null
            ? h('span', { class: 'k' }, `  — read ${JSON.stringify(rule.leftValue)}`
                + ` against ${JSON.stringify(rule.rightValue)}`)
            : (rule ? h('span', { class: 'k' }, `  — read ${JSON.stringify(rule.leftValue)}`) : null),
          rule && rule.atInstance !== null && rule.atInstance !== undefined
            ? h('span', { class: 'k' }, `  (at ${ordinal(rule.atInstance + 1)})`) : null)
      : (outcome.events || []).length
        ? outcome.events.map((event) => h('div', {},
            h('span', { class: 'y' }, readable(event.type)),
            h('span', { class: 'k' }, '  ' + payloadText(event.data))))
        : h('div', { class: 'empty' }, 'accepted, recording nothing'));
}

function ordinal(n) {
  const suffix = n % 100 >= 11 && n % 100 <= 13 ? 'th'
    : ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  return n + suffix;
}


// ---------- the list ----------

function scenarioRow(ctx, entry) {
  const { key, body } = entry;
  const result = scenarioResult(ctx, key, body);
  const [mark, word, why] = STATUS_WORDS[result.status];
  const open = state.openScenario === key;

  const head = h('div', { class: 'row scenario-row' },
    h('span', { class: 'sc-mark s-' + result.status, title: why }, mark),
    h('button', {
      class: 'sc-name',
      onclick: () => {
        state.openScenario = open ? null : key;
        render();
      },
    }, scenarioName(body, readable)),
    h('span', { class: 'grow' }),
    h('span', { class: 'muted tiny' }, word),
    reveal(
      result.status === 'held'
        ? h('button', {
            class: 'btn tiny', title: 'Run this one now',
            onclick: () => runHeldScenario(ctx, key, body),
          }, 'Run')
        : null,
      h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.renamingScenario = key; render(); },
      }, 'Rename'),
      removeButton('scenario:' + key, {
        label: 'Remove', title: 'Remove this scenario. Nothing else is touched.',
        onRemove: () => run(() => {
          removeDefinition('scenario-definition', ctx.id, key);
          if (state.openScenario === key) state.openScenario = null;
        }),
      })));

  if (state.renamingScenario === key) {
    return h('div', { class: 'scenario' }, head, inlineForm({
      question: 'What should this scenario be called?',
      placeholder: scenarioName({ ...body, name: undefined }, readable),
      value: typeof body.name === 'string' ? body.name : '',
      submitLabel: 'Rename',
      onSubmit: (v) => {
        const next = (v || '').trim();
        state.renamingScenario = null;
        run(() => {
          const nextBody = { ...deepClone(body) };
          if (next) nextBody.name = next; else delete nextBody.name;
          updateDefinition('scenario-definition', ctx.id, key, nextBody);
        });
      },
      onCancel: () => { state.renamingScenario = null; render(); },
    }));
  }

  if (!open) return h('div', { class: 'scenario' }, head);

  return h('div', { class: 'scenario open' }, head,
    h('div', { class: 'sc-body' },
      h('div', { class: 'muted tiny' }, 'Given'),
      (body.given || []).length
        ? (body.given || []).map((step) => h('div', { class: 'sc-line' },
            h('span', { class: 'y' }, readable(step.event)),
            h('span', { class: 'k' }, '  ' + payloadText(step.data))))
        : h('div', { class: 'empty' }, 'nothing had happened yet'),
      h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'When'),
      h('div', { class: 'sc-line' },
        h('span', { class: 'c' }, readable(body.command)),
        h('span', { class: 'k' }, '  ' + payloadText((body.when || {}).arguments))),
      h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'Then'),
      result.status === 'broken'
        ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
            h('div', { class: 'small' }, result.reason),
            h('div', { class: 'muted tiny', style: 'margin-top:6px' },
              'What it used to expect is kept below, so nothing is lost while you repair it.'),
            outcomeCard(ctx, result.expected, 'was'))
        : result.status === 'drifted'
          ? h('div', { class: 'drift' },
              outcomeCard(ctx, result.expected, 'this scenario says'),
              outcomeCard(ctx, result.actual, 'the model now does'),
              h('div', { class: 'adder' },
                h('button', {
                  class: 'btn primary',
                  title: 'Store what the model now does as what this scenario expects',
                  onclick: () => run(() => {
                    updateDefinition('scenario-definition', ctx.id, key,
                      { ...deepClone(body), then: result.actual });
                  }),
                }, 'Accept this'),
                h('span', { class: 'muted tiny' },
                  'Nothing changes in the model — only what this scenario expects of it.')))
          : outcomeCard(ctx, result.status === 'held' ? body.then : result.expected,
              result.status === 'held' ? 'last accepted' : 'and it does')));
}

// ---------- writing one ----------

function startScenario(ctx, commandName) {
  closeForms();
  state.tab = 'scenarios';
  state.scenarioDraft = {
    key: null,
    body: { command: commandName, given: [], when: { arguments: {} } },
  };
  render();
}

function patchScenarioDraft(mutate) {
  const draft = state.scenarioDraft;
  if (!draft) return;
  mutate(draft.body);
  render();
}

function scenarioEditor(ctx) {
  const draft = state.scenarioDraft;
  const body = draft.body;
  const command = ctx['command-definitions'][body.command];
  const eventNames = Object.keys(ctx['event-definitions']).sort();

  // Each Given event lands one second after the one before it, so a
  // projection folding the envelope sees them in the order they are
  // written. Any of them can be overwritten; none of them may be blank.
  const nextInstant = () => {
    const last = (body.given || []).reduce((max, s) => Math.max(max, s.recordedAt || 0), 0);
    return last + 1;
  };

  const givenRows = (body.given || []).map((step, index) => {
    const definition = ctx['event-definitions'][step.event] || {};
    return h('div', { class: 'card sc-step' },
      h('div', { class: 'row' },
        pick(eventNames.map((n) => [n, readable(n)]), step.event, (v) => patchScenarioDraft((b) => {
          b.given[index] = { event: v, data: {}, recordedAt: step.recordedAt };
        })),
        h('span', { class: 'grow' }),
        h('span', { class: 'muted tiny' }, 'at'),
        h('input', {
          class: 'vin tiny-in', value: step.recordedAt,
          title: 'The instant this was recorded, in whole seconds. A projection may fold it.',
          onchange: (e) => patchScenarioDraft((b) => {
            const n = Number(e.target.value);
            b.given[index].recordedAt = Number.isInteger(n) ? n : step.recordedAt;
          }),
        }),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchScenarioDraft((b) => { b.given.splice(index, 1); }),
        }, '×')),
      payloadEditor(ctx, definition.properties, ['given', index, 'data'], scenarioWhere(ctx)));
  });

  return h('div', { class: 'card sc-editor' },
    h('h4', {}, draft.key ? 'Edit this scenario' : 'A new scenario'),
    h('div', { class: 'muted small' },
      'Write what had already happened, then the call. What it does with the two is worked out '
      + 'here — you are never asked to predict it.'),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'Given'),
    givenRows.length ? givenRows : h('div', { class: 'empty' }, 'nothing has happened yet'),
    h('div', { class: 'adder' },
      h('button', {
        class: 'btn tiny',
        onclick: () => patchScenarioDraft((b) => {
          b.given = [...(b.given || []),
            { event: eventNames[0], data: {}, recordedAt: nextInstant() }];
        }),
      }, '+ an event that had happened')),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'When'),
    h('div', { class: 'card sc-step' },
      h('div', { class: 'row' }, h('span', { class: 'y' }, readable(body.command))),
      payloadEditor(ctx, (command || {}).properties, ['when', 'arguments'], scenarioWhere(ctx))),

    h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', { class: 'btn primary', onclick: () => saveScenario(ctx) },
        draft.key ? 'Save' : 'Work out what happens'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.scenarioDraft = null; render(); },
      }, 'Cancel')));
}

// Deriving the Then is the save. A scenario that cannot be evaluated
// cannot be created either — there would be nothing to freeze — and the
// message says which part of it did not resolve.
function saveScenario(ctx) {
  const draft = state.scenarioDraft;
  const body = deepClone(draft.body);
  let then;
  try {
    then = deriveThen(ctx, body);
  } catch (error) {
    return toast(error instanceof EvaluationError
      ? error.message
      : 'That could not be worked out: ' + error.message, true);
  }
  body.then = then;
  run(() => {
    const key = draft.key || generateId();
    if (draft.key) updateDefinition('scenario-definition', ctx.id, key, body);
    else addDefinition('scenario-definition', ctx.id, key, body);
    state.scenarioDraft = null;
    state.openScenario = key;
  });
}

// ---------- where they are shown ----------

function scenarioPanel(ctx, commandName) {
  const entries = scenariosOf(ctx, commandName);
  return h('div', { class: 'scenarios' },
    entries.length
      ? entries.map((entry) => scenarioRow(ctx, entry))
      : h('div', { class: 'blank small' },
          h('p', { class: 'muted small' },
            'Nothing exercises this command yet. A scenario is what had already happened, the '
            + 'call, and what the model makes of the two — and it is the only thing here that '
            + 'notices when an edit somewhere else changes what this command does.')),
    state.scenarioDraft && state.scenarioDraft.body.command === commandName
      ? scenarioEditor(ctx)
      : h('div', { class: 'adder' },
          h('button', {
            class: 'btn' + (entries.length ? '' : ' primary'),
            onclick: () => startScenario(ctx, commandName),
          }, '+ New scenario')));
}

function scenarioTabs(ctx, slice) {
  const entries = scenariosOf(ctx, slice.name);
  const trouble = entries.filter((e) => {
    const status = scenarioResult(ctx, e.key, e.body).status;
    return status === 'drifted' || status === 'broken';
  }).length;
  const tab = (key, label, extra) => h('button', {
    class: 'tab' + (state.tab === key ? ' on' : ''),
    'aria-pressed': state.tab === key ? 'true' : 'false',
    onclick: () => { state.tab = key; state.scenarioDraft = null; render(); },
  }, label, extra);
  return h('div', { class: 'tabs' },
    tab('definition', 'Definition'),
    tab('scenarios', 'Scenarios',
      entries.length
        ? h('span', { class: 'badge' + (trouble ? '' : ' clear') }, trouble || entries.length)
        : null));
}

// ============================================================
// C2 · Property scenarios
//
// The entity-page analogue of Scenarios, one level down: a Given of
// events written by hand, and a Then nobody types — derived from the
// entity's own handlers and frozen beside the Given, so the next run
// either agrees with it or reports that something changed. There is no
// When: nothing is called, an instance's state is simply folded from
// what happened to it. And there is no full Then either — only the
// properties a modeler chose to check, so "ends up existent" does not
// require restating every field nothing here cares about.
//
// Everything else — the four statuses, the held/run gesture for a
// scripted property, the drift diff, "Accept this" — is the same
// mechanism Scenarios already has, reused rather than reinvented.
// ============================================================

const heldPropertyScenarioRuns = new Map();

function propertyScenarioResult(ctx, key, body) {
  if (!propertyScenarioTouchesScript(ctx, body)) return runPropertyScenario(ctx, body);
  const cached = heldPropertyScenarioRuns.get(key);
  if (cached && cached.at === loadEvents().length) return cached.result;
  return {
    status: 'held',
    reason: 'This property scenario checks a scripted property, so it runs when you ask and not before.',
  };
}

function runHeldPropertyScenario(ctx, key, body) {
  heldPropertyScenarioRuns.set(key, { at: loadEvents().length, result: runPropertyScenario(ctx, body) });
  render();
}

const PROPERTY_SCENARIO_STATUS_WORDS = {
  current: ['✓', 'Current', 'What this entity does is what this property scenario says it does'],
  drifted: ['≠', 'Drifted', 'This entity behaves differently now than when this was accepted'],
  broken: ['!', 'Broken', 'This could not be run at all — something it names is gone'],
  held: ['·', 'Not run', 'Checks a script, so it runs only when asked'],
};

function propertyScenariosOf(ctx, entityName) {
  return Object.entries(ctx['property-scenario-definitions'] || {})
    .filter(([, body]) => body.entity === entityName)
    .map(([key, body]) => ({ key, body }));
}

// Where a property scenario's Given lives, and what it can be helped with
// — the same identifiers-already-written suggestion Scenarios' Given
// gets. `identifiersInUse` reads `body.given`/`body.when` generically;
// a property scenario simply has no `when`; there is nothing to harvest.
function specWhere(ctx) {
  return {
    root: () => state.propertyScenarioDraft.body,
    suggest: (entity) => identifiersInUse(ctx, state.propertyScenarioDraft.body, entity),
  };
}

// A property scenario's Then, one property per line — the analogue of
// outcomeCard, shaped around `{propertyName: value}` rather than
// `{outcome, events}`.
function entityOutcomeCard(then, title) {
  if (!then) return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'nothing'));
  const entries = Object.entries(then);
  return h('div', { class: 'card' },
    h('div', { class: 'muted tiny' }, title),
    entries.length
      ? entries.map(([name, value]) => h('div', {},
          h('span', { class: 't' }, propertyWords(name)),
          h('span', { class: 'k' }, '  ' + JSON.stringify(value))))
      : h('div', { class: 'empty' }, 'nothing checked'));
}

function propertyScenarioRow(ctx, entry) {
  const { key, body } = entry;
  const result = propertyScenarioResult(ctx, key, body);
  const [mark, word, why] = PROPERTY_SCENARIO_STATUS_WORDS[result.status];
  const open = state.openPropertyScenario === key;

  const head = h('div', { class: 'row scenario-row' },
    h('span', { class: 'sc-mark s-' + result.status, title: why }, mark),
    h('button', {
      class: 'sc-name',
      onclick: () => { state.openPropertyScenario = open ? null : key; render(); },
    }, propertyScenarioName(body, propertyWords)),
    h('span', { class: 'grow' }),
    h('span', { class: 'muted tiny' }, word),
    reveal(
      result.status === 'held'
        ? h('button', {
            class: 'btn tiny', title: 'Run this one now',
            onclick: () => runHeldPropertyScenario(ctx, key, body),
          }, 'Run')
        : null,
      h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.renamingPropertyScenario = key; render(); },
      }, 'Rename'),
      removeButton('property-scenario:' + key, {
        label: 'Remove', title: 'Remove this property scenario. Nothing else is touched.',
        onRemove: () => run(() => {
          removeDefinition('property-scenario-definition', ctx.id, key);
          if (state.openPropertyScenario === key) state.openPropertyScenario = null;
        }),
      })));

  if (state.renamingPropertyScenario === key) {
    return h('div', { class: 'scenario' }, head, inlineForm({
      question: 'What should this property scenario be called?',
      placeholder: propertyScenarioName({ ...body, name: undefined }, propertyWords),
      value: typeof body.name === 'string' ? body.name : '',
      submitLabel: 'Rename',
      onSubmit: (v) => {
        const next = (v || '').trim();
        state.renamingPropertyScenario = null;
        run(() => {
          const nextBody = { ...deepClone(body) };
          if (next) nextBody.name = next; else delete nextBody.name;
          updateDefinition('property-scenario-definition', ctx.id, key, nextBody);
        });
      },
      onCancel: () => { state.renamingPropertyScenario = null; render(); },
    }));
  }

  if (!open) return h('div', { class: 'scenario' }, head);

  return h('div', { class: 'scenario open' }, head,
    h('div', { class: 'sc-body' },
      h('div', { class: 'muted tiny' }, 'Given'),
      (body.given || []).length
        ? (body.given || []).map((step) => h('div', { class: 'sc-line' },
            h('span', { class: 'y' }, readable(step.event)),
            h('span', { class: 'k' }, '  ' + payloadText(step.data))))
        : h('div', { class: 'empty' }, 'nothing had happened yet'),
      h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'For instance'),
      h('div', { class: 'sc-line' }, h('span', { class: 'k' }, body.forInstance)),
      h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'Then'),
      result.status === 'broken'
        ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
            h('div', { class: 'small' }, result.reason),
            h('div', { class: 'muted tiny', style: 'margin-top:6px' },
              'What it used to expect is kept below, so nothing is lost while you repair it.'),
            entityOutcomeCard(result.expected, 'was'))
        : result.status === 'drifted'
          ? h('div', { class: 'drift' },
              entityOutcomeCard(result.expected, 'this property scenario says'),
              entityOutcomeCard(result.actual, 'the model now does'),
              h('div', { class: 'adder' },
                h('button', {
                  class: 'btn primary',
                  title: 'Store what the model now does as what this property scenario expects',
                  onclick: () => run(() => {
                    updateDefinition('property-scenario-definition', ctx.id, key,
                      { ...deepClone(body), then: result.actual });
                  }),
                }, 'Accept this'),
                h('span', { class: 'muted tiny' },
                  'Nothing changes in the model — only what this property scenario expects of it.')))
          : entityOutcomeCard(result.status === 'held' ? body.then : result.expected,
              result.status === 'held' ? 'last accepted' : 'and it does')));
}

function startPropertyScenario(ctx, entityName) {
  closeForms();
  state.entityTab = 'property-scenarios';
  state.propertyScenarioDraft = {
    key: null,
    body: { entity: entityName, forInstance: '', given: [], assert: [] },
  };
  render();
}

function patchPropertyScenarioDraft(mutate) {
  const draft = state.propertyScenarioDraft;
  if (!draft) return;
  mutate(draft.body);
  render();
}

function propertyScenarioEditor(ctx) {
  const draft = state.propertyScenarioDraft;
  const body = draft.body;
  const entity = ctx['entity-definitions'][body.entity];
  const eventNames = Object.keys(ctx['event-definitions']).sort();

  const nextInstant = () => {
    const last = (body.given || []).reduce((max, s) => Math.max(max, s.recordedAt || 0), 0);
    return last + 1;
  };

  const givenRows = (body.given || []).map((step, index) => {
    const definition = ctx['event-definitions'][step.event] || {};
    return h('div', { class: 'card sc-step' },
      h('div', { class: 'row' },
        pick(eventNames.map((n) => [n, readable(n)]), step.event, (v) => patchPropertyScenarioDraft((b) => {
          b.given[index] = { event: v, data: {}, recordedAt: step.recordedAt };
        })),
        h('span', { class: 'grow' }),
        h('span', { class: 'muted tiny' }, 'at'),
        h('input', {
          class: 'vin tiny-in', value: step.recordedAt,
          title: 'The instant this was recorded, in whole seconds. A projection may fold it.',
          onchange: (e) => patchPropertyScenarioDraft((b) => {
            const n = Number(e.target.value);
            b.given[index].recordedAt = Number.isInteger(n) ? n : step.recordedAt;
          }),
        }),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchPropertyScenarioDraft((b) => { b.given.splice(index, 1); }),
        }, '×')),
      payloadEditor(ctx, definition.properties, ['given', index, 'data'], specWhere(ctx)));
  });

  const properties = entity ? entity.properties : [];
  const assertRows = properties.map((property) => h('label', { class: 'tiny muted', style: 'display:block' },
    h('input', {
      type: 'checkbox', checked: (body.assert || []).includes(property.name),
      onchange: (e) => patchPropertyScenarioDraft((b) => {
        b.assert = e.target.checked
          ? [...(b.assert || []), property.name]
          : (b.assert || []).filter((n) => n !== property.name);
      }),
    }), ' ', propertyWords(property.name)));

  return h('div', { class: 'card sc-editor' },
    h('h4', {}, draft.key ? 'Edit this property scenario' : 'A new property scenario'),
    h('div', { class: 'muted small' },
      'Write what had already happened, then say which of it to check. What it ends up being is '
      + 'worked out here — you are never asked to predict it.'),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'Given'),
    givenRows.length ? givenRows : h('div', { class: 'empty' }, 'nothing has happened yet'),
    h('div', { class: 'adder' },
      h('button', {
        class: 'btn tiny',
        onclick: () => patchPropertyScenarioDraft((b) => {
          b.given = [...(b.given || []),
            { event: eventNames[0], data: {}, recordedAt: nextInstant() }];
        }),
      }, '+ an event that had happened')),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'For instance'),
    h('div', { class: 'card sc-step' },
      valueEditor(ctx, { name: 'forInstance', propertyType: idTypeOf(ctx, body.entity), isList: false },
        ['forInstance'], specWhere(ctx))),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'Then, check'),
    assertRows.length ? assertRows : h('div', { class: 'empty' }, 'nothing to check yet'),

    h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', { class: 'btn primary', onclick: () => savePropertyScenario(ctx) },
        draft.key ? 'Save' : 'Work out what happens'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.propertyScenarioDraft = null; render(); },
      }, 'Cancel')));
}

// Deriving the Then is the save, exactly as it is for a scenario — see
// saveScenario. The properties a modeler checked live in `assert`
// only on the draft; the saved body keeps just their folded values,
// under `then`, which is also what re-opening this for editing reads
// the checked set back from.
function savePropertyScenario(ctx) {
  const draft = state.propertyScenarioDraft;
  const body = deepClone(draft.body);
  const propertyNames = body.assert || [];
  delete body.assert;
  let then;
  try {
    then = derivePropertyScenarioThen(ctx, body, propertyNames);
  } catch (error) {
    return toast(error instanceof EvaluationError
      ? error.message
      : 'That could not be worked out: ' + error.message, true);
  }
  body.then = then;
  run(() => {
    const key = draft.key || generateId();
    if (draft.key) updateDefinition('property-scenario-definition', ctx.id, key, body);
    else addDefinition('property-scenario-definition', ctx.id, key, body);
    state.propertyScenarioDraft = null;
    state.openPropertyScenario = key;
  });
}

function propertyScenarioPanel(ctx, entityName) {
  const entries = propertyScenariosOf(ctx, entityName);
  return h('div', { class: 'scenarios' },
    entries.length
      ? entries.map((entry) => propertyScenarioRow(ctx, entry))
      : h('div', { class: 'blank small' },
          h('p', { class: 'muted small' },
            'Nothing exercises this entity yet. A property scenario is what had already happened and '
            + 'which of it to check — and it is the only thing here that notices when an edit '
            + 'somewhere else changes what this entity ends up being.')),
    state.propertyScenarioDraft && state.propertyScenarioDraft.body.entity === entityName
      ? propertyScenarioEditor(ctx)
      : h('div', { class: 'adder' },
          h('button', {
            class: 'btn' + (entries.length ? '' : ' primary'),
            onclick: () => startPropertyScenario(ctx, entityName),
          }, '+ New property scenario')));
}

function entityTabs(ctx, entityName) {
  const entries = propertyScenariosOf(ctx, entityName);
  const trouble = entries.filter((e) => {
    const status = propertyScenarioResult(ctx, e.key, e.body).status;
    return status === 'drifted' || status === 'broken';
  }).length;
  const tab = (key, label, extra) => h('button', {
    class: 'tab' + (state.entityTab === key ? ' on' : ''),
    'aria-pressed': state.entityTab === key ? 'true' : 'false',
    onclick: () => { state.entityTab = key; state.propertyScenarioDraft = null; render(); },
  }, label, extra);
  return h('div', { class: 'tabs' },
    tab('definition', 'Definition'),
    tab('property-scenarios', 'Property scenarios',
      entries.length
        ? h('span', { class: 'badge' + (trouble ? '' : ' clear') }, trouble || entries.length)
        : null));
}


// ============================================================
// D · Sandbox
//
// The other way to try a model: not one command against a written
// Given, but a run of them against each other, with the events piling
// up and the state responding as they go.
//
// Nothing here is kept. It exists to answer "what happens if", and an
// experiment that outlived the question would be history the model has
// to carry — so it lives in this variable and is gone on reload. What
// makes that affordable is that the model itself is untouched: driving
// a command here appends to `session.log`, never to the event log the
// playground stores its own definitions in.
//
// **Scrubbing replays from zero.** Every position is a fold of the
// events up to it, computed fresh. An incremental fold would only help
// going forwards and would need a snapshot regime to come back, and
// nothing measured says it is needed — the same ground the worker was
// dropped on.
//
// **A refusal is shown and not recorded.** The timeline is what
// happened; a command that was refused did not happen. It is said out
// loud at the moment you try it, and then it is gone.
// ============================================================

const session = {
  log: [],        // events so far — the shape `evaluate.js` reads
  steps: [],      // one per command that went through: { command, args, from, to }
  at: null,       // how many events are visible; null means all of them
  pinned: [],     // 'Course:c1' — instances shown wherever you are
  clock: 1000,    // the instant the next event is recorded at
};

function sessionReset() {
  session.log = [];
  session.steps = [];
  session.at = null;
  session.pinned = [];
  session.clock = 1000;
}

function sessionPosition() {
  return session.at === null ? session.log.length : session.at;
}

function sessionVisible() {
  return session.log.slice(0, sessionPosition());
}

// The step the current position sits inside — the command whose events
// were the last to arrive. Nothing at position zero: before the first
// command there is no decision to look at.
function sessionStepAt(position) {
  for (let i = session.steps.length - 1; i >= 0; i--) {
    if (session.steps[i].to <= position) return session.steps[i];
  }
  return null;
}

// Drives a command against everything recorded so far. A refusal
// changes nothing — not the log, not the clock, not the position.
function sessionRun(ctx, commandName, args) {
  let result;
  try {
    result = evaluateCommand(ctx, session.log, commandName, args, { recordedAt: session.clock });
  } catch (error) {
    if (error instanceof EvaluationError) return toast(error.message, true);
    throw error;
  }
  if (result.outcome === 'rejected') {
    const rule = result.failedRule;
    return toast(`${readable(commandName)} was refused: ${rule.text}`, true);
  }
  const from = session.log.length;
  session.log.push(...result.events);
  session.steps.push({ command: commandName, args, from, to: session.log.length });
  session.clock += 1;
  session.at = null;
  state.sandboxDraft = null;
  render();
}

// Every instance any visible event is about, as `Entity:id`. Tags are
// the only thing that says so, which is why this reads them rather
// than the payloads.
function sessionInstances(ctx) {
  const found = new Set();
  for (const event of sessionVisible()) {
    for (const tag of tagsOfEvent(ctx, event.type, event.data)) found.add(tag);
  }
  return [...found].sort();
}

// One instance, projected over what is visible. A scripted property is
// read through a binding that supplies its arguments, and there is no
// binding here — so it says so rather than guessing at them.
function sessionInstanceState(ctx, tag) {
  const [entityName, id] = [tag.slice(0, tag.indexOf(':')), tag.slice(tag.indexOf(':') + 1)];
  const entity = ctx['entity-definitions'][entityName];
  if (!entity) return null;
  const log = sessionVisible();
  return {
    entity: entityName,
    id,
    properties: (entity.properties || []).map((property) => {
      if (scriptOf(property)) {
        return { name: property.name, scripted: true };
      }
      try {
        return {
          name: property.name,
          value: foldEntityProperty(ctx, log, entityName, property.name, id),
        };
      } catch (error) {
        if (error instanceof EvaluationError) return { name: property.name, error: error.message };
        throw error;
      }
    }),
  };
}


// ---------- driving one ----------

function sandboxDriver(ctx) {
  const names = Object.keys(ctx['command-definitions']);
  if (!names.length) return null;
  if (!state.sandboxDraft) {
    return h('div', { class: 'adder' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          state.sandboxDraft = { command: names[0], arguments: {} };
          render();
        },
      }, '+ Do something'));
  }

  const draft = state.sandboxDraft;
  const command = ctx['command-definitions'][draft.command];
  return h('div', { class: 'card sc-editor' },
    h('div', { class: 'row' },
      pick(names.map((n) => [n, readable(n)]), draft.command, (v) => {
        state.sandboxDraft = { command: v, arguments: {} };
        render();
      }),
      h('span', { class: 'grow' })),
    payloadEditor(ctx, (command || {}).properties, ['arguments'], sandboxWhere(ctx)),
    h('div', { class: 'adder', style: 'margin-top:12px' },
      h('button', {
        class: 'btn primary',
        onclick: () => sessionRun(ctx, draft.command, draft.arguments),
      }, 'Do it'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.sandboxDraft = null; render(); },
      }, 'Cancel')));
}

// ---------- the timeline ----------

// The pointer never owns a single `.estep` — the whole page gets
// rebuilt under it on every move, which would drop a capture set on
// one particular element. Tracking through `window` instead survives
// that: each move just asks the live DOM what is under the pointer
// now, so it does not matter that "now" is a different node than a
// moment ago.
function scrubToPointer(e, goTo) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const step = el && el.closest && el.closest('.estep');
  if (step) goTo(Number(step.dataset.index) + 1);
}

function sandboxTimeline(ctx) {
  const total = session.log.length;
  const position = sessionPosition();
  const goTo = (next) => {
    session.at = Math.max(0, Math.min(total, next));
    if (session.at === total) session.at = null;
    render();
  };

  const startDrag = (e) => {
    scrubToPointer(e, goTo);
    const onMove = (ev) => scrubToPointer(ev, goTo);
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };

  // Which step produced event `i` — not sessionStepAt, which answers a
  // different question (the step a *position* last completed inside).
  const stepOfEvent = (i) => session.steps.find((s) => i >= s.from && i < s.to) || null;

  const items = [];
  session.log.forEach((event, i) => {
    if (i === position) items.push(h('span', { class: 'eplayhead' }));
    const step = stepOfEvent(i);
    items.push(h('span', {
      class: 'estep'
        + (i < position ? (i === position - 1 ? ' current' : ' played') : ' upcoming')
        + (step && i === step.to - 1 ? ' step-end' : ''),
      'data-index': String(i),
      title: readable(event.type) + (step ? ' — from ' + readable(step.command) : '')
        + (Object.keys(event.data || {}).length ? ' · ' + payloadText(event.data) : ''),
      onclick: () => goTo(i + 1),
    }, eventIcon(ctx, event.type)));
  });
  if (position === total) items.push(h('span', { class: 'eplayhead' }));

  return h('div', { class: 'timeline' },
    h('div', { class: 'trow' },
      h('button', {
        class: 'btn tiny', disabled: position === 0, title: 'Back one event',
        onclick: () => goTo(position - 1),
      }, '◀'),
      h('div', {
        class: 'escrub', tabindex: '0', role: 'slider',
        'aria-orientation': 'horizontal', 'aria-valuemin': '0', 'aria-valuemax': String(total),
        'aria-valuenow': String(position), 'aria-valuetext': `${position} of ${total}`,
        title: 'Drag, click, or use the arrow keys to scrub through what has happened',
        onpointerdown: startDrag,
        onkeydown: (e) => {
          if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(position - 1); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(position + 1); }
          else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
          else if (e.key === 'End') { e.preventDefault(); goTo(total); }
        },
      }, items),
      h('button', {
        class: 'btn tiny', disabled: position === total, title: 'On one event',
        onclick: () => goTo(position + 1),
      }, '▶'),
      h('span', { class: 'muted tiny' }, `${position} of ${total}`)));
}

// ---------- what the current step saw ----------
//
// The boundary is re-derived rather than remembered. A definition
// edited while a session is open changes what this shows, which is the
// point of having both open at once — and if the edit means the
// command would no longer go through, that is worth being told rather
// than being shown a boundary that no longer applies.
//
// This does re-run a scripted projection on every repaint, which is the
// thing scenarios go out of their way not to do. The difference is what
// a hang costs. A session is held in memory and nothing else, so a
// script that loops forever is undone by reloading the page — where a
// stored scenario running on load would hang again on the way back in,
// and there would be no way to reach the script to fix it.
function sandboxDecision(ctx) {
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (!step) {
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'Nothing has happened yet.'));
  }

  let result;
  try {
    result = evaluateCommand(ctx, session.log.slice(0, step.from), step.command, step.args);
  } catch (error) {
    if (!(error instanceof EvaluationError)) throw error;
    return h('div', { class: 'card', style: 'border-color:var(--danger)' },
      h('div', { class: 'small' },
        readable(step.command) + ' can no longer be worked out here: ' + error.message));
  }

  const stale = result.outcome === 'rejected'
    ? h('div', { class: 'card', style: 'border-color:var(--danger);margin-bottom:8px' },
        h('div', { class: 'small' },
          'This went through when it was done, and would be refused now — by '
          + result.failedRule.text + '. Everything after it on the timeline followed from it.'))
    : null;

  const reads = Object.entries(result.reads || {});
  return h('div', {},
    stale,
    h('div', { class: 'muted tiny' },
      readable(step.command) + ' · ' + payloadText(step.args)),
    reads.length
      ? reads.map(([alias, read]) => read.kind === 'projection'
        ? h('div', { class: 'card sc-line' },
            h('span', { class: 'k' }, alias + ' — '),
            h('span', { class: 't' }, readable(read.projection)),
            h('span', { class: 'k' }, '  ' + JSON.stringify(read.value)))
        : h('div', { class: 'card' },
            h('div', { class: 'sc-line' },
              h('span', { class: 'k' }, alias + ' — '),
              h('span', { class: 't' }, readable(read.entity)),
              read.fanned ? h('span', { class: 'k' }, `  (${read.instances.length})`) : null),
            read.instances.map((instance) => h('div', { class: 'sc-line' },
              pinButton(read.entity + ':' + instance.id),
              h('span', { class: 't' }, instance.id),
              h('span', { class: 'k' }, '  ' + payloadText(instance.properties))))))
      : h('div', { class: 'card' }, h('div', { class: 'empty' }, 'It read nothing.')));
}

function pinButton(tag) {
  const on = session.pinned.includes(tag);
  return h('button', {
    class: 'pin' + (on ? ' on' : ''),
    title: on ? 'Stop watching this one' : 'Watch this one wherever you are on the timeline',
    onclick: () => {
      session.pinned = on ? session.pinned.filter((t) => t !== tag) : [...session.pinned, tag];
      render();
    },
  }, on ? '★' : '☆');
}

// One instance's full current state, as a card — the same rendering
// whether it got here by being pinned or by having been read.
function instanceStateCard(ctx, tag) {
  const held = sessionInstanceState(ctx, tag);
  if (!held) {
    return h('div', { class: 'card' },
      h('div', { class: 'sc-line' }, pinButton(tag),
        h('span', { class: 'k' }, tag + ' — gone from this model')));
  }
  return h('div', { class: 'card' },
    h('div', { class: 'sc-line' },
      pinButton(tag),
      h('span', { class: 't' }, readable(held.entity) + ' ' + held.id)),
    held.properties.map((property) => h('div', { class: 'sc-line' },
      h('span', { class: 'k' }, '  ' + propertyWords(property.name) + ' '),
      property.scripted
        ? h('span', { class: 'k' }, '— scripted, read through a command')
        : property.error
          ? h('span', { class: 'k' }, '— ' + property.error)
          : h('span', {}, JSON.stringify(property.value)))));
}

function sandboxWatched(ctx) {
  if (!session.pinned.length) return null;
  return step('scenarios', 'Watched',
    h('div', { class: 'muted small' },
      'Followed wherever you are on the timeline, whether or not the step you are looking at '
      + 'read them.'),
    session.pinned.map((tag) => instanceStateCard(ctx, tag)));
}

// ---------- what the involved decision models look like now ----------
//
// `sandboxDecision` is frozen at the instant the step decided; this
// moves as you scrub. An entity's "now" is its full state — the same
// card `instanceStateCard` gives a pinned instance — not only the
// properties the decision happened to touch, which is the boundary's
// story to tell, not this one's. A projection has no properties to
// enumerate, so its "now" is just a fresh fold — gotten by deciding the
// same command again against the log as it stands here, which is also
// the only way to recover the argument values it was folded with.
function sandboxNow(ctx) {
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (!step) {
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'Nothing has happened yet.'));
  }

  let then;
  try {
    then = evaluateCommand(ctx, session.log.slice(0, step.from), step.command, step.args);
  } catch (error) {
    if (!(error instanceof EvaluationError)) throw error;
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'See "What it read to decide" above.'));
  }

  const reads = Object.entries(then.reads || {});
  if (!reads.length) {
    return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'It involved nothing.'));
  }

  let now = null;
  let nowError = null;
  try {
    now = evaluateCommand(ctx, sessionVisible(), step.command, step.args);
  } catch (error) {
    if (!(error instanceof EvaluationError)) throw error;
    nowError = error.message;
  }

  return h('div', {},
    reads.map(([alias, read]) => read.kind === 'projection'
      ? h('div', { class: 'card sc-line' },
          h('span', { class: 'k' }, alias + ' — '),
          h('span', { class: 't' }, readable(read.projection)),
          now
            ? h('span', { class: 'k' }, '  ' + JSON.stringify(now.reads[alias].value))
            : h('span', { class: 'k' }, '  can no longer be worked out here: ' + nowError))
      : h('div', {},
          h('div', { class: 'muted tiny' },
            alias + ' — ' + readable(read.entity)
              + (read.fanned ? ` (${read.instances.length})` : '')),
          read.instances.map((instance) =>
            instanceStateCard(ctx, read.entity + ':' + instance.id)))));
}

// ---------- the page ----------

function renderSandbox(ctx, main) {
  main.appendChild(h('header', {},
    qrow('div', { cls: 'row', key: 'sandbox' },
      h('div', { class: 'name' }, 'Sandbox'),
      h('span', { class: 'grow' }),
      session.log.length
        ? removeButton('sandbox:reset', {
            label: 'Start over',
            title: 'Throw all of this away and start from nothing',
            confirm: 'Really start over?',
            onRemove: () => { sessionReset(); state.sandboxDraft = null; render(); },
          })
        : null),
    h('div', { class: 'muted small summary' },
      'Drive the commands and watch what happens. Nothing here is kept — it is gone when this '
      + 'page reloads, and the model itself is never written to.')));

  main.appendChild(step('trigger', 'Do something', sandboxDriver(ctx)
    || h('div', { class: 'empty' }, 'This model has no commands to drive yet.')));

  if (session.log.length) {
    main.appendChild(step('emits', 'What has happened',
      sandboxTimeline(ctx),
      h('div', { class: 'card sc-line', style: 'margin-top:8px' },
        sessionVisible().length
          ? sessionVisible().map((event, index) => h('div', {
              class: index === sessionPosition() - 1 ? 'lit' : '',
            },
              h('span', { class: 'ic' }, eventIcon(ctx, event.type)),
              h('span', { class: 'y' }, readable(event.type)),
              h('span', { class: 'k' }, '  ' + payloadText(event.data))))
          : h('div', { class: 'empty' }, 'nothing yet'))));

    main.appendChild(step('reads', 'What it read to decide', sandboxDecision(ctx)));
    main.appendChild(step('now', 'What it looks like now', sandboxNow(ctx)));
    const watched = sandboxWatched(ctx);
    if (watched) main.appendChild(watched);
  }
}

// Escape backs out of one layer, wherever the focus happens to be, and
// the layers are the order in which they were opened: the settings sit
// over the page, a form sits over the row that opened it, and a
// selected row sits under both. Nothing here reaches the model — every
// layer it closes is a decision not yet made.
window.addEventListener('keydown', (e) => {
  // A field that handles Escape itself has already handled it: the
  // inline forms cancel on it, and cancelling once should not also
  // throw away the selection underneath.
  if (e.key !== 'Escape' || e.defaultPrevented) return;

  // Quick open handles its own Escape and stops it there, so reaching
  // this while it is up means it is already gone.
  if (state.palette) { closePalette(); return render(); }
  if (state.pendingImport) { state.pendingImport = null; return render(); }
  if (state.problems) { state.problems = false; return render(); }
  if (state.settings) { state.settings = false; return render(); }
  if (state.models) {
    state.models = false;
    state.newContext = false; state.loadingUrl = false; state.loadingJson = false;
    return render();
  }
  // The splash's own naming form — reachable without the Models modal
  // ever opening.
  if (state.newContext) { state.newContext = false; return render(); }
  // The splash itself, reached from the brand mark over a model that
  // is still loaded — Escape is the quick way back to it. With nothing
  // loaded the splash is the only page there is, so this is a no-op.
  if (state.splash && activeContextId()) { state.splash = false; return render(); }

  // Inside a free text field, Escape is about the field: it steps out
  // and leaves everything else where it is. A second press then backs
  // out of the row the field was in.
  const field = e.target instanceof Element
    && e.target.closest('input, textarea, select');
  if (field) { field.blur(); return; }

  if (formOpen()) { closeForms(); return render(); }

  // A selected row, an adder unfolded under a list, a reference pinned
  // to its source: whichever of these is on, Escape puts it back.
  if (state.sel || state.adder || state.lit) {
    const key = state.sel;
    // An open adder folds back to a single button, which is fewer tab
    // stops than the form it replaces — closing it shifts everything
    // after it up the page, so the generic by-position focus restore in
    // `render` overshoots into whatever now sits where the keyboard
    // used to be. Noting which step the keyboard was in before the
    // repaint is what lets it land on that step's own folded button
    // instead, the same way opening one does.
    const openStep = document.activeElement instanceof Element
      ? document.activeElement.closest('.step')
      : null;
    const openStepKind = openStep
      && [...openStep.classList].find((c) => c !== 'step');
    state.sel = null; state.adder = null; state.lit = null;
    render();
    // Deselecting must not also lose the keyboard's place on the page.
    if (key) {
      const row = document.querySelector(`.qrow[data-key="${CSS.escape(key)}"]`);
      if (row) row.focus();
    } else if (openStepKind) {
      const btn = document.querySelector('.step.' + openStepKind + ' .flow-adder');
      if (btn) btn.focus();
    }
  }
});

// ⌘K, ⌘S and ⌘Z: quick open, sharing and undo, all reachable from
// anywhere in the page.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const command = e.metaKey || e.ctrlKey;
  if (!command) return;
  const key = e.key.toLowerCase();

  if (key === 'k') {
    if (!activeContextId()) return;
    e.preventDefault();
    if (state.palette) { closePalette(); render(); } else openPalette();
  } else if (key === 's') {
    if (!activeContextId()) return;
    e.preventDefault();
    runAsync(shareCurrentModel);
  } else if (key === 'z') {
    // Inside a field ⌘Z is the field's own undo, and taking it would
    // make a half-typed name unrecoverable.
    const inField = e.target instanceof Element
      && e.target.closest('input, textarea, select');
    if (inField) return;
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
});

// Arrow keys move between rows. Reading a command is walking down its
// rows — Tab visits every button on the way, the arrows visit only the
// rows.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const inField = e.target instanceof Element
    && e.target.closest('input, textarea, select');
  if (!inField && !state.palette && !state.settings && !state.problems && !state.models
      && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    if (moveRow(e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
  }
});

// Whether the page has been scrolled at all — the only thing the pinned
// header needs to know to decide how much of itself to keep.
window.addEventListener('scroll', () => {
  document.body.classList.toggle('scrolled', window.scrollY > 60);
}, { passive: true });

// The disclaimer wraps to two lines on a narrow-enough screen, which
// changes .topbar's real height — everything sticky beneath it reads
// `--topbar-h` rather than a guessed constant, so it stays measured
// instead of drifting out of sync on resize or rotation.
function syncTopbarHeight() {
  const topbar = document.querySelector('.topbar');
  if (topbar) document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
}
window.addEventListener('resize', syncTopbarHeight);

// The rail drawer closes itself once a link in it is actually followed
// — on a narrow screen there is no other way back to the content it
// was covering. Delegated once, on the rail's own element (which
// `renderRail` never replaces, only refills), rather than threaded
// through every one of its many links.
document.getElementById('rail').addEventListener('click', (e) => {
  if (state.railOpen && e.target.closest('a')) { state.railOpen = false; render(); }
});

// A `#context=…` fragment never reaches the server (there is none), so
// this is the only place it is read. Cleared as soon as it is read,
// successfully or not — a bad or already-consumed link should not keep
// re-triggering on every reload.
async function boot() {
  render();
  syncTopbarHeight();
  const hash = location.hash;
  if (!hash.startsWith('#context=')) return;
  history.replaceState(null, '', location.pathname + location.search);
  let envelope;
  try {
    envelope = await decodeShareLink(hash.slice('#context='.length));
  } catch (error) {
    toast('That share link could not be read: ' + error.message, true);
    return;
  }
  beginImport(envelope);
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
