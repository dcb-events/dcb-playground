# Lifecycle of a DCB Context: events, DCBs, commands.
# A `dcb-context` is identified by a generated id, minted at creation.
# Its name is a mutable display attribute, not an identifier.

apiVersion: schema.esdm.io/core/v1
kind: event
name: dcb-context-created
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: dcb-context-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: dcb-context-deleted
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
  required: [dcb-context-id]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: dcb-context-creation
description: |
  Guards the creation of a fresh DCB Context. The instance is
  parameterised by the new id; the consult surface is the lifecycle
  events for that id, so re-creation is refused.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` equals this instance's id
invariants:
  - name: id-fresh
    rule: No `dcb-context-created` event has been recorded for this id.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: dcb-context-revision
description: |
  Guards changes to an existing DCB Context — renaming and deletion.
  Same consult surface and same invariants for both, so the two
  commands share this single DCB.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` equals this instance's id
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` equals this instance's id
invariants:
  - name: context-exists
    rule: A `dcb-context-created` event has been recorded for this id.
  - name: context-not-deleted
    rule: No `dcb-context-deleted` event has been recorded for this id.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: create-dcb-context
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: dcb-context-creation
data:
  type: object
  properties:
    dcb-context-id:
      type: string
      description: |
        Freshly minted id for the new context. Generation happens
        before the command is dispatched; the DCB then refuses
        re-use of an id that has already been seen.
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
publishes:
  - dcb-context-created
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-dcb-context
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: dcb-context-revision
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
publishes:
  - dcb-context-renamed
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: delete-dcb-context
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: dcb-context-revision
data:
  type: object
  properties:
    dcb-context-id:
      type: string
  required: [dcb-context-id]
  additionalProperties: false
publishes:
  - dcb-context-deleted
actors:
  - modeler
