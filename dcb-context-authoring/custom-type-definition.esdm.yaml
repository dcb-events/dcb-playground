# Custom-type definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name`.
#
# Custom types are *value* types only — there is no tag flag. Tags come
# exclusively from entity identifiers. Custom types nevertheless share
# a namespace with the types entities derive (`<Entity>Id`,
# `<Entity>State`), so adding or renaming one must check that namespace
# against the live entities as well as against other custom types.
#
# References out: none (the schema is opaque JSON Schema).
# References in: event-definitions, entity-definitions and
# command-definitions, through their property types; and
# sequence-definitions, through `valueType`.

apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        The custom-type's authored content (its JSON Schema). Kept
        opaque here — the shape of a `body` is owned by the DCB
        Context schema, not by this domain model.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-removed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-addition
description: |
  Guards the addition of a new custom-type-definition. Beyond the
  usual "context active + name not in use" checks it consults the
  entity lifecycle, because a custom type may not claim a name that a
  live entity already derives.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: custom-type-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — the candidate name must not collide with a derived type name
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: |
      No custom-type-definition currently goes by this name in this
      context — folding the consulted add/rename/remove events yields
      no live definition with this name.
  - name: name-not-derived
    rule: |
      No live entity-definition derives this name: for no live entity
      `E` does the candidate name equal `<E>Id` or `<E>State`.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-update
description: |
  Guards schema updates to an existing custom-type-definition (name
  unchanged). The name checks reduce to "the name *is* currently in
  use", since an update claims no new name.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: custom-type-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `custom-type-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A custom-type-definition currently goes by this name in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-rename
description: |
  Guards renaming a custom-type-definition. Consults event, entity,
  command and sequence lifecycle events alongside its own, so every
  definition naming `previous-name` — as a property type, or as a
  sequence's `valueType` — can be rewritten in the same append — and consults the entity lifecycle a second time over,
  because the new name must not collide with a derived type name.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to find property types to rewrite
  - boundedContext: dcb-context-authoring
    event: event-definition-updated
    criteria: every event-definition update in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed both for the collision check on `name` and to find property types to rewrite
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to find property types to rewrite
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: every command-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: sequence-definition-added
    criteria: every sequence-definition added in this context — a sequence's `valueType` names a type
  - boundedContext: dcb-context-authoring
    event: sequence-definition-updated
    criteria: every sequence-definition update in this context
  - boundedContext: dcb-context-authoring
    event: sequence-definition-removed
    criteria: every sequence-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A custom-type-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No custom-type-definition currently goes by `name` in this context.
  - name: new-name-not-derived
    rule: |
      No live entity-definition derives `name`: for no live entity `E`
      does `name` equal `<E>Id` or `<E>State`.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-removal
description: |
  Guards removal of a custom-type-definition. Consults event, entity,
  command and sequence lifecycle events to refuse removal while any
  definition still names it — as a property type, or as a sequence's
  `valueType`.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: custom-type-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `custom-type-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to check for inbound references
  - boundedContext: dcb-context-authoring
    event: event-definition-updated
    criteria: every event-definition update in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed to check for inbound references
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to check for inbound references
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: sequence-definition-added
    criteria: every sequence-definition added in this context — a sequence's `valueType` names a type
  - boundedContext: dcb-context-authoring
    event: sequence-definition-updated
    criteria: every sequence-definition update in this context
  - boundedContext: dcb-context-authoring
    event: sequence-definition-removed
    criteria: every sequence-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A custom-type-definition currently goes by this name in this context.
  - name: no-inbound-references
    rule: |
      No live event-definition, entity-definition or
      command-definition in this context types a property with this
      name, and no live sequence-definition issues it as its
      `valueType`. References are read from the latest body of each
      live definition.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-custom-type-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: custom-type-definition-addition
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - custom-type-definition-added
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: update-custom-type-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: custom-type-definition-update
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - custom-type-definition-updated
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-custom-type-definition
description: |
  Renames a custom-type-definition. Atomically emits the rename event
  plus one `*-updated` event for every event-, entity- and
  command-definition that typed a property with `previous-name`, and
  for every sequence-definition issuing it, with every occurrence
  replaced by `name`.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: custom-type-definition-rename
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
publishes:
  - custom-type-definition-renamed
  - event-definition-updated
  - entity-definition-updated
  - command-definition-updated
  - sequence-definition-updated
constraints:
  - name: rewrite-property-type-references
    rule: |
      Emit exactly one `*-updated` event for every event-, entity- and
      command-definition currently in the context with at least one
      property typed `previous-name`, with every occurrence replaced
      by `name`. Emit nothing for definitions that did not reference
      the renamed type.
  - name: rewrite-sequence-value-types
    rule: |
      Emit exactly one `sequence-definition-updated` for every
      sequence-definition currently in the context whose `valueType`
      is `previous-name`, replaced by `name`. Emit nothing for
      sequences issuing another type.
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-custom-type-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: custom-type-definition-removal
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
publishes:
  - custom-type-definition-removed
actors:
  - modeler
