# Event definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name` (the natural key).
#
# References out: custom-type-definitions and entity-derived types via
# property types. A property typed with an entity identifier is what
# makes the event carry that entity's tag, so the property-type
# reference is load-bearing rather than cosmetic.
#
# References in: entity-definitions (a property handler names the event
# it folds) and command-definitions (`publishes`). Renames therefore
# rewrite entities and commands atomically.

apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        The event-definition's authored content (its properties, and
        thereby its tags). Kept opaque here — the schema for a `body`
        is the DCB Context schema this playground edits, which is the
        subject of the tool, not of this domain model.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-removed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-addition
description: |
  Guards the addition of a new event-definition. Parameterised by
  context id and the candidate name; consults the context lifecycle
  (must be active), prior event-definition lifecycle events for the
  same name (must not currently identify a live definition), and the
  custom-type and entity lifecycles so the property types in the new
  body can be resolved in the same append.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: event-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context — needed to resolve value-typed properties
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed to resolve properties typed with a derived `<Entity>Id`
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: |
      No event-definition currently goes by this name in this
      context — folding the consulted add/rename/remove events
      yields no live definition with this name.
  - name: references-resolve
    rule: |
      Every property type resolves to a simple type, a live
      custom-type-definition, or a type derived from a live
      entity-definition.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-update
description: |
  Guards body updates to an existing event-definition (name
  unchanged). Same consult surface as `event-definition-addition`;
  the uniqueness invariant flips to "the name *is* currently in use".

  Also consults entity and command lifecycles: dropping a property
  removes a tag or a value that a folding entity handler or an
  emitting command may still bind.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: event-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: |
      An event-definition currently goes by this name in this
      context — the consult history resolves to a live definition.
  - name: references-resolve
    rule: |
      Every property type in the updated body resolves to a simple
      type, a live custom-type-definition, or a type derived from a
      live entity-definition.
  - name: inbound-property-references-survive
    rule: |
      Every property of this event that a live entity handler reads
      (as a handler value) or a live command binds (in an event
      emission) is still present in the updated body.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-rename
description: |
  Guards renaming an event-definition. In addition to the
  event-definition lifecycle, the DCB consults all entity and command
  lifecycle events for the context, so the triggering command can emit
  the reference-rewrite events for every entity (whose property
  handlers name the event) and every command (whose `publishes` list
  names it) currently referencing `previous-name` in one atomic
  append.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed to find property handlers to rewrite
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to find references to rewrite
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: every command-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: An event-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No event-definition currently goes by `name` in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-removal
description: |
  Guards removal of an event-definition. Consults entity and command
  lifecycle events to refuse removal while any entity (via a property
  handler) or any command (via `publishes`) in the same context still
  references the name.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: event-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed to check for inbound references
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to check for inbound references via `publishes`
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: An event-definition currently goes by this name in this context.
  - name: no-inbound-references
    rule: |
      No entity-definition currently in the context names this
      event-definition in a property handler, and no
      command-definition in the context names it in `publishes`.
      References are read from the latest body of each live
      definition.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-event-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-addition
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - event-definition-added
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: update-event-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-update
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - event-definition-updated
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-event-definition
description: |
  Renames an event-definition. Atomically emits the rename event plus
  one `entity-definition-updated` for every entity with a property
  handler naming `previous-name`, and one
  `command-definition-updated` for every command whose `publishes`
  listed `previous-name`. The DCB's wide consult surface (entities and
  commands in addition to event-definitions) is what makes this single
  append correct.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-rename
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
publishes:
  - event-definition-renamed
  - entity-definition-updated
  - command-definition-updated
constraints:
  - name: rewrite-entity-references
    rule: |
      Emit exactly one `entity-definition-updated` for every
      entity-definition currently in the context with at least one
      property handler whose `event` equals `previous-name`, with
      every occurrence replaced by `name`. Emit nothing for entities
      that do not handle the renamed event.
  - name: rewrite-command-references
    rule: |
      Emit exactly one `command-definition-updated` for every
      command-definition currently in the context whose `publishes`
      list named the event under `previous-name`, with the entry
      replaced by `name`. Emit nothing for commands that did not
      reference the renamed event.
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-event-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-removal
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
publishes:
  - event-definition-removed
actors:
  - modeler
