# Event definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name` (the natural key).
# Referenced by projection definitions; references resolve by name,
# so renames atomically rewrite referencing projections.

apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        The event-definition's authored content (payload schema,
        description, tags, etc.). Kept opaque here — the schema for
        a `body` is the DCB Context schema this playground edits,
        which is the subject of the tool, not of this domain model.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: event-definition-removed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-addition
description: |
  Guards the addition of a new event-definition. Parameterised by
  context id and the candidate name; consults the context lifecycle
  (must be active) and prior event-definition lifecycle events for
  the same name (must not currently identify a live definition).
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: event-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: |
      No event-definition currently goes by this name in this
      context — folding the consulted add/rename/remove events
      yields no live definition with this name.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-update
description: |
  Guards body updates to an existing event-definition (name
  unchanged). Same consult surface as `event-definition-addition`;
  the invariant flips to "the name *is* currently in use".
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: event-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: |
      An event-definition currently goes by this name in this
      context — the consult history resolves to a live definition.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-rename
description: |
  Guards renaming an event-definition. Parameterised by the context
  id, the previous name and the new name. In addition to the
  event-definition lifecycle, the DCB consults all projection
  lifecycle events for the context, so the triggering command can
  emit the reference-rewrite events for every projection currently
  referencing `previous-name` in one atomic append.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context — needed to find references to rewrite
  - boundedContext: dcb-context-authoring
    event: projection-definition-updated
    criteria: every projection-definition update in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-renamed
    criteria: every projection-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: An event-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No event-definition currently goes by `name` in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: event-definition-removal
description: |
  Guards removal of an event-definition. Consults projection
  lifecycle events to refuse removal while any projection in the
  same context still references the name.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: event-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `event-definition-name`
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context — needed to check for inbound references
  - boundedContext: dcb-context-authoring
    event: projection-definition-updated
    criteria: every projection-definition update in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: An event-definition currently goes by this name in this context.
  - name: no-inbound-references
    rule: |
      No projection-definition currently in the context references
      this event-definition by name. References are read from the
      latest body of each live projection.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-event-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-addition
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - event-definition-added
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: update-event-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-update
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - event-definition-updated
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-event-definition
description: |
  Renames an event-definition. Atomically emits the rename event
  plus one `projection-definition-updated` for every projection
  whose body referenced `previous-name`, with the reference
  rewritten to `name`. The DCB's wide consult surface (projections
  in addition to event-definitions) is what makes this single
  append correct.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-rename
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
publishes:
  - event-definition-renamed
  - projection-definition-updated
constraints:
  - name: rewrite-projection-references
    rule: |
      Emit exactly one `projection-definition-updated` for every
      projection-definition currently in the context whose body
      references the event-definition under `previous-name`, with
      every occurrence of `previous-name` replaced by `name`. Emit
      no `projection-definition-updated` for projections that do
      not reference the renamed event-definition.
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-event-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: event-definition-removal
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
publishes:
  - event-definition-removed
actors:
  - modeler
