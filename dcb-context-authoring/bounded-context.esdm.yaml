apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: dcb-context-authoring
description: |
  The editing surface of the playground. Modelers create, edit, rename
  and delete DCB Contexts and the five kinds of definitions inside
  them; viewers inspect a context without changing it. The companion
  testing surface (scenarios, runs, assertions) is planned as a
  separate bounded context and is out of scope here.
scope:
  domain: dcb-playground
ubiquitousLanguage:
  - term: DCB Context
    definition: |
      The complete authoring artifact a modeler builds — a named
      container of custom-type, event, entity, projection and command
      definitions describing one DCB-based system. Identified by a
      generated id; its name is a mutable display attribute.
  - term: Entity Definition
    definition: |
      A modeled thing with an identity, a lifecycle status and a set of
      projected properties. The organising unit of a DCB Context:
      every projection in the context belongs to exactly one entity.
      References event definitions (through its property handlers),
      custom-type definitions and other entities (through its property
      types); referenced in turn by event definitions, command
      definitions and other entities.

      An entity is *projected state, not a consistency boundary*. It
      holds no invariants, handles no commands and decides nothing on
      its own — it is a named identity plus everything the events say
      about it. Every decision is made by a command, over the
      instances it binds in its boundary.
    avoid:
      - term: Aggregate
        reason: |
          An aggregate owns a consistency boundary and enforces its
          own invariants; an entity here does neither. Dissolving the
          fixed aggregate is the whole point of DCB — the boundary is
          dynamic and belongs to the command. Calling these aggregates
          invites exactly the wrong mental model, and invites reaching
          for aggregate colours and conventions when modeling them.
      - term: Read Model
        reason: |
          Both are folds over events, but a read model serves queries
          on the outside of the system, while an entity's properties
          are consulted to make a write decision inside a command's
          boundary. Keeping them distinct keeps the DCB story clear.
  - term: Derived Type
    definition: |
      One of the two types an entity brings into existence without
      anyone declaring them — `<Entity>Id` and `<Entity>Status`. Never
      stored: both are computed from the entity definition and
      resolved in the same namespace as custom types, which is why
      adding a custom type and adding an entity can collide.
  - term: Entity Property
    definition: |
      One projection belonging to an entity. Folds the events it
      handles over the entity's instance — the partition is the
      entity's identifier and is never authored. Carries an initial
      value and a handler per event type.
    avoid:
      - term: Projection
        reason: |
          There is no longer a free-standing projection kind. Saying
          "property" keeps the entity as the unit a modeler thinks in,
          while "the property is a projection" stays true underneath.
  - term: Status
    definition: |
      The reserved property every entity has, typed `<Entity>Status`.
      Always present, never removable or renameable; its initial value
      is the first declared status member. Defaults to the two members
      `NonExistent` and `Existent`, which modelers extend (`Archived`)
      or rename to fit the domain.
  - term: Tag
    definition: |
      The DCB tag an event carries. Derived, never declared: an event
      property typed with an entity identifier makes the event carry
      that entity's tag, so an event may carry several.
  - term: Custom Type Definition
    definition: |
      A user-declared *value* type, in one of two forms: **scalar** (a
      pattern-constrained string, a money amount) or **composite** (a
      record of named, typed fields). Never a tag itself — tags come
      from entity identifiers alone — but a composite may *hold* one,
      and then tag derivation reaches through it, so an event property
      typed with a list of composites carries one tag per element.
      Referenced by event, entity and command definitions through their
      property types, by projection definitions through the type they
      hold, and by other custom type definitions through composite
      field types.
    avoid:
      - term: Struct
        reason: |
          Names the shape and loses the point. What matters about a
          composite is that it is still a *value* — it has no identity,
          no lifecycle and no projection — while being able to carry an
          identifier that tags the events it rides on.
  - term: Composite Field
    definition: |
      One named, typed field of a composite custom type. Always
      singular, always required, and never itself composite. Those
      restrictions are not stylistic: they are what keeps a list of
      composites the same length as the bindings fanned out over it,
      which is what makes zipping mean anything.
  - term: Feature
    definition: |
      A named group of commands — "Course management", "Checkout" — used
      to organise a context for the people reading it.

      The one thing a command carries that the modelled system does not
      read: no query, boundary, condition or tag depends on it. It is
      never declared as a definition of its own; it exists because
      commands name it, which is why it costs nothing and why an empty
      one cannot be stored, only remembered until it earns a command.
    avoid:
      - term: Bounded Context
        reason: |
          A feature groups commands for presentation inside one DCB
          Context. It draws no boundary, owns no language and has no
          consistency meaning — borrowing the term would imply all
          three.
      - term: Module
        reason: |
          Implies a unit of code or deployment. A feature is a label on
          commands and nothing more.
  - term: Event Definition
    definition: |
      A domain event modeled inside a DCB Context. Its property types
      determine both its payload and its tags. Referenced by entity
      definitions (a property handler names the event it folds), by
      command definitions (in their `publishes` lists) and by
      projection definitions (a handler names the event it folds).
  - term: Projection Definition
    definition: |
      One folded value belonging to no entity — a course numbering, a
      running total, the set of addresses already registered. Declares
      the type and shape of its value, the value it starts from, and
      the handlers that fold events into it: an entity property with
      the owning entity taken away.

      What replaces that owner is `parameters`. Each is typed with an
      entity's derived identifier, and the arguments a command supplies
      for them are the tags of the projection's query. Declare none and
      the query carries no tag at all — which is what a global
      numbering is, and the only tagless query in a DCB Context.

      Referenced only by command definitions, through the boundary
      bindings that read it; derives no type, so its name occupies a
      namespace of its own.
    avoid:
      - term: Sequence
        reason: |
          The kind this one replaced, and the name is what went wrong
          with it. Calling it a sequence made numbering a concept in
          the language, which forced "numbering is global by nature"
          into the design — and that is false: a numbering per tenant
          is an ordinary thing to want. Numbering is now one use of a
          general fold, expressed by a `successor` operand and nothing
          else.
      - term: Read Model
        reason: |
          Carries CQRS baggage — a queryable store, kept up to date
          asynchronously, read by a user interface. A projection here
          is read inside a decision, synchronously, and its query
          becomes part of the append condition that guards the write.
      - term: Singleton Entity
        reason: |
          Modeling a global numbering as an entity with one instance
          was an earlier design still. It forced a synthetic tag onto
          every event that advanced it, and made the entity a thing
          with an identity nobody means. A projection is not a thing in
          the domain; it is a value derived from events.
  - term: Command Definition
    definition: |
      An intent a modeler may issue against the modeled system. Has a
      payload (properties), a boundary, inline conditions over the
      bound instances, and the events it publishes on success. Not
      referenced by anything; commands are leaves on the reference
      graph.
  - term: Boundary
    definition: |
      Everything a command reads, each under a local alias — entity
      instances and projections alike. *This is the command's dynamic
      consistency boundary*, with nothing contributed from outside it:
      the append condition's query is the union of the bindings'
      queries, an entity binding contributing its tag restricted to the
      event types the conditions reach through, a projection binding
      contributing its arguments as tags and the types it folds.
      Rendered on the command so the DCB is visible rather than
      inferred.

      Declaration order is a *chain*: a binding may draw an operand
      from a binding above it, never from one below, so a command can
      read one thing to learn which thing to read next. The chain reads
      in rounds but decides as of one point: the position of the last
      event overall is taken first, every read is bounded at it, and
      the append condition carries the union of the bindings' queries
      after that same position. Anything the command looked at that
      changed under it invalidates the append, and nothing else does.
  - term: Round
    definition: |
      One trip to the event store while a command resolves its
      boundary. A binding waits only for the bindings it actually
      references, so a command's round count is the *depth* of that
      dependency graph and not the length of its boundary: two bindings
      taking their identifiers from the payload resolve together.

      Never authored. It is computed from the operands already
      written — `1 + max(round of the bindings this one names)` — and
      exists to be shown, so that a command needing three reads before
      it can decide says so on the page. Deriving it also keeps it
      honest about shape: `id`, `excluding`, `asOf` and a projection's
      arguments may each name a different binding, so the dependencies
      form a graph, and a binding with two parents has no place in a
      written hierarchy without being duplicated.
  - term: Alias
    definition: |
      The local name a command gives one thing it reads — an entity
      instance or a projection (`course`, `sourceCourse`,
      `courseNumbering`). Defaults to the entity or projection name
      with a lowercased initial; an explicit alias is needed only when
      one command binds two instances of the same entity. Local to its
      command, so renaming an entity never rewrites an alias, and
      renaming an alias never reaches outside the command — though it
      does move every operand within it that named the old one.
  - term: Member
    definition: |
      A named part of a definition's body: an entity's properties and
      statuses, an event's properties, a command's payload entries, a
      composite's fields, a projection's parameters.

      Members are referenced by name exactly as definitions are — a
      condition names a property, a handler names an event property, a
      binding supplies a projection's parameter by key — so renaming
      one rewrites those references in the same append. It cannot be
      done as an ordinary body update: mid-rename the old name is gone
      while something still reads it, which is precisely what the
      inbound-reference guards refuse.

      Unlike a definition rename there is no `-renamed` event. A member
      lives inside a body, so the whole thing is `<kind>-updated`
      events — one for the owner, one for each definition that
      referred to it.

      Scope follows the reference, not the spelling: two entities may
      each declare a status called `Existent`, and renaming one leaves
      the other alone.
  - term: Condition
    definition: |
      A structured predicate over operands, inlined into the command
      that checks it. All of a command's conditions must hold before
      any event is emitted. Conditions are not reusable: duplication
      across commands is accepted in exchange for removing the
      indirection of a separate constraint kind.
  - term: Fan-out
    definition: |
      What a binding does when its identifier operand is a list: it
      covers one instance per element, contributing one query item
      each. Never declared — it follows from the operand's type. A list
      read off an already-plural alias is a list of lists, which
      flattens; `excluding` drops one identifier from the set, which
      narrows the binding rather than the conditions.

      A condition reading a plural alias must hold for *every* instance
      it bound, vacuously so when the set is empty. The quantifier is
      not written down either, for the same reason. A plural alias can
      therefore be checked but never emitted — it has no single value
      to give.
  - term: Operand
    definition: |
      Where a value comes from. Inside a command: a payload property,
      an alias property (`course.capacity`), a bound projection's value
      (`courseNumbering`, with no property — it has only one), an enum
      member, or a literal. Inside a property handler: a property of
      the event being folded, the property's current value, the
      successor of another operand, an enum member, or a literal.
  - term: Write Coverage
    definition: |
      The rule that every entity-identifier property of every
      published event must resolve to a binding in the command's
      boundary — a command may not write a tag it did not consult.

      A value supplied from a projection binding is exempt when that
      projection folds the event being published: its query already
      covers every event that could have issued the value, and a
      freshly minted identifier has no history to consult. The
      exemption does not look at the partition — a projection scoped so
      narrowly that two partitions can mint the same identifier is a
      modelling error, and one this domain deliberately does not catch.
  - term: Definition
    definition: |
      Umbrella term for the five kinds above (custom-type, event,
      entity, projection, command). Used wherever a rule applies
      regardless of which kind is meant.
  - term: Reference
    definition: |
      A name-based pointer from one definition's body to another (e.g.
      an entity's property handler naming the event definition it
      folds). References resolve within the same DCB Context.
  - term: Modeler
    definition: The human author who issues all editing commands.
  - term: Viewer
    definition: The human consumer who reads, but does not change, a DCB Context.
    avoid:
      - term: Reader
        reason: |
          Overloaded with read-model terminology; "viewer" reads more
          naturally as an actor role and stays distinct from any
          read-side jargon.
