# Entity definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name` (the natural key).
#
# Distinctive aspects of this kind:
#   - an entity *derives* two type names, `<name>Id` and `<name>Status`,
#     which are never stored but do occupy the custom-type namespace;
#     addition and rename must therefore check those derived names for
#     collisions against custom-type-definitions as well.
#   - the reference graph is reflexive: one entity's property may be
#     typed with another entity's identifier (`subscribedStudentIds:
#     StudentId`), so entity lifecycle events appear on both sides of
#     the entity DCBs.
#   - references out: custom-type-definitions and entity-derived types
#     (property types), event-definitions (property handlers).
#     References in: event-definitions (property types),
#     command-definitions (boundary bindings, property types, enum
#     member references), projection-definitions (`valueType` and `parameters`),
#     custom-type-definitions (composite field types) and
#     other entity-definitions.

apiVersion: schema.esdm.io/core/v1
kind: event
name: entity-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        Authored content of the entity — identifier schema, status
        members, and the property projections (including the reserved
        `status` property) with their handlers. Body shape is owned by
        the DCB Context schema, not by this domain model.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: entity-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: entity-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: entity-definition-removed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: entity-definition-addition
description: |
  Guards the addition of a new entity-definition. Beyond the usual
  "context active + name not in use" checks it consults
  custom-type-definition lifecycle events — because the entity claims
  `<name>Id` and `<name>Status` in the shared type namespace — plus
  event-definition and entity-definition lifecycle events, so the
  outbound references in the new entity's body can be resolved in the
  same append.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: entity-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed both for the name check and to resolve cross-entity property types
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context — needed for the derived-name collision check and to resolve value-typed properties
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to resolve the handlers in the new entity's properties
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: No entity-definition currently goes by this name in this context.
  - name: derived-names-free
    rule: |
      Neither `<name>Id` nor `<name>Status` is currently claimed by a
      custom-type-definition in this context, nor derived by any other
      live entity-definition. The type namespace is shared between
      declared value types and derived entity types.
  - name: references-resolve
    rule: |
      Every type name used by the entity's properties resolves — to a
      simple type, a live custom-type-definition, or a type derived
      from a live entity-definition (including this one) — and every
      event named by a property handler is a live event-definition in
      this context.
  - name: status-property-well-formed
    rule: |
      The body declares at least two distinct status members, and its
      properties contain exactly one entry named `status`, typed
      `<name>Status`, neither optional nor a list, never scripted, whose
      `initialValue` names the first declared status member. It is the
      one reading every condition and every derived boundary depends
      on, so it stays something the tooling can make without running
      anything.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: entity-definition-update
description: |
  Guards body updates to an existing entity-definition — changing the
  identifier schema, the status members, or the property projections.
  Same consult surface as addition (outbound references must still
  resolve, derived names must still be free of *other* claimants); the
  uniqueness check flips to "definition exists".

  Removing a status member is an update like any other, so the DCB also
  consults command lifecycle events: a command's condition may hold an
  enum-member reference to the member being dropped.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: entity-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to check inbound property and enum-member references against the updated body
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: An entity-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every type name used by the updated properties resolves, and
      every event named by a property handler is a live
      event-definition in this context.
  - name: status-property-well-formed
    rule: |
      The updated body still declares at least two distinct status
      members and still carries the reserved `status` property, typed
      `<name>Status`, neither optional nor a list, never scripted, whose
      `initialValue` names the first declared status member.
  - name: inbound-references-survive
    rule: |
      Every property and status member that a live command-definition
      still references — through an alias-property operand or an
      enum-member operand resolving to this entity — is still present
      in the updated body. Dropping a referenced property or status
      member is refused rather than silently breaking the command.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: entity-definition-rename
description: |
  Guards renaming an entity-definition. The blast radius is the widest
  in the model, because a rename changes the entity's *derived type
  names* as well as its own: every event-definition property typed
  `<previous-name>Id`, every other entity's property typed the same
  way, every composite custom-type-definition with a *field* typed the
  same way, and every command binding the entity in its boundary must
  be rewritten in the same atomic append. The new derived names must
  also be free.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed for the name checks and to find cross-entity references to rewrite
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context — the new derived names must not collide, and composite fields typed with a derived name must be rewritten
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-updated
    criteria: every custom-type-definition update in this context — composite fields are read from the latest body
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to find property types to rewrite
  - boundedContext: dcb-context-authoring
    event: event-definition-updated
    criteria: every event-definition update in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to find boundary bindings and property types to rewrite
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: every command-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context — a projection's `valueType` or a `parameters` entry may name a derived type
  - boundedContext: dcb-context-authoring
    event: projection-definition-updated
    criteria: every projection-definition update in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: An entity-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No entity-definition currently goes by `name` in this context.
  - name: new-derived-names-free
    rule: |
      Neither `<name>Id` nor `<name>Status` is currently claimed by a
      custom-type-definition or derived by another live
      entity-definition in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: entity-definition-removal
description: |
  Guards removal of an entity-definition. Refuses while anything still
  references the entity or either of its derived types: an event
  property typed `<name>Id`, another entity's property typed the same
  way, a command binding it in its boundary, or a projection holding
  `<name>Id` as its `valueType` or taking it as a parameter.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: entity-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed for the existence check and to detect cross-entity references
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to check for inbound references via property types
  - boundedContext: dcb-context-authoring
    event: event-definition-updated
    criteria: every event-definition update in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: every command-definition added in this context — needed to check for inbound references via boundary bindings and property types
  - boundedContext: dcb-context-authoring
    event: command-definition-updated
    criteria: every command-definition update in this context
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context — a projection's `valueType` or a `parameters` entry may name a derived type
  - boundedContext: dcb-context-authoring
    event: projection-definition-updated
    criteria: every projection-definition update in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context — a composite's field may be typed with a derived type
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-updated
    criteria: every custom-type-definition update in this context — fields are read from the latest body
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: An entity-definition currently goes by this name in this context.
  - name: no-inbound-references
    rule: |
      No live event-definition has a property typed `<name>Id` or
      `<name>Status`, no other live entity-definition has such a
      property, no live composite custom-type-definition has a *field*
      typed either way, no live command-definition binds this entity in
      its boundary or types a payload property with either derived
      type, no live projection-definition holds either as its
      `valueType`, and none takes `<name>Id` as a parameter.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-entity-definition
description: |
  Adds an entity. The body is expected to arrive complete — including
  the reserved `status` property seeded with the first status member as
  its initial value — because the DCB checks the reserved slot as part
  of the same append.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: entity-definition-addition
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - entity-definition-added
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: update-entity-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: entity-definition-update
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
publishes:
  - entity-definition-updated
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-entity-definition
description: |
  Renames an entity. Atomically emits the rename event plus the
  rewrites for every definition that referenced the entity or its
  derived types under the previous name.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: entity-definition-rename
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
publishes:
  - entity-definition-renamed
  - entity-definition-updated
  - event-definition-updated
  - command-definition-updated
  - projection-definition-updated
  - custom-type-definition-updated
constraints:
  - name: rewrite-event-references
    rule: |
      Emit exactly one `event-definition-updated` for every
      event-definition currently in the context with a property typed
      `<previous-name>Id` or `<previous-name>Status`, with the type
      rewritten to the corresponding new derived name.
  - name: rewrite-composite-field-references
    rule: |
      Emit exactly one `custom-type-definition-updated` for every
      composite custom-type-definition currently in the context with a
      *field* typed `<previous-name>Id` or `<previous-name>Status`, with
      the type rewritten. Without this a composite would keep naming a
      type nothing derives any more — and because a composite's
      identifier fields are what make events carrying it tagged, the
      break would surface as an event silently losing its tags.
  - name: rewrite-cross-entity-references
    rule: |
      Emit exactly one `entity-definition-updated` for every *other*
      entity-definition currently in the context with a property typed
      `<previous-name>Id` or `<previous-name>Status`, with the type
      rewritten. The renamed entity's own body is carried by the
      rename event, not by an update.
  - name: rewrite-command-references
    rule: |
      Emit exactly one `command-definition-updated` for every
      command-definition currently in the context that binds
      `previous-name` in its boundary or types a payload property with
      either derived name, with every occurrence rewritten. Alias names
      are left untouched — an alias is local to its command and carries
      no reference to the entity name.
  - name: rewrite-projection-value-types
    rule: |
      Emit exactly one `projection-definition-updated` for every
      projection-definition currently in the context whose `valueType` is
      `<previous-name>Id` or `<previous-name>Status`, or one of whose
      parameters is typed `<previous-name>Id`, rewritten to the
      corresponding new derived name.
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-entity-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
  dynamicConsistencyBoundary: entity-definition-removal
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
publishes:
  - entity-definition-removed
actors:
  - modeler
