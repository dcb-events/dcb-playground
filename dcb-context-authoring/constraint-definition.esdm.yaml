      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: constraint-definition-addition
description: |
  Guards the addition of a new constraint-definition. Consults
  projection-definition lifecycle so the referential-integrity
  invariant ("every referenced projection name exists") holds at
  append time.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: constraint-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context — needed to resolve outbound references
  - boundedContext: dcb-context-authoring
    event: projection-definition-renamed
    criteria: every projection-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: No constraint-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every projection-definition name referenced from the new
      constraint's body currently exists in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: constraint-definition-update
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: constraint-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-renamed
    criteria: every projection-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A constraint-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every projection-definition name referenced from the updated
      body currently exists in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: constraint-definition-rename
description: |
  Guards renaming a constraint-definition. Constraints are a leaf
  on the reference graph — nothing references them — so the consult
  surface stays narrow (just the constraint's own lifecycle plus
  the context lifecycle); no rewrite of other definitions is needed.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A constraint-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No constraint-definition currently goes by `name` in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: constraint-definition-removal
description: |
  Guards removal of a constraint-definition. No inbound-reference
  check is needed (nothing references constraints); only the
  context-active + definition-exists invariants apply.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: constraint-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `constraint-definition-name`
  - boundedContext: dcb-context-authoring
    event: constraint-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `constraint-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A constraint-definition currently goes by this name in this context.
---
