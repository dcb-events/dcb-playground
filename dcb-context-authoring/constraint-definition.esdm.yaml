# Constraint definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name`.
# References projection-definitions; is not referenced by anything,
# so removal does not need an inbound-reference check and rename
# does not need to rewrite anything elsewhere.

apiVersion: schema.esdm.io/core/v1
kind: event
name: constraint-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        Authored content of the constraint — including the names of
        projection-definitions it references.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: constraint-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: constraint-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: constraint-definition-removed
scope:
  domain: dcb-playground
