apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-rename
description: |
  Guards renaming a command-definition. Commands are leaves, so no
  rewrite events follow: the consult surface is just the context
  lifecycle plus this kind's own lifecycle for both names.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A command-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No command-definition currently goes by `name` in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-removal
description: |
  Guards removal of a command-definition. Nothing references a
  command, so there is no inbound-reference check — only that the
  context is active and the definition is live.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A command-definition currently goes by this name in this context.
---
