---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-addition
description: |
  Guards the addition of a new command-definition. Consults the
  custom-type, entity and event lifecycles so every outbound reference
  in the new body — property types, boundary bindings, alias
  properties, enum members and published events — can be resolved in
  the same append.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context — needed to resolve boundary bindings, alias properties and enum members
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context — the property and state lists come from the latest body
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to resolve `publishes` and to derive the tags each emission writes
  - boundedContext: dcb-context-authoring
    event: event-definition-updated
    criteria: every event-definition update in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: No command-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every payload property type resolves; every `entity` named in a
      boundary binding is a live entity-definition; every event named
      in `publishes` is a live event-definition.
  - name: aliases-well-formed
    rule: |
      Boundary aliases are unique within the command, and every
      alias-property operand names a bound alias together with a
      property that the aliased entity currently declares.
  - name: enum-members-resolve
    rule: |
      Every enum-member operand names a state member declared by the
      entity it is compared against.
  - name: write-coverage
    rule: |
      For every published event, each of its properties typed with an
      entity identifier is bound to an operand that resolves to a
      boundary binding of that same entity. A command may not write a
      tag it did not consult.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-update
description: |
  Guards body updates to an existing command-definition. Identical
  consult surface and reference invariants as addition; the uniqueness
  check flips to "definition exists".
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-updated
    criteria: every event-definition update in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A command-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every payload property type resolves; every `entity` named in a
      boundary binding is a live entity-definition; every event named
      in `publishes` is a live event-definition.
  - name: aliases-well-formed
    rule: |
      Boundary aliases are unique within the command, and every
      alias-property operand names a bound alias together with a
      property that the aliased entity currently declares.
  - name: enum-members-resolve
    rule: |
      Every enum-member operand names a state member declared by the
      entity it is compared against.
  - name: write-coverage
    rule: |
      For every published event, each of its properties typed with an
      entity identifier is bound to an operand that resolves to a
      boundary binding of that same entity.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-rename
description: |
  Guards renaming a command-definition. Commands are leaves, so no
  rewrite events follow: the consult surface is just the context
  lifecycle plus this kind's own lifecycle for both names.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A command-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No command-definition currently goes by `name` in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-removal
description: |
  Guards removal of a command-definition. Nothing references a
  command, so there is no inbound-reference check — only that the
  context is active and the definition is live.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A command-definition currently goes by this name in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-command-definition
scope:
