# Command definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name`.
#
# Commands are leaves on the reference graph — nothing references a
# command — but they have the widest outbound surface of any kind:
#   - custom-type-definitions and entity-derived types, via the payload
#     property types;
#   - entity-definitions, via the boundary bindings, the alias-property
#     operands in conditions and emissions, and the enum-member
#     operands naming a state;
#   - event-definitions, via `publishes`.
#
# A command's `boundary` *is* its dynamic consistency boundary: the
# bound instances supply the tags of the append condition's query. The
# write-coverage invariant below is what keeps that honest.

apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        Authored content of the command — payload properties, boundary
        bindings, inline conditions and event emissions. Body shape is
        owned by the DCB Context schema, not by this domain model.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
