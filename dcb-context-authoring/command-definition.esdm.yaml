# Command definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name`.
# References custom-type-definitions (via properties), event-definitions
# (via publishes), constraint-definitions (via constraints), and
# projection-definitions (via projection-result operands inside parameter
# bindings). Not referenced by anything — commands are leaves on the
# reference graph, so rename and removal stay narrow (no rewrite of
# referencers, no inbound-reference check).

apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        Authored content of the command — the payload properties, the
        list of constraint references that form its DCB consult
        surface (each optionally negated and with parameter bindings),
        and the list of event emissions with their parameter bindings.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-context-id, previous-name, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-removed
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
  required: [dcb-context-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-addition
description: |
  Guards the addition of a new command-definition. Consults the four
  referenced families' lifecycle events so the
  references-resolve invariant ("every referenced custom-type,
  event, constraint and projection name exists") holds at append
  time.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context — needed to resolve property-type references
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context — needed to resolve publishes references
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: constraint-definition-added
    criteria: every constraint-definition added in this context — needed to resolve constraint references
  - boundedContext: dcb-context-authoring
    event: constraint-definition-renamed
    criteria: every constraint-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: constraint-definition-removed
    criteria: every constraint-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context — needed to resolve projection-result operands inside parameter bindings
  - boundedContext: dcb-context-authoring
    event: projection-definition-renamed
    criteria: every projection-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: name-not-in-use
    rule: No command-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every referenced name resolves to a live definition in this
      context: custom-type-definitions named by property types,
      event-definitions named in `publishes`, constraint-definitions
      named in `constraints`, and projection-definitions named by
      `projectionName` in any parameter-binding operand.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-update
description: |
  Guards body updates to an existing command-definition. Same wide
  consult surface as `command-definition-addition`; the uniqueness
  check flips to "definition exists".
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-added
    criteria: every event-definition added in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: constraint-definition-added
    criteria: every constraint-definition added in this context
  - boundedContext: dcb-context-authoring
    event: constraint-definition-renamed
    criteria: every constraint-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: constraint-definition-removed
    criteria: every constraint-definition removal in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-renamed
    criteria: every projection-definition rename in this context
  - boundedContext: dcb-context-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this context
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A command-definition currently goes by this name in this context.
  - name: references-resolve
    rule: |
      Every referenced name resolves to a live definition in this
      context (same conditions as on `command-definition-addition`).
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-rename
description: |
  Guards renaming a command-definition. Commands are leaves on the
  reference graph — nothing references them — so the consult surface
  stays narrow (just the command's own lifecycle plus the context
  lifecycle); no rewrite of other definitions is needed.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` whose `name` equals `previous-name` or `name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A command-definition currently goes by `previous-name` in this context.
  - name: new-name-free
    rule: No command-definition currently goes by `name` in this context.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: command-definition-removal
description: |
  Guards removal of a command-definition. No inbound-reference check
  is needed (nothing references commands); only the context-active
  + definition-exists invariants apply.
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
identifiedBy:
  - name: dcb-context-id
    source: command-payload
    field: dcb-context-id
  - name: command-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-context-authoring
    event: dcb-context-created
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: dcb-context-deleted
    criteria: events whose `dcb-context-id` matches this instance's `dcb-context-id`
  - boundedContext: dcb-context-authoring
    event: command-definition-added
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-renamed
    criteria: events with matching `dcb-context-id` whose new `name` or `previous-name` equals this instance's `command-definition-name`
  - boundedContext: dcb-context-authoring
    event: command-definition-removed
    criteria: events with matching `dcb-context-id` and `name` equal to this instance's `command-definition-name`
invariants:
  - name: context-active
    rule: The context has been created and has not been deleted.
  - name: definition-exists
    rule: A command-definition currently goes by this name in this context.
---
