# Command definitions inside a DCB Context: events, DCBs, commands.
# Identified within the context by `name`.
#
# Commands are leaves on the reference graph — nothing references a
# command — but they have the widest outbound surface of any kind:
#   - custom-type-definitions and entity-derived types, via the payload
#     property types;
#   - entity-definitions, via the boundary bindings, the alias-property
#     operands in conditions and emissions, and the enum-member
#     operands naming a status;
#   - event-definitions, via `publishes`;
#   - projection-definitions, via the boundary bindings that read them.
#
# A command's `boundary` *is* its dynamic consistency boundary, and
# holds every read: an entity binding supplies a tag, a projection
# binding supplies its arguments as tags — none at all when the
# projection has no parameters — plus the types it folds. Nothing
# contributes a query from outside this list. The write-coverage
# invariant below is what keeps that honest.
#
# Declaration order in the boundary is a chain — a binding may draw an
# operand from a binding above it — and an entity binding whose
# identifier is a list covers one instance per element. How many round
# trips that costs is the depth of the resulting dependency graph, and
# is derived rather than authored: it is a rendering concern, so this
# domain stores the flat list and nothing else.

apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-context-authoring
data:
  type: object
  properties:
    dcb-context-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        Authored content of the command — payload properties, boundary
        bindings, inline conditions and event emissions. Body shape is
        owned by the DCB Context schema, not by this domain model.
  required: [dcb-context-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: command-definition-updated
scope:
  domain: dcb-playground
