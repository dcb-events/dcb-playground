  if ((entity.properties || []).some((p) => p.name === merged && !taken.includes(p.name))) {
    return toast(`${readable(entityName)} already has a property "${merged}".`, true);
  }
  const mergedProjection = projectionNameFor(model, entityName, merged);
  // The states a boolean absorbed at `index` was true in: that step's
  // own state and every one after it.
  const statesWhereHeld = (index) => states.slice(index + 1);
  const asOperand = (list) => (list.length === 1
    ? { predicate: 'equals', rightHandSide: { enumMember: list[0] } }
    : { predicate: 'equalsAny', rightHandSide: list.map((name) => ({ enumMember: name })) });

  const partition = (model_, name, index) => {
    const { projection } = entityPropertyTarget(model_, entityName, name);
    const lifecycleView = {
      property: name, isBoolean: true, states: ['false', 'true'],
    };
    return { projection, lifecycleView, held: statesWhereHeld(index) };
  };

  return run(() => {
    addDefinition('custom-type-definition', model.id, type,
      { schema: { type: 'string', enum: states } });

    // The merged fold: the first absorbed boolean's partition (they all
    // share it — an entity property is partitioned by the entity's own
    // identifier), and one handler per absorbed boolean's setters.
    const first = taken.length ? entityPropertyTarget(model, entityName, taken[0]).projection : null;
    const handlers = [];
    rows.forEach((row, index) => {
      if (!row.from) return;
      const { projection } = entityPropertyTarget(model, entityName, row.from);
      for (const handler of projection.handlers || []) {
        if (!handler || !handler.event) continue;
        handlers.push({
          event: handler.event, operation: 'set',
          value: { enumMember: states[index + 1] },
        });
      }
    });
    addDefinition('projection-definition', model.id, mergedProjection, {
      parameters: first ? deepClone(first.parameters)
        : [{ name: defaultAlias(entityName) + 'Id', propertyType: idTypeOf(model, entityName) }],
      valueType: type,
      isList: false,
      initialValue: { enumMember: states[0] },
      handlers,
    });

    // The entity: the absorbed properties go, the merged one arrives
    // where the first of them was, and it is designated.
    const body = deepClone(activeModel()['entity-definitions'][entityName]);
    const at = (body.properties || []).findIndex((p) => taken.includes(p.name));
    body.properties = (body.properties || []).filter((p) => !taken.includes(p.name));
    const entry = { name: merged, projection: mergedProjection };
    if (at >= 0) body.properties.splice(at, 0, entry); else body.properties.push(entry);
    body.lifecycle = merged;
    updateDefinition('entity-definition', model.id, entityName, body);

    // Every rule that named an absorbed boolean, retyped against the
    // states that boolean was true in.
    for (const [commandName, commandBody] of Object.entries(activeModel()['command-definitions'])) {
      const aliases = (commandBody.boundary || [])
        .filter((b) => b && b.entity === entityName).map((b) => b.alias);
      if (!aliases.length) continue;
      const next = deepClone(commandBody);
      let touched = false;
      const retype = (condition) => {
        const operand = condition.leftHandSide;
        if (operandSource(operand) !== 'alias-property') return;
        if (!aliases.includes(operand.alias)) return;
        const index = absorbed.indexOf(operand.property);
        if (index < 0) return;
        const view = { property: operand.property, isBoolean: true, states: ['false', 'true'] };
        const allowed = lifecycleAllowedStates(condition, view, condition.rightHandSide);
        if (!allowed || allowed.length !== 1) return;
        const held = statesWhereHeld(index);
        const list = allowed[0] === 'true' ? held : states.filter((n) => !held.includes(n));
        if (!list.length) return;
        operand.property = merged;
        delete condition.negate;
        Object.assign(condition, asOperand(list));
        touched = true;
      };
      for (const condition of next.conditions || []) retype(condition);
      for (const emission of next.publishes || []) {
        for (const condition of emission.when || []) retype(condition);
      }
      if (touched) updateDefinition('command-definition', model.id, commandName, next);
    }

    // The folds nothing binds or reads any more. Checked rather than
    // assumed: a projection an author also read directly from a command
    // stays, and the rule about it dangles visibly instead of vanishing.
    for (const name of taken) {
      const projectionName = entityPropertyTarget(model, entityName, name).binding.projection;
      if (projectionName === mergedProjection) continue;
      if (!findReferencers(activeModel(), 'projection-definition', projectionName).length) {
        removeDefinition('projection-definition', model.id, projectionName);
      }
    }
    return merged;
  });
}

// Adding a property from somewhere other than the entity's own page —
// wiring an event to something that does not exist yet. Same one
// gesture: the projection and the binding that names it, together.
function addEntityProperty(model, entityName, { name, valueType, isList }) {
  const propertyName = toCamel(name);
  const projectionName = projectionNameFor(model, entityName, propertyName);
  const body = blankProjectionDraft(model, entityName);
  body.valueType = valueType;
  body.isList = !!isList;
  body.initialValue = defaultInitialValue(model, body);
  return run(() => {
    addDefinition('projection-definition', model.id, projectionName, cleanProjectionBody(body));
    const entity = deepClone(activeModel()['entity-definitions'][entityName]);
    entity.properties = [...(entity.properties || []), { name: propertyName, projection: projectionName }];
    updateDefinition('entity-definition', model.id, entityName, entity);
    return propertyName;
  });
}

// The inline "the property I need does not exist yet" form, opened
// from a picker mid-gesture — a rule's left side, a change's target.
// Non-modal and in place on purpose: the command being defined stays
// on screen, and nothing here navigates.
//
// `entities` narrows the entity picker to the ones that make sense at
// the call site (a rule can only be about something the command
// reads). `onCreated(entity, propertyName)` is where the caller says
// what "continue where I was" means — typically selecting the thing
// that was just made, because nobody creates a property mid-rule for
// any other reason.
function newPropertyForm(model, { entities, onCreated } = {}) {
  const names = (entities || Object.keys(model['entity-definitions'])).sort();
  // `only` is the entity just created mid-gesture: the property is for
  // that one, so the picker starts there rather than alphabetically.
  const only = state.addingProp && state.addingProp.only;
  const draft = state.fieldDraft && state.fieldDraft.key === 'addingProp'
    ? state.fieldDraft
    : (state.fieldDraft = {
        key: 'addingProp', entity: names.includes(only) ? only : (names[0] || ''),
        name: '', propertyType: 'integer', isList: false,
      });
  const create = () => {
    state.addingProp = null;
    const created = addEntityProperty(model, draft.entity,
      { name: draft.name, valueType: draft.propertyType, isList: draft.isList });
    if (created && onCreated) { onCreated(draft.entity, created); render(); }
  };
  // The same leave-the-row rule as every other field adder: a named
  // property is created when attention moves elsewhere.
  draft.ready = () => !!draft.name.trim();
  draft.commit = create;
  return h('div', { class: 'inline-form' },
    h('div', { class: 'q' }, 'What else should we know, and about what?'),
    h('div', { class: 'adder' },
      pick(names.map((n) => [n, readable(n), entityIcon(model, n)]),
        draft.entity, (v) => { draft.entity = v; }),
      h('input', {
        type: 'text', placeholder: 'property name', value: draft.name,
        oninput: (e) => { draft.name = e.target.value; },
      }),
      pick(projectionTypeOptions(model), draft.propertyType, (v) => { draft.propertyType = v; }),
      h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: draft.isList,
          onchange: (e) => { draft.isList = e.target.checked; },
        }), ' many'),
      h('button', {
        class: 'btn primary', onclick: () => {
          if (!draft.name.trim()) return toast('Give it a name.', true);
          state.fieldDraft = null;
          create();
        },
      }, 'Add'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.fieldDraft = null; state.addingProp = null; render(); },
      }, 'Cancel')));
}

// The members of a string-only enum, wherever a property typed with it
// is shown — on the value type's own card, or inline on an entity's
// property. Renaming goes through the model, which rewrites every
// enum-member operand that resolves to *this* type; removing goes
// through the same guard an ordinary drop does, and refuses while a
// command still compares against the member.
function enumMemberChips(model, typeName) {
  const body = model['custom-type-definitions'][typeName];
  const members = (body && body.schema && body.schema.enum) || [];
  const where = 'member:' + typeName;
  // These chips also live inside an open projection row — an entity
  // property whose value is this enum — and that row is where the
  // member form is about to render. `closeForms` still runs for its
  // other half (committing pending edits, folding rival forms), but
  // the hosting row is put back: closing it would collapse the very
  // place the form appears, which read as the click doing nothing.
  const openHere = (mutate) => {
    const hostRow = state.projDraft;
    closeForms();
    state.projDraft = hostRow;
    mutate();
    render();
  };
  const chips = members.map((member) => {
    if (editingMember(where, member)) {
      return inlineForm({
        question: `Rename this member of ${readable(typeName)}`, submitLabel: 'Rename',
        value: readable(member), showsIdentifier: true,
        onSubmit: (v) => {
          const next = toPascal(v);
          state.editMember = null;
          if (next && next !== member) {
            run(() => renameMember('custom-type-definition', model.id, typeName, 'member', member, next));
          } else render();
        },
        onCancel: () => { state.editMember = null; render(); },
      });
    }
    return h('span', { class: 'chip', style: 'margin-right:3px' }, h('span', {
      class: 'editable', title: 'Rename this member',
      onclick: () => openHere(() => { state.editMember = { where, name: member }; }),
    }, readable(member)), h('button', {
      class: 'x', title: 'Remove this member',
      onclick: () => {
        if (members.length === 1) return toast('An enum needs at least one member.', true);
        run(() => updateDefinition('custom-type-definition', model.id, typeName,
          { ...body, schema: { ...body.schema, enum: members.filter((x) => x !== member) } }));
      },
    }, '×'));
  });
  chips.push(h('button', {
    class: 'btn tiny ghost',
    onclick: () => openHere(() => { state.addingMember = { type: typeName }; }),
  }, '+ member'));
  if (state.addingMember && state.addingMember.type === typeName && !state.addingMember.eventName) {
    chips.push(addEnumMemberForm(model, typeName));
  }
  return chips;
}

// The "+ New member" form, shared between the enum's own card and
// wherever else a member is added inline (wiring a handler that sets
// one that does not exist yet).
function addEnumMemberForm(model, typeName) {
  const body = model['custom-type-definitions'][typeName];
  const members = (body && body.schema && body.schema.enum) || [];
  return inlineForm({
    question: `New member of ${readable(typeName)}`, placeholder: 'member name',
    showsIdentifier: true,
    onSubmit: (v) => {
      const member = toPascal(v);
      state.addingMember = null;
      run(() => updateDefinition('custom-type-definition', model.id, typeName,
        { ...body, schema: { ...body.schema, enum: [...members, member] } }));
    },
    onCancel: () => { state.addingMember = null; render(); },
  });
}


// The template rendering a tag-marked custom type's value into its tag
// — `{type}` and `{value}`, in whichever order it states them. Unlike
// the type's own name, changing this never moves a reference — it
// changes what an event carrying it writes as its tag, not what
// anything is called — so it goes through `patch` like any other
// field.
function tagSchemaField(name, body) {
  const current = body.tagSchema || '{type}:{value}';
  return h('div', { class: 'irow' },
    h('span', { class: 'nm' }, 'tag schema'),
    h('input', {
      type: 'text', class: 'mono', value: current, style: 'width:16ch',
      title: 'Renders the value into a tag — interpolates {type} and {value}',
      onblur: (e) => {
        const text = e.target.value.trim() || '{type}:{value}';
        if (text === current) return;
        patch('custom-type-definition', name, (b) => { b.tagSchema = text; });
      },
      onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
    }));
}

// ---------- one thing, on its own page ----------
//
// A thing is opened from the rail, or from any mention of it anywhere,
// and it gets the whole page. It used to get two: a manager listing
// every entity at once, and a panel that slid in over whatever you were
// reading — so the same thing was on screen twice, in two shapes,
// saying different amounts. One page, one shape.
//
// The page is in two parts, and the split is the point. What makes one
// of these one of these — the identifier every event about it is
// tagged with — is not something a modeler added, and it does not
// belong in the same list as "capacity". It sits above, in its own
// block. Everything below it, a lifecycle included, is what this model
// happens to know, and every row of that is a fold over events.

// The name a projection gets when it is created as an entity's
// property: `<Entity><Property>`, which is what anyone would have
// typed. Uniquified if that is taken — one projection may be bound by
// two properties, but only deliberately, by binding it rather than by
// a name collision deciding it for you.
function projectionNameFor(model, entityName, propertyName) {
  const base = entityName + toPascal(propertyName);
  if (!model['projection-definitions'][base]) return base;
  for (let i = 2; ; i++) if (!model['projection-definitions'][base + i]) return base + i;
}

// The entity page's own "+ new property" form.
//
// Adding a property is one gesture even though it writes two
// definitions: the projection that does the folding, and the binding
// that gives this entity a name for it. Making a modeler create the
// projection first and bind it second would be the architecture
// leaking into the common case — the whole point of the binding is
// that it is cheap, not that it is a step.
function entityPropertyAdder(model, entityName) {
  // The same row every other field list gets, with the same rule: a
  // named property is added the moment the row is left, button or no
  // button. `addEntityProperty` is what the button always did — the
  // projection, the binding, the derived name — so nothing about what
  // a property *is* changed hands here, only when it lands.
  return propertyAdder(model, {
    placeholder: 'property name', label: '+ Property',
    type: 'integer', types: projectionTypeOptions, offerOptional: false,
    draftKey: 'prop:' + entityName,
    onAdd: (property) => addEntityProperty(model, entityName, {
      name: property.name, valueType: property.propertyType, isList: property.isList,
    }),
  });
}

function renderEntity(model, main) {
  const name = state.entity;
  const entity = model['entity-definitions'][name];
  if (!entity) return;
  const properties = entity.properties || [];

  const readers = new Set();
  const writers = new Set();
  for (const property of properties) {
    const usage = propertyUsage(model, name, property.name);
    usage.readBy.forEach((c) => readers.add(c));
    usage.changedBy.forEach((u) => writers.add(u.command));
  }

  if (state.renamingEntity === name) {
    main.appendChild(h('header', {}, renameDefinitionForm(model, 'entity-definition', name, {
      stateKey: 'renamingEntity', after: (next) => { state.entity = next; },
    })));
  } else {
    main.appendChild(h('header', {},
      qrow('div', { cls: 'row', key: 'ent:' + name },
        // The mark leads, because it is what this thing will be
        // recognised by everywhere else. Clicking it is how it is
        // chosen — there is nowhere else to put a setting that belongs
        // to one entity and to nothing else.
        h('button', {
          class: 'icon-btn', title: 'Choose the mark this is shown with',
          onclick: () => {
            const open = state.iconPicker === name;
            closeForms();
            state.iconPicker = open ? null : name;
            render();
          },
        }, entityIcon(model, name)),
        h('div', { class: 'name' }, named(name)),
        h('span', { class: 'grow' }),
        reveal(
          h('button', {
            class: 'btn tiny',
            onclick: () => { closeForms(); state.renamingEntity = name; render(); },
          }, 'Rename'),
          removeButton('entity:' + name, {
            label: 'Remove', title: 'Remove this entity entirely',
            onRemove: () => run(() => {
              removeDefinition('entity-definition', model.id, name);
              state.entity = null;
            }),
          }))),
      h('div', { class: 'muted small summary' },
        `${properties.length} propert${properties.length === 1 ? 'y' : 'ies'} · `
        + `moved by ${writers.size} command${writers.size === 1 ? '' : 's'}, `
        + `read by ${readers.size}`)));
  }

  if (state.iconPicker === name) main.appendChild(iconPicker(model, name, entity));

  const entityAdvisories = advisoryBanner(model, 'entity-definition', name);
  if (entityAdvisories) main.appendChild(entityAdvisories);

  main.appendChild(identityBlock(model, name, entity));

  if (state.promoting === name) main.appendChild(promoteLifecycleForm(model, name));

  // The same ledger the Projections page renders, one column narrower:
  // Identity above has already said what every row here is kept per.
  //
  // The designated lifecycle is not in it. It sits in Identity instead,
  // with the identifier — see `identityBlock` for why that is a claim
  // about what a lifecycle *is* and not a layout preference.
  const lifecycle = lifecycleOf(model, name);
  const ledgerProperties = properties.filter((binding) =>
    !(lifecycle && binding.name === lifecycle.property));
  //
  // Adding one is offered the way the Projections page offers a new
  // projection — a button on the heading line, gone while its form is
  // open — so the two halves of one ledger are not added to two ways.
  const adderKey = 'prop:' + name;
  const adding = state.adder === adderKey;
  const section = h('section', { class: 'esection' },
    h('div', { class: 'ehead' },
      h('h4', {}, 'Properties', hint('entity-props', 'Properties', [
        'Each row is a projection folded per identifier value: the entity is not stored, it is '
        + 'what these folds say when read together for one id.',
        'A command binds the entity by id and reads these; which of them a condition names is '
        + 'what puts the fold in the derived consistency boundary.',
      ], 'https://dcb.events/topics/projections/', 'entity')),
      h('span', { class: 'grow' }),
      adding ? null : h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.adder = adderKey; render(); },
      }, '+ new property')));

  section.appendChild(projectionLedger(model, {
    owner: name,
    nameHead: 'property',
    entries: ledgerProperties.map((binding) => ({
      projection: binding.projection, label: propertyWords(binding.name), binding,
    })),
    add: adding ? entityPropertyAdder(model, name) : null,
  }));
  main.appendChild(section);
}

// The half of an entity nobody authored: the identifier is the only
// kind of tag a DCB model has, and nothing declared it — it comes
// with being a thing at all.
//
// The lifecycle belongs here too, and that is a reversal: this block
// used to say a lifecycle was "an ordinary enum property, listed below
// with everything else a modeler chose to track". That was right while a
// lifecycle was one arbitrary enum among however many an entity had. It
// stopped being right when the entity began designating exactly one —
// because existence is not something a modeller chose to track, it is
// the precondition of everything else they track. Two rows: what
// identifies one of these, and whether there is one at all — the second
// of which exists only once a lifecycle has been added (`lifecycleRow`);
// until then the identifier line offers one (`lifecycleAdder`).
//
// The identifier row is a read-only pointer — changing it happens in
// Custom Types. The lifecycle row is not: which property is the
// lifecycle is a designation the author makes, so it is editable here.
// (It was read-only at first, on the argument that a picker nobody needs
// is a concept everybody has to read past. That was wrong in practice:
// an author who has just built a state property by hand has no way to
// say so, and the promotion is not a door to that case.)
//
// The identifier itself is an ordinary custom type, created alongside
// the entity — this row is a read-only pointer at it, not an editor.
// Changing its schema, composing it, or renaming it all happen in
// Custom Types, which is what the chip opens.
//
// Both rows used to carry a sentence explaining themselves, and the
// block carried a third above them. All three are in the heading's hint
// now: the reader who needs to be told what a tag is needs it once, and
// the reader who does not was paying three lines for it on every visit.
function identityBlock(model, name, entity) {
  const idType = idTypeOf(model, name);
  const box = h('section', { class: 'ident' },
    h('h4', {}, 'Identity', hint('ident', 'Identity', [
      'Every event about one of these carries its identifier as a tag. Nothing declared '
      + 'that row — it comes with being a thing at all.',
      'Every property below is folded per identifier value.',
      'A lifecycle is one of those properties, designated: whether an instance is there at '
      + 'all (a boolean), or which of several named states it is in (an enum). None is added '
      + 'until one is asked for.',
      'A lifecycle nothing publishes into stays at its initial value, so every existence '
      + 'condition over it answers false.',
    ], 'https://dcb.events/topics/tags/', 'lifecycle')));

  const idRow = h('div', { class: 'irow' },
    h('span', { class: 'nm' }, 'identified by'),
    h('span', {
      class: 'chip editable', title: 'Open ' + readable(idType) + ' in Custom Types',
      onclick: () => goToCustomType(idType),
    }, readable(idType), advanced() ? h('span', { class: 'tech' }, idType) : null),
    // No lifecycle yet: the one way to add one, and nothing else — no
    // row, no `not designated`. A folded one has no row until it is
    // opened, so its menu comes here, the one line the lifecycle is
    // always on, and stays when the row opens, so opening moves nothing.
    ...(!entity.lifecycle
      ? [h('span', { class: 'grow' }), lifecycleAdder(model, name)]
      : lifecycleFolds(model, name)
        ? [h('span', { class: 'grow' }), lifecycleFold(model, name), lifecycleMenu(model, name)]
        : []));
  box.appendChild(idRow);

  box.appendChild(lifecycleRow(model, name, entity));
  return box;
}

// The stored spelling of a property, where it says something the words
// do not. `exists` humanises to `exists`, and printing it twice in
// advanced mode is the stutter this row was just rid of — the
// identifier beside it (`Student id` / `StudentId`) is the case the
// `.tech` span is actually for.
function techSpelling(property) {
  return advanced() && propertyWords(property) !== property
    ? h('span', { class: 'tech' }, property) : null;
}

// Whether the lifecycle's row folds onto the identifier line. Every
// drawable lifecycle does, and starts folded: an entity page is opened
// for its properties far more often than for its machine, and a track
// with its event labels hung above it was the tallest thing on the
// card. A refused one is a fault, and a fault is not folded away.
//
// There used to be a third case — a boolean nothing sets, hidden as
// "quiet" because every entity arrived with one unasked. Now a
// lifecycle is only ever there because somebody added it, so it always
// says so, and `set by —` is the next step it is telling them about.
function lifecycleFolds(model, name) {
  return !!lifecycleOf(model, name);
}

const FOLD_CARET = '<svg viewBox="0 0 8 8" aria-hidden="true"><polyline points="1.2,2.5 4,5.5 6.8,2.5" '
  + 'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// The folded lifecycle, said in the page's muted register for a derived
// fact — `state exists · set by Student registered` — and the
// door to the row. An enum says how many states it has rather than
// listing them: the list, and the events between, is what opening it is
// for, and spelled out it ran longer than the identifier it sits beside.
function lifecycleFold(model, name) {
  const lifecycle = lifecycleOf(model, name);
  const open = !!state.lcOpen[name];
  const summary = lifecycle.isBoolean
    ? lifecycleShapeWords(lifecycle)
    : `${lifecycle.states.length} states`;
  return h('button', {
    class: 'lcfold' + (open ? ' on' : ''), type: 'button',
    'aria-expanded': open ? 'true' : 'false',
    title: open ? 'Fold the lifecycle away' : 'Show the lifecycle',
    onclick: () => {
      state.lcOpen = { ...state.lcOpen, [name]: !open };
      render();
    },
  }, 'state ', h('span', { class: 'p' }, propertyWords(lifecycle.property)), ' · ' + summary,
  h('span', { class: 'caret', html: FOLD_CARET }));
}

// The lifecycle's row in Identity — when there is one to show. No
// lifecycle at all has no row: the identifier line carries the one way
// to add one (`lifecycleAdder`), and the page says nothing else about
// state, because an entity need not have one and saying `not
// designated` on every fresh page read as a fault. The row used to be
// on screen always, naming itself twice — `exists once` beside a chip
// reading `exists` — and spending a 47-character sentence on what
// `set by —` says. The chip is now the property in every branch, which
// is the other half of that: it used to be the setters when there were
// any and the property when there were none, so the one case where it
// read worst was the empty one.
function lifecycleRow(model, name, entity) {
  const lifecycle = lifecycleOf(model, name);
  const rows = h('div', {});

  if (!lifecycle && entity.lifecycle) {
    // Designated at something no machine can be drawn from: the property
    // is the whole of what is wrong with it, so it is what the row
    // shows, and the word beside it says why.
    const refusal = lifecycleRefusal(model, name);
    rows.appendChild(h('div', { class: 'irow' },
      h('span', { class: 'nm' }, 'state'),
      h('span', { class: 'chip' }, propertyWords(entity.lifecycle), techSpelling(entity.lifecycle)),
      h('span', { class: 'tiny muted' }, LIFECYCLE_REFUSAL_WORDS[refusal] || refusal),
      h('span', { class: 'grow' }),
      lifecycleMenu(model, name)));
  } else if (lifecycleFolds(model, name) && state.lcOpen[name]) {
    // A drawn track hangs its event labels above the wire, so the row it
    // sits in has to make room for them. Its menu is on the identifier
    // line, where it was while the row was folded.
    const shape = lifecycleShape(model, name, lifecycle);
    rows.appendChild(h('div', { class: shape.classList.contains('lctrack') ? 'irow lcrow' : 'irow' },
      h('span', { class: 'nm' }, 'state'),
      h('span', {
        class: 'chip editable', title: 'Open ' + readable(lifecycle.projectionName),
        onclick: () => goToProjection(lifecycle.projectionName),
      }, propertyWords(lifecycle.property), techSpelling(lifecycle.property)),
      shape));
  }

  // The offer, where an author who has just added two booleans is
  // looking. The rule wizard makes the same offer at the moment a rule
  // brings them together; this one needs no command to exist yet. Its
  // button does not wait for a hover the way the menu does: the row
  // exists only to make the offer, so hiding the offer's action would
  // leave a sentence that does nothing.
  const candidates = entityMergeCandidates(model, name);
  if (candidates.length >= 2 && state.promoting !== name) {
    rows.appendChild(h('div', { class: 'irow lc-offer' },
      h('span', { class: 'nm' }, ''),
      h('span', { class: 'tiny muted' },
        `${candidates.map(propertyWords).join(', ')} never go back — stages of one lifecycle.`,
        hint('lc-offer', 'Monotone booleans', [
          'None of these ever goes back to false once it holds, so they are stages of one '
          + 'lifecycle rather than independent facts.',
          'Merging them into an enum states the stages once. Every condition over the '
          + 'absorbed properties is rewritten over the enum — a boolean that held from '
          + 'stage i onward becomes equalsAny over stages i..n, not equals stage i.',
          'Non-monotone booleans are refused: collapsing them would destroy a dimension.',
        ], null, 'lifecycle')),
      h('span', { class: 'grow' }),
      h('button', {
        class: 'btn tiny',
        onclick: () => {
          closeForms();
          state.promoting = name;
          state.promoteDraft = mergeDraftFor(model, name, candidates);
          render();
        },
      }, 'Merge')));
  }

  if (state.designating === name) rows.appendChild(designationPicker(model, name, entity));
  return rows;
}

// Three states is the cap, and a long name lowers it: past that the row
// wraps, and a wrapped machine is worse than the sentence it replaced.
// The band on the Lifecycles page is where a real one is read, which is
// where the menu's last item goes.
const LC_TRACK_STATES = 3;
const LC_TRACK_STATE_CHARS = 16;
const LC_TRACK_EVENT_CHARS = 22;

// The machine where it is named, or the words when it will not fit.
// `lifecycleMachines` already knows every transition and which states
// are terminal, so the row draws that rather than reading the handlers a
// second time — the Identity row and the Lifecycles band cannot disagree
// about what moves what.
function lifecycleShape(model, name, lifecycle) {
  const machine = lifecycleMachines(model).machines.find((m) => m.entity === name);
  return (machine && lifecycleTrack(machine))
    || h('span', { class: 'tiny muted' }, lifecycleShapeWords(lifecycle));
}

// Drawable only as a chain: every transition has to be the step from one
// state to the next one along. Anything else — a jump, a way back, a
// loop, an event whose handler this cannot read — is a machine, and a
// machine goes on the Lifecycles page.
function lifecycleTrack(machine) {
  const order = lifecycleOrder(machine);
  if (order.length > LC_TRACK_STATES || machine.opaque.length) return null;
  const words = order.map((st) => (machine.isBoolean ? st : readable(st)));
  if (words.some((word) => word.length > LC_TRACK_STATE_CHARS)) return null;

  const hops = [];
  let drawn = 0;
  for (let i = 0; i + 1 < order.length; i += 1) {
    const moves = machine.transitions.filter((t) => t.target === order[i + 1]);
    if (moves.some((t) => t.sources.length !== 1 || t.sources[0] !== order[i])) return null;
    const label = moves.map((t) => readable(t.event)).join(', ');
    if (label.length > LC_TRACK_EVENT_CHARS) return null;
    hops.push(label);
    drawn += moves.length;
  }
  // A transition left over is one the chain would not have drawn — into
  // the first state, say. Drawing the rest would be drawing a lie.
  if (drawn !== machine.transitions.length) return null;

  const track = h('span', { class: 'lctrack' });
  order.forEach((st, i) => {
    const label = i ? hops[i - 1] : '';
    if (i) {
      track.appendChild(h('span', { class: 'hop' + (label ? '' : ' dead') },
        label ? h('span', { class: 'ev' }, label) : null,
        h('span', { class: 'wire' },
          h('i', { style: `width:${Math.max(24, Math.round(label.length * 5.8))}px` }),
          h('b', {}))));
    }
    const reached = i === 0 || label !== '';
    // The outline marks a state nothing leaves. In an existence machine
    // that is `true`, which is not news — only a real enum earns it.
    const terminal = !machine.isBoolean && reached && machine.terminal.includes(st);
    track.appendChild(h('span', {
      class: 'st' + (machine.isBoolean ? ' val' : '')
        + (reached ? '' : ' unreached') + (terminal ? ' terminal' : ''),
    }, words[i]));
  });
  return track;
}

// What the track would have said, in words, for the machines it gives up
// on. Same two halves: the states, and what moves it.
function lifecycleShapeWords(lifecycle) {
  const setters = (lifecycle.projection.handlers || [])
    .filter((handler) => handler && handler.event);
  const by = !setters.length ? 'set by —'
    : setters.length <= 2
      ? `set by ${setters.map((handler) => readable(handler.event)).join(', ')}`
      : `set by ${setters.length} events`;
  if (lifecycle.isBoolean) return by;
  const states = lifecycle.states.length <= LC_TRACK_STATES
    ? lifecycle.states.map((st) => readable(st)).join(', ')
    : `${lifecycle.states.length} states`;
  return `${states} · ${by}`;
}

// Everything that can be done to the lifecycle, behind one mark. None
// of it is what anybody opened the page for — which is exactly the
// shape a menu is for, and exactly the shape standing buttons were not.
// Remove undoes only the designation (`removeLifecycle`), so it is no
// more destructive than the rest.
function lifecycleMenu(model, name) {
  const lifecycle = lifecycleOf(model, name);
  const entity = model['entity-definitions'][name];
  const items = [];
  if (lifecycleCandidates(model, name).length) {
    items.push(['Designate another property…',
      () => { closeForms(); state.designating = name; render(); }]);
  }
  if (lifecycle && lifecycle.isBoolean) {
    items.push(['Give it more than two states…',
      () => { closeForms(); state.promoting = name; render(); }]);
  }
  // The Lifecycles page is advanced-only, like its rail link — offering
  // it in simple mode would be a door onto `state.view = 'slice'`.
  if (lifecycle && advanced()) {
    items.push(['Open in Lifecycles', () => goToLifecycles(name)]);
  }
  if (entity && entity.lifecycle) {
    items.push(['Remove lifecycle', () => { closeForms(); removeLifecycle(model, name); }]);
  }
  if (!items.length) return null;
  return lifecyclePanel('lc:' + name, '', '⋮',
    { class: 'lcbtn', title: 'What can be done to the lifecycle' }, items);
}

// The one way an entity gets a lifecycle: asked for, here. Three doors,
// one per thing an author could mean — the one-click boolean, an enum
// whose states they name, or a property they already built. Not faded
// like the menu: with nothing designated it is the only lifecycle
// control on the page, and a next step that waits for a hover is one
// nobody finds.
function lifecycleAdder(model, name) {
  const items = [];
  if (existenceLifecycleOffer(model, name)) {
    items.push(['Exists (boolean)', () => { closeForms(); addExistenceLifecycle(model, name); }]);
  }
  items.push(['Named states (enum)…', () => {
    closeForms();
    state.promoting = name;
    state.promoteDraft = scratchLifecycleDraft(name);
    render();
  }]);
  if (lifecycleCandidates(model, name).length) {
    items.push(['Existing property…', () => { closeForms(); state.designating = name; render(); }]);
  }
  return lifecyclePanel('lc+:' + name, ' lcadd', '+ lifecycle',
    { class: 'lcfold', title: 'Give it a lifecycle' }, items);
}

// The click-to-open panel both of the above are. One `state.lcMenu` key
// for the page, so opening one folds the other.
function lifecyclePanel(key, extraClass, label, trigger, items) {
  const on = state.lcMenu === key;
  return h('span', { class: 'lcmenu' + extraClass + (on ? ' on' : '') },
    h('button', {
      ...trigger, type: 'button',
      'aria-expanded': on ? 'true' : 'false',
      onclick: (e) => {
        e.stopPropagation();
        closeForms();
        state.lcMenu = on ? null : key;
        render();
      },
    }, label),
    h('span', { class: 'lcpanel' }, ...items.map(([text, go]) => h('button', {
      class: 'lcitem', type: 'button', onclick: go,
    }, text))));
}

// Which property is the lifecycle. A short list, because the only
// properties eligible are the ones with states to be in — and "none",
// because an entity need not have a lifecycle and un-saying it has to be
// possible wherever saying it is.
function designationPicker(model, name, entity) {
  const choices = lifecycleCandidates(model, name);
  const current = entity.lifecycle || '';
  const set = (value) => run(() => {
    const body = deepClone(activeModel()['entity-definitions'][name]);
    if (value) body.lifecycle = value; else delete body.lifecycle;
    updateDefinition('entity-definition', model.id, name, body);
    state.designating = null;
  });
  return h('div', { class: 'irow' },
    h('span', { class: 'nm' }, 'the state is'),
    pick([['', '— none —'], ...choices.map((c) => [c, propertyWords(c)])], current, set),
    h('span', { class: 'tiny muted' }, 'single-valued boolean or enum only'));
}

// The draft for an enum lifecycle named from nothing: no boolean behind
// any state, and no state proposed either — `NonExistent` is how a
// boolean that existed before reads, and here none did. Two blank
// rows, the first state and one more, because two is enough when the
// enum was chosen on purpose.
function scratchLifecycleDraft(entityName) {
  return {
    scratch: true,
    typeName: entityName + 'Status',
    property: 'status',
    initialState: '',
    steps: [{ from: null, state: '' }],
    extra: '',
  };
}

// The draft the merge form opens holding: one step per boolean, named
// after it, with the first state named for the absence of all of them.
// Every name is a proposal; the form exists because none of them can be
// known.
function mergeDraftFor(model, entityName, candidates) {
  return {
    typeName: entityName + 'Status',
    property: 'status',
    initialState: 'NonExistent',
    steps: candidates.map((from) => ({
      from,
      state: toPascal(from.replace(/^is/, '')) || 'Existent',
    })),
    extra: '',
  };
}

// The merge form. Every field is a name, because naming is the whole of
// what cannot be inferred — which property the states collapse into,
// what the enum is called, and what each state is called.
//
// Two shapes reach it, and it is one form because they are one gesture:
// a single boolean growing a state nothing sets yet ("add Archived
// before anything archives"), and several one-way booleans absorbed into
// the stages they already were. The rows say which is which — a step
// with a boolean behind it names what moves into that state, a step
// without one says nothing does yet.
function promoteLifecycleForm(model, entityName) {
  const lifecycle = lifecycleOf(model, entityName);
  const candidates = entityMergeCandidates(model, entityName);
  if (!state.promoteDraft) {
    state.promoteDraft = candidates.length >= 2
      ? mergeDraftFor(model, entityName, candidates)
      : !lifecycle ? scratchLifecycleDraft(entityName) : {
        typeName: entityName + 'Status',
        property: 'status',
        initialState: 'NonExistent',
        steps: [
          ...(lifecycle && lifecycle.isBoolean
            ? [{ from: lifecycle.property, state: 'Existent' }] : []),
          { from: null, state: '' },
        ],
      };
  }
  const draft = state.promoteDraft;
  const scratch = !!draft.scratch;

  // `note`, not `hint`: the global `hint` is the concept popover, and a
  // parameter shadowing it here is a trap for whoever adds one next.
  const field = (key, label, note, placeholder) => h('label', { class: 'fieldrow' },
    h('span', { class: 'nm' }, label),
    h('input', {
      type: 'text', value: draft[key] || '', placeholder: placeholder || '',
      oninput: (e) => { draft[key] = e.target.value; },
    }),
    note ? h('span', { class: 'tiny muted' }, note) : null);

  // Which boolean moves it into this state is a picker, not a label, and
  // that is what makes the form able to say things the offer cannot
  // guess: which of several booleans is the *first* stage, and which one
  // to leave alone as an ordinary property. Order is the progression, so
  // it has to be the author's to set.
  const taken = draft.steps.map((s) => s.from).filter(Boolean);
  const stepRow = (step, index) => h('label', { class: 'fieldrow' },
    h('span', { class: 'nm' }, index === 0 ? 'then it is' : 'then'),
    h('input', {
      type: 'text', value: step.state || '', placeholder: 'a state',
      oninput: (e) => { step.state = e.target.value; },
    }),
    h('span', { class: 'tiny muted' }, 'once'),
    pick([['', '— none —'],
      ...candidates.filter((c) => c === step.from || !taken.includes(c))
        .map((c) => [c, propertyWords(c)])],
    step.from || '', (value) => {
      step.from = value || null;
      // The state name followed the boolean, so it follows the change —
      // unless the author has already written their own.
      if (value && (!step.state || step.state === toPascal((step.from || '').replace(/^is/, '')))) {
        step.state = toPascal(value.replace(/^is/, ''));
      }
      render();
    }),
    draft.steps.length > 1 ? h('button', {
      class: 'btn tiny', type: 'button',
      title: step.from
        ? `Leave ${propertyWords(step.from)} as its own property`
        : 'Drop this state',
      onclick: () => { draft.steps.splice(index, 1); render(); },
    }, 'Remove') : null);

  const form = h('section', { class: 'esection' },
    h('h4', {}, scratch ? 'Name its states'
      : candidates.length >= 2 ? 'Merge these into one lifecycle'
        : 'Give it more than two states',
      hint('lc-promote', 'Promotion', [
        'A two-state lifecycle can be a boolean, which needs no vocabulary. An enum names its '
        + 'states, so they are named here rather than inferred.',
        'Every condition over an absorbed property is rewritten over the enum in the same '
        + 'append, undoable in one step: a model whose conditions still say isTrue while the '
        + 'fold has become an enum is a state the log has no migration for.',
      ], null, 'lifecycle')),
    field('property', 'the property', 'what the states are held in from now on'),
    field('typeName', 'the type', 'the enum these states belong to'),
    field('initialState', 'at first', 'before anything has happened', 'a state'),
    ...draft.steps.map(stepRow));

  form.appendChild(h('div', { class: 'row' },
    h('button', {
      class: 'btn tiny', type: 'button',
      onclick: () => { draft.steps.push({ from: null, state: '' }); render(); },
    }, '+ another state'),
    h('span', { class: 'grow' }),
    h('button', {
      class: 'btn primary tiny',
      onclick: () => {
        const merged = mergeIntoLifecycle(model, entityName, draft);
        if (merged) { state.promoting = null; state.promoteDraft = null; render(); }
      },
    }, scratch ? 'Add' : candidates.length >= 2 ? 'Merge' : 'Promote'),
    h('button', {
      class: 'btn tiny',
      onclick: () => { state.promoting = null; state.promoteDraft = null; render(); },
    }, 'Cancel')));
  return form;
}

// The reason a machine cannot be drawn, in as many words as the reason
// takes. `dangling` is the only one of the five that is a defect, so it
// is the only one that names the property it could not find — the other
// four are legitimate models whose state simply has no states to draw.
const LIFECYCLE_REFUSAL_WORDS = {
  dangling: 'dangling designation',
  scripted: 'scripted fold',
  derived: 'derived',
  list: 'list-valued',
  stateless: 'no states',
};

// ---------- the ledger ----------
//
// One component, two pages. A row is a projection: what it is called,
// what it is kept per, what it holds and where it starts — and nothing
// else, because everything else is either the same for every row or
// belongs to the row once it is opened.
//
// `owner` is the entity whose page this is, or null on Projections. It
// does exactly one thing: drop the "one per" column, since an entity's
// page has already said what all of its rows are kept per — that is
// what the Identity block above them is. The opened row still shows it,
// fixed rather than offered, because being folded per that entity's
// identifier is the whole of what makes a projection its property.
function projectionLedger(model, { owner, entries, nameHead, add }) {
  const cols = owner ? '1fr 150px 150px' : '1fr 156px 140px 132px';
  return h('div', { class: 'ledger' },
    h('div', { class: 'lhead', style: 'grid-template-columns:' + cols },
      h('span', {}, nameHead),
      owner ? null : h('span', {}, 'one per'),
      h('span', {}, 'holds'),
      h('span', {}, 'starts at')),
    entries.length
      ? entries.map((entry) => projectionLedgerRow(model, entry, { owner, cols }))
      : h('div', { class: 'empty', style: 'padding:11px 12px' }, 'Nothing yet.'),
    add ? h('div', { class: 'addrow' }, add) : null);
}

// What a projection is kept per, as the tags it really queries by. A
// parameter typed with an entity's identifier carries that entity's
// mark, because that is what the tag is.
function partitionCells(model, body) {
  const script = scriptOf(body);
  const slots = (script ? script.arguments : body.parameters) || [];
  if (!slots.length) {
    return [h('span', {
      class: 'chip unset', title: 'One value for the whole model — a query with no tag',
    }, 'kept once')];
  }
  return slots.map((slot) => {
    const entity = entityOfIdType(model, slot.propertyType);
    return h('span', { class: 'chip tag', title: readable(slot.propertyType) },
      entity ? h('i', { class: 'ic' }, entityIcon(model, entity)) : null,
      propertyWords(slot.name));
  });
}

// A row, and — when it is the one being edited — everything under it.
// The two are siblings rather than nested so that a click inside the
// detail never reaches the row's own handler and folds it shut.
function projectionLedgerRow(model, entry, { owner, cols }) {
  const { projection, label } = entry;
  const body = model['projection-definitions'][projection];

  if (!body) {
    return h('div', { class: 'lrow dead', style: 'grid-template-columns:' + cols },
      h('span', { class: 'nm' }, h('span', { class: 'txt' }, label)),
      h('span', { class: 'muted tiny' },
        `binds “${projection}”, which this model does not define`),
      h('span', {}),
      h('span', {}, h('button', {
        class: 'btn tiny danger', title: 'Drop this binding',
        onclick: () => patch('entity-definition', owner, (b) => {
          b.properties = b.properties.filter((p) => p.name !== entry.binding.name);
        }),
      }, '×')));
  }

  const open = !!state.projDraft && state.projDraft.name === projection;
  const readers = projectionReaders(model, projection);
  const dead = !readers.length && !(body.handlers || []).length;
  // A projection holding another thing's identifier is a reference to
  // that thing, so it carries that thing's mark.
  const referenced = entityOfIdType(model, body.valueType);

  const row = h('div', {
    class: 'lrow' + (open ? ' on' : '') + (dead ? ' dead' : ''),
    style: 'grid-template-columns:' + cols,
    title: dead ? 'Nothing moves it and nothing reads it' : null,
    onclick: () => toggleProjectionRow(model, projection),
  },
    h('span', { class: 'nm' },
      h('span', { class: 'lcaret' }, open ? '▾' : '▸'),
      h('span', { class: 'txt' }, label)),
    owner ? null : h('span', {}, ...partitionCells(model, body)),
    h('span', { class: 'lcell ty', title: typeLabel(body) },
      referenced ? h('i', { class: 'ic' }, entityIcon(model, referenced)) : null,
      readable(typeLabel(body)),
      scriptLabel(body) ? ' · ' + scriptLabel(body) : null),
    h('span', {}, initialValueChip(body)));

  return h('div', {}, row, open ? projectionDetail(model, entry, { owner }) : null);
}

// Opening a row is opening its editor: there is no separate "Edit", so
// the draft a row is opened with *is* the row being open.
function toggleProjectionRow(model, projection) {
  const open = !!state.projDraft && state.projDraft.name === projection;
  closeForms();
  if (!open) {
    const body = model['projection-definitions'][projection];
    if (body) state.projDraft = { name: projection, body: projectionDraftFrom(body) };
    state.projTab = 'definition';
  }
  render();
}

// The two sides of one projection. Tabs, because checks are a different
// question from what the thing is — and scoped to the row in front of
// you rather than to moving between rows, which is the distinction that
// makes them tabs rather than navigation.
function projectionDetail(model, entry, { owner }) {
  const { projection, binding } = entry;
  const draft = state.projDraft.body;
  const tab = state.projTab === 'checks' ? 'checks' : 'definition';
  const entries = projectionScenariosFor(model, projection);
  const trouble = entries.filter((e) => {
    const status = runProjectionScenario(model, e.body).status;
    return status === 'drifted' || status === 'broken';
  }).length;

  const tabButton = (key, label, extra) => h('button', {
    class: 'tab' + (tab === key ? ' on' : ''),
    'aria-pressed': tab === key ? 'true' : 'false',
    onclick: () => { state.projTab = key; state.projectionScenarioDraft = null; render(); },
  }, label, extra);

  const readers = projectionReaders(model, projection);
  const bound = boundAs(model, projection);

  // Two names can be changed here, and they are genuinely two: what an
  // entity calls the projection (the binding, which every command
  // reading it names too) and what the projection itself is called.
  // Renaming the second is Advanced — the name is derived from the
  // first when the property is created, and nothing outside the stored
  // model shows it.
  const renamingBinding = owner && editingMember('entity:' + owner, binding.name);
  const renamingProjection = state.renamingProjection === projection;
  const renameForm = renamingBinding
    ? h('div', { class: 'adder' },
        renamePropertyField(model, owner, binding, 'entity:' + owner),
        h('button', {
          class: 'btn ghost tiny',
          onclick: () => { state.editMember = null; render(); },
        }, 'Done'))
    : (renamingProjection
        ? renameDefinitionForm(model, 'projection-definition', projection, {
            stateKey: 'renamingProjection',
            // The open row is keyed by the name that just changed.
            after: (next) => { if (state.projDraft) state.projDraft.name = next; },
          })
        : null);

  const definition = h('div', {},
    ...projectionFields(model, draft, owner ? { entityName: owner } : {}),
    h('div', { class: 'row', style: 'margin-top:10px' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'read by'),
      readers.length
        ? readers.map((command) => h('span', {
            class: 'chip command linkable', title: 'Open ' + readable(command),
            onclick: () => { closeForms(); state.slice = command; state.view = 'slice'; render(); },
          }, readable(command)))
        : h('span', { class: 'empty' }, 'Nothing reads it.')),
    h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'bound as'),
      bound.length
        ? bound.map((b) => h('span', {
            class: 'chip entity linkable', title: 'Open ' + readable(b.entity),
            onclick: () => openEntity(b.entity),
          }, h('i', { class: 'ic' }, entityIcon(model, b.entity)),
            memberWords(readable(b.entity), b.property)))
        : h('span', { class: 'chip unset' }, 'no entity calls it anything')));

  return h('div', {
    class: 'pdetail',
    // Both bubble here from every control in the definition: selects
    // and checkboxes land on `change`, typing lands on `input`, and
    // either schedules the save that keeps the Checks badge honest.
    oninput: scheduleProjectionAutosave,
    onchange: scheduleProjectionAutosave,
  },
    h('div', { class: 'tabs' },
      tabButton('definition', 'Definition'),
      tabButton('checks', 'Checks', entries.length
        ? h('span', { class: 'badge' + (trouble ? '' : ' clear') }, trouble || entries.length)
        : null)),
    renameForm,
    tab === 'checks' ? projectionChecks(model, projection) : definition,
    tab === 'definition' ? projectionDetailFoot(model, entry, { owner }) : null);
}

// Opening a form closes every other one — including, ordinarily, the
// open ledger row the new form is drawn inside. The row is put back so
// that it is not: what is being edited has to stay on screen while it
// is being edited, and the control that was clicked has to survive the
// repaint or the focus on it is lost.
function keepingRowOpen(open) {
  const draft = state.projDraft;
  const tab = state.projTab;
  closeForms();
  open();
  state.projDraft = draft;
  state.projTab = tab;
}

function startRenameInRow(open) {
  keepingRowOpen(open);
  render();
}

// ---------- projection autosave ----------
//
// An open projection row saves itself: as soon as the draft's cleaned
// body differs from what is stored, it is stored — so the Checks
// badge, the drift marks and everything else derived from the stored
// definition answer the edit rather than a Save button that used to
// fold the row away. The row stays open; closing it is a separate
// gesture (clicking the row), and reverting is what undo is for.
//
// Selects and checkboxes repaint on change, so their edits land on the
// next paint through the detail's own change/input listeners; typing
// lands on a short pause, and any gesture that leaves the row flushes
// whatever the pause had not yet caught (see `commitPendingField`).
let projectionAutosaveTimer = null;
let projectionAutosaveBusy = false;
// The one body the model refused, kept so an invalid intermediate
// state toasts once instead of on every keystroke that fails the same
// way. Any further edit changes the JSON and earns a fresh attempt.
let projectionAutosaveRefused = null;

function autoSaveProjectionDraft() {
  clearTimeout(projectionAutosaveTimer);
  projectionAutosaveTimer = null;
  if (projectionAutosaveBusy) return;
  const open = state.projDraft;
  if (!open || !open.body) return;
  const model = activeModel();
  const stored = model && model['projection-definitions'][open.name];
  if (!stored) return;
  const next = cleanProjectionBody(open.body);
  // Memoed under the projection's name: the same bytes may be a legal
  // body for some other projection later, and must not inherit this
  // one's refusal.
  const json = open.name + ':' + JSON.stringify(next);
  if (JSON.stringify(next) === JSON.stringify(stored)) { projectionAutosaveRefused = null; return; }
  if (json === projectionAutosaveRefused) return;
  projectionAutosaveBusy = true;
  try {
    const saved = run(() => {
      updateDefinition('projection-definition', model.id, open.name, next);
      return true;
    });
    projectionAutosaveRefused = saved ? null : json;
  } finally {
    projectionAutosaveBusy = false;
  }
}

function scheduleProjectionAutosave() {
  clearTimeout(projectionAutosaveTimer);
  projectionAutosaveTimer = setTimeout(() => {
    projectionAutosaveTimer = null;
    autoSaveProjectionDraft();
  }, 600);
}

function projectionDetailFoot(model, entry, { owner }) {
  const { projection, binding } = entry;
  return h('div', { class: 'pfoot' },
    h('span', { class: 'muted tiny' }, 'Saves as you edit — undo takes it back.'),
    h('span', { class: 'grow' }),
    advanced() ? h('span', { class: 'tech' }, projection) : null,
    h('button', {
      class: 'btn tiny',
      title: owner ? 'Rename what this entity calls it' : 'Rename the projection',
      onclick: () => (owner
        ? startRenameInRow(() => openMember('entity:' + owner, binding.name))
        : startRenameInRow(() => { state.renamingProjection = projection; })),
    }, 'Rename'),
    // The projection's own name, on the page that does not own it.
    // Reachable, because a projection an entity binds is listed nowhere
    // else — and Advanced, because nothing outside the stored model
    // shows that name in the first place.
    owner && advanced() ? h('button', {
      class: 'btn tiny', title: 'Rename the projection itself, not what this entity calls it',
      onclick: () => startRenameInRow(() => { state.renamingProjection = projection; }),
    }, 'Rename projection') : null,
    owner
      ? removeButton('prop:' + owner + '.' + binding.name, {
          label: 'Stop tracking', title: 'Unbind it from this entity',
          onRemove: () => removeEntityProperty(model, owner, binding),
        })
      : removeButton('projection:' + projection, {
          label: 'Remove', title: 'Remove this projection',
          onRemove: () => run(() => removeDefinition('projection-definition', model.id, projection)),
        }));
}

// Every scenario that reads this projection. A scenario naming four of
// an entity's properties is listed under all four — one Given asserting
// four values is one scenario, and editing it anywhere edits it
// everywhere, which is exactly what the reader needs to know.
function projectionChecks(model, projection) {
  return projectionScenarioList(model, {
    entries: projectionScenariosFor(model, projection),
    start: { projection },
    blank: 'Nothing checks this yet. A scenario is what had already happened and what this folds '
      + 'to as a result — the only thing that notices when an edit somewhere else changes it.',
  });
}


// Unbinding a property: the entity stops calling it anything, and the
// projection behind it goes too — unless something else still reads
// it, in which case it stays and says so. That is the one-gesture
// create read backwards, and it is why the removal is two steps rather
// than one: a projection a command binds is not this entity's to
// delete.
function removeEntityProperty(model, entityName, property) {
  const projectionName = property.projection;
  run(() => {
    const entity = deepClone(model['entity-definitions'][entityName]);
    entity.properties = (entity.properties || []).filter((p) => p.name !== property.name);
    updateDefinition('entity-definition', model.id, entityName, entity);
    // `removeDefinition` no longer refuses over dangling references,
    // so the still-read decision is this gesture's own: scenarios never
    // hold a projection in place (they report breakage, not prevent
    // it), anything else still reading it does.
    const after = projectState()[model.id];
    const stillRead = findReferencers(after, 'projection-definition', projectionName)
      .some((r) => r.kind !== 'scenario-definition' && r.kind !== 'projection-scenario-definition');
    if (stillRead) {
      toast(`Unbound — ${readable(projectionName)} is still read elsewhere, so it stays in Projections.`);
    } else {
      removeDefinition('projection-definition', model.id, projectionName);
    }
  });
}


// Renaming a property renames what this entity calls the projection —
// the binding's name, which every command reading it names too, so it
// goes through `renameMember` rather than an ordinary body edit. The
// projection's own name is untouched: two entities may call one
// projection different things.
function renamePropertyField(model, entityName, property, where) {
  let name = property.name;
  const doRename = () => {
    const next = toCamel(name);
    if (!next) return toast('Give it a name.', true);
    if (next === property.name) { state.editMember = null; return render(); }
    state.editMember = { where, name: next };
    run(() => renameMember('entity-definition', model.id, entityName, 'property', property.name, next));
  };
  return h('span', { class: 'adder' },
    h('input', {
      type: 'text', value: property.name, style: 'width:190px',
      oninput: (e) => { name = e.target.value; },
      onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } },
    }),
    h('button', {
      class: 'btn tiny', title: 'Rename, rewriting every command that reads it',
      onclick: doRename,
    }, 'Rename'),
    h('span', { class: 'muted tiny' }, 'what this entity calls ',
      h('span', { class: 'chip projection' }, readable(property.projection))));
}

// The marks on offer. A grid rather than a text field, because the
// point of a mark is that it is recognised, and a modeler asked to type
// one will type the first thing that comes to hand. Anything can still
// be typed — the field is beside the grid, not instead of it.
const ICON_CHOICES = [
  '📚', '🎓', '🧑‍🎓', '👤', '👥', '🏫', '🏢', '🏬', '🏠', '🛏️',
  '📦', '🧾', '🛒', '💳', '💰', '🏷️', '🎟️', '🎫', '📄', '📋',
  '🗓️', '⏰', '⏳', '📍', '🧭', '✈️', '🚗', '🚚', '🍽️', '☕',
  '🔑', '🔒', '⚙️', '🧩', '🔧', '🧱', '🌱', '🐾', '⭐', '🔥',
  '💡', '🎯', '🧪', '🩺', '📈', '📊', '🎵', '🎬', '⚽', '♟️',
];

// One form for all three marked kinds. What varies is data — which
// state slot holds it open, which collection the patch lands in, what
// the prose promises — so it is passed in, and a fix to the grid, the
// typed input or the trim-or-delete rule lands on all three at once.
function iconForm(name, body, { stateKey, kind, current, prose, cls = '' }) {
  let typed = body.icon || '';
  const set = (icon) => {
    state[stateKey] = null;
    patch(kind, name, (b) => {
      const next = String(icon || '').trim();
      if (next) b.icon = next;
      else delete b.icon;
    });
  };
  const close = () => { state[stateKey] = null; render(); };
  return h('div', { class: 'inline-form icons' + cls },
    h('div', { class: 'q' }, prose),
    h('div', { class: 'grid' }, ICON_CHOICES.map((icon) => h('button', {
      class: 'ic-opt' + (icon === current ? ' on' : ''), title: 'Use this',
      onclick: () => set(icon),
    }, icon))),
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: typed, placeholder: 'or type one', style: 'width:110px',
        oninput: (e) => { typed = e.target.value; },
        onkeydown: (e) => {
          if (e.key === 'Enter') { e.preventDefault(); set(typed); }
          if (e.key === 'Escape') { e.preventDefault(); close(); }
        },
      }),
      h('button', { class: 'btn', onclick: () => set(typed) }, 'Use'),
      body.icon ? h('button', {
        class: 'btn ghost', title: 'Back to the neutral mark',
        onclick: () => set(''),
      }, 'Clear') : null,
      h('button', { class: 'btn ghost', onclick: close }, 'Done')));
}

function iconPicker(model, name, entity) {
  return iconForm(name, entity, {
    stateKey: 'iconPicker', kind: 'entity-definition', current: entityIcon(model, name),
    prose: `The mark ${readable(name)} is shown with — in the rail, in every command that reads it, `
      + 'and in every change it takes.',
  });
}

function eventIconPicker(model, name, event) {
  return iconForm(name, event, {
    stateKey: 'eventIconPicker', kind: 'event-definition', current: eventIcon(model, name),
    cls: ' event',
    prose: `The mark ${readable(name)} is shown with — in the sandbox timeline, in every Given that `
      + 'records it, and everywhere it is recorded.',
  });
}

// A command's icon is also the default mark for whichever single event
// it publishes (see `eventIcon`), so clearing it back to the neutral
// mark changes that event's default too, unless the event has a mark
// of its own already.
function commandIconPicker(model, name, command) {
  return iconForm(name, command, {
    stateKey: 'commandIconPicker', kind: 'command-definition', current: commandIcon(model, name),
    prose: `The mark ${readable(name)} is shown with — and, by default, the event it records on `
      + 'success, unless that event has a mark of its own.',
  });
}

// ---------- value types ----------
//
// A value type is either one value described by a JSON Schema, or a
// record of named fields. The composite form is the one that matters
// here: because a field may be typed with an entity's identifier, a
// list of composites is what lets a single event record something that
// happened to many instances at once.
//
// Fields are offered as name-and-type only. There are no list or
// optional controls, because a composite's fields may be neither — the
// editor declines to ask rather than asking and then refusing.
function renderCustomTypes(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Custom types'),
    h('div', { class: 'muted small' },
      'Records with no identity of their own — a price, an order line — and identifiers: a '
      + 'scalar type marked "represented as a tag" is what every event carrying it is tagged '
      + 'with. An entity’s own derived identifier lives here too, created automatically '
      + 'alongside it, and stays pinned as a tag for as long as the entity owns it.')));

  const typeAdvisories = advisoryBanner(model, 'custom-type-definition');
  if (typeAdvisories) main.appendChild(typeAdvisories);

  const names = Object.keys(model['custom-type-definitions']).sort();
  if (!names.length) {
    main.appendChild(h('div', { class: 'empty' }, 'None yet.'));
  }

  for (const name of names) {
    const body = model['custom-type-definitions'][name];
    const composite = Array.isArray(body.properties);
    const owner = entityOfIdType(model, name);
    const card = h('div', { class: 'ecard' });

    if (state.renamingType === name) {
      card.appendChild(renameDefinitionForm(model, 'custom-type-definition', name, {
        stateKey: 'renamingType',
      }));
    } else {
      const tags = composite
        ? idLeavesOfType(model, name).map((l) =>
            `${readable(entityOfIdType(model, l.identifierType) || l.identifierType)} (from ${readable(l.field)})`)
        : [];
      card.appendChild(qrow('div', { cls: 'ehead', key: 'type:' + name },
        h('span', { class: 'chip' }, readable(name)),
        h('span', { class: 'muted tiny' }, composite
          ? `${body.properties.length} field${body.properties.length === 1 ? '' : 's'}`
          : 'one value'),
        owner ? h('span', {
          class: 'chip entity', title: 'Open ' + readable(owner),
          onclick: () => openEntity(owner),
        }, h('i', { class: 'ic' }, entityIcon(model, owner)), 'identifier of ' + readable(owner)) : null,
        tags.length
          ? h('span', { class: 'muted tiny' }, ' · tags whatever carries it: ' + tags.join(', '))
          : null,
        h('span', { style: 'flex:1' }),
        h('span', { class: 'reveal' }, h('span', { class: 'tech' }, name), h('button', {
          class: 'btn tiny',
          onclick: () => { closeForms(); state.renamingType = name; render(); },
        }, 'Rename'),
        owner
          ? h('button', {
              class: 'btn tiny danger', disabled: true,
              title: `Remove the ${readable(owner)} entity instead — its identifier goes with it.`,
            }, 'Remove')
          : removeButton('custom-type:' + name, {
              label: 'Remove', title: 'Remove this custom type',
              onRemove: () => run(() => removeDefinition('custom-type-definition', model.id, name)),
            }))));
    }

    if (composite) {
      const where = 'field:' + name;
      card.appendChild(h('div', { class: 'erows' }, body.properties.map((field, i) => {
        // A field is always singular and always required — that is
        // what keeps a list of records the same length as the bindings
        // fanned out over it — so arity is not offered here.
        if (editingMember(where, field.name)) {
          return memberEditor(model, {
            member: field, where, allow: { arity: false }, types: fieldTypeOptions(model),
            onReplace: (next) => patch('custom-type-definition', name, (b) => {
              b.properties[i] = { name: next.name, propertyType: next.propertyType };
            }),
            onRename: (to) => renameMember('custom-type-definition', model.id, name, 'field', field.name, to),
          });
        }
        const cls = classifyType(model, field.propertyType);
        const isId = cls.kind === 'value' && !cls.composite && cls.isTag;
        // A standalone tag-marked type has no owning entity — nothing
        // to mark it with and nothing to name in the sentence below.
        const ownerEntity = isId ? cls.ownerEntity : null;
        const enumType = isStringEnumType(model, field.propertyType) ? field.propertyType : null;
        // A record field is its type — that one stays on screen even
        // here, because with it hidden the row would say nothing.
        return [
          qrow('div', { cls: 'erow', key: 'field:' + name + '.' + field.name },
            h('span', { class: 'nm' }, propertyWords(field.name)),
            h('span', {
              class: (ownerEntity ? 'chip entity' : 'chip') + ' editable',
              title: 'Rename or retype this field',
              onclick: () => openMember(where, field.name),
            }, ownerEntity ? h('i', { class: 'ic' }, entityIcon(model, ownerEntity)) : null,
              readable(field.propertyType)),
            isId ? h('span', { class: 'tiny muted' },
              ownerEntity
                ? ('identifies a ' + iconPrefix(entityIcon(model, ownerEntity)) + readable(ownerEntity)
                  + ' — every event carrying this is tagged with it')
                : 'a standalone tag — every event carrying this is tagged with it') : null,
            h('span', { style: 'flex:1' }),
            reveal(
              advanced() ? h('span', { class: 'tech' }, field.name) : null,
              h('button', {
              class: 'btn tiny danger',
              onclick: () => {
                if (body.properties.length === 1) {
                  return toast('A record needs at least one field. Remove the type instead.', true);
                }
                patch('custom-type-definition', name, (b) => {
                  b.properties = b.properties.filter((f) => f.name !== field.name);
                });
              },
            }, '×'))),
          enumType ? h('div', { class: 'use' },
            h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(model, enumType)) : null,
        ];
      })));

      let fname = '', ftype = 'string';
      card.appendChild(adderSlot('field:' + name, null, '+ field', () => h('div', { class: 'adder' },
        h('input', { type: 'text', placeholder: 'field name', oninput: (e) => { fname = e.target.value; } }),
        pick(fieldTypeOptions(model), ftype, (v) => { ftype = v; }),
        h('button', {
          class: 'btn', onclick: () => {
            if (!fname.trim()) return toast('Give the field a name.', true);
            patch('custom-type-definition', name, (b) => {
              b.properties.push({ name: toCamel(fname), propertyType: ftype });
            });
          },
        }, '+ Field'),
        h('span', { style: 'flex:1' }),
        h('span', { class: 'tiny muted' }, 'fields are single and required'))));
    } else if (isStringEnumType(model, name)) {
      // An enum is not a distinct form of type — it is a scalar whose
      // schema carries `enum` — so this is the same card as any other
      // scalar, just with a chip editor over that one keyword instead
      // of a raw-text view of the whole schema.
      card.appendChild(h('div', { class: 'irow' }, ...enumMemberChips(model, name)));
    } else {
      let text = JSON.stringify(body.schema == null ? { type: 'string' } : body.schema);
      card.appendChild(h('div', { class: 'adder' },
        h('input', {
          type: 'text', value: text, style: 'flex:1;font-family:var(--mono);font-size:11px',
          oninput: (e) => { text = e.target.value; },
        }),
        h('button', {
          class: 'btn', onclick: () => run(() => {
            let parsed;
            try { parsed = JSON.parse(text); }
            catch (e) { throw new DomainError('That is not valid JSON: ' + e.message); }
            updateDefinition('custom-type-definition', model.id, name, { ...body, schema: parsed });
          }),
        }, 'Save')));
    }

    // "Represented as a tag" applies only to the scalar form — a
    // composite is never itself a tag, only whichever of its fields are
    // (see the field rows above). Pinned on and undisabled for an
    // entity-owned type: it must stay a tag for the entity to be
    // bindable at all, so this is where that invariant is enforced in
    // the UI rather than only caught after the fact by validation.
    if (!composite) {
      card.appendChild(h('div', { class: 'irow' },
        h('span', { class: 'nm' }, 'represented as a tag'),
        h('label', { class: 'tiny muted' },
          h('input', {
            type: 'checkbox', checked: !!body.isTag, disabled: !!owner,
            onchange: (e) => patch('custom-type-definition', name, (b) => {
              if (e.target.checked) b.isTag = true; else delete b.isTag;
            }),
          }),
          owner ? ` required — this is ${readable(owner)}’s identifier` : '')));
      if (body.isTag && !owner) card.appendChild(tagSchemaField(name, body));
    }

    main.appendChild(card);
  }

  if (state.newType) {
    main.appendChild(inlineForm({
      question: 'Name',
      placeholder: state.newType === 'enum' ? 'enum name' : 'type name',
      showsIdentifier: true,
      onSubmit: (v) => {
        const typeName = toPascal(v);
        const form = state.newType;
        state.newType = null;
        run(() => addDefinition('custom-type-definition', model.id, typeName,
          form === 'composite'
            // A record needs a field to exist at all, so it starts with
            // one the modeler is expected to rename rather than with an
            // empty body the model would reject.
            ? { properties: [{ name: 'value', propertyType: 'string' }] }
            : form === 'enum'
              // Same for an enum: one member to rename, rather than a
              // legal-but-useless empty list.
              ? { schema: { type: 'string', enum: ['Member'] } }
              : { schema: { type: 'string' } }));
      },
      onCancel: () => { state.newType = null; render(); },
    }));
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newType = 'composite'; render(); },
      }, '+ New record'),
      h('button', {
        class: 'btn',
        onclick: () => { closeForms(); state.newType = 'enum'; render(); },
      }, '+ New enum'),
      h('button', {
        class: 'btn',
        onclick: () => { closeForms(); state.newType = 'scalar'; render(); },
      }, '+ New single value')));
  }
}

// What a composite field may be typed with: anything except another
// composite, since records do not nest.
function fieldTypeOptions(model) {
  return typeChoices(model)
    .filter((t) => {
      const cls = classifyType(model, t);
      return !(cls.kind === 'value' && cls.composite);
    })
    .map((t) => [t, readable(t)]);
}

// ---------- projections ----------
//
// A projection is the only kind of fold in this model. It holds one
// value, starts somewhere, and is advanced by the events it handles,
// over the query `tag IN (its parameters) AND type IN (handled
// events)`. Declare no parameters and the query carries no tag at all,
// which is what a global numbering is, and the only tagless query in a
// DCB model.
//
// An entity property is a *binding* to one of these — an entry naming
// a projection partitioned by that entity's own identifier. So there
// is one editor below, `projectionFields`, and the entity page and
// this page both mount it. A second form editing the same thing is
// exactly the drift two independent editors invite, and the way to not
// have that is to have one.
//
// Numbering is not a concept here, it is a use: a value set to the
// *successor* of what an event carried holds the next number to issue
// at every point in its life.
//
// What it holds, where it starts, how it is partitioned and which
// events move it are one decision rather than four — the value type
// decides which event properties are even offerable — so this editor
// collects a change and applies it on Save instead of as you type. A
// half-edited projection would otherwise be refused by the model on
// every keystroke.

// What a projection may hold: any simple type — booleans included —
// and any scalar value type, enums among them. A composite joins the
// list only when the projection is scripted: the declared operations
// act on a single value and there is none in a record of fields, but
// code has no such limit.
function projectionTypeOptions(model, { scripted } = {}) {
  return allTypeNames(model)
    .filter((t) => {
      const cls = classifyType(model, t);
      return cls.kind === 'value' ? (scripted || !cls.composite) : cls.kind === 'simple';
    })
    .map((t) => [t, readable(t)]);
}

// The JSON Schema a type bottoms out in, so the first value can be read
// as the number it is rather than as a string of digits. A composite
// has no single scalar schema to bottom out in — its value is a plain
// object matching its fields — so this reads null for one, which every
// caller here already treats as "not a number".
function underlyingSchema(model, typeName) {
  const cls = classifyType(model, typeName);
  if (cls.kind === 'simple') return { type: typeName };
  if (cls.kind === 'value' && !cls.composite) {
    return model['custom-type-definitions'][typeName].schema || { type: 'string' };
  }
  return null;
}


// Where a projection starts, as a chip rather than a bare word — so
// `nothing yet` is visibly not a value someone typed, and `""` is
// visibly one they did.
function initialValueChip(body) {
  // A derived projection has no start of its own — the predicate is
  // the whole story, so the chip says it.
  if (body.derived) return h('code', {}, conditionText(body.derived));
  if (body.script) return h('code', {}, JSON.stringify(body.script.initialState));
  const value = body.initialValue;
  if (value === null || value === undefined) {
    return h('span', { class: 'chip unset', title: 'No value yet — not the empty string' }, 'null');
  }
  if (Array.isArray(value)) {
    if (!value.length) return h('span', { class: 'chip unset' }, '[]');
    return h('span', {}, ...value.flatMap((element, i) => [
      i ? ' ' : null, h('span', { class: 'chip' }, operandWords(element)),
    ]));
  }
  return h('code', {}, operandWords(value));
}

// One typed slot of an initial value — the whole thing for a scalar
// projection, one element for a list. An enum is picked from its
// members, a boolean from yes/no, and anything else is typed and
// checked on the way out: text that does not belong to the type is
// refused rather than silently coerced.
//
