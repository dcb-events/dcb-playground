// page at once. Skipping is a decision, which is why it is a click.
function wizardBar(model, slice) {
  const wizard = state.wizard;
  const step = WIZARD_STEPS[wizard.upto];
  const skipping = step.empty(slice);
  // `flow-adder` puts the bar on the Up/Down path the rest of the page
  // already walks, so the arrows that move through rows and adders
  // reach Continue too.
  return h('div', { class: 'wizard-bar' },
    h('button', {
      class: 'btn primary flow-adder',
      onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
      onclick: () => { closeForms(); advanceWizard(model, slice); },
    }, skipping ? `Skip — ${step.skipWords} →` : 'Continue →'),
    h('button', {
      class: 'btn ghost tiny', title: 'Stop revealing step by step and show the whole command',
      onclick: () => { closeForms(); state.wizard = null; render(); },
    }, 'Show all steps'));
}

// ---------- the slice ----------

// A repaint tears #main down and rebuilds it, which drops whatever the
// keyboard was on — the element is gone, so the browser has nothing to
// blur from and focus falls back to the document, where the next Tab
// starts over at the top rather than continuing from where the user
// was. Restoring by position — the Nth focusable thing in #main, not
// which one it was — is what keeps Tab (and Shift+Tab) moving through
// the page instead of restarting at the command title on every edit.
function mainFocusStops() {
  const main = document.getElementById('main');
  if (!main) return [];
  return [...main.querySelectorAll('a[href], button, select, input, textarea, [tabindex]')]
    .filter((el) => !el.disabled && el.tabIndex !== -1 && el.offsetParent !== null);
}
function mainFocusRank() {
  const main = document.getElementById('main');
  if (!main || !main.contains(document.activeElement)) return null;
  const at = mainFocusStops().indexOf(document.activeElement);
  return at < 0 ? null : at;
}
function restoreMainFocusRank(rank) {
  if (rank === null) return;
  const stops = mainFocusStops();
  // `preventScroll` is the whole point of restoring by rank staying
  // invisible: the Nth stop after a repaint is often a different
  // element than before, and letting focus() bring it into view moved
  // the page under the reader on every edit.
  if (stops.length) stops[Math.min(rank, stops.length - 1)].focus({ preventScroll: true });
}

// A repaint, and the one thing that has to happen after every one of
// them whichever view it drew: bringing a row the interface moved you
// to on screen. It is out here because the painter below returns early
// once it knows which view it is drawing.
function render() {
  const focusRank = mainFocusRank();
  paintPage();
  restoreMainFocusRank(focusRank);
  sweepScriptEditors();
  if (!state.land) return;
  const selector = state.land;
  state.land = null;
  landOn(selector);
}

function paintPage() {
  const model = activeModel();
  // The splash also shows over a model that's still loaded — reached
  // from the brand mark, see the button below. Escape (and picking a
  // model, starting a new one, or loading one) clears `state.splash`
  // and lands back here with `model` unchanged.
  const showSplash = !model || state.splash;

  document.body.className = isDark() ? 'f-dark' : '';

  // Which model is open, front and center where the old dropdown used
  // to be. Off the splash it switches models, loads another, or starts
  // one; on the splash with a model still loaded, it is the way back
  // to it instead — no dialog needed for that trip.
  const modelSwitch = document.getElementById('model-switch');
  modelSwitch.innerHTML = '';
  modelSwitch.appendChild(h('button', {
    class: 'btn ghost', type: 'button',
    title: !model ? 'Load a model' : state.splash ? 'Back to ' + model.name : 'Switch or manage models',
    onclick: model && state.splash
      ? () => { state.splash = false; render(); }
      : () => { closeForms(); state.models = true; render(); },
  }, !model
    ? 'Load a model…'
    : state.splash
      ? ['← Back to ', h('span', { class: 'model-name' }, model.name)]
      : h('span', { class: 'model-name' }, model.name)));

  const tools = document.getElementById('tools');
  tools.innerHTML = '';
  const jump = document.getElementById('jump');
  jump.innerHTML = '';
  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  const menuToggle = document.getElementById('menu-toggle');
  menuToggle.innerHTML = '';

  document.querySelector('.layout').classList.toggle('no-rail', showSplash);

  if (showSplash) {
    // Nothing to search, share, or report a problem with while it's
    // up, and no rail to open — the splash is the entire page.
    actions.appendChild(settingsButton());
    document.getElementById('rail').innerHTML = '';
    const main = document.getElementById('main');
    main.innerHTML = '';
    main.className = '';
    renderSplash(main);
    renderModals();
    renderPalette();
    return;
  }

  // The rail's own toggle — visible only on a narrow screen, where the
  // rail is an off-canvas drawer rather than a permanent column. See
  // `.rail` and `.rail-backdrop` for the mobile layout.
  menuToggle.appendChild(h('button', {
    class: 'icon-btn menu-btn', type: 'button', title: 'Features and entities',
    'aria-label': 'Menu', 'aria-expanded': state.railOpen ? 'true' : 'false',
    onclick: () => { state.railOpen = !state.railOpen; render(); },
  }, h('span', { html: MENU_ICON_SVG })));

  // A scenario that no longer agrees with its command, or a loose end
  // nobody has tied — the one count of what needs attention, shown
  // only when there is any.
  const problemsBtn = problemsButton(model);
  if (problemsBtn) tools.appendChild(problemsBtn);

  jump.appendChild(h('button', {
    class: 'trigger', type: 'button', onclick: openPalette, 'aria-label': 'Quick open',
  }, h('span', { html: SEARCH_ICON_SVG }), h('span', { class: 'label' }, 'Quick open…'),
    h('span', { class: 'kbd' }, '⌘K')));

  actions.appendChild(h('button', {
    class: 'icon-btn', type: 'button', title: 'Import & export — ⌘S copies a link',
    'aria-label': 'Import and export', onclick: openImportExport,
  }, importExportIcon()));
  actions.appendChild(settingsButton());

  renderModals();
  renderPalette();

  const names = Object.keys(model['command-definitions']);
  if (state.view === 'slice' && (!state.slice || !names.includes(state.slice))) {
    state.slice = names[0] || null;
    state.tab = 'definition';
  }
  if (state.view === 'types' && !advanced()) state.view = 'slice';
  if (state.view === 'projections' && !advanced() && !Object.keys(model['projection-definitions']).length) {
    state.view = 'slice';
  }
  if (state.view === 'events' && !advanced() && !Object.keys(model['event-definitions']).length) {
    state.view = 'slice';
  }
  if ((state.view === 'coupling' || state.view === 'rulemap' || state.view === 'lifecycles')
      && (!advanced() || !names.length)) {
    state.view = 'slice';
  }
  // A thing removed from under its own page leaves the page with
  // nothing to show; the next one along is a better answer than a blank.
  if (state.view === 'entity' && !model['entity-definitions'][state.entity]) {
    const rest = Object.keys(model['entity-definitions']).sort();
    state.entity = rest[0] || null;
    if (!state.entity) state.view = 'slice';
  }
  renderRail();

  const main = document.getElementById('main');
  main.innerHTML = '';
  main.className = 'slice'
    + (state.view === 'coupling' || state.view === 'rulemap' || state.view === 'lifecycles' ? ' wide' : '');

  if (state.view === 'sandbox') return renderSandbox(model, main);
  if (state.view === 'entity') return renderEntity(model, main);
  if (state.view === 'types') return renderCustomTypes(model, main);
  if (state.view === 'projections') return renderProjections(model, main);
  if (state.view === 'events') return renderEvents(model, main);
  if (state.view === 'coupling') return renderCoupling(model, main);
  if (state.view === 'rulemap') return renderRuleMap(model, main);
  if (state.view === 'lifecycles') return renderLifecycles(model, main);

  if (!state.slice) {
    // With nothing to keep track of, a command has no identifier to be
    // given and every event it records is tagless — a model that cannot
    // say what any of it is *about*. So an empty model is pointed at a
    // thing first, and only then at what someone can do to one.
    if (!Object.keys(model['entity-definitions']).length) {
      main.appendChild(h('div', { class: 'blank' },
        h('h2', {}, 'Nothing here yet'),
        h('p', { class: 'muted small' },
          'Start with something the model keeps track of — a course, a student, an order. '
          + 'It brings an identifier with it, and that identifier is what every event about '
          + 'one of them is tagged with. Commands come next, and everything else gets built '
          + 'from inside them.'),
        state.newEntityAt === 'blank'
          ? inlineForm({
              question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
              showsIdentifier: true,
              onSubmit: (v) => {
                state.newEntityAt = null;
                const created = createEntity(model, v);
                if (created) openEntity(created);
              },
              onCancel: () => { state.newEntityAt = null; render(); },
            })
          : h('div', { class: 'adder' },
              h('button', {
                class: 'btn primary',
                onclick: () => { closeForms(); state.newEntityAt = 'blank'; render(); },
              }, '+ First entity'),
              // Not a dead end: a model whose first move really is a
              // command should not have to argue with the page.
              h('button', { class: 'btn ghost', onclick: () => beginNewCommand(model) },
                'or start with a command'))));
      return;
    }
    main.appendChild(h('div', { class: 'blank' },
      h('h2', {}, 'Nothing here yet'),
      h('p', { class: 'muted small' },
        'Start with something someone can do. Name it and the rest of the model — what it '
        + 'reads, what it decides, what it records, what it changes, the things themselves — '
        + 'gets built from inside it.'),
      h('button', { class: 'btn primary', onclick: () => beginNewCommand(model) }, '+ First command')));
    return;
  }

  const slice = sliceOf(model, state.slice);
  main.appendChild(h('header', {},
    state.renamingCommand === slice.name
      // A command is nearly a leaf on the reference graph — only its
      // scenarios name one — so "every reference" is a short list here.
      ? renameDefinitionForm(model, 'command-definition', slice.name, {
          stateKey: 'renamingCommand', after: (next) => { state.slice = next; },
        })
      : qrow('div', { cls: 'row', key: 'cmd:' + slice.name },
          h('button', {
            class: 'icon-btn', title: 'Choose the mark this is shown with',
            onclick: () => {
              const open = state.commandIconPicker === slice.name;
              closeForms();
              state.commandIconPicker = open ? null : slice.name;
              render();
            },
          }, commandIcon(model, slice.name)),
          h('div', { class: 'name' }, named(slice.name)),
          h('span', { class: 'grow' }),
          // The command itself. Nothing in the model references a
          // command, so removal is never refused — which is exactly
          // why it asks first.
          reveal(
            h('button', {
              class: 'btn tiny',
              onclick: () => { closeForms(); state.renamingCommand = slice.name; render(); },
            }, 'Rename'),
            removeButton('command:' + slice.name, {
              label: 'Remove command',
              title: 'Remove this command. The events it recorded and the things it read stay.',
              onRemove: () => run(() => {
                removeDefinition('command-definition', model.id, slice.name);
                state.slice = null;
              }),
            }))),
    h('div', { class: 'muted small summary' },
      'Looks at ' + (slice.reads.length || 'nothing')
      // Round trips, not bindings: a command that reads three things
      // in one go is cheaper than one that reads two in sequence, and
      // the summary should not hide the difference.
      + (slice.rounds.length > 1 ? ` in ${slice.rounds.length} passes over the log` : '')
      + ' · '
      + slice.rules.length + ' rule' + (slice.rules.length === 1 ? '' : 's') + ' · records '
      + (slice.emits.map((e) => readable(e.emission.name)).join(', ') || 'nothing')),
    featureLine(slice)));

  if (state.commandIconPicker === slice.name) {
    main.appendChild(commandIconPicker(model, slice.name, model['command-definitions'][slice.name]));
  }

  const commandAdvisories = advisoryBanner(model, 'command-definition', slice.name);
  if (commandAdvisories) main.appendChild(commandAdvisories);

  main.appendChild(scenarioTabs(model, slice));

  if (state.tab === 'scenarios') {
    main.appendChild(scenarioPanel(model, slice.name));
    paintLit();
    return;
  }

  // A command still in its wizard shows only the steps answered so
  // far, plus the bar that answers (or skips) the current one. This is
  // presentation, never model: every definition underneath is whole,
  // and "Show all steps" is always one click away. Everyone else gets
  // the full page — which is the check-your-answers view a finished
  // command reads as.
  const wizard = state.wizard && state.wizard.slice === slice.name ? state.wizard : null;
  if (wizard) {
    for (let i = 0; i <= Math.min(wizard.upto, WIZARD_STEPS.length - 1); i++) {
      main.appendChild(WIZARD_STEPS[i].paint(model, slice));
    }
    main.appendChild(wizardBar(model, slice));
  } else {
    main.appendChild(stepTrigger(model, slice));
    main.appendChild(stepReads(model, slice));
    main.appendChild(stepRules(model, slice));
    main.appendChild(stepEmits(model, slice));
    main.appendChild(stepChanges(model, slice));
    if (advanced()) main.appendChild(stepConsistency(model, slice));
    else main.appendChild(h('div', { class: 'muted tiny', style: 'padding-left:26px' },
      'Switch to Advanced to see the consistency boundary this command derives.'));
  }

  // A pinned reference outlives the repaint that follows clicking it.
  paintLit();
}

// Where this command sits. Moving it happens in the rail — drag the
// command onto a feature heading there — so the page only states it.
function featureLine(slice) {
  const current = featureOf(slice.body);
  return h('div', { class: 'feature-of' },
    h('span', { class: 'muted tiny' }, current === UNGROUPED
      ? 'ungrouped — drag it onto a feature in the list to place it'
      : 'part of ' + current));
}

function step(kind, title, ...body) {
  return h('section', { class: 'step ' + kind },
    h('span', { class: 'dot' }),
    h('div', { class: 'shead' }, h('h4', {}, title)),
    ...body);
}

function stepTrigger(model, slice) {
  const where = 'payload:' + slice.name;
  // A stale reference from before `removeEventField` existed would
  // otherwise refuse this removal for a reason no longer visible
  // anywhere — see the comment there.
  const dropProperty = (i) => patchSlice((b) => {
    pruneDanglingEmissionParameters(model, b);
    b.properties.splice(i, 1);
  });
  const rows = slice.payload.map((p, i) => {
    if (editingMember(where, p.name)) {
      return memberEditor(model, {
        member: p, where,
        onReplace: (next) => patchSlice((b) => { b.properties[i] = next; }),
        onRename: (name) => renameMember('command-definition', model.id, slice.name, 'property', p.name, name),
      });
    }
    const enumType = isStringEnumType(model, p.propertyType) ? p.propertyType : null;
    return [
      qrow('div', {
        cls: 'field', key: 'in:' + p.name, src: 'param:' + p.name,
        onRemove: () => dropProperty(i),
      },
        h('span', { class: 'nm' }, propertyWords(p.name)),
        // The type rides the row itself rather than the reveal: what an
        // input *is* is part of reading the command, not machinery. It
        // sits right after the name's fixed-width column — a second
        // column beside the names, not a tag stranded at the far edge.
        h('span', {
          class: 'type-tag', title: 'Rename or retype this input',
          onclick: (e) => { e.stopPropagation(); openMember(where, p.name); },
        }, readable(typeLabel(p))),
        h('span', { class: 'grow', style: 'flex:1' }),
        reveal(
          advanced() ? h('span', { class: 'tech' }, p.name) : null,
          h('button', { class: 'btn tiny danger', onclick: () => dropProperty(i) }, '×'))),
      enumType ? h('div', { class: 'use' },
        h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(model, enumType)) : null,
    ];
  });
  if (!rows.length) rows.push(h('div', { class: 'empty' }, 'Takes no input.'));

  return step('trigger', 'Someone asks for this, providing',
    h('div', { class: 'card command' }, rows,
      adderSlot('in', 'trigger', '+ input', () => propertyAdder(model, {
        label: '+ Add input', draftKey: 'in:' + slice.name,
        onAdd: (property) => patchSlice((b) => b.properties.push(property)),
        onRemoveLast: slice.payload.length ? () => dropProperty(slice.payload.length - 1) : undefined,
        // Enter on an empty name means "done with these". Mid-wizard
        // that is the Continue — the reads step it would jump to is
        // not revealed yet, so revealing it *is* the jump.
        onEmptyEnter: () => {
          if (state.wizard && state.wizard.slice === slice.name) {
            closeForms();
            return advanceWizard(model, slice);
          }
          beginReadAdder();
        },
      }))));
}

// A query is one hover away rather than one more line on the page:
// the glyph marks everything that goes to the log, and the popover
// states what it asks. Hover or focus peeks, a click pins it across
// repaints, Escape or a second click lets go. The panel is in the
// document either way — CSS hides it — so it costs a mark, not a row.
function queryPopover(key, title, ...lines) {
  const on = state.queryPop === key;
  return h('span', { class: 'qpop' + (on ? ' on' : '') },
    h('button', {
      class: 'qbtn', title: 'The DCB query behind this',
      'aria-expanded': on ? 'true' : 'false',
      onclick: (e) => {
        e.stopPropagation();
        state.queryPop = on ? null : key;
        render();
      },
    }, h('span', { class: 'qico', html: SEARCH_ICON_SVG })),
    h('span', { class: 'qpanel dcb', onclick: (e) => e.stopPropagation() },
      title ? h('div', { class: 'k qtitle' }, title) : null,
      ...lines));
}

// One DCB query, spelled the same everywhere one appears: the tags
// ANDed, then the event types — "any type" when the query is tag-only,
// and a plain word about reading the whole log when it is type-only.
// Every place that shows a query goes through here, so a reader who
// has learned the spelling once has learned all of them.
function dcbQueryWords(item) {
  const tags = item.tags || [];
  const types = item.types || [];
  return h('span', {},
    tags.length
      ? h('span', {}, h('span', { class: 'k' }, 'tag '),
          ...tags.flatMap((tag, j) => [
            j ? h('span', { class: 'k' }, ' and ') : null,
            h('span', { class: 't' }, tag),
          ]),
          h('span', { class: 'k' }, ' and '))
      : null,
    h('span', { class: 'y' }, types.join(', ') || 'any type'),
    tags.length ? null : h('span', { class: 'k' }, '  (no tag — the whole log)'),
    item.fannedOut ? h('span', { class: 'k' }, '  — one per element') : null);
}

// One binding, as a card. `index` is its position in the authored
// boundary, which is what removal needs — the rounds regroup the cards
// but never renumber the list underneath them.
function readCard(model, slice, binding, index, waitsFor) {
  const r = readParts(model, slice.body, binding);
  const queryItem = (slice.dcb.items || []).find((item) => item.alias === binding.alias);
  const sentence = r.projection
    ? h('span', { class: 'sentence' },
        projectionRef(model, r.projection, { cls: 'chip projection' }),
        ' as ', h('span', { class: 'op' }, r.alias),
        // No arguments means no tag: the query is scoped by event type
        // alone, which is what a global numbering is.
        r.arguments.length
          ? h('span', {}, h('span', { class: 'verb' }, ' — for '),
              ...r.arguments.flatMap((arg, i) => [
                i ? h('span', { class: 'verb' }, ' and ') : null,
                opRef((binding.arguments || {})[arg.name], null, arg.words),
              ]))
          : h('span', { class: 'verb' }, ' — the whole log'))
    : h('span', { class: 'sentence' },
        entityRef(model, r.entity),
        ' as ', h('span', { class: 'op' }, r.alias),
        h('span', { class: 'verb' }, r.plural ? ' — one for each ' : ' — identified by '),
        opRef(binding.id, null, r.from),
        r.excluding ? h('span', {}, h('span', { class: 'verb' }, ' except '),
          opRef(binding.excluding, null, r.excluding)) : null,
        // The declared absence, said where the read is: an unset
        // identifier binds nothing here instead of erroring, and rules
        // over this alias step aside.
        binding.isOptional ? h('span', { class: 'verb' }, ' — may be absent') : null,
        // Arguments only appear on a binding that reads something
        // scripted, so the sentence names them rather than hiding them
        // behind the property that asked.
        r.arguments.length
          ? h('span', {}, h('span', { class: 'verb' }, ' — with '),
              ...r.arguments.flatMap((arg, i) => [
                i ? h('span', { class: 'verb' }, ' and ') : null,
                opRef((binding.arguments || {})[arg.name], null, `${arg.name} = ${arg.words}`),
              ]))
          : null);

  return h('div', { class: 'card ' + (r.projection ? 'projection' : 'entity'),
      'data-src': 'alias:' + binding.alias },
    qrow('div', { cls: 'row', key: 'read:' + binding.alias },
      sentence,
      // The query this read contributes, one hover away — stated on
      // the read itself in Advanced, so "what does binding this cost?"
      // is answered where the binding is, not only in the union at the
      // foot of the page.
      advanced() && queryItem
        ? queryPopover('read:' + binding.alias, 'what this binding queries',
            h('div', {}, dcbQueryWords(queryItem)))
        : null,
      h('span', { class: 'grow' }),
      reveal(
        h('button', {
          class: 'btn tiny',
          onclick: () => {
            closeForms();
            state.editBinding = binding.alias;
            render();
          },
        }, 'Edit'),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchSlice((b) => { b.boundary.splice(index, 1); }),
        }, '×'))),
    state.editBinding === binding.alias ? bindingEditor(model, slice, binding, index) : null,
    // Which read this one had to wait for. The round header carries
    // the cost; this carries the reason, and stays useful once a round
    // holds more than one card.
    (waitsFor || []).length
      ? h('div', { class: 'waits' }, '↳ needs ',
          ...waitsFor.flatMap((alias, i) => [
            i ? ' and ' : null, h('span', { class: 'op' }, alias),
          ]))
      : null);
}

// A binding opened for editing. Everything about a read is here: what
// it is called, where its identifier comes from, and the two fields
// that only apply in particular circumstances.
//
// `excluding` is offered only on a binding that fans out — there is
// nothing to exclude something *from* otherwise — and an argument row
// appears once for each argument a scripted property it reads asks
// for, which is the same rule the model enforces. A field that could
// not mean anything here is left off the page rather than shown and
// then refused.
function bindingEditor(model, slice, binding, index) {
  const close = () => { state.editBinding = null; render(); };
  const expected = binding.projection ? [] : argumentsExpected(model, slice.body, binding);
  const draft = state.bindingDraft && state.bindingDraft.alias === binding.alias
    ? state.bindingDraft
    : (state.bindingDraft = expected.reduce(
        (acc, argument) =>
          draftFromOperand(acc, 'arg:' + argument.name, (binding.arguments || {})[argument.name]),
        {
          alias: binding.alias,
          name: binding.alias,
          ...draftFromOperand({}, 'id', binding.id),
          ...draftFromOperand({}, 'excluding', binding.excluding),
        }
      ));

  const above = operandChoicesAbove(model, slice, index);
  const fanned = isFannedOut(model, slice.body, binding);
  // Each slot knows the type it takes, so each offers only that: the
  // identifier slot the entity's own id type — lists included, a list
  // is how a binding fans out — the exclusion one of them, an argument
  // whatever the script declared.
  const idType = binding.projection ? null : idTypeOf(model, binding.entity);
  const idChoices = binding.projection
    ? [] : choicesOfType(model, slice, above, idType, { list: true });
  const excludingChoices = binding.projection
    ? [] : choicesOfType(model, slice, above, idType);

  const apply = (mutate) => patchSlice((b) => mutate(b.boundary[index]));

  return h('div', { class: 'member-editor' },
    h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, style: 'width:130px',
        oninput: (e) => { draft.name = e.target.value; },
      }),
      h('button', {
        class: 'btn tiny',
        title: 'Rename this binding. The alias is local to this command, so nothing else moves.',
        onclick: () => {
          const next = toCamel(draft.name);
          if (!next) return toast('Give the binding a name.', true);
          if (next === binding.alias) return close();
          if (slice.reads.some((b) => b.alias === next)) {
            return toast(`"${next}" is already bound in this command.`, true);
          }
          state.bindingDraft = null;
          state.editBinding = next;
          patchSlice((b) => {
            // Every operand naming the old alias moves with it. The
            // alias is this command's own word for the instance, so
            // nothing outside the command can be referring to it.
            forEachCommandOperand(b, (operand) => {
              if (operandSource(operand) === 'alias-property' && operand.alias === binding.alias) {
                operand.alias = next;
              }
            });
            b.boundary[index].alias = next;
          });
        },
      }, 'Rename')),

    binding.projection ? null : h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'identified by'),
      ...operandPicker(idChoices, draft, 'id', { allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'id');
          if (operand === undefined) return toast('Pick where the identifier comes from.', true);
          apply((b) => { b.id = operand; });
        },
      }, 'Set')),

    // Whether an unset identifier is expected. Off, it is the loud
    // error it always was; on, the binding binds nothing, rules over
    // it hold vacuously, and reading a property of it yields null. A
    // fanned binding is not offered the choice — an empty list already
    // binds nothing.
    binding.projection || fanned ? null : h('div', { class: 'adder' },
      h('label', { class: 'muted tiny', style: 'display:flex;align-items:center;gap:4px' },
        h('input', {
          type: 'checkbox', checked: !!binding.isOptional,
          onchange: (e) => {
            const on = e.target.checked;
            apply((b) => { if (on) b.isOptional = true; else delete b.isOptional; });
          },
        }),
        'may be absent'),
      h('span', { class: 'muted tiny' },
        'an unset identifier binds nothing instead of erroring — rules over this binding are skipped')),

    binding.projection || !fanned ? null : h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'except'),
      ...operandPicker(excludingChoices, draft, 'excluding', { placeholder: '— nothing —', allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'excluding');
          apply((b) => {
            if (operand === undefined) delete b.excluding; else b.excluding = operand;
          });
        },
      }, 'Set'),
      h('span', { class: 'muted tiny' },
        'drops one from the set — a course rescheduling itself is in every subscriber’s list')),

    ...expected.map((argument) => h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'with ', h('code', {}, argument.name)),
      ...operandPicker(choicesOfType(model, slice, above, argument.propertyType),
        draft, 'arg:' + argument.name, { allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'arg:' + argument.name);
          apply((b) => {
            const next = { ...(b.arguments || {}) };
            if (operand === undefined) delete next[argument.name];
            else next[argument.name] = operand;
            if (Object.keys(next).length) b.arguments = next; else delete b.arguments;
          });
        },
      }, 'Set'),
      h('span', { class: 'muted tiny' },
        `required — a scripted property it reads asks for one ${argument.propertyType}`))),

    h('div', { class: 'adder' },
      h('button', { class: 'btn ghost tiny', onclick: () => { state.bindingDraft = null; close(); } }, 'Done')));
}

// Headers appear only when there is more than one round: a lone
// "first" over a single card is noise, and most commands decide in one
// trip. Shown in both modes — "we must read the courses before we know
// which students to look at" is a fact about the domain, not about the
// store.
const ROUND_WORDS = ['first', 'then, using what came back', 'then again'];
function roundLabel(index, total) {
  if (index < ROUND_WORDS.length) return ROUND_WORDS[index];
  return `and again (${index + 1} of ${total})`;
}

// What Enter on an empty property name means: that list is done, and
// the next thing a command needs is what it reads. Opens the same
// adder "+ look at something" opens, and reaches for its first control —
// best effort, since a model with no entity yet offers a button in its
// place, not a field.
function beginReadAdder() {
  closeForms();
  state.adder = 'read';
  render();
  setTimeout(() => {
    const el = document.querySelector('.step.reads select, .step.reads input');
    if (el) el.focus();
  }, 0);
}

function stepReads(model, slice) {
  const rounds = slice.rounds || [];
  const indexOfBinding = new Map(slice.reads.map((b, i) => [b, i]));

  let cards;
  if (rounds.length > 1) {
    cards = rounds.flatMap((round, i) => [
      h('div', { class: 'round-head' },
        h('span', { class: 'rule' }),
        h('span', { class: 'label' }, roundLabel(i, rounds.length))),
      ...round.map((entry) =>
        readCard(model, slice, entry.binding, indexOfBinding.get(entry.binding), entry.waitsFor)),
    ]);
  } else {
    cards = slice.reads.map((binding, i) => readCard(model, slice, binding, i, []));
  }
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Looks at nothing — it decides unconditionally.'));

  const sources = [
    ...payloadChoices(model, slice.payload),
    ...slice.reads.flatMap((b) => {
      if (b.projection) return [[JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]];
      const entity = model['entity-definitions'][b.entity];
      return (entity ? entity.properties : []).map((p) =>
        [JSON.stringify({ alias: b.alias, property: p.name }),
          memberWords(b.alias, p.name), entityIcon(model, b.entity)]);
    }),
  ];
  const entityNames = Object.keys(model['entity-definitions']).sort();
  const projectionNames = Object.keys(model['projection-definitions']).sort();
  // Projections are offered in the same picker as entities, prefixed
  // so the two never look like the same kind of thing.
  const readables = [
    ...entityNames.map((n) => [n, readable(n), entityIcon(model, n)]),
    ...projectionNames.map((n) => ['projection:' + n, readable(n) + ' (projection)']),
  ];
  // Held in `state` rather than in a local: picking a projection has to
  // repaint — the form below it changes shape — and a local would be
  // reset by the very repaint it asked for.
  const draft = state.readDraft && state.readDraft.slice === slice.name
    ? state.readDraft
    : (state.readDraft = {
        slice: slice.name,
        entity: readables.length ? readables[0][0] : '',
        source: '',
      });
  if (!readables.some(([v]) => v === draft.entity)) {
    draft.entity = readables.length ? readables[0][0] : '';
  }

  // A projection asks for one operand per parameter — none at all
  // when it has none, which is what a global numbering looks like.
  const chosenProjection = draft.entity.startsWith('projection:')
    ? model['projection-definitions'][draft.entity.slice('projection:'.length)]
    : null;
  const parameters = chosenProjection ? (chosenProjection.parameters || []) : [];
  // What identifies the chosen thing is a type, so only sources of
  // that type are offered — with the first one already picked, which
  // is the whole answer when the payload carries exactly one such id.
  // A parameter narrows the same way, minus lists: a projection
  // binding reads one partition, so there is no fan-out there.
  const idSources = !chosenProjection && draft.entity
    ? choicesOfType(model, slice, sources, idTypeOf(model, draft.entity), { list: true })
    : [];
  const parameterSources = new Map(parameters.map((p) =>
    [p.name, choicesOfType(model, slice, sources, p.propertyType)]));
  if (!idSources.some(([v]) => v === draft.source)) {
    draft.source = idSources.length ? idSources[0][0] : '';
  }
  for (const p of parameters) {
    const key = 'arg:' + p.name;
    if (draft[key] && !parameterSources.get(p.name).some(([v]) => v === draft[key])) {
      delete draft[key];
    }
  }
  const argChoice = (p) => draft['arg:' + p.name]
    || ((parameterSources.get(p.name)[0] || [])[0]);

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'reads') {
    body.push(inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => {
        state.newEntityAt = null;
        const created = createEntity(model, v);
        // The entity was made in order to be read, so the read adder
        // comes back with it already picked — the command being
        // defined never left the screen, and the gesture that was
        // interrupted resumes exactly one choice further along.
        if (created) {
          state.adder = 'read';
          // The source stays open: the next paint narrows the choices
          // to the fresh entity's own identifier type and picks the
          // first of them, when the command already carries one.
          state.readDraft = { slice: slice.name, entity: created, source: '' };
          render();
        }
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else if (!entityNames.length) {
    // With nothing to choose between, a picker whose only row is
    // "+ New…" could never fire — so offer the button itself.
    body.push(h('div', { class: 'card' }, h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'Nothing to look at yet.'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'reads'; render(); },
      }, '+ New entity'))));
  } else {
    // The push itself, shared by Enter, the button, and the
    // leave-the-row commit — which passes `quiet` because a commit
    // that fired on the way to another control must not then steal
    // focus back to this one.
    const record = (quiet) => {
      if (chosenProjection) {
        const name = draft.entity.slice('projection:'.length);
        const args = {};
        for (const p of parameters) {
          args[p.name] = JSON.parse(argChoice(p));
        }
        patchSlice((b) => b.boundary.push({
          alias: uniqueAlias(defaultAlias(name), b.boundary.map((x) => x.alias)),
          projection: name, arguments: args }));
      } else {
        const entity = draft.entity;
        const source = draft.source;
        patchSlice((b) => b.boundary.push({
          alias: uniqueAlias(defaultAlias(entity), b.boundary.map((x) => x.alias)),
          entity, id: JSON.parse(source) }));
      }
      if (!quiet) focusReadAdderButton();
    };
    // Touched and complete, so a read someone picked out and then
    // clicked past is a read, not a lost thought. Untouched defaults
    // stay a proposal.
    draft.ready = () => {
      if (!draft.touched || !draft.entity) return false;
      if (chosenProjection) {
        return parameters.every((p) => argChoice(p));
      }
      return !!draft.source;
    };
    draft.commit = () => record(true);

    // Once something is chosen, Enter anywhere in the row reads it — the
    // same as clicking the button — so a read picked entirely from the
    // keyboard never needs the mouse to land.
    const submit = () => {
      if (!draft.entity) return toast('Pick something to look at.', true);
      if (chosenProjection) {
        for (const p of parameters) {
          if (!argChoice(p)) {
            return toast(`Say what ${readable(draft.entity.slice('projection:'.length))} `
              + 'is kept separately for.', true);
          }
        }
      } else if (!draft.source) {
        return toast('Pick a thing and where its id comes from.', true);
      }
      state.readDraft = null;
      record(false);
    };
    // A read just added leaves the form open for the next one, freshly
    // reset to the first entity again — so the button, not the entity
    // picker, is where Enter should leave the keyboard: Tab from here
    // reaches the next step directly, and Shift+Tab still reaches the
    // reset picker for anyone who does want another read.
    function focusReadAdderButton() {
      // Direct child on purpose: only the adder's own button is meant,
      // never one a picker might nest inside the same card.
      const btn = document.querySelector('.step.reads .card .adder > button');
      if (btn) btn.focus();
    }

    body.push(adderSlot('read', 'reads', '+ look at something', () =>
      h('div', { class: 'card' }, h('div', {
        class: 'adder',
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } },
      },
        pick([...readables, [NEW, '+ New entity…']], draft.entity, (v) => {
          if (v === NEW) { closeForms(); state.newEntityAt = 'reads'; return render(); }
          draft.entity = v;
          draft.touched = true;
          render();
        }),
        chosenProjection
          ? (parameters.length
              ? parameters.flatMap((p) => [
                  h('span', { class: 'muted tiny' }, 'for its ' + propertyWords(p.name)),
                  pick(parameterSources.get(p.name), argChoice(p),
                    (v) => { draft['arg:' + p.name] = v; draft.touched = true; },
                    parameterSources.get(p.name).length
                      ? null : `— no ${propertyWords(p.propertyType)} in scope yet —`),
                ])
              : h('span', { class: 'muted tiny' }, '— the whole log, no tag'))
          : [
              h('span', { class: 'muted tiny' }, 'identified by'),
              pick(idSources, draft.source, (v) => { draft.source = v; draft.touched = true; },
                idSources.length
                  ? null : `— no ${propertyWords(idTypeOf(model, draft.entity))} in scope yet —`),
            ],
        h('button', { class: 'btn', onclick: submit }, '+ Look at something')))));
  }
  return step('reads', 'To decide, it looks at', ...body);
}

function stepRules(model, slice) {
  const cards = slice.rules.map((condition, i) => {
    if (state.editRule === i) return h('div', { class: 'card rule' }, ruleEditor(model, slice, i));
    const p = conditionParts(condition);
    const quantifier = quantifierWords(model, slice.body, condition);
    // A rule over an alias declared "may be absent" does not decide on
    // the unset case — it steps aside. Said here, on the rule, so the
    // skip the boundary's flag implies is visible where it applies.
    const optionalAliases = uniq(conditionOperands(condition)
      .filter((operand) => operandSource(operand) === 'alias-property')
      .map((operand) => operand.alias))
      .filter((alias) => (slice.body.boundary || []).some((b) => b && b.alias === alias && b.isOptional));
    return h('div', { class: 'card rule' },
      qrow('div', { cls: 'row', key: 'rule:' + i },
        h('span', { class: 'sentence' },
          quantifier ? h('span', { class: 'verb' }, quantifier + ', ') : null,
          opRef(condition.leftHandSide, null, p.left), ' ', h('span', { class: 'verb' }, p.verb),
          p.right ? h('span', {}, ' ', opRef(condition.rightHandSide, null, p.right)) : null,
          optionalAliases.length
            ? h('span', { class: 'muted tiny' },
                ' — skipped when ' + optionalAliases.map(propertyWords).join(' or ') + ' is absent')
            : null),
        h('span', { class: 'grow' }),
        reveal(
          h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.editRule = i;
              const opened = draftFromOperand(
                { predicate: condition.predicate, negate: !!condition.negate },
                'left', condition.leftHandSide);
              // An `equalsAny` right-hand side is a literal list; its
              // entries seed the membership widget, not the picker.
              if (Array.isArray(condition.rightHandSide)) {
                opened.right = '';
                opened.rightEntries = condition.rightHandSide.map((entry) =>
                  entry !== null && typeof entry === 'object' ? entry : String(entry));
              } else {
                draftFromOperand(opened, 'right', condition.rightHandSide);
              }
              state.ruleDraft = opened;
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger',
            onclick: () => patchSlice((b) => { b.conditions.splice(i, 1); }),
          }, '×'))));
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'No rules — always allowed.'));

  return step('rules', 'It is only allowed if', h('div', {}, cards),
    adderSlot('rule', 'rules', '+ rule', () => h('div', { class: 'card' }, ruleEditor(model, slice, null))));
}

// One condition, open for editing — the same form whether it already
// exists or is being written for the first time.
//
// Both sides are picked from what the command has read, plus a typed
// literal: "fewer than 10 subscribers" is a rule about a number nobody
// declared anywhere, so it has to be typeable. A unary predicate takes
// no right-hand side at all, so that half of the form goes away when
// one is chosen rather than being ignored.
//
// `target` says which condition list the row belongs to: the command's
// own rules by default, or one emission's guard (`when`) — a guard is
// a condition in every respect this form cares about, so it is the
// same form, writing somewhere else.
function ruleEditor(model, slice, index, target) {
  const targetList = target ? target.list : (b) => b.conditions;
  const addLabel = target && target.addLabel ? target.addLabel : 'Add rule';
  // A rule being edited always has a draft; a rule about to be created
  // grows one the first time it is painted, and keeps it across every
  // repaint a keystroke causes from then on.
  const draft = state.ruleDraft || (state.ruleDraft = { predicate: 'equals', negate: false, left: '', right: '' });
  const scope = operandChoicesAbove(model, slice);
  // A rule's left side says what it's about, and that's always
  // something read — a value the command was merely given belongs on
  // the right, compared against. Left keeps only what came off the
  // boundary, not the "given · …" entries `scope` also carries for the
  // right side's sake.
  const leftScope = scope.filter(([v]) => !('parameterName' in JSON.parse(v)));
  const leftType = resolveOperandType(draftOperand(draft, 'left'),
    { boundary: slice.reads, commandProperties: slice.payload, model });

  // The predicate list narrows to what the left side's type supports —
  // "starts with" against an integer could never be true — and the
  // current choice is pulled back onto the list when it no longer fits,
  // the same way a stale entity/source choice snaps back elsewhere.
  const predicateChoices = BINARY_PREDICATES.concat(UNARY_PREDICATES)
    .filter((p) => predicatesForType(leftType).includes(p));
  if (!predicateChoices.includes(draft.predicate)) {
    draft.predicate = predicateChoices[0] || draft.predicate;
  }
  const unary = UNARY_PREDICATES.includes(draft.predicate);
  // `equalsAny` compares against a literal list, so its right half is
  // a membership widget rather than the operand picker: checkboxes
  // over the enum's members where the left side names an enum, typed
  // rows anywhere else.
  const membership = draft.predicate === 'equalsAny';

  // The membership entries, read the way `draftOperand` reads a
  // literal: enum-member references pass through, text coerces.
  const entryOperands = () => (draft.rightEntries || []).map((entry) => {
    if (entry !== null && typeof entry === 'object') return entry;
    const text = String(entry).trim();
    if (text === '') return undefined;
    if (/^-?\d+(\.\d+)?$/.test(text)) return Number(text);
    if (/^(true|false)$/i.test(text)) return /^true$/i.test(text);
    return text;
  }).filter((entry) => entry !== undefined);

  // The right side is filtered to what the predicate demands of it —
  // the same type as the left side for most predicates, a bare integer
  // for the count predicates, and so on — so a capacity (an integer)
  // does not sit alongside a list of ids as things to compare it with.
  // Whatever the left side already names is dropped too: "capacity
  // equals capacity" is never a rule anyone meant to write.
  const rightType = rightHandExpectedType(draft.predicate, leftType);
  const rightScope = (rightType
    ? scope.filter(([v]) => {
        const resolved = resolveOperandType(JSON.parse(v),
          { boundary: slice.reads, commandProperties: slice.payload, model });
        return resolved && resolved.propertyType === rightType.propertyType
          && resolved.isList === rightType.isList;
      })
    : scope).filter(([v]) => v !== draft.left);
  // Enum options on the right only make sense once the left side names
  // an enum-typed property, and only that property's own enum —
  // offering every enum's members would let "course · capacity equals
  // shipped" through, which nothing could ever satisfy.
  const leftOperand = draftOperand(draft, 'left');
  const leftPropertyName = leftOperand && (leftOperand.property || leftOperand.parameterName);
  const enumMembers = leftType ? enumMembersFor(model, leftType.propertyType) : null;
  const enums = (enumMembers && rightType && !rightType.isList
    && rightType.propertyType === leftType.propertyType)
    ? enumMembers.map((m) =>
        [JSON.stringify({ enumMember: m }), propertyWords(leftPropertyName) + ' · ' + readable(m)])
    : [];
  const rightRows = [...rightScope, ...enums];
  if (draft.right && draft.right !== LITERAL && !rightRows.some(([v]) => v === draft.right)) {
    draft.right = '';
  }

  const close = () => {
    state.editRule = null;
    state.editGuard = null;
    state.ruleDraft = null;
    state.adder = null;
    render();
  };

  // The write itself, shared by the button and the leave-the-row
  // commit. The toasts stay in `submit`: a silent commit only runs on
  // a row `ready()` already vouched for.
  const record = () => {
    const condition = { leftHandSide: draftOperand(draft, 'left'), predicate: draft.predicate };
    if (!unary) {
      condition.rightHandSide = membership ? entryOperands() : draftOperand(draft, 'right');
    }
    if (draft.negate) condition.negate = true;
    state.editRule = null;
    state.editGuard = null;
    state.adder = null;
    patchSlice((b) => {
      const list = targetList(b);
      if (index === null) list.push(condition);
      else list[index] = condition;
    });
  };
  // Touched and complete commits on leaving, the same as every other
  // row — clicking straight from a finished rule to the next step no
  // longer quietly drops the rule.
  // A membership list left empty stores as the advisory case; the
  // silent leave-commit holds out for at least one entry, while an
  // explicit save is taken at its word.
  draft.ready = () => !!draft.touched
    && draftOperand(draft, 'left') !== undefined
    && (unary || (membership ? entryOperands().length > 0 : draftOperand(draft, 'right') !== undefined));
  draft.commit = record;

  // Once both sides are chosen, Enter anywhere in the row submits it —
  // the same as clicking the primary button — so a rule typed and
  // picked entirely from the keyboard never needs the mouse to land.
  const submit = () => {
    if (draftOperand(draft, 'left') === undefined) return toast('Say what the rule is about.', true);
    if (!unary && !membership && draftOperand(draft, 'right') === undefined) {
      return toast('Say what to compare it with.', true);
    }
    state.ruleDraft = null;
    record();
  };

  // The entities a rule can be about are the ones this command reads —
  // a property invented here lands on one of those, and the rule picks
  // it up the moment it exists. No navigation, no modal, no losing the
  // half-written rule: the form appears under the row and the row
  // stays.
  const boundEntities = [...new Set(slice.reads.filter((b) => b.entity).map((b) => b.entity))];
  const row = h('div', {
    class: 'adder',
    onkeydown: (e) => {
      if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      submit();
    },
  },
    ...operandPicker(leftScope, draft, 'left',
      {
        placeholder: leftScope.length ? '— what? —' : '— look at something first —',
        onNew: boundEntities.length
          ? () => { state.addingProp = { at: 'rule' }; render(); }
          : undefined,
      }),
    h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: !!draft.negate,
        onchange: (e) => { draft.negate = e.target.checked; draft.touched = true; },
      }), ' not'),
    pick(predicateChoices.map((p) => [p, readable(p).toLowerCase()]),
      draft.predicate, (v) => {
        // Growing an `equals` into a set keeps the value already
        // picked; shrinking back keeps the first one listed.
        if (v === 'equalsAny' && draft.predicate !== 'equalsAny') {
          const current = draftOperand(draft, 'right');
          draft.rightEntries = current === undefined ? []
            : [current !== null && typeof current === 'object' ? current : String(current)];
        } else if (draft.predicate === 'equalsAny' && v !== 'equalsAny') {
          draftFromOperand(draft, 'right', entryOperands()[0]);
        }
        draft.predicate = v; draft.touched = true; render();
      }),
    ...(unary ? [] : membership
      ? membershipControls(draft, enumMembers)
      : operandPicker(rightRows, draft, 'right',
        { placeholder: '— what? —', allowLiteral: !enums.length })),
    h('button', { class: 'btn primary', onclick: submit }, index === null ? addLabel : 'Save'),
    h('button', { class: 'btn ghost tiny', onclick: close }, 'Cancel'));

  if (!(state.addingProp && state.addingProp.at === 'rule')) return row;
  return h('div', {}, row, newPropertyForm(model, {
    entities: boundEntities,
    onCreated: (entityName, propertyName) => {
      // The rule was the reason the property was made, so the rule is
      // what picks it up: its left side lands on the fresh property,
      // through the alias this command already reads the entity under.
      const binding = slice.reads.find((b) => b.entity === entityName);
      if (binding && state.ruleDraft) {
        state.ruleDraft.left = JSON.stringify({ alias: binding.alias, property: propertyName });
      }
    },
  }));
}

// The guard rows of one emission — each `when` condition as the same
// sentence a rule renders as, plus the same editor, writing into this
// emission's own list. Always visible on the card rather than folded
// behind "Fields": a guard changes what the command records, which is
// the one thing a reader of this step is here for.
function emissionGuardRows(model, slice, emission, emissionIndex) {
  const target = {
    list: (b) => (b.publishes[emissionIndex].when = b.publishes[emissionIndex].when || []),
    addLabel: 'Add guard',
  };
  const editingAt = (j) => state.editGuard
    && state.editGuard.at === emissionIndex && state.editGuard.index === j;

  const rows = (emission.when || []).map((condition, j) => {
    if (editingAt(j)) return h('div', { class: 'card rule' }, ruleEditor(model, slice, j, target));
    const p = conditionParts(condition);
    const quantifier = quantifierWords(model, slice.body, condition);
    return h('div', {},
      qrow('div', { cls: 'row', key: `guard:${emissionIndex}:${j}` },
        h('span', { class: 'sentence tiny' },
          h('span', { class: 'verb' }, 'only while '),
          quantifier ? h('span', { class: 'verb' }, quantifier + ', ') : null,
          opRef(condition.leftHandSide, null, p.left), ' ', h('span', { class: 'verb' }, p.verb),
          p.right ? h('span', {}, ' ', opRef(condition.rightHandSide, null, p.right)) : null),
        h('span', { class: 'grow' }),
        reveal(
          h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.editGuard = { at: emissionIndex, index: j };
              const opened = draftFromOperand(
                { predicate: condition.predicate, negate: !!condition.negate },
                'left', condition.leftHandSide);
              if (Array.isArray(condition.rightHandSide)) {
                opened.right = '';
                opened.rightEntries = condition.rightHandSide.map((entry) =>
                  entry !== null && typeof entry === 'object' ? entry : String(entry));
              } else {
                draftFromOperand(opened, 'right', condition.rightHandSide);
              }
              state.ruleDraft = opened;
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger', title: 'Drop this guard — the event publishes unconditionally again',
            onclick: () => patchSlice((b) => {
              b.publishes[emissionIndex].when.splice(j, 1);
              if (!b.publishes[emissionIndex].when.length) delete b.publishes[emissionIndex].when;
            }),
          }, '×'))));
  });

  if (state.editGuard && state.editGuard.at === emissionIndex && state.editGuard.index === null) {
    rows.push(h('div', { class: 'card rule' }, ruleEditor(model, slice, null, target)));
  } else {
    // Not an `adderSlot` — a guard opens through `state.editGuard`, not
    // `state.adder` — but it folds and reveals exactly like one.
    rows.push(h('div', { class: 'adder quiet' }, h('button', {
      class: 'btn ghost tiny',
      title: 'Publish this event only under a condition — failing it skips the event, never the command',
      onclick: () => { closeForms(); state.editGuard = { at: emissionIndex, index: null }; render(); },
    }, '+ only while'), h('span', { class: 'slot' })));
  }
  return h('div', { style: 'margin-left:8px' }, ...rows);
}

function stepEmits(model, slice) {
  const cards = slice.emits.map(({ emission, event }, i) => {
    const open = state.openEvent === emission.name;
    const params = event ? (event.properties || []) : [];
    // The event's own shape — its name, its mark, its fields — is
    // edited on its own page now (see `renderEvents`): an event may be
    // published by more than one command, and one card editing what
    // every other card shows was the risk, not the convenience. This
    // card keeps only what is specific to *this* publish binding: which
    // of this command's values fills which of the event's fields.
    return h('div', { class: 'card event' },
      qrow('div', { cls: 'row', key: 'emit:' + emission.name },
        event ? eventRef(model, emission.name)
          : h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(model, emission.name)), readable(emission.name)),
        h('span', { class: 'muted tiny' }, params.length + ' field' + (params.length === 1 ? '' : 's')),
        h('span', { class: 'grow' }),
        reveal(
          advanced() ? h('span', { class: 'tech' }, emission.name) : null,
          h('button', {
            class: 'btn tiny',
            onclick: () => { state.openEvent = open ? null : emission.name; render(); },
          }, open ? 'Hide fields' : 'Fields'),
          h('button', {
            class: 'btn tiny danger',
            title: 'Stop recording this. The event itself stays — remove it from its own '
              + 'page once no command records it.',
            onclick: () => patchSlice((b) => { b.publishes.splice(i, 1); }),
          }, '×'))),
      emissionGuardRows(model, slice, emission, i),
      open ? eventFields(model, emission, event) : null);
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Records nothing yet.'));

  const existing = Object.keys(model['event-definitions']).sort()
    .filter((n) => !slice.emits.some((e) => e.emission.name === n));
  let chosen = existing[0] || '';

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'event') {
    body.push(inlineForm({
      question: 'What happened?  (past tense)',
      placeholder: readable(suggestEventName(slice.name)), showsIdentifier: true,
      onSubmit: (v) => {
        const name = toPascal(v);
        state.newEntityAt = null;
        const fresh = !activeModel()['event-definitions'][name];
        run(() => {
          if (fresh) addDefinition('event-definition', model.id, name, { properties: [] });
          patchSlice((b) => b.publishes.push({ name, parameters: {} }));
          state.openEvent = name;
        });
        // A brand new event records what the command was given — field
        // for field, wired through unchanged — because that is what
        // nearly every event is, and the exceptions are edits rather
        // than a copying ritual everyone performs first. It is a step
        // of its own so that when the model refuses part of it (a tag
        // the boundary never consulted), the event still exists and is
        // still recorded, and the refusal says why. An event that
        // already existed is left exactly as it is: its shape belongs
        // to every command that records it.
        if (fresh) copyCommandPropertiesIntoEvent(model, slice.name, name);
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    body.push(adderSlot('emit', 'emits', '+ record something', () =>
      h('div', { class: 'card' }, h('div', {
        class: 'adder',
        // Enter records the picked event — unless focus is on a button,
        // which already knows what Enter on it means.
        onkeydown: existing.length ? (e) => {
          if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
          e.preventDefault();
          patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} }));
        } : null,
      },
        existing.length ? pick(existing.map((n) => [n, readable(n)]), chosen, (v) => { chosen = v; }) : null,
        existing.length ? h('button', {
          class: 'btn',
          onclick: () => patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} })),
        }, '+ Record something already known') : null,
        h('button', {
          class: 'btn primary',
          onclick: () => { closeForms(); state.newEntityAt = 'event'; render(); },
        }, '+ New event')))));
  }
  return step('emits', 'When it succeeds, this happened', ...body);
}

// Renaming an event or one of its fields rewrites every declared
// operand naming it. It cannot rewrite code: nothing here parses a
// script, and a textual pass over an unparsed language would sooner or
// later rewrite a comment or a string literal. So the rename goes
// through and this says which scripts to go and read.
function warnScripted(model, eventName) {
  const scripted = scriptedHandlersOf(model, eventName);
  if (!scripted.length) return;
  toast(`Renamed. ${scripted.join(', ')} handle${scripted.length === 1 ? 's' : ''} `
    + `${readable(eventName)} in code, which was not rewritten — check ${
      scripted.length === 1 ? 'it' : 'them'}.`);
}

// A key in `publishes[].parameters` that no longer names a property on
// the event it targets is not a reference to anything — the field it
// once read is gone. The only way there is one is a leftover from
// before `removeEventField` cleaned up after itself; swept here, on
// every payload edit, so a leftover like that never blocks removing the
// value it still, invisibly, claimed to use.
function pruneDanglingEmissionParameters(model, body) {
  for (const emission of body.publishes || []) {
    if (!emission.parameters) continue;
    const eventDef = model['event-definitions'][emission.name];
    const known = new Set((eventDef ? eventDef.properties : []).map((q) => q.name));
    for (const key of Object.keys(emission.parameters)) {
      if (!known.has(key)) delete emission.parameters[key];
    }
  }
}

// A field leaves the event, and takes its binding with it. The binding
// lives on the *command* side — `publishes[].parameters`, keyed by this
// field's own name — and every command that emits the event can hold
// one. Dropped only from the event, that key would go on pointing at
// whatever command value it read, invisibly, since nothing on the page
// still shows a field for it to belong to. Left in place, it keeps
// "using" that value forever, which is what later refuses to let the
// value itself be removed for a reason no longer visible anywhere.
function removeEventField(model, eventName, index, propertyName) {
  run(() => {
    const eventBody = deepClone(activeModel()['event-definitions'][eventName]);
    eventBody.properties.splice(index, 1);
    updateDefinition('event-definition', model.id, eventName, eventBody);

    const changes = [];
    for (const [name, body] of Object.entries(activeModel()['command-definitions'])) {
      const bound = (body.publishes || [])
        .some((e) => e.name === eventName && e.parameters && propertyName in e.parameters);
      if (!bound) continue;
      const next = deepClone(body);
      for (const e of next.publishes || []) {
        if (e.name === eventName && e.parameters) delete e.parameters[propertyName];
      }
      changes.push({ kind: 'command-definition', name, body: next });
    }
    if (changes.length) updateDefinitions(model.id, changes);
  });
}

// What this command's publish binding does: map this command's own
// values into the event's fields. The fields themselves — their names,
// their types, how many there are — are no longer edited here; an
// event may be published by more than one command, so their shape has
// exactly one home, on the event's own page (`eventFieldsEditor`).
// This stays specific to *this* binding for the same reason
// `copyFromCommand` below has to: only this command knows what it was
// given.
function eventFields(model, emission, event) {
  if (!event) return h('div', { class: 'fields empty' }, 'This event no longer exists.');
  const command = activeModel()['command-definitions'][state.slice];
  const boundary = command.boundary || [];
  const commandProperties = command.properties || [];
  const options = [
    ...commandProperties.map((q) =>
      [JSON.stringify({ parameterName: q.name }), 'given · ' + propertyWords(q.name)]),
    // Everything the command reads is bound, so everything it can emit
    // comes off an alias — a projection's value included.
    ...boundary.flatMap((b) => {
      if (b.projection) {
        return [[JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]];
      }
      const entity = model['entity-definitions'][b.entity];
      const icon = entityIcon(model, b.entity);
      const props = (entity ? entity.properties : []).map((q) =>
        [JSON.stringify({ alias: b.alias, property: q.name }), memberWords(b.alias, q.name), icon]);
      // An alias identified straight off a payload parameter already
      // has that same value in scope under "given · …", so naming it
      // again here would just be a second label on the one thing. One
      // found by tracing through another alias' property has no such
      // shortcut — that path is not what an event wants to say — so its
      // own identity is worth offering directly.
      const ownId = b.id !== undefined && operandSource(b.id) !== 'parameter'
        ? [[JSON.stringify(b.id), memberWords(b.alias, 'id'), icon]]
        : [];
      return [...props, ...ownId];
    }),
  ];

  const rows = (event.properties || []).map((p) => {
    const bound = (emission.parameters || {})[p.name];
    // Only options whose resolved type actually matches this field are
    // offered — a field typed `StudentId` has no use for a capacity.
    const fieldOptions = options.filter(([v]) => {
      const resolved = resolveOperandType(JSON.parse(v), { boundary, commandProperties, model });
      return resolved && resolved.propertyType === p.propertyType && resolved.isList === !!p.isList;
    });
    return h('div', { class: 'field', 'data-src': 'evprop:' + emission.name + '.' + p.name },
      h('span', { class: 'nm' }, propertyWords(p.name)),
      h('span', { class: 'muted tiny' }, readable(typeLabel(p))),
      h('span', { class: 'muted tiny' }, '←'),
      pick(fieldOptions, bound === undefined ? '' : JSON.stringify(bound),
        (v) => patchSlice((b) => {
          const e = b.publishes.find((x) => x.name === emission.name);
          e.parameters = e.parameters || {};
          // The placeholder's value is '' — unset, not an operand.
          if (v === '') delete e.parameters[p.name];
          else e.parameters[p.name] = JSON.parse(v);
        }), '— unset —'));
  });

  // What the command was given but this event does not yet carry. A
  // field copied from here is not a guess at what the event should say —
  // it is a value already in the command's own vocabulary, so the copy
  // both declares the field and wires it to that value in one step. It
  // stays here rather than on the event's page because it reads *this*
  // command's payload — an event published by several commands has no
  // one "given" to offer.
  const missing = commandProperties.filter((q) => !(event.properties || []).some((p) => p.name === q.name));
  const copyFromCommand = (properties) => {
    patch('event-definition', emission.name, (b) => {
      for (const property of properties) {
        b.properties.push({
          name: property.name, propertyType: property.propertyType,
          isOptional: property.isOptional, isList: property.isList,
        });
      }
    });
    patchSlice((b) => {
      const e = b.publishes.find((x) => x.name === emission.name);
      e.parameters = e.parameters || {};
      for (const property of properties) e.parameters[property.name] = { parameterName: property.name };
    });
  };

  return h('div', { class: 'fields' },
    rows.length ? rows : h('div', { class: 'empty' }, 'Carries nothing yet.'),
    missing.length ? h('div', { class: 'copy-missing' },
      h('span', { class: 'muted tiny' }, 'Given but not recorded: '),
      missing.map((p) => h('button', {
        class: 'chip suggest',
        title: 'Add ' + propertyWords(p.name) + ' to this event, carried through unchanged',
        onclick: () => copyFromCommand([p]),
      }, '+ ' + propertyWords(p.name))),
      // The common case — an event that just records what it was given,
      // field for field — is one click rather than one per field.
      missing.length > 1 ? h('button', {
        class: 'chip suggest flow-adder',
        title: `Add all ${missing.length} of these at once, each carried through unchanged`,
        onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
        onclick: () => copyFromCommand(missing),
      }, `+ all ${missing.length}, same as the command`) : null) : null,
    h('div', { class: 'adder', style: 'margin-top:6px' },
      h('button', {
        class: 'btn ghost tiny',
        onclick: () => goToEvent(emission.name),
      }, 'Rename, retype or add fields on ' + readable(emission.name) + ' →')));
}

function stepChanges(model, slice) {
  const cards = [];
  for (const { emission, effects } of slice.emits) {
    const rows = effects.map((effect) => {
      const p = effectParts(effect);
      // A scripted handler has no operation/value for this form to
      // pre-fill — it is edited where its code is, in the projection's
      // own editor.
      const scripted = effect.handler.code !== undefined;
      return qrow('div', {
        cls: 'row',
        key: 'chg:' + emission.name + ':' + effect.entity + '.' + effect.property.name,
      },
        h('span', { class: 'sentence' },
          entityRef(model, effect.entity, { cls: 'op ent', text: p.subject }), ' ',
          h('span', { class: 'verb' }, p.verb), ' ',
          opRef(effect.handler.value, emission.name, p.object)),
        h('span', { class: 'grow' }),
        reveal(
          scripted ? null : h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.changeDraft = draftFromOperand({
                eventName: emission.name,
                target: JSON.stringify([effect.entity, effect.property.name]),
                operation: effect.handler.operation,
              }, 'value', effect.handler.value);
              state.adder = 'chg:' + emission.name;
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger',
            onclick: () => patch('projection-definition', effect.projectionName, (b) => {
              b.handlers = (b.handlers || []).filter((x) => x.event !== emission.name);
            }),
          }, '×')));
    });
    cards.push(h('div', { class: 'card entity' },
      h('div', { class: 'row' }, h('span', { class: 'chip event' },
          h('i', { class: 'ic' }, eventIcon(model, emission.name)), readable(emission.name)),
        h('span', { class: 'muted tiny' }, 'changes')),
      h('div', { style: 'margin-top:6px' },
        rows.length ? rows : h('div', { class: 'empty' }, 'Changes nothing we know.')),
      changeAdder(model, emission.name)));
  }
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Nothing to change until it records something.'));
  return step('changes', 'Which changes what we know', h('div', {}, cards));
}

function changeAdder(model, eventName) {
  const event = model['event-definitions'][eventName];

  if (state.newEntityAt === 'changes:' + eventName) {
    return inlineForm({
      question: 'What kind of thing do we need to keep track of?', placeholder: 'course',
      showsIdentifier: true,
      onSubmit: (v) => {
        state.newEntityAt = null;
        const created = createEntity(model, v);
        // A fresh entity brings a status with it, and an event that
        // needed the entity almost always moves that status — so the
        // change adder reopens on it, one pick from done.
        if (created) {
          state.adder = 'chg:' + eventName;
          state.changeDraft = {
            eventName, target: JSON.stringify([created, STATUS_PROPERTY]),
            operation: 'set', value: '',
          };
          render();
        }
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    });
  }
  if (!Object.keys(model['entity-definitions']).length) {
    return h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'Nothing to change yet.'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'changes:' + eventName; render(); },
      }, '+ New entity'));
  }

  // A scripted or derived projection is not offered here: this form
  // writes an operation and an operand, and neither takes one — code
  // is edited where the code is, and nothing moves a derived value.
  const targets = [
    ...Object.entries(model['entity-definitions']).flatMap(([name, entity]) =>
      (entity.properties || [])
        .filter((p) => {
          const target = entityPropertyTarget(model, name, p.name).projection;
          return !scriptOf(target) && !derivedOf(target);
        })
        .map((p) =>
          [JSON.stringify([name, p.name]),
            `${entityIcon(model, name)} ${readable(name)} · ${propertyWords(p.name)}`])),
    [NEW, '+ New property…'],
  ];
  // The draft outlives a repaint, which a typed literal needs: the
  // picker rebuilds on every keystroke otherwise.
  const draft = state.changeDraft && state.changeDraft.eventName === eventName
    ? state.changeDraft
    : (state.changeDraft = {
        eventName,
        target: targets.length > 1 ? targets[0][0] : '',
        operation: 'set',
        value: '',
      });

  // What a handler may take in: a property of the event, the value the
  // property already holds, a member of whichever enum the currently
  // targeted property is typed with — not any other enum, which
  // nothing here could ever hold — the one *after* something, or a
  // typed literal. Event properties are held to the same rule the
  // emission fields and the rule editor's right side apply: only the
  // ones typed like the targeted property are offered — a status is
  // never set from a title. And a successor is only offered where the
  // target has one (`validateHandlers` says the same after the fact):
  // integers and strings count up; an enum has no "next member".
  const [targetEntity, targetPropertyName] =
    draft.target && draft.target !== NEW ? JSON.parse(draft.target) : [null, null];
  const targetProjection = targetEntity
    ? entityPropertyTarget(model, targetEntity, targetPropertyName).projection
    : null;
  const targetEnumMembers = targetProjection ? enumMembersFor(model, targetProjection.valueType) : null;
  const targetType = targetProjection ? targetProjection.valueType : null;
  const offerProperty = (p) => !targetType || p.propertyType === targetType;
  const offerSuccessor = (() => {
    if (!targetType) return true;
    if (targetEnumMembers) return false;
    const cls = classifyType(model, targetType);
    return cls.kind !== 'simple' || ['integer', 'string'].includes(targetType);
  })();
  const values = [
    ...(event ? event.properties : []).filter(offerProperty).flatMap((p) => [
      [JSON.stringify({ eventProperty: p.name }), "the event's " + propertyWords(p.name)],
      ...(offerSuccessor ? [[JSON.stringify({ successor: { eventProperty: p.name } }),
        "the one after the event's " + propertyWords(p.name)]] : []),
    ]),
    [JSON.stringify({ currentValue: true }), 'its current value'],
    ...(targetEnumMembers || []).map((m) =>
      [JSON.stringify({ enumMember: m }), propertyWords(targetPropertyName) + ' · ' + readable(m)]),
    ...(targetEnumMembers ? [[NEW, '+ New member…']] : []),
  ];
  // Retargeting can strip the row the draft was holding — a value the
  // new target cannot take, or the literal row an enum never offers.
  // The stale choice would silently diverge from what the picker
  // shows, so it resets to the first offer instead.
  const offered = new Set(values.map(([v]) => v));
  if (draft.value === LITERAL ? targetEnumMembers
    : draft.value && draft.value !== NEW && !offered.has(draft.value)) {
    draft.value = '';
  }
  if (!draft.value) draft.value = values.length ? values[0][0] : '';

  const targetSel = pick(targets, draft.target, (v) => {
    if (v === NEW) { closeForms(); state.addingProp = { eventName }; return render(); }
    draft.target = v;
    draft.touched = true;
    render();
  });

  // What actually records the change, shared between the button and
  // the leave-the-row commit. By the time it runs the row is complete;
  // the interactive detours (a new member, a missing target) belong to
  // `submitChange`, which is the only caller that can still ask.
  const record = () => {
    const value = draftOperand(draft, 'value');
    const [entityName, propertyName] = JSON.parse(draft.target);
    const operation = draft.operation;
    const projectionName = entityPropertyTarget(model, entityName, propertyName).binding.projection;
    patch('projection-definition', projectionName, (b) => {
      b.handlers = (b.handlers || []).filter((x) => x.event !== eventName);
      b.handlers.push({ event: eventName, operation, value });
    });
  };
  // The same rule the field adders follow, with the picker reading of
  // "has a name": a row of untouched defaults is a proposal — the
  // wizard opens one — and walking away from a proposal declines it.
  // Touched and complete, though, is an edit someone made, and leaving
  // the row is what finishes it.
  draft.ready = () => !!draft.touched
    && !!draft.target && draft.target !== NEW && draft.value !== NEW
    && draftOperand(draft, 'value') !== undefined;
  draft.commit = record;

  // Once a target and a value are chosen, Enter anywhere in the row
  // records the change — the same as clicking the button.
  const submitChange = () => {
    if (!draft.target || draft.target === NEW) return toast('Pick what changes.', true);
    if (draft.value === NEW) {
      closeForms();
      state.addingMember = { type: targetProjection.valueType, eventName };
      return render();
    }
    if (draftOperand(draft, 'value') === undefined) return toast('Say what it changes to.', true);
    state.changeDraft = null;
    record();
  };

  const rows = [adderSlot('chg:' + eventName, 'changes', '+ change', () =>
    h('div', {
      class: 'adder',
      onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); submitChange(); } },
    }, targetSel,
      pick(Object.entries(OPERATION_WORDS), draft.operation,
        (v) => { draft.operation = v; draft.touched = true; }),
      ...operandPicker(values, draft, 'value', { allowLiteral: !targetEnumMembers }),
      h('button', { class: 'btn', onclick: submitChange }, '+ Record a change')))];

  if (state.addingProp && state.addingProp.eventName === eventName) {
    rows.push(newPropertyForm(model, {
      // "I created it" means "that is the one I meant": the adder
      // reopens on the fresh property, ready for the operation and
      // value, instead of asking the question the creation answered.
      onCreated: (entityName, propertyName) => {
        state.adder = 'chg:' + eventName;
