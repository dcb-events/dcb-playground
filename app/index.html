  return h('div', { class: 'card' },
    h('div', { class: 'sc-line' },
      pinButton(entityWatch(tag)),
      h('span', { class: 't' }, readable(held.entity) + ' ' + held.id)),
    held.properties.map((property) => h('div', { class: 'sc-line' },
      h('span', { class: 'k' }, '  ' + propertyWords(property.name) + ' '),
      property.error
        ? h('span', { class: 'k' }, '— ' + property.error)
        : h('span', {}, JSON.stringify(property.value)))));
}

function sandboxWatched(model) {
  const names = Object.keys(model['projection-definitions']).sort();
  if (!session.pinned.length && !names.length) return null;
  return step('scenarios', 'Scenarios',
    h('div', { class: 'muted small' },
      'Followed wherever you are on the timeline, whether or not the step you are looking at '
      + 'read them. A projection watched here is folded the same way a command folds it — a '
      + 'numbering shows the next value it would issue, at every point in the run.'),
    session.pinned.map((watch) => watchCard(model, watch)),
    names.length ? watchProjectionAdder(model, names) : null);
}

// Picking a projection to watch, and the arguments to watch it at. The
// arguments are values typed in, exactly as a scenario's are — there is
// no command here to draw an operand from.
function watchProjectionAdder(model, names) {
  if (!state.watchDraft) {
    return h('div', { class: 'adder', style: 'margin-top:8px' },
      h('button', {
        class: 'btn tiny ghost',
        onclick: () => {
          state.watchDraft = { projection: names[0], arguments: {} };
          render();
        },
      }, '+ watch a projection'));
  }

  const draft = state.watchDraft;
  const projection = model['projection-definitions'][draft.projection];
  const script = projection && scriptOf(projection);
  const slots = projection ? (script ? (script.arguments || []) : (projection.parameters || [])) : [];
  const where = { root: () => state.watchDraft, suggest: (entity) => sessionIdentifiers(model, entity) };

  return h('div', { class: 'card sc-step', style: 'margin-top:8px' },
    h('div', { class: 'row' },
      pick(names.map((n) => [n, readable(n)]), draft.projection, (v) => {
        state.watchDraft = { projection: v, arguments: {} };
        render();
      }),
      h('span', { class: 'grow' })),
    slots.length
      ? slots.map((slot) => h('div', { class: 'row' },
          h('span', { class: 'muted tiny', style: 'min-width:90px' }, propertyWords(slot.name)),
          valueEditor(model, { name: slot.name, propertyType: slot.propertyType, isList: false },
            ['arguments', slot.name], where)))
      : h('div', { class: 'muted tiny' }, 'takes no arguments — it reads the whole log'),
    h('div', { class: 'adder', style: 'margin-top:8px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          for (const slot of slots) {
            if (draft.arguments[slot.name] === undefined || draft.arguments[slot.name] === '') {
              return toast(`Say which ${readable(slot.propertyType)} to watch it for.`, true);
            }
          }
          // The draft must close before the pin repaints: `togglePinned`
          // renders, and a paint with the draft still set leaves this
          // form on screen holding a stale closure — whose resubmission
          // carries the old arguments and so *unpins* the watch it just
          // added.
          const watch = projectionWatch(draft.projection, { ...draft.arguments });
          state.watchDraft = null;
          togglePinned(watch);
        },
      }, 'Watch it'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.watchDraft = null; render(); },
      }, 'Cancel')));
}

// Every identifier of a given entity any visible event carries — the
// sandbox's answer to `identifiersInUse`, read off the tags rather than
// off a scenario's hand-written payloads.
function sessionIdentifiers(model, entityName) {
  const found = new Set();
  for (const tag of sessionInstances(model)) {
    const [type, value] = [tag.slice(0, tag.indexOf(':')), tag.slice(tag.indexOf(':') + 1)];
    if (entityOfIdType(model, type) === entityName) found.add(value);
  }
  return [...found];
}

// ---------- what the involved decision models look like now ----------
//
// `sandboxDecision` is frozen at the instant the step decided; this
// moves as you scrub. An entity's "now" is its full state — the same
// card `instanceStateCard` gives a pinned instance — not only the
// properties the decision happened to touch, which is the boundary's
// story to tell, not this one's. A projection has no properties to
// enumerate, so its "now" is just a fresh fold — gotten by deciding the
// same command again against the log as it stands here, which is also
// the only way to recover the argument values it was folded with.
function sandboxNow(model) {
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (!step) {
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'Nothing has happened yet.'));
  }

  let then;
  try {
    then = evaluateCommand(model, session.log.slice(0, step.from), step.command, step.args);
  } catch (error) {
    if (!(error instanceof EvaluationError)) throw error;
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'See "What it looked at to decide" above.'));
  }

  const reads = Object.entries(then.reads || {});
  if (!reads.length) {
    return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'It involved nothing.'));
  }

  let now = null;
  let nowError = null;
  try {
    now = evaluateCommand(model, sessionVisible(), step.command, step.args);
  } catch (error) {
    if (!(error instanceof EvaluationError)) throw error;
    nowError = error.message;
  }

  return h('div', {},
    reads.map(([alias, read]) => read.kind === 'projection'
      ? h('div', { class: 'card sc-line' },
          // Pinnable like an instance is: a numbering read by one step
          // is usually the thing you then want to follow across every
          // other one. The arguments come from the binding that was
          // resolved, which is the only place they exist.
          pinButton(projectionWatch(read.projection, read.arguments || {})),
          h('span', { class: 'k' }, alias + ' — '),
          h('span', { class: 't' }, readable(read.projection)),
          now
            ? h('span', { class: 'k' }, '  ' + initialValueWords(now.reads[alias].value))
            : h('span', { class: 'k' }, '  can no longer be worked out here: ' + nowError))
      : h('div', {},
          h('div', { class: 'muted tiny' },
            alias + ' — ' + readable(read.entity)
              + (read.fanned ? ` (${read.instances.length})` : '')
              + (read.absent ? ' — bound nothing (identifier unset)' : '')),
          read.instances.map((instance) =>
            instanceStateCard(model, read.entity + ':' + instance.id)))));
}

// ---------- the page ----------

function renderSandbox(model, main) {
  main.appendChild(h('header', {},
    qrow('div', { cls: 'row', key: 'sandbox' },
      h('div', { class: 'name' }, 'Sandbox'),
      h('span', { class: 'grow' }),
      session.log.length
        ? removeButton('sandbox:reset', {
            label: 'Start over',
            title: 'Throw all of this away and start from nothing',
            confirm: 'Really start over?',
            onRemove: () => { sessionReset(); state.sandboxDraft = null; render(); },
          })
        : null),
    h('div', { class: 'muted small summary' },
      'Drive the commands and watch what happens. Nothing here is kept — it is gone when this '
      + 'page reloads, and the model itself is never written to.')));

  main.appendChild(step('trigger', 'Do something', sandboxDriver(model)
    || h('div', { class: 'empty' }, 'This model has no commands to drive yet.')));

  if (session.log.length) {
    main.appendChild(step('emits', 'What has happened',
      sandboxTimeline(model),
      h('div', { class: 'card sc-line', style: 'margin-top:8px' },
        sessionVisible().length
          ? sessionVisible().map((event, index) => h('div', {
              class: index === sessionPosition() - 1 ? 'lit' : '',
            },
              h('span', { class: 'ic' }, eventIcon(model, event.type)),
              h('span', { class: 'y' }, readable(event.type)),
              h('span', { class: 'k' }, '  ' + payloadText(event.data))))
          : h('div', { class: 'empty' }, 'nothing yet'))));

    main.appendChild(step('reads', 'What it looked at to decide', sandboxDecision(model)));
    main.appendChild(step('now', 'What it looks like now', sandboxNow(model)));
  }

  // Outside the gate above on purpose: what a projection reads before
  // anything has happened is a real answer and often the interesting
  // one — a numbering's first value is the whole of what its initial
  // value states.
  const watched = sandboxWatched(model);
  if (watched) main.appendChild(watched);
}

// ============================================================
// Code — the whole model as text (see dsl.js), edited in place.
//
// A second surface over the same definitions rather than a page among
// the others: the toggle in the bar swaps the main area between the
// pages and the text, and the two follow each other. Opening the code
// lands on whatever definition the page was showing; going back lands
// on the page of the definition the cursor is in. The rail stays, and
// a click on a command, entity, event or projection reveals it in the
// text; a click on anything else (the sandbox, the overviews) shows
// that page, keeping whatever was typed.
//
// The text is a draft until applied — ⌘S, the Apply button, or going
// back to the pages, which applies a text that parses and keeps one
// that does not. An apply is one append (`replaceDefinitions`) and so
// one undo step. What the author typed stays in the editor after an
// apply, comments and all; it is replaced by a fresh print only when
// the model changes under a clean text (an undo, an agent, another
// page). A text with edits is never replaced — it is marked stale
// instead, since applying it now would put back what changed.
//
// Monaco is the editor when it loads (the same lazily loaded copy the
// scripted handlers use, see shared.js), with the grammar from dsl.js,
// errors and advisories as markers, an outline, a hover showing each
// command's derived boundary, and dsl.js's language service behind
// completion, go to definition, references and rename; a plain
// textarea otherwise, which is everything that is needed.
// ============================================================

const SURFACE_KEY = 'dcb-playground:surface';
function setCodeSurface(on) {
  state.code = on;
  localStorage.setItem(SURFACE_KEY, on ? 'code' : 'visual');
}

// The pages that are one definition each — what the code follows.
const CODE_FOLLOWS = ['slice', 'entity', 'events', 'projections', 'types'];

const codeView = {
  modelId: null,
  text: '',             // what the editor holds
  base: '',             // the text the model is known to say
  printed: '',          // the model's own print at `revision`
  revision: -1,
  stale: false,         // the model moved under a text with edits
  shownView: null,      // the page state the code was last shown over
  focus: null,          // the definition last revealed for it
  analysis: null,       // { text, parsed, errors, advisories }
  editor: null,         // { root, editor, model } once Monaco is up
  loading: false,       // writing into Monaco, not the author typing
  timer: null,
  statusEl: null,
  listEl: null,
  drafts: new Map(),    // model id → a text left unapplied on another model
};

function codeDirty() { return codeView.text !== codeView.base; }

// Brings the held text up to date with the model it is about.
function syncCodeView(model) {
  const now = logRevisionNow();
  if (codeView.modelId !== model.id) {
    if (codeView.modelId && codeDirty()) codeView.drafts.set(codeView.modelId, { ...codeView });
    const kept = codeView.drafts.get(model.id);
    codeView.drafts.delete(model.id);
    const printed = modelSource(model);
    Object.assign(codeView, kept
      ? { text: kept.text, base: kept.base, printed: kept.printed, revision: kept.revision }
      : { text: printed, base: printed, printed, revision: now });
    codeView.modelId = model.id;
    codeView.stale = !!kept && (kept.stale || kept.printed !== printed);
    codeView.focus = null;
    codeView.analysis = null;
    return;
  }
  if (codeView.revision === now) return;
  const printed = modelSource(model);
  codeView.revision = now;
  if (printed === codeView.printed) return; // a scenario moved; the text did not
  codeView.printed = printed;
  if (codeDirty()) { codeView.stale = true; return; }
  codeView.text = printed;
  codeView.base = printed;
  codeView.stale = false;
  codeView.analysis = null;
  writeCodeEditor(printed);
}

// Errors block an apply: what does not parse, and a scenario that
// cannot be recorded. Warnings do not: advisories, and scenarios that
// are broken or drifted against the text as written.
function analyseCode(model) {
  if (codeView.analysis && codeView.analysis.text === codeView.text) return codeView.analysis;
  const parsed = parseModelSource(codeView.text);
  let errors = parsed.diagnostics;
  let advisories = [];
  let scenarios = [];
  if (!errors.length) {
    advisories = sourceAdvisories(model, parsed);
    const report = sourceScenarioReport(model, parsed);
    errors = report.errors;
    scenarios = report.warnings;
  }
  codeView.analysis = { text: codeView.text, parsed, errors, advisories, scenarios };
  return codeView.analysis;
}

function onCodeInput(text) {
  codeView.text = text;
  clearTimeout(codeView.timer);
  codeView.timer = setTimeout(refreshCodeChrome, 250);
}

// The parts of the page that follow the text — markers, status, the
// problem list — without a repaint, which would cost the editor its
// focus on every keystroke.
function refreshCodeChrome() {
  const model = activeModel();
  if (!model || !state.code) return;
  const analysis = analyseCode(model);
  if (codeView.editor) {
    const toMarker = (severity) => (d) => ({
      severity, message: d.message,
      startLineNumber: d.line, startColumn: d.col, endLineNumber: d.endLine, endColumn: d.endCol,
      // What the quick fix finds its replacement by.
      code: d.fix ? 'accept:' + d.scenario : undefined,
    });
    const markers = [
      ...analysis.errors.map(toMarker(monaco.MarkerSeverity.Error)),
      ...codeAdvisoryAt(analysis).map(toMarker(monaco.MarkerSeverity.Warning)),
    ];
    monaco.editor.setModelMarkers(codeView.editor.model, 'dcb', markers);
    // What each read queries, after it. A decoration, not an inlay
    // hint: this Monaco cuts those at 43 characters, and a list of
    // event types cut short drops exactly the one being looked for.
    const { editor } = codeView.editor;
    if (!codeView.editor.readHints) codeView.editor.readHints = editor.createDecorationsCollection();
    codeView.editor.readHints.set([...codeReadQueries(model), ...codeCommandQueries(model)].map((q) => ({
      range: new monaco.Range(q.end.endLine, q.end.endCol, q.end.endLine, q.end.endCol),
      options: { showIfCollapsed: true, after: { content: '\u00a0\u00a0' + q.hint, inlineClassName: 'code-read-hint' } },
    })));
  }
  if (codeView.statusEl) codeView.statusEl.replaceWith(codeView.statusEl = codeControls());
  if (codeView.listEl) codeView.listEl.replaceWith(codeView.listEl = codeProblemList(analysis));
  const toggle = document.querySelector('#tools .surface');
  if (toggle) toggle.replaceWith(surfaceToggle(model));
}

// What each `read` adds to the append condition, for the text as it
// stands: `read course = Course[courseId]` looks like the whole entity
// and is only the properties something uses (sourceReadQueries, dsl.js).
// Cached on the analysis, so it moves with the text.
function codeReadQueries(model) {
  const analysis = analyseCode(model);
  if (analysis.readQueries === undefined) {
    try { analysis.readQueries = sourceReadQueries(model, analysis.parsed); } catch { analysis.readQueries = []; }
  }
  return analysis.readQueries;
}

// And beside each command's `{`, what it reads in all
// (sourceCommandQueries, dsl.js) — the same summary the Consistency
// boundary step leads with.
function codeCommandQueries(model) {
  const analysis = analyseCode(model);
  if (analysis.commandQueries === undefined) {
    try { analysis.commandQueries = sourceCommandQueries(model, analysis.parsed); } catch { analysis.commandQueries = []; }
  }
  return analysis.commandQueries;
}

// Advisories, placed on the name of the definition they are about, and
// scenario warnings, placed on their `scenario`.
function codeAdvisoryAt(analysis) {
  const scenarios = analysis.scenarios.map((w, index) => ({ ...w, scenario: index }));
  return [...scenarios, ...analysis.advisories.map((a) => {
    const span = sourceSpanOf(analysis.parsed, a.kind, a.name);
    return {
      message: a.message, kind: a.kind, name: a.name,
      line: span ? span.nameLine : 1, col: span ? span.nameCol : 1,
      endLine: span ? span.nameLine : 1, endCol: span ? span.nameEndCol : 2,
    };
  })];
}

function codeStatus() {
  const analysis = codeView.analysis;
  const errors = analysis ? analysis.errors.length : 0;
  const advisories = analysis ? analysis.advisories.length : 0;
  const parts = [];
  if (codeView.stale) {
    parts.push(h('span', { class: 'code-stale' }, 'The model changed since these edits began — applying puts back what changed. '),
      h('button', { class: 'btn tiny ghost', onclick: revertCode }, 'Discard my edits'));
  } else if (errors) {
    parts.push(h('span', { class: 'code-bad' }, `${errors} error${errors === 1 ? '' : 's'} — nothing can be applied yet`));
  } else if (codeDirty()) {
    parts.push(h('span', { class: 'code-dirty' }, 'Edited — not applied yet'));
  } else {
    parts.push(h('span', { class: 'muted' }, 'In step with the model'));
  }
  if (!errors && advisories) parts.push(h('span', { class: 'muted' }, ` · ${advisories} advisor${advisories === 1 ? 'y' : 'ies'}`));
  const scenarios = analysis ? analysis.scenarios.length : 0;
  if (!errors && scenarios) {
    parts.push(h('span', { class: 'code-dirty' }, ` · ${scenarios} scenario${scenarios === 1 ? '' : 's'} broken or drifted`));
  }
  return h('span', { class: 'code-status small' }, parts);
}

// Apply, Revert and the status — the part of the bar that follows
// every keystroke.
function codeControls() {
  return h('span', { class: 'code-controls' },
    h('button', {
      class: 'btn primary tiny', type: 'button', title: 'Apply — ⌘S',
      disabled: !codeDirty() ? true : null, onclick: applyCode,
    }, 'Apply'),
    h('button', {
      class: 'btn tiny', type: 'button', title: 'Put back what the model says',
      disabled: !codeDirty() ? true : null, onclick: revertCode,
    }, 'Revert'),
    codeStatus());
}

function codeProblemList(analysis) {
  const rows = [
    ...analysis.errors.map((d) => ({ ...d, error: true })),
    ...codeAdvisoryAt(analysis),
  ];
  if (!rows.length) return h('div', { class: 'code-problems' });
  return h('div', { class: 'code-problems' }, rows.map((d) => h('div', {
    class: 'issue', role: 'button', tabindex: '0',
    onclick: () => revealCodeAt(d.line, d.col),
  }, h('span', { class: 'diag-mark' + (d.error ? ' err' : '') }, d.error ? '✕' : '⚠'),
    h('span', { class: 'mono' }, `${d.line}:${d.col}`),
    h('span', { class: 'why' }, d.name ? `${readable(d.name)} — ${d.message}` : d.message),
    d.fix ? h('button', {
      class: 'btn tiny', type: 'button', title: 'Rewrite the then lines to what the model now does',
      onclick: (e) => { e.stopPropagation(); acceptCodeFix(d.fix); },
    }, 'Accept') : null)));
}

// The drift quick fix: the scenario's then lines become what the model
// now does. An edit like any other — it still has to be applied.
function acceptCodeFix(fix) {
  if (codeView.editor) {
    const { editor } = codeView.editor;
    editor.executeEdits('accept', [{
      range: new monaco.Range(fix.line, fix.col, fix.endLine, fix.endCol), text: fix.text,
    }]);
    editor.focus();
    return;
  }
  const lines = codeView.text.split('\n');
  const offset = (line, col) => lines.slice(0, line - 1).reduce((sum, l) => sum + l.length + 1, 0) + col - 1;
  const text = codeView.text.slice(0, offset(fix.line, fix.col)) + fix.text
    + codeView.text.slice(offset(fix.endLine, fix.endCol));
  onCodeInput(text);
  render();
}

function applyCode() {
  const model = activeModel();
  if (!model) return false;
  // A text is only ever applied to the model it was written against —
  // a model switched under it parks it as that model's draft instead.
  syncCodeView(model);
  if (!codeDirty()) return false;
  const analysis = analyseCode(model);
  if (analysis.errors.length) {
    refreshCodeChrome();
    const first = analysis.errors[0];
    toast(`Line ${first.line}: ${first.message}`, true);
    revealCodeAt(first.line, first.col);
    return false;
  }
  const text = codeView.text;
  const summary = run(() => {
    const out = applyModelSource(model.id, text);
    // The text is what the model now says, whatever its print would
    // be — settled before the gesture's repaint reads it.
    codeView.base = text;
    codeView.printed = modelSource(activeModel());
    codeView.revision = logRevisionNow();
    codeView.stale = false;
    return out;
  });
  if (!summary) return false;
  toast('Applied — ' + sourceApplySummary(summary));
  return true;
}

function revertCode() {
  const model = activeModel();
  if (!model) return;
  const printed = modelSource(model);
  Object.assign(codeView, { text: printed, base: printed, printed, revision: logRevisionNow(), stale: false, analysis: null });
  writeCodeEditor(printed);
  render();
}

// Into the code view, revealing what the page was about.
function enterCode() {
  if (state.code) return;
  closeForms(); // commits whatever a page had half-typed
  setCodeSurface(true);
  codeView.shownView = null;
  codeView.focus = null;
  render();
}

// Back to the pages: a text that parses is applied first, one that
// does not is kept for later; the page is the one for the definition
// under the cursor.
function leaveCode() {
  if (!state.code) return;
  const model = activeModel();
  let at = null;
  if (model) {
    syncCodeView(model);
    const analysis = analyseCode(model);
    const line = codeCursorLine();
    at = line ? sourceSpanAt(analysis.parsed, line) : null;
    const inScenario = line && analysis.parsed.scenarios.some((r) => r.block && line >= r.span.line && line <= r.span.endLine);
    if (at && inScenario) at = { ...at, scenarios: true };
    if (codeDirty() && !codeView.stale) {
      if (analysis.errors.length) {
        toast(`The code has ${analysis.errors.length} error${analysis.errors.length === 1 ? '' : 's'} and was not `
          + 'applied — it is kept as it is for when you come back.', true);
      } else if (!applyCode()) {
        return;
      }
    } else if (codeDirty()) {
      toast('Your edits were not applied — the model changed under them. They are kept for when you come back.', true);
    }
  }
  setCodeSurface(false);
  const current = activeModel();
  if (at && current && current[DEF_COLLECTIONS[at.kind]][at.name] !== undefined) {
    return openDefinition(at.kind, at.name, { scenarios: at.scenarios });
  }
  render();
}

function openDefinition(kind, name, { scenarios } = {}) {
  if (scenarios && kind === 'command-definition') {
    closeForms();
    Object.assign(state, { view: 'slice', slice: name, tab: 'scenarios' });
    return render();
  }
  if (scenarios && kind === 'projection-definition') {
    openProjection(activeModel(), name, { tab: 'checks' });
    return render();
  }
  if (kind === 'command-definition') return goToCommand(name);
  if (kind === 'entity-definition') return openEntity(name);
  if (kind === 'event-definition') return goToEvent(name);
  if (kind === 'projection-definition') return goToProjection(name);
  if (kind === 'custom-type-definition' && advanced()) return goToCustomType(name);
  render();
}

// The definition the page in front of the code is about, if it is
// about one.
function pageDefinition() {
  if (state.view === 'slice' && state.slice) return ['command-definition', state.slice];
  if (state.projDraft && ['entity', 'projections'].includes(state.view)) {
    return ['projection-definition', state.projDraft.name];
  }
  if (state.view === 'entity' && state.entity) return ['entity-definition', state.entity];
  if (state.view === 'events' && state.openEvent) return ['event-definition', state.openEvent];
  return null;
}

function codeCursorLine() {
  if (codeView.editor) {
    const position = codeView.editor.editor.getPosition();
    return position ? position.lineNumber : null;
  }
  const area = document.querySelector('.code-text');
  if (!area || typeof area.value !== 'string') return null;
  return area.value.slice(0, area.selectionStart).split('\n').length;
}

// `from` is where a whole declaration starts — its annotations — and
// is put near the top, the way a jump to a definition reads.
function revealCodeAt(line, col, from) {
  if (codeView.editor) {
    const { editor } = codeView.editor;
    if (from) editor.revealLineNearTop(from);
    else editor.revealLineInCenterIfOutsideViewport(line);
    editor.setPosition({ lineNumber: line, column: col || 1 });
    editor.focus();
    return;
  }
  const area = document.querySelector('.code-text');
  if (!area || typeof area.value !== 'string') return;
  const lines = area.value.split('\n');
  const offset = lines.slice(0, line - 1).reduce((sum, l) => sum + l.length + 1, 0) + (col || 1) - 1;
  area.focus();
  area.setSelectionRange(offset, offset);
  // A textarea scrolls to its caret only when it gains focus; put the
  // line near the top explicitly.
  area.scrollTop = Math.max(0, ((from || line) - 4) * parseFloat(getComputedStyle(area).lineHeight || '18'));
}

// A text the model put there, never one the author typed — so it is a
// fresh start for the editor's own undo, too. Were it an edit, ⌘Z in
// the editor could step back to another model's text, or to one from
// before an agent's change, and that would read as ordinary typing:
// dirty, not stale, and applied on the way back to the pages.
function writeCodeEditor(text) {
  if (!codeView.editor) return;
  const { editor, model } = codeView.editor;
  if (model.getValue() === text) return;
  const view = editor.saveViewState();
  codeView.loading = true;
  model.setValue(text);
  codeView.loading = false;
  if (view) editor.restoreViewState(view);
}

let sourceLanguageRegistered = false;
function registerSourceLanguage() {
  if (sourceLanguageRegistered) return;
  sourceLanguageRegistered = true;
  const L = monaco.languages;
  L.register({ id: 'dcb', extensions: [SOURCE_EXTENSION] });
  L.setMonarchTokensProvider('dcb', SOURCE_MONARCH);
  const pairs = [{ open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' }];
  L.setLanguageConfiguration('dcb', {
    comments: { lineComment: '//', blockComment: ['/*', '*/'] },
    brackets: [['{', '}'], ['[', ']'], ['(', ')']],
    autoClosingPairs: [...pairs, { open: '"', close: '"', notIn: ['string'] }],
    surroundingPairs: [...pairs, { open: '"', close: '"' }],
  });
  const parsed = () => {
    const model = activeModel();
    return model ? analyseCode(model).parsed : null;
  };
  const SYMBOL = {
    'custom-type-definition': 'TypeParameter',
    'event-definition': 'Event',
    'entity-definition': 'Class',
    'projection-definition': 'Function',
    'command-definition': 'Method',
  };
  const nameRange = (span) => new monaco.Range(span.nameLine, span.nameCol, span.nameLine, span.nameEndCol);
  const tokenRange = (token) => new monaco.Range(token.line, token.col, token.endLine, token.endCol);
  const COMPLETION_KIND = {
    keyword: 'Keyword', type: 'TypeParameter', event: 'Event', entity: 'Class', projection: 'Function',
    command: 'Method', member: 'EnumMember', field: 'Field', eventProperty: 'Field', entityProperty: 'Property',
    property: 'Property', commandProperty: 'Variable', alias: 'Variable', projectionParameter: 'Variable',
  };
  // What fits the cursor (sourceCompletions, dsl.js). A space or a
  // bracket opens the list only where something specific is expected
  // — after `require`, inside `emit E {` — never at a statement's start;
  // asked for outright where nothing is, it offers every name.
  L.registerCompletionItemProvider('dcb', {
    triggerCharacters: ['.', ' ', '(', '[', '{', ',', ':', '@'],
    provideCompletionItems: (textModel, position, context) => {
      const word = textModel.getWordUntilPosition(position);
      const range = new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn);
      const { items, slot } = sourceCompletions(textModel.getValue(), position.lineNumber, position.column,
        { model: activeModel() });
      if (context.triggerKind === L.CompletionTriggerKind.TriggerCharacter && !slot) return { suggestions: [] };
      if (items.length) {
        return {
          suggestions: items.map((item, index) => ({
            label: item.label, kind: L.CompletionItemKind[COMPLETION_KIND[item.kind] || 'Text'], detail: item.detail,
            insertText: item.insert, range, sortText: item.sort + String(index).padStart(4, '0'),
            insertTextRules: item.snippet ? L.CompletionItemInsertTextRule.InsertAsSnippet : undefined,
            command: item.retrigger ? { id: 'editor.action.triggerSuggest', title: '' } : undefined,
          })),
        };
      }
      if (slot || context.triggerKind === L.CompletionTriggerKind.TriggerCharacter) return { suggestions: [] };
      const read = parsed();
      const names = read ? read.spans.map((span) => ({
        label: span.name, kind: L.CompletionItemKind[SYMBOL[span.kind]], detail: SOURCE_KEYWORD[span.kind],
        insertText: span.name, range,
      })) : [];
      const words = [...SOURCE_KEYWORDS, ...SOURCE_BASE_TYPES].map((k) => ({
        label: k, kind: L.CompletionItemKind.Keyword, insertText: k, range,
      }));
      return { suggestions: [...names, ...words] };
    },
  });
  // Names resolve as symbols (sourceSymbols, dsl.js): `status =
  // CourseStatus` goes to the projection, not the enum it shares a name
  // with, and `course.status` to the entity's property.
  const symbolAt = (position) => {
    const read = parsed();
    return read ? sourceSymbolAt(read, position.lineNumber, position.column) : null;
  };
  L.registerDefinitionProvider('dcb', {
    provideDefinition: (textModel, position) => {
      const read = parsed();
      const at = symbolAt(position);
      if (!read || !at || at.ambiguous) return null;
      return at.symbols.map((symbol) => sourceDeclarationOf(read, symbol)).filter(Boolean)
        .map((o) => ({ uri: textModel.uri, range: tokenRange(o.token) }));
    },
  });
  L.registerReferenceProvider('dcb', {
    provideReferences: (textModel, position, context) => {
      const at = symbolAt(position);
      if (!at || at.ambiguous) return [];
      return at.occurrences.filter((o) => context.includeDeclaration || !o.decl)
        .map((o) => ({ uri: textModel.uri, range: tokenRange(o.token) }));
    },
  });
  L.registerDocumentHighlightProvider('dcb', {
    provideDocumentHighlights: (textModel, position) => {
      const at = symbolAt(position);
      if (!at || at.ambiguous) return [];
      return at.occurrences.map((o) => ({
        range: tokenRange(o.token), kind: o.decl ? L.DocumentHighlightKind.Write : L.DocumentHighlightKind.Read,
      }));
    },
  });
  // F2: everywhere the symbol occurs and nowhere else, or a reason why
  // not (sourceRename, dsl.js). An edit like any other — it still has to
  // be applied.
  L.registerRenameProvider('dcb', {
    resolveRenameLocation: (textModel, position) => {
      const read = parsed();
      const target = read ? sourceRenameTarget(read, position.lineNumber, position.column) : { error: 'Nothing to rename.' };
      if (target.error) return { range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column), text: '', rejectReason: target.error };
      return { range: tokenRange(target.token), text: target.token.v };
    },
    provideRenameEdits: (textModel, position, newName) => {
      const result = sourceRename(textModel.getValue(), position.lineNumber, position.column, newName);
      if (result.error) return { edits: [], rejectReason: result.error };
      return {
        edits: result.edits.map((e) => ({
          resource: textModel.uri, versionId: textModel.getVersionId(),
          textEdit: { range: new monaco.Range(e.line, e.col, e.endLine, e.endCol), text: e.text },
        })),
      };
    },
  });
  L.registerDocumentSymbolProvider('dcb', {
    provideDocumentSymbols: () => {
      const read = parsed();
      return read ? read.spans.map((span) => ({
        name: span.name, detail: SOURCE_KEYWORD[span.kind], kind: L.SymbolKind[SYMBOL[span.kind]], tags: [],
        range: new monaco.Range(span.line, span.col, span.endLine, span.endCol), selectionRange: nameRange(span),
      })) : [];
    },
  });
  L.registerCodeActionProvider('dcb', {
    provideCodeActions: (textModel, range, context) => {
      const model = activeModel();
      if (!model) return { actions: [], dispose() {} };
      const analysis = analyseCode(model);
      const actions = context.markers
        .filter((m) => typeof m.code === 'string' && m.code.startsWith('accept:'))
        .map((m) => {
          const warning = analysis.scenarios[Number(m.code.slice('accept:'.length))];
          if (!warning || !warning.fix) return null;
          const { fix } = warning;
          return {
            title: 'Accept actual outcome', kind: 'quickfix', diagnostics: [m], isPreferred: true,
            edit: { edits: [{
              resource: textModel.uri, versionId: textModel.getVersionId(),
              textEdit: { range: new monaco.Range(fix.line, fix.col, fix.endLine, fix.endCol), text: fix.text },
            }] },
          };
        })
        .filter(Boolean);
      return { actions, dispose() {} };
    },
  });
  const readHover = (q) => {
    const code = (words) => words.map((w) => `\`${w}\``).join(', ');
    const types = q.types.length ? code(q.types) : 'any type';
    return {
      range: new monaco.Range(q.start.line, q.start.col, q.end.endLine, q.end.endCol),
      contents: [
        { value: `**Read \`${q.alias}\`** — what it adds to the append condition` },
        { value: (q.tags.length ? `${code(q.tags)} ∧ ${types}` : `${types} (no tag — the whole log)`)
          + (q.fannedOut ? ' — one per element' : '') },
        ...(q.properties.length ? [{ value: q.properties
          .map((p) => `- \`${q.alias}.${p.name}\`: ${p.types.length ? code(p.types) : 'no events'}`).join('\n') }] : []),
        ...(q.unread.length ? [{ value: `Not read: ${code(q.unread)}` }] : []),
        { value: q.reasons.length ? `Read for: ${q.reasons.join(', ')}` : 'Read for nothing — unused' },
      ],
    };
  };
  // A command's whole boundary, on its header — the question the tool
  // exists to answer, asked of the text before it is applied: the
  // queries in the order they run, each read's share ORed within one,
  // and what the command appends. The same layout as the Consistency
  // boundary step's popover.
  const commandHover = (q) => {
    const code = (words) => words.map((w) => `\`${w}\``).join(', ');
    const itemLine = (item) => `- \`${item.alias}\`: `
      + (item.tags.length ? `${item.tags.map((t) => `\`${t}\``).join(' ∧ ')} ∧ ` : '')
      + (item.types.length ? code(item.types) : 'any type')
      + (item.tags.length ? '' : ' (no tag — the whole log)')
      + (item.fannedOut ? ' — one per element' : '');
    const queries = q.queries.length > 1
      ? q.queries.map((items, i) => ({
          value: `query ${i + 1}${i ? ` — its tags are answers from ${i === 1 ? 'query 1' : 'the queries above'}` : ''}\n\n`
            + items.map(itemLine).join('\n'),
        }))
      : [{ value: q.items.length ? q.items.map(itemLine).join('\n') : 'Reads nothing: the append is unconditional.' }];
    return {
      range: new monaco.Range(q.start.line, q.start.col, q.end.endLine, q.end.endCol),
      contents: [
        { value: `**Consistency boundary** — ${q.words}` },
        ...queries,
        ...(q.queries.length > 1 ? [{ value: 'append condition: all of the above, ORed' }] : []),
        { value: `appends ${q.writes.length ? code(q.writes) : 'no tags'}` },
        ...(q.coverage.length ? [{ value: `⚠ Writes a tag it never consulted: ${q.coverage.map((c) => readable(c.entity)).join(', ')}` }] : []),
      ],
    };
  };
  // On a read, that read's share of the boundary; on a command's
  // header, the whole of it. Anywhere on either, the summary beside
  // them included — so no word under the cursor is required.
  L.registerHoverProvider('dcb', {
    provideHover: (textModel, position) => {
      const model = activeModel();
      if (!model) return null;
      const within = (q) => new monaco.Range(q.start.line, q.start.col, q.end.endLine, q.end.endCol)
        .containsPosition(position);
      const read = codeReadQueries(model).find(within);
      if (read) return readHover(read);
      const command = codeCommandQueries(model).find(within);
      return command ? commandHover(command) : null;
    },
  });
}

function createCodeEditor() {
  registerSourceLanguage();
  const root = h('div', { class: 'code-editor' });
  const uri = monaco.Uri.parse('inmemory://model/model' + SOURCE_EXTENSION);
  const model = monaco.editor.getModel(uri) || monaco.editor.createModel(codeView.text, 'dcb', uri);
  const editor = monaco.editor.create(root, {
    model,
    automaticLayout: true,
    minimap: { enabled: false },
    fontSize: 12.5,
    lineHeight: 19,
    fontFamily: scriptEditorFont(),
    tabSize: 2,
    scrollBeyondLastLine: false,
    wordBasedSuggestions: 'off',
    fixedOverflowWidgets: true,
    renderLineHighlight: 'line',
    padding: { top: 8, bottom: 8 },
    scrollbar: { alwaysConsumeMouseWheel: false },
  });
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, applyCode);
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, applyCode);
  model.onDidChangeContent(() => { if (!codeView.loading) onCodeInput(model.getValue()); });
  // Escape belongs to the editor's own widgets, never to the page.
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.stopPropagation(); });
  return { root, editor, model };
}

function codeEditorElement() {
  if (scriptEditorPhase !== 'ready') {
    ensureScriptEditorLoaded();
    return h('textarea', {
      class: 'code-text mono', spellcheck: 'false', value: codeView.text,
      oninput: (e) => onCodeInput(e.target.value),
      onkeydown: (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); return; }
        const key = e.key.toLowerCase();
        if ((e.metaKey || e.ctrlKey) && (key === 's' || key === 'enter')) {
          e.preventDefault();
          e.stopPropagation();
          applyCode();
        }
      },
    });
  }
  if (!codeView.editor) codeView.editor = createCodeEditor();
  writeCodeEditor(codeView.text);
  monaco.editor.setTheme(isDark() ? 'vs-dark' : 'vs');
  return codeView.editor.root;
}

function downloadCode(model) {
  const blob = new Blob([codeView.text], { type: 'text/plain' });
  const link = h('a', {
    href: URL.createObjectURL(blob),
    download: (toCamel(model.name) || 'model') + SOURCE_EXTENSION,
  });
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function renderCode(model, main) {
  syncCodeView(model);
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Code',
      hint('code', 'The model as code', [
        'Every type, event, entity, projection and command on the other pages, as one text. '
          + 'Edit it and apply with ⌘S; going back to the pages applies it too. An apply is one undo step.',
        'Scenarios sit at the end of the command or projection they exercise. Leave a then out and '
          + 'applying records what the model does; a drifted one is marked, with a fix that accepts it. '
          + 'Comments are not stored — they last as long as the text in this editor.',
        'Hover a command\'s name for the consistency boundary it derives; ⌘-click a name to go to it; '
          + '⇧⌘O lists every definition. ⌃Space suggests what fits where the cursor is; F2 renames a name '
          + 'everywhere it means the same thing, and ⇧F12 lists where it is used.',
      ], null, 'notation')),
    h('div', { class: 'muted small' }, 'The same definitions as the pages, written out.')));

  codeView.statusEl = codeControls();
  main.appendChild(h('div', { class: 'code-bar' },
    codeView.statusEl,
    h('span', { class: 'grow' }),
    h('button', {
      class: 'btn ghost tiny', type: 'button',
      onclick: () => runAsync(async () => { await navigator.clipboard.writeText(codeView.text); toast('Copied.'); }),
    }, 'Copy'),
    h('button', { class: 'btn ghost tiny', type: 'button', onclick: () => downloadCode(model) },
      'Download ' + SOURCE_EXTENSION)));

  main.appendChild(codeEditorElement());
  const analysis = analyseCode(model);
  codeView.listEl = codeProblemList(analysis);
  main.appendChild(codeView.listEl);

  // Follow the page state: reveal the definition it is about whenever
  // that changed since the code was last shown.
  const target = pageDefinition();
  const key = target ? target.join(':') : null;
  const shown = codeView.shownView;
  codeView.shownView = state.view;
  if (key !== codeView.focus || shown === null) {
    codeView.focus = key;
    const span = target ? sourceSpanOf(analysis.parsed, target[0], target[1]) : null;
    // After this paint has attached the editor — a timeout rather than
    // a frame, which a background tab never gets.
    setTimeout(() => {
      if (span) revealCodeAt(span.nameLine, span.nameCol, span.line);
      else if (codeView.editor) codeView.editor.editor.focus();
    }, 0);
  }
  setTimeout(refreshCodeChrome, 0);
}

// Escape backs out of one layer, wherever the focus happens to be, and
// the layers are the order in which they were opened: the settings sit
// over the page, a form sits over the row that opened it, and a
// selected row sits under both. Nothing here reaches the model — every
// layer it closes is a decision not yet made.
window.addEventListener('keydown', (e) => {
  // A field that handles Escape itself has already handled it: the
  // inline forms cancel on it, and cancelling once should not also
  // throw away the selection underneath.
  if (e.key !== 'Escape' || e.defaultPrevented) return;

  // Quick open handles its own Escape and stops it there, so reaching
  // this while it is up means it is already gone.
  if (state.palette) { closePalette(); return render(); }
  if (state.queryPop) { state.queryPop = null; return render(); }
  if (state.hintPop) { state.hintPop = null; return render(); }
  if (state.lcMenu) { state.lcMenu = null; return render(); }
  if (state.pendingImport) { state.pendingImport = null; return render(); }
  if (state.help) { state.help = null; return render(); }
  if (state.problems) { state.problems = false; return render(); }
  if (state.settings) { state.settings = false; return render(); }
  if (state.models) {
    state.models = false;
    state.newModel = false; state.loadingUrl = false; state.loadingJson = false;
    return render();
  }
  // The splash's own naming form — reachable without the Models modal
  // ever opening.
  if (state.newModel) { state.newModel = false; return render(); }
  // The splash itself, reached from the brand mark over a model that
  // is still loaded — Escape is the quick way back to it. With nothing
  // loaded the splash is the only page there is, so this is a no-op.
  if (state.splash && activeModelId()) { state.splash = false; return render(); }

  // Inside a free text field, Escape is about the field: it steps out
  // and leaves everything else where it is. A second press then backs
  // out of the row the field was in.
  const field = e.target instanceof Element
    && e.target.closest('input, textarea, select');
  if (field) { field.blur(); return; }

  // Escape is the one way out that never commits: whatever edit was
  // half-made is dropped *before* `closeForms` runs, because
  // `closeForms` commits pending edits for every other gesture and
  // "never mind" must not be the exception that adds something.
  if (formOpen()) { discardPendingEdits(); closeForms(); return render(); }

  // A selected row, an adder unfolded under a list, a reference pinned
  // to its source: whichever of these is on, Escape puts it back.
  if (state.sel || state.adder || state.lit) {
    const key = state.sel;
    // An open adder folds back to a single button, which is fewer tab
    // stops than the form it replaces — closing it shifts everything
    // after it up the page, so the generic by-position focus restore in
    // `render` overshoots into whatever now sits where the keyboard
    // used to be. Noting which step the keyboard was in before the
    // repaint is what lets it land on that step's own folded button
    // instead, the same way opening one does.
    const openStep = document.activeElement instanceof Element
      ? document.activeElement.closest('.step')
      : null;
    const openStepKind = openStep
      && [...openStep.classList].find((c) => c !== 'step');
    state.sel = null; state.adder = null; state.lit = null;
    discardPendingEdits();     // Escape discards, always — see above
    render();
    // Deselecting must not also lose the keyboard's place on the page.
    if (key) {
      const row = document.querySelector(`.qrow[data-key="${CSS.escape(key)}"]`);
      if (row) row.focus();
    } else if (openStepKind) {
      const btn = document.querySelector('.step.' + openStepKind + ' .flow-adder');
      if (btn) btn.focus();
    }
  }
});

// ⌘K, ⌘S and ⌘Z: quick open, sharing and undo, all reachable from
// anywhere in the page.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const command = e.metaKey || e.ctrlKey;
  if (!command) return;
  const key = e.key.toLowerCase();

  if (key === 'k') {
    if (!activeModelId()) return;
    e.preventDefault();
    if (state.palette) { closePalette(); render(); } else openPalette();
  } else if (key === 's') {
    if (!activeModelId()) return;
    e.preventDefault();
    runAsync(shareCurrentModel);
  } else if (key === 'z') {
    // Inside a field ⌘Z is the field's own undo, and taking it would
    // make a half-typed name unrecoverable.
    const inField = e.target instanceof Element
      && e.target.closest('input, textarea, select');
    if (inField) return;
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
});

// `?` opens the help at what the page is about, and closes it again —
// the convention, and the one key a field never needs to give up,
// since inside one it is only ever typed.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.key !== '?' || e.metaKey || e.ctrlKey || e.altKey) return;
  const inField = e.target instanceof Element
    && e.target.closest('input, textarea, select, [contenteditable]');
  if (inField || state.palette || state.pendingImport) return;
  e.preventDefault();
  if (state.help) { state.help = null; render(); } else openHelp(helpTopicHere());
});

// Arrow keys move between rows. Reading a command is walking down its
// rows — Tab visits every button on the way, the arrows visit only the
// rows.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const inField = e.target instanceof Element
    && e.target.closest('input, textarea, select');
  if (!inField && !state.palette && !state.settings && !state.problems && !state.models && !state.help
      && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    if (moveRow(e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
  }
});

// The disclaimer wraps to two lines on a narrow-enough screen, which
// changes .topbar's real height — everything sticky beneath it reads
// `--topbar-h` rather than a guessed constant, so it stays measured
// instead of drifting out of sync on resize or rotation.
function syncTopbarHeight() {
  const topbar = document.querySelector('.topbar');
  if (topbar) document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
}
window.addEventListener('resize', syncTopbarHeight);

// Set once at load — a copyright year has no reason to change again
// before the next reload, unlike the topbar height above.
function setFooterYear() {
  document.getElementById('footer-year').textContent = new Date().getFullYear();
}

// The rail drawer closes itself once a link in it is actually followed
// — on a narrow screen there is no other way back to the content it
// was covering. Delegated once, on the rail's own element (which
// `renderRail` never replaces, only refills), rather than threaded
// through every one of its many links.
document.getElementById('rail').addEventListener('click', (e) => {
  if (state.railOpen && e.target.closest('a')) { state.railOpen = false; render(); }
});

// A `#model=…` fragment never reaches the server (there is none), so
// this is the only place it is read. Cleared as soon as it is read,
// successfully or not — a bad or already-consumed link should not keep
// re-triggering on every reload.
async function boot() {
  // Safe mode — the way back into a model whose script hangs the page
  // on load, now that scripts run unprompted like everything else.
  // Nothing in the interface sets it; typing `?safe` into the address
  // is the gesture, and every script handler then compiles to a
  // thrower instead of running (see evaluate.js).
  if (new URLSearchParams(location.search).has('safe')) {
    setScriptsDisabled(true);
    toast('Safe mode — scripts are off. Remove "?safe" from the address to run them.', true);
  }
  render();
  syncTopbarHeight();
  setFooterYear();
  const hash = location.hash;
  if (!hash.startsWith('#model=')) return;
  history.replaceState(null, '', location.pathname + location.search);
  let envelope;
  try {
    envelope = await decodeShareLink(hash.slice('#model='.length));
  } catch (error) {
    toast('That share link could not be read: ' + error.message, true);
    return;
  }
  // Opened before and unchanged since: back to that copy rather than a
  // second one beside it (`modelMatchingEnvelope`). The script gate is
  // not asked again for code it already let in.
  const existing = modelMatchingEnvelope(envelope);
  if (existing) {
    switchToModel(existing);
    state.models = false;
    render();
    toast('This model was opened before — switched to it.');
    return;
  }
  beginImport(envelope);
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
