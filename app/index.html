<script src="webmcp.js"></script>
<script>
// ============================================================
// A · Slices
//
// Two levels. A *feature* ("Course management") is a heading over the
// *commands* that make it up; a command is the unit of work, and
// everything it touches lives on one page — the events it records and
// the state those events change included.
//
// Three rules this interface holds to:
//   - names are written the way you would say them ("define course"),
//     and the PascalCase the schema wants is derived, not typed;
//   - a new command is described in the page, not in a dialog — there
//     are no browser prompts anywhere in here;
//   - the machinery (identifier schemas, custom types, projections, the
//     derived boundary, the entity manager) only appears in Advanced.
// ============================================================

const state = {
  view: 'overview',         // 'overview' | 'slice' | 'entity' | 'types' | 'projections' | 'events' | …
  // The main area shows the model as code instead of its pages — see
  // `renderCode`. Remembered per browser, like the other view choices;
  // the key is spelled out because SURFACE_KEY is declared further down.
  code: localStorage.getItem('dcb-playground:surface') === 'code',
  slice: null,
  sel: null,                // the row being attended to
  adder: null,              // which "add another" is unfolded
  projDraft: null,          // { name, body } — a projection being edited
  newProjection: null,      // a projection being described
  renamingProjection: null,
  newEvent: null,           // { name } — a bare event being described
  renamingEvent: null,
  renamingCommand: null,
  editMember: null,         // { where, name } — the member being edited
  editRule: null,           // index of the condition being edited
  editBinding: null,        // alias of the boundary binding being edited
  bindingDraft: null,       // in-progress edits to that binding
  ruleDraft: null,          // in-progress edits to a condition
  changeDraft: null,        // in-progress "what this event changes" row
  fieldDraft: null,         // the one half-typed field row — see commitPendingField
  queryPop: null,           // key of the pinned DCB-query popover, if any
  hintPop: null,            // key of the pinned concept hint, if any
  lcMenu: null,             // key of the open lifecycle menu in Identity, if any
  lcOpen: {},               // entity name -> its state row unfolded in Identity.
                            // Session-only, like `wizard`: a view choice, not the model.
  wizard: null,             // { slice, upto } — a brand-new command revealing its steps.
                            // Session-only on purpose: how far someone got is authoring
                            // state, not a fact about the model, so it is never stored.
  openEvent: null,
  collapsed: {},            // feature name -> collapsed in the rail
  entitiesCollapsed: false, // the entity list in the rail
  entity: null,             // the thing whose own page is open
  namingCommand: false,     // naming a brand-new command: true, or the feature it lands in
  newFeature: false,        // inline form open in the rail
  renamingFeature: null,
  newEntityAt: null,        // 'rules' | 'changes:<Event>' | 'rail'
  addingProp: null,         // { eventName } | { at }
  addingMember: null,       // { type, eventName? } — adding a member to an enum custom type
  renamingEntity: null,
  iconPicker: null,         // the entity whose mark is being chosen
  eventIconPicker: null,    // the event whose mark is being chosen
  commandIconPicker: null,  // the command whose mark is being chosen
  confirmRemove: null,
  splash: false,            // showing the splash on top of a model that's still loaded — see `paintPage`
  models: false,            // the Models modal, opened on request — switch, load, or manage
  newModel: false,        // naming form for a brand-new model — on the splash or in the modal
  loadingUrl: false,        // within the Models modal: form open, asking for a URL to load
  loadingJson: false,       // within the Models modal: form open, asking for pasted JSON
  splashFaqOpen: { 0: true }, // which FAQ entries are expanded, on the first-run splash
  pendingImport: null,      // a decoded share envelope waiting on the scripted-code confirm
  settings: false,          // the settings modal
  help: null,               // the help modal: { topic, land, scroll } while it is up — see `openHelp`
  problems: false,         // the loose-ends-and-drifted-scenarios panel
  railOpen: false,          // the rail, as an off-canvas drawer on a narrow screen
  importExport: false,      // the Import & Export modal
  ieTab: 'import',          // within it: 'import' | 'export'
  ieImportMode: 'url',      // within Import: 'url' | 'json'
  ieExportMode: 'json',     // within Export: 'json' | 'link'
  ieIncludeScenarios: true, // within Export: leave scenarios out of what is sent
  ieIncludeSandbox: true,   // within Export: leave the recorded sandbox steps out
  ieLink: null,             // within Export: the computed share link, once it resolves
  ieCopiedJson: false,      // brief "Copied ✓" state on the Copy JSON button
  ieCopiedLink: false,      // brief "Copied ✓" state on the Copy link button
  palette: false,           // quick open is up
  lit: null,                // a reference pinned to its source
  land: null,               // a row to bring on screen after the repaint
  tab: 'definition',        // 'definition' | 'scenarios' on a command page
  openScenarios: new Set(), // keys of every scenario whose detail is unfolded — any number at once
  // { key, insertAfter, body } — a scenario being written or, with `key`
  // set, an existing one being fully edited in place. `insertAfter`
  // names the sibling a freshly created one lands after; null means "no
  // sibling to land after" (the list was empty) and is ignored once
  // `key` is set, since an edit never moves what it edits.
  scenarioDraft: null,
  sandboxDraft: null,       // { command, arguments } — a command about to be driven
  projTab: 'definition',    // 'definition' | 'checks' inside the opened ledger row
  openProjectionScenarios: new Set(), // keys of every projection scenario whose detail is unfolded
  projectionScenarioDraft: null, // { key, insertAfter, body } — see `scenarioDraft`
  watchDraft: null,         // { projection, arguments } — a projection about to be watched
};

// A decoded share envelope, on its way in — from the URL fragment on
// page load, or from any of the Models modal's ways to load one.
// Scripted content is the one thing worth pausing for: everything else
// an untrusted import might get wrong either fails the structural gate
// (skipped, and said so) or loads and surfaces as advisories — the
// same regime every other edit lives under.
function beginImport(envelope) {
  if (envelopeHasScript(envelope)) { state.pendingImport = envelope; render(); return; }
  finishImport(envelope);
}

// What opening a different stored model means, wherever it happens —
// the Models modal, an import, the fallback after a delete. The
// sandbox session and the pending feature groups are browser-global,
// not part of any model, so neither may survive the crossing: a
// session scrubbed against model A must not render against model B.
function switchToModel(id) {
  localStorage.setItem(MODEL_KEY, id);
  sessionReset();
  setPendingFeatures([]);
  state.slice = null;
  state.view = 'overview';
  state.splash = false;
}

function finishImport(envelope) {
  run(() => {
    const { modelId, skipped } = importModelFromEnvelope(envelope);
    switchToModel(modelId);
    // A model is now loaded, so whatever asked the Models modal or the
    // splash to open — a menu click, the brand mark, or nothing having
    // been loaded yet — is answered.
    state.models = false;
    const steps = (envelope.sandbox && envelope.sandbox.steps) || [];
    if (steps.length) {
      const model = projectState()[modelId];
      for (const step of steps) sessionRun(model, step.command, step.args);
    }
    // An import is best-effort: whatever a definition got wrong
    // semantically loaded anyway and sits in the Problems panel, but a
    // definition too malformed to store at all was skipped — and this
    // toast is the only trace of it, because the Problems panel can
    // only speak about what exists. Said once, in full, right now.
    if (skipped.length) {
      const lines = skipped.map((s) => `${humanize(s.kind)} "${s.name}": ${s.reason}`);
      toast(`Skipped on import — the rest of the model loaded. ${lines.join(' · ')}`, true);
    }
    // A newer minor loaded fine — that is what a minor promises — but
    // whatever it added is being ignored, and saying so beats letting
    // someone wonder later why part of their model did not survive.
    const warning = envelopeVersionWarning(envelope);
    if (warning) toast(warning, true);
  });
}

// ---------- which model is open ----------
//
// Every model this browser knows about, and the three ways to get
// another one: a URL someone else hosts, JSON pasted directly, or one
// of the examples this page ships — loaded the same way as any other
// shared model, over a relative fetch, so there is only one import path
// to trust rather than two. Shown on request, from the bar's model
// button or from the first-run splash below — see `renderSplash` for
// the page shown instead of this, unrequested, while nothing is loaded.

function jsonLoadForm(onSubmit, onCancel) {
  let text = '';
  const textarea = h('textarea', {
    placeholder: 'Paste a shared model’s JSON here…',
    style: 'width:100%; min-height:140px; font-family:var(--mono); font-size:11px;',
    oninput: (e) => { text = e.target.value; },
    onkeydown: (e) => { if (e.key === 'Escape') { e.preventDefault(); onCancel(); } },
  });
  setTimeout(() => textarea.focus(), 0);
  return h('div', { class: 'inline-form' },
    h('div', { class: 'q' }, 'Paste the model’s JSON'),
    textarea,
    h('div', { class: 'adder', style: 'margin-top:8px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          let envelope;
          try { envelope = JSON.parse(text); } catch { return toast('That is not valid JSON.', true); }
          onSubmit(envelope);
        },
      }, 'Load'),
      h('button', { class: 'btn ghost', onclick: onCancel }, 'Cancel')));
}

function modelsModal() {
  const activeId = activeModelId();
  const saved = Object.values(projectState()).sort((a, b) => a.name.localeCompare(b.name));
  const close = () => {
    state.models = false;
    state.newModel = false; state.loadingUrl = false; state.loadingJson = false;
    render();
  };

  const startNew = state.newModel
    ? inlineForm({
        question: 'Model name',
        onSubmit: (v) => {
          state.newModel = false; state.splash = false; createNamedModel(v); close();
        },
        onCancel: () => { state.newModel = false; render(); },
      })
    : state.loadingUrl
      ? inlineForm({
          question: 'Model URL', placeholder: 'https://…', submitLabel: 'Load',
          onSubmit: (v) => {
            state.loadingUrl = false;
            runAsync(async () => beginImport(await loadModelFromUrl(v)));
          },
          onCancel: () => { state.loadingUrl = false; render(); },
        })
      : state.loadingJson
        ? jsonLoadForm(
            (envelope) => { state.loadingJson = false; beginImport(envelope); },
            () => { state.loadingJson = false; render(); })
        : h('div', { class: 'adder' },
            h('button', { class: 'btn', onclick: () => { state.newModel = true; render(); } },
              '+ New empty model'),
            h('button', { class: 'btn', onclick: () => { state.loadingUrl = true; render(); } },
              'From a URL…'),
            h('button', { class: 'btn', onclick: () => { state.loadingJson = true; render(); } },
              'From JSON…'));

  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Models'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'muted small' },
      activeId
        ? 'Every model this browser knows about, and the ways to get another one.'
        : 'Nothing is loaded yet — start a new model, load one, or try an example.'),
    saved.length ? h('div', { class: 'setting' },
      h('h4', {}, 'Your models'),
      saved.map((other) => h('div', { class: 'row' },
        h('button', {
          class: 'btn' + (other.id === activeId ? ' primary' : ''),
          style: 'flex:1; text-align:left',
          onclick: () => { switchToModel(other.id); close(); },
        }, other.name),
        removeButton('model:' + other.id, {
          title: 'Remove this model and everything defined in it',
          confirm: 'Really remove this model?',
          onRemove: () => run(() => {
            const wasActive = other.id === activeModelId();
            deleteDcbModel(other.id);
            if (wasActive) {
              const rest = Object.keys(projectState());
              if (rest.length) {
                switchToModel(rest[0]);
              } else {
                localStorage.removeItem(MODEL_KEY);
                sessionReset();
                setPendingFeatures([]);
                state.slice = null; state.view = 'slice';
              }
            }
          }),
        })))) : null,
    h('div', { class: 'setting' }, h('h4', {}, 'Start a new one'), startNew),
    h('div', { class: 'setting' },
      h('h4', {}, 'Or try an example'),
      PREDEFINED_MODELS.map((entry) => h('button', {
        class: 'choice',
        onclick: () => runAsync(async () =>
          beginImport(await loadModelFromUrl('examples/' + entry.slug + '.json'))),
      }, h('span', { style: 'flex:0 0 170px' }, entry.name),
        h('span', { class: 'why', style: 'flex:1' }, entry.description)))),
    h('div', { class: 'adder', style: 'margin-top:18px' },
      h('button', { class: 'btn primary', onclick: close }, 'Done')));
  setTimeout(() => modal.focus(), 0);
  return overlayAround(modal, close);
}

// ---------- first-run splash ----------
//
// The page shown, in #main, instead of the Models modal while nothing
// is loaded — a full page to land on rather than a dialog standing in
// front of one. "+ New empty model" and the examples below reuse the
// exact paths the Models modal uses (`createNamedModel`, `beginImport`
// over a relative fetch); everything else — a URL, pasted JSON, an
// existing saved model — is one click away, through that same modal.

const PLAY_ICON_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">'
  + '<path d="M8 5v14l11-7z"></path></svg>';

const CHEVRON_ICON_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" '
  + 'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<polyline points="9 6 15 12 9 18"></polyline></svg>';

const SPLASH_FAQS = [
  { q: 'What is a Dynamic Consistency Boundary?',
    a: 'It replaces a fixed aggregate boundary with one a command declares for itself — '
      + 'exactly the events it needs to stay consistent with, no more. This playground models '
      + 'that boundary directly, so you can see its shape before it’s code.' },
  { q: 'Do I need to know event sourcing already?',
    a: 'It helps, but isn’t required. Commands, events, entities and projections are the '
      + 'whole vocabulary — the playground shows how they connect as you build, one '
      + 'definition at a time.' },
  { q: 'Where is my model stored?',
    a: 'In this browser only, until you say otherwise. Nothing is sent anywhere — export '
      + 'it as JSON or copy a link when you want to keep it or hand it to someone else.' },
  { q: 'Can I share a model with someone else?',
    a: 'Yes. Export it as JSON, or copy a link that reopens it exactly as it is — both are '
      + 'one click away from the import/export dialog.' },
  { q: 'Can I come back to an example later, or switch models?',
    a: 'Any time, from the Models menu — it lists everything saved in this browser '
      + 'alongside the built-in examples.' },
];

function toggleSplashFaq(i) {
  const open = Object.assign({}, state.splashFaqOpen);
  open[i] = !open[i];
  state.splashFaqOpen = open;
  render();
}

function renderSplash(main) {
  const openModels = () => { state.models = true; render(); };

  const cta = state.newModel
    ? inlineForm({
        question: 'Model name',
        onSubmit: (v) => { state.newModel = false; state.splash = false; createNamedModel(v); },
        onCancel: () => { state.newModel = false; render(); },
      })
    : h('div', { class: 'splash-cta' },
        h('button', { class: 'btn primary', onclick: () => { state.newModel = true; render(); } },
          '+ New empty model'),
        h('span', { class: 'splash-hint' }, 'or pick an example below'));

  main.appendChild(h('div', { class: 'splash' },
    h('div', { class: 'splash-hero' },
      h('img', { class: 'splash-mark', src: 'logo-mark.png', alt: '', 'aria-hidden': 'true' }),
      h('h1', {}, 'DCB Playground'),
      h('p', { class: 'splash-tagline' }, 'Model consistency boundaries without writing a line of code.')),

    h('p', { class: 'splash-intro' },
      'Dynamic Consistency Boundary decouples what a command must stay consistent with from '
        + 'any fixed aggregate. This playground lets you build that model by hand — events, entities, '
        + 'projections and the commands that guard them — and watch the derived boundary take shape '
        + 'as you go.'),

    cta,

    h('div', { class: 'splash-import-link' }, 'Already have a model? ',
      h('a', { href: '#', onclick: (e) => { e.preventDefault(); openModels(); } },
        'Import it as JSON or a link →')),

    h('div', { class: 'splash-section' },
      h('h2', {}, 'Examples'),
      h('div', { class: 'splash-examples' },
        PREDEFINED_MODELS.map((entry) => h('button', {
          class: 'splash-example',
          onclick: () => runAsync(async () =>
            beginImport(await loadModelFromUrl('examples/' + entry.slug + '.json'))),
        }, h('div', { class: 'name' }, entry.name),
          h('div', { class: 'desc' }, entry.description))))),

    h('div', { class: 'splash-section' },
      h('h2', {}, 'See it in motion'),
      h('div', { class: 'splash-video' },
        h('div', { class: 'play' }, h('span', { html: PLAY_ICON_SVG })),
        h('div', { class: 'caption' }, 'Introduction video — coming soon'))),

    h('div', { class: 'splash-section' },
      h('h2', {}, 'FAQ'),
      h('div', { class: 'splash-faq' },
        SPLASH_FAQS.map((item, i) => {
          const isOpen = !!state.splashFaqOpen[i];
          return h('div', { class: 'splash-faq-item' },
            h('button', { class: 'splash-faq-q', onclick: () => toggleSplashFaq(i) },
              h('span', { class: 'chev', style: `transform: rotate(${isOpen ? 90 : 0}deg)` },
                h('span', { html: CHEVRON_ICON_SVG })),
              h('span', {}, item.q)),
            isOpen ? h('div', { class: 'splash-faq-a' }, item.a) : null);
        }))),

    h('div', { class: 'splash-footer' }, 'Built around the Dynamic Consistency Boundary pattern — ',
      h('a', { href: 'https://dcb.events', target: '_blank', rel: 'noopener' }, 'dcb.events ↗'))));
}

const NEW = ' new';         // sentinel row in a picker

// ⌘S keeps its own quick path, unchanged: build the full link, land it
// in the address bar, copy it, done. The Import & Export modal below
// wants the same link on demand instead — see `refreshExportLink`.
async function shareCurrentModel() {
  const link = await buildShareLink(activeModel());
  history.replaceState(null, '', link);
  try {
    await navigator.clipboard.writeText(link);
    toast('Link copied — this page\'s address now reopens this model.');
  } catch {
    toast('This page\'s address now reopens this model — copy it from the address bar.');
  }
}

// ---------- import & export modal ----------
//
// `buildShareEnvelope` (model.js) always carries everything — property
// scenarios and the recorded sandbox steps included, since ⌘S and the
// generated examples both want full fidelity. The modal offers to leave
// either out, so a model can be sent without the walkthrough that
// exercises it or the steps someone happened to be mid-sandbox on; that
// trimming is a UI concern, not something the shared builder needs to
// know about.
function exportEnvelope(model, { includeScenarios, includeSandbox }) {
  const steps = includeSandbox ? session.steps.map(({ command, args }) => ({ command, args })) : [];
  const envelope = buildShareEnvelope(model, steps);
  if (!includeScenarios) {
    envelope.scenarioDefinitions = [];
    delete envelope.projectionScenarioDefinitions;
  }
  return envelope;
}

// The same wrapping `buildShareLink` does, but around a caller-built
// envelope instead of a freshly-built full one.
async function computeExportLink(envelope) {
  const encoded = await gzipToBase64Url(JSON.stringify(envelope));
  return location.origin + location.pathname + '#model=' + encoded;
}

// Each refresh takes a fresh token and only the holder of the current
// one may land its result — toggling Include options mid-compute must
// not let a superseded envelope win the link and the address bar.
let exportLinkToken = 0;

function refreshExportLink() {
  const model = activeModel();
  const token = ++exportLinkToken;
  runAsync(async () => {
    const envelope = exportEnvelope(model, {
      includeScenarios: state.ieIncludeScenarios, includeSandbox: state.ieIncludeSandbox,
    });
    const link = await computeExportLink(envelope);
    if (token !== exportLinkToken) return;
    history.replaceState(null, '', link);
    state.ieLink = link;
  });
}

function openImportExport() {
  state.importExport = true;
  state.ieTab = 'export';
  state.ieImportMode = 'url';
  state.ieExportMode = 'link';
  state.ieIncludeScenarios = true;
  state.ieIncludeSandbox = true;
  state.ieLink = null;
  state.ieCopiedJson = false;
  state.ieCopiedLink = false;
  render();
  refreshExportLink();
}

function renderModals() {
  const host = document.getElementById('modal-host');
  host.innerHTML = '';
  // One host, one overlay: every panel here is "the page, with
  // something in front of it", and two of them at once would be a
  // stack with no way back down it. The import gate wins over
  // everything — it is not a panel someone opened, it is standing
  // between them and whatever they were about to do. The Models modal
  // comes last, and only when someone asked for it — while nothing is
  // loaded, `renderSplash` is the page rather than a panel over it.
  if (state.pendingImport) { host.appendChild(renderImportGate()); return; }
  if (state.help) { host.appendChild(helpModal()); placeHelpScroll(); return; }
  if (state.problems) { host.appendChild(problemsPanel()); return; }
  if (state.settings) { renderSettingsModal(host); return; }
  if (state.importExport) { host.appendChild(renderImportExportModal()); return; }
  if (state.models) { host.appendChild(modelsModal()); return; }
}

// A modal, and the thin backdrop that closes it. Clicking the backdrop
// only counts when it is the backdrop that was clicked — a click that
// started inside the modal and drifted out of it is not a dismissal.
function overlayAround(modal, close) {
  return h('div', {
    class: 'overlay',
    onclick: (e) => { if (e.target === e.currentTarget) close(); },
  }, modal);
}

// ---------- help ----------
//
// The concepts, and how each is written in DCB notation. What it says
// is help.js; this is the panel. It opens at a topic from wherever a
// concept is in front of the reader — the bar's button at the page's
// own (`helpTopicHere`), a hint panel at its section's, `?` from the
// keyboard — and anything else that wants to point at an explanation
// calls `openHelp(id)`. A modal on purpose: the page behind keeps its
// place, and Escape is the way back to it.
//
// The topics scroll inside the panel, and every repaint rebuilds it,
// so where the reader is has to outlive one: the offset is kept in
// `state.help` as they scroll, and `land` asks for the one jump to a
// topic that opening it, or a link inside it, means.
const HELP_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>'
  + '<line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

function openHelp(topic) {
  if (state.palette) closePalette();
  state.hintPop = null;
  state.queryPop = null;
  state.help = { topic: helpTopic(topic) ? topic : null, land: true, scroll: 0 };
  render();
}

// The topic of whatever the page is about: the definition under the
// cursor in the code view, the page's own kind of thing elsewhere, and
// the top of the help where a page is about no one concept.
function helpTopicHere() {
  if (!activeModel() || state.splash) return null;
  if (state.code) {
    const parsed = codeView.analysis && codeView.analysis.parsed;
    const line = parsed ? codeCursorLine() : null;
    const span = line ? sourceSpanAt(parsed, line) : null;
    return span ? helpTopicFor(span.kind, parsed.collections[span.kind][span.name]) : 'notation';
  }
  if (state.view === 'slice') return state.tab === 'scenarios' ? 'scenario' : 'command';
  return {
    entity: 'entity', types: 'custom-type', projections: 'projection', events: 'event', lifecycles: 'lifecycle',
  }[state.view] || null;
}

function helpButton() {
  return h('button', {
    class: 'icon-btn', type: 'button', title: 'Help — the concepts, and how each is written (?)',
    'aria-label': 'Help', onclick: () => openHelp(helpTopicHere()),
  }, h('span', { html: HELP_ICON_SVG }));
}

// A link into the help, for prose elsewhere that names a concept.
function helpLink(topic, label) {
  return h('button', {
    type: 'button', class: 'xref',
    onclick: (e) => { e.stopPropagation(); openHelp(topic); },
  }, label);
}

function goToHelpTopic(topic) {
  state.help.topic = topic;
  state.help.land = true;
  placeHelpScroll();
}

// After the panel is in the document: the jump `land` asked for, or
// back to where the reader had scrolled to before this repaint.
function placeHelpScroll() {
  const pages = document.querySelector('.help-pages');
  if (!pages || !state.help) return;
  const target = state.help.land && state.help.topic
    ? document.getElementById('help-' + state.help.topic) : null;
  pages.scrollTop = target ? target.offsetTop : state.help.land ? 0 : state.help.scroll;
  state.help.land = false;
  state.help.scroll = pages.scrollTop;
  markHelpTopic(pages);
}

// The contents follow the reading: the topic marked is the last one
// whose heading has scrolled past the top. Done on the elements, since
// a repaint per scroll event would be one per frame.
function markHelpTopic(pages) {
  let current = HELP_TOPICS[0].id;
  for (const section of pages.querySelectorAll('.help-topic')) {
    if (section.offsetTop - pages.scrollTop > 24) break;
    current = section.dataset.topic;
  }
  if (pages.scrollTop + pages.clientHeight >= pages.scrollHeight - 2) current = HELP_TOPICS[HELP_TOPICS.length - 1].id;
  state.help.topic = current;
  for (const button of document.querySelectorAll('.help-toc button')) {
    button.classList.toggle('on', button.dataset.topic === current);
  }
}

function helpProse(text) {
  return helpRuns(text).map((run) => {
    if (run.code !== undefined) return h('code', {}, run.code);
    if (run.link !== undefined) {
      // An anchor, not a button: a button is an atomic box, and the
      // full stop after it would wrap onto a line of its own.
      return h('a', {
        href: '#help-' + run.link, class: 'xref',
        onclick: (e) => { e.preventDefault(); goToHelpTopic(run.link); },
      }, run.text);
    }
    return run.text;
  });
}

function helpCode(text) {
  return h('pre', { class: 'help-code' },
    sourceHighlight(text).map(([cls, part]) => (cls ? h('span', { class: 'hl-' + cls }, part) : part)));
}

function helpBoundaryList(topic) {
  return h('div', { class: 'help-boundary' }, helpBoundaries(topic).map((summary) =>
    h('div', {},
      h('div', { class: 'cmdline' }, h('b', {}, summary.command), h('span', { class: 'muted' }, summary.words)),
      summary.queries.map((query, round) => query.map((item) => h('div', { class: 'hq dcb' },
        summary.queries.length > 1 ? h('span', { class: 'muted' }, `${round + 1}. `) : null,
        h('span', { class: 'muted' }, item.alias + ': '),
        dcbQueryWords(item)))))));
}

function helpSection(topic) {
  const example = helpExcerpt(topic);
  return h('section', { class: 'help-topic', id: 'help-' + topic.id, 'data-topic': topic.id },
    h('h3', {}, topic.title,
      topic.href ? h('a', { href: topic.href, target: '_blank', rel: 'noopener' }, 'dcb.events ↗') : null),
    topic.prose.map((text) => h('p', {}, helpProse(text))),
    example ? helpCode(example) : null,
    topic.boundaryOf ? helpBoundaryList(topic) : null,
    topic.syntax ? h('table', { class: 'help-syntax' }, h('tbody', {},
      topic.syntax.map(([spelling, meaning]) => h('tr', {},
        h('td', {}, spelling), h('td', {}, helpProse(meaning)))))) : null);
}

function helpModal() {
  const close = () => { state.help = null; render(); };
  const toc = h('nav', { class: 'help-toc', 'aria-label': 'Topics' });
  let group = null;
  for (const topic of HELP_TOPICS) {
    if (topic.group !== group) {
      group = topic.group;
      toc.appendChild(h('h5', {}, group));
    }
    toc.appendChild(h('button', {
      type: 'button', 'data-topic': topic.id, class: topic.id === state.help.topic ? 'on' : '',
      onclick: () => goToHelpTopic(topic.id),
    }, topic.title));
  }
  const pages = h('div', {
    class: 'help-pages', tabindex: '-1',
    onscroll: (e) => {
      if (!state.help) return;
      state.help.scroll = e.target.scrollTop;
      markHelpTopic(e.target);
    },
  }, HELP_TOPICS.map(helpSection));
  const modal = h('div', { class: 'modal help', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Help' },
    h('header', {},
      h('h2', {}, 'Help'),
      h('span', { class: 'muted small' }, 'The concepts, and how each is written in DCB notation'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'help-body' }, toc, pages));
  // The pages, not the panel, take the focus: they are what the arrow
  // and page keys should scroll.
  setTimeout(() => pages.focus({ preventScroll: true }), 0);
  return overlayAround(modal, close);
}

// The one confirmation an import can force: the model it would build
// runs authored code the moment anything touches it. Everything else an
// untrusted import might get wrong is caught by the validating commands
// `finishImport` replays it through, so there is nothing else to ask.
function renderImportGate() {
  const envelope = state.pendingImport;
  const close = () => { state.pendingImport = null; render(); };
  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Import shared model'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'setting' },
      h('h4', {}, envelope.name || 'Untitled model'),
      h('div', { class: 'why' },
        'This model includes custom code that will run in your browser as soon as it is '
        + 'imported — its projections and scenarios evaluate automatically. Only import it if '
        + 'you trust where this came from.')),
    h('div', { class: 'adder', style: 'margin-top:18px' },
      h('button', {
        class: 'btn primary',
        onclick: () => { state.pendingImport = null; finishImport(envelope); },
      }, 'Import anyway'),
      h('button', { class: 'btn ghost', onclick: close }, 'Cancel')));
  setTimeout(() => modal.focus(), 0);
  return overlayAround(modal, close);
}

// Both directions a model crosses this browser's boundary, in one
// dialog: pulling one in, from a URL or pasted JSON, and sending this
// one out the same two ways. Reached from the bar's import/export
// button, which opens straight to Export — the button used to be
// "share", and this is that job's closest tab.
function renderImportExportModal() {
  const model = activeModel();
  const close = () => { state.importExport = false; render(); };

  let urlValue = '';
  let jsonValue = '';

  const doImportLoad = () => {
    if (state.ieImportMode === 'url') {
      if (!urlValue.trim()) return;
      state.importExport = false;
      runAsync(async () => beginImport(await loadModelFromUrl(urlValue.trim())));
    } else {
      if (!jsonValue.trim()) return;
      let envelope;
      try { envelope = JSON.parse(jsonValue); } catch { return toast('That is not valid JSON.', true); }
      state.importExport = false;
      beginImport(envelope);
    }
  };

  const importPanel = h('div', {},
    h('div', { class: 'ie-subtoggle' },
      h('button', {
        class: 'ie-pill' + (state.ieImportMode === 'url' ? ' on' : ''),
        onclick: () => { state.ieImportMode = 'url'; render(); },
      }, 'From a URL'),
      h('button', {
        class: 'ie-pill' + (state.ieImportMode === 'json' ? ' on' : ''),
        onclick: () => { state.ieImportMode = 'json'; render(); },
      }, 'Paste JSON')),
    state.ieImportMode === 'url'
      ? h('div', { class: 'ie-field' },
          h('label', {}, 'Model URL'),
          h('input', {
            type: 'text', placeholder: 'https://…/model.json',
            oninput: (e) => { urlValue = e.target.value; },
            onkeydown: (e) => { if (e.key === 'Enter') doImportLoad(); },
          }),
          h('div', { class: 'why' }, 'Fetches a model definition from any URL that returns the exported JSON.'))
      : h('div', { class: 'ie-field' },
          h('label', {}, 'Model JSON'),
          h('textarea', {
            rows: '6', placeholder: 'Paste an exported model here…',
            oninput: (e) => { jsonValue = e.target.value; },
          }),
          h('div', { class: 'why' }, 'Paste the contents of a file exported from here — or from '
            + 'someone else’s playground.')),
    h('div', { class: 'ie-actions' },
      h('button', { class: 'btn primary', onclick: doImportLoad }, 'Load')));

  async function copyToClipboard(text, flagKey) {
    try {
      await navigator.clipboard.writeText(text);
      state[flagKey] = true; render();
      setTimeout(() => { state[flagKey] = false; render(); }, 1500);
    } catch {
      toast('Could not copy — select the text and copy it manually.', true);
    }
  }

  const setInclude = (key) => (e) => {
    state[key] = e.target.checked;
    state.ieLink = null;
    render();
    if (state.ieExportMode === 'link') refreshExportLink();
  };

  const optionsRow = h('div', { class: 'ie-check-row' },
    h('span', { class: 'ie-check-label' }, 'Include:'),
    h('label', { class: 'ie-check' },
      h('input', { type: 'checkbox', checked: state.ieIncludeScenarios, onchange: setInclude('ieIncludeScenarios') }),
      'Scenarios'),
    h('label', { class: 'ie-check' },
      h('input', { type: 'checkbox', checked: state.ieIncludeSandbox, onchange: setInclude('ieIncludeSandbox') }),
      'Sandbox steps'));

  const jsonExportText = model ? JSON.stringify(exportEnvelope(model, {
    includeScenarios: state.ieIncludeScenarios, includeSandbox: state.ieIncludeSandbox,
  }), null, 2) : '';

  const exportPanel = h('div', {},
    optionsRow,
    h('div', { class: 'ie-subtoggle' },
      h('button', {
        class: 'ie-pill' + (state.ieExportMode === 'json' ? ' on' : ''),
        onclick: () => { state.ieExportMode = 'json'; render(); },
      }, 'As JSON'),
      h('button', {
        class: 'ie-pill' + (state.ieExportMode === 'link' ? ' on' : ''),
        onclick: () => {
          state.ieExportMode = 'link'; render();
          if (!state.ieLink) refreshExportLink();
        },
      }, 'As a link')),
    state.ieExportMode === 'json'
      ? h('div', {},
          h('div', { class: 'ie-field' },
            h('label', {}, 'Exported model'),
            h('textarea', { class: 'mono', rows: '6', readonly: true, value: jsonExportText }),
            h('div', { class: 'why' }, 'A complete copy of this model — commands, events, entities, '
              + 'projections and types.')),
          h('div', { class: 'ie-actions' },
            h('button', {
              class: 'btn primary', onclick: () => copyToClipboard(jsonExportText, 'ieCopiedJson'),
            }, state.ieCopiedJson ? 'Copied ✓' : 'Copy JSON')))
      : h('div', {},
          h('div', { class: 'ie-field' },
            h('label', {}, 'Shareable link'),
            h('input', { class: 'mono', type: 'text', readonly: true, value: state.ieLink || 'Computing…' }),
            h('div', { class: 'why' }, 'Anyone who opens this link gets exactly this model — nothing '
              + 'is uploaded to load it.')),
          h('div', { class: 'ie-actions' },
            h('button', {
              class: 'btn primary', disabled: !state.ieLink,
              onclick: () => copyToClipboard(state.ieLink, 'ieCopiedLink'),
            }, state.ieCopiedLink ? 'Copied ✓' : 'Copy link'))));

  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Import & Export'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'muted small' }, 'Bring in a model from somewhere else, or send this one out.'),
    h('div', { class: 'ie-tabs' },
      h('button', {
        class: 'ie-tab' + (state.ieTab === 'import' ? ' on' : ''),
        onclick: () => { state.ieTab = 'import'; render(); },
      }, 'Import'),
      h('button', {
        class: 'ie-tab' + (state.ieTab === 'export' ? ' on' : ''),
        onclick: () => { state.ieTab = 'export'; render(); },
      }, 'Export')),
    state.ieTab === 'import' ? importPanel : exportPanel,
    h('div', { class: 'adder', style: 'margin-top:18px' },
      h('button', { class: 'btn', onclick: close }, 'Done')));

  setTimeout(() => modal.focus(), 0);
  return overlayAround(modal, close);
}

// ============================================================
// Interface conveniences: undo, the loose-ends count, quick open, and
// row-to-row arrow keys. Each of these used to be optional; all four
// are just how the page behaves now.
// ============================================================

// ---------- undo ----------
//
// The model is an append-only log and the state is a fold over it, so
// the last change is undone by dropping what it appended off the end —
// not by a second history kept beside the first. The entries that come
// off are held so redo can put them back exactly as they were, sequence
// numbers included, which is only sound because they came off the end.

// Versioned in lockstep with the event log: the stack holds raw
// events and absolute offsets into that log, so marks taken against
// one log version must never replay against another. Deriving the
// suffix keeps the two keys impossible to bump apart.
const UNDO_KEY = 'dcb-playground:undo:' + EVENT_LOG_KEY.split(':').pop();

function undoLog() {
  try {
    const stored = JSON.parse(localStorage.getItem(UNDO_KEY));
    if (stored && Array.isArray(stored.done) && Array.isArray(stored.undone)) return stored;
  } catch (e) { /* a corrupt stack is an empty one */ }
  return { done: [], undone: [] };
}
function saveUndoLog(next) { localStorage.setItem(UNDO_KEY, JSON.stringify(next)); }

// What a change was, read off what it appended. `event-definition-updated`
// carrying `CourseDefined` becomes "updated event: Course defined".
function changeLabel(appended) {
  const last = appended[appended.length - 1];
  const parts = last.type.split('-');
  const verb = parts.pop();
  const subject = parts.join(' ').replace(/^dcb /, '').replace(/ definition$/, '');
  const name = last.data && last.data.name;
  return verb + ' ' + subject + (name ? ': ' + readable(name) : '')
    + (appended.length > 1 ? ` (+${appended.length - 1} more)` : '');
}

// Marks are taken at the append seam itself (`onAppend`, model.js):
// every edit path funnels through `appendEvents` — command functions
// behind buttons and agent tools alike — so nothing can change the
// log without becoming undoable. `run` only *batches*: however many
// appends one gesture makes, the gesture is one undo step, and a
// nested `run` belongs to the gesture that opened it.
let undoBatch = null;

function takeUndoMark(at, appended) {
  const log = undoLog();
  log.done.push({ at, label: changeLabel(appended) });
  // Redoing after a new change would mean re-appending entries that no
  // longer sit at the end of the log, so the branch is dropped — on an
  // agent's append exactly as on a button's.
  log.undone = [];
  if (log.done.length > 60) log.done.shift();
  saveUndoLog(log);
}

onAppend((at, appended) => {
  if (undoBatch) {
    if (undoBatch.at === null) undoBatch.at = at;
    undoBatch.events.push(...appended);
    return;
  }
  // An append outside any gesture — an agent's tool call — is its own
  // undo step; the tool repaints for itself afterwards.
  takeUndoMark(at, appended);
});

const runOnce = run;
run = function (fn) {
  if (undoBatch) return runOnce(fn);
  undoBatch = { at: null, events: [] };
  try {
    const out = runOnce(fn);
    if (undoBatch.events.length) {
      takeUndoMark(undoBatch.at, undoBatch.events);
      render();
    }
    return out;
  } finally {
    undoBatch = null;
  }
};

function undo() {
  const log = undoLog();
  const mark = log.done.pop();
  if (!mark) return toast('Nothing to undo.');
  const events = loadEvents();
  localStorage.setItem(EVENT_LOG_KEY, JSON.stringify(events.slice(0, mark.at)));
  bumpLogRevision();
  log.undone.push({ events: events.slice(mark.at), label: mark.label });
  saveUndoLog(log);
  closeForms();
  toast('Undone — ' + mark.label);
  render();
}

function redo() {
  const log = undoLog();
  const step = log.undone.pop();
  if (!step) return toast('Nothing to redo.');
  const events = loadEvents();
  localStorage.setItem(EVENT_LOG_KEY, JSON.stringify([...events, ...step.events]));
  bumpLogRevision();
  log.done.push({ at: events.length, label: step.label });
  saveUndoLog(log);
  closeForms();
  toast('Redone — ' + step.label);
  render();
}

// ---------- loose ends ----------
//
// Nothing here is an error: a model under construction is supposed to
// have ends that are not tied yet. What it is for is that they are
// findable — an event no command records is invisible from a page built
// around commands, and it is the interface's job to say so.

function looseEnds(model) {
  const found = [];
  const loose = orphans(model);
  for (const name of loose.events) {
    found.push({
      what: readable(name), why: 'no command records this event',
      go: () => goToEvent(name),
    });
  }
  for (const name of loose.entities) {
    found.push({
      what: readable(name), why: 'no command reads this',
      go: () => { state.view = 'entity'; state.entity = name; },
    });
  }
  for (const slice of allSlices(model)) {
    const open = (why) => found.push({
      what: readable(slice.name), why,
      go: () => { state.view = 'slice'; state.slice = slice.name; },
    });
    if (!slice.emits.length) open('records nothing — nothing it decides is kept');
    if (!slice.payload.length) open('takes no input');
    // Coverage gaps are advisories now — `modelAdvisories` reports
    // them with the property and the remedy, so a second, vaguer
    // entry here would say the same thing worse.
  }
  for (const [entity, body] of Object.entries(model['entity-definitions'])) {
    for (const property of body.properties || []) {
      const usage = propertyUsage(model, entity, property.name);
      if (usage.changedBy.length || usage.readBy.length) continue;
      found.push({
        what: readable(entity) + ' · ' + propertyWords(property.name),
        why: 'nothing changes it and nothing reads it',
        go: () => { state.view = 'entity'; state.entity = entity; },
      });
    }
  }
  return found;
}

// Loose ends and scenarios the model no longer agrees with, gathered
// into one list — everything wrong with this model that nobody had to
// go looking for, each one a way back to it.
//
// Memoized per log revision: the button in the bar and the open panel
// both ask during one paint, and each ask runs every scenario in the
// model. The model identity check rides on `projectState` returning
// one shared object per revision.
let problemsCache = null;

function problems(model) {
  if (problemsCache && problemsCache.revision === logRevisionNow() && problemsCache.model === model) {
    return problemsCache.found;
  }
  const found = looseEnds(model).map((end) => ({ what: end.what, why: end.why, go: end.go }));
  // The demoted validations: what a save used to refuse loads now and
  // is reported here instead, each one a way back to the definition
  // that carries it.
  const ADVISORY_GO = {
    'entity-definition': (name) => { state.view = 'entity'; state.entity = name; },
    'event-definition': (name) => goToEvent(name),
    'projection-definition': (name) => goToProjection(name),
    'command-definition': (name) => goToCommand(name),
    'custom-type-definition': (name) => goToCustomType(name),
  };
  for (const advisory of modelAdvisories(model)) {
    found.push({
      what: readable(advisory.name),
      why: advisory.message,
      go: () => (ADVISORY_GO[advisory.kind] || (() => {}))(advisory.name),
    });
  }
  for (const { key, body, result } of scenarioTrouble(model)) {
    found.push({
      what: scenarioName(body, readable),
      why: STATUS_WORDS[result.status][2],
      go: () => {
        state.view = 'slice'; state.slice = body.command;
        state.tab = 'scenarios'; state.openScenarios.add(key);
      },
    });
  }
  problemsCache = { revision: logRevisionNow(), model, found };
  return found;
}

// The marker shown where a flagged definition lives — the same
// records the Problems panel folds in, filtered to one definition (or
// to one kind, for the pages that list a whole kind). Null when there
// is nothing to say, so a clean card stays a clean card.
function advisoryBanner(model, kind, name) {
  const found = modelAdvisories(model)
    .filter((a) => a.kind === kind && (name === undefined || a.name === name));
  if (!found.length) return null;
  return h('div', { class: 'advisory' },
    found.map((a) => h('div', {},
      h('span', { class: 'diag-mark' }, '⚠'),
      name === undefined ? h('span', { class: 'what' }, readable(a.name)) : null,
      a.message)));
}

// Shown only when there is something to show — a clean model gets no
// badge to reassure it is clean, the way "Loose ends ✓" used to.
function problemsButton(model) {
  const found = problems(model);
  if (!found.length) return null;
  return h('button', {
    class: 'btn ghost', title: 'Problems in this model',
    onclick: () => { closeForms(); state.problems = true; render(); },
  }, 'Problems', h('span', { class: 'badge' }, found.length));
}

function problemsPanel() {
  const model = activeModel();
  const found = problems(model);
  const close = () => { state.problems = false; render(); };
  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Problems'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close' }, '×')),
    h('div', { class: 'muted small', style: 'margin-bottom:14px' },
      'Loose ends this model has not tied yet, definitions that do not hold together yet, '
      + 'and scenarios it no longer agrees with. Nothing here blocked a save — '
      + 'these are ways back to what still needs attention.'),
    found.map((p) => h('button', {
      class: 'issue',
      onclick: () => { close(); p.go(); render(); },
    }, h('span', { class: 'diag-mark' }, '⚠'),
      h('span', {}, p.what), h('span', { class: 'why' }, p.why))),
    h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', { class: 'btn primary', onclick: close }, 'Done')));
  const overlay = overlayAround(modal, close);
  setTimeout(() => modal.focus(), 0);
  return overlay;
}

// ---------- quick open ----------
//
// The rail lists commands. This lists everything: the features they sit
// in, the things themselves, the events, the projections, the value
// types — each with the one thing it does when chosen.
//
// It builds its own DOM once and updates only the result list as you
// type, because a repaint of the whole page under a text field is a
// repaint that takes the caret with it.

function paletteEntries(model) {
  const entries = [];
  const add = (what, label, where, go) => entries.push({ what, label, where, go, key: label + ' ' + where });

  for (const group of featureGroups(model)) {
    for (const name of group.commands) {
      add('command', iconPrefix(commandIcon(model, name)) + readable(name), group.name, () => {
        state.view = 'slice'; state.slice = name;
      });
    }
    if (group.name !== UNGROUPED) {
      add('feature', group.name, group.commands.length + ' commands', () => {
        state.collapsed[group.name] = false;
        if (group.commands.length) { state.view = 'slice'; state.slice = group.commands[0]; }
      });
    }
  }
  for (const name of Object.keys(model['entity-definitions'])) {
    add('entity', iconPrefix(entityIcon(model, name)) + readable(name), 'the things themselves', () => {
      state.entitiesCollapsed = false; state.view = 'entity'; state.entity = name;
    });
  }
  const records = {};
  for (const slice of allSlices(model)) {
    for (const emit of slice.emits) records[emit.emission.name] = slice.name;
  }
  for (const name of Object.keys(model['event-definitions'])) {
    const from = records[name];
    add('event', iconPrefix(eventIcon(model, name)) + readable(name),
      from ? 'recorded by ' + readable(from) : 'recorded by nothing', () => goToEvent(name));
  }
  for (const name of Object.keys(model['projection-definitions'])) {
    const owner = boundAs(model, name)[0];
    add('projection', readable(name),
      owner ? 'on ' + readable(owner.entity) : 'projections',
      () => goToProjection(name));
  }
  if (advanced()) {
    for (const name of Object.keys(model['custom-type-definitions'])) {
      add('custom type', readable(name), 'custom types', () => goToCustomType(name));
    }
  }
  add('do', 'New command…', '', () => beginNewCommand(activeModel()));
  add('do', 'Models…', 'switch, load, or start a model', () => { state.models = true; });
  add('do', 'Settings', '', () => { state.settings = true; });
  add('do', advanced() ? 'Switch to Simple' : 'Switch to Advanced', '',
    () => setMode(advanced() ? 'simple' : 'advanced'));
  return entries;
}

// Letters in order, anywhere in the text. A run that starts the text
// beats one that starts a word, which beats one scattered through it —
// enough ranking that typing "sub" puts "Subscribe student" first.
function fuzzyScore(query, text) {
  if (!query) return 0;
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  const at = t.indexOf(q);
  if (at === 0) return 1000;
  if (at > 0) return 800 - at - (t[at - 1] === ' ' ? 0 : 100);
  let i = 0;
  let score = 400;
  for (const ch of t) {
    if (ch === q[i]) i += 1;
    if (i === q.length) return score;
    score -= 1;
  }
  return -1;
}

let paletteEl = null;

function closePalette() {
  state.palette = false;
  paletteEl = null;
  const host = document.getElementById('palette-host');
  if (host) host.innerHTML = '';
}

function openPalette() {
  closeForms();
  state.settings = false; state.problems = false; state.models = false; state.help = null;
  state.palette = true;
  render();
}

function renderPalette() {
  const host = document.getElementById('palette-host');
  if (!state.palette) { host.innerHTML = ''; paletteEl = null; return; }
  // Already up and holding the caret: nothing about a repaint of the
  // page behind it should reach in here.
  if (paletteEl) return;

  const entries = paletteEntries(activeModel());
  let hits = entries.slice(0, 12);
  let active = 0;

  const list = h('div', { class: 'hits' });

  // Which row reads as active — a class toggle on the rows `paint`
  // already built, never a rebuild. `onmouseenter` used to call `paint`
  // directly, which tears every row down and reappends fresh ones; a
  // real click or tap lands in the same beat as the hover that precedes
  // it, so the row it was about to land on was already gone by the time
  // it arrived, and the click never reached anything.
  const highlight = () => {
    [...list.children].forEach((el, i) => el.classList.toggle('on', i === active));
    const on = list.children[active];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  };

  const paint = () => {
    list.innerHTML = '';
    if (!hits.length) { list.appendChild(h('div', { class: 'none' }, 'Nothing by that name.')); return; }
    hits.forEach((hit, i) => list.appendChild(h('div', {
      class: 'hit',
      onmouseenter: () => { active = i; highlight(); },
      onclick: () => choose(hit),
    }, h('span', { class: 'what' }, hit.what), h('span', {}, hit.label),
      hit.where ? h('span', { class: 'where' }, hit.where) : null)));
    highlight();
  };

  const choose = (hit) => {
    if (!hit) return;
    closePalette();
    hit.go();
    render();
  };

  const input = h('input', {
    type: 'text', placeholder: 'Quick open…', 'aria-label': 'Quick open',
    oninput: (e) => {
      const q = e.target.value.trim();
      hits = entries
        .map((entry) => ({ entry, score: fuzzyScore(q, entry.key) }))
        .filter((x) => x.score >= 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 12)
        .map((x) => x.entry);
      active = 0;
      paint();
    },
    onkeydown: (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, hits.length - 1); highlight(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); highlight(); }
      else if (e.key === 'Enter') { e.preventDefault(); choose(hits[active]); }
      // Escape belongs to the palette while the palette is up, and the
      // handler at the bottom of this file must not also act on it.
      else if (e.key === 'Escape') { e.preventDefault(); closePalette(); render(); }
    },
  });

  paletteEl = h('div', { class: 'palette', role: 'dialog', 'aria-modal': 'true' },
    input, list,
    h('footer', {},
      h('span', {}, '↑↓ to move'), h('span', {}, '↵ to open'), h('span', {}, 'esc to close')));
  paint();
  host.appendChild(h('div', {
    class: 'overlay', style: 'padding-top:14vh',
    onclick: (e) => { if (e.target === e.currentTarget) { closePalette(); render(); } },
  }, paletteEl));
  setTimeout(() => input.focus(), 0);
}

// ---------- arrow keys between rows ----------
//
// Tab reaches every button on the way down a command. The arrows reach
// only the rows, which is how the page is read rather than edited.

function rovingRows() {
  return [...document.querySelectorAll('#main .qrow[tabindex], #rail .qrow[tabindex]')];
}

function moveRow(step) {
  const rows = rovingRows();
  if (!rows.length) return false;
  const at = rows.indexOf(document.activeElement);
  const next = at < 0
    ? rows[step > 0 ? 0 : rows.length - 1]
    : rows[Math.min(Math.max(at + step, 0), rows.length - 1)];
  if (!next) return false;
  next.focus();
  next.scrollIntoView({ block: 'nearest' });
  return true;
}

// ---------- bringing a row on screen ----------
//
// Following a reference to its source, and landing on a row after the
// interface moved you somewhere.

function landOn(selector) {
  const target = document.querySelector(selector);
  if (!target) return;
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  // Restarting an animation that may still be running: the class comes
  // off, the layout is read to make the removal take effect, and it
  // goes back on — all in this frame, so nothing depends on a callback
  // the browser is free to defer.
  target.classList.remove('landed');
  void target.offsetWidth;
  target.classList.add('landed');
}

// Whether a row's machinery is on screen outright — a row opens on
// click, and stays open until another one is clicked.
function revealed(key) {
  return state.sel === key;
}

// The part of a row that waits to be asked for.
function reveal(...children) { return h('span', { class: 'reveal' }, ...children); }

// ---------- where a value came from ----------
//
// A sentence in one step refers to something declared in another: the
// input the command was handed, the instance it read, the field its
// event carries. The reference and the row that produces it now carry
// the same key, so pointing at one lights the other — which is the only
// way to see, without reading the whole page, that the "course id" in
// this sentence is the "course id" listed further up.

function sourceKey(operand, eventName) {
  switch (operandSource(operand)) {
    case 'parameter': return 'param:' + operand.parameterName;
    case 'alias-property': return 'alias:' + operand.alias;
    case 'event-property':
      return eventName ? 'evprop:' + eventName + '.' + operand.eventProperty : null;
    default: return null;
  }
}

// A hovered key lights up for as long as the pointer is on it; a clicked
// one is pinned and survives the pointer leaving, and a repaint.
function paintLit(hovered) {
  const key = hovered || state.lit;
  for (const node of document.querySelectorAll('.lit')) node.classList.remove('lit');
  if (!key) return;
  for (const node of document.querySelectorAll(`[data-src~="${key}"]`)) node.classList.add('lit');
}

// An operand as a chip that points back at its source.
function opRef(operand, eventName, text) {
  const label = text === undefined ? operandWords(operand) : text;
  const key = sourceKey(operand, eventName);
  if (!key) return h('span', { class: 'op' }, label);
  return h('span', {
    class: 'op ref' + (state.lit === key ? ' pinned' : ''),
    tabindex: 0, title: 'Where this comes from',
    onmouseenter: () => paintLit(key),
    onmouseleave: () => paintLit(),
    onfocus: () => paintLit(key),
    onblur: () => paintLit(),
    onclick: (e) => {
      e.stopPropagation();
      state.lit = state.lit === key ? null : key;
      // Lighting up a source three steps further up the page is only
      // half an answer while it is off screen.
      if (state.lit) state.land = `[data-src~="${CSS.escape(key)}"]`;
      render();
    },
  }, label);
}

// A row that is quiet by default: `key` names it, `src` for anything
// that refers back to it. Arrow keys always move along the page's flow
// — see `navFlow` — and Backspace removes the row when `onRemove` is
// given.
function qrow(tag, { cls = '', key, src, onRemove }, ...children) {
  const open = revealed(key);
  const toggle = () => { state.sel = state.sel === key ? null : key; render(); };
  return h(tag, {
    class: (cls ? cls + ' ' : '') + 'qrow' + (open ? ' open' : ''),
    'data-src': src || null,
    // Named in the document as well as in the state, so the keyboard
    // can be put back on the row it was on after a repaint.
    'data-key': key || null,
    tabindex: 0,
    onclick: (e) => {
      // A click meant for a control inside the row is not a click on
      // the row.
      if (e.target.closest('button, select, input, label, a, .chip.entity, .chip.linkable, .op.ent')) return;
      toggle();
    },
    onkeydown: (e) => {
      if (e.target !== e.currentTarget) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { navFlow(e); return; }
      if ((e.key === 'Backspace' || e.key === 'Delete') && onRemove) {
        e.preventDefault();
        const at = flowStops().indexOf(e.currentTarget);
        onRemove();
        if (at >= 0) focusFlowStopNear(Math.max(0, at - 1));
      }
    },
  }, ...children);
}

// "Add another one", folded into a single button until it is wanted.
// `flow-adder` marks that button as a stop of its own — see `navFlow`
// — so the row above it and the step below it are both one arrow key
// away, exactly the way an unfolded row would be. The `quiet` class
// keeps the folded button invisible until its step or card is hovered
// or the keyboard lands on it — except where hover cannot happen; see
// the adder and touch-screens CSS.
function adderSlot(key, stepKey, label, build) {
  if (state.adder === key) return build();
  return h('div', { class: 'adder quiet' }, h('button', {
    class: 'btn ghost tiny flow-adder',
    onclick: () => { closeForms(); state.adder = key; render(); focusOpenedAdder(stepKey); },
    onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
  }, label), h('span', { class: 'slot' }));
}

// Opening one adder from its folded button can also fold another —
// `state.adder` holds one key for the whole page, so a reads form left
// open collapses the instant a rule form opens. That is two sections
// changing shape in the same repaint, which is more than the generic
// by-position focus restore in `render` can track: it lands wherever
// the old button's position now falls in the new page, not on the form
// that actually replaced it. Landing explicitly on the new form's own
// first control — it is always the step's last child — is what keeps
// Enter-to-submit-then-Tab reaching the *next* step reliable.
function focusOpenedAdder(stepKey) {
  if (!stepKey) return;
  const section = document.querySelector('.step.' + stepKey);
  const last = section && section.lastElementChild;
  const el = last && last.querySelector('select, input, textarea, button');
  if (el) el.focus();
}

// ---------- dragging by a grip ----------
//
// One mechanism for every ⠿ grip in the app: pointer events, never the
// HTML5 drag-and-drop API, because that API does not fire on touch
// screens and this one works the same for mouse, pen and finger. The
// grip captures the pointer, whatever is under it as it moves is found
// with `elementFromPoint` (capture does not change what is under the
// pointer), and everything until the drop is direct DOM — nothing may
// repaint mid-drag. Only the drop itself may run a command.
function gripDrag({ title, onStart, onMove, onDrop, onEnd }) {
  let dragging = false;
  const finish = (e, dropped) => {
    if (!dragging) return;
    dragging = false;
    if (onEnd) onEnd(e);
    if (dropped) onDrop(document.elementFromPoint(e.clientX, e.clientY), e);
  };
  return h('span', {
    class: 'grip', title,
    onpointerdown: (e) => {
      if (e.button) return;
      e.preventDefault();
      e.currentTarget.setPointerCapture(e.pointerId);
      dragging = true;
      if (onStart) onStart(e);
    },
    onpointermove: (e) => {
      if (dragging) onMove(document.elementFromPoint(e.clientX, e.clientY), e);
    },
    onpointerup: (e) => finish(e, true),
    onpointercancel: (e) => finish(e, false),
    // The grip often sits inside something clickable (a rail row is a
    // link); a tap that turned out not to be a drag must not follow it.
    onclick: (e) => { e.preventDefault(); e.stopPropagation(); },
  }, '⠿');
}

// The reorder drag both scenario lists share. Cards carry their key
// and kind as data attributes; the paint marks the edge the dragged
// one would land against, the drop reorders against that edge.
function scenarioGrip(model, kind, key, title) {
  let over = null;
  const clear = () => { if (over) over.classList.remove('drop-before', 'drop-after'); over = null; };
  const cardUnder = (under) => {
    const card = under && under.closest(`[data-scen][data-scen-kind="${kind}"]`);
    return card && card.getAttribute('data-scen') !== key ? card : null;
  };
  const landsBefore = (card, e) => {
    const rect = card.getBoundingClientRect();
    return (e.clientY - rect.top) < rect.height / 2;
  };
  return gripDrag({
    title,
    onMove: (under, e) => {
      const card = cardUnder(under);
      if (card !== over) { clear(); over = card; }
      if (!card) return;
      const before = landsBefore(card, e);
      card.classList.toggle('drop-before', before);
      card.classList.toggle('drop-after', !before);
    },
    onEnd: clear,
    onDrop: (under, e) => {
      const card = cardUnder(under);
      if (!card) return;
      run(() => reorderByDrag(kind, model, key, card.getAttribute('data-scen'), landsBefore(card, e)));
    },
  });
}

// Moves `list[from]` to land against `list[to]`'s edge, in place, and
// returns the index it landed at. Positions, not keys: rules have no
// name of their own, only their place in `conditions`.
function moveAgainst(list, from, to, before) {
  const [item] = list.splice(from, 1);
  const at = (to > from ? to - 1 : to) + (before ? 0 : 1);
  list.splice(at, 0, item);
  return at;
}

// The reorder drag among the rules inside one read's card. Order is
// meaning here, not tidiness: rules are checked top to bottom and the
// first that fails is the one a refusal names. A rule only lands among
// rules about the same alias — dropping it into another card would be
// a different rule, not a different place. Everything keyed by a
// rule's index (the open row, the one being edited) follows it.
function ruleGrip(slice, i, alias) {
  let over = null;
  const clear = () => { if (over) over.classList.remove('drop-before', 'drop-after'); over = null; };
  const rowUnder = (under) => {
    const row = under && under.closest(`[data-rule][data-rule-alias="${CSS.escape(alias)}"]`);
    return row && Number(row.getAttribute('data-rule')) !== i ? row : null;
  };
  const landsBefore = (row, e) => {
    const rect = row.getBoundingClientRect();
    return (e.clientY - rect.top) < rect.height / 2;
  };
  return gripDrag({
    title: 'Drag to reorder — rules are checked top to bottom',
    onStart: (e) => e.currentTarget.closest('.rule-row').classList.add('dragging'),
    onMove: (under, e) => {
      const row = rowUnder(under);
      if (row !== over) { clear(); over = row; }
      if (!row) return;
      const before = landsBefore(row, e);
      row.classList.toggle('drop-before', before);
      row.classList.toggle('drop-after', !before);
    },
    onEnd: (e) => { clear(); e.currentTarget.closest('.rule-row').classList.remove('dragging'); },
    onDrop: (under, e) => {
      const row = rowUnder(under);
      if (!row) return;
      const to = Number(row.getAttribute('data-rule'));
      const before = landsBefore(row, e);
      const positions = [...Array(slice.rules.length).keys()];
      moveAgainst(positions, i, to, before);
      const follow = (k) => positions.indexOf(k);
      const selected = /^rule:(\d+)$/.exec(state.sel || '');
      if (selected) state.sel = 'rule:' + follow(Number(selected[1]));
      if (state.editRule !== null) state.editRule = follow(state.editRule);
      patchSlice((b) => { moveAgainst(b.conditions, i, to, before); });
    },
  });
}

// ---------- removing things ----------
//
// Two gestures, and the difference is what is being removed.
//
// A *part* of something — a field, a rule, an instance the command
// reads, a change an event makes — goes on one click. It is a line in a
// list you are editing, the model still holds everything it was made
// of, and asking twice would make ordinary editing feel dangerous.
//
// A *definition* — a command, an event, an entity, a value type, a
// numbering, a whole model — asks once, and the button becomes its own
// confirmation rather than opening a dialog over the thing in question.
// The model refuses either way while anything still references it, so
// the question is only ever about work you meant to keep.
function removeButton(key, { label = '×', title, confirm = 'Really remove?', onRemove }) {
  if (state.confirmRemove === key) {
    return h('button', {
      class: 'btn tiny danger',
      onclick: () => { state.confirmRemove = null; onRemove(); },
    }, confirm);
  }
  // Not closeForms(): in the click-to-reveal variant that would close
  // the very row the confirmation lives in.
  return h('button', {
    class: 'btn tiny danger', title,
    onclick: () => { state.confirmRemove = key; render(); },
  }, label);
}

// An edit someone finished making is an edit, whether or not its
// button was pressed. `commitPendingField` is the whole of that rule:
// whatever row is half-way through being filled in — a field being
// named, a rule being picked, a change being described, a read being
// chosen — is committed the moment attention moves elsewhere. It rides
// `closeForms` — every gesture that leaves a row already calls it —
// rather than a blur handler, because a blur-time repaint tears the
// clicked control out from under the click that caused it, which is
// how gestures get eaten.
//
// Each kind of draft carries its own answer to "is this an edit yet?"
// as `ready()`: a field is one once it has a name; a picker row is one
// once it was *touched* and is complete — a row of untouched defaults
// is a proposal, and leaving a proposal alone is declining it, not
// accepting it. A draft that is not ready is abandoned silently,

    if (typeof draft.ready !== 'function' || !draft.ready()) continue;
    state[key] = null;
    draft.commit();

  // typing pause has not yet flushed goes now, before any wipe closes
  // the row over it.
  autoSaveProjectionDraft();
}

// Escape's half of the bargain: every other way out commits, so the
// one that means "never mind" has to drop the pending edits *before*
// `closeForms` gets a chance to commit them.
function discardPendingEdits() {
  for (const key of PENDING_EDIT_KEYS) state[key] = null;
}

// The name / type / many / add row that four different lists all want.
// Enter anywhere in the row adds the field — the type select and the
// two checkboxes included, which is why the row itself listens rather
// than just the name field — the same as clicking the button. But the
// button is a convenience, not the gate: a named field is committed as
// soon as the row is left, however it is left — Enter, Tab out, a
// click elsewhere, or whatever gesture opens the next form (see
// `commitPendingField`). Backspace in an empty name field is the
// reverse: it pops the row just added, which is also how a commit that
// happened on the way out is taken back. Escape discards the
// half-typed name instead of committing it. An empty name field is
// where a list ends: Enter there with nothing typed means "done with

  onAdd, onRemoveLast, onEmptyEnter, draftKey = 'field',
  types = typeOptions, offerOptional = true,

  const draft = state.fieldDraft && state.fieldDraft.key === draftKey
    ? state.fieldDraft
    : (state.fieldDraft = {
        key: draftKey, name: '', propertyType: type, isList: false, isOptional: false,
      });

  // current `onAdd`, not the one from a paint that no longer exists.

  draft.commit = () => {
    onAdd({
      name: toCamel(draft.name), propertyType: draft.propertyType,
      isOptional: draft.isOptional, isList: draft.isList,
    });
  };
  const add = () => {
    if (!draft.name.trim()) return toast('Give the field a name.', true);
    state.fieldDraft = null;
    draft.commit();
  };
  const input = h('input', {
    type: 'text', placeholder, class: 'flow-entry', value: draft.name,
    oninput: (e) => { draft.name = e.target.value; },
    onkeydown: (e) => {
      if (e.key === 'Backspace' && !draft.name && onRemoveLast) { e.preventDefault(); onRemoveLast(); return; }
      if (e.key === 'Escape') {
        // First Escape is about the field: drop what was typed so that
        // leaving cannot commit it, and step out. A second Escape then
        // backs out of the row, same as any other field.
        e.preventDefault();
        state.fieldDraft = null;
        e.target.value = '';
        e.target.blur();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e);
    },
  });

  // first open the button this row replaced is gone, so focus has
  // fallen to the body. After a commit that happened because focus
  // went somewhere *else*, stealing it back is exactly the "focus is a
  // change of context" trap (WCAG 3.2.2), so the fresh row stays quiet.

    const active = document.activeElement;

    class: 'adder',
    onkeydown: (e) => {

      // included — discards the pending name, so backing out through
      // any of the row's controls never commits on the way.
      if (e.key === 'Escape') { state.fieldDraft = null; return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!draft.name.trim() && onEmptyEnter) { onEmptyEnter(); return; }
      add();
    },
  },
    input,
    pick(types(model), draft.propertyType, (v) => { draft.propertyType = v; }),
    h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.isList,
        onchange: (e) => { draft.isList = e.target.checked; },
      }), ' many'),
    offerOptional ? h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.isOptional,
        onchange: (e) => { draft.isOptional = e.target.checked; },
      }), ' optional') : null,
    h('button', { class: 'btn', onclick: add }, label));
  // Tab reaches outside the row without any click for `closeForms` to
  // ride on, so leaving by keyboard is watched directly. The delay lets
  // a click that caused this blur finish against the DOM it started on;
  // if that click ran `closeForms`, the commit has already happened and
  // the draft is gone.
  root.onfocusout = () => setTimeout(() => {
    if (state.fieldDraft !== draft) return;
    if (root.isConnected && root.contains(document.activeElement)) return;
    commitPendingField();
  }, 100);
  return root;
}

// ---------- moving through a command's steps ----------
//
// One list, top to bottom, spanning every step on the page: the rows
// already declared — a property, a read, a rule, whatever a step
// holds — and each step's own "add another", its folded button while
// closed, its own entry field once open (see `adderSlot` and
// `propertyAdder`). Arrow keys walk it in either direction, crossing
// from one step into the next exactly where the page already draws
// the line between them — nothing here knows "trigger" from "rules",
// it only ever asks the document what comes next.

  const main = document.getElementById('main');
  if (!main) return [];
  return [...main.querySelectorAll('.qrow[tabindex], .flow-adder, .flow-entry')];
}
function navFlow(e) {
  const stops = flowStops();
  const at = stops.indexOf(document.activeElement);
  if (at < 0) return;
  const next = stops[at + (e.key === 'ArrowDown' ? 1 : -1)];
  if (next) { e.preventDefault(); next.focus(); next.scrollIntoView({ block: 'nearest' }); }

// its place, or the last stop if it was the very end of the list.
function focusFlowStopNear(index) {
  // The removal repaints the page, and if an adder stays open that
  // repaint mounts a fresh field which focuses itself the same way —
  // scheduled at the same 0ms delay, registered a moment later. A 0ms
  // timer of ours would lose that race every time; one tick later, its
  // self-focus has already happened and this is free to overrule it.
  setTimeout(() => {
    const stops = flowStops();
    if (!stops.length) return;
    const target = stops[Math.min(index, stops.length - 1)];
    if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
  }, 1);
}

// ---------- editing a member ----------
//
// A property, a field, a payload entry, a projection parameter — all
// the same shape, all editable the same way: rename it, retype it, say
// whether there are many and whether it may be absent.
//
// Renaming goes through `renameMember`, which rewrites every reference
// in the same append; the rest is an ordinary body update. They are
// separate calls because they are separate kinds of change — a rename
// touches other definitions, a retype does not.
//
// Which member is open is held in one place, so opening a second one
// closes the first.

  return state.editMember && state.editMember.where === where && state.editMember.name === name;
}

  closeForms();
  state.editMember = { where, name };
  render();

// projection parameter — is a name and a type and nothing else, so
// retyping one is the change itself. A projection's type is a bigger
// change, since what it starts from and how it is advanced both hang
// off it; that lives in `retypeProjection`, on the draft the editor
// holds.

  return { ...member, ...changes };
}

// member back; `onRename` is given only the new name, because a rename
// is the model's job rather than a body edit.

// `allow` says which knobs this site has: a projection parameter is
// always a single required identifier, so it has no arity to set.

  const close = () => { state.editMember = null; render(); };
  let name = member.name;
  const options = types || typeOptions(model);
  const doRename = () => {
    const next = toCamel(name);
    if (!next) return toast('Give it a name.', true);
    if (next === member.name) return close();
    state.editMember = { where, name: next };
    run(() => onRename(next));
  };

  return h('div', { class: 'member-editor' },
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: member.name, style: 'width:190px',
        oninput: (e) => { name = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } },
      }),
      h('button', {
        class: 'btn tiny', title: 'Rename, rewriting every reference to it',
        onclick: doRename,

      h('span', { class: 'muted tiny' }, 'is a'),
      pick(options, member.propertyType, (v) => onReplace(retypeMember(member, { propertyType: v }))),
      allow.arity === false ? null : h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: !!member.isList,
          onchange: (e) => onReplace(retypeMember(member, { isList: e.target.checked })),
        }), ' many'),
      allow.arity === false ? null : h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: !!member.isOptional,
          onchange: (e) => onReplace(retypeMember(member, { isOptional: e.target.checked })),
        }), ' optional'),
      h('button', { class: 'btn ghost tiny', onclick: close }, 'Done')));

// Reads a typed literal out of what someone typed. `undefined` means

  const trimmed = (text || '').trim();
  const schema = underlyingSchema(model, typeName);
  const kind = schema && schema.type;

    const n = Number(trimmed);
    return trimmed === '' || Number.isNaN(n) ? undefined : n;
  }
  if (kind === 'boolean') {
    if (/^(true|yes)$/i.test(trimmed)) return true;
    if (/^(false|no)$/i.test(trimmed)) return false;
    return undefined;
  }
  return trimmed;
