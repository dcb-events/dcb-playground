        p.right ? h('span', {}, ' ', opRef(condition.rightHandSide, null, p.right)) : null,
        optionalAliases.length
          ? h('span', { class: 'muted tiny' },
              ' — skipped when ' + optionalAliases.map(propertyWords).join(' or ') + ' is absent')
          : null),
      h('span', { class: 'grow' }),
      reveal(
        h('button', {
          class: 'btn tiny',
          onclick: () => {
            closeForms();
            state.editRule = i;
            state.ruleDraft = draftFromCondition(condition);
            render();
          },
        }, 'Edit'),
        // Removing the last rule about a read removes the read: the
        // write path prunes what nothing consults, so this one button
        // is also how a read goes away. There is no button for that on
        // the read itself, because a read is not a thing anyone
        // declared.
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchSlice((b) => { b.conditions.splice(i, 1); }),
        }, '×'))));
}

// ---------- the merged step ----------
//
// "To decide, it looks at" and "It is only allowed if" were two steps
// and are one. The reason is not screen space: a read was never a
// thing anyone wanted to declare. It is what some rule, guard,
// emission or chain *needs*, and asking for it separately made the
// modeller answer a question about storage before they had finished
// the question about the domain.
//
// So a read is not authored here. Each card is a read something
// demanded, and the rules about it live inside it — which is also why
// the card has no delete button: `pruneUnreferencedBindings` takes it
// away when the last thing consulting it goes, and there is nothing
// for a user to remove that they ever added.
//
// The queries spine survives the merge, and is the reason the cards did
// not collapse into the rules. "We must read the courses before we
// know which students to look at" is a fact about the domain, and an
// intermediate read that carries no rule at all — bound only so the
// next one can be reached — still costs a query to the log and is still
// shown, empty.
function stepDecision(model, slice) {
  // Only the reads the decision walks. What an emission causes — a
  // value the event records, a tag it writes — is shown beside that
  // emission instead, because that is where its reason is.
  const decision = decisionAliases(model, slice.body);
  const mine = (binding) => binding && decision.has(binding.alias);
  const rounds = (slice.rounds || [])
    .map((round) => round.filter((entry) => mine(entry.binding)))
    .filter((round) => round.length);
  const indexOfBinding = new Map(slice.reads.map((b, i) => [b, i]));
  const reads = slice.reads.filter(mine);

  // A rule belongs to the read its left side is about — the left side
  // is always something read, which is what the rule editor already
  // enforced by filtering its own picker. A rule arriving from a
  // hand-written file may name none, and is shown after the cards
  // rather than dropped.
  const rulesByAlias = new Map();
  const loose = [];
  slice.rules.forEach((condition, i) => {
    const left = condition && condition.leftHandSide;
    const alias = operandSource(left) === 'alias-property' ? left.alias : null;
    if (alias && slice.reads.some((b) => b && b.alias === alias)) {
      if (!rulesByAlias.has(alias)) rulesByAlias.set(alias, []);
      rulesByAlias.get(alias).push(i);
    } else loose.push(i);
  });

  const cardFor = (binding, waitsFor) => readCard(
    model, slice, binding, indexOfBinding.get(binding), waitsFor,
    rulesByAlias.get(binding.alias) || []);

  let cards;
  if (rounds.length > 1) {
    cards = rounds.flatMap((round, i) => [
      h('div', { class: 'round-head' },
        h('span', { class: 'rule' }),
        h('span', { class: 'label' }, roundLabel(i, rounds.length))),
      ...round.map((entry) => cardFor(entry.binding, entry.waitsFor)),
    ]);
  } else {
    cards = reads.map((binding) => cardFor(binding, []));
  }
  for (const i of loose) cards.push(h('div', { class: 'card rule' }, ruleRow(model, slice, slice.rules[i], i)));

  const body = [h('div', {}, cards)];

  // Creating an entity mid-rule resumes the rule, not a read adder:
  // the gesture that was interrupted continues exactly one choice
  // further along. A brand-new entity has no properties, so there is
  // nothing for the rule's left side to name yet — which is why the
  // property form opens straight after, on the entity just made.
  if (state.newEntityAt === 'rules') {
    body.push(inlineForm({
      question: 'New entity for this rule', placeholder: 'entity name',
      showsIdentifier: true,
      onSubmit: (v) => {
        state.newEntityAt = null;
        const created = createEntity(model, v);
        if (created) {
          // A brand-new entity derives a brand-new identifier type, so
          // nothing already in scope can identify one — it would be
          // unreachable the instant it existed, and the rule would have
          // nowhere to go. So the command gains the input that
          // identifies it, in the same gesture: the question "which
          // room?" has to be answerable before a rule about a room can
          // be written, and the answer is that the caller says which.
          // Renaming or retyping it afterwards is the trigger step's
          // ordinary business.
          const idType = idTypeOf(model, created);
          const name = defaultAlias(created) + 'Id';
          if (idType && !(slice.payload || []).some((p) => p.name === name)) {
            patch('command-definition', slice.name, (b) => {
              b.properties = b.properties || [];
              b.properties.push({ name, propertyType: idType, isOptional: false, isList: false });
            });
          }
          state.adder = 'rule';
          state.ruleDraft = state.ruleDraft || { predicate: 'equals', negate: false, left: '', right: '' };
          // Through `target`, not `newRead`: the target is what the row
          // derives its pending read from on every paint, so setting the
          // read directly would be undone by the render that follows.
          state.ruleDraft.target = 'entity:' + created;
          state.ruleDraft.left = '';
          state.ruleDraft.touched = true;
          // And with no properties yet, the rule's left side still has
          // nothing to name — so the entity's first property is the
          // next thing asked for.
          state.addingProp = { at: 'rule', only: created };
          render();
        }
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  }

  body.push(adderSlot('rule', 'rules', '+ rule', () =>
    h('div', { class: 'card' }, ruleEditor(model, slice, null))));

  // Said here and nowhere else. Two rules about one thing — it exists,
  // and something one-way has not happened to it — are the shape of a
  // lifecycle stated twice, and this is the moment the author can see
  // both at once. It is not a defect and does not belong in Problems:
  // the two-rule model is correct, evaluates correctly and derives the
  // same DCB. What it gives up is only that the states stay unnamed.
  const merge = lifecycleMergeSuggestion(model, slice.body);
  if (merge) body.push(mergePrompt(model, merge));

  // Nothing tested is nothing decided. `DefineCourse` really is always
  // allowed: the numbering it reads is read in order to *record* the
  // course's id, which is said beside the event that records it.
  if (!slice.rules.length) {
    body.unshift(h('div', { class: 'empty' }, 'Always allowed.'));
  }

  return step('decide', 'Rules', ...body);
}

// The promotion offer: the facts that make this a candidate, checkable
// against what the author just wrote, and the offer itself. The argument
// for *why* monotone booleans are stages is in the hint — it is the same
// argument every time, and the row that states it is different every
// time. Opens the entity's own merge form with a step per boolean
// already filled in — the one part of the merge that *can* be inferred,
// because the booleans themselves say what the stages are.
function mergePrompt(model, merge) {
  const named = merge.booleans.map(propertyWords);
  return h('div', { class: 'card rule lc-suggest' },
    h('div', { class: 'tiny muted why' },
      `${merge.booleans.length} monotone booleans on `,
      h('span', { class: 'op' }, propertyWords(merge.alias)),
      `: ${named.join(', ')}.`,
      hint('lc-merge', 'Monotone booleans', [
        'None of these ever goes back to false once it holds, so they are stages of one '
        + 'lifecycle rather than independent facts.',
        'Merging them into an enum states the stages once. Every condition over the '
        + 'absorbed properties is rewritten over the enum — a boolean that held from '
        + 'stage i onward becomes equalsAny over stages i..n, not equals stage i.',
        'Non-monotone booleans are refused: collapsing them would destroy a dimension.',
      ], null, 'lifecycle')),
    h('button', {
      class: 'btn tiny',
      onclick: () => {
        closeForms();
        state.promoting = merge.entity;
        state.promoteDraft = mergeDraftFor(model, merge.entity, merge.booleans);
        openEntity(merge.entity);
      },
    }, 'Give ' + readable(merge.entity) + ' a lifecycle instead'));
}

// The read a rule is about but which does not exist yet — the whole
// point of the merged step. A rule names an alias, and nothing else in
// the file records the path that alias stands for, so the binding has
// to be appended in the same gesture as the rule that wants it. The
// alias is computed the way `uniqueAlias` would compute it on commit,
// which makes it stable across repaints: `draft.left` embeds it, and a
// name that moved under the draft would invalidate the rule being
// written.
//
// Returns null while the choice is still incomplete — an entity whose
// identifier source has not been picked yet is not a read.
function pendingBinding(model, slice, draft) {
  const choice = draft && draft.newRead;
  if (!choice || !choice.entity) return null;
  const taken = (slice.reads || []).map((b) => b && b.alias).filter(Boolean);
  if (choice.entity.startsWith('projection:')) {
    const name = choice.entity.slice('projection:'.length);
    const projection = model['projection-definitions'][name];
    if (!projection) return null;
    const args = {};
    for (const parameter of projectionSlots(projection)) {
      const picked = (choice.args || {})[parameter.name];
      if (!picked) return null;
      args[parameter.name] = JSON.parse(picked);
    }
    return { alias: uniqueAlias(defaultAlias(name), taken), projection: name, arguments: args };
  }
  if (!choice.source) return null;
  return {
    alias: uniqueAlias(defaultAlias(choice.entity), taken),
    entity: choice.entity,
    id: JSON.parse(choice.source),
  };
}

// One condition, open for editing — the same form whether it already
// exists or is being written for the first time.
//
// Both sides are picked from what the command has read, plus a typed
// literal: "fewer than 10 subscribers" is a rule about a number nobody
// declared anywhere, so it has to be typeable. A unary predicate takes
// no right-hand side at all, so that half of the form goes away when
// one is chosen rather than being ignored.
//
// `target` says which condition list the row belongs to: the command's
// own rules by default, or one emission's guard (`when`) — a guard is
// a condition in every respect this form cares about, so it is the
// same form, writing somewhere else.
function ruleEditor(model, slice, index, target) {
  const targetList = target ? target.list : (b) => b.conditions;
  const addLabel = target && target.addLabel ? target.addLabel : 'Add rule';
  // A rule being edited always has a draft; a rule about to be created
  // grows one the first time it is painted, and keeps it across every
  // repaint a keystroke causes from then on.
  const draft = state.ruleDraft || (state.ruleDraft = { predicate: 'equals', negate: false, left: '', right: '' });

  // ---------- which read this rule is about ----------
  //
  // Progressive on purpose: the property picker's choices depend on the
  // read, and the identifier sources depend on the entity, so a row
  // that painted all of them at once would be offering answers to
  // questions not yet asked. A rule opened from a read's own card, or
  // a guard (which is written against reads that already exist), skips
  // this entirely — `onAlias` says the question is already answered.
  const editingExisting = index !== null;
  const scoped = draft.onAlias
    || (editingExisting || target
      ? null
      : undefined);
  const alreadyRead = new Set((slice.reads || []).filter(Boolean).map((b) => b.entity).filter(Boolean));
  // Only what this command could actually reach. An entity is offered
  // when something already in scope could identify one — a command
  // property, or a value off a read above it — because an entity whose
  // identifier nothing here can supply is not a read anyone could
  // finish picking, and offering it is offering a dead end.
  //
  // A projection is offered on the same terms, so a model can state its
  // rules without an entity at all: `read label = Label(documentId)`
  // and a rule about `label`. Except one an entity property binds —
  // that value is read through the entity (`course.capacity`), and
  // offering it here as well would be the same fact reachable as two
  // different reads. Reachable means every parameter it takes has a
  // source in scope; one with none is the whole log, untagged.
  const scopeAbove = operandChoicesAbove(model, slice);
  const reachable = (entityName) => choicesOfType(
    model, slice, scopeAbove, idTypeOf(model, entityName), { list: true }).length > 0;
  const newRows = Object.keys(model['entity-definitions']).sort()
    .filter(reachable)
    .map((n) => [
      // A second binding of the same entity is a real thing to want —
      // the subscribers' *other* courses — so it is offered, spelled as
      // "another" rather than as a duplicate of the row above.
      'entity:' + n,
      (alreadyRead.has(n) ? 'another ' : '') + readable(n) + '…',
      entityIcon(model, n),
    ]);
  const boundByEntity = entityBoundProjections(model);
  const alreadyReadProjection = new Set((slice.reads || []).filter(Boolean).map((b) => b.projection).filter(Boolean));
  const projectionRows = Object.keys(model['projection-definitions']).sort()
    .filter((n) => !boundByEntity.has(n))
    .filter((n) => projectionSlots(model['projection-definitions'][n]).every((slot) =>
      choicesOfType(model, slice, scopeAbove, slot.propertyType).length > 0))
    .map((n) => [
      'projection:' + n,
      'projection' + GROUP_SEP + (alreadyReadProjection.has(n) ? 'another ' : '') + readable(n) + '…',
    ]);
  // Only reads this command does not have yet. A read it already makes
  // is not offered here, because it already carries its own "+ rule
  // about …" button — that is where a second rule about the same
  // instance belongs, and offering it twice made the same rule
  // reachable two ways with nothing to tell them apart. "Another
  // Course…" is a different matter: it is a different instance.
  const targetRows = [...newRows, ...projectionRows, [NEW, '+ New entity…']];
  const chooseTarget = scoped === undefined;
  // Deliberately not defaulted. The row advances when the author
  // answers a question, so the first question has to be unanswered —
  // a pre-picked target would either advance on its own (putting
  // everything on screen again, which is what the staging is for) or
  // sit there waiting to be re-picked to mean the same thing.
  if (chooseTarget && draft.target && !targetRows.some(([v]) => v === draft.target)) {
    draft.target = '';
  }
  const chosenTarget = scoped ? 'alias:' + scoped : draft.target;
  // The draft's read choice is derived from the target every paint, so
  // switching target cannot leave a half-built read of the old one
  // behind.
  if (chooseTarget) {
    if (chosenTarget && !chosenTarget.startsWith('alias:') && chosenTarget !== NEW) {
      const entity = chosenTarget.startsWith('projection:')
        ? chosenTarget : chosenTarget.slice('entity:'.length);
      if (!draft.newRead || draft.newRead.entity !== entity) {
        draft.newRead = { entity, source: '', args: {} };
      }
    } else if (draft.newRead) {
      delete draft.newRead;
    }
  }

  // A read's own operands come from the scope *above* it — the payload
  // and the reads already bound — never from itself, which is the chain
  // rule the format states outright. So they are resolved here, against
  // the un-augmented scope, and before the pending binding is built out
  // of them: a binding assembled from operands that had not been
  // defaulted yet comes back null on the first paint and takes the
  // rule's left side down with it.
  const baseScope = operandChoicesAbove(model, slice);
  const choice = draft.newRead;
  const chosenProjection = choice && choice.entity.startsWith('projection:')
    ? model['projection-definitions'][choice.entity.slice('projection:'.length)]
    : null;
  const parameters = chosenProjection ? projectionSlots(chosenProjection) : [];
  const idSources = choice && !chosenProjection
    ? choicesOfType(model, slice, baseScope, idTypeOf(model, choice.entity), { list: true })
    : [];
  if (choice && !chosenProjection && !idSources.some(([v]) => v === choice.source)) {
    choice.source = idSources.length ? idSources[0][0] : '';
  }
  const parameterSources = new Map(parameters.map((parameter) =>
    [parameter.name, choicesOfType(model, slice, baseScope, parameter.propertyType)]));
  for (const parameter of parameters) {
    const picked = (choice.args || {})[parameter.name];
    const rows = parameterSources.get(parameter.name);
    if (!picked || !rows.some(([v]) => v === picked)) {
      choice.args = { ...(choice.args || {}) };
      choice.args[parameter.name] = rows.length ? rows[0][0] : '';
    }
  }

  // Everything below reads the boundary the *commit* will have, not the
  // one on file: the provisional binding's properties are what the left
  // side picks from, and its alias is what the stored rule will name.
  const pending = pendingBinding(model, slice, draft);
  const reads = pending ? [...(slice.reads || []), pending] : (slice.reads || []);
  const typeScope = { boundary: reads, commandProperties: slice.payload, model };
  const scope = operandChoicesAbove(model, { ...slice, reads });
  // A rule's left side says what it's about, and that's always
  // something read — a value the command was merely given belongs on
  // the right, compared against. Left keeps only what came off the
  // boundary, not the "given · …" entries `scope` also carries for the
  // right side's sake — and, once a read is chosen, only that read's:
  // the rule the modeller is writing is about the thing they just
  // named.
  const aboutAlias = pending ? pending.alias : (scoped || null);
  const leftScope = scope.filter(([v]) => {
    const operand = JSON.parse(v);
    if ('parameterName' in operand) return false;
    return aboutAlias ? operand.alias === aboutAlias : true;
  });
  if (draft.left && !leftScope.some(([v]) => v === draft.left)) draft.left = '';

  // ---------- existence, answered in one pick ----------
  //
  // A designated boolean lifecycle has two rules worth writing about
  // it — the thing exists, or it does not — and spelling either as
  // "exists", then "not", then "is true" was three answers for one
  // thought. So the value picker offers the two states in place of the
  // property, and picking one answers the third question too:
  // `isTrue` / `isFalse`, never `negate`, because those are what the
  // sentence reads back as "exists" / "does not exist".
  //
  // The bare property row stays only for a rule opened with another
  // spelling (`equals true`, a negated `isTrue`): opening it must show
  // what is stored, not quietly rewrite it.
  const existenceOf = (v) => existenceRead(model, { boundary: reads }, JSON.parse(v));
  const sugaredExistence = (v) => v === draft.left && !draft.negate
    && (draft.predicate === 'isTrue' || draft.predicate === 'isFalse');
  const EXISTS = ' exists:', ABSENT = ' absent:';
  const leftRows = leftScope.flatMap((row) => {
    const read = existenceOf(row[0]);
    if (!read) return [row];
    const machine = { isBoolean: true, property: read.lifecycle.property };
    const said = (state) => propertyWords(read.alias) + GROUP_SEP + lifecycleStateWords(machine, state);
    return [
      [EXISTS + row[0], said('true'), row[2]],
      [ABSENT + row[0], said('false'), row[2]],
      ...(row[0] === draft.left && !sugaredExistence(row[0]) ? [row] : []),
    ];
  });
  // One row is an answer already; two existence rows are a question.
  // Answered before `leftShown` reads it, or the first paint shows the
  // picker empty over a value that is already set.
  if (aboutAlias && !draft.left && leftRows.length === 1) draft.left = leftRows[0][0];
  const leftShown = draft.left && existenceOf(draft.left) && sugaredExistence(draft.left)
    ? (draft.predicate === 'isTrue' ? EXISTS : ABSENT) + draft.left
    : draft.left;
  const pickExistence = (v) => {
    const prefix = [EXISTS, ABSENT].find((p) => v.startsWith(p));
    if (!prefix) return false;
    draft.left = v.slice(prefix.length);
    draft.predicate = prefix === EXISTS ? 'isTrue' : 'isFalse';
    draft.negate = false;
    draft.right = '';
    draft.predicateChosen = true;
    draft.touched = true;
    render();
    return true;
  };
  const existenceAnswered = !!draft.left && !!existenceOf(draft.left) && sugaredExistence(draft.left);
  const leftType = resolveOperandType(draftOperand(draft, 'left'), typeScope);

  // The predicate list narrows to what the left side's type supports —
  // "starts with" against an integer could never be true — and the
  // current choice is pulled back onto the list when it no longer fits,
  // the same way a stale entity/source choice snaps back elsewhere.
  const predicateChoices = BINARY_PREDICATES.concat(UNARY_PREDICATES)
    .filter((p) => predicatesForType(leftType).includes(p));
  if (!predicateChoices.includes(draft.predicate)) {
    draft.predicate = predicateChoices[0] || draft.predicate;
  }
  const unary = UNARY_PREDICATES.includes(draft.predicate);
  // `equalsAny` compares against a literal list, so its right half is
  // a membership widget rather than the operand picker: checkboxes
  // over the enum's members where the left side names an enum, typed
  // rows anywhere else.
  const membership = draft.predicate === 'equalsAny';

  // The membership entries, read the way `draftOperand` reads a
  // literal: enum-member references pass through, text coerces.
  const entryOperands = () => (draft.rightEntries || []).map((entry) => {
    if (entry !== null && typeof entry === 'object') return entry;
    const text = String(entry).trim();
    if (text === '') return undefined;
    if (/^-?\d+(\.\d+)?$/.test(text)) return Number(text);
    if (/^(true|false)$/i.test(text)) return /^true$/i.test(text);
    return text;
  }).filter((entry) => entry !== undefined);

  // The right side is filtered to what the predicate demands of it —
  // the same type as the left side for most predicates, a bare integer
  // for the count predicates, and so on — so a capacity (an integer)
  // does not sit alongside a list of ids as things to compare it with.
  // Whatever the left side already names is dropped too: "capacity
  // equals capacity" is never a rule anyone meant to write.
  const rightType = rightHandExpectedType(draft.predicate, leftType);
  const rightScope = (rightType
    ? scope.filter(([v]) => {
        const resolved = resolveOperandType(JSON.parse(v), typeScope);
        return resolved && resolved.propertyType === rightType.propertyType
          && resolved.isList === rightType.isList;
      })
    : scope).filter(([v]) => v !== draft.left);
  // Enum options on the right only make sense once the left side names
  // an enum-typed property, and only that property's own enum —
  // offering every enum's members would let "course · capacity equals
  // shipped" through, which nothing could ever satisfy.
  const leftOperand = draftOperand(draft, 'left');
  const leftPropertyName = leftOperand && (leftOperand.property || leftOperand.parameterName);
  const enumMembers = leftType ? enumMembersFor(model, leftType.propertyType) : null;
  const enums = (enumMembers && rightType && !rightType.isList
    && rightType.propertyType === leftType.propertyType)
    ? enumMembers.map((m) =>
        [JSON.stringify({ enumMember: m }), propertyWords(leftPropertyName) + ' · ' + readable(m)])
    : [];
  const rightRows = [...rightScope, ...enums];
  if (draft.right && draft.right !== LITERAL && !rightRows.some(([v]) => v === draft.right)) {
    draft.right = '';
  }
  // "Is one of" also takes a list held in data — the project's required
  // seniorities, not only values typed here. The rule stays about the
  // one value, so that is how it is asked; it is stored as `contains`
  // with the sides swapped, the code view's `x in xs`, since the schema
  // has one shape for membership in data.
  const listRows = membership && leftType && !leftType.isList
    ? scope.filter(([v]) => {
        if (v === draft.left) return false;
        const resolved = resolveOperandType(JSON.parse(v), typeScope);
        return resolved && resolved.isList && resolved.propertyType === leftType.propertyType;
      })
    : [];
  if (draft.rightList && !listRows.some(([v]) => v === draft.rightList)) draft.rightList = '';
  const fromData = !!draft.rightList;

  const close = () => {
    state.editRule = null;
    state.editGuard = null;
    state.ruleDraft = null;
    state.adder = null;
    render();
  };

  // The write itself, shared by the button and the leave-the-row
  // commit. The toasts stay in `submit`: a silent commit only runs on
  // a row `ready()` already vouched for.
  const record = () => {
    const condition = fromData
      ? { leftHandSide: JSON.parse(draft.rightList), predicate: 'contains', rightHandSide: draftOperand(draft, 'left') }
      : { leftHandSide: draftOperand(draft, 'left'), predicate: draft.predicate };
    if (!unary && !fromData) {
      condition.rightHandSide = membership ? entryOperands() : draftOperand(draft, 'right');
    }
    if (draft.negate) condition.negate = true;
    state.editRule = null;
    state.editGuard = null;
    state.adder = null;
    patchSlice((b) => {
      // One append, both writes. A binding stored without its rule
      // would be pruned by the very write that stored it, and a rule
      // stored without its binding would dangle — so the read a rule
      // brought into being lands in the same gesture, above the rule
      // that names it.
      if (pending) (b.boundary = b.boundary || []).push(deepClone(pending));
      const list = targetList(b);
      if (index === null) list.push(condition);
      else list[index] = condition;
    });
  };
  // Touched and complete commits on leaving, the same as every other
  // row — clicking straight from a finished rule to the next step no
  // longer quietly drops the rule.
  // A membership list left empty stores as the advisory case; the
  // silent leave-commit holds out for at least one entry, while an
  // explicit save is taken at its word.
  draft.ready = () => !!draft.touched
    && (!draft.newRead || !!pending)
    && draftOperand(draft, 'left') !== undefined
    && (unary || fromData || (membership ? entryOperands().length > 0 : draftOperand(draft, 'right') !== undefined));
  draft.commit = record;

  // Once both sides are chosen, Enter anywhere in the row submits it —
  // the same as clicking the primary button — so a rule typed and
  // picked entirely from the keyboard never needs the mouse to land.
  const submit = () => {
    if (draft.newRead && !pending) {
      return toast(draft.newRead.entity.startsWith('projection:')
        ? 'Pick what that projection is partitioned by.'
        : 'Pick where that thing\u2019s id comes from.', true);
    }
    if (draftOperand(draft, 'left') === undefined) return toast('Pick what the rule is about.', true);
    if (!unary && !membership && draftOperand(draft, 'right') === undefined) {
      return toast('Pick a value to compare it with.', true);
    }
    state.ruleDraft = null;
    record();
  };

  // The entities a rule can be about are the ones this command reads —
  // a property invented here lands on one of those, and the rule picks
  // it up the moment it exists. No navigation, no modal, no losing the
  // half-written rule: the form appears under the row and the row
  // stays.
  const boundEntities = [...new Set(reads.filter((b) => b.entity).map((b) => b.entity))];

  // ---------- three questions, one at a time ----------
  //
  // A rule spans what used to be two steps, and asking all of it at
  // once put five pickers in a row nobody could read as a sentence.
  // So it is staged, the way the command's own page is staged: one
  // question, then the next, with what has been answered staying on
  // screen. The stages are the three things a rule is — what it is
  // about, which of that thing's values, and what must be true of it.
  //
  // Predicate and right-hand side share the last stage rather than
  // splitting: a unary predicate has no right side at all, so a stage
  // of its own would be one that sometimes vanishes, and `equalsAny`'s
  // membership list *is* its right side.
  //
  // A rule opened for editing has answered all three already, so it
  // opens whole — the staging is for writing one, not for re-reading
  // one.
  const READ_STAGE = 0, VALUE_STAGE = 1, TEST_STAGE = 2;
  // What is on screen is *derived* from what has been answered, never
  // accumulated by the act of answering. That distinction is the whole
  // correctness of this row: gate a question on a change event and any
  // pre-filled picker deadlocks, because a `<select>` that already
  // shows the value you want fires nothing when you pick it. An entity
  // with exactly one property did precisely that — its only property is
  // filled in for you, so there was no event left to advance on, and
  // the rule could never be finished.
  //
  // Derived, the single-property case is simply already answered, and
  // the next question is already there. Nothing needs a Next button and
  // nothing can get stuck.
  const readSettled = !chooseTarget || (!!chosenTarget && (!draft.newRead || !!pending));
  const valueSettled = draftOperand(draft, 'left') !== undefined;
  const stage = !readSettled ? READ_STAGE : (valueSettled ? TEST_STAGE : VALUE_STAGE);

  // A question and its controls. The label is what makes the stack
  // read as a form rather than as a row that happens to wrap.
  const stageRow = (label, ...controls) => h('div', { class: 'rule-stage' },
    h('div', { class: 'q' }, label),
    h('div', { class: 'adder' }, ...controls));

  // ---------- stage one: what is it about? ----------
  //
  // The read. Existing reads first — two rules about the same course
  // are two rules and one read — then the things this command could
  // start reading, then a brand-new entity. The identifier source
  // belongs to this question rather than to one of its own: "the
  // course, identified by the course id" is a single thought, and an
  // existing read skips it entirely.
  const readStage = !chooseTarget
    ? (scoped ? h('div', { class: 'rule-stage' },
        h('div', { class: 'q' }, 'About ', h('span', { class: 'op' }, scoped))) : null)
    : stageRow('What is this rule about?',
        pick(targetRows, chosenTarget, (v) => {
          if (v === NEW) { closeForms(); state.newEntityAt = 'rules'; return render(); }
          draft.target = v;
          // The value picked for the old target cannot mean anything
          // against the new one. Clearing it is also what puts the
          // second question back into the unanswered state the stage is
          // derived from.
          draft.left = '';
          draft.touched = true;
          render();
        }, '— what? —'),
        ...(choice && !chosenProjection
          ? [
              h('span', { class: 'muted tiny' }, 'identified by'),
              pick(idSources, choice.source, (v) => { choice.source = v; draft.touched = true; render(); },
                idSources.length ? null : `— no ${propertyWords(idTypeOf(model, choice.entity))} in scope yet —`),
            ]
          : []),
        ...(chosenProjection
          ? (parameters.length
              ? parameters.flatMap((parameter) => [
                  h('span', { class: 'muted tiny' }, 'for its ' + propertyWords(parameter.name)),
                  pick(parameterSources.get(parameter.name),
                    (choice.args || {})[parameter.name],
                    (v) => {
                      choice.args = { ...(choice.args || {}), [parameter.name]: v };
                      draft.touched = true; render();
                    }),
                ])
              : [h('span', { class: 'muted tiny' }, '— the whole log, no tag')])
          : []));

  // ---------- stage two: which of its values? ----------
  //
  // Not asked about a projection read: it *is* one value, so the
  // question has one answer and a picker for it reads as a choice that
  // isn't. That is the read this rule is about when it is being
  // written, and the one its stored left side names when it is opened
  // again — the stored side, not the draft's, so the stage cannot
  // vanish under a pick. Answered, never assumed: a left side still
  // unset keeps the question on screen rather than strand the row.
  const isProjectionRead = (alias) => reads.some((b) => b && b.alias === alias && b.projection);
  const storedLeft = editingExisting ? ((targetList(slice.body) || [])[index] || {}).leftHandSide : null;
  const oneValue = (aboutAlias && isProjectionRead(aboutAlias))
    || (operandSource(storedLeft) === 'alias-property' && storedLeft.property === undefined
      && isProjectionRead(storedLeft.alias));
  const valueStage = stage < VALUE_STAGE || (oneValue && valueSettled) ? null
    : stageRow('Which of its values?',
        ...operandPicker(leftRows, draft, 'left',
          {
            placeholder: leftRows.length ? '— what? —'
              : (aboutAlias ? '— it has no values yet —' : '— pick something to look at —'),
            onNew: boundEntities.length
              ? () => { state.addingProp = { at: 'rule' }; render(); }
              : undefined,
            selected: leftShown,
            intercept: pickExistence,
          }));

  // ---------- stage three: what must be true of it? ----------
  //
  // Not asked when an existence row answered it: the predicate came
  // with the pick, and there is no right-hand side to ask for.
  const testStage = stage < TEST_STAGE || existenceAnswered ? null
    : stageRow('What must be true of it?',
        h('label', { class: 'tiny muted' },
          h('input', {
            type: 'checkbox', checked: !!draft.negate,
            onchange: (e) => { draft.negate = e.target.checked; draft.touched = true; },
          }), ' not'),
        pick(predicateChoices.map((p) => [p, readable(p).toLowerCase()]),
          draft.predicate, (v) => {
            // Growing an `equals` into a set keeps the value already
            // picked; shrinking back keeps the first one listed.
            if (v === 'equalsAny' && draft.predicate !== 'equalsAny') {
              const current = draftOperand(draft, 'right');
              draft.rightEntries = current === undefined ? []
                : [current !== null && typeof current === 'object' ? current : String(current)];
            } else if (draft.predicate === 'equalsAny' && v !== 'equalsAny') {
              draftFromOperand(draft, 'right', entryOperands()[0]);
            }
            draft.predicate = v; draft.predicateChosen = true; draft.touched = true; render();
          }),
        ...(unary ? [] : membership
          ? [
              ...(listRows.length
                ? [pick(listRows, draft.rightList || '', (v) => {
                    draft.rightList = v; draft.touched = true; render();
                  }, 'listed values')]
                : []),
              ...(fromData ? [] : membershipControls(draft, enumMembers)),
            ]
          : operandPicker(rightRows, draft, 'right',
            { placeholder: '— what? —', allowLiteral: !enums.length })));

  const row = h('div', {
    class: 'rule-wizard',
    // Enter answers the question on screen and moves to the next, and
    // writes the rule on the last — so a rule picked entirely from the
    // keyboard never reaches for the mouse, the same promise the single
    // row used to make.
    onkeydown: (e) => {
      if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      submit();
    },
  },
    readStage, valueStage, testStage,
    h('div', { class: 'adder' },
      // Only once there is a rule to write. Until then the row is a
      // question waiting for an answer, and a button that could only
      // scold is worse than no button.
      stage < TEST_STAGE
        ? h('span', { class: 'muted tiny' }, 'Pick one to go on.')
        : h('button', { class: 'btn primary', onclick: submit }, index === null ? addLabel : 'Save'),
      h('button', { class: 'btn ghost tiny', onclick: close }, 'Cancel')));

  if (!(state.addingProp && state.addingProp.at === 'rule')) return row;
  return h('div', {}, row, newPropertyForm(model, {
    entities: boundEntities,
    onCreated: (entityName, propertyName) => {
      // The rule was the reason the property was made, so the rule is
      // what picks it up: its left side lands on the fresh property,
      // through the alias this command already reads the entity under.
      const binding = reads.find((b) => b.entity === entityName);
      if (binding && state.ruleDraft) {
        state.ruleDraft.left = JSON.stringify({ alias: binding.alias, property: propertyName });
      }
    },
  }));
}

// The guard rows of one emission — each `when` condition as the same
// sentence a rule renders as, plus the same editor, writing into this
// emission's own list. Always visible on the card rather than folded
// behind "Fields": a guard changes what the command records, which is
// the one thing a reader of this step is here for.
function emissionGuardRows(model, slice, emission, emissionIndex) {
  const target = {
    list: (b) => (b.publishes[emissionIndex].when = b.publishes[emissionIndex].when || []),
    addLabel: 'Add guard',
  };
  const editingAt = (j) => state.editGuard
    && state.editGuard.at === emissionIndex && state.editGuard.index === j;

  const rows = (emission.when || []).map((condition, j) => {
    if (editingAt(j)) return h('div', { class: 'card rule' }, ruleEditor(model, slice, j, target));
    const p = conditionParts(condition, model, slice.body);
    const quantifier = quantifierWords(model, slice.body, condition);
    return h('div', {},
      qrow('div', { cls: 'row', key: `guard:${emissionIndex}:${j}` },
        h('span', { class: 'sentence tiny' },
          h('span', { class: 'verb' }, 'only while '),
          quantifier ? h('span', { class: 'verb' }, quantifier + ', ') : null,
          opRef(condition.leftHandSide, null, p.left), ' ', h('span', { class: 'verb' }, p.verb),
          p.right ? h('span', {}, ' ', opRef(condition.rightHandSide, null, p.right)) : null),
        h('span', { class: 'grow' }),
        reveal(
          h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.editGuard = { at: emissionIndex, index: j };
              state.ruleDraft = draftFromCondition(condition);
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger', title: 'Drop this guard — the event publishes unconditionally again',
            onclick: () => patchSlice((b) => {
              b.publishes[emissionIndex].when.splice(j, 1);
              if (!b.publishes[emissionIndex].when.length) delete b.publishes[emissionIndex].when;
            }),
          }, '×'))));
  });

  if (state.editGuard && state.editGuard.at === emissionIndex && state.editGuard.index === null) {
    rows.push(h('div', { class: 'card rule' }, ruleEditor(model, slice, null, target)));
  } else {
    // Not an `adderSlot` — a guard opens through `state.editGuard`, not
    // `state.adder` — but it folds and reveals exactly like one.
    rows.push(h('div', { class: 'adder quiet' }, h('button', {
      class: 'btn ghost tiny',
      title: 'Publish this event only under a condition — failing it skips the event, never the command',
      onclick: () => { closeForms(); state.editGuard = { at: emissionIndex, index: null }; render(); },
    }, '+ only while'), h('span', { class: 'slot' })));
  }
  return h('div', { style: 'margin-left:8px' }, ...rows);
}

function stepEmits(model, slice) {
  const cards = slice.emits.map(({ emission, event }, i) => {
    const open = state.openEvent === emission.name;
    const params = event ? (event.properties || []) : [];
    // The event's own shape — its name, its mark, its fields — is
    // edited on its own page now (see `renderEvents`): an event may be
    // published by more than one command, and one card editing what
    // every other card shows was the risk, not the convenience. This
    // card keeps only what is specific to *this* publish binding: which
    // of this command's values fills which of the event's fields.
    return h('div', { class: 'card event' },
      qrow('div', { cls: 'row', key: 'emit:' + emission.name },
        event ? eventRef(model, emission.name)
          : h('span', { class: 'chip event' }, h('i', { class: 'ic' }, eventIcon(model, emission.name)), readable(emission.name)),
        h('span', { class: 'muted tiny' }, params.length + ' field' + (params.length === 1 ? '' : 's')),
        h('span', { class: 'grow' }),
        reveal(
          advanced() ? h('span', { class: 'tech' }, emission.name) : null,
          h('button', {
            class: 'btn tiny',
            onclick: () => { state.openEvent = open ? null : emission.name; render(); },
          }, open ? 'Hide fields' : 'Fields'),
          h('button', {
            class: 'btn tiny danger',
            title: 'Stop recording this. The event itself stays — remove it from its own '
              + 'page once no command records it.',
            onclick: () => patchSlice((b) => { b.publishes.splice(i, 1); }),
          }, '×'))),
      emissionGuardRows(model, slice, emission, i),
      open ? eventFields(model, emission, event) : null);
  });
  if (!cards.length) cards.push(h('div', { class: 'empty' }, '—'));

  const existing = Object.keys(model['event-definitions']).sort()
    .filter((n) => !slice.emits.some((e) => e.emission.name === n));
  let chosen = existing[0] || '';

  const body = [h('div', {}, cards)];
  if (state.newEntityAt === 'event') {
    body.push(inlineForm({
      question: 'New event (past tense)',
      placeholder: readable(suggestEventName(slice.name)), showsIdentifier: true,
      onSubmit: (v) => {
        const name = toPascal(v);
        state.newEntityAt = null;
        const fresh = !activeModel()['event-definitions'][name];
        run(() => {
          if (fresh) addDefinition('event-definition', model.id, name, { properties: [] });
          patchSlice((b) => b.publishes.push({ name, parameters: {} }));
          state.openEvent = name;
        });
        // A brand new event records what the command was given — field
        // for field, wired through unchanged — because that is what
        // nearly every event is, and the exceptions are edits rather
        // than a copying ritual everyone performs first. It is a step
        // of its own so that when the model refuses part of it (a tag
        // the boundary never consulted), the event still exists and is
        // still recorded, and the refusal says why. An event that
        // already existed is left exactly as it is: its shape belongs
        // to every command that records it.
        if (fresh) copyCommandPropertiesIntoEvent(model, slice.name, name);
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    body.push(adderSlot('emit', 'emits', '+ emission', () =>
      h('div', { class: 'card' }, h('div', {
        class: 'adder',
        // Enter records the picked event — unless focus is on a button,
        // which already knows what Enter on it means.
        onkeydown: existing.length ? (e) => {
          if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
          e.preventDefault();
          patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} }));
        } : null,
      },
        existing.length ? pick(existing.map((n) => [n, readable(n)]), chosen, (v) => { chosen = v; }) : null,
        existing.length ? h('button', {
          class: 'btn',
          onclick: () => patchSlice((b) => b.publishes.push({ name: chosen, parameters: {} })),
        }, '+ Record something already known') : null,
        h('button', {
          class: 'btn primary',
          onclick: () => { closeForms(); state.newEntityAt = 'event'; render(); },
        }, '+ New event')))));
  }
  // The reads an emission causes, shown where their reason is. A
  // projection whose value becomes the event's id, and an instance the
  // event writes a tag for, are both read in order to *record*
  // something — not in order to decide anything — so putting them
  // under "it is only allowed if" made that step promise a rule it did
  // not have. They are the same cards, with the same Edit and the same
  // query popover; what they do not bring is the queries spine, which
  // is about the chain a decision walks and has nothing to explain
  // here.
  const decision = decisionAliases(model, slice.body);
  const caused = slice.reads.filter((b) => b && !decision.has(b.alias));
  if (caused.length) {
    body.unshift(h('div', {},
      h('div', { class: 'round-head' },
        h('span', { class: 'rule' }),
        h('span', { class: 'label' }, 'to record this, it reads')),
      // `[]` rather than nothing: a read here has no rules by
      // definition, but it still offers to take one — and taking one is
      // exactly what moves it over to the decide step, since a rule is
      // what makes a read part of the decision.
      ...caused.map((binding) =>
        readCard(model, slice, binding, slice.reads.indexOf(binding), [], []))));
  }

  return step('emits', 'Append', ...body);
}

// Renaming an event or one of its fields rewrites every declared
// operand naming it. It cannot rewrite code: nothing here parses a
// script, and a textual pass over an unparsed language would sooner or
// later rewrite a comment or a string literal. So the rename goes
// through and this says which scripts to go and read.
function warnScripted(model, eventName) {
  const scripted = scriptedHandlersOf(model, eventName);
  if (!scripted.length) return;
  toast(`Renamed. ${scripted.join(', ')} handle${scripted.length === 1 ? 's' : ''} `
    + `${readable(eventName)} in code, which was not rewritten — check ${
      scripted.length === 1 ? 'it' : 'them'}.`);
}

// A key in `publishes[].parameters` that no longer names a property on
// the event it targets is not a reference to anything — the field it
// once read is gone. The only way there is one is a leftover from
// before `removeEventField` cleaned up after itself; swept here, on
// every payload edit, so a leftover like that never blocks removing the
// value it still, invisibly, claimed to use.
function pruneDanglingEmissionParameters(model, body) {
  for (const emission of body.publishes || []) {
    if (!emission.parameters) continue;
    const eventDef = model['event-definitions'][emission.name];
    const known = new Set((eventDef ? eventDef.properties : []).map((q) => q.name));
    for (const key of Object.keys(emission.parameters)) {
      if (!known.has(key)) delete emission.parameters[key];
    }
  }
}

// A field leaves the event, and takes its binding with it. The binding
// lives on the *command* side — `publishes[].parameters`, keyed by this
// field's own name — and every command that emits the event can hold
// one. Dropped only from the event, that key would go on pointing at
// whatever command value it read, invisibly, since nothing on the page
// still shows a field for it to belong to. Left in place, it keeps
// "using" that value forever, which is what later refuses to let the
// value itself be removed for a reason no longer visible anywhere.
function removeEventField(model, eventName, index, propertyName) {
  run(() => {
    const eventBody = deepClone(activeModel()['event-definitions'][eventName]);
    eventBody.properties.splice(index, 1);
    updateDefinition('event-definition', model.id, eventName, eventBody);

    const changes = [];
    for (const [name, body] of Object.entries(activeModel()['command-definitions'])) {
      const bound = (body.publishes || [])
        .some((e) => e.name === eventName && e.parameters && propertyName in e.parameters);
      if (!bound) continue;
      const next = deepClone(body);
      for (const e of next.publishes || []) {
        if (e.name === eventName && e.parameters) delete e.parameters[propertyName];
      }
      changes.push({ kind: 'command-definition', name, body: next });
    }
    if (changes.length) updateDefinitions(model.id, changes);
  });
}

// What this command's publish binding does: map this command's own
// values into the event's fields. The fields themselves — their names,
// their types, how many there are — are no longer edited here; an
// event may be published by more than one command, so their shape has
// exactly one home, on the event's own page (`eventFieldsEditor`).
// This stays specific to *this* binding for the same reason
// `copyFromCommand` below has to: only this command knows what it was
// given.
function eventFields(model, emission, event) {
  if (!event) return h('div', { class: 'fields empty' }, 'This event no longer exists.');
  const command = activeModel()['command-definitions'][state.slice];
  const boundary = command.boundary || [];
  const commandProperties = command.properties || [];
  const options = [
    ...commandProperties.map((q) =>
      [JSON.stringify({ parameterName: q.name }), 'given · ' + propertyWords(q.name)]),
    // Everything the command reads is bound, so everything it can emit
    // comes off an alias — a projection's value included.
    ...boundary.flatMap((b) => {
      if (b.projection) {
        return [[JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]];
      }
      const entity = model['entity-definitions'][b.entity];
      const icon = entityIcon(model, b.entity);
      const props = (entity ? entity.properties : []).map((q) =>
        [JSON.stringify({ alias: b.alias, property: q.name }), memberWords(b.alias, q.name), icon]);
      // An alias identified straight off a payload parameter already
      // has that same value in scope under "given · …", so naming it
      // again here would just be a second label on the one thing. One
      // found by tracing through another alias' property has no such
      // shortcut — that path is not what an event wants to say — so its
      // own identity is worth offering directly.
      const ownId = b.id !== undefined && operandSource(b.id) !== 'parameter'
        ? [[JSON.stringify(b.id), memberWords(b.alias, 'id'), icon]]
        : [];
      return [...props, ...ownId];
    }),
  ];

  const rows = (event.properties || []).map((p) => {
    const bound = (emission.parameters || {})[p.name];
    // Only options whose resolved type actually matches this field are
    // offered — a field typed `StudentId` has no use for a capacity.
    const fieldOptions = options.filter(([v]) => {
      const resolved = resolveOperandType(JSON.parse(v), { boundary, commandProperties, model });
      return resolved && resolved.propertyType === p.propertyType && resolved.isList === !!p.isList;
    });
    return h('div', { class: 'field', 'data-src': 'evprop:' + emission.name + '.' + p.name },
      h('span', { class: 'nm' }, propertyWords(p.name)),
      h('span', { class: 'muted tiny' }, readable(typeLabel(p))),
      h('span', { class: 'muted tiny' }, '←'),
      pick(fieldOptions, bound === undefined ? '' : JSON.stringify(bound),
        (v) => patchSlice((b) => {
          const e = b.publishes.find((x) => x.name === emission.name);
          e.parameters = e.parameters || {};
          // The placeholder's value is '' — unset, not an operand.
          if (v === '') delete e.parameters[p.name];
          else e.parameters[p.name] = JSON.parse(v);
        }), '— unset —'));
  });

  // What the command was given but this event does not yet carry. A
  // field copied from here is not a guess at what the event should say —
  // it is a value already in the command's own vocabulary, so the copy
  // both declares the field and wires it to that value in one step. It
  // stays here rather than on the event's page because it reads *this*
  // command's payload — an event published by several commands has no
  // one "given" to offer.
  const missing = commandProperties.filter((q) => !(event.properties || []).some((p) => p.name === q.name));
  const copyFromCommand = (properties) => {
    patch('event-definition', emission.name, (b) => {
      for (const property of properties) {
        b.properties.push({
          name: property.name, propertyType: property.propertyType,
          isOptional: property.isOptional, isList: property.isList,
        });
      }
    });
    patchSlice((b) => {
      const e = b.publishes.find((x) => x.name === emission.name);
      e.parameters = e.parameters || {};
      for (const property of properties) e.parameters[property.name] = { parameterName: property.name };
    });
  };

  return h('div', { class: 'fields' },
    rows.length ? rows : h('div', { class: 'empty' }, '—'),
    missing.length ? h('div', { class: 'copy-missing' },
      h('span', { class: 'muted tiny' }, 'Given but not recorded: '),
      missing.map((p) => h('button', {
        class: 'chip suggest',
        title: 'Add ' + propertyWords(p.name) + ' to this event, carried through unchanged',
        onclick: () => copyFromCommand([p]),
      }, '+ ' + propertyWords(p.name))),
      // The common case — an event that just records what it was given,
      // field for field — is one click rather than one per field.
      missing.length > 1 ? h('button', {
        class: 'chip suggest flow-adder',
        title: `Add all ${missing.length} of these at once, each carried through unchanged`,
        onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
        onclick: () => copyFromCommand(missing),
      }, `+ all ${missing.length}, same as the command`) : null) : null,
    h('div', { class: 'adder', style: 'margin-top:6px' },
      h('button', {
        class: 'btn ghost tiny',
        onclick: () => goToEvent(emission.name),
      }, 'Rename, retype or add fields on ' + readable(emission.name) + ' →')));
}

function stepChanges(model, slice) {
  const cards = [];
  for (const { emission, effects, standalone } of slice.emits) {
    // Everything the event moves: entity properties, named through
    // their entity, then the projections no entity binds — a model
    // without entities keeps its state there, and an event that moves
    // one does not "change nothing we know".
    const changes = [
      ...effects.map((effect) => ({
        effect,
        key: effect.entity + '.' + effect.property.name,
        target: JSON.stringify([effect.entity, effect.property.name]),
        ref: (text) => entityRef(model, effect.entity, { cls: 'op ent', text }),
      })),
      ...(standalone || []).map((effect) => ({
        effect,
        key: 'projection:' + effect.projection,
        target: JSON.stringify({ projection: effect.projection }),
        ref: (text) => projectionRef(model, effect.projection, { text }),
      })),
    ];
    const rows = changes.map(({ effect, key, target, ref }) => {
      const p = effectParts(effect);
      const projectionName = effect.projectionName || effect.projection;
      // An entity property names its instance through the entity; a
      // projection says which of its instances outright.
      const args = effect.entity ? [] : changeArguments(model, emission, projectionName);
      // A handler the event cannot reach is kept, never hidden — it is
      // an advisory, and this is where it is wrong.
      const missing = partitionTagsMissing(model, model['projection-definitions'][projectionName], emission.name);
      // A scripted handler has no operation/value for this form to
      // pre-fill — it is edited where its code is, in the projection's
      // own editor.
      const scripted = effect.handler.code !== undefined;
      return qrow('div', { cls: 'row', key: 'chg:' + emission.name + ':' + key },
        h('span', { class: 'sentence' },
          ref(p.subject), ' ',
          ...(args.length ? [h('span', { class: 'muted' }, 'for '),
            ...args.flatMap((a, i) => [i ? ' and ' : null, opRef(a, emission.name)]), ' '] : []),
          h('span', { class: 'verb' }, p.verb), ' ',
          opRef(effect.handler.value, emission.name, p.object),
          missing.length ? h('span', { class: 'muted tiny' },
            ` — never fires: carries no ${missing.map(propertyWords).join(' or ')}`) : null),
        h('span', { class: 'grow' }),
        reveal(
          scripted ? null : h('button', {
            class: 'btn tiny',
            onclick: () => {
              closeForms();
              state.changeDraft = draftFromOperand({
                eventName: emission.name, target, operation: effect.handler.operation,
              }, 'value', effect.handler.value);
              state.adder = 'chg:' + emission.name;
              render();
            },
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger',
            onclick: () => patch('projection-definition', projectionName, (b) => {
              b.handlers = (b.handlers || []).filter((x) => x.event !== emission.name);
            }),
          }, '×')));
    });
    cards.push(h('div', { class: 'card entity' },
      h('div', { class: 'row' }, h('span', { class: 'chip event' },
          h('i', { class: 'ic' }, eventIcon(model, emission.name)), readable(emission.name)),
        h('span', { class: 'muted tiny' }, 'changes')),
      h('div', { style: 'margin-top:6px' },
        rows.length ? rows : h('div', { class: 'empty' }, 'Changes nothing we know.')),
      changeAdder(model, emission.name, emission)));
  }
  if (!cards.length) cards.push(h('div', { class: 'empty' }, 'Nothing to change until it records something.'));
  return step('changes', 'State changes', h('div', {}, cards));
}

// Which instance of a projection a change moves, in the emitting
// command's own terms: for each parameter, the event field carrying its
// tag, and what this command puts in that field — `Book exists` for
// `isbn`, the one it was given. A field the emission leaves unset is
// said as its path. Not said for a scripted projection, whose tags are
// its filter's business.
function changeArguments(model, emission, projectionName) {
  const projection = model['projection-definitions'][projectionName];
  const event = model['event-definitions'][emission.name];
  if (!projection || !event || scriptOf(projection)) return [];
  const typesOf = (type) => idLeavesOfType(model, type).map((leaf) => leaf.identifierType);
  return (projection.parameters || []).flatMap((parameter) => {
    const wanted = typesOf(parameter.propertyType);
    return (event.properties || [])
      .filter((p) => p && typesOf(p.propertyType).some((type) => wanted.includes(type)))
      .map((p) => {
        const operand = (emission.parameters || {})[p.name];
        return operand !== undefined ? operand : { eventProperty: p.name };
      });
  });
}

// What a change targets: an entity property, `[entity, property]`, or a
// projection no entity binds, `{projection}`. Both come down to the
// projection that holds the handler; `word` is what its enum members
// are labelled with in the value picker.
function changeTargetOf(model, target) {
  if (!target || target === NEW) return null;
  const parsed = JSON.parse(target);
  if (Array.isArray(parsed)) {
    const { binding, projection } = entityPropertyTarget(model, parsed[0], parsed[1]);
    return { projectionName: binding && binding.projection, projection, word: propertyWords(parsed[1]) };
  }
  return {
    projectionName: parsed.projection,
    projection: model['projection-definitions'][parsed.projection] || null,
    word: readable(parsed.projection),
  };
}

// The "does what" control. A picker while there is a choice, and the
// verb itself once there is not — which is every fold but a list or an
// integer. A one-option `<select>` is not a choice, it is a control that
// looks like one, and this row already asks three questions.
function operationControl(operations, draft) {
  if (operations.length === 1) {
    draft.operation = operations[0];
    return h('span', { class: 'verb' }, OPERATION_WORDS[operations[0]] || operations[0]);
  }
  return pick(operations.map((op) => [op, OPERATION_WORDS[op] || op]), draft.operation,
    (v) => { draft.operation = v; draft.touched = true; render(); });
}

function changeAdder(model, eventName, emission) {
  const event = model['event-definitions'][eventName];

  if (state.newEntityAt === 'changes:' + eventName) {
    return inlineForm({
      question: 'New entity', placeholder: 'entity name',
      showsIdentifier: true,
      onSubmit: (v) => {
        state.newEntityAt = null;
        const created = createEntity(model, v);
        // A fresh entity has no properties, so a change has nothing to
        // target yet — the property form opens on it, the same move the
        // rule wizard makes. A lifecycle is not offered here: that is
        // added on the entity's own page, or not at all.
        if (created) {
          state.fieldDraft = null;
          state.addingProp = { eventName, only: created };
          render();
        }
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    });
  }
  // A scripted or derived projection is not offered here: this form
  // writes an operation and an operand, and neither takes one — code
  // is edited where the code is, and nothing moves a derived value.
  // Nor one this event cannot reach: a projection kept per copy id is
  // not moved by an event that carries no copy id, whichever one it is
  // (`partitionTagsMissing`).
  const settable = (projection) => !!projection && !scriptOf(projection) && !derivedOf(projection)
    && !partitionTagsMissing(model, projection, eventName).length;
  const hasEntities = Object.keys(model['entity-definitions']).length > 0;
  // Beside the entity properties, every projection no entity binds — a
  // bound one is already offered as its entity's property, and offering
  // it twice would be one handler reachable under two names.
  const standaloneTargets = Object.keys(model['projection-definitions']).sort()
    .filter((name) => !boundAs(model, name).length && settable(model['projection-definitions'][name]))
    .map((name) => {
      const args = emission ? changeArguments(model, emission, name).map(operandWords) : [];
      return [JSON.stringify({ projection: name }),
        'projection' + GROUP_SEP + readable(name) + (args.length ? ' for ' + args.join(' and ') : '')];
    });
  if (!hasEntities && !standaloneTargets.length) {
    return h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'no entities'),
      h('button', {
        class: 'btn primary',
        onclick: () => { closeForms(); state.newEntityAt = 'changes:' + eventName; render(); },
      }, '+ New entity'));
  }

  const targets = [
    ...Object.entries(model['entity-definitions']).flatMap(([name, entity]) =>
      (entity.properties || [])
        .filter((p) => settable(entityPropertyTarget(model, name, p.name).projection))
        .map((p) =>
          [JSON.stringify([name, p.name]),
            `${iconPrefix(entityIcon(model, name))}${readable(name)} · ${propertyWords(p.name)}`])),
    ...standaloneTargets,
    // A new property lands on an entity, so it is offered only where
    // there is one to land on.
    ...(hasEntities ? [[NEW, '+ New property…']] : []),
  ];
  const firstTarget = (targets.find(([v]) => v !== NEW) || [''])[0];
  // The draft outlives a repaint, which a typed literal needs: the
  // picker rebuilds on every keystroke otherwise.
  const draft = state.changeDraft && state.changeDraft.eventName === eventName
    ? state.changeDraft
    : (state.changeDraft = {
        eventName,
        target: firstTarget,
        operation: 'set',
        value: '',
      });

  // What a handler may take in: a property of the event, a member of
  // whichever enum the currently targeted property is typed with — not
  // any other enum, which nothing here could ever hold — the successor
  // of something, or a typed literal. Event properties are held to the
  // same rule the emission fields and the rule editor's right side
  // apply: only the ones typed like the targeted property are offered —
  // a status is never set from a title. A successor is offered only to
  // `set` a numbering (`offersSuccessor`), which is the one thing it is
  // for. `currentValue` is not offered at all: `set` to it changes
  // nothing and `increment` by it doubles — see `handlerValueChoices`.
  const target = changeTargetOf(model, draft.target);
  const targetProjection = target ? target.projection : null;
  const targetEnumMembers = targetProjection ? enumMembersFor(model, targetProjection.valueType) : null;
  const targetType = targetProjection ? targetProjection.valueType : null;
  const targetIsBoolean = targetType === 'boolean' && !targetProjection.isList;
  const offerProperty = (p) => !targetType || p.propertyType === targetType;
  const operations = targetProjection ? operationsFor(model, targetProjection)
    : Object.keys(OPERATION_WORDS);
  if (!operations.includes(draft.operation)) draft.operation = operations[0];
  const offerSuccessor = !!targetType && draft.operation === 'set'
    && !targetProjection.isList && offersSuccessor(model, targetType);
  const offeredFields = (event ? event.properties : []).filter(offerProperty);
  const values = [
    ...offeredFields.map(eventFieldChoice),
    ...(offerSuccessor ? offeredFields.filter((p) => !p.isList).map(successorChoice) : []),
    // A boolean's two values are as much a closed set as an enum's
    // members, so they are picked rather than typed. Unlike an enum's,
    // they sit *beside* the literal row rather than replacing it: a
    // handler already storing `true` reopens through the literal (that
    // is what `draftFromOperand` does with any primitive), and taking
    // the row away would strand every boolean fold the models ship.
    ...(targetIsBoolean ? [['true', 'true'], ['false', 'false']] : []),
    ...(targetEnumMembers || []).map((m) =>
      [JSON.stringify({ enumMember: m }), target.word + ' · ' + readable(m)]),
    ...(targetEnumMembers ? [[NEW, '+ New member…']] : []),
  ];
  // Retargeting can strip the row the draft was holding — a value the
  // new target cannot take, or the literal row an enum never offers.
  // The stale choice would silently diverge from what the picker
  // shows, so it resets, and `operandPicker` takes the first offer.
  const offered = new Set(values.map(([v]) => v));
  if (draft.value === LITERAL ? targetEnumMembers
    : draft.value && draft.value !== NEW && !offered.has(draft.value)) {
    draft.value = '';
  }

  const targetSel = pick(targets, draft.target, (v) => {
    if (v === NEW) { closeForms(); state.addingProp = { eventName }; return render(); }
    draft.target = v;
    draft.touched = true;
    render();
  });

  // What actually records the change, shared between the button and
  // the leave-the-row commit. By the time it runs the row is complete;
  // the interactive detours (a new member, a missing target) belong to
  // `submitChange`, which is the only caller that can still ask.
  const record = () => {
    const value = draftOperand(draft, 'value');
    const operation = draft.operation;
    const { projectionName } = changeTargetOf(model, draft.target);
    patch('projection-definition', projectionName, (b) => {
      b.handlers = (b.handlers || []).filter((x) => x.event !== eventName);
      b.handlers.push({ event: eventName, operation, value });
    });
  };
  // The same rule the field adders follow, with the picker reading of
  // "has a name": a row of untouched defaults is a proposal — the
  // wizard opens one — and walking away from a proposal declines it.
  // Touched and complete, though, is an edit someone made, and leaving
  // the row is what finishes it.
  draft.ready = () => !!draft.touched
    && !!draft.target && draft.target !== NEW && draft.value !== NEW
    && draftOperand(draft, 'value') !== undefined;
  draft.commit = record;

  // Once a target and a value are chosen, Enter anywhere in the row
  // records the change — the same as clicking the button.
  const submitChange = () => {
    if (!draft.target || draft.target === NEW) return toast('Pick what changes.', true);
    if (draft.value === NEW) {
      closeForms();
      state.addingMember = { type: targetProjection.valueType, eventName };
      return render();
    }
    if (draftOperand(draft, 'value') === undefined) return toast('Say what it changes to.', true);
    state.changeDraft = null;
    record();
  };

  const rows = [adderSlot('chg:' + eventName, 'changes', '+ change', () =>
    h('div', {
      class: 'adder',
      onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); submitChange(); } },
    }, targetSel,
      operationControl(operations, draft),
      ...operandPicker(values, draft, 'value', { allowLiteral: !targetEnumMembers }),
      h('button', { class: 'btn', onclick: submitChange }, '+ Record a change')))];

  if (state.addingProp && state.addingProp.eventName === eventName) {
    rows.push(newPropertyForm(model, {
      // "I created it" means "that is the one I meant": the adder
      // reopens on the fresh property, ready for the operation and
      // value, instead of asking the question the creation answered.
      onCreated: (entityName, propertyName) => {
        state.adder = 'chg:' + eventName;
        state.changeDraft = {
          eventName, target: JSON.stringify([entityName, propertyName]),
          operation: 'set', value: '',
        };
      },
    }));
  }
  if (state.addingMember && state.addingMember.eventName === eventName) {
    rows.push(addEnumMemberForm(model, state.addingMember.type));
  }
  return h('div', {}, rows);
}


// ---------- creating things ----------

// Every payload property the event does not yet carry, declared on the
// event and wired through unchanged — the "+ all N, same as the
// command" chip, as a callable step. One run, one undo entry. The
// model may refuse it (an identifier the boundary never consulted may
// not be written as a tag), and the refusal surfaces as the ordinary
// toast, with the event itself untouched by the half that failed.
function copyCommandPropertiesIntoEvent(model, commandName, eventName) {
  const current = activeModel();
  const command = current['command-definitions'][commandName];
  const event = current['event-definitions'][eventName];
  if (!command || !event) return;
  const missing = (command.properties || [])
    .filter((q) => !(event.properties || []).some((p) => p.name === q.name));
  if (!missing.length) return;
  run(() => {
    const eventBody = deepClone(activeModel()['event-definitions'][eventName]);
    eventBody.properties = eventBody.properties || [];
    for (const p of missing) {
      eventBody.properties.push({
        name: p.name, propertyType: p.propertyType,
        isOptional: p.isOptional, isList: p.isList,
      });
    }
    updateDefinition('event-definition', model.id, eventName, eventBody);
    const commandBody = deepClone(activeModel()['command-definitions'][commandName]);
    const emission = (commandBody.publishes || []).find((x) => x.name === eventName);
    if (emission) {
      emission.parameters = emission.parameters || {};
      for (const p of missing) emission.parameters[p.name] = { parameterName: p.name };
    }
    updateDefinition('command-definition', model.id, commandName, commandBody);
  });
}

function createEntity(model, label) {
  const name = toPascal(label);
  if (!name) return toast('Give it a name.', true);
  // Bare: an identifier and nothing else. Every entity used to arrive
  // with an `exists` lifecycle, which put "exists" / "does not exist"
  // in front of authors who had never asked for it — so a lifecycle is
  // now something added from the entity's own page
  // (`addExistenceLifecycle`, or the enum form), and until then the
  // existence wording appears nowhere.
  return run(() => {
    addDefinition('entity-definition', model.id, name, { properties: [] });
    return name;
  });
}

// The smallest lifecycle there is, in one click: a boolean `exists`
// that starts false and is set true by whatever records that the thing
// is there. No enum, no custom type, no vocabulary. If the entity
// still holds an `exists` boolean from a lifecycle it was relieved of,
// that one is designated again rather than shadowed by a second
// (`existenceLifecycleOffer`).
function addExistenceLifecycle(model, entityName) {
  const offer = existenceLifecycleOffer(model, entityName);
  if (!offer) return toast(`${readable(entityName)} already has an "${LIFECYCLE_PROPERTY}" `
    + 'property that cannot be a lifecycle.', true);
  return run(() => {
    const body = deepClone(activeModel()['entity-definitions'][entityName]);
    if (offer === 'create') {
      const projectionName = projectionNameFor(activeModel(), entityName, LIFECYCLE_PROPERTY);
      addDefinition('projection-definition', model.id, projectionName, {
        parameters: [{ name: defaultAlias(entityName) + 'Id', propertyType: idTypeOf(model, entityName) }],
        valueType: 'boolean',
        isList: false,
        initialValue: false,
        handlers: [],
      });
      body.properties = [...(body.properties || []), { name: LIFECYCLE_PROPERTY, projection: projectionName }];
    }
    body.lifecycle = LIFECYCLE_PROPERTY;
    updateDefinition('entity-definition', model.id, entityName, body);
    return LIFECYCLE_PROPERTY;
  });
}

// Undoes exactly the designation. The property stays an ordinary one —
// a condition may still read it, and deleting what a rule names is the
// property delete's business, with its own guard — and every condition
// over it goes back to reading literally (`course · exists holds`).
function removeLifecycle(model, entityName) {
  return run(() => {
    const body = deepClone(activeModel()['entity-definitions'][entityName]);
    delete body.lifecycle;
    updateDefinition('entity-definition', model.id, entityName, body);
    state.lcOpen = { ...state.lcOpen, [entityName]: false };
    return entityName;
  });
}

// Turning one or more monotone booleans into a real lifecycle.
//
// Forced to be a form rather than a button: the enum has to be named,
// every state has to be named, and the property the booleans collapse
// into has to be named. None of that is inferable.
//
// **The shape.** `steps` is the progression, in order. Step *i* names
// state *i+1* and, optionally, the boolean whose becoming-true is the
// arrow into it; state 0 is `initialState`, where nothing has happened
// yet. So `exists` alone promotes as one step plus a second step with no
// boolean behind it yet (the "add Archived before anything archives"
// case), and `registered` + `expelled` promote as two steps with a
// boolean each.
//
// **Why the conditions need real thought.** A boolean absorbed at step
// *i* held in every state from *i+1* onward — an expelled student was
// still registered — so `registered isTrue` becomes
// `equalsAny [Registered, Expelled]`, not `equals Registered`. Getting
// this wrong would silently narrow every rule that mentioned the
// boolean, which is the one way a promotion could change what a model
// means. `statesWhereHeld` is that translation, and it is the reason a
// merge is worth doing for the author rather than leaving them to it.
//
// One `run`, so the whole thing is a single undo step. A half-merged
// model — conditions still naming a property that no longer exists —
// is exactly the incoherent state the log has no migration for.
function mergeIntoLifecycle(model, entityName, { typeName, property, initialState, steps }) {
  const entity = model['entity-definitions'][entityName];
  if (!entity) return toast('That entity is gone.', true);
  const rows = (steps || []).filter((step) => step && (step.state || '').trim());
  if (!rows.length) return toast('A lifecycle needs at least one state after the first.', true);

  const states = [initialState, ...rows.map((r) => r.state)]
    .map((name) => toPascal((name || '').trim()));
  if (states.some((name) => !name)) return toast('Every state needs a name.', true);
  if (new Set(states).size !== states.length) return toast('Those states are not distinct.', true);

  const absorbed = rows.map((r) => r.from || null);
  const taken = absorbed.filter(Boolean);
  // Three when this replaces booleans — two states would be the boolean
  // again, with vocabulary — but two for an enum named from nothing,
  // which an author who picked the enum on purpose (Draft, Published)
  // should not be argued out of.
  const fromScratch = !taken.length && !lifecycleOf(model, entityName);
  if (states.length < (fromScratch ? 2 : 3)) {
    return toast(fromScratch ? 'A lifecycle needs at least two states.'
      : 'A lifecycle needs three states to be worth an enum.', true);
  }
  if (new Set(taken).size !== taken.length) {
    return toast('One property cannot be two states.', true);
  }
  for (const name of taken) {
    if (!isMonotoneBoolean(model, entityName, name)) {
      return toast(`"${propertyWords(name)}" is not a one-way boolean, so it is not a stage.`, true);
    }
  }
  // One handler per event per projection is a real constraint, so two
  // booleans moved by the same event cannot become one lifecycle: the
  // merged fold would need two handlers for it. Said before anything is
  // written, because the alternative is a refusal halfway through.
  const byEvent = new Map();
  for (const name of taken) {
    const { projection } = entityPropertyTarget(model, entityName, name);
    for (const handler of projection.handlers || []) {
      if (!handler || !handler.event) continue;
      if (byEvent.has(handler.event)) {
        return toast(`${readable(handler.event)} moves both `
          + `${propertyWords(byEvent.get(handler.event))} and ${propertyWords(name)}, so they `
          + 'cannot be one lifecycle — one event moves a lifecycle to one state.', true);
      }
      byEvent.set(handler.event, name);
    }
  }

  const type = toPascal(typeName || (entityName + 'Status'));
  const merged = toCamel(property || 'status');
