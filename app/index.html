// `null` never appears here. It is a state of the value as a whole,
// chosen above this control, because "no value yet" is not a value of
// some type — it is the absence of one.
function initialValueSlot(model, valueType, value, onSet) {
  const members = enumMembersFor(model, valueType);
  if (members) {
    return pick(members.map((m) => [m, readable(m)]),
      operandSource(value) === 'enum-member' ? value.enumMember : '',
      (v) => onSet({ enumMember: v }), '— which one? —');
  }
  if (literalKindOf(model, valueType) === 'boolean') {
    return pick([['true', 'yes'], ['false', 'no']], String(value === true),
      (v) => onSet(v === 'true'));
  }
  return h('input', {
    type: 'text', style: 'width:150px',
    value: value === undefined || value === null ? '' : String(value),
    placeholder: literalKindOf(model, valueType) === 'number' ? '0' : 'value',
    onblur: (e) => {
      const parsed = literalOfType(model, valueType, e.target.value);
      if (parsed === undefined) return toast('That is not a ' + readable(valueType) + '.', true);
      onSet(parsed);
    },
    onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
  });
}

// A value of this type to start a fresh slot from, so adding a list
// element or switching off "nothing yet" lands on something legal.
function blankSlotValue(model, valueType) {
  const members = enumMembersFor(model, valueType);
  if (members) return { enumMember: members[0] };
  const kind = literalKindOf(model, valueType);
  if (kind === 'number') return 0;
  if (kind === 'boolean') return false;
  return '';
}

// Where a projection starts.
//
// The first choice is whether there is a value at all, and it is a
// choice rather than a blank field on purpose: `null` and `""` are
// different answers, and a single text box cannot tell you which one
// an empty box means. Naming `null` as its own option is the only way
// the two stay distinguishable both on the page and in the model.
//
// For a list the same choice sits above the elements: `null`, or a
// list — which may itself be empty, a third answer again.
function initialValueEditor(model, draft) {
  const isNull = draft.initialValue === null || draft.initialValue === undefined;
  const choose = (toNull) => {
    if (toNull) draft.initialValue = null;
    else if (draft.isList) draft.initialValue = [];
    else draft.initialValue = blankSlotValue(model, draft.valueType);
    render();
  };

  const radio = (checked, label, title, onPick) => h('label', {
    class: 'tiny muted', style: 'margin-right:10px', title,
  }, h('input', {
    type: 'radio', name: 'initial-' + (state.projDraft ? 'edit' : 'new'),
    checked, onchange: () => onPick(),
  }), ' ', label);

  const rows = [h('div', { class: 'adder' },
    radio(isNull, 'null', 'No value until an event sets one — not the empty string',
      () => choose(true)),
    radio(!isNull, draft.isList ? 'list' : 'value',
      draft.isList ? 'Starts holding these, before anything has happened'
        : 'Starts at this value', () => choose(false)),
    !isNull && !draft.isList
      ? initialValueSlot(model, draft.valueType, draft.initialValue,
          (v) => { draft.initialValue = v; })
      : null)];

  if (!isNull && draft.isList) {
    const elements = Array.isArray(draft.initialValue) ? draft.initialValue : [];
    rows.push(h('div', { style: 'margin-left:18px' },
      elements.length
        ? elements.map((element, i) => h('div', { class: 'adder' },
            initialValueSlot(model, draft.valueType, element, (v) => { elements[i] = v; }),
            h('button', {
              class: 'btn tiny danger', title: 'Drop this one',
              onclick: () => { elements.splice(i, 1); render(); },
            }, '×')))
        : h('div', { class: 'muted tiny' }, '[]'),
      h('div', { class: 'adder' }, h('button', {
        class: 'btn ghost tiny',
        onclick: () => {
          draft.initialValue = [...elements, blankSlotValue(model, draft.valueType)];
          render();
        },
      }, '+ one it starts with'))));
  }

  return rows;
}

// The types on offer as a partition. Only a tag can narrow a query, so
// nothing else appears — an entity's own derived identifier as much as
// a standalone tag-marked type, scalar or composite (through its
// tag-marked fields) either way.
function partitionTypeOptions(model) {
  return allTypeNames(model)
    .filter((t) => classifyType(model, t).kind === 'value' && isTagBearing(model, t))
    .map((t) => [t, readable(t)]);
}

// A value the event carried, as a token option (see `pick`): short
// under its `event` heading, `event.data.capacity` once picked — the
// same path `operandWords` renders and a scripted handler writes.
function eventFieldChoice(p) {
  return [JSON.stringify({ eventProperty: p.name }), p.name, null,
    { group: 'event', before: 'event.data.' }];
}

function successorChoice(p) {
  return [JSON.stringify({ successor: { eventProperty: p.name } }), p.name, null,
    { group: 'successor', before: 'successor(event.data.', after: ')' }];
}

// A projection's handler value, offered as the small set that makes
// sense for the type it holds. `successor` is what turns a plain
// projection into a numbering, so it is a value on this list rather
// than a concept of its own.
//
// A list-typed event property of the right type is offered too: a
// list-valued projection is `set` from one whole, and `append` from a
// list adds its elements rather than nesting them.
//
// `currentValue` is not on the list, though the wire format keeps it:
// `set` to the value already held changes nothing, `increment` by it
// doubles and `append` of it repeats the list — no shipped model uses
// it, and offering it only invited the question what it was for. A
// stored one still runs and still reads as `currentValue`.
function handlerValueChoices(model, draft, event, operation) {
  const properties = (event ? (event.properties || []) : [])
    .filter((p) => p.propertyType === draft.valueType);
  // Only to `set` a numbering. Offered for any type with a next value
  // it put "the one after …" beside every text field and every
  // operation, and before that — offered unconditionally — "the one
  // after true" on a boolean fold, which stored fine and then failed
  // validation.
  const successors = operation === 'set' && !draft.isList && offersSuccessor(model, draft.valueType);
  const out = [
    ...properties.map(eventFieldChoice),
    ...(successors ? properties.filter((p) => !p.isList).map(successorChoice) : []),
  ];
  const enumMembers = enumMembersFor(model, draft.valueType);
  if (enumMembers) {
    for (const m of enumMembers) out.push([JSON.stringify({ enumMember: m }), readable(m)]);
  }
  // A boolean's two values, for the same reason an enum's members are
  // here: a closed set is picked, not typed.
  if (draft.valueType === 'boolean' && !draft.isList) {
    out.push(['true', 'true'], ['false', 'false']);
  }
  return out;
}

// ---------- the draft a projection is edited as ----------
//
// A handler's operand is *picked* — from the event, from the current
// value, from an enum — or typed as a literal, which is two controls
// rather than one and so two draft fields rather than one. That is the
// same `{value, valueText}` shape every other operand form on this
// page uses (see `draftOperand`), so the draft a projection is edited
// as is not quite the body that gets stored: it carries the picker's
// state, and `cleanProjectionBody` is where it becomes a body again.
//
// Going through a sanitiser on the way out is also what keeps a stray
// draft key from ever reaching the model. One used to: a leftover
// `advancedBy` rode out of the new-projection form into every export,
// where the schema refuses it.
// The events one handler row may claim: everything not already handled
// by a *different* row. One handler per event type is the rule the
// picker enforces by omission — an event already spoken for never
// appears, instead of appearing and being refused after the fact.
function unhandledEventChoices(eventNames, handlers, current) {
  const taken = new Set((handlers || [])
    .filter((h) => h && h !== current && h.event)
    .map((h) => h.event));
  return (eventNames || []).filter((name) => !taken.has(name));
}

function projectionDraftFrom(body) {
  const draft = deepClone(body);
  draft.handlers = (draft.handlers || []).map((handler) =>
    (handler.code !== undefined
      ? handler
      : draftFromOperand({ event: handler.event, operation: handler.operation }, 'value', handler.value)));
  return draft;
}

// Fields are written in the order the schema declares them, not the
// order this happens to build them, so a model that goes out and comes
// back in is the same file rather than a reshuffled one.
function cleanProjectionBody(draft) {
  const handlers = (draft.handlers || []).filter((handler) => handler && handler.event);
  if (draft.derived && !draft.script) {
    const operand = (o) => {
      if (operandSource(o) !== 'projection-read') return o;
      const cleaned = { projection: o.projection, arguments: {} };
      for (const [key, value] of Object.entries(o.arguments || {})) {
        if (value !== undefined && value !== '') cleaned.arguments[key] = value;
      }
      return cleaned;
    };
    const derived = {
      leftHandSide: operand(draft.derived.leftHandSide),
      predicate: draft.derived.predicate,
      rightHandSide: operand(draft.derived.rightHandSide),
    };
    if (draft.derived.negate) derived.negate = true;
    return {
      parameters: (draft.parameters || [])
        .filter((p) => p && p.name)
        .map((p) => ({ name: toCamel(p.name), propertyType: p.propertyType })),
      // The one thing a predicate can yield. Stated here rather than
      // trusted from the draft, so a body that left derived mode
      // half-way can never store another type against it.
      valueType: 'boolean',
      isList: false,
      derived,
    };
  }
  if (draft.script) {
    const script = { initialState: draft.script.initialState };
    if (draft.script.exposes) script.exposes = draft.script.exposes;
    script.arguments = (draft.script.arguments || [])
      .filter((a) => a && a.name)
      .map((a) => ({ name: toCamel(a.name), propertyType: a.propertyType }));
    script.tagFilter = (draft.script.tagFilter || []).map((t) => String(t).trim()).filter(Boolean);
    return {
      valueType: draft.valueType,
      isList: !!draft.isList,
      script,
      handlers: handlers.map((handler) => ({ event: handler.event, code: handler.code || 'state' })),
    };
  }
  return {
    parameters: (draft.parameters || [])
      .filter((p) => p && p.name)
      .map((p) => ({ name: toCamel(p.name), propertyType: p.propertyType })),
    valueType: draft.valueType,
    isList: !!draft.isList,
    initialValue: draft.initialValue === undefined ? null : draft.initialValue,
    // A handler that has an event but no value yet is a row still
    // being filled in, not a handler — the same reading an unnamed
    // field row gets. It stays in the draft, on screen, and reaches
    // the stored definition when its value does. This matters since
    // definitions save themselves: every intermediate state passes
    // through here, including the one between picking the event and
    // picking the value.
    handlers: handlers
      .filter((handler) => draftOperand(handler, 'value') !== undefined)
      .map((handler) => ({
        event: handler.event,
        operation: handler.operation,
        value: draftOperand(handler, 'value'),
      })),
  };
}

// A brand-new projection's draft. `entityName` makes it an entity
// property's: partitioned by that entity's identifier, which is the
// one thing that makes it bindable as one.
function blankProjectionDraft(model, entityName) {
  const valueType = projectionTypeOptions(model)[0] ? projectionTypeOptions(model)[0][0] : 'string';
  const draft = { valueType, isList: false, parameters: [], handlers: [] };
  draft.initialValue = defaultInitialValue(model, draft);
  if (entityName) {
    draft.parameters = [{
      name: defaultAlias(entityName) + 'Id',
      propertyType: idTypeOf(model, entityName),
    }];
  }
  return draft;
}

// What the parameter at this position is called in the stored
// definition — null while a projection is still being described, and
// null for a parameter added to the draft but not yet saved.
function savedParameterName(model, draft, index) {
  if (!state.projDraft || state.projDraft.body !== draft) return null;
  const stored = model['projection-definitions'][state.projDraft.name];
  const parameter = stored && (stored.parameters || [])[index];
  return parameter ? parameter.name : null;
}

// The arguments a derived operand starts with when its projection is
// picked: each slot filled from this projection's own parameters, by
// name first and by type second — the ordinary case is one shared
// identifier, and this makes it zero extra gestures.
function autoDerivedArguments(model, draft, targetName) {
  const target = model['projection-definitions'][targetName] || {};
  const script = scriptOf(target);
  const slots = script ? (script.arguments || []) : (target.parameters || []);
  const own = (draft.parameters || []).filter((p) => p && p.name);
  const args = {};
  for (const slot of slots) {
    const match = own.find((p) => p.name === slot.name)
      || own.find((p) => p.propertyType === slot.propertyType);
    if (match) args[slot.name] = { parameterName: match.name };
  }
  return args;
}

// One side of a derived predicate: another projection — read at the
// partition this projection's own parameters name — or, on the right,
// a typed value to compare against. Enum members are offered exactly
// when the other side reads an enum-typed projection, the same rule
// the rule editor follows.
function derivedSideEditor(model, draft, side, { allowLiteral } = {}) {
  const derived = draft.derived;
  const current = derived[side];
  const isRead = operandSource(current) === 'projection-read';
  const own = (draft.parameters || []).filter((p) => p && p.name);
  const options = Object.keys(model['projection-definitions'])
    .filter((name) => !(state.projDraft && state.projDraft.name === name))
    .sort()
    .map((name) => [name, readable(name)]);
  if (allowLiteral) options.push([LITERAL, 'a typed value…']);
  const chosen = isRead ? (current.projection || '') : (current === undefined ? '' : LITERAL);

  const nodes = [pick(options, chosen, (v) => {
    if (v === LITERAL) derived[side] = '';
    else derived[side] = { projection: v, arguments: autoDerivedArguments(model, draft, v) };
    render();
  }, '— which projection? —')];

  if (isRead && current.projection) {
    const target = model['projection-definitions'][current.projection] || {};
    const script = scriptOf(target);
    const slots = script ? (script.arguments || []) : (target.parameters || []);
    for (const slot of slots) {
      const held = (current.arguments || {})[slot.name];
      nodes.push(
        h('span', { class: 'muted tiny' }, `· its ${propertyWords(slot.name)} =`),
        pick(own.map((p) => [JSON.stringify({ parameterName: p.name }), propertyWords(p.name)]),
          operandSource(held) === 'parameter' ? JSON.stringify({ parameterName: held.parameterName }) : '',
          (v) => {
            current.arguments = { ...(current.arguments || {}), [slot.name]: JSON.parse(v) };
            render();
          }, '— which? —'));
    }
  }

  if (!isRead && chosen === LITERAL) {
    const other = derived[side === 'leftHandSide' ? 'rightHandSide' : 'leftHandSide'];
    const otherTarget = operandSource(other) === 'projection-read' && other.projection
      ? model['projection-definitions'][other.projection] : null;
    const members = otherTarget ? enumMembersFor(model, otherTarget.valueType) : null;
    if (members) {
      nodes.push(pick(members.map((m) => [m, readable(m)]),
        operandSource(current) === 'enum-member' ? current.enumMember : '',
        (v) => { derived[side] = { enumMember: v }; render(); }, '— which one? —'));
    } else {
      nodes.push(h('input', {
        type: 'text', style: 'width:140px',
        value: current === undefined || current === null || typeof current === 'object'
          ? '' : String(current),
        placeholder: 'a value',
        onblur: (e) => {
          const text = e.target.value.trim();
          if (/^-?\d+(\.\d+)?$/.test(text)) derived[side] = Number(text);
          else if (/^(true|false)$/i.test(text)) derived[side] = /^true$/i.test(text);
          else derived[side] = text;
        },
        onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
      }));
    }
  }
  return nodes;
}

// The fields of a projection, wherever one is edited: this page, and
// an entity's own page for the ones bound as its properties. `draft`
// is mutated in place and only reaches the model on Save.
//
// `entityName` says the draft is an entity property's. The partition
// is then not a choice — it is that entity's identifier, and the
// binding supplies it — so the parameter editor gives way to one line
// saying so. Everything else is identical, which is the point: there
// is no second kind of thing here to edit differently.
function projectionFields(model, draft, { entityName } = {}) {
  const eventNames = Object.keys(model['event-definitions']).sort();
  const partitionOptions = partitionTypeOptions(model);
  const enumType = isStringEnumType(model, draft.valueType) ? draft.valueType : null;

  const heldRow = h('div', { class: 'row' },
    h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'it holds'),
    pick(projectionTypeOptions(model, { scripted: !!draft.script }), draft.valueType, (v) => {
      draft.valueType = v;
      // Everything scoped by the type goes with it: the operand picker
      // is built from it, and a value of the old type is not a value
      // of the new one.
      for (const handler of draft.handlers || []) { handler.value = ''; handler.valueText = ''; }
      if (!draft.script) draft.initialValue = defaultInitialValue(model, draft);
      render();
    }, '— which type? —'),
    h('label', { class: 'tiny muted' }, h('input', {
      type: 'checkbox', checked: !!draft.isList,
      onchange: (e) => {
        draft.isList = e.target.checked;
        // A list and a single value do not start from the same shape,
        // and the operations that advance them differ, so both are
        // reset rather than left describing the arity it just left.
        if (!draft.script) {
          draft.initialValue = defaultInitialValue(model, draft);
          const allowed = operationsFor(model, draft);
          for (const handler of draft.handlers || []) {
            if (!allowed.includes(handler.operation)) handler.operation = 'set';
          }
        }
        render();
      },
    }), ' many'));

  const enumRow = enumType
    ? h('div', { class: 'use' }, h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(model, enumType))
    : null;

  // ---- the partition ----

  const parameterRows = (draft.parameters || []).map((parameter, i) => {
    // A parameter's name is edited in the draft like everything else
    // here, but a *saved* projection's parameter is a name bindings
    // supply by key — so renaming one has to rewrite them, and that
    // goes through `renameMember` rather than the draft. `saved` is
    // the name it currently has in the stored definition, or null
    // while the projection is still being described.
    const saved = savedParameterName(model, draft, i);
    return h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: parameter.name || '', placeholder: 'parameter name',
        oninput: (e) => { parameter.name = e.target.value; },
      }),
      // Shown whenever the parameter is already stored, not only once
      // the text differs — the input does not repaint as it is typed,
      // so a button conditional on the typed value would never appear.
      saved ? h('button', {
        class: 'btn tiny', title: 'Rename it, rewriting every binding that supplies it',
        onclick: () => {
          if (toCamel(parameter.name) === saved) return;
          run(() => {
            renameMember('projection-definition', model.id, state.projDraft.name,
              'parameter', saved, toCamel(parameter.name));
            state.projDraft = null;
          });
        },
      }, 'Rename') : null,
      h('span', { class: 'muted tiny' }, 'identifying a'),
      pick(partitionOptions, parameter.propertyType,
        (v) => { parameter.propertyType = v; render(); }, '— which thing? —'),
      h('button', {
        class: 'btn tiny danger',
        onclick: () => { draft.parameters.splice(i, 1); render(); },
      }, '×'));
  });

  const partitionBlock = entityName
    ? h('div', { class: 'row', style: 'margin-top:8px' },
        h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'kept for'),
        h('span', { class: 'chip entity' },
          h('i', { class: 'ic' }, entityIcon(model, entityName)), 'each ' + readable(entityName)),
        h('span', { class: 'muted tiny' },
          'the binding supplies which one — that is all being a property means'))
    : h('div', { style: 'margin-top:8px' },
        h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
          'kept separately for each — these become the tags of its query, so nothing but an '
          + 'identifier can appear here:'),
        parameterRows.length
          ? parameterRows
          : h('div', { class: 'empty' }, 'Nothing — one value for the whole system, and a query with no tag.'),
        partitionOptions.length
          ? h('div', { class: 'adder' }, h('button', {
              class: 'btn ghost tiny',
              onclick: () => {
                (draft.parameters = draft.parameters || []).push({ name: '', propertyType: partitionOptions[0][0] });
                render();
              },
            }, '+ kept separately for each'))
          : null);

  // ---- what moves it ----

  // One handler per event type is law, so an event another row already
  // claims is simply not offered — the row's own event stays, or the
  // picker could not show its current choice.
  // Nor one that carries nothing it is kept separately by — it would
  // reach no instance (`partitionTagsMissing`). A row's own event stays
  // even then, for the same reason; the advisory says what is wrong.
  const eventChoicesFor = (handler) =>
    unhandledEventChoices(eventNames, draft.handlers, handler)
      .filter((n) => n === handler.event || !partitionTagsMissing(model, draft, n).length)
      .map((n) => [n, readable(n), eventIcon(model, n)]);

  const declaredHandlerRows = (draft.handlers || []).map((handler, i) => {
    const event = model['event-definitions'][handler.event];
    const operations = operationsFor(model, draft);
    if (!operations.includes(handler.operation)) handler.operation = operations[0];
    const values = handlerValueChoices(model, draft, event, handler.operation);
    const enumMembers = enumMembersFor(model, draft.valueType);
    // A value the row can no longer offer — a successor once the verb
    // is no longer `set`, a stored `currentValue` — would leave the
    // picker showing one thing and the draft saving another, so it
    // resets to the first offer, as the change adder's does.
    if (event && handler.value && handler.value !== LITERAL
      && !values.some(([v]) => v === handler.value)) {
      handler.value = values.length ? values[0][0] : (enumMembers ? '' : LITERAL);
    }
    return h('div', { class: 'adder' },
      pick(eventChoicesFor(handler), handler.event,
        (v) => { handler.event = v; handler.value = ''; handler.valueText = ''; render(); },
        '— which event? —'),
      operationControl(operations, handler),
      ...(event
        ? operandPicker(values, handler, 'value', { allowLiteral: !enumMembers })
        : [pick([], '', () => {}, '— pick an event first —')]),
      h('button', {
        class: 'btn tiny danger',
        onclick: () => { draft.handlers.splice(i, 1); render(); },
      }, '×'));
  });

  const scriptedHandlerRows = !draft.script ? [] : (draft.handlers || []).map((handler, i) => h('div', { class: 'script-handler' },
    h('div', { class: 'tiny' },
      pick(eventChoicesFor(handler), handler.event,
        (v) => { handler.event = v; render(); }, '— which event? —'),
      h('button', {
        class: 'btn tiny danger', title: 'Stop handling this event',
        onclick: () => { draft.handlers.splice(i, 1); render(); },
      }, '×')),
    scriptCodeEditor(scriptEditorKey(draft, i), {
      code: handler.code || '',
      preamble: scriptHandlerPreamble(model, draft, handler),
      onCode: (code) => { handler.code = code; },
    })));

  const movedBlock = h('div', { style: 'margin-top:8px' },
    h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
      'and it moves when one of these is recorded:'),
    (draft.handlers || []).length
      ? (draft.script ? scriptedHandlerRows : declaredHandlerRows)
      : h('div', { class: 'empty' }, 'Nothing moves it — it reads its first value forever.'),
    h('div', { class: 'adder' }, h('button', {
      class: 'btn ghost tiny',
      onclick: () => {
        (draft.handlers = draft.handlers || []).push(draft.script
          ? { event: '', code: 'state' }
          : { event: '', operation: 'set', value: '' });
        render();
      },
    }, '+ event that moves it')));

  // ---- where it starts ----

  const startsBlock = draft.script
    ? h('div', { class: 'row' },
        h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'starting at'),
        h('input', {
          type: 'text', class: 'mono', style: 'width:200px',
          value: JSON.stringify(draft.script.initialState),
          title: 'Any JSON — a scripted state is not typed, because nothing outside the code reads it whole',
          onblur: (e) => {
            let parsed;
            try { parsed = JSON.parse(e.target.value); }
            catch { return toast('That starting state is not valid JSON.', true); }
            draft.script.initialState = parsed;
            render();
          },
          onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
        }),
        h('span', { class: 'muted tiny' }, 'any JSON — the code is what reads it'))
    : h('div', {},
        h('div', { class: 'row' },
          h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'starting at'),
          h('span', { class: 'muted tiny' },
            'before anything has happened. For a numbering this is the first value issued, and '
            + 'the only place a prefix is stated.')),
        h('div', { style: 'margin-left:90px' }, ...initialValueEditor(model, draft)));

  // ---- the escape hatch ----

  const scriptBlock = draft.script ? h('div', { style: 'margin-top:8px' },
    h('div', { class: 'tiny muted' },
      'Scripted. Each handler is a body of code over ',
      h('code', {}, 'state'), ', ', h('code', {}, 'event'), ' and ', h('code', {}, 'args'),
      ', returning the next state. Nothing here runs or checks it.'),
    h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'reads as'),
      h('input', {
        type: 'text', style: 'width:150px', value: draft.script.exposes || '',
        placeholder: 'the state itself',
        title: 'Which field of the state a condition reads, when the state is a record',
        onblur: (e) => {
          const text = toCamel(e.target.value);
          if (text) draft.script.exposes = text; else delete draft.script.exposes;
          render();
        },
      }),
      h('span', { class: 'muted tiny' }, 'one field of the state, when the state is a record')),
    ...scriptArgumentRows(model, draft, entityName),
    ...tagFilterRows(model, draft, entityName)) : null;

  // ---- derived: one predicate over other projections ----

  const derivedHeldRow = h('div', { class: 'row' },
    h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'it holds'),
    h('span', { class: 'chip' }, 'yes / no'),
    h('span', { class: 'muted tiny' },
      'its predicate\'s outcome — a derived projection holds nothing else, and nothing moves it'));

  const derivedBlock = !draft.derived ? null : h('div', { style: 'margin-top:8px' },
    h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
      'worked out from other projections, read at this same partition — their queries are its '
      + 'query, so binding it guards the append exactly as reading them would:'),
    h('div', { class: 'adder' }, ...derivedSideEditor(model, draft, 'leftHandSide', {})),
    h('div', { class: 'adder' },
      h('label', { class: 'tiny muted' }, h('input', {
        type: 'checkbox', checked: !!draft.derived.negate,
        onchange: (e) => {
          if (e.target.checked) draft.derived.negate = true;
          else delete draft.derived.negate;
        },
      }), ' not'),
      pick(DERIVED_PREDICATES.map((p) => [p, readable(p).toLowerCase()]),
        draft.derived.predicate,
        (v) => { draft.derived.predicate = v; render(); })),
    h('div', { class: 'adder' }, ...derivedSideEditor(model, draft, 'rightHandSide', { allowLiteral: true })));

  const derivedToggle = advanced() ? h('div', { class: 'adder', style: 'margin-top:8px' },
    h('label', { class: 'tiny muted' }, h('input', {
      type: 'checkbox', checked: !!draft.derived,
      title: 'Replace the handlers with one predicate over other projections — logic stated once, as data',
      onchange: (e) => {
        if (e.target.checked) {
          if (draft.script) {
            delete draft.script;
            draft.parameters = entityName
              ? [{ name: defaultAlias(entityName) + 'Id', propertyType: idTypeOf(model, entityName) }]
              : (draft.parameters || []);
          }
          delete draft.initialValue;
          draft.handlers = [];
          draft.valueType = 'boolean';
          draft.isList = false;
          draft.derived = {
            leftHandSide: { projection: '', arguments: {} },
            predicate: 'equals',
            rightHandSide: { projection: '', arguments: {} },
          };
          toast('Now derived — one yes/no worked out from other projections. The handlers are gone.');
        } else {
          delete draft.derived;
          draft.initialValue = defaultInitialValue(model, draft);
          draft.handlers = [];
          toast('Declared again — pick what moves it.');
        }
        render();
      },
    }), ' derived from other projections')) : null;

  const scriptToggle = advanced() ? h('div', { class: 'adder', style: 'margin-top:8px' },
    h('label', { class: 'tiny muted' }, h('input', {
      type: 'checkbox', checked: !!draft.script,
      title: 'Replace the declared handlers with code, for state no operation here can express',
      onchange: (e) => {
        if (e.target.checked) {
          delete draft.derived;
          const initialState = draft.initialValue === undefined ? null : draft.initialValue;
          draft.script = {
            initialState,
            arguments: entityName
              ? [{ name: defaultAlias(entityName) + 'Id', propertyType: idTypeOf(model, entityName) }]
              : [],
            tagFilter: entityName
              ? [`${idTypeOf(model, entityName)}:{${defaultAlias(entityName)}Id}`]
              : [],
          };
          delete draft.initialValue;
          draft.parameters = [];
          draft.handlers = (draft.handlers || []).map((handler) => ({
            event: handler.event, code: 'state',
          }));
          toast('Now scripted — the declared operations are gone, the events they named are kept.');
        } else {
          // A record is a value only code can advance — going declared
          // with one held would store a projection the advisories flag
          // on arrival, so the gesture asks for the re-typing first.
          const cls = classifyType(model, draft.valueType);
          if (cls.kind === 'value' && cls.composite) {
            e.target.checked = true;
            return toast(`It holds ${readable(draft.valueType)}, a record — only code can advance one. Pick a single-value type first.`, true);
          }
          draft.initialValue = defaultInitialValue(model, draft);
          draft.parameters = entityName
            ? [{ name: defaultAlias(entityName) + 'Id', propertyType: idTypeOf(model, entityName) }]
            : [];
          delete draft.script;
          draft.handlers = (draft.handlers || []).map((handler) => ({
            event: handler.event, operation: 'set', value: '',
          }));
          toast('Declared again — the code is gone, the events it handled are kept.');
        }
        render();
      },
    }), ' worked out by code')) : null;

  return [
    draft.derived ? derivedHeldRow : heldRow,
    draft.derived ? null : enumRow,
    draft.derived ? null : startsBlock,
    partitionBlock,
    draft.derived ? derivedBlock : movedBlock,
    scriptBlock,
    derivedToggle,
    scriptToggle,
    advanced() ? projectionDcbPreview(model, draft, entityName) : null,
  ];
}

// A scripted projection's arguments: values its reader supplies, which
// reach the code rather than the query. The one typed with the owning
// entity's identifier is what a property binding fills in, so it is
// shown as fixed rather than offered for removal.
function scriptArgumentRows(model, draft, entityName) {
  const idType = entityName ? idTypeOf(model, entityName) : null;
  const args = draft.script.arguments || [];
  const rows = args.map((argument, i) => {
    const bound = idType && argument.propertyType === idType;
    return h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: argument.name || '', placeholder: 'argument name',
        oninput: (e) => { argument.name = e.target.value; },
      }),
      h('span', { class: 'muted tiny' }, 'a'),
      pick(typeOptions(model), argument.propertyType,
        (v) => { argument.propertyType = v; render(); }),
      bound
        ? h('span', { class: 'muted tiny' }, '— the instance, supplied by the binding')
        : h('button', {
            class: 'btn tiny danger',
            onclick: () => { draft.script.arguments.splice(i, 1); render(); },
          }, '×'));
  });
  return [h('div', { style: 'margin-top:6px' },
    h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
      'it asks whoever reads it for:'),
    rows.length ? rows : h('div', { class: 'muted tiny' }, 'nothing'),
    h('div', { class: 'adder' }, h('button', {
      class: 'btn ghost tiny',
      onclick: () => {
        (draft.script.arguments = args).push({ name: '', propertyType: 'string' });
        render();
      },
    }, '+ ask for a value')))];
}

// A scripted projection's tag filter — the one thing the escape hatch
// is not allowed to hide, since it is what the query reads. Written as
// `TagType:value`, where the value may interpolate an argument.
function tagFilterRows(model, draft, entityName) {
  const filters = draft.script.tagFilter || [];
  const rows = filters.map((template, i) => h('div', { class: 'adder' },
    h('input', {
      type: 'text', class: 'mono', style: 'width:260px', value: template,
      placeholder: '{type}:{value}',
      onblur: (e) => { draft.script.tagFilter[i] = e.target.value; render(); },
      onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
    }),
    h('button', {
      class: 'btn tiny danger',
      onclick: () => { draft.script.tagFilter.splice(i, 1); render(); },
    }, '×')));
  return [h('div', { style: 'margin-top:6px' },
    h('div', { class: 'muted tiny', style: 'margin-bottom:4px' },
      'and it reads the events tagged:'),
    rows.length
      ? rows
      : h('div', { class: 'muted tiny' },
          entityName
            ? 'Nothing — which would fold the same events for every instance.'
            : 'Nothing — the whole log, the same thing declaring no parameters means.'),
    h('div', { class: 'adder' }, h('button', {
      class: 'btn ghost tiny',
      onclick: () => {
        (draft.script.tagFilter = filters).push('');
        render();
      },
    }, '+ a tag it reads')))];
}

// The DCB this projection derives, as the query it really runs.
function projectionDcbPreview(model, draft, entityName) {
  const parameters = entityName && !draft.script
    ? [{ name: defaultAlias(entityName) + 'Id', propertyType: idTypeOf(model, entityName) }]
    : (draft.parameters || []);
  // A derived draft's query is its operands': their tags with this
  // draft's own parameter names showing where the value flows in, and
  // their handled events — recursively, exactly as the fold reads.
  const derivedReads = draft.derived
    ? derivedOperands(draft.derived)
      .filter((o) => operandSource(o) === 'projection-read' && o.projection)
    : [];
  const tags = draft.derived
    ? uniq(derivedReads.flatMap((o) => projectionReadTags(model, o.projection, o.arguments || {})))
    : draft.script
    ? (draft.script.tagFilter || []).filter(Boolean)
    // A parameter's own type may be a composite identifier, which has
    // no tag of its own — its *leaves* each do — so this walks them
    // and renders each through its own identifier's tagSchema, exactly
    // as the query really will.
    : parameters.flatMap((p) =>
        idLeavesOfType(model, p.propertyType).map((leaf) => {
          const identifierType = identifierTypeOf(model, leaf.identifierType);
          const placeholder = `<${p.name || '?'}${leaf.field ? '.' + leaf.field : ''}>`;
          return identifierType ? renderTag(identifierType, placeholder)
            : `${leaf.identifierType}:${placeholder}`;
        }));
  const handledTypes = draft.derived
    ? uniq(derivedReads.flatMap((o) => projectionHandledTypes(model, o.projection)))
    : (draft.handlers || []).map((handler) => handler.event).filter(Boolean);
  return h('div', { class: 'row dcb', style: 'margin-top:8px' },
    h('span', { class: 'k' }, 'query'),
    queryPopover('projdraft',
      'what this projection queries',
      h('div', {}, h('span', { class: 'k' }, 'query  '),
        h('span', { class: 't' }, tags.join(' and ')),
        tags.length ? h('span', { class: 'k' }, ' and ') : null,
        h('span', { class: 'y' }, handledTypes.join(', ') || '(nothing)')),
      h('div', {}, h('span', { class: 'k' }, 'guard  '),
        h('span', { class: 'k' }, tags.length
          ? 'readers of the same partition are serialised against each other'
          : 'no tag — every reader is serialised against every other'))));
}

function renderProjections(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'row' },
      h('div', { class: 'name' }, 'Projections'),
      h('span', { class: 'grow' }),
      state.newProjection ? null : h('button', {
        class: 'btn tiny',
        onclick: () => {
          closeForms();
          state.newProjection = { name: '', body: blankProjectionDraft(model) };
          render();
        },
      }, '+ new projection'))));

  const projectionAdvisories = advisoryBanner(model, 'projection-definition');
  if (projectionAdvisories) main.appendChild(projectionAdvisories);

  // Only the ones no entity binds. A projection an entity calls
  // something is that entity's property and is edited on its page, in
  // this very component — listing it twice would be the one thing this
  // page exists to stop being: two renderings of one thing.
  const names = Object.keys(model['projection-definitions']).sort();
  const free = names.filter((name) => !boundAs(model, name).length);

  main.appendChild(projectionLedger(model, {
    owner: null,
    nameHead: 'projection',
    entries: free.map((name) => ({ projection: name, label: readable(name) })),
    add: null,
  }));

  if (state.newProjection) {
    const draft = state.newProjection;
    const card = h('div', { class: 'ecard', style: 'margin-top:10px' });
    card.appendChild(h('div', { class: 'q', style: 'font-size:11px;color:var(--muted);margin-bottom:6px' },
      'What is this projection of?'));
    card.appendChild(h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, placeholder: 'projection name',
        oninput: (e) => { draft.name = e.target.value; },
      })));
    card.appendChild(h('div', { class: 'card projection' }, ...projectionFields(model, draft.body)));
    card.appendChild(h('div', { class: 'adder', style: 'margin-top:10px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const projectionName = toPascal(draft.name);
          if (!projectionName) return toast('Give the projection a name.', true);
          run(() => {
            addDefinition('projection-definition', model.id, projectionName,
              cleanProjectionBody(draft.body));
            state.newProjection = null;
          });
        },
      }, 'Create'),
      h('button', { class: 'btn ghost', onclick: () => { state.newProjection = null; render(); } }, 'Cancel')));
    main.appendChild(card);
  }

  // Everything the entity pages own. Not a second ledger — names, and a
  // way to each: with the list above holding only what nothing binds,
  // this is the only place left that says what else there is.
  const owned = Object.keys(model['entity-definitions']).sort()
    .map((entity) => ({ entity, properties: model['entity-definitions'][entity].properties || [] }))
    .filter((e) => e.properties.length);
  if (owned.length) {
    const index = h('section', { class: 'index' },
      h('h4', {}, 'Also defined, on their entities'),
      h('div', { class: 'why' },
        'Bound to an entity, so edited on its page — the same rows, one column fewer.'));
    for (const { entity, properties } of owned) {
      index.appendChild(h('div', { class: 'index-row' },
        h('span', {
          class: 'ent', title: 'Open ' + readable(entity),
          onclick: () => openEntity(entity),
        }, h('i', { class: 'ic' }, entityIcon(model, entity)), readable(entity)),
        h('span', { class: 'props' }, ...properties.map((binding) => h('button', {
          class: 'lnk', title: 'Open it on ' + readable(entity),
          onclick: () => goToProjection(binding.projection),
        }, propertyWords(binding.name))))));
    }
    main.appendChild(index);
  }
}

// ---------- events ----------
//
// The one place every event definition lives, recorded or not. A
// command's publish list only ever showed the events *it* records, and
// an event nothing records yet had nowhere to be shown at all — this
// page is both of those, for every event, at once. Shape — name, mark,
// fields — is owned here; a command's own page keeps only how *it*
// maps its own values into an already-declared field
// (see `eventFields`).
function renderEvents(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Events'),
    h('div', { class: 'muted small' },
      'Everything that has ever happened, named and shaped. An event may be recorded by no '
      + 'command, one, or several — and read by no projection, one, or several — which is why it '
      + 'has a page of its own rather than living on any one of theirs.')));

  const eventAdvisories = advisoryBanner(model, 'event-definition');
  if (eventAdvisories) main.appendChild(eventAdvisories);

  const names = Object.keys(model['event-definitions']).sort();
  if (!names.length && !state.newEvent) {
    main.appendChild(h('div', { class: 'empty' }, 'No events yet.'));
  }

  for (const name of names) main.appendChild(eventCard(model, name));

  if (state.newEvent) {
    const draft = state.newEvent;
    const card = h('div', { class: 'ecard' });
    card.appendChild(h('div', { class: 'q', style: 'font-size:11px;color:var(--muted);margin-bottom:6px' },
      'What happened?  (past tense)'));
    card.appendChild(h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, placeholder: 'event name',
        oninput: (e) => { draft.name = e.target.value; },
      })));
    card.appendChild(h('div', { class: 'adder', style: 'margin-top:10px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const eventName = toPascal(draft.name);
          if (!eventName) return toast('Give the event a name.', true);
          run(() => {
            addDefinition('event-definition', model.id, eventName, { properties: [] });
            state.newEvent = null;
            state.openEvent = eventName;
          });
        },
      }, 'Create'),
      h('button', { class: 'btn ghost', onclick: () => { state.newEvent = null; render(); } }, 'Cancel')));
    main.appendChild(card);
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        title: 'An event does not need a command yet — record it later from any command’s '
          + '"record something already known".',
        onclick: () => { closeForms(); state.newEvent = { name: '' }; render(); },
      }, '+ New event')));
  }
}

function eventCard(model, name) {
  const event = model['event-definitions'][name];
  const open = state.openEvent === name;
  const publishers = publishersOf(model, name);
  const subscribers = [...effectsOf(model, name), ...projectionsHandling(model, name)];
  const scenarios = scenariosReferencingEvent(model, name);
  const card = h('div', { class: 'ecard' });

  // Renaming rewrites every entity handler, every projection handler,
  // every command's `publishes` and every scenario that names it, all
  // in the same append.
  if (state.renamingEvent === name) {
    card.appendChild(renameDefinitionForm(model, 'event-definition', name, {
      stateKey: 'renamingEvent',
      warn: () => warnScripted(model, name),
      after: (next) => { if (state.openEvent === name) state.openEvent = next; },
    }));
    return card;
  }

  const pickingIcon = state.eventIconPicker === name;
  card.appendChild(qrow('div', { cls: 'ehead', key: 'event:' + name },
    h('button', {
      class: 'icon-btn event', title: 'Choose the mark this is shown with',
      onclick: () => {
        const wasOpen = pickingIcon;
        closeForms();
        state.eventIconPicker = wasOpen ? null : name;
        render();
      },
    }, eventIcon(model, name)),
    h('span', { class: 'chip event' }, readable(name)),
    h('span', { class: 'muted tiny' },
      (event.properties || []).length + ' field' + ((event.properties || []).length === 1 ? '' : 's')),
    h('span', { class: 'muted tiny' }, publishers.length ? 'recorded by '
      + publishers.map((p) => readable(p.command)).join(', ') : 'recorded by nothing yet'),
    h('span', { style: 'flex:1' }),
    reveal(
      advanced() ? h('span', { class: 'tech' }, name) : null,
      h('button', {
        class: 'btn tiny',
        onclick: () => { state.openEvent = open ? null : name; render(); },
      }, open ? 'Hide details' : 'Details'),
      h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.renamingEvent = name; render(); },
      }, 'Rename'),
      removeButton('event:' + name, {
        label: 'Remove', title: 'Remove this event',
        onRemove: () => run(() => removeDefinition('event-definition', model.id, name)),
      }))));

  if (pickingIcon) card.appendChild(eventIconPicker(model, name, event));

  if (open) {
    card.appendChild(h('div', { class: 'card event' },
      eventFieldsEditor(model, name, event),
      h('div', { class: 'refs', style: 'margin-top:12px' },
        h('div', { class: 'muted tiny' }, 'Recorded by'),
        publishers.length
          ? h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
              publishers.map((p) => commandRef(model, p.command)))
          : h('div', { class: 'empty tiny' }, 'no command records this yet')),
      h('div', { class: 'refs', style: 'margin-top:10px' },
        h('div', { class: 'muted tiny' }, 'Handled by'),
        subscribers.length
          ? h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
              subscribers.map((s) => s.entity
                ? entityRef(model, s.entity, { text: readable(s.entity) + ' · ' + propertyWords(s.property.name) })
                : projectionRef(model, s.projection)))
          : h('div', { class: 'empty tiny' }, 'nothing reads this yet')),
      scenarios.length ? h('div', { class: 'refs', style: 'margin-top:10px' },
        h('div', { class: 'muted tiny' }, 'Referenced by'),
        h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
          scenarios.map((s) => h('span', {
            class: 'chip linkable', title: 'Open this scenario',
            onclick: () => (s.overProjections ? goToProjectionScenario(model, s.key) : goToScenario(model, s.key)),
          }, s.overProjections ? projectionScenarioName(s.body) : scenarioName(s.body, readable))))) : null));
  }

  return card;
}

// ---------- overview ----------
//
// The page a model opens on: what it holds, counted, and every command
// on one row — what it reads, how many rules guard it, what it appends.
// Read-only on purpose. A command's stored name and payload are not
// columns; they ride in the row's tooltip, because the question this
// page answers is what the model does, not how a call is spelled.
function renderOverview(model, main) {
  main.appendChild(h('header', {}, h('div', { class: 'name' }, 'Overview')));

  const commands = model['command-definitions'];
  const bodies = Object.values(commands);
  const sum = (xs) => xs.reduce((a, b) => a + b, 0);
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
  const ruleCount = sum(bodies.map((b) => (b.conditions || []).length));
  const appended = new Set(bodies.flatMap((b) => (b.publishes || []).map((p) => p && p.name)));
  const events = Object.keys(model['event-definitions']);
  const unappended = events.filter((e) => !appended.has(e)).length;
  const entities = Object.values(model['entity-definitions']);
  const lifecycles = entities.filter((e) => e.lifecycle).length;
  const standalone = Object.keys(model['projection-definitions'])
    .filter((p) => !boundAs(model, p).length).length;
  const types = Object.keys(model['custom-type-definitions']).length;
  const scenarios = Object.keys(model['scenario-definitions'] || {}).length
    + Object.keys(model['projection-scenario-definitions'] || {}).length;
  const trouble = scenarioTrouble(model).length;
  const found = problems(model);

  const stat = (label, kind, count, sub, onclick) => h(onclick ? 'button' : 'div', {
    class: 'overview-stat' + (kind ? ' kind' : ''), style: kind ? '--kind: var(--' + kind + ')' : null,
    type: onclick ? 'button' : null, onclick,
  }, h('span', { class: 'label' }, label),
    h('span', { class: 'count' }, String(count)),
    sub ? h('span', { class: 'sub' }, sub) : null);

  // The same mode rule the rail follows: what Simple keeps out of the
  // rail it keeps out of the count, unless the model already has one.
  main.appendChild(h('div', { class: 'overview-stats' },
    stat('Commands', 'command', bodies.length, plural(ruleCount, 'rule')),
    stat('Events', 'event', events.length, unappended ? unappended + ' not appended' : null),
    stat('Entities', 'entity', entities.length, lifecycles ? lifecycles + ' with a lifecycle' : null),
    advanced() || standalone ? stat('Projections', 'projection', standalone, 'standalone') : null,
    advanced() ? stat('Custom types', 'type', types) : null,
    stat('Scenarios', null, scenarios, trouble ? trouble + ' not current' : null),
    stat('Problems', null, found.length, null,
      found.length ? () => { closeForms(); state.problems = true; render(); } : null)));

  main.appendChild(h('div', { class: 'overview-section' },
    h('h2', {}, 'Commands'), h('span', { class: 'muted small' }, 'by feature')));

  const table = h('div', { class: 'overview-commands' },
    h('div', { class: 'overview-row head' },
      h('span', {}, 'Command'), h('span', {}, 'Reads'), h('span', {}, 'Rules'), h('span', {}, 'Appends')));

  for (const group of featureGroups(model).filter((g) => g.commands.length)) {
    table.appendChild(h('div', { class: 'overview-feature' }, group.name));
    for (const name of group.commands) {
      const body = commands[name];
      const payload = body.properties || [];
      const tip = [name, ...payload.map((p) => p.name + ': ' + typeLabel(p))].join('\n');

      // A read is named after what it reads; the alias is shown only
      // where it says something the name does not — `others`, `theirs`.
      const reads = (body.boundary || []).map((binding) => {
        const target = binding.projection || binding.entity;
        const plain = target ? target[0].toLowerCase() + target.slice(1) : null;
        const text = binding.alias === plain ? undefined
          : [readable(target), h('span', { class: 'tech' }, binding.alias)];
        return binding.projection
          ? projectionRef(model, binding.projection, { text })
          : entityRef(model, binding.entity, { text });
      });

      const rules = (body.conditions || []).length;
      const guards = sum((body.publishes || []).map((p) => (p && p.when ? p.when.length : 0)));
      const ruleWords = [rules ? plural(rules, 'rule') : null, guards ? plural(guards, 'guard') : null]
        .filter(Boolean).join(' · ');

      const emits = (body.publishes || []).filter((p) => p && p.name);

      table.appendChild(h('div', { class: 'overview-row' },
        h('div', {},
          h('a', {
            href: '#', class: 'overview-cmd', title: tip,
            onclick: (e) => { e.preventDefault(); goToCommand(name); },
          }, iconPrefix(commandIcon(model, name)) + readable(name))),
        h('div', { class: 'overview-chips' },
          reads.length ? reads : h('span', { class: 'empty tiny' }, '—')),
        ruleWords
          ? h('span', { class: 'overview-rules' }, ruleWords)
          : h('span', { class: 'empty tiny' }, 'always allowed'),
        h('div', { class: 'overview-chips' },
          emits.length
            ? emits.map((p) => eventRef(model, p.name))
            : h('span', { class: 'empty tiny' }, 'records nothing yet'))));
    }
  }
  main.appendChild(table);
}

// ---------- coupling ----------
//
// Every command against every event type it writes or reads back,
// gathered once into a matrix — the same boundary each command's own
// page derives one at a time (`stepConsistency`), read here across all
// of them at once rather than one command deep.
function renderCoupling(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Coupling'),
    h('div', { class: 'muted small' },
      'Every command against every event type it writes, or reads back to decide — the same '
      + 'boundary each command derives on its own page, laid out as one matrix. A filled mark '
      + 'writes the event; a ringed mark reads it back first.')));

  const matrix = couplingMatrix(model);
  if (!matrix.events.length || !matrix.groups.length) {
    main.appendChild(h('div', { class: 'empty' },
      matrix.events.length ? 'No commands yet.' : 'No events yet.'));
    return;
  }

  const orderMode = state.couplingOrder === 'coupling' ? 'coupling' : 'feature';
  const tab = (key, label) => h('button', {
    class: 'tab' + (orderMode === key ? ' on' : ''),
    'aria-pressed': orderMode === key ? 'true' : 'false',
    onclick: () => { state.couplingOrder = key; render(); },
  }, label);
  main.appendChild(h('div', { class: 'tabs', style: 'margin-bottom:16px' },
    tab('feature', 'By feature'), tab('coupling', 'By coupling')));

  main.appendChild(h('div', { class: 'coupling-legend' },
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark produces' }), 'produces'),
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark consumes' }), 'consumes'),
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark both' }), 'both'),
    orderMode === 'coupling'
      ? h('span', { class: 'coupling-legend-item' },
          h('span', { class: 'chip rule tiny' }, 'bridge'),
          'the one coupling still joining two clusters')
      : null));

  // A lookup from (command, event) to its cell, so either ordering can
  // read the same underlying matrix without recomputing it.
  const cellIndex = {};
  for (const group of matrix.groups) {
    for (const row of group.commands) {
      cellIndex[row.name] = {};
      row.cells.forEach((cell, i) => { cellIndex[row.name][matrix.events[i]] = cell; });
    }
  }

  let orderedEvents;
  let rows; // [{ isGroup, label }] | [{ isCommand, name, isBridge, cells }]
  let isBridgeEvent = () => false;
  let clusterStartsAt = () => false;

  if (orderMode === 'coupling') {
    const clusters = couplingClusters(matrix);
    orderedEvents = clusters.eventOrder;
    isBridgeEvent = clusters.isBridgeEvent;

    const clusterLabel = (rank) => {
      const info = clusters.clusters[rank];
      if (info.commands + info.events === 1) return 'Isolated — coupled to nothing';
      const c = info.commands + ' command' + (info.commands === 1 ? '' : 's');
      const e = info.events + ' event' + (info.events === 1 ? '' : 's');
      return 'Cluster ' + (rank + 1) + ' · ' + c + ', ' + e;
    };
    rows = [];
    let lastRank = null;
    for (const name of clusters.commandOrder) {
      const rank = clusters.clusterOfCommand(name);
      if (rank !== lastRank) { rows.push({ isGroup: true, label: clusterLabel(rank) }); lastRank = rank; }
      rows.push({
        isCommand: true, name, isBridge: clusters.isBridgeCommand(name),
        cells: orderedEvents.map((ev) => cellIndex[name][ev]),
      });
    }
    let lastEventRank = null;
    clusterStartsAt = (i) => {
      const rank = clusters.clusterOfEvent(orderedEvents[i]);
      const isStart = i > 0 && rank !== clusters.clusterOfEvent(orderedEvents[i - 1]);
      return isStart;
    };
    if (clusters.clusters.length > 1) {
      main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:14px' },
        clusters.clusters.length + ' clusters — nothing couples one to another. Splitting the model '
        + 'along those seams would leave each cluster as its own bounded context.'));
    } else {
      main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:14px' },
        'Everything here is one connected cluster — no command or event stands apart from the rest yet.'));
    }
  } else {
    orderedEvents = matrix.events;
    rows = matrix.groups.flatMap((group) => [
      { isGroup: true, label: group.name },
      ...group.commands.map((row) => ({ isCommand: true, name: row.name, isBridge: false, cells: row.cells })),
    ]);
  }

  const colWidth = 104;
  const grid = h('div', {
    class: 'coupling-grid',
    style: `grid-template-columns: 210px repeat(${orderedEvents.length}, ${colWidth}px); `
      + `width: ${210 + orderedEvents.length * colWidth}px`,
  });
  grid.appendChild(h('div', { class: 'coupling-corner' }));
  orderedEvents.forEach((event, i) => {
    const bridge = isBridgeEvent(event);
    // A non-breaking space between the icon and the first word keeps
    // them on the same line — an icon stranded alone on its own line
    // is the one wrapping outcome worth avoiding.
    const label = iconPrefix(eventIcon(model, event), '\u00a0') + readable(event);
    grid.appendChild(h('div', {
      class: 'coupling-colhead' + (clusterStartsAt(i) ? ' cluster-start' : ''),
      title: (bridge ? 'Bridge — removing this splits its cluster in two. ' : '') + 'Open ' + readable(event),
      onclick: () => goToEvent(event),
    }, h('span', { style: bridge ? 'color:var(--rule)' : '' }, label)));
  });

  for (const row of rows) {
    if (row.isGroup) { grid.appendChild(h('div', { class: 'coupling-grouprow' }, row.label)); continue; }
    grid.appendChild(h('div', {
      class: 'coupling-rowlabel', title: 'Open ' + readable(row.name), onclick: () => goToCommand(row.name),
    }, h('span', {}, readable(row.name)),
      row.isBridge ? h('span', {
        class: 'chip rule tiny', style: 'margin-left:7px',
        title: 'Bridge — removing this splits its cluster in two',
      }, 'bridge') : null));
    row.cells.forEach((cell, i) => {
      const markClass = cell.produces && cell.consumes ? 'both'
        : cell.produces ? 'produces' : cell.consumes ? 'consumes' : null;
      const label = iconPrefix(eventIcon(model, cell.event)) + readable(cell.event);
      const tip = !markClass ? null
        : cell.produces && cell.consumes
          ? label + ' — written here, read back via ' + cell.via.join(', ')
          : cell.produces ? label + ' — written here'
            : label + ' — read via ' + cell.via.join(', ');
      grid.appendChild(h('div', {
        class: 'coupling-cell' + (clusterStartsAt(i) ? ' cluster-start' : ''),
        title: tip,
      }, markClass ? h('div', { class: 'coupling-mark ' + markClass }) : null));
    });
  }
  main.appendChild(h('div', { class: 'coupling-scroll' }, grid));
}

// ---------- rule map ----------
//
// Every command, the rules guarding it, and what it records once they
// all hold — the same conditions and emissions from `stepRules` and
// `stepEmits`, read here across every command at once.
function renderRuleMap(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Rule map'),
    h('div', { class: 'muted small' },
      'Every command, the rules guarding it, and what it records once they all hold — the same '
      + 'conditions and emissions from each command’s own page, gathered across all of them.')));

  const groups = featureGroups(model).filter((g) => g.commands.length);
  if (!groups.length) {
    main.appendChild(h('div', { class: 'empty' }, 'No commands yet.'));
    return;
  }

  for (const group of groups) {
    main.appendChild(h('h3', { class: 'rulemap-feature' }, group.name));
    for (const name of group.commands) {
      const slice = sliceOf(model, name);
      const rules = slice.rules.map((condition) => ruleSentence(model, slice.body, condition));
      main.appendChild(h('div', { class: 'card command rulemap-row' },
        h('div', { class: 'rulemap-cmd' }, commandRef(model, name)),
        h('div', { class: 'rulemap-arrow' }, '→'),
        h('div', { class: 'rulemap-rules' },
          rules.length
            ? rules.map((text) => h('div', { class: 'rulemap-rule' }, text))
            : h('div', { class: 'empty tiny' }, 'always allowed')),
        h('div', { class: 'rulemap-arrow' }, '→'),
        h('div', { class: 'rulemap-events' },
          slice.emits.length
            ? slice.emits.map(({ emission }) => eventRef(model, emission.name))
            : h('div', { class: 'empty tiny' }, 'records nothing yet'))));
    }
  }
}

// ---------- event model ----------
//
// `eventModel` (shared.js) decides what goes where; this places it.
// Like a lifecycle band, the geometry is computed rather than measured
// — card heights from text length, every card in a lane as tall as the
// lane's tallest, so the wires can be drawn against it without reading
// the DOM back.

const EM = { LABEL: 140, W: 168, GAP: 44, PAD: 14, LINE: 18, SMALL: 16, CHARS: 21 };

// Lines a label wraps to in a card — a guess, not a measurement, and
// erring long: a card a line too tall is a gap, one too short clips.
function emLines(text, chars = EM.CHARS) {
  return Math.max(1, Math.ceil(String(text).length / chars));
}

function eventModelLayout(model, em) {
  const columns = [];
  let x = EM.LABEL;
  for (const column of em.columns) {
    const slots = column.kind === 'command' ? Math.max(1, column.events.length) : 1;
    const width = slots * EM.W + (slots - 1) * EM.GAP;
    const left = x;
    columns.push({ ...column, x: left, width, slotX: (i) => left + i * (EM.W + EM.GAP) });
    x += width + EM.GAP;
  }

  const commandsOnly = columns.filter((c) => c.kind === 'command');
  const reads = columns.filter((c) => c.kind === 'read');
  const payloadH = Math.max(...commandsOnly.map((c) =>
    16 + emLines(readable(c.command)) * EM.LINE + Math.max(1, c.payload.length) * 20));
  const decideH = Math.max(
    ...commandsOnly.map((c) => 16 + emLines(readable(c.command)) * EM.LINE + EM.SMALL
      + (c.reads.length ? emLines('reads ' + c.reads.join(', '), 26) * EM.SMALL : 0)),
    ...reads.map((c) => 16 + emLines(readable(c.entity || c.projection)) * EM.LINE
      + (c.properties.length ? emLines(c.properties.map(propertyWords).join(', '), 26) * EM.SMALL : 0)));
  const events = commandsOnly.flatMap((c) => c.events);
  const eventH = Math.max(52, ...events.map((e) => 16 + emLines(readable(e.name)) * EM.LINE + EM.SMALL));

  const lanes = [];
  let y = 0;
  const lane = (kind, height, tag) => { lanes.push({ kind, y, height, tag }); y += height; return lanes[lanes.length - 1]; };
  const payloadLane = lane('payload', payloadH + 2 * EM.PAD);
  const decideLane = lane('decide', decideH + 2 * EM.PAD);
  const eventLanes = em.lanes.map((tag) => lane('events', eventH + 2 * EM.PAD, tag));
  const lanesBottom = y;

  const cards = [];
  const wires = [];
  let buses = 0;
  const readCard = {};
  for (const column of columns) {
    if (column.kind === 'read') {
      const card = {
        kind: 'read', column, x: column.x, y: decideLane.y + EM.PAD, w: EM.W, h: decideH,
      };
      cards.push(card);
      (readCard[column.from] = readCard[column.from] || []).push(card);
    }
  }
  for (const column of columns) {
    if (column.kind !== 'command') continue;
    const payload = { kind: 'payload', column, x: column.x, y: payloadLane.y + EM.PAD, w: column.width, h: payloadH };
    const command = { kind: 'command', column, x: column.x, y: decideLane.y + EM.PAD, w: column.width, h: decideH };
    cards.push(payload, command);
    const cx = column.x + column.width / 2;
    wires.push({ arrow: true, d: `M ${cx} ${payload.y + payload.h} L ${cx} ${command.y - 2}` });

    column.events.forEach((event, i) => {
      const top = eventLanes[Math.min(...event.lanes)];
      const bottom = eventLanes[Math.max(...event.lanes)];
      const card = {
        kind: 'event', column, event, x: column.slotX(i), y: top.y + EM.PAD, w: EM.W,
        h: bottom.y + bottom.height - EM.PAD - (top.y + EM.PAD),
      };
      cards.push(card);
      const ex = card.x + EM.W / 2;
      wires.push({ arrow: true, d: `M ${ex} ${command.y + command.h} L ${ex} ${card.y - 2}` });

      // Out to the read models this event introduces: along the event's
      // own lane when that is clear, and along a strip under every lane
      // when a later event of the same command sits in the way.
      const targets = readCard[event.name] || [];
      if (!targets.length) return;
      const lastX = targets[targets.length - 1].x + EM.W / 2;
      const blocked = column.events.slice(i + 1)
        .some((later) => later.lanes.some((l) => l >= Math.min(...event.lanes) && l <= Math.max(...event.lanes)));
      let wireY;
      if (blocked) {
        wireY = lanesBottom + 12 + buses * 10;
        buses += 1;
        wires.push({ d: `M ${ex} ${card.y + card.h} L ${ex} ${wireY} L ${lastX} ${wireY}` });
      } else {
        wireY = top.y + top.height / 2;
        wires.push({ d: `M ${card.x + EM.W} ${wireY} L ${lastX} ${wireY}` });
      }
      for (const target of targets) {
        const tx = target.x + EM.W / 2;
        wires.push({ arrow: true, d: `M ${tx} ${wireY} L ${tx} ${target.y + target.h + 2}` });
      }
    });
  }
  return {
    lanes, cards, wires,
    width: x - EM.GAP + 24,
    height: lanesBottom + (buses ? 16 + buses * 10 : 0),
  };
}

function renderEventModel(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Event model'),
    h('div', { class: 'muted small' },
      'Every command with its payload above it and the events it appends below, time running left '
      + 'to right; after it, a read model for each piece of state those events move first. Event '
      + 'lanes are tags, so an event with two tags spans two lanes. The order follows the '
      + 'lifecycles: what creates a thing first, what ends it last.')));

  const em = eventModel(model);
  if (!em.columns.length) {
    main.appendChild(h('div', { class: 'empty' }, 'No commands yet.'));
    return;
  }
  const layout = eventModelLayout(model, em);
  const band = h('div', { class: 'em-band', style: `width:${layout.width}px; height:${layout.height}px` });

  const LANE_NAMES = { payload: 'Payload', decide: 'Commands · read models' };
  for (const lane of layout.lanes) {
    band.appendChild(h('div', { class: 'em-lane ' + lane.kind, style: `top:${lane.y}px; height:${lane.height}px` }));
    band.appendChild(h('div', { class: 'em-lane-label', style: `top:${lane.y + EM.PAD}px` },
      lane.kind === 'events'
        ? (lane.tag ? ['Events tagged', h('span', { class: 'tech' }, lane.tag)] : 'Untagged events')
        : LANE_NAMES[lane.kind]));
  }

  // Unique per page, like a lifecycle band's: two marker ids that
  // collide resolve to whichever came first.
  const ah = 'em-ah';
  let wires = `<svg viewBox="0 0 ${layout.width} ${layout.height}" preserveAspectRatio="none">`
    + `<defs><marker id="${ah}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">`
    + `<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"></path></marker></defs>`;
  for (const wire of layout.wires) {
    wires += `<path d="${wire.d}" fill="none" stroke="var(--muted)" stroke-width="1.5"`
      + (wire.arrow ? ` marker-end="url(#${ah})"` : '') + '></path>';
  }
  band.appendChild(h('div', { class: 'em-wires', html: wires + '</svg>' }));

  const place = (card) => `left:${card.x}px; top:${card.y}px; width:${card.w}px; height:${card.h}px`;
  for (const card of layout.cards) {
    const { column } = card;
    if (card.kind === 'payload') {
      band.appendChild(h('div', { class: 'em-card payload', style: place(card) },
        h('div', {}, readable(column.command)),
        column.payload.length
          ? column.payload.map((p) => h('div', { class: 'field', title: typeLabel(p) }, p.name))
          : h('div', { class: 'line' }, '—')));
    } else if (card.kind === 'command') {
      const ruleWords = [
        column.rules ? column.rules + (column.rules === 1 ? ' rule' : ' rules') : null,
        column.guards ? column.guards + (column.guards === 1 ? ' guard' : ' guards') : null,
      ].filter(Boolean).join(' · ');
      band.appendChild(h('div', { class: 'em-card command', style: place(card) },
        h('div', { class: 'title', title: column.command, onclick: () => goToCommand(column.command) },
          iconPrefix(commandIcon(model, column.command)) + readable(column.command)),
        ruleWords ? h('div', { class: 'rules' }, ruleWords) : h('div', { class: 'line' }, 'always allowed'),
        column.reads.length ? h('div', { class: 'line' }, 'reads ' + column.reads.join(', ')) : null));
    } else if (card.kind === 'read') {
      const name = column.entity || column.projection;
      band.appendChild(h('div', { class: 'em-card read', style: place(card) },
        h('div', {
          class: 'title', title: name,
          onclick: () => (column.entity ? openEntity(column.entity) : goToProjection(column.projection)),
        }, iconPrefix(column.entity ? entityIcon(model, column.entity) : null) + readable(name)),
        column.properties.length
          ? h('div', { class: 'line' }, column.properties.map(propertyWords).join(', '))
          : null));
    } else {
      const { event } = card;
      band.appendChild(h('div', { class: 'em-card event', style: place(card) },
        h('div', { class: 'title', title: event.name, onclick: () => goToEvent(event.name) },
          iconPrefix(eventIcon(model, event.name)) + readable(event.name)),
        h('div', { class: 'line' },
          (event.tags.length ? event.tags.join(' + ') : 'untagged') + (event.guarded ? ' · guarded' : ''))));
    }
  }
  main.appendChild(h('div', { class: 'em-scroll' }, band));
}

// ---------- lifecycles ----------
//
// Each entity's lifecycle drawn as the machine `lifecycleMachines`
// derives (shared.js): state bubbles on an open band, event-labelled
// wires between them, and the commands allowed at a state kept in a
// popover until the state is hovered, focused or pinned.
//
// Two weights, because most lifecycles are the ordinary two-state
// boolean an entity's page adds in one click. A machine that is only
// existence gets one compact row; anything with three or more states
// gets the band. Filtering the two-state ones off instead would have
// been quieter and wrong: the unguarded dot is this page's most useful
// output, and a command that brings a thing into being without checking
// it does not exist yet is exactly that bug, in exactly the machine a
// filter would have hidden.

// The machine, named the way a caveat about it reads: "course · status",
// or just "student · exists".
function machineWords(machine) {
  return memberWords(readable(machine.entity).toLowerCase(), machine.property);
}

const LC_GAP = 150;   // between two nodes: an arrow and its event label
const LC_NODE_H = 46;
const LC_ROW_H = 22;  // one command row in a popover or list

// What one state's popover holds: the commands that move the status
// away (read off the transitions drawn from here, so a publisher that
// never binds the entity — a numbering-guarded DefineCourse — still
// appears), then the ones that leave it unchanged.
function lifecycleStateRows(machine, state) {
  const moves = [];
  const seen = new Set();
  for (const t of machine.transitions) {
    if (!t.sources.includes(state) || t.target === state) continue;
    for (const p of t.publishers) {
      const from = p.sources === null ? (t.conventional ? [state] : machine.states) : p.sources;
      if (!from.includes(state) || seen.has(p.command)) continue;
      seen.add(p.command);
      moves.push({ command: p.command, target: t.target, unguarded: p.sources === null });
    }
  }
  const stays = machine.perState[state]
    .filter((e) => (e.movesTo === null || e.movesTo === state) && !seen.has(e.command))
    .map((e) => ({ command: e.command, target: null, unguarded: e.unguarded }));
  return { moves, stays };
}

// Every command this machine cannot pin to a state — for the caveat an
// otherwise-empty state carries.
function lifecycleUnguarded(machine) {
  const names = new Set();
  for (const t of machine.transitions) {
    for (const p of t.publishers) if (p.sources === null) names.add(p.command);
  }
  for (const entries of Object.values(machine.perState)) {
    for (const e of entries) if (e.unguarded) names.add(e.command);
  }
  return [...names];
}

// Where everything sits — computed rather than measured: node widths
// come from label length, so the geometry is a pure function of the
// machine and the wires can be drawn against it without reading the
// DOM back. Heights include the room the popovers need, so opening
// one never grows the page under the pointer.
function lifecycleLayout(machine) {
  const order = lifecycleOrder(machine);
  const nodes = [];
  let x = 46;
  order.forEach((state, i) => {
    const label = lifecycleStateWords(machine, state);
    const w = Math.max(120, Math.min(210, 40 + label.length * 8));
    nodes.push({ state, x, y: 56 + (i % 2 ? 18 : 0), w, index: i });
    x += w + LC_GAP;
  });
  const at = {};
  for (const n of nodes) at[n.state] = n;

  const edges = [];
  const pairSeen = {};
  let hasBack = false;
  for (const t of machine.transitions) {
    for (const source of t.sources) {
      const from = at[source];
      const to = at[t.target];
      if (!from || !to) continue;
      const pairKey = source + '␀' + t.target;
      const lane = pairSeen[pairKey] || 0;
      pairSeen[pairKey] = lane + 1;
      const edge = { transition: t, from: source, to: t.target };
      if (to.index > from.index) {
        const x1 = from.x + from.w + 4;
        const y1 = from.y + LC_NODE_H / 2 - 4;
        const x2 = to.x - 8;
        const y2 = to.y + LC_NODE_H / 2 - 4;
        const lift = 30 + lane * 14;
        edge.path = `M ${x1} ${y1} C ${x1 + 56} ${y1 - lift}, ${x2 - 56} ${y2 - lift}, ${x2} ${y2}`;
        edge.labelX = (x1 + x2) / 2;
        edge.labelY = Math.min(y1, y2) - 40 - lane * 16;
      } else if (to.index === from.index) {
        const cx = from.x + from.w / 2;
        const top = from.y;
        edge.path = `M ${cx - 15} ${top - 2} C ${cx - 15} ${top - 28}, ${cx + 15} ${top - 28}, ${cx + 15} ${top - 6}`;
        edge.labelX = cx;
        edge.labelY = top - 46;
      } else {
        hasBack = true;
        const x1 = from.x + from.w / 2;
        const y1 = from.y + LC_NODE_H;
        const x2 = to.x + to.w / 2;
        const y2 = to.y + LC_NODE_H;
        const drop = 40 + lane * 14;
        edge.path = `M ${x1} ${y1 + 2} C ${x1} ${y1 + drop}, ${x2} ${y2 + drop}, ${x2} ${y2 + 6}`;
        edge.labelX = (x1 + x2) / 2;
        edge.labelY = Math.max(y1, y2) + 26 + lane * 16;
      }
      edges.push(edge);
    }
  }

  // The room a state's rows need, so an opened popover never spills
  // past the band.
  let maxRows = 1;
  for (const state of machine.states) {
    const { moves, stays } = lifecycleStateRows(machine, state);
    const headers = (moves.length ? 1 : 0) + (stays.length ? 1 : 0);
    maxRows = Math.max(maxRows, moves.length + stays.length + headers || 2);
  }
  const nodesBottom = Math.max(...nodes.map((n) => n.y)) + LC_NODE_H;
  return {
    nodes, at, edges,
    width: Math.max(x - LC_GAP + 46, 320),
    height: nodesBottom + (hasBack ? 58 : 14) + maxRows * LC_ROW_H + 44,
  };
}

function renderLifecycles(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Lifecycles'),
    h('div', { class: 'muted small' },
      'Each entity’s lifecycle as a machine — every state it can be in, the events that move '
      + 'it from one to the next, and the commands allowed at each state. All of it is derived '
      + 'from the property the entity designates as its lifecycle.')));

  const { machines, excluded } = lifecycleMachines(model);
  if (!machines.length) {
    // "Nothing to draw" and "nothing designated" are different answers,
    // and a model whose only lifecycle is scripted is the second. Saying
    // the first would be telling the author their designation did not
    // land.
    const designated = excluded.filter((e) => e.reason !== 'none');
    main.appendChild(h('div', { class: 'empty' }, designated.length
      ? 'Nothing here can be drawn as a machine, though a lifecycle is designated.'
      : 'No entity has a lifecycle yet — add one from an entity’s page (+ lifecycle), and '
        + 'its machine appears here.'));
    if (excluded.length) main.appendChild(lifecycleExclusions(excluded));
    return;
  }

  // Existence-only machines first and together: they are one line each,
  // and reading them as a list says something a row of identical
  // two-node diagrams would bury — which things this model knows only
  // whether they are there, and which command is trusted to say so.
  const compact = machines.filter((m) => m.compact);
  const full = machines.filter((m) => !m.compact);

  if (compact.length) {
    main.appendChild(h('h3', { class: 'rulemap-feature' },
      full.length ? 'Existence only' : 'Existence'));
