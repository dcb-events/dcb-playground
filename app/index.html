<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCB Playground</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="stylesheet" href="shared.css">
<style>
  /* `minmax(0, …)` so a page wider than the window (Coupling's matrix,
     a lifecycle or event-model band) scrolls inside its own strip
     instead of stretching the column, and the page, to fit it. */
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
  /* Nothing loaded means no rail to show — the splash takes the whole
     row rather than sitting in a column sized for a rail that isn't
     there. */
  .layout.no-rail { grid-template-columns: 1fr; }
  .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 0; }
  .rail-backdrop { display: none; }
  /* Below the breakpoint the rail stops being a grid column and
     becomes a drawer over the content instead — .layout falls back to
     one column so .main never sits in a column sized for a rail that
     is no longer there. Opening it is the menu button in the bar
     (`.menu-btn`); a backdrop and picking an actual link both close it
     — see `renderRail` and the delegated click listener on #rail. */
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .rail {
      position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 25;
      width: 82vw; max-width: 300px; overflow-y: auto;
      box-shadow: 2px 0 20px rgba(15, 23, 42, .2);
      transform: translateX(-100%); transition: transform .18s ease;
    }
    .rail.open { transform: translateX(0); }
    .rail-backdrop.open {
      display: block; position: fixed; inset: var(--topbar-h) 0 0 0;
      background: rgba(15, 23, 42, .35); z-index: 24;
    }
  }
  .rail h4 { padding: 0 16px 8px; }
  .rail a {
    display: block; padding: 6px 16px; font-size: 13px;
    color: var(--text); text-decoration: none; border-left: 3px solid transparent;
  }
  .rail a:hover { background: var(--accent-soft); }
  .rail a.on { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  /* Quiet until wanted, like the in-page adders below: pointing at the
     rail is the "I am about to change this list" gesture. On a touch
     screen the drawer being open is that gesture — see the hover:none
     block near the FAB styles. */
  .rail .add { padding: 10px 16px 0; display: flex; gap: 6px; opacity: 0; transition: opacity .15s ease; }
  .rail:hover .add, .rail .add:focus-within { opacity: 1; }
  .rail .loose { display: flex; align-items: center; gap: 6px; padding: 2px 16px; }
  .group .rm { display: inline-flex; }
  .group .rm .btn { visibility: hidden; padding: 0 5px; }
  .group:hover .rm .btn, .group .rm.on .btn, .group .rm .btn:focus { visibility: visible; }
  .group .gadd { visibility: hidden; padding: 0 5px; }
  .group:hover .gadd, .group .gadd:focus { visibility: visible; }

  /* Two levels: a feature, and the commands that make it up. */
  .group {
    display: flex; align-items: baseline; gap: 6px;
    padding: 9px 16px 3px; font-size: 12px; font-weight: 600;
  }
  .group .caret { cursor: pointer; color: var(--muted); font-size: 10px; width: 10px; }
  .group .gname { cursor: pointer; flex: 1; }
  .group .gname:hover { color: var(--accent); }
  .group .gcount {
    font-weight: 400; font-size: 10px; color: var(--muted);
    background: var(--bg); border-radius: 999px; padding: 0 6px;
  }
  /* The drop target while a command is dragged over a feature — its
     heading or any command row in it. Filled, not an edge line like the
     scenario cards': the command lands *in* the group, never against a
     neighbour (within a group the order is alphabetical, not chosen). */
  .group.drop-into { background: var(--accent-soft); border-radius: 6px; }
  .rail a.cmd.drop-into { background: var(--accent-soft); }
  /* The way out of a feature, shown only while a command is in the air
     and no real Ungrouped group is on screen to receive it. */
  .rail .drop-stub { display: none; color: var(--muted); font-style: italic; font-weight: 400; }
  .rail .drop-stub .gname { cursor: default; }
  .rail .drop-stub .gname:hover { color: var(--muted); }
  .rail.dragging-cmd .drop-stub { display: flex; }
  .rail a.cmd { padding-left: 32px; display: flex; align-items: center; gap: 6px; }
  .rail a.cmd .grow { flex: 1; }
  .rail a.cmd .grip { opacity: 0; }
  .rail a.cmd:hover .grip, .rail a.cmd .grip:focus { opacity: 1; }
  .rail a.cmd.dragging { opacity: .4; }
  /* The count used to sit hard against the label — "Sandbox14" — because
     an <a> lays its children out as text, not as a row. This one alone
     needs a row: the label on the left, the count held to the right. */
  .rail a.sandbox { display: flex; align-items: center; gap: 8px; }
  .rail a.sandbox .grow { flex: 1; }
  /* A thing in the rail is in the colour things are in everywhere else,
     so the rail says which of the two lists you are in without a
     heading having to. */
  .rail a.ent:hover { background: var(--entity-soft); }
  .rail a.ent.on { border-left-color: var(--entity); background: var(--entity-soft); }
  .gempty { padding: 2px 16px 4px 32px; font-size: 11px; color: var(--muted); font-style: italic; }

  /* The stored identifier, for anyone who wants to see it. */
  .tech {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-left: 6px; font-weight: 400;
  }

  /* Inline forms, everywhere a name is needed — never a browser dialog. */
  .inline-form {
    border: 1px dashed var(--accent); border-radius: 6px;
    padding: 8px 10px; margin: 6px 0; background: var(--accent-soft);
  }
  .inline-form .q { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  /* Choosing a mark is not naming something — it belongs to the thing
     it is on, so it is dressed in that thing's colour. */
  .inline-form.icons { border-color: var(--entity); background: var(--entity-soft); }
  .inline-form.icons.event { border-color: var(--event); background: var(--event-soft); }
  .inline-form .adder { margin-top: 0; }
  .rail .inline-form { margin: 6px 16px; }
  .becomes { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .blank { max-width: 470px; padding: 40px 0; }
  .blank h2 { margin-bottom: 6px; }
  .blank p { margin-bottom: 14px; }

  /* A definition as a card, with its members listed under it: value
     types and projections are shown this way. */
  .ecard {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 12px 14px; margin-bottom: 12px;
  }
  .ehead { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .erows { border-top: 1px dashed var(--border); }
  .erow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px;
  }
  .erow .nm { min-width: 165px; }
  /* Removing a part of a definition, from inside the chip that shows it. */
  .chip .x {
    border: 0; background: transparent; font: inherit; font-size: 11px;
    padding: 0 0 0 5px; margin: 0; color: inherit; opacity: .5; cursor: pointer;
  }
  .chip .x:hover { opacity: 1; color: var(--danger); }

  .slice { padding: 22px 30px 70px; max-width: 800px; }
  /* Pinned while its steps scroll by, so which command you are inside
     is the one thing the page never loses. The separator is always on:
     it used to appear only once the page had scrolled, but a header
     that changes shape at a scroll threshold changes the document's
     height at that same threshold, which clamps the scroll back under
     it — the page then flickers between the two states. Nothing here
     reads the scroll position any more. */
  .slice > header {
    position: sticky; top: var(--topbar-h); z-index: 10;
    background: var(--bg); margin: 0 -30px 22px; padding: 8px 30px;
    border-bottom: 1px solid var(--border); box-shadow: 0 6px 14px -12px rgba(15,23,42,.5);
  }
  .slice > header .name { font-size: 20px; font-weight: 600; }

  /* Each step of the slice, in the order you meet it. The ::before
     bottom mirrors the margin, so the connector line spans the gap. */
  .step { position: relative; padding: 0 0 0 26px; margin-bottom: 10px; }
  .step::before {
    content: ""; position: absolute; left: 7px; top: 20px; bottom: -10px;
    width: 2px; background: var(--border);
  }
  .step:last-of-type::before { display: none; }
  .step > .dot {
    position: absolute; left: 0; top: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 3px solid var(--surface); background: var(--border-strong);
  }
  /* The bar under a new command's last revealed step: what continuing
     means right now, and the way to the whole page. Indented like a
     step, because it stands where the next one will. */
  .wizard-bar { display: flex; align-items: center; gap: 10px;
                padding-left: 26px; margin: -2px 0 10px; }
  .step.trigger > .dot { background: var(--command); }
  .step.reads > .dot, .step.changes > .dot, .step.now > .dot { background: var(--entity); }
  .step.rules > .dot, .step.decide > .dot { background: var(--rule); }
  .card.rule { border-left: 3px solid var(--rule); }
  /* A rule inside the read it is about: indented under the sentence
     that introduced the thing, and carrying the rule colour so the two
     kinds of line stay tellable apart now that they share a card. */
  .rule-row { margin: 4px 0 0 12px; padding-left: 8px; border-left: 2px solid var(--rule); }
  /* The grip sits in the margin left of the rule line, outside the
     row, so it neither shifts the sentence nor waits for the row to be
     opened — it fades in on hover, the way a rail command's does. */
  .rule-row { position: relative; }
  .rule-row > .grip { position: absolute; left: -16px; top: 3px; opacity: 0; }
  .rule-row:hover > .grip, .rule-row > .grip:focus, .rule-row.dragging > .grip { opacity: 1; }
  /* The same edge line a scenario drop draws — see `.scenario.drop-before`. */
  .rule-row.drop-before { box-shadow: inset 0 2px 0 var(--rule); }
  .rule-row.drop-after { box-shadow: inset 0 -2px 0 var(--rule); }
  .rule-row.dragging { opacity: .4; }
  /* One question per line, so a rule being written reads as a form
     rather than as a row of pickers that happened to wrap. */
  .rule-wizard { display: flex; flex-direction: column; gap: 2px; }
  .rule-stage + .rule-stage { border-top: 1px dashed var(--border); padding-top: 4px; }
  .rule-stage > .q { font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); padding: 2px 0 0 2px; }
  .rule-stage > .adder { padding-top: 0; }
  .card > .adder.quiet { margin-left: 12px; }
  .step.emits > .dot { background: var(--event); }
  .step > .shead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }

  /* ---------- quiet rows ----------
     A row shows the thing itself. The machinery around it — the type,
     the stored identifier, the button that removes it — waits inside a
     .reveal until the row is clicked. */
  .qrow > .reveal { display: none; align-items: center; gap: 8px; }
  .qrow.open > .reveal { display: inline-flex; }
  .qrow:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
  .qrow { cursor: pointer; }
  .qrow:hover, .qrow.open { background: var(--accent-soft); }
  /* The collapsed adder: one quiet button where a row of empty controls
     used to sit — and quieter still since the hover-reveal round: the
     folded button is invisible until the pointer is over the step (or
     card) it would add to, or the keyboard reaches it. It keeps its
     space, so nothing shifts when it appears. Touch screens have no
     hover; there the folded adders are hidden outright and the floating
     "+" collects them into a bottom sheet — see the hover:none block. */
  .adder.quiet { opacity: 0; transition: opacity .15s ease; margin-top: 3px; }
  .step:hover .adder.quiet, .ecard:hover .adder.quiet, .ident:hover .adder.quiet,
  .pdetail:hover .adder.quiet, .adder.quiet:hover, .adder.quiet:focus-within { opacity: 1; }
  /* The dashed line beside the revealed button: where the new row will go. */
  .adder.quiet .slot { flex: 1; height: 1px; border-bottom: 1px dashed var(--border-strong); }
  .adder .btn.ghost { color: var(--muted); }
  .adder .btn.ghost:hover { color: var(--accent); }

  /* ---------- touch screens ----------
     No hover means no reveal, so wherever hover cannot happen — a
     touch screen, a coarse pointer, or a window narrow enough to be
     one — the folded adders and the rail's add row simply stay
     visible, and the command grips too. Decluttering is a pointer
     luxury; a button that can never appear is not quiet, it is gone. */
  @media (hover: none), (pointer: coarse), (max-width: 760px) {
    .adder.quiet { opacity: 1; }
    .rail .add { opacity: 1; }
    .rail a.cmd .grip { opacity: 1; }
    .rule-row > .grip { opacity: 1; }
  }

  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 10px 13px; margin-bottom: 7px;
  }
  /* A step's card hugs its sentence instead of stretching to the
     slice's full width — a short fact should not trail half a page of
     card behind it. The floor keeps the timeline from looking ragged,
     and a card with an editor open inside gets the whole line back:
     forms need the room, and a card resizing under a half-filled form
     would be worse than the whitespace ever was. */
  .step .card { width: fit-content; min-width: 380px; max-width: 100%; }
  .step .card:has(input, select, textarea) { width: auto; }
  .adder.quiet .slot { min-width: 48px; }
  .card.event { border-left: 3px solid var(--event); }
  .card.entity { border-left: 3px solid var(--entity); }
  /* What the command itself is: its input, in its own colour, like
     everything else on the page. */
  .card.command { border-left: 3px solid var(--command); }
  .card.projection { border-left: 3px solid var(--projection); }
  /* Code. Set apart from everything around it on purpose: this is the
     one part of a model the tooling neither checks nor understands, and
     it should not look like the parts it does. */
  .script {
    margin: 4px 0 10px 14px; padding: 8px 10px;
    border-left: 2px dashed var(--border-strong); display: grid; gap: 6px;
  }
  .script-handler { display: grid; gap: 3px; }
  .script-handler .tiny { display: flex; align-items: center; gap: 6px; }
  .script textarea, .script-handler textarea {
    width: 100%; box-sizing: border-box; resize: vertical;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 11px; line-height: 1.5; padding: 7px 9px;
  }
  .script textarea:focus, .script-handler textarea:focus {
    outline: none; border-color: var(--accent);
  }
  /* Queries. The header carries the cost — how many times this command
     goes to the log — and the note under a card carries the reason it
     could not go earlier. Neither is authored: both are read off the
     operands already written. */
  .round-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
  .round-head:first-child { margin-top: 0; }
  .round-head .rule { flex: 0 0 18px; height: 1px; background: var(--border); }
  .round-head .label { font-size: 10px; text-transform: uppercase;
                       letter-spacing: 0.06em; color: var(--muted); }
  .waits { font-size: 11px; color: var(--muted); padding: 2px 0 0 12px; }
  .waits .op { font-family: var(--mono); font-size: 10px; }
  /* A member opened for editing: the row it replaces, expanded. */
  .member-editor { padding: 4px 0 4px 8px; border-left: 2px solid var(--accent);
                   margin: 2px 0; background: var(--surface); }
  .member-editor .adder { flex-wrap: wrap; }
  .chip.editable { cursor: pointer; }
  .chip.editable:hover { border-color: var(--accent); color: var(--accent); }
  /* A field offered rather than authored — dashed, like the adders it
     sits beside, so it reads as "not here yet" rather than as one more
     fact about the event. */
  .chip.suggest {
    font: inherit; font-size: 11px; cursor: pointer; color: var(--muted);
    border-style: dashed; background: transparent;
  }
  .chip.suggest:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .copy-missing { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 6px; }
  .row .grow { flex: 1; }
  .sentence { font-size: 13px; }
  .sentence .op { font-family: var(--mono); font-size: 12px; background: var(--type-soft);
                  border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .sentence .verb { color: var(--muted); }
  /* A reference, and the row it refers to. */
  .op.ref { cursor: pointer; }
  .op.ref:hover, .op.ref:focus, .op.ref.pinned {
    border-color: var(--accent); color: var(--accent); outline: none;
  }
  .lit { box-shadow: 0 0 0 2px var(--accent); border-radius: 5px; }
  .fields { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
  .field .nm { min-width: 170px; }
  /* A field's type, always on the row rather than waiting in the
     reveal: small and grey so the name stays the loudest thing, but
     never a click away. Still the way into the member editor. */
  .field .type-tag {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: var(--type-soft); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 4px; cursor: pointer;
  }
  .field .type-tag:hover { border-color: var(--accent); color: var(--accent); }
  .adder { display: flex; gap: 9px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .dcb { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; }
  .dcb .k { color: var(--muted); }
  .dcb .t { color: var(--entity); }
  .dcb .y { color: var(--event); }
  .dcb .al { color: var(--command); }
  /* The query glyph and its popover: a mark where a line used to be.
     Hover and focus peek; `.on` is the pinned state. */
  .qpop { position: relative; display: inline-flex; vertical-align: middle; }
  .qbtn { background: none; border: none; padding: 0 3px; cursor: pointer;
          color: var(--muted); display: inline-flex; align-items: center; }
  .qbtn:hover, .qbtn:focus-visible, .qpop.on .qbtn { color: var(--accent); }
  .qbtn .qico { display: inline-flex; }
  .qbtn .qico svg { width: 13px; height: 13px; }
  .qpop .qpanel { display: none; position: absolute; top: calc(100% + 5px); left: -10px;
                  z-index: 60; background: var(--surface);
                  border: 1px solid var(--border-strong); border-radius: 8px;
                  padding: 8px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                  min-width: 320px; max-width: 560px; }
  .qpop:hover .qpanel, .qpop:focus-within .qpanel, .qpop.on .qpanel { display: block; }
  .qpanel .qtitle { margin-bottom: 2px; text-transform: uppercase; font-size: 9.5px;
                    letter-spacing: 0.06em; }
  .qpanel .trip + .trip { margin-top: 6px; }

  /* The concept hint: same peek/pin behaviour as the query popover, a
     quieter mark, and it rides a heading rather than a row. */
  /* Centred on the capitals, not the lowercase: the box is 1em tall and
     its bottom sits 0.15em under the baseline, so its middle is 0.35em
     up — half a cap height. `middle` centred it on half the x-height,
     which beside an uppercase heading read a pixel and more low. */
  .hint { position: relative; display: inline-flex; vertical-align: -0.15em; }
  .hbtn { background: none; border: none; padding: 0 2px; cursor: help;
          color: var(--muted); font-size: inherit; line-height: 1;
          display: inline-flex; align-items: center; }
  .hbtn .imark, .hbtn .imark svg { display: block; width: 1em; height: 1em; }
  .hbtn:hover, .hbtn:focus-visible, .hint.on .hbtn { color: var(--accent); }
  .hint .hpanel { display: none; position: absolute; top: calc(100% + 5px); left: -10px;
                  z-index: 60; background: var(--surface);
                  border: 1px solid var(--border-strong); border-radius: 8px;
                  padding: 8px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                  min-width: 260px; max-width: 420px;
                  font-size: 11.5px; line-height: 1.55; color: var(--muted);
                  font-weight: 400; text-transform: none; letter-spacing: 0; }
  .hint:hover .hpanel, .hint:focus-within .hpanel, .hint.on .hpanel { display: block; }
  .hpanel .qtitle { color: var(--text); margin-bottom: 3px; }
  .hpanel .hline + .hline { margin-top: 5px; }
  .hpanel .hlinks { display: flex; gap: 14px; margin-top: 6px; }
  .hpanel .hlink { font-size: 11px; }
  .xref {
    font: inherit; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--accent); text-decoration: underline; text-underline-offset: 2px;
  }

  /* An entity chip is a way in: click it anywhere and the thing itself
     slides in beside what you were reading, rather than replacing it. */
  .chip.entity, .op.ent { cursor: pointer; }
  .chip.entity:hover, .op.ent:hover { outline: 1px solid var(--entity); }

  /* A chip that is a way to something else, wherever a definition
     turns up as a cross-reference rather than as itself. Its own kind
     already colours it (chip.command, chip.event, chip.projection); this
     only adds the affordance, in the same colour. */
  .chip.linkable { cursor: pointer; }
  .chip.linkable:hover { outline: 1px solid currentColor; }

  /* ---------- the ledger ----------
     Every projection is shown this way, on the Projections page and on
     an entity's own. Four facts wide, because those are the four that
     differ between one projection and the next; everything else waits
     until a row is opened. The columns are set per page rather than
     here — an entity's page already states what its rows are kept per,
     so it drops that one and passes a narrower template. */
  .ledger {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
  }
  .lhead, .lrow { display: grid; align-items: center; gap: 12px; padding: 0 12px; }
  .lhead { height: 30px; border-bottom: 1px solid var(--border); background: var(--type-soft); }
  .lhead > span {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600;
  }
  .lrow {
    min-height: 42px; border-bottom: 1px solid var(--border); cursor: pointer;
    border-left: 3px solid transparent; padding-left: 9px;
  }
  .lrow:hover { background: var(--accent-soft); }
  .lrow.on { background: var(--entity-soft); border-left-color: var(--entity); }
  .lrow.dead { opacity: .6; }
  .lrow .nm {
    font-size: 13px; font-weight: 600; min-width: 0;
    display: flex; align-items: center; gap: 7px;
  }
  .lrow .nm .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lcell {
    font-family: var(--mono); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lcell.ty { color: var(--type); }
  .lcaret { flex: none; width: 10px; font-size: 10px; color: var(--muted); }
  .ledger .addrow { padding: 9px 12px; }

  /* A tag, wherever a projection says what it is kept per. The entity
     green, because a tag is what an entity *is* — the identifier every
     event about one carries. */
  .chip.tag { background: var(--entity-soft); border-color: #bbf7d0; color: #166534; }
  body.f-dark .chip.tag { border-color: #166534; color: #bbf7d0; }

  /* The opened row. Two sides of one projection — what it is, and what
     pins it down — behind tabs scoped to the thing in front of you,
     which is a different gesture from navigating between things. */
  .pdetail {
    border-bottom: 1px solid var(--border); border-left: 3px solid var(--entity);
    background: var(--surface); padding: 2px 15px 13px;
  }
  .pdetail > .tabs { margin: 4px 0 8px; gap: 0; }
  .pdetail > .tabs .tab { padding: 6px 2px; margin-right: 20px; font-size: 12px; font-weight: 600; }
  .pdetail > .tabs .tab.on { color: var(--entity); border-bottom-color: var(--entity); }
  .pfoot {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding-top: 12px; margin-top: 10px; border-top: 1px dashed var(--border);
  }
  .pfoot .grow { flex: 1; }

  /* ---------- the index ----------
     Projections lists only what no entity binds, so this is the one
     place left that says what else exists and where it lives. It is
     deliberately not a second ledger: names, and a way to each. */
  .index { margin-top: 22px; }
  .index > .why { font-size: 11.5px; color: var(--muted); margin: 3px 0 8px; }
  .index-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 7px 2px; border-top: 1px dashed var(--border); font-size: 12px;
  }
  .index-row .ent {
    font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-width: 130px;
  }
  .index-row .ent:hover { color: var(--accent); }
  .index-row .props { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lnk {
    font: inherit; font-family: var(--mono); font-size: 12px;
    border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer;
  }
  .lnk:hover { color: var(--accent); }

  /* Identity. Set apart from the properties below it because it is a
     different kind of statement: what makes one of these one of these,
     rather than something we happen to know about it. Nobody added the
     identifier — it comes with the thing — and a page that lists it
     alongside "capacity" says otherwise. */
  .ident {
    border: 1px solid var(--entity); border-left-width: 3px;
    border-radius: var(--radius); background: var(--entity-soft);
    padding: 11px 14px 12px; margin-bottom: 22px;
  }
  .ident > h4 { color: var(--entity); }
  .ident .irow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    padding: 5px 0; font-size: 12px;
  }
  .ident .irow + .irow { border-top: 1px dashed var(--border); }
  .ident .irow > .nm { min-width: 110px; color: var(--muted); font-size: 11px; }
  .ident .irow > .grow { flex: 1; }

  /* The lifecycle, drawn where it is named: the Lifecycles band's own
     vocabulary — a pill per state, the event on the arrow — shrunk to
     one row, because a two-state machine is a picture that a sentence
     was standing in for. The pills name the stored *values* where the
     band names them in words: the band has room to say "does not
     exist", and a row that already carries the property chip beside
     them would only be saying `exists` twice. */
  .lctrack { display: inline-flex; align-items: center; gap: 6px; }
  .lctrack .st {
    display: inline-flex; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    border: 1.5px solid var(--entity); background: var(--surface);
    font-size: 11px; font-weight: 600;
  }
  .lctrack .st.val { font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
  /* Nothing moves into it yet. Drawn as the absence it is, the way
     `.chip.unset` draws a value nobody has given. */
  .lctrack .st.unreached {
    border-style: dashed; border-color: var(--border-strong);
    background: transparent; color: var(--muted); font-weight: 400;
  }
  .lctrack .st.terminal { outline: 1.5px solid var(--entity); outline-offset: 2px; }
  /* The label hangs above the wire rather than stacking with it, so the
     wire itself is what the pills centre on — stacked, the hop's middle
     falls between label and wire and the arrow rides low. The row that
     holds a track pays for the overhang in padding (`.lcrow`). */
  .lctrack .hop { position: relative; display: inline-flex; align-items: center; }
  .lctrack .hop .ev {
    position: absolute; left: 50%; bottom: calc(100% + 1px); transform: translateX(-50%);
    font-family: var(--mono); font-size: 9.5px; color: var(--event); white-space: nowrap;
  }
  .ident .irow.lcrow { padding-top: 12px; }
  .lctrack .wire { display: inline-flex; align-items: center; }
  .lctrack .wire i { height: 0; border-top: 1px solid var(--border-strong); }
  .lctrack .wire b {
    width: 0; height: 0; border-left: 4px solid var(--border-strong);
    border-top: 3px solid transparent; border-bottom: 3px solid transparent;
  }
  .lctrack .hop.dead .wire i { border-top-style: dashed; }

  /* The folded lifecycle on the identifier line: a derived fact in the
     page's muted register, and the button that unfolds it. Never faded
     like the menu beside it — it is the only way to the row. */
  .lcfold {
    display: inline-flex; align-items: center; gap: 4px;
    font: inherit; font-size: 11px; color: var(--muted); cursor: pointer;
    padding: 2px 6px; border: 1px solid transparent; border-radius: 6px; background: none;
  }
  .lcfold:hover, .lcfold:focus-visible { border-color: var(--border-strong); }
  .lcfold .p { font-family: var(--mono); color: var(--text); }
  .lcfold .caret, .lcfold .caret svg { display: block; width: 8px; height: 8px; }
  .lcfold .caret { margin-left: 2px; transition: transform .12s; }
  .lcfold.on .caret { transform: rotate(180deg); }

  /* Everything that can be done to a lifecycle, behind one mark — and
     the mark itself waits for the pointer. Nobody opens an entity page
     to designate a property, but the two buttons that did it sat at
     full strength beside a fact nobody was editing. Click-only, never
     hover like the hints: these are edits, and an edit that opens
     because the pointer passed over it is a trap. */
  /* Faded rather than hidden: `visibility: hidden` would take the button
     out of the tab order, and the only other focusable thing in the row
     is the chip — so the one way to the menu would be a pointer. */
  .ident .lcmenu {
    position: relative; display: inline-flex; vertical-align: middle; opacity: 0;
  }
  .ident:hover .lcmenu, .ident .lcmenu:focus-within, .ident .lcmenu.on,
  .ident .lcmenu.lcadd { opacity: 1; }
  .lcbtn {
    font: inherit; font-size: 13px; line-height: 1.1; cursor: pointer;
    padding: 0 4px; border: 1px solid transparent; border-radius: 6px;
    background: none; color: var(--border-strong);
  }
  .lcbtn:hover, .lcbtn:focus-visible, .lcmenu.on .lcbtn {
    color: var(--muted); border-color: var(--border-strong);
  }
  .lcmenu .lcpanel {
    display: none; position: absolute; top: calc(100% + 5px); right: 0; z-index: 60;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); min-width: 215px;
  }
  .lcmenu.on .lcpanel { display: block; }
  .lcitem {
    display: block; width: 100%; text-align: left; white-space: nowrap;
    font: inherit; font-size: 12px; padding: 6px 10px;
    border: 0; border-radius: 5px; background: none; color: var(--text); cursor: pointer;
  }
  .lcitem:hover, .lcitem:focus-visible { background: var(--accent-soft); color: var(--accent); }

  .esection { margin-bottom: 18px; }
  .esection > h4 { margin-bottom: 8px; }
  .esection > .ehead .grow { flex: 1; }

  /* The mark that stands for a thing, wherever the thing is named. */
  .ic { font-style: normal; margin-right: 5px; }
  .chip .ic { margin-right: 4px; }
  /* Unmarked is the common case: an authored mark is the exception, so
     the slot has to vanish rather than reserve itself a gutter. */
  .ic:empty { display: none; }
  .icon-btn {
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    width: 34px; height: 34px; flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
  }
  .icon-btn:hover { border-color: var(--entity); }
  .icon-btn.event:hover { border-color: var(--event); }
  .icons .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
    gap: 4px; margin-bottom: 8px; max-width: 460px;
  }
  .ic-opt {
    font: inherit; font-size: 17px; line-height: 1; cursor: pointer;
    height: 30px; padding: 0; border-radius: 6px;
    border: 1px solid transparent; background: var(--surface);
  }
  .ic-opt:hover { border-color: var(--entity); }
  .ic-opt.on { border-color: var(--entity); background: var(--entity-soft); }
  .icons.event .ic-opt:hover { border-color: var(--event); }
  .icons.event .ic-opt.on { border-color: var(--event); background: var(--event-soft); }

  /* ---------- settings ----------
     Everything that decides how the interface behaves rather than what
     the model says. It lives in one place so the bar at the top can go
     back to being about the model, and so the next such choice has an
     obvious home. The backdrop is thin on purpose: these settings
     change the page behind it, and you should see them land. */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(15, 23, 42, .22);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 64px 16px 24px;
  }
  .modal {
    width: 540px; max-width: 100%; max-height: calc(100vh - 100px); overflow: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 18px 50px rgba(15, 23, 42, .28);
    padding: 16px 20px 18px;
  }
  .modal > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .modal > header .grow { flex: 1; }
  .setting { margin-top: 18px; }
  .setting > h4 { margin-bottom: 3px; }
  .setting .why { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); padding: 8px 11px; margin-bottom: 6px;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt .mark {
    flex: none; width: 13px; height: 13px; margin-top: 3px;
    border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface);
  }
  .opt.on .mark { border: 4px solid var(--accent); }
  .opt .label { font-size: 13px; font-weight: 600; }
  .opt .desc { font-size: 11.5px; color: var(--muted); }

  /* ---------- import & export ----------
     One dialog for both directions a model crosses this browser's
     boundary: pulling one in, from a URL or pasted JSON, and sending
     this one out the same two ways. Tabs rather than a picker, since
     unlike Settings there is a natural default per tab (a URL, JSON) an
     answer usually only needs one of. */
  .ie-tabs { display: flex; margin: 14px 0 16px; border-bottom: 1px solid var(--border); }
  .ie-tab {
    font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 4px; margin-right: 22px;
    border: 0; background: none; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .ie-tab:hover { color: var(--text); }
  .ie-tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .ie-subtoggle {
    display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px;
    overflow: hidden; margin-bottom: 14px;
  }
  .ie-pill {
    font: inherit; font-size: 12.5px; padding: 6px 13px; border: 0;
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .ie-pill + .ie-pill { border-left: 1px solid var(--border-strong); }
  .ie-pill.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .ie-pill:hover:not(.on) { color: var(--text); }

  .ie-check-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--muted); }
  .ie-check-label { font-weight: 600; }
  .ie-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); }
  .ie-check input { margin: 0; }

  .ie-field label {
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700; margin-bottom: 5px;
  }
  .ie-field input[type=text], .ie-field textarea {
    width: 100%; font: inherit; font-size: 13px; padding: 9px 11px;
    border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--surface); color: var(--text); resize: vertical;
  }
  .ie-field input:focus, .ie-field textarea:focus { outline: none; border-color: var(--accent); }
  .ie-field textarea.mono, .ie-field input.mono { font-family: var(--mono); font-size: 11.5px; }
  .ie-field textarea[readonly], .ie-field input[readonly] { background: #fbfcfe; color: var(--muted); }
  body.f-dark .ie-field textarea[readonly], body.f-dark .ie-field input[readonly] { background: #101827; }
  .ie-field .why { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
  .ie-actions { display: flex; justify-content: flex-end; margin-top: 12px; }

  /* ---------- quick open ----------
     Everything in the model, by name, from anywhere. It sits higher and
     tighter than the settings modal because it is passed through rather
     than read. */
  .palette {
    width: 520px; max-width: 100%; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 22px 60px rgba(15, 23, 42, .34); overflow: hidden;
  }
  .palette input {
    width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0;
    padding: 13px 15px; font-size: 15px; background: transparent;
  }
  .palette input:focus { outline: none; }
  .palette .hits { max-height: 340px; overflow: auto; padding: 5px; }
  .palette .hit {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .palette .hit.on { background: var(--accent-soft); }
  .palette .hit .what {
    flex: none; font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); width: 74px;
  }
  .palette .hit .where { margin-left: auto; font-size: 11px; color: var(--muted); }
  .palette .none { padding: 16px; font-size: 12px; color: var(--muted); font-style: italic; }
  .palette footer {
    border-top: 1px solid var(--border); padding: 6px 12px;
    font-size: 10.5px; color: var(--muted); display: flex; gap: 12px;
  }

  /* ---------- help ----------
     Read rather than passed through, so it is the widest panel and the
     only one that scrolls inside itself: the contents stay put beside
     the topic, which is what makes landing on one from elsewhere work. */
  .modal.help {
    width: 900px; height: calc(100vh - 100px); padding: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal.help > header { padding: 14px 20px 12px; margin: 0; border-bottom: 1px solid var(--border); }
  .help-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 190px 1fr; }
  .help-toc { overflow: auto; padding: 12px 8px 16px 14px; border-right: 1px solid var(--border); }
  .help-toc h5 {
    margin: 12px 0 4px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted);
  }
  .help-toc h5:first-child { margin-top: 0; }
  .help-toc button {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px;
    color: var(--text); background: none; border: 0; border-radius: 6px;
    padding: 4px 6px; cursor: pointer;
  }
  .help-toc button:hover { background: var(--bg); }
  .help-toc button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .help-pages { position: relative; overflow: auto; padding: 4px 24px 40vh; outline: none; }
  .help-topic { padding-top: 18px; }
  .help-topic + .help-topic { border-top: 1px solid var(--border); margin-top: 22px; }
  .help-topic h3 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; font-size: 16px; }
  .help-topic h3 a { font-size: 11px; font-weight: 400; }
  .help-topic p { font-size: 13px; line-height: 1.55; margin: 0 0 8px; max-width: 68ch; }
  .help-topic code { font-size: 11.5px; padding: 0 3px; border-radius: 3px; background: var(--bg); }
  .help-code {
    margin: 12px 0; padding: 10px 12px; overflow: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  }
  .help-syntax { width: 100%; border-collapse: collapse; margin: 4px 0 4px; font-size: 12.5px; }
  .help-syntax td { padding: 5px 10px 5px 0; vertical-align: baseline; border-top: 1px solid var(--border); }
  .help-syntax td:first-child { width: 46%; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; }
  .help-syntax td:last-child { line-height: 1.45; }
  .help-boundary { margin: 12px 0; font-size: 12px; }
  .help-boundary > div { padding: 7px 0; border-top: 1px solid var(--border); }
  .help-boundary .cmdline { display: flex; gap: 10px; align-items: baseline; margin-bottom: 3px; }
  .help-boundary .cmdline b { font-family: var(--mono); font-size: 11.5px; }
  .help-boundary .hq { padding-left: 14px; font-family: var(--mono); font-size: 11px; }
  @media (max-width: 720px) {
    .help-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .help-toc {
      display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px;
      border-right: 0; border-bottom: 1px solid var(--border);
    }
    .help-toc h5 { display: none; }
    .help-toc button { width: auto; white-space: nowrap; }
    .help-pages { padding: 4px 16px 40vh; }
    .help-syntax td:first-child { width: auto; }
  }

  /* The code view's colours, for a text that is only shown: Monaco's
     own `vs` / `vs-dark` palette for the classes `sourceHighlight`
     gives, so a snippet in the help and the same line in the editor
     look alike. */
  .hl-keyword { color: #0000ff; }
  .hl-flow { color: #af00db; }
  .hl-type { color: #267f99; }
  .hl-string, .hl-code { color: #a31515; }
  .hl-number { color: #098658; }
  .hl-comment { color: #008000; }
  .hl-annotation { color: #795e26; }
  body.f-dark .hl-keyword { color: #569cd6; }
  body.f-dark .hl-flow { color: #c586c0; }
  body.f-dark .hl-type { color: #4ec9b0; }
  body.f-dark .hl-string, body.f-dark .hl-code { color: #ce9178; }
  body.f-dark .hl-number { color: #b5cea8; }
  body.f-dark .hl-comment { color: #6a9955; }
  body.f-dark .hl-annotation { color: #dcdcaa; }

  /* ---------- problems: one diagnostic dress ----------
     The Problems panel's rows and the in-page advisory banner are the
     same records, so they wear the same clothes — and deliberately NOT
     the model's: no white surface, no 3px kind border. A red-tinted
     panel with a hairline red border and a ⚠ mark reads as the tool
     talking about the model, never as one more block of it. The border
     and text colours are hardcoded like the chips' (a tint of --danger
     with no token of its own), so they are restated for dark below. */
  .issue {
    display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid #fca5a5; border-radius: 7px;
    background: var(--danger-soft); color: #991b1b;
    padding: 8px 11px; margin-bottom: 6px;
  }
  .issue:hover { border-color: var(--danger); }
  .issue .why { font-size: 11px; opacity: .75; }
  /* The neutral row-button the Models modal's example list wears —
     the shape .issue had before problems dressed as diagnostics. */
  .choice {
    display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
    font: inherit; font-size: 12.5px; color: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); padding: 8px 11px; margin-bottom: 6px;
  }
  .choice:hover { border-color: var(--accent); }
  .choice .why { font-size: 11px; color: var(--muted); }
  .badge {
    font-size: 10px; border-radius: 999px; padding: 0 6px; margin-left: 5px;
    background: var(--danger); color: #fff;
  }
  .badge.clear { background: var(--entity); }

  /* The same records, shown on the page of the definition that
     carries them. */
  .advisory {
    display: grid; gap: 4px;
    border: 1px solid #fca5a5; border-radius: 7px;
    background: var(--danger-soft); color: #991b1b;
    padding: 8px 11px; margin: 0 0 10px; font-size: 12px;
  }
  .advisory > div { display: flex; align-items: baseline; gap: 7px; }
  .advisory .what { font-weight: 600; }
  .diag-mark { flex: none; }
  body.f-dark .issue, body.f-dark .advisory { border-color: #7f1d1d; color: #fecaca; }
  body.f-dark .issue:hover { border-color: var(--danger); }

  /* ---------- first-run splash ----------
     The full page shown in #main while nothing is loaded — see
     `renderSplash`. Its own max-width and centering, independent of
     `.slice`, since this is a landing page rather than a model view. */
  .splash { max-width: 860px; margin: 0 auto; padding: 56px 24px 80px; }

  .splash-hero { text-align: center; margin-bottom: 32px; }
  .splash-mark { width: 56px; height: 56px; display: block; margin: 0 auto 16px; }
  .splash-hero h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  .splash-tagline { color: var(--muted); font-size: 15px; margin: 0; }

  .splash-intro { max-width: 600px; margin: 0 auto 30px; text-align: center; font-size: 15px; line-height: 1.65; }

  .splash-cta { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 6px; }
  .splash-cta .btn.primary { font-size: 15px; padding: 13px 30px; }
  .splash-hint { font-size: 12.5px; color: var(--muted); }
  .splash .inline-form { max-width: 380px; margin: 0 auto 6px; }

  .splash-import-link { margin-top: 18px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .splash-import-link a { font-weight: 600; color: var(--accent); }

  .splash-section { margin-top: 52px; }
  .splash-section h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 16px; text-align: center; font-weight: 700;
  }

  .splash-examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .splash-examples { grid-template-columns: 1fr; } }
  .splash-example {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 14px 16px; cursor: pointer;
  }
  .splash-example:hover { border-color: var(--accent); }
  .splash-example .name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .splash-example .desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .splash-video {
    border: 1px dashed var(--border-strong); border-radius: var(--radius);
    background: var(--surface); aspect-ratio: 16 / 6.2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted);
  }
  .splash-video .play {
    width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
  }
  .splash-video .caption { font-size: 12.5px; }

  .splash-faq { border-top: 1px solid var(--border); }
  .splash-faq-item { border-bottom: 1px solid var(--border); }
  .splash-faq-q {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    font: inherit; font-size: 14px; font-weight: 600; background: none; border: 0;
    padding: 14px 2px; cursor: pointer; color: var(--text);
  }
  .splash-faq-q:hover { color: var(--accent); }
  .splash-faq-q .chev { flex: none; color: var(--muted); transition: transform .15s; display: flex; }
  .splash-faq-a { padding: 0 2px 16px; font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 620px; }

  .splash-footer { margin-top: 56px; text-align: center; font-size: 12px; color: var(--muted); }

  /* Site-wide, unlike .splash-footer above — it sits after .layout in
     the document so it closes the page whether the splash or a loaded
     model is what filled it. */
  .site-footer {
    text-align: center; font-size: 11.5px; color: var(--muted);
    padding: 16px 18px; border-top: 1px solid var(--border);
  }

  /* A row the interface just moved you to. Long enough to find it,
     short enough not to become part of the page. */
  @keyframes landed {
    from { background: var(--accent-soft); }
    to { background: transparent; }
  }
  .landed { animation: landed 1.1s ease-out; }

  /* ---------- scenarios ----------
     A scenario reads as a sentence in three parts, so its detail is
     three labelled blocks rather than a form. The status carries the
     colour: agreement is quiet, a difference is not. */
  .tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 12px; margin-bottom: -1px; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .scenarios { display: flex; flex-direction: column; gap: 7px; }
  .scenario {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); padding: 7px 11px;
  }
  .scenario.open { border-color: var(--border-strong); }
  .scenario-row { display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer; }
  .scenario-row:hover .sc-name { color: var(--accent); }
  .sc-name {
    background: none; border: none; font: inherit; color: inherit;
    cursor: pointer; text-align: left; padding: 0;
  }
  .sc-mark {
    width: 18px; height: 18px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border: 1px solid;
  }
  .sc-mark.s-current { color: var(--entity); border-color: var(--entity); background: var(--entity-soft); }
  .sc-mark.s-drifted { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  /* A scenario that no longer agrees with the model is the thing on
     this tab that needs doing, so the whole card says so, not only its
     mark: drifted and broken alike wear the error colour, broken with
     the hollow mark, drifted with the filled one. */
  .scenario.s-drifted, .scenario.s-broken { border-color: var(--danger); border-left-width: 3px; }
  .scenario.s-drifted { background: var(--danger-soft); }
  .sc-status { font-size: 11px; color: var(--muted); }
  .sc-status.s-drifted, .sc-status.s-broken { color: var(--danger); font-weight: 600; }
  .sc-mark.s-broken { color: var(--danger); border-color: var(--danger); background: var(--surface); }

  /* Whether the Then a card shows is a record or a refusal — orange for
     the one, red for the other, the same two colours everything else
     here already uses for "an event" and "a rule stopped this". */
  .card.outcome-published { background: var(--event-soft); }
  .card.outcome-rejected { background: var(--danger-soft); }

  /* The drop target while dragging a scenario by its grip — a line on
     the edge the dragged one would land against, not a filled highlight,
     so it reads as "here" rather than "this one". */
  .scenario.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .scenario.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .scenario.dragging { opacity: .4; }
  /* The one grip everything draggable wears — scenario rows and rail
     commands alike. touch-action: none is what lets `gripDrag` own the
     finger: without it the browser claims the gesture for scrolling. */
  .grip { cursor: grab; color: var(--muted); padding: 0 2px; font-size: 13px;
          user-select: none; touch-action: none; flex: none; }
  .grip:active { cursor: grabbing; }

  /* Always on, unlike the rest of a row's actions — branching a
     scenario is common enough to want a permanent handle, just a quiet
     one: full opacity only once you are actually pointed at it. */
  .sc-footer { display: flex; gap: 6px; margin: -3px 0 0 26px; }
  .sc-footer .btn { opacity: .55; }
  .sc-footer .btn:hover { opacity: 1; }

  .sc-body { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border); }
  .sc-line { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }
  .sc-line .y { color: var(--event); }
  .sc-line .c { color: var(--command); }
  .sc-line .k { color: var(--muted); }
  .sc-body .card { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; margin-top: 4px; }
  .sc-body .card .k { color: var(--muted); }
  .sc-body .card .t { color: var(--entity); }
  .sc-body .card .y { color: var(--event); }

  /* Two outcomes side by side, because the question is which of them
     you meant — not which of them is correct. */
  .drift { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .drift .adder { grid-column: 1 / -1; }
  @media (max-width: 720px) { .drift { grid-template-columns: 1fr; } }

  .sc-editor { margin-top: 9px; }
  .sc-step { margin-top: 6px; }
  .vpayload, .vgroup { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: flex-start; }
  .vfield { display: flex; flex-direction: column; gap: 2px; }
  .vlabel { font-size: 11px; color: var(--muted); }
  .vwrap { display: inline-flex; }
  .vin {
    font: inherit; font-size: 12px; padding: 3px 7px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--text); min-width: 110px;
  }
  .vin:focus { outline: none; border-color: var(--accent); }
  .vin.tiny-in { min-width: 70px; width: 70px; }
  .vlist { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .vrow { display: flex; gap: 5px; align-items: flex-start; }
  .vopt { display: inline-flex; gap: 5px; align-items: center; min-height: 25px; }
  .vopt > label { display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
  .vgroup {
    border: 1px dashed var(--border); border-radius: 5px; padding: 5px 8px;
  }

  /* ---------- sandbox ----------
     A run of events, read as the icons they carry rather than the
     count of them — a session is scanned as a shape before it is read
     as a number, and any position in it is reached by pointing at the
     icon that was there. */
  .timeline { display: flex; flex-direction: column; gap: 7px; }
  .trow { display: flex; align-items: center; gap: 9px; }
  .escrub {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
    padding: 5px 3px; margin: 0 -3px; border-radius: 8px;
    cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .escrub:active { cursor: grabbing; }
  .escrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .estep {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
    transition: opacity .12s ease, border-color .12s ease, background .12s ease;
  }
  /* Icons from the same command sit close together; the next command's
     get a little more air, so the run reads in decisions, not just in
     events. */
  .estep.step-end { margin-right: 7px; }
  .estep:hover { border-color: var(--event); }
  .estep.played { border-color: var(--event-soft); background: var(--event-soft); color: var(--text); }
  .estep.current {
    border-color: var(--event); background: var(--event-soft); color: var(--text);
    box-shadow: 0 0 0 2px var(--event-soft);
  }
  /* Still on the timeline — scrubbing back does not shorten the run,
     it only looks away from the rest of it. */
  .estep.upcoming { opacity: .38; }
  .eplayhead { flex: none; width: 2px; align-self: stretch; min-height: 26px; background: var(--accent); border-radius: 2px; }

  .pin {
    background: none; border: none; cursor: pointer; padding: 0 5px 0 0;
    color: var(--muted); font-size: 12px;
  }
  .pin:hover { color: var(--event); }
  .pin.on { color: var(--event); }

  /* The two overview pages read across every command at once rather
     than down one of them, so they earn more width than an ordinary
     slice — capped, not unbounded, so a model with many events still
     scrolls its matrix instead of running the page edge to edge. */
  .slice.wide { max-width: 1100px; }

  /* ---------- coupling ---------- */
  .coupling-legend { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
  .coupling-legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .coupling-mark { display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; }
  .coupling-mark.produces { background: var(--command); }
  .coupling-mark.consumes { border: 2px solid var(--event); }
  .coupling-mark.both { background: var(--command); border: 2px solid var(--event); }
  .coupling-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .coupling-grid {
    display: grid; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
  }
  .coupling-corner { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  /* Read normally — left to right, upright — rather than rotated:
     sideways text reads slower at any length, and rotating it only
     traded a wide header for a very tall one. Wrapping across a few
     lines instead costs far less height for a typical name, and the
     row still sizes itself to the longest one — nothing here needs
     to estimate a pixel height in JS to avoid clipping. A name long
     enough to still run past a handful of lines is clamped with an
     ellipsis; the full name is always one hover away. */
  .coupling-colhead {
    position: relative; border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border); background: var(--bg); cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 10px 6px; text-align: center;
  }
  .coupling-colhead:hover { background: var(--event-soft); }
  .coupling-colhead.cluster-start { border-left: 2px solid var(--border-strong); }
  .coupling-colhead span {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
    overflow: hidden; font-family: var(--mono); font-size: 11px; line-height: 1.4;
    color: var(--text);
  }
  .coupling-grouprow {
    grid-column: 1 / -1; padding: 5px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .coupling-rowlabel {
    display: flex; align-items: center; padding: 0 12px; font-size: 12px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface); min-height: 40px; cursor: pointer;
  }
  .coupling-rowlabel:hover { color: var(--accent); background: var(--accent-soft); }
  .coupling-cell {
    position: relative; display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    min-height: 40px;
  }
  .coupling-cell.cluster-start { border-left: 2px solid var(--border-strong); }

  /* ---------- overview ----------
     The page a model opens on: what it holds, counted, then every
     command on one row. Nothing here edits; a name is only the way to
     its own page. */
  .overview-stats {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
    gap: 10px; margin-bottom: 26px;
  }
  .overview-stat {
    display: flex; flex-direction: column; gap: 1px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; font: inherit; color: inherit;
  }
  button.overview-stat { cursor: pointer; }
  button.overview-stat:hover { border-color: var(--border-strong); }
  .overview-stat .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  /* Only a count of one kind of definition carries that kind's colour. */
  .overview-stat.kind .label::before {
    content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--kind);
  }
  .overview-stat .count { font-size: 24px; font-weight: 600; line-height: 1.3; }
  .overview-stat .sub { font-size: 12px; color: var(--muted); }
  .overview-section { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .overview-commands {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow-x: auto;
  }
  .overview-row {
    display: grid; gap: 12px; align-items: center; min-width: 640px;
    grid-template-columns: minmax(170px, 1.5fr) minmax(170px, 1.6fr) minmax(100px, .8fr) minmax(160px, 1.4fr);
    padding: 9px 16px; border-bottom: 1px solid var(--border);
  }
  .overview-row:last-child { border-bottom: 0; }
  .overview-row.head {
    padding-top: 8px; padding-bottom: 8px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }
  .overview-feature {
    min-width: 640px; padding: 9px 16px 5px; font-size: 12px; font-weight: 600;
    color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .overview-cmd { font-weight: 600; color: var(--command); text-decoration: none; }
  .overview-cmd:hover { text-decoration: underline; }
  .overview-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .overview-rules { font-size: 12px; font-weight: 600; color: var(--rule); }

  /* ---------- rule map ---------- */
  .rulemap-feature { margin: 22px 0 10px; font-size: 13px; color: var(--muted); }
  .rulemap-feature:first-child { margin-top: 0; }
  .rulemap-row { display: flex; align-items: flex-start; gap: 12px; }
  .rulemap-cmd { flex: 0 0 190px; padding-top: 2px; }
  .rulemap-arrow { flex: 0 0 16px; color: var(--muted); padding-top: 6px; text-align: center; }
  .rulemap-rules { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .rulemap-events { flex: 0 0 180px; display: flex; flex-direction: column; gap: 6px; }
  .rulemap-rule {
    border-left: 3px solid var(--rule); background: var(--rule-soft);
    border-radius: 0 6px 6px 0; padding: 6px 10px; font-size: 12px; line-height: 1.5;
  }

  /* ---------- event model ----------
     A band of lanes like a lifecycle's: cards placed from computed
     geometry, the wires one SVG laid under them. */
  .em-scroll { overflow-x: auto; padding-bottom: 6px; }
  .em-band { position: relative; }
  .em-lane { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .em-lane.payload { background: var(--surface); }
  .em-lane.decide { background: var(--command-soft); }
  .em-lane.events { background: var(--event-soft); }
  .em-lane.events + .em-lane.events { border-top-style: dashed; }
  .em-lane-label {
    position: absolute; left: 12px; width: 120px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted); line-height: 1.4;
  }
  .em-lane-label .tech { display: block; margin: 2px 0 0; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .em-wires, .em-wires svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .em-wires { pointer-events: none; }
  .em-card {
    position: absolute; box-sizing: border-box; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); font-size: 13px; line-height: 18px; overflow: hidden;
  }
  .em-card .title { font-weight: 600; cursor: pointer; }
  .em-card .title:hover { text-decoration: underline; }
  .em-card .line { font-size: 12px; line-height: 16px; color: var(--muted); }
  .em-card.payload { background: var(--surface); border-color: var(--border-strong); }
  .em-card.payload .field { font-family: var(--mono); font-size: 11px; line-height: 20px; color: var(--muted); display: flex; gap: 6px; }
  .em-card.payload .field::after { content: ""; flex: 1; border-bottom: 1px solid var(--border-strong); margin-bottom: 5px; }
  .em-card.command { background: var(--surface); border-color: var(--command); }
  .em-card.command .title { color: var(--command); }
  .em-card.command .rules { font-size: 12px; font-weight: 600; color: var(--rule); }
  .em-card.read { background: var(--entity-soft); border-color: var(--entity); }
  /* The orange and green tokens are fills; as text on a light card they
     fall short of legible, so light mode takes the darker shade the
     chips use, and dark mode the token, which is already light. */
  .em-card.read .title { color: #15803d; }
  body.f-dark .em-card.read .title { color: var(--entity); }
  .em-card.event { background: var(--surface); border-color: var(--event); }
  .em-card.event .title { color: #c2410c; }
  body.f-dark .em-card.event .title { color: var(--event); }
  .em-card.event .line { font-family: var(--mono); font-size: 11px; }

  /* ---------- lifecycles ----------
     States as bubbles on an open band, one band per entity; the wires
     are an SVG laid under the nodes, drawn from the same computed
     geometry the nodes are placed by. The commands allowed at a state
     wait in a popover until the state is hovered, focused or pinned. */
  .lc-machine { margin-bottom: 6px; }
  .lc-cluster { display: flex; align-items: center; gap: 9px; margin: 14px 0 0; }
  .lc-cluster .lc-ename {
    display: inline-flex; align-items: center; gap: 7px;
    border: 0; background: none; padding: 0; font: inherit;
    font-size: 15px; font-weight: 600; color: inherit; cursor: pointer;
  }
  .lc-cluster .lc-ename:hover { color: var(--entity); }
  .lc-scroll { overflow-x: auto; }
  .lc-band { position: relative; }
  .lc-wires, .lc-wires svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lc-wires { pointer-events: none; }

  .lc-hot { position: absolute; }
  .lc-node {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1.5px solid var(--entity); border-radius: 999px; background: var(--surface);
    font: inherit; cursor: pointer; padding: 0 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
  }
  .lc-hot:hover .lc-node, .lc-hot:focus-within .lc-node, .lc-hot.on .lc-node {
    background: var(--entity-soft);
  }
  .lc-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lc-node .st {
    font-size: 13px; font-weight: 600; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .lc-node .cap {
    font-size: 9px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); white-space: nowrap;
  }
  .lc-hot.terminal .lc-node { outline: 1.5px solid var(--entity); outline-offset: 3px; }
  .lc-hot.terminal .lc-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
  .lc-badge {
    position: absolute; top: -8px; right: -6px; z-index: 1;
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-family: var(--mono); font-weight: 600;
    background: var(--command-soft); border: 1px solid var(--command); color: var(--command);
  }

  .lc-elabel {
    position: absolute; display: inline-flex; align-items: center; gap: 5px;
    transform: translateX(-50%); white-space: nowrap;
  }
  .lc-loop {
    position: absolute; transform: translateX(-50%);
    font-size: 10px; font-family: var(--mono); color: var(--event); white-space: nowrap;
  }
  .lc-dot {
    display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%;
    background: var(--rule-soft); border: 1.5px solid var(--rule); cursor: help;
  }

  .lc-pop {
    display: none; position: absolute; top: calc(100% + 9px); left: 50%;
    transform: translateX(-50%); z-index: 6;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 9px 12px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); min-width: 230px;
  }
  .lc-pop::before {
    content: ""; position: absolute; top: -5px; left: 50%; margin-left: -5px;
    width: 9px; height: 9px; background: var(--surface);
    border-left: 1px solid var(--border-strong); border-top: 1px solid var(--border-strong);
    transform: rotate(45deg);
  }
  .lc-hot:hover .lc-pop, .lc-hot:focus-within .lc-pop, .lc-hot.on .lc-pop { display: block; }
  .lc-rows h4 { margin: 0 0 2px; }
  .lc-rows h4 + h4, .lc-rows .lc-prow + h4 { margin-top: 8px; }
  .lc-prow {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.9; white-space: nowrap;
  }
  .lc-prow .cmd {
    font: inherit; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--command); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lc-prow .cmd:hover { text-decoration: underline; }
  .lc-prow .to { flex: none; color: var(--event); font-weight: 600; }
  .lc-none { font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; }
  .lc-warn { font-size: 10.5px; font-family: inherit; color: var(--rule); white-space: nowrap; }

  /* A compact machine is one grid row, so its caveat has to span the
     whole of it rather than sit in a column. */
  .lc-rowwarn { grid-column: 1 / -1; margin-top: 5px; }

  /* The promotion offer, and the form it opens. Both are questions
     rather than statements, which is why neither looks like a card of
     something already decided. */
  .lc-suggest { border-style: dashed; }
  .ident .lc-offer { align-items: flex-start; }
  .ident .lc-offer > .tiny { flex: 1 1 320px; }
  .lc-suggest .why { margin-bottom: 7px; }
  .fieldrow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    padding: 4px 0; font-size: 12px;
  }
  .fieldrow > .nm { min-width: 130px; color: var(--muted); font-size: 11px; }
  .fieldrow > input { flex: 0 1 200px; }

  .lc-fn { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .lc-fn .op { font-family: var(--mono); font-size: 10.5px; }
  .lc-fn .lc-dot { vertical-align: baseline; margin-right: 2px; }

  /* ---------- code ---------- */
  .surface {
    display: inline-flex; height: 30px; flex: none;
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .surface button {
    display: inline-flex; align-items: center; gap: 5px; padding: 0 11px;
    font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .surface button + button { border-left: 1px solid var(--border); }
  .surface button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .surface button:not(.on):hover { color: var(--text); background: var(--bg); }
  .surface-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--event); }
  @media (max-width: 760px) {
    .surface { height: 40px; }
    .surface button { padding: 0 9px; }
  }
  .code-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .code-bar .grow { flex: 1; }
  .code-controls { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .code-status .code-bad, .code-status .code-stale { color: var(--danger); }
  .code-status .code-dirty { color: var(--event); }
  .code-editor, .code-text {
    width: 100%; height: calc(100vh - var(--topbar-h, 90px) - 230px); min-height: 360px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  }
  .code-editor { overflow: hidden; }
  .code-editor .code-read-hint { color: var(--muted); }
  .code-text {
    display: block; resize: vertical; padding: 10px 12px; color: var(--text);
    font-size: 12.5px; line-height: 19px; tab-size: 2; white-space: pre; overflow: auto;
  }
  .code-problems { margin-top: 10px; }
  .code-problems .issue .mono { color: var(--muted); font-size: 11px; }
  .code-problems .issue .why { flex: 1; white-space: pre-line; }
  .diag-mark.err { color: var(--danger); }
</style>
</head>

  <div class="app-bar">

            onclick="closeForms(); state.splash = true; render();">

</footer>
<div id="modal-host"></div>
<div id="palette-host"></div>

<script src="model.js"></script>
<script src="evaluate.js"></script>

<script src="shared.js"></script>
