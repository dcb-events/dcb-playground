// ---------- picking an operand ----------
//
// Most operands are chosen from what is in scope, but a literal is
// typed, so the picker carries one extra row for it. Choosing that row
// swaps in a text input; the text lives beside the choice in the

  if (operand !== null && typeof operand === 'object') {
    draft[key] = JSON.stringify(operand);

    draft[key] = LITERAL;
    draft[key + 'Text'] = String(operand);

// takes the pick when the row is one of its own.

// the draft must hold whatever the closed face shows. A `<select>`
// already showing a row fires nothing when that row is picked, so a

// with one row, a dead end: "a value…" on show and no box to type in.
// So the draft takes the first row — a value before a "+ New…" door,

      class: 'btn ghost tiny',
      onclick: () => { entries.push(''); draft.touched = true; render(); },
    }, '+ value'),
  ];
}

// Everything readable at a given point in a command's boundary: the
// payload, and the bindings declared *above* this one. A binding may
// only draw from what came before it, so the list is what makes that
// rule visible instead of only enforced.
function operandChoicesAbove(model, slice, index) {
  const out = [...payloadChoices(model, slice.payload)];
  slice.reads.slice(0, index === undefined ? undefined : index).forEach((b) => {
    if (b.projection) {
      out.push([JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]);
      return;
    }
    const entity = model['entity-definitions'][b.entity];
    (entity ? entity.properties : []).forEach((p) =>
      out.push([JSON.stringify({ alias: b.alias, property: p.name }),
        memberWords(b.alias, p.name), entityIcon(model, b.entity)]));
  });
  return out;
}

// Narrows operand choices to one type, for the slots that know exactly
// what they need — an entity's identifier, a projection's parameter, a
// scripted argument. The same rule the emission fields and the rule
// editor's right side already apply: a course is never identified by a
// student id, so the picker does not offer it. `list: true` admits
// list-typed operands alongside singular ones — on an id slot a list
// of the right type is the fan-out, not a mismatch.
function choicesOfType(model, slice, choices, propertyType, { list } = {}) {
  return choices.filter(([v]) => {
    const resolved = resolveOperandType(JSON.parse(v),
      { boundary: slice.reads, commandProperties: slice.payload, model });
    return resolved && resolved.propertyType === propertyType
      && (list || !resolved.isList);
  });
}

// ---------- small helpers ----------

function patch(kind, name, mutate) {
  const model = activeModel();
  const body = deepClone(model[DEF_COLLECTIONS[kind]][name]);
  mutate(body);
  run(() => updateDefinition(kind, model.id, name, body));
}
const patchSlice = (mutate) => patch('command-definition', state.slice, mutate);

// One form for renaming any definition kind: PascalCases the input,
// clears its own state flag, routes through `renameDefinition` (which
// rewrites every reference in the same append) and repoints whatever
// view state was keyed by the old name via `after`. `warn` runs first
// for the kinds that owe one — an event read by scripted handlers.
function renameDefinitionForm(model, kind, name, { stateKey, warn, after } = {}) {
  return inlineForm({
    question: 'Rename — every reference is rewritten with it', submitLabel: 'Rename',
    value: readable(name), showsIdentifier: true,
    onSubmit: (v) => {
      const next = toPascal(v);
      state[stateKey] = null;
      if (next && next !== name) {
        run(() => {
          if (warn) warn(next);
          renameDefinition(kind, model.id, name, next);
          if (after) after(next);
        });
      } else render();
    },
    onCancel: () => { state[stateKey] = null; render(); },
  });
}

// A name as a modeler reads it, with the stored identifier alongside
// once they have asked to see that sort of thing.
function named(name, cls) {
  return h('span', { class: cls || '' }, readable(name),
    advanced() ? h('span', { class: 'tech' }, name) : null);
}

// A thing has one page, and every mention of it is the way there. It
// replaces what it was next to rather than sliding in over it: two
// things half on screen is how the old panel got unreadable, and the
// rail keeps the way back.
function openEntity(name) {
  closeForms();
  state.entitiesCollapsed = false;
  state.view = 'entity';
  state.entity = name;
  render();
}

// Every mention of a thing, anywhere: its mark, its name, and the way
// in. One shape across all four kinds, so the mark is worth learning
// and a chip fix — a title, a keyboard affordance — lands everywhere
// at once. What varies per kind is the mark and the way in.
function refChip(name, { cls, icon, onOpen, text }) {
  return h('span', {
    class: cls, title: 'Open ' + readable(name),
    onclick: onOpen,
  }, icon ? h('i', { class: 'ic' }, icon) : null,
    text === undefined ? readable(name) : text);
}

function entityRef(model, name, { cls = 'chip entity', text } = {}) {
  return refChip(name, { cls, icon: entityIcon(model, name), onOpen: () => openEntity(name), text });
}

// An event has its own page too, for the same reason an entity does:
// it is named from more than one place — a command's publish list, an
// entity's or a projection's handlers, a scenario's Given — and every
// one of those is the way there.
function goToEvent(name) {
  closeForms();
  state.view = 'events';
  state.openEvent = name;
  state.land = `[data-key="${CSS.escape('event:' + name)}"]`;
  render();
}
function eventRef(model, name, { cls = 'chip event linkable', text } = {}) {
  return refChip(name, { cls, icon: eventIcon(model, name), onOpen: () => goToEvent(name), text });
}

// A custom type has no page of its own — it lives as a card in Custom
// Types — so opening one means landing on that card rather than
// switching to a dedicated view the way an entity or event does.
function goToCustomType(name) {
  closeForms();
  state.view = 'types';
  state.land = `[data-key="${CSS.escape('type:' + name)}"]`;
  render();
}

function goToCommand(name) {
  closeForms();
  state.view = 'slice';
  state.slice = name;
  state.tab = 'definition';
  render();
}
function commandRef(model, name, { cls = 'chip command linkable', text } = {}) {
  return refChip(name, { cls, icon: commandIcon(model, name), onOpen: () => goToCommand(name), text });
}

function goToProjection(name) {
  openProjection(activeModel(), name);
  render();
}

// The whole machine, from the row that shows a shrunk one. Lands on the
// entity's own band rather than the top of the page — a model with six
// lifecycles would otherwise answer "it is somewhere below".
function goToLifecycles(entityName) {
  closeForms();
  state.view = 'lifecycles';
  state.land = `[data-key="${CSS.escape('lifecycle:' + entityName)}"]`;
  render();
}
// A projection has no mark of its own — nothing passes an icon.
function projectionRef(model, name, { cls = 'chip projection linkable', text } = {}) {

}

// A specific scenario, wherever it is shown, is always reached the
// same way — see `problems`, which this mirrors.
function goToScenario(model, key) {
  const body = model['scenario-definitions'][key];
  if (!body) return;
  closeForms();
  state.view = 'slice';
  state.slice = body.command;
  state.tab = 'scenarios';
  state.openScenarios.add(key);
  render();
}
// A projection, opened wherever it is listed: on its entity's page when
// something binds it, on Projections when nothing does. Derived rather
// than stored, so a projection moves between the two on its own when a
// binding is added or dropped.
// Does not repaint: every caller sets more state after it, and two
// repaints for one gesture is how focus gets dropped — the second one
// measures where focus went during the first rather than where it was.
function openProjection(model, projection, { tab = 'definition' } = {}) {
  const body = model['projection-definitions'][projection];
  if (!body) return false;
  // A row already open on this projection keeps whatever is half
  // written in it: arriving at one of its scenarios is not a reason to
  // discard an edit to the definition above them.
  const open = state.projDraft && state.projDraft.name === projection ? state.projDraft : null;
  closeForms();
  const bound = boundAs(model, projection)[0];
  if (bound) {
    state.view = 'entity';
    state.entity = bound.entity;
  } else {
    state.view = 'projections';
  }
  state.projDraft = open || { name: projection, body: projectionDraftFrom(body) };
  state.projTab = tab;
  return true;
}

// A scenario is opened in the Checks tab of the first projection it
// reads. Every projection it reads lists it — one Given asserting four
// values is one scenario, shown under all four — so any of them would
// do; the first is simply the one this picks.
function goToProjectionScenario(model, key) {
  const body = model['projection-scenario-definitions'][key];
  if (!body) return;
  if (!openProjection(model, body.projection, { tab: 'checks' })) return;
  state.openProjectionScenarios.add(key);
  render();
}

function typeChoices(model) {
  if (advanced()) return allTypeNames(model);
  return [...SIMPLE_TYPES, ...Object.keys(model['entity-definitions']).sort().map((n) => idTypeOf(model, n))];
}
function typeOptions(model) {
  return typeChoices(model).map((t) => [t, readable(t)]);
}

// An option built as "🔖 Name" reads fine, but a native <option> has
// no separate accessible label — arrow-key type-ahead searches the
// same text a screen reader gets, so it can only ever match the first
// character actually typed, which there is the icon. So a caller with
// a mark passes it as the option's third element, and `pick` puts the
// name first in the text with the mark in its own trailing span (the
// customizable-<select> CSS in shared.css puts it back in front
// visually, where the browser has one). Passed, never
// detected: an earlier design regex-matched an emoji prefix out of
// the text, which tore modifier sequences ("👮🏻‍♀️") into parts and
// let a mark that is not an emoji at all ("﹟" is one) slip past — a
// mark is whatever was typed, so only the caller knows where it ends.

// The same "alias · property" text that makes a flat list readable —
// "given · course id", "course · capacity", "status · Existent" —
// says exactly where an <optgroup> belongs: one per alias, holding
// just the properties, so a list naming three things a command read
// stops looking like nine unrelated rows. A prefix with only one
// property under it stays a plain option in its full "alias ·
// property" form — a group of one is not a group, and the context
// would otherwise be lost.
const GROUP_SEP = ' · ';

// A token option — a path into the event, not a name — is the one kind
// the text convention cannot express: it groups by what it *is*
// (`event`, `successor`) rather than by a prefix of its text, and the
// open list may show it short (`capacity`, under `event`) while
// anywhere it stands alone it must read whole (`event.data.capacity`).
// So a caller passes it as an option's fourth element,
// `{ group, before, after }`: `pick` puts the context in `.ctx` spans
// around the name, which the customizable-<select> CSS hides in the
// open list and shows in the closed face. Without that CSS the
// option's text is the whole token, which is also what type-ahead
// and a screen reader get.
function pick(options, value, onchange, placeholder) {
  const sel = h('select', { onchange: (e) => onchange(e.target.value) });
  if (placeholder) sel.appendChild(h('option', { value: '' }, placeholder));

  const buckets = new Map(); // prefix -> [{v, suffix, icon}]
  const sequence = []; // {text} | {prefix} | {token group}, in first-seen order
  for (const o of options) {
    const [v, text, icon, token] = Array.isArray(o) ? o : [o, o];
    if (token) {
      const key = '\0' + token.group;
      if (!buckets.has(key)) { buckets.set(key, []); sequence.push({ token: token.group, key }); }
      buckets.get(key).push({ v, suffix: text, icon, token });
      continue;
    }
    const at = text.indexOf(GROUP_SEP);
    if (at === -1) { sequence.push({ v, text, icon }); continue; }
    const prefix = text.slice(0, at);
    if (!buckets.has(prefix)) { buckets.set(prefix, []); sequence.push({ prefix }); }
    buckets.get(prefix).push({ v, suffix: text.slice(at + GROUP_SEP.length), icon });
  }

  const appendOption = (parent, v, text, icon, token) => {
    const label = token
      ? h('span', { class: 'token' },
          token.before ? h('span', { class: 'ctx' }, token.before) : null,
          text,
          token.after ? h('span', { class: 'ctx' }, token.after) : null)
      : text;
    if (icon) {
      parent.appendChild(h('option', { value: v, selected: v === value },
        token ? label : h('span', { class: 'label' }, text),
        h('span', { class: 'icon' }, icon)));
    } else {
      parent.appendChild(h('option', { value: v, selected: v === value }, label));
    }
  };

  for (const entry of sequence) {
    if ('text' in entry) { appendOption(sel, entry.v, entry.text, entry.icon); continue; }
    // A token group is a group even with one row in it: its label is
    // the context the short option leans on, not a prefix it repeats.
    if ('token' in entry) {
      const group = h('optgroup', { label: entry.token });
      for (const row of buckets.get(entry.key)) appendOption(group, row.v, row.suffix, row.icon, row.token);
      sel.appendChild(group);
      continue;
    }
    const rows = buckets.get(entry.prefix);
    if (rows.length === 1) {
      appendOption(sel, rows[0].v, entry.prefix + GROUP_SEP + rows[0].suffix, rows[0].icon);
      continue;
    }
    // The rows under one alias all carry that entity's mark, so it
    // moves up into the group label — a label is not an option, so it
    // sits outside type-ahead's reach and is free to lead with the mark.
    const group = h('optgroup', {
      label: (rows[0].icon ? rows[0].icon + ' ' : '') + entry.prefix,
    });
    for (const { v, suffix } of rows) appendOption(group, v, suffix);
    sel.appendChild(group);
  }

  // The face a customizable <select> shows when closed: a copy of the
  // picked option's markup rather than its flattened text. Every select
  // gets one, so every select is styled alike (see shared.css).
  sel.insertBefore(h('button', {}, h('selectedcontent', {})), sel.firstChild);
  return sel;
}

// The one thing that replaces every prompt(): a labelled field, a live
// preview of what it will be stored as, and two buttons.
function inlineForm({ question, placeholder, value = '', showsIdentifier, submitLabel, onSubmit, onCancel }) {
  let text = value;
  const preview = h('span', { class: 'becomes' }, '');
  const paint = () => {
    preview.innerHTML = '';
    if (showsIdentifier && text.trim()) preview.appendChild(document.createTextNode('→ ' + toPascal(text)));
  };
  const input = h('input', {
    type: 'text', value, placeholder, style: 'width:280px',
    oninput: (e) => { text = e.target.value; paint(); },
    onkeydown: (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
    },
  });
  const submit = () => {
    if (!text.trim()) return toast('Give it a name.', true);
    onSubmit(text.trim());
  };
  paint();
  setTimeout(() => input.focus(), 0);
  return h('div', { class: 'inline-form' },
    question ? h('div', { class: 'q' }, question) : null,
    h('div', { class: 'adder' }, input, preview,
      h('button', { class: 'btn primary', onclick: submit }, submitLabel || 'Add'),
      h('button', { class: 'btn ghost', onclick: onCancel }, 'Cancel')));
}

// Every form that can be open: something being named, renamed, or
// filled in. They are listed rather than written out one by one because
// Escape has to know whether any of them is on screen, and the two
// answers must not drift apart.
const FORM_KEYS = [
  'namingCommand', 'newFeature', 'renamingFeature', 'newEntityAt', 'addingProp', 'addingMember',
  'renamingEntity', 'iconPicker', 'eventIconPicker', 'commandIconPicker', 'confirmRemove', 'newType', 'renamingType',
  'newProjection', 'renamingProjection', 'projDraft', 'newEvent', 'renamingEvent',
  'renamingCommand', 'editMember', 'editRule', 'editGuard', 'editBinding',
  'scenarioDraft', 'sandboxDraft',
  'projectionScenarioDraft',
  'pendingImport',
  'promoting', 'designating',
];

// What a form was holding while it was open. These outlive the form
// that filled them — a folded-away adder leaves its half-written row
// behind — so they are cleared with the forms but never taken as
// evidence that one is open.
const DRAFT_KEYS = ['bindingDraft', 'ruleDraft', 'changeDraft',
  'watchDraft', 'fieldDraft', 'promoteDraft'];

const formOpen = () => FORM_KEYS.some((key) => state[key]);

const closeForms = () => {
  // A named field that was never confirmed is confirmed by leaving it —
  // and every gesture that moves on comes through here. Committed
  // before the wipe below, or the wipe would be the loss this exists
  // to prevent. `state.wizard` is deliberately not on either list: it
  // is not a form, and closing forms must not un-reveal the page.
  commitPendingField();
  for (const key of [...FORM_KEYS, ...DRAFT_KEYS]) state[key] = null;
  state.sel = null; state.adder = null; state.lit = null; state.queryPop = null;
  state.hintPop = null; state.lcMenu = null;
};

// ---------- rail ----------

// The command being dragged out of the rail list, module-level for the
// Every feature heading *and* every command row under one carries its
// group as `data-feature` — the whole group is the target, since
// within a group commands sit alphabetically and a drop can only mean
// "into this group". The grip below hit-tests these as it moves and
// fills the element under the pointer; the group the command already
// sits in is not a target — a drop there would do nothing, so nothing
// lights up.
function featureDropTarget(featureName) {
  return { 'data-feature': featureName };
}

// The ⠿ grip a rail command is dragged by, on any pointer. Direct DOM
// until the drop, for the same reason `gripDrag` demands it: nothing
// may repaint mid-drag, and the stand-in Ungrouped target has to
// appear right now.
function commandGrip(model, name) {
  let over = null;
  const paint = (el) => {
    if (el === over) return;
    if (over) over.classList.remove('drop-into');
    over = el;
    if (over) over.classList.add('drop-into');
  };
  const targetUnder = (under) => {
    const el = under && under.closest('[data-feature]');
    if (!el) return null;
    const feature = el.getAttribute('data-feature');
    return featureOf(model['command-definitions'][name]) === feature ? null : el;
  };
  return gripDrag({
    title: 'Drag onto a feature to move this command there',
    onStart: (e) => {
      e.currentTarget.closest('a').classList.add('dragging');
      e.currentTarget.closest('.rail').classList.add('dragging-cmd');
    },
    onMove: (under) => paint(targetUnder(under)),
    onEnd: (e) => {
      paint(null);
      e.currentTarget.closest('a').classList.remove('dragging');
      e.currentTarget.closest('.rail').classList.remove('dragging-cmd');
    },
    onDrop: (under) => {
      const el = targetUnder(under);
      if (el) moveToFeature(model, name, el.getAttribute('data-feature'));
    },
  });
}

function renderRail() {
  const model = activeModel();
  const rail = document.getElementById('rail');
  // Only meaningful on a narrow screen — off-canvas there, an ordinary
  // column everywhere else, entirely by CSS. See `.rail` / media query.
  rail.classList.toggle('open', !!state.railOpen);
  document.getElementById('rail-backdrop').classList.toggle('open', !!state.railOpen);
  rail.innerHTML = '';
  // Where a model opens, so it heads the rail rather than sitting with
  // Coupling and the rest: those read across every command for one
  // question each, this one answers "what is in here" before any other.
  rail.appendChild(h('a', {
    href: '#', class: state.view === 'overview' ? 'on' : '', style: 'margin-bottom:16px',
    onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'overview'; render(); },
  }, 'Overview'));
  rail.appendChild(h('h4', {}, 'Features'));

  for (const group of featureGroups(model)) {
    if (state.renamingFeature === group.name) {
      rail.appendChild(inlineForm({
        question: 'Rename this feature', value: group.name, submitLabel: 'Rename',
        onSubmit: (v) => { renameFeature(model, group.name, v); },
        onCancel: () => { state.renamingFeature = null; render(); },
      }));
    } else {
      const collapsed = !!state.collapsed[group.name];
      rail.appendChild(h('div', { class: 'group', ...featureDropTarget(group.name) },
        h('span', {
          class: 'caret', onclick: () => { state.collapsed[group.name] = !collapsed; render(); },
        }, collapsed ? '▸' : '▾'),
        h('span', {
          class: 'gname',
          title: group.name === UNGROUPED ? '' : 'Rename',
          onclick: () => {
            if (group.name === UNGROUPED) return;
            closeForms(); state.renamingFeature = group.name; render();
          },
        }, group.name),
        // Not a count: the way in. A command belongs to a feature, so
        // the feature heading is where one gets added to it.
        h('button', {
          class: 'btn tiny gadd', title: 'Add a command to this feature',
          onclick: () => {
            state.collapsed[group.name] = false;
            beginNewCommand(model, group.name);
          },
        }, '+'),
        // A feature is not a definition — it exists because commands
        // name it — so removing one leaves its commands where they are,
        // ungrouped.
        group.name === UNGROUPED ? null : h('span', {
          class: 'rm' + (state.confirmRemove === 'feature:' + group.name ? ' on' : ''),
        },
          removeButton('feature:' + group.name, {
            title: 'Remove this feature. Its commands stay, ungrouped.',
            onRemove: () => removeFeature(model, group.name),
          }))));
      if (collapsed) continue;
    }

    for (const name of group.commands) {
      rail.appendChild(h('a', {
        href: '#', class: 'cmd' + (name === state.slice && state.view === 'slice' ? ' on' : ''),
        // Only the name. What this command records is on the page it
        // opens, where it can be changed; the stored identifier waits
        // for the pointer rather than sitting under every row.
        title: name,
        // Dragging the grip onto a feature — its heading or any command
        // in it — is how a command changes feature; the page it opens
        // only states which one. Every row is a target for its group.
        ...featureDropTarget(group.name),
        onclick: (e) => {
          e.preventDefault(); closeForms();
          state.slice = name; state.openEvent = null; state.view = 'slice'; render();
        },
      }, h('i', { class: 'ic' }, commandIcon(model, name)), readable(name),
        h('span', { class: 'grow' }), commandGrip(model, name)));
    }
    if (!group.commands.length) rail.appendChild(h('div', { class: 'gempty' }, 'nothing in it yet'));
    // Naming a command headed for this feature happens right under it —
    // the answer lands where the question was asked.
    if (state.namingCommand === group.name) rail.appendChild(newCommandForm(model));
  }

  // With the picker gone, dropping is the only way out of a feature —
  // so when nothing is ungrouped (the catch-all group not rendered), a
  // stand-in target appears, but only while a command is in the air.
  if (!featureGroups(model).some((g) => g.name === UNGROUPED)) {
    rail.appendChild(h('div', { class: 'group drop-stub', ...featureDropTarget(UNGROUPED) },
      h('span', { class: 'caret' }),
      h('span', { class: 'gname' }, UNGROUPED)));
  }

  rail.appendChild(h('div', { class: 'add' },
    h('button', { class: 'btn', onclick: () => beginNewCommand(model) }, '+ Command'),
    h('button', {
      class: 'btn ghost', onclick: () => { closeForms(); state.newFeature = true; render(); },
    }, '+ Feature')));

  if (state.namingCommand === true) rail.appendChild(newCommandForm(model));

  if (state.newFeature) {
    rail.appendChild(inlineForm({
      question: 'Feature name',
      placeholder: 'feature name',
      onSubmit: (v) => {
        if (featureGroups(model).some((g) => g.name === v)) return toast('That feature already exists.', true);
        addPendingFeature(v); state.newFeature = false; render();
      },
      onCancel: () => { state.newFeature = false; render(); },
    }));
  }

  // Projections are advanced by nature, but a model that already has
  // one has to offer a way in whatever mode you are in — otherwise the
  // model holds something the interface refuses to show.
  const projectionNames = Object.keys(model['projection-definitions']);
  {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Model'));
    // The things themselves are not an advanced idea: a first model is
    // mostly deciding what they are. Only what a modeler never has to
    // state — value types, identifier schemas — waits for Advanced.
    //
    // They are listed one by one, like the commands above: a thing has
    // a page, and the rail is where you get to it and where you see
    // how many of them the model has grown.
    rail.appendChild(renderEntityRail(model));
    if (advanced()) {
      rail.appendChild(h('a', {
        href: '#', class: state.view === 'types' ? 'on' : '',
        title: Object.keys(model['custom-type-definitions']).length + ' declared',
        onclick: (e) => {
          e.preventDefault(); closeForms();
          state.view = 'types'; render();
        },
      }, 'Custom types'));
    }
    if (advanced() || projectionNames.length) rail.appendChild(h('a', {
      href: '#', class: state.view === 'projections' ? 'on' : '',
      // A slice that binds a projection points here: the projection is
      // the source, and it lives nowhere else on that page.
      'data-src': projectionNames.map((n) => 'projection:' + n).join(' ') || null,
      title: projectionNames.length
        ? projectionNames.map(readable).join(', ')
        : 'nothing projected outside an entity yet',
      onclick: (e) => {
        e.preventDefault(); closeForms();
        state.view = 'projections'; render();
      },
    }, 'Projections'));
    const eventNames = Object.keys(model['event-definitions']);
    if (advanced() || eventNames.length) rail.appendChild(h('a', {
      href: '#', class: state.view === 'events' ? 'on' : '',
      'data-src': eventNames.map((n) => 'event:' + n).join(' ') || null,
      title: eventNames.length ? eventNames.map(readable).join(', ') : 'nothing recorded yet',
      onclick: (e) => {
        e.preventDefault(); closeForms();
        state.view = 'events'; render();
      },
    }, 'Events'));
  }

  // None of these is a definition of its own — each reads across
  // every command at once rather than living on any one of theirs,
  // the way Events reads across every command that publishes one. And
  // unlike Events, none holds anything a simple model would ever
  // need to reach — so there is no "or it already has one" exception.
  if (advanced() && Object.keys(model['command-definitions']).length) {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Overview'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'coupling' ? 'on' : '',
      title: 'Which commands write or read back which events',
      onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'coupling'; render(); },
    }, 'Coupling'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'rulemap' ? 'on' : '',
      title: 'Every command, its rules, and what it records',
      onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'rulemap'; render(); },
    }, 'Rule map'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'eventmodel' ? 'on' : '',
      title: 'The commands on a timeline, with their payloads, events and read models',
      onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'eventmodel'; render(); },
    }, 'Event model'));
    rail.appendChild(h('a', {
      href: '#', class: state.view === 'lifecycles' ? 'on' : '',
      title: 'Each entity’s status as a state machine',
      onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'lifecycles'; render(); },
    }, 'Lifecycles'));
  }

  // The sandbox belongs to no definition, so it hangs off nothing in
  // the lists above. It is last because it is where you go once there
  // is something to try.
  rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Try it'));
  rail.appendChild(h('a', {
    href: '#', class: 'sandbox' + (state.view === 'sandbox' ? ' on' : ''),
    title: session.log.length
      ? session.log.length + ' event' + (session.log.length === 1 ? '' : 's') + ' in this session'
      : 'Drive the commands and watch what happens',
    onclick: (e) => { e.preventDefault(); closeForms(); state.view = 'sandbox'; render(); },
  }, h('span', { class: 'grow' }, 'Sandbox'), session.log.length
    ? h('span', { class: 'gcount' }, session.log.length)
    : null));


  // Where an entity ends up once the last thing that used it is gone.
  // Nothing references it, so this is the one place its removal can
  // never be refused. An orphaned event is not shown here any more —
  // the Events page above is now the one place for those, recorded or
  // not.
  const loose = orphans(model);
  if (loose.entities.length) {
    rail.appendChild(h('h4', { style: 'margin-top:20px' }, 'Nothing uses these'));
    const looseRow = (kind, name, chip) => rail.appendChild(
      qrow('div', { cls: 'loose', key: 'loose:' + name }, chip, h('span', { style: 'flex:1' }),
        reveal(removeButton(kind + ':' + name, {
          title: 'Remove this definition', onRemove: () => run(() =>
            removeDefinition('entity-definition', model.id, name)),
        }))));
    for (const n of loose.entities) {
      looseRow('entity', n, entityRef(model, n));
    }
  }
}

// The things themselves, in the rail: one entry each, under a heading
// that folds them away — the same two levels the features above use,
// because they are read the same way.
function renderEntityRail(model) {
  const names = Object.keys(model['entity-definitions']).sort();
  const collapsed = state.entitiesCollapsed;
  const toggle = () => { state.entitiesCollapsed = !collapsed; render(); };
  const box = h('div', {});

  box.appendChild(h('div', { class: 'group' },
    h('span', { class: 'caret', onclick: toggle }, collapsed ? '▸' : '▾'),
    h('span', { class: 'gname', title: 'Show or hide', onclick: toggle }, 'Entities'),
    h('span', { class: 'gcount' }, names.length)));
  if (collapsed) return box;

  for (const name of names) {
    box.appendChild(h('a', {
      href: '#',
      class: 'cmd ent' + (state.view === 'entity' && state.entity === name ? ' on' : ''),
      title: name,
      onclick: (e) => { e.preventDefault(); openEntity(name); },
    }, h('i', { class: 'ic' }, entityIcon(model, name)), readable(name)));
  }
  if (!names.length) box.appendChild(h('div', { class: 'gempty' }, 'nothing modelled yet'));

  if (state.newEntityAt === 'rail') {
    box.appendChild(inlineForm({
      question: 'New entity', placeholder: 'entity name',
      showsIdentifier: true,
      onSubmit: (v) => {
        state.newEntityAt = null;
        const created = createEntity(model, v);
        if (created) openEntity(created);
      },
      onCancel: () => { state.newEntityAt = null; render(); },
    }));
  } else {
    box.appendChild(h('div', { class: 'add' }, h('button', {
      class: 'btn ghost',
      onclick: () => { closeForms(); state.newEntityAt = 'rail'; render(); },
    }, '+ Entity')));
  }
  return box;
}

// A command dropped on a feature heading in the rail. Landing on a
// still-pending (empty) feature makes it live — a command now names
// it — so the pending entry has served its purpose.
function moveToFeature(model, commandName, featureName) {
  const body = deepClone(model['command-definitions'][commandName]);
  if (!body || featureOf(body) === featureName) return;
  if (featureName === UNGROUPED) delete body.feature; else body.feature = featureName;
  run(() => {
    updateDefinition('command-definition', model.id, commandName, body);
    setPendingFeatures(pendingFeatures().filter((p) => p !== featureName));
  });
}

// The feature name comes off every command that carries it; the
// commands themselves are untouched.
function removeFeature(model, name) {
  run(() => {
    const changes = [];
    for (const [command, body] of Object.entries(activeModel()['command-definitions'])) {
      if (featureOf(body) !== name) continue;
      const next = deepClone(body);
      delete next.feature;
      changes.push({ kind: 'command-definition', name: command, body: next });
    }
    if (changes.length) updateDefinitions(model.id, changes);
    setPendingFeatures(pendingFeatures().filter((p) => p !== name));
  });
}

function renameFeature(model, from, to) {
  if (from === UNGROUPED || to === from) { state.renamingFeature = null; return render(); }
  run(() => {
    const changes = [];
    for (const [cmd, body] of Object.entries(activeModel()['command-definitions'])) {
      if (featureOf(body) !== from) continue;
      const next = deepClone(body);
      next.feature = to;
      changes.push({ kind: 'command-definition', name: cmd, body: next });
    }
    if (changes.length) updateDefinitions(model.id, changes);
    setPendingFeatures(pendingFeatures().filter((p) => p !== from).concat(to));
    state.renamingFeature = null;
  });
}

// ---------- describing a new command ----------

// Naming is the only thing a command cannot do without, so it is the
// only question asked up front — an inline field, not a page of its
// own. Everything else (what it takes, what it reads, what it decides,
// what it records) is added afterwards, on the command's own page,
// the same way it would be for a command that already existed.
//
// `namingCommand` holds where the answer will land: a feature name when
// the + on a heading asked the question (the form opens under it), or
// `true` from the plain "+ Command" button, where the feature is
// guessed from whichever command's page is open.
function beginNewCommand(model, feature) {
  closeForms();
  state.namingCommand = feature || true;
  render();
}

function newCommandForm(model) {
  return inlineForm({
    question: 'New command', placeholder: 'command name', showsIdentifier: true,
    onSubmit: (v) => createCommand(model, v),
    onCancel: () => { state.namingCommand = false; render(); },
  });
}

function createCommand(model, label) {
  const name = toPascal(label);
  if (!name) return toast('Give it a name.', true);
  const current = typeof state.namingCommand === 'string'
    ? state.namingCommand
    : state.slice && model['command-definitions'][state.slice]
      ? featureOf(model['command-definitions'][state.slice]) : UNGROUPED;
  // A command with nothing it records is not one the model can hold —
  // so a starting event comes along with it, guessed from the command's
  // own name the same way the event field always was. It is an ordinary
  // event from here on: rename it, retarget it, add fields to it, all
  // on this same page.
  const eventName = toPascal(suggestEventName(label));
  run(() => {
    if (!activeModel()['event-definitions'][eventName]) {
      addDefinition('event-definition', model.id, eventName, { properties: [] });
    }
    const body = {
      properties: [], boundary: [], conditions: [],
      publishes: [{ name: eventName, parameters: {} }],
    };
    if (current !== UNGROUPED) body.feature = current;
    addDefinition('command-definition', model.id, name, body);
    // A pending feature is one still waiting for a command; this one
    // just arrived (the drop path does the same).
    setPendingFeatures(pendingFeatures().filter((p) => p !== current));
    state.namingCommand = false;
    state.view = 'slice'; state.slice = name;
    // A brand-new command is the one moment its page reads best one
    // question at a time: the steps reveal as they are answered (or
    // skipped — an empty step is an answer too). Anyone reopening a
    // command later gets the whole page, which already reads as the
    // check-your-answers view. The event this command records exists
    // from the start — the model requires one — but it is *shown*, and
    // given its fields, only once the rules before it are settled.
    state.wizard = { slice: name, upto: 0 };
    // Straight into typing the first input — no click required to get
    // there.
    state.adder = 'in';
  });
}

// The order the wizard reveals a command's steps in, with what its
// "skip" reading is when the step is left empty. Emits and changes
// have no skip: a command must record something, and what its events
// change is the last thing revealed — revealing it is what ends the
// wizard, because from there the whole page is on screen.
const WIZARD_STEPS = [
  { key: 'trigger', paint: (m, s) => stepTrigger(m, s), empty: (s) => !s.payload.length, skipWords: 'takes no input' },
  // One step where there were two. A read is not a question anyone
  // wanted asked: it is what a rule needs, so it is answered by
  // answering the rule. The skip reading covers both halves, because a
  // command can look at nothing *and* have no rules — and, the other
  // way round, can look at something with no rule at all.
  { key: 'decide', paint: (m, s) => stepDecision(m, s), empty: (s) => !s.rules.length && !s.reads.length, skipWords: 'always allowed' },
  { key: 'emits', paint: (m, s) => stepEmits(m, s), empty: () => false },
  { key: 'changes', paint: (m, s) => stepChanges(m, s), empty: () => false },
];

function advanceWizard(model, slice) {
  const wizard = state.wizard;
  if (!wizard || wizard.slice !== slice.name) return;
  wizard.upto += 1;
  const revealed = (WIZARD_STEPS[wizard.upto] || {}).key;
  if (revealed === 'emits') {
    // The success event is defined now — after the rules, which is
    // when it is knowable — and it defaults to recording exactly what
    // the command was given.
    const first = slice.emits[0];
    if (first) {
      copyCommandPropertiesIntoEvent(model, slice.name, first.emission.name);
      state.openEvent = first.emission.name;
    }
  }
  if (revealed === 'changes') {
    prefillChangeAdder(model, slice);
    // Everything is on screen from here; the wizard has nothing left
    // to reveal, so the page simply is the page again.
    state.wizard = null;
  }
  if (wizard.upto >= WIZARD_STEPS.length - 1) state.wizard = null;
  render();
  if (revealed) focusWizardStep(revealed);
}

// Where the keyboard lands when a step is revealed: on the revealed
// step's own first way in, so answering a step and starting the next
// is Enter, type, Enter — never a reach for the mouse. Moving focus
// here is fine where moving it on a keystroke was not: revealing is
// the activation of a button, and a button is allowed to take you
// where it said it would.
//
// Emits is the exception — its defaults were just applied, so the
// step usually needs nothing, and the bar's Continue is the honest
// next thing to press. Anyone who does want to edit the event is one
// Shift+Tab from it.
function focusWizardStep(key) {
  setTimeout(() => {
    if (key === 'emits') {
      const bar = document.querySelector('.wizard-bar button');
      if (bar) { bar.focus(); return; }
    }
    const step = document.querySelector('.step.' + key);
    const target = step
      && step.querySelector('.flow-entry, .flow-adder, .adder select, .adder input, .adder button');
    if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
  }, 0);
}

// What the change adder opens holding when the wizard reveals it: the
// first bound entity's status, set to its first non-initial member —
// which is what the creating command of every shipped example records.
// A proposal, not a write: nothing lands until the row is submitted.
function prefillChangeAdder(model, slice) {
  const first = slice.emits[0];
  if (!first) return;
  const binding = slice.reads.find((b) => b.entity);
  const entity = binding && model['entity-definitions'][binding.entity];
  const property = entity && (entity.properties || []).find((p) => {
    const target = entityPropertyTarget(model, binding.entity, p.name);
    return target.projection && !scriptOf(target.projection) && !derivedOf(target.projection);
  });
  if (!property) return;
  const lifecycle = lifecycleOf(model, binding.entity);
  const designated = lifecycle
    && (entity.properties || []).find((p) => p.name === lifecycle.property);
  const chosen = designated || property;
  // The value that moves it off where it starts. For a boolean lifecycle
  // that is simply `true` — the whole of "and now it exists".
  let value = '';
  if (designated && lifecycle.isBoolean) {
    value = JSON.stringify(true);
  } else {
    const projection = entityPropertyTarget(model, binding.entity, chosen.name).projection;
    const members = projection ? enumMembersFor(model, projection.valueType) : null;
    if (members) {
      const initial = projection.initialValue && projection.initialValue.enumMember;
      const next = members.find((m) => m !== initial);
      if (next) value = JSON.stringify({ enumMember: next });
    }
  }
  state.adder = 'chg:' + first.emission.name;
  state.changeDraft = {
    eventName: first.emission.name,
    target: JSON.stringify([binding.entity, chosen.name]),
    operation: 'set', value,
  };
}

// The bar under the last revealed step: one primary button whose label
// says what continuing means right now — an empty step is skipped by
// name, not silently — and the way out for anyone who wants the whole
// page at once. Skipping is a decision, which is why it is a click.
function wizardBar(model, slice) {
  const wizard = state.wizard;
  const step = WIZARD_STEPS[wizard.upto];
  const skipping = step.empty(slice);
  // `flow-adder` puts the bar on the Up/Down path the rest of the page
  // already walks, so the arrows that move through rows and adders
  // reach Continue too.
  return h('div', { class: 'wizard-bar' },
    h('button', {
      class: 'btn primary flow-adder',
      onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
      onclick: () => { closeForms(); advanceWizard(model, slice); },
    }, skipping ? `Skip — ${step.skipWords} →` : 'Continue →'),
    h('button', {
      class: 'btn ghost tiny', title: 'Stop revealing step by step and show the whole command',
      onclick: () => { closeForms(); state.wizard = null; render(); },
    }, 'Show all steps'));
}

// ---------- the slice ----------

// A repaint tears #main down and rebuilds it, which drops whatever the
// keyboard was on — the element is gone, so the browser has nothing to
// blur from and focus falls back to the document, where the next Tab
// starts over at the top rather than continuing from where the user
// was. Restoring by position — the Nth focusable thing in #main, not
// which one it was — is what keeps Tab (and Shift+Tab) moving through
// the page instead of restarting at the command title on every edit.
function mainFocusStops() {
  const main = document.getElementById('main');
  if (!main) return [];
  return [...main.querySelectorAll('a[href], button, select, input, textarea, [tabindex]')]
    .filter((el) => !el.disabled && el.tabIndex !== -1 && el.offsetParent !== null);
}
function mainFocusRank() {
  const main = document.getElementById('main');
  if (!main || !main.contains(document.activeElement)) return null;
  const at = mainFocusStops().indexOf(document.activeElement);
  return at < 0 ? null : at;
}
function restoreMainFocusRank(rank) {
  if (rank === null) return;
  const stops = mainFocusStops();
  // `preventScroll` is the whole point of restoring by rank staying
  // invisible: the Nth stop after a repaint is often a different
  // element than before, and letting focus() bring it into view moved
  // the page under the reader on every edit.
  if (stops.length) stops[Math.min(rank, stops.length - 1)].focus({ preventScroll: true });
}

// A repaint, and the one thing that has to happen after every one of
// them whichever view it drew: bringing a row the interface moved you
// to on screen. It is out here because the painter below returns early
// once it knows which view it is drawing.
function render() {
  const focusRank = mainFocusRank();
  paintPage();
  restoreMainFocusRank(focusRank);
  sweepScriptEditors();
  if (!state.land) return;
  const selector = state.land;
  state.land = null;
  landOn(selector);
}

function paintPage() {
  const model = activeModel();
  // The splash also shows over a model that's still loaded — reached
  // from the brand mark, see the button below. Escape (and picking a
  // model, starting a new one, or loading one) clears `state.splash`
  // and lands back here with `model` unchanged.
  const showSplash = !model || state.splash;

  document.body.className = isDark() ? 'f-dark' : '';

  // Which model is open, front and center where the old dropdown used
  // to be. Off the splash it switches models, loads another, or starts
  // one; on the splash with a model still loaded, it is the way back
  // to it instead — no dialog needed for that trip.
  const modelSwitch = document.getElementById('model-switch');
  modelSwitch.innerHTML = '';
  modelSwitch.appendChild(h('button', {
    class: 'btn ghost', type: 'button',
    title: !model ? 'Load a model' : state.splash ? 'Back to ' + model.name : 'Switch or manage models',
    onclick: model && state.splash
      ? () => { state.splash = false; render(); }
      : () => { closeForms(); state.models = true; render(); },
  }, !model
    ? 'Load a model…'
    : state.splash
      ? ['← Back to ', h('span', { class: 'model-name' }, model.name)]
      : h('span', { class: 'model-name' }, model.name)));

  const tools = document.getElementById('tools');
  tools.innerHTML = '';
  const jump = document.getElementById('jump');
  jump.innerHTML = '';
  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  const menuToggle = document.getElementById('menu-toggle');
  menuToggle.innerHTML = '';

  document.querySelector('.layout').classList.toggle('no-rail', showSplash);

  if (showSplash) {
    // Nothing to search, share, or report a problem with while it's
    // up, and no rail to open — the splash is the entire page.
    actions.appendChild(helpButton());
    actions.appendChild(settingsButton());
    document.getElementById('rail').innerHTML = '';
    const main = document.getElementById('main');
    main.innerHTML = '';
    main.className = '';
    renderSplash(main);
    renderModals();
    renderPalette();
    return;
  }

  // The rail's own toggle — visible only on a narrow screen, where the
  // rail is an off-canvas drawer rather than a permanent column. See
  // `.rail` and `.rail-backdrop` for the mobile layout.
  menuToggle.appendChild(h('button', {
    class: 'icon-btn menu-btn', type: 'button', title: 'Features and entities',
    'aria-label': 'Menu', 'aria-expanded': state.railOpen ? 'true' : 'false',
    onclick: () => { state.railOpen = !state.railOpen; render(); },
  }, h('span', { html: MENU_ICON_SVG })));

  // A scenario that no longer agrees with its command, or a loose end
  // nobody has tied — the one count of what needs attention, shown
  // only when there is any.
  tools.appendChild(surfaceToggle(model));
  const problemsBtn = problemsButton(model);
  if (problemsBtn) tools.appendChild(problemsBtn);

  jump.appendChild(h('button', {
    class: 'trigger', type: 'button', onclick: openPalette, 'aria-label': 'Quick open',
  }, h('span', { html: SEARCH_ICON_SVG }), h('span', { class: 'label' }, 'Quick open…'),
    h('span', { class: 'kbd' }, '⌘K')));

  actions.appendChild(h('button', {
    class: 'icon-btn', type: 'button', title: 'Import & export — ⌘S copies a link',
    'aria-label': 'Import and export', onclick: openImportExport,
  }, importExportIcon()));
  actions.appendChild(helpButton());
  actions.appendChild(settingsButton());

  renderModals();
  renderPalette();

  const names = Object.keys(model['command-definitions']);
  // A model with no command has nothing to give an overview of, and its
  // first command is begun from the slice page — so that is where an
  // empty model opens instead.
  if (state.view === 'overview' && !names.length) state.view = 'slice';
  if (state.view === 'slice' && (!state.slice || !names.includes(state.slice))) {
    state.slice = names[0] || null;
    state.tab = 'definition';
  }
  if (state.view === 'types' && !advanced()) state.view = 'slice';
  if (state.view === 'projections' && !advanced() && !Object.keys(model['projection-definitions']).length) {
    state.view = 'slice';
  }
  if (state.view === 'events' && !advanced() && !Object.keys(model['event-definitions']).length) {
    state.view = 'slice';
  }
  if (['coupling', 'rulemap', 'eventmodel', 'lifecycles'].includes(state.view)
      && (!advanced() || !names.length)) {
    state.view = 'slice';
  }
  // A thing removed from under its own page leaves the page with
  // nothing to show; the next one along is a better answer than a blank.
  if (state.view === 'entity' && !model['entity-definitions'][state.entity]) {
    const rest = Object.keys(model['entity-definitions']).sort();
    state.entity = rest[0] || null;
    if (!state.entity) state.view = 'slice';
  }
  // A rail click on a page that is not one definition — the sandbox,
  // an overview — is a request for that page, so the code steps aside;
  // whatever was typed stays, unapplied, for when it comes back.
  if (state.code && codeView.shownView !== null && state.view !== codeView.shownView
      && !CODE_FOLLOWS.includes(state.view)) {
    setCodeSurface(false);
    if (codeDirty()) toast('Your code edits are kept, unapplied — switch back to Code to finish them.');
  }
  renderRail();

  const main = document.getElementById('main');
  main.innerHTML = '';
  if (state.code) {
    main.className = 'slice wide code-view';
    return renderCode(model, main);
  }
  main.className = 'slice'
    + (['overview', 'coupling', 'rulemap', 'eventmodel', 'lifecycles'].includes(state.view) ? ' wide' : '');

  if (state.view === 'overview') return renderOverview(model, main);
  if (state.view === 'sandbox') return renderSandbox(model, main);
  if (state.view === 'entity') return renderEntity(model, main);
  if (state.view === 'types') return renderCustomTypes(model, main);
  if (state.view === 'projections') return renderProjections(model, main);
  if (state.view === 'events') return renderEvents(model, main);
  if (state.view === 'coupling') return renderCoupling(model, main);
  if (state.view === 'rulemap') return renderRuleMap(model, main);
  if (state.view === 'eventmodel') return renderEventModel(model, main);
  if (state.view === 'lifecycles') return renderLifecycles(model, main);

  if (!state.slice) {
    // With nothing to keep track of, a command has no identifier to be
    // given and every event it records is tagless — a model that cannot
    // say what any of it is *about*. So an empty model is pointed at a
    // thing first, and only then at what someone can do to one.
    if (!Object.keys(model['entity-definitions']).length) {
      main.appendChild(h('div', { class: 'blank' },
        h('h2', {}, 'Nothing here yet'),
        h('p', { class: 'muted small' },
          'Start with something the model keeps track of — a course, a student, an order. '
          + 'It brings an identifier with it, and that identifier is what every event about '
          + 'one of them is tagged with. Commands come next, and everything else gets built '
          + 'from inside them.'),
        state.newEntityAt === 'blank'
          ? inlineForm({
              question: 'New entity', placeholder: 'entity name',
              showsIdentifier: true,
              onSubmit: (v) => {
                state.newEntityAt = null;
                const created = createEntity(model, v);
                if (created) openEntity(created);
              },
              onCancel: () => { state.newEntityAt = null; render(); },
            })
          : h('div', { class: 'adder' },
              h('button', {
                class: 'btn primary',
                onclick: () => { closeForms(); state.newEntityAt = 'blank'; render(); },
              }, '+ First entity'),
              // Not a dead end: a model whose first move really is a
              // command should not have to argue with the page.
              h('button', { class: 'btn ghost', onclick: () => beginNewCommand(model) },
                'or start with a command'))));
      return;
    }
    main.appendChild(h('div', { class: 'blank' },
      h('h2', {}, 'Nothing here yet'),
      h('p', { class: 'muted small' },
        'Start with something someone can do. Name it and the rest of the model — what it '
        + 'reads, what it decides, what it records, what it changes, the things themselves — '
        + 'gets built from inside it.'),
      h('button', { class: 'btn primary', onclick: () => beginNewCommand(model) }, '+ First command')));
    return;
  }

  const slice = sliceOf(model, state.slice);
  main.appendChild(h('header', {},
    state.renamingCommand === slice.name
      // A command is nearly a leaf on the reference graph — only its
      // scenarios name one — so "every reference" is a short list here.
      ? renameDefinitionForm(model, 'command-definition', slice.name, {
          stateKey: 'renamingCommand', after: (next) => { state.slice = next; },
        })
      : qrow('div', { cls: 'row', key: 'cmd:' + slice.name },
          h('button', {
            class: 'icon-btn', title: 'Choose the mark this is shown with',
            onclick: () => {
              const open = state.commandIconPicker === slice.name;
              closeForms();
              state.commandIconPicker = open ? null : slice.name;
              render();
            },
          }, commandIcon(model, slice.name)),
          h('div', { class: 'name' }, named(slice.name)),
          h('span', { class: 'grow' }),
          // The command itself. Nothing in the model references a
          // command, so removal is never refused — which is exactly
          // why it asks first.
          reveal(
            h('button', {
              class: 'btn tiny',
              onclick: () => { closeForms(); state.renamingCommand = slice.name; render(); },
            }, 'Rename'),
            removeButton('command:' + slice.name, {
              label: 'Remove command',
              title: 'Remove this command. The events it recorded and the things it read stay.',
              onRemove: () => run(() => {
                removeDefinition('command-definition', model.id, slice.name);
                state.slice = null;
              }),
            }))),
  ));

  if (state.commandIconPicker === slice.name) {
    main.appendChild(commandIconPicker(model, slice.name, model['command-definitions'][slice.name]));
  }

  const commandAdvisories = advisoryBanner(model, 'command-definition', slice.name);
  if (commandAdvisories) main.appendChild(commandAdvisories);

  main.appendChild(scenarioTabs(model, slice));

  if (state.tab === 'scenarios') {
    main.appendChild(scenarioPanel(model, slice.name));
    paintLit();
    return;
  }

  // A command still in its wizard shows only the steps answered so
  // far, plus the bar that answers (or skips) the current one. This is
  // presentation, never model: every definition underneath is whole,
  // and "Show all steps" is always one click away. Everyone else gets
  // the full page — which is the check-your-answers view a finished
  // command reads as.
  const wizard = state.wizard && state.wizard.slice === slice.name ? state.wizard : null;
  if (wizard) {
    for (let i = 0; i <= Math.min(wizard.upto, WIZARD_STEPS.length - 1); i++) {
      main.appendChild(WIZARD_STEPS[i].paint(model, slice));
    }
    main.appendChild(wizardBar(model, slice));
  } else {
    main.appendChild(stepTrigger(model, slice));
    main.appendChild(stepDecision(model, slice));
    main.appendChild(stepEmits(model, slice));
    main.appendChild(stepChanges(model, slice));
    if (advanced()) main.appendChild(stepConsistency(model, slice));
    else main.appendChild(h('div', { class: 'muted tiny', style: 'padding-left:26px' },
      'Switch to Advanced to see the consistency boundary this command derives.'));
  }

  // A pinned reference outlives the repaint that follows clicking it.
  paintLit();
}

function step(kind, title, ...body) {
  return h('section', { class: 'step ' + kind },
    h('span', { class: 'dot' }),
    h('div', { class: 'shead' }, h('h4', {}, title)),
    ...body);
}

function stepTrigger(model, slice) {
  const where = 'payload:' + slice.name;
  // A stale reference from before `removeEventField` existed would
  // otherwise refuse this removal for a reason no longer visible
  // anywhere — see the comment there.
  const dropProperty = (i) => patchSlice((b) => {
    pruneDanglingEmissionParameters(model, b);
    b.properties.splice(i, 1);
  });
  const rows = slice.payload.map((p, i) => {
    if (editingMember(where, p.name)) {
      return memberEditor(model, {
        member: p, where,
        onReplace: (next) => patchSlice((b) => { b.properties[i] = next; }),
        onRename: (name) => renameMember('command-definition', model.id, slice.name, 'property', p.name, name),
      });
    }
    const enumType = isStringEnumType(model, p.propertyType) ? p.propertyType : null;
    return [
      qrow('div', {
        cls: 'field', key: 'in:' + p.name, src: 'param:' + p.name,
        onRemove: () => dropProperty(i),
      },
        h('span', { class: 'nm' }, propertyWords(p.name)),
        // The type rides the row itself rather than the reveal: what an
        // input *is* is part of reading the command, not machinery. It
        // sits right after the name's fixed-width column — a second
        // column beside the names, not a tag stranded at the far edge.
        h('span', {
          class: 'type-tag', title: 'Rename or retype this input',
          onclick: (e) => { e.stopPropagation(); openMember(where, p.name); },
        }, readable(typeLabel(p))),
        h('span', { class: 'grow', style: 'flex:1' }),
        reveal(
          advanced() ? h('span', { class: 'tech' }, p.name) : null,
          h('button', { class: 'btn tiny danger', onclick: () => dropProperty(i) }, '×'))),
      enumType ? h('div', { class: 'use' },
        h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(model, enumType)) : null,
    ];
  });
  if (!rows.length) rows.push(h('div', { class: 'empty' }, '—'));

  return step('trigger', 'Payload',
    h('div', { class: 'card command' }, rows,
      adderSlot('in', 'trigger', '+ input', () => propertyAdder(model, {
        placeholder: 'field name', label: '+ Add input', draftKey: 'in:' + slice.name,
        onAdd: (property) => patchSlice((b) => b.properties.push(property)),
        onRemoveLast: slice.payload.length ? () => dropProperty(slice.payload.length - 1) : undefined,
        // Enter on an empty name means "done with these". Mid-wizard
        // that is the Continue — the reads step it would jump to is
        // not revealed yet, so revealing it *is* the jump.
        onEmptyEnter: () => {
          if (state.wizard && state.wizard.slice === slice.name) {
            closeForms();
            return advanceWizard(model, slice);
          }
          beginReadAdder();
        },
      }))));
}

// ---------- the concept hint ----------
//
// Where the explanatory paragraphs went. The page used to carry them
// inline, in a register written for someone who had not met DCB before;
// this reader has, and a sentence explaining what an identifier is costs
// them a line every time they scan the block.
//
// One per section, never one per row. A block that needed three
// sentences needed them once — merging siblings into a single panel is
// the point, because a section with three glyphs in it is the same prose
// problem wearing a new mark. That keeps the app at roughly a dozen.
//
// Mechanically this is `queryPopover` with a different glyph: hover or
// focus peeks, a click pins it across the repaint every editing command
// triggers, Escape or a second click lets go. The trigger is a real
// <button> because the panel must be reachable by tab — a `title` on a
// <span> is not, which is the whole reason this exists instead.
//
// `href` is passed only where dcb.events has a page for the concept:
// tags, projections, aggregates. Linking every panel at the spec's front
// door would teach nothing and train the reader to ignore the link.
// `topic` is the help's section on it — the longer explanation, and how
// the thing is written as code.
// The mark itself, drawn rather than typed. The ⓘ glyph sat on the
// font's math axis — centred on the lowercase letters — so beside an
// all-caps heading it rode low, and by how much depended on the font.
// An SVG sized in em and dropped by `.hint`'s vertical-align centres on
// the capitals in every face.
const INFO_MARK = '<svg viewBox="0 0 12 12" aria-hidden="true">'
  + '<circle cx="6" cy="6" r="5.25" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  + '<line x1="6" y1="5.2" x2="6" y2="8.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>'
  + '<circle cx="6" cy="3.5" r=".55" fill="currentColor"/></svg>';
function infoMark() {
  return h('span', { class: 'imark', html: INFO_MARK });
}

function hint(key, title, lines, href, topic) {
  const on = state.hintPop === key;
  return h('span', { class: 'hint' + (on ? ' on' : '') },
    h('button', {
      class: 'hbtn', type: 'button', title: title,
      'aria-expanded': on ? 'true' : 'false',
      onclick: (e) => {
        e.stopPropagation();
        state.hintPop = on ? null : key;
        render();
      },
    }, infoMark()),
    h('span', { class: 'hpanel', onclick: (e) => e.stopPropagation() },
      h('div', { class: 'k qtitle' }, title),
      ...(Array.isArray(lines) ? lines : [lines]).map((line) => h('div', { class: 'hline' }, line)),
      href || topic ? h('div', { class: 'hlinks' },
        href ? h('a', { class: 'hlink', href, target: '_blank', rel: 'noopener' }, 'dcb.events ↗') : null,
        topic ? h('span', { class: 'hlink' }, helpLink(topic, 'In the help →')) : null) : null));
}

// A query is one hover away rather than one more line on the page:
// the glyph marks everything that goes to the log, and the popover
// states what it asks. Hover or focus peeks, a click pins it across
// repaints, Escape or a second click lets go. The panel is in the
// document either way — CSS hides it — so it costs a mark, not a row.
function queryPopover(key, title, ...lines) {
  const on = state.queryPop === key;
  return h('span', { class: 'qpop' + (on ? ' on' : '') },
    h('button', {
      class: 'qbtn', title: 'The DCB query behind this',
      'aria-expanded': on ? 'true' : 'false',
      onclick: (e) => {
        e.stopPropagation();
        state.queryPop = on ? null : key;
        render();
      },
    }, h('span', { class: 'qico', html: SEARCH_ICON_SVG })),
    h('span', { class: 'qpanel dcb', onclick: (e) => e.stopPropagation() },
      title ? h('div', { class: 'k qtitle' }, title) : null,
      ...lines));
}

// One DCB query, spelled the same everywhere one appears: the tags
// ANDed, then the event types — "any type" when the query is tag-only,
// and a plain word about reading the whole log when it is type-only.
// Every place that shows a query goes through here, so a reader who
// has learned the spelling once has learned all of them.
function dcbQueryWords(item) {
  const tags = item.tags || [];
  const types = item.types || [];
  return h('span', {},
    tags.length
      ? h('span', {}, h('span', { class: 'k' }, 'tag '),
          ...tags.flatMap((tag, j) => [
            j ? h('span', { class: 'k' }, ' and ') : null,
            h('span', { class: 't' }, tag),
          ]),
          h('span', { class: 'k' }, ' and '))
      : null,
    h('span', { class: 'y' }, types.join(', ') || 'any type'),
    tags.length ? null : h('span', { class: 'k' }, '  (no tag — the whole log)'),
    item.fannedOut ? h('span', { class: 'k' }, '  — one per element') : null);
}

// One binding, as a card. `index` is its position in the authored
// boundary, which is what removal needs — the queries regroup the cards
// but never renumber the list underneath them.
function readCard(model, slice, binding, index, waitsFor, ruleIndices) {
  const r = readParts(model, slice.body, binding);
  const queryItem = (slice.dcb.items || []).find((item) => item.alias === binding.alias);
  const sentence = r.projection
    ? h('span', { class: 'sentence' },
        projectionRef(model, r.projection, { cls: 'chip projection' }),
        ' as ', h('span', { class: 'op' }, r.alias),
        // No arguments means no tag: the query is scoped by event type
        // alone, which is what a global numbering is.
        r.arguments.length
          ? h('span', {}, h('span', { class: 'verb' }, ' — for '),
              ...r.arguments.flatMap((arg, i) => [
                i ? h('span', { class: 'verb' }, ' and ') : null,
                opRef((binding.arguments || {})[arg.name], null, arg.words),
              ]))
          : h('span', { class: 'verb' }, ' — the whole log'))
    : h('span', { class: 'sentence' },
        entityRef(model, r.entity),
        ' as ', h('span', { class: 'op' }, r.alias),
        h('span', { class: 'verb' }, r.plural ? ' — one for each ' : ' — identified by '),
        opRef(binding.id, null, r.from),
        r.excluding ? h('span', {}, h('span', { class: 'verb' }, ' except '),
          opRef(binding.excluding, null, r.excluding)) : null,
        // The declared absence, said where the read is: an unset
        // identifier binds nothing here instead of erroring, and rules
        // over this alias step aside.
        binding.isOptional ? h('span', { class: 'verb' }, ' — may be absent') : null,
        // Arguments only appear on a binding that reads something
        // scripted, so the sentence names them rather than hiding them
        // behind the property that asked.
        r.arguments.length
          ? h('span', {}, h('span', { class: 'verb' }, ' — with '),
              ...r.arguments.flatMap((arg, i) => [
                i ? h('span', { class: 'verb' }, ' and ') : null,
                opRef((binding.arguments || {})[arg.name], null, `${arg.name} = ${arg.words}`),
              ]))
          : null);

  return h('div', { class: 'card ' + (r.projection ? 'projection' : 'entity'),
      'data-src': 'alias:' + binding.alias },
    qrow('div', { cls: 'row', key: 'read:' + binding.alias },
      sentence,
      // The query this read contributes, one hover away — stated on
      // the read itself in Advanced, so "what does binding this cost?"
      // is answered where the binding is, not only in the union at the
      // foot of the page.
      advanced() && queryItem
        ? queryPopover('read:' + binding.alias, 'what this binding queries',
            h('div', {}, dcbQueryWords(queryItem)))
        : null,
      h('span', { class: 'grow' }),
      reveal(
        h('button', {
          class: 'btn tiny',
          onclick: () => {
            closeForms();
            state.editBinding = binding.alias;
            render();
          },
        }, 'Edit'),
        // Removing a read takes the rules and guards about it with it:
        // they are its own children on this page, and a rule whose
        // subject is gone is not a rule. What it does *not* take is a
        // read further down the chain that drew its identifier from
        // this one — that is a sibling card the author can see and
        // repoint, and deleting a subtree nobody pointed at would
        // narrow the boundary behind their back. It dangles, and says
        // so, until they deal with it.
        h('button', {
          class: 'btn tiny danger', title: 'Remove this read, and the rules about it',
          onclick: () => patchSlice((b) => {
            const names = (condition) => conditionOperands(condition)
              .some((operand) => operandSource(operand) === 'alias-property'
                && operand.alias === binding.alias);
            b.boundary = (b.boundary || []).filter((x) => !(x && x.alias === binding.alias));
            b.conditions = (b.conditions || []).filter((c) => !(c && names(c)));
            for (const emission of b.publishes || []) {
              if (!emission || !emission.when) continue;
              emission.when = emission.when.filter((c) => !(c && names(c)));
              if (!emission.when.length) delete emission.when;
            }
          }),
        }, '×'))),
    state.editBinding === binding.alias ? bindingEditor(model, slice, binding, index) : null,
    // Which read this one had to wait for. The query header carries
    // the cost; this carries the reason, and stays useful once a query
    // holds more than one card.
    (waitsFor || []).length
      ? h('div', { class: 'waits' }, '↳ needs ',
          ...waitsFor.flatMap((alias, i) => [
            i ? ' and ' : null, h('span', { class: 'op' }, alias),
          ]))
      : null,
    // The rules about this read, inside it. A card with none is an
    // intermediate hop or an emission's read — it still costs a query
    // and still bounds the append, so it is shown as what it is
    // rather than hidden for having nothing to check.
    // More than one, and they can be dragged into the order they are
    // checked in — among themselves only.
    ...(ruleIndices || []).map((i) => ruleRow(model, slice, slice.rules[i], i,
      ruleIndices.length > 1 ? binding.alias : null)),
    ruleIndices
      ? h('div', { class: 'adder quiet' }, h('button', {
          class: 'btn tiny',
          onclick: () => {
            closeForms();
            state.adder = 'rule';
            // Opened from a card, the target is settled — the editor
            // skips its own read picker and scopes the left side to
            // this alias.
            state.ruleDraft = {
              predicate: 'equals', negate: false, left: '', right: '', onAlias: binding.alias,
            };
            render();
          },
        }, '+ rule about ' + propertyWords(binding.alias)))
      : null);
}

// A binding opened for editing. Everything about a read is here: what
// it is called, where its identifier comes from, and the two fields
// that only apply in particular circumstances.
//
// `excluding` is offered only on a binding that fans out — there is
// nothing to exclude something *from* otherwise — and an argument row
// appears once for each argument a scripted property it reads asks
// for, which is the same rule the model enforces. A field that could
// not mean anything here is left off the page rather than shown and
// then refused.
function bindingEditor(model, slice, binding, index) {
  const close = () => { state.editBinding = null; render(); };
  const expected = binding.projection ? [] : argumentsExpected(model, slice.body, binding);
  const draft = state.bindingDraft && state.bindingDraft.alias === binding.alias
    ? state.bindingDraft
    : (state.bindingDraft = expected.reduce(
        (acc, argument) =>
          draftFromOperand(acc, 'arg:' + argument.name, (binding.arguments || {})[argument.name]),
        {
          alias: binding.alias,
          name: binding.alias,
          ...draftFromOperand({}, 'id', binding.id),
          ...draftFromOperand({}, 'excluding', binding.excluding),
        }
      ));

  const above = operandChoicesAbove(model, slice, index);
  const fanned = isFannedOut(model, slice.body, binding);
  // Each slot knows the type it takes, so each offers only that: the
  // identifier slot the entity's own id type — lists included, a list
  // is how a binding fans out — the exclusion one of them, an argument
  // whatever the script declared.
  const idType = binding.projection ? null : idTypeOf(model, binding.entity);
  const idChoices = binding.projection
    ? [] : choicesOfType(model, slice, above, idType, { list: true });
  const excludingChoices = binding.projection
    ? [] : choicesOfType(model, slice, above, idType);

  const apply = (mutate) => patchSlice((b) => mutate(b.boundary[index]));

  return h('div', { class: 'member-editor' },
    h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, style: 'width:130px',
        oninput: (e) => { draft.name = e.target.value; },
      }),
      h('button', {
        class: 'btn tiny',
        title: 'Rename this binding. The alias is local to this command, so nothing else moves.',
        onclick: () => {
          const next = toCamel(draft.name);
          if (!next) return toast('Give the binding a name.', true);
          if (next === binding.alias) return close();
          if (slice.reads.some((b) => b.alias === next)) {
            return toast(`"${next}" is already bound in this command.`, true);
          }
          state.bindingDraft = null;
          state.editBinding = next;
          patchSlice((b) => {
            // Every operand naming the old alias moves with it. The
            // alias is this command's own word for the instance, so
            // nothing outside the command can be referring to it.
            forEachCommandOperand(b, (operand) => {
              if (operandSource(operand) === 'alias-property' && operand.alias === binding.alias) {
                operand.alias = next;
              }
            });
            b.boundary[index].alias = next;
          });
        },
      }, 'Rename')),

    binding.projection ? null : h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'identified by'),
      ...operandPicker(idChoices, draft, 'id', { allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'id');
          if (operand === undefined) return toast('Pick where the identifier comes from.', true);
          apply((b) => { b.id = operand; });
        },
      }, 'Set')),

    // Whether an unset identifier is expected. Off, it is the loud
    // error it always was; on, the binding binds nothing, rules over
    // it hold vacuously, and reading a property of it yields null. A
    // fanned binding is not offered the choice — an empty list already
    // binds nothing.
    binding.projection || fanned ? null : h('div', { class: 'adder' },
      h('label', { class: 'muted tiny', style: 'display:flex;align-items:center;gap:4px' },
        h('input', {
          type: 'checkbox', checked: !!binding.isOptional,
          onchange: (e) => {
            const on = e.target.checked;
            apply((b) => { if (on) b.isOptional = true; else delete b.isOptional; });
          },
        }),
        'may be absent'),
      h('span', { class: 'muted tiny' },
        'a null identifier binds nothing instead of erroring; conditions over the alias hold vacuously')),

    binding.projection || !fanned ? null : h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'except'),
      ...operandPicker(excludingChoices, draft, 'excluding', { placeholder: '— nothing —', allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'excluding');
          apply((b) => {
            if (operand === undefined) delete b.excluding; else b.excluding = operand;
          });
        },
      }, 'Set'),
      h('span', { class: 'muted tiny' }, 'excludes one instance from the fan-out')),

    ...expected.map((argument) => h('div', { class: 'adder' },
      h('span', { class: 'muted tiny' }, 'with ', h('code', {}, argument.name)),
      ...operandPicker(choicesOfType(model, slice, above, argument.propertyType),
        draft, 'arg:' + argument.name, { allowLiteral: false }),
      h('button', {
        class: 'btn tiny', onclick: () => {
          const operand = draftOperand(draft, 'arg:' + argument.name);
          apply((b) => {
            const next = { ...(b.arguments || {}) };
            if (operand === undefined) delete next[argument.name];
            else next[argument.name] = operand;
            if (Object.keys(next).length) b.arguments = next; else delete b.arguments;
          });
        },
      }, 'Set'),
      h('span', { class: 'muted tiny' },
        `required — a scripted property it reads asks for one ${argument.propertyType}`))),

    h('div', { class: 'adder' },
      h('button', { class: 'btn ghost tiny', onclick: () => { state.bindingDraft = null; close(); } }, 'Done')));
}

// Headers appear only when there is more than one query: a lone
// "first" over a single card is noise, and most commands decide in one
// query. Shown in both modes — "we must read the courses before we know
// which students to look at" is a fact about the domain, not about the
// store.
const ROUND_WORDS = ['first', 'then, using what came back', 'then again'];
function roundLabel(index, total) {
  if (index < ROUND_WORDS.length) return ROUND_WORDS[index];
  return `and again (${index + 1} of ${total})`;
}

// What Enter on an empty property name means: that list is done, and
// the next question is what decides. Opens the merged step's own
// adder and reaches for its first control — which is the read picker,
// since a rule begins by naming what it is about.
function beginReadAdder() {
  closeForms();
  state.adder = 'rule';
  render();
  setTimeout(() => {
    const el = document.querySelector('.step.decide select, .step.decide input');
    if (el) el.focus();
  }, 0);
}

// One rule, as a sentence, inside the card of the read it is about.
// Extracted from the old rules step unchanged in substance: what moved
// is where it is painted, not what it says. `dragAlias` names the card
// it may be reordered within, when it shares that card with another.
function ruleRow(model, slice, condition, i, dragAlias) {
  if (state.editRule === i) return h('div', { class: 'card rule' }, ruleEditor(model, slice, i));
  const p = conditionParts(condition, model, slice.body);
  const quantifier = quantifierWords(model, slice.body, condition);
  // A rule over an alias declared "may be absent" does not decide on
  // the unset case — it steps aside. Said here, on the rule, so the
  // skip the boundary's flag implies is visible where it applies.
  const optionalAliases = uniq(conditionOperands(condition)
    .filter((operand) => operandSource(operand) === 'alias-property')
    .map((operand) => operand.alias))
    .filter((alias) => (slice.body.boundary || []).some((b) => b && b.alias === alias && b.isOptional));
  return h('div', {
      class: 'rule-row',
      'data-rule': dragAlias ? i : null, 'data-rule-alias': dragAlias || null,
    },
    dragAlias ? ruleGrip(slice, i, dragAlias) : null,
    qrow('div', { cls: 'row', key: 'rule:' + i },
      h('span', { class: 'sentence' },
        quantifier ? h('span', { class: 'verb' }, quantifier + ', ') : null,
        opRef(condition.leftHandSide, null, p.left), ' ', h('span', { class: 'verb' }, p.verb),
