apiVersion: schema.esdm.io/core/v1
kind: command
name: update-projection-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: projection-definition-update
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
