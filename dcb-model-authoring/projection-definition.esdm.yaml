# Projection definitions inside a DCB Model: events, DCBs, commands.
# Identified within the model by `name` (the natural key).
#
# Distinctive aspects of this kind:
#   - a projection derives no type, so its name occupies a namespace of
#     its own. Unlike entity- and custom-type-definitions, adding or
#     renaming one needs no collision check against the shared type
#     namespace — only against other projection-definitions.
#   - its body is an entity property that lost its entity: same
#     handlers, same operations, same operands. What replaces the
#     owning entity is `parameters` — the tags a command supplies when
#     it binds the projection. Declare none and the query carries no
#     tag at all, which is the only such query in a DCB Model.
#   - `parameters` are why this kind consults entity lifecycle events
#     for more than `valueType`: every parameter must be typed with a
#     live entity's derived identifier type, because only an identifier
#     is a tag.
#
# This kind replaced `sequence-definition`, whose body named an event
# *and a property of that event*, so its guards had to read event
# bodies where every other kind read only event names. Handlers carry
# that reference now, and the check is the one entity-definition
# already makes.
#
# References out: event-definitions (handler events), entity-definitions
# (`parameters[].propertyType`) and the type namespace — a
# custom-type-definition or an entity-derived type (`valueType`).
# References in: command-definitions alone, through boundary bindings
# that read the projection.

apiVersion: schema.esdm.io/core/v1
kind: event
name: projection-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        The projection's authored content — the tags it is partitioned
        by, the type and shape of its value, the value it starts from,
        and the handlers that fold events into it. Kept opaque here:
        the shape of a `body` is owned by the DCB Model schema, not
        by this domain model.
  required: [dcb-model-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: projection-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-model-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
