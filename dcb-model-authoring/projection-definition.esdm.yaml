apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-projection-definition
description: |
  Renames a projection-definition. Atomically emits the rename event
  plus one `command-definition-updated` event for every command that
  bound `previous-name`, with every occurrence replaced by `name`. No
  other kind can reference a projection, so no other definitions are
  rewritten.

  Aliases are left alone. A binding's alias is local to its command and
  was never derived from this name after the binding was created, so
  rewriting it would rename something the modeler may have chosen.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: projection-definition-rename
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-model-id, previous-name, name]
  additionalProperties: false
publishes:
  - projection-definition-renamed
  - command-definition-updated
constraints:
  - name: rewrite-projection-references
    rule: |
      Emit exactly one `command-definition-updated` event for every
      command-definition currently in the model whose boundary binds
      `previous-name`, with every occurrence replaced by `name`. Emit
      nothing for commands that did not bind the renamed projection.
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-projection-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: projection-definition-removal
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
  required: [dcb-model-id, name]
  additionalProperties: false
publishes:
  - projection-definition-removed
actors:
  - modeler
