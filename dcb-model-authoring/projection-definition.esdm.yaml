apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: projection-definition-addition
description: |
  Guards the addition of a new projection-definition. The name check is
  simpler than for entities and custom types — a projection derives no
  type, so nothing outside its own namespace can collide — but the
  reference surface is wider than a name check suggests: the body
  reaches events (through its handlers), the type namespace (through
  `valueType`) and entities (through `parameters`, which may only be
  typed with a derived identifier).
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: projection-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: projection-definition-added
    criteria: events with matching `dcb-model-id` and `name` equal to this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-renamed
    criteria: events with matching `dcb-model-id` whose new `name` or `previous-name` equals this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-removed
    criteria: events with matching `dcb-model-id` and `name` equal to this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: event-definition-added
    criteria: every event-definition added in this model — needed to resolve the events named by handlers
  - boundedContext: dcb-model-authoring
    event: event-definition-updated
    criteria: every event-definition update in this model — a handler operand naming an event property is resolved against the latest body
  - boundedContext: dcb-model-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this model — needed to resolve `valueType`
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this model — needed to resolve a `valueType` or a `parameters` entry naming an entity-derived type
  - boundedContext: dcb-model-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: name-not-in-use
    rule: |
      No projection-definition currently goes by this name in this
      model. Projection names occupy their own namespace — a
      projection derives no type, so this name may equally belong to a
      custom type, an entity or an event without conflict.
  - name: value-type-resolves
    rule: |
      `valueType` resolves — to a simple type, a live
      custom-type-definition, or a type derived from a live
      entity-definition — and is not a composite custom type.
  - name: parameters-are-identifiers
    rule: |
      Every parameter carries a distinct name and is typed with the
      identifier type derived from a live entity-definition in this
      model. Nothing else is accepted: a parameter becomes a tag, and
      only an identifier is a tag, so a parameter typed `integer` or
      with a custom value type would name a partition the query cannot
      narrow. An empty parameter list is legal and means the query
      carries no tag.

      A scripted body declares no parameters at all. Its arguments
      reach the code rather than the query, so they are typed freely
      and cannot narrow anything; what would otherwise have been
      derived from parameters is stated in its tag filter, over live
      entity-definitions in this model.
  - name: handlers-resolve
    rule: |
      The body carries at least one handler; every event it names is a
      live event-definition in this model, named at most once. In a
      declared body each handler's operation suits the projected type
      and each operand resolves — an event-property operand against the
      latest body of the event being handled, an enum-member operand
      against a live entity's statuses. A `successor` operand wraps
      another operand and is legal only over an integer or a string.

      In a scripted body a handler carries code instead, and that is
      all that is checked of it: the code is not parsed here or
      anywhere else, so a scripted handler is held to the event it
      claims and nothing more.
  - name: initial-value-present
    rule: |
      The body carries the value it starts from — an initial value when
      it is declared, an initial state when it is scripted, never both.
      For a numbering that is the first value issued and the only place
      a prefix is stated, so a projection without one has nothing to
      read.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: projection-definition-update
description: |
  Guards body changes to an existing projection-definition (name
  unchanged). The name check reduces to "the name *is* currently in
  use", since an update claims no new name — but the reference checks
  are the addition's in full, because the new body may name different
  events, different parameters or a different type.

  It is the only one of this kind's guards to consult command lifecycle
  events on the way *in*: changing `parameters` changes what a binding
  must supply, so commands already binding this projection are checked
  rather than left holding arguments that no longer fit.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: projection-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: projection-definition-added
    criteria: events with matching `dcb-model-id` and `name` equal to this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-renamed
    criteria: events with matching `dcb-model-id` whose new `name` or `previous-name` equals this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-removed
    criteria: events with matching `dcb-model-id` and `name` equal to this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: event-definition-added
    criteria: every event-definition added in this model — needed to resolve the events named by handlers
  - boundedContext: dcb-model-authoring
    event: event-definition-updated
    criteria: every event-definition update in this model — a handler operand naming an event property is resolved against the latest body
  - boundedContext: dcb-model-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this model — needed to resolve `valueType`
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this model — needed to resolve a `valueType` or a `parameters` entry naming an entity-derived type
  - boundedContext: dcb-model-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-added
    criteria: every command-definition added in this model — needed to find bindings whose arguments must still fit `parameters`
  - boundedContext: dcb-model-authoring
    event: command-definition-updated
    criteria: every command-definition update in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: definition-exists
    rule: A projection-definition currently goes by this name in this model.
  - name: value-type-resolves
    rule: |
      `valueType` resolves — to a simple type, a live
      custom-type-definition, or a type derived from a live
      entity-definition — and is not a composite custom type.
  - name: parameters-are-identifiers
    rule: |
      Every parameter of the updated body carries a distinct name and
      is typed with the identifier type derived from a live
      entity-definition in this model. A scripted body declares none,
      and names its entities in its tag filter instead.
  - name: handlers-resolve
    rule: |
      The updated body carries at least one handler; every event it
      names is a live event-definition, named at most once; in a
      declared body every operation suits the projected type and every
      operand resolves, and in a scripted one every handler carries
      code.
  - name: initial-value-present
    rule: |
      The body carries an initial value, or an initial state when it is
      scripted.
  - name: bindings-still-fit
    rule: |
      Every live command-definition that binds this projection supplies
      exactly one argument per name the updated body declares — its
      parameters, or its script's arguments. Adding or removing one is
      refused while a command still binds the projection, rather than
      leaving that command holding arguments for a partition or an
      input that no longer exists.

      Renaming one is refused here too — but only as an *update*. A
      member rename is its own operation: it moves the binding keys in
      the same append, so the arguments still fit when it lands.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: projection-definition-rename
description: |
  Guards renaming a projection-definition. Consults command lifecycle
  events alongside its own, so every command binding `previous-name`
  can be rewritten in the same append. Nothing else references a
  projection, and no collision check against the type namespace is
  needed — a projection derives no type.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: projection-definition-added
    criteria: events with matching `dcb-model-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-renamed
    criteria: events with matching `dcb-model-id` whose new `name` or `previous-name` equals `previous-name` or `name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-removed
    criteria: events with matching `dcb-model-id` whose `name` equals `previous-name` or `name`
  - boundedContext: dcb-model-authoring
    event: command-definition-added
    criteria: every command-definition added in this model — needed to find the bindings to rewrite
  - boundedContext: dcb-model-authoring
    event: command-definition-updated
    criteria: every command-definition update in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-renamed
    criteria: every command-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A projection-definition currently goes by `previous-name` in this model.
  - name: new-name-free
    rule: No projection-definition currently goes by `name` in this model.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: projection-definition-removal
description: |
  Guards removal of a projection-definition. Consults command lifecycle
  events to refuse removal while any command in the same model still
  binds it. No other kind can reference a projection, so the consult
  surface is narrower than the other removals.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: projection-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: projection-definition-added
    criteria: events with matching `dcb-model-id` and `name` equal to this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-renamed
    criteria: events with matching `dcb-model-id` whose new `name` or `previous-name` equals this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: projection-definition-removed
    criteria: events with matching `dcb-model-id` and `name` equal to this instance's `projection-definition-name`
  - boundedContext: dcb-model-authoring
    event: command-definition-added
    criteria: every command-definition added in this model — needed to check for boundary bindings reading this projection
  - boundedContext: dcb-model-authoring
    event: command-definition-updated
    criteria: every command-definition update in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: definition-exists
    rule: A projection-definition currently goes by this name in this model.
  - name: no-inbound-references
    rule: |
      No live command-definition in this model binds this projection
      in its boundary. References are read from the latest body of each
      live definition; because a projection is only ever read through a
      binding, the boundary is the only place to look.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-projection-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: projection-definition-addition
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
