# Custom-type definitions inside a DCB Model: events, DCBs, commands.
# Identified within the model by `name`.
#
# Custom types are *value* types only — there is no tag flag. Tags come
# exclusively from entity identifiers. Custom types nevertheless share
# a namespace with the types entities derive (`<Entity>Id`,
# `<Entity>Status`), so adding or renaming one must check that namespace
# against the live entities as well as against other custom types.
#
# A custom type is *scalar* (an opaque JSON Schema) or *composite* (a
# record of typed fields) — the body carries one or the other. Only the
# composite form references anything: its fields are typed against the
# shared namespace, so a field typed `ProductId` is a real reference.
# That is deliberate. A raw JSON Schema could hold an identifier too,
# but nothing could tell it from any other string, so renaming the
# entity would silently break it — which is the class of rot this whole
# model exists to prevent.
#
# References out: other custom-type-definitions and entity-definitions,
# through composite field types. (A scalar type references nothing.)
# References in: event-definitions, entity-definitions and
# command-definitions, through their property types; other
# custom-type-definitions, through composite field types; and
# projection-definitions, through `valueType`.

apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-added
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
      description: |
        The custom-type's authored content — either its JSON Schema or
        its composite fields. Kept opaque here — the shape of a `body`
        is owned by the DCB Model schema, not by this domain model.
  required: [dcb-model-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-updated
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-model-id, name, body]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: custom-type-definition-renamed
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    previous-name:
      type: string
    name:
