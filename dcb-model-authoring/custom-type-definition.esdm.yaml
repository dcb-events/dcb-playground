  required: [dcb-model-id, name]
  additionalProperties: false
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-addition
description: |
  Guards the addition of a new custom-type-definition. Beyond the
  usual "model active + name not in use" checks it consults the
  entity lifecycle, because a custom type may not claim a name that a
  live entity already derives.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: custom-type-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this model — for the name check, and to resolve composite field types
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-updated
    criteria: every custom-type-definition update in this model — a body may have become composite
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this model — the candidate name must not collide with a derived type name, and composite fields may be typed with a derived one
  - boundedContext: dcb-model-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: name-not-in-use
    rule: |
      No custom-type-definition currently goes by this name in this
      model — folding the consulted add/rename/remove events yields
      no live definition with this name.
  - name: name-not-derived
    rule: |
      No live entity-definition derives this name: for no live entity
      `E` does the candidate name equal `<E>Id` or `<E>Status`.
  - name: field-types-resolve
    rule: |
      If the body is composite, every field's type names a simple type,
      a live custom-type-definition, or a type derived from a live
      entity-definition.
  - name: fields-are-flat
    rule: |
      If the body is composite, no field is a list, optional, or typed
      with another composite. Each would break the index correlation a
      zipped condition depends on: a list field flattens, an optional
      identifier field contributes a variable number of tags, and a
      nested composite cannot be reached by a single-hop operand.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-update
description: |
  Guards schema updates to an existing custom-type-definition (name
  unchanged). The name checks reduce to "the name *is* currently in
  use", since an update claims no new name.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: custom-type-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this model — for the existence check, and to resolve composite field types
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-updated
    criteria: every custom-type-definition update in this model — a body may have become composite
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this model — composite fields may be typed with a derived type
  - boundedContext: dcb-model-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: definition-exists
    rule: A custom-type-definition currently goes by this name in this model.
  - name: field-types-resolve
    rule: |
      If the new body is composite, every field's type names a simple
      type, a live custom-type-definition, or a type derived from a live
      entity-definition.
  - name: fields-are-flat
    rule: |
      If the new body is composite, no field is a list, optional, or
      typed with another composite.
  - name: no-composite-cycle
    rule: |
      No field's type is this definition itself. Composites do not nest
      at all, so a cycle cannot form — this states the degenerate case
      the flatness rule would otherwise leave implicit.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-rename
description: |
  Guards renaming a custom-type-definition. Consults event, entity,
  command and projection lifecycle events alongside its own, so every
  definition naming `previous-name` — as a property type, as a
  *composite field* type, or as a projection's `valueType` — can be
  rewritten in the same append — and consults the entity lifecycle a
  second time over, because the new name must not collide with a
  derived type name.

  Its own kind is now among the referrers: a composite field may be
  typed with another custom type, so renaming `Money` has to rewrite
  `Item.price`.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: previous-name
    source: command-payload
    field: previous-name
  - name: name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this model — for the name checks, and to find composite field types to rewrite
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-updated
    criteria: every custom-type-definition update in this model — a composite's fields are read from its latest body
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-added
    criteria: every event-definition added in this model — needed to find property types to rewrite
  - boundedContext: dcb-model-authoring
    event: event-definition-updated
    criteria: every event-definition update in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-renamed
    criteria: every event-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this model — needed both for the collision check on `name` and to find property types to rewrite
  - boundedContext: dcb-model-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-renamed
    criteria: every entity-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-added
    criteria: every command-definition added in this model — needed to find property types to rewrite
  - boundedContext: dcb-model-authoring
    event: command-definition-updated
    criteria: every command-definition update in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-renamed
    criteria: every command-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this model — a projection's `valueType` names a type
  - boundedContext: dcb-model-authoring
    event: projection-definition-updated
    criteria: every projection-definition update in this model
  - boundedContext: dcb-model-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: previous-name-in-use
    rule: A custom-type-definition currently goes by `previous-name` in this model.
  - name: new-name-free
    rule: No custom-type-definition currently goes by `name` in this model.
  - name: new-name-not-derived
    rule: |
      No live entity-definition derives `name`: for no live entity `E`
      does `name` equal `<E>Id` or `<E>Status`.
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: custom-type-definition-removal
description: |
  Guards removal of a custom-type-definition. Consults event, entity,
  command and projection lifecycle events to refuse removal while any
  definition still names it — as a property type, as a *composite
  field* type, or as a projection's `valueType`.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
identifiedBy:
  - name: dcb-model-id
    source: command-payload
    field: dcb-model-id
  - name: custom-type-definition-name
    source: command-payload
    field: name
consults:
  - boundedContext: dcb-model-authoring
    event: dcb-model-created
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: dcb-model-deleted
    criteria: events whose `dcb-model-id` matches this instance's `dcb-model-id`
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-added
    criteria: every custom-type-definition added in this model — for the existence check, and to check composite fields for inbound references
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-updated
    criteria: every custom-type-definition update in this model — fields are read from the latest body
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-renamed
    criteria: every custom-type-definition rename in this model
  - boundedContext: dcb-model-authoring
    event: custom-type-definition-removed
    criteria: every custom-type-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-added
    criteria: every event-definition added in this model — needed to check for inbound references
  - boundedContext: dcb-model-authoring
    event: event-definition-updated
    criteria: every event-definition update in this model
  - boundedContext: dcb-model-authoring
    event: event-definition-removed
    criteria: every event-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-added
    criteria: every entity-definition added in this model — needed to check for inbound references
  - boundedContext: dcb-model-authoring
    event: entity-definition-updated
    criteria: every entity-definition update in this model
  - boundedContext: dcb-model-authoring
    event: entity-definition-removed
    criteria: every entity-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-added
    criteria: every command-definition added in this model — needed to check for inbound references
  - boundedContext: dcb-model-authoring
    event: command-definition-updated
    criteria: every command-definition update in this model
  - boundedContext: dcb-model-authoring
    event: command-definition-removed
    criteria: every command-definition removal in this model
  - boundedContext: dcb-model-authoring
    event: projection-definition-added
    criteria: every projection-definition added in this model — a projection's `valueType` names a type
  - boundedContext: dcb-model-authoring
    event: projection-definition-updated
    criteria: every projection-definition update in this model
  - boundedContext: dcb-model-authoring
    event: projection-definition-removed
    criteria: every projection-definition removal in this model
invariants:
  - name: model-active
    rule: The model has been created and has not been deleted.
  - name: definition-exists
    rule: A custom-type-definition currently goes by this name in this model.
  - name: no-inbound-references
    rule: |
      No live event-definition, entity-definition or
      command-definition in this model types a property with this
      name, no live composite custom-type-definition types a *field*
      with it, and no live projection-definition issues it as its
      `valueType`. References are read from the latest body of each
      live definition.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-custom-type-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: custom-type-definition-addition
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-model-id, name, body]
  additionalProperties: false
publishes:
  - custom-type-definition-added
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: update-custom-type-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: custom-type-definition-update
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
    body:
      type: object
  required: [dcb-model-id, name, body]
  additionalProperties: false
publishes:
  - custom-type-definition-updated
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rename-custom-type-definition
description: |
  Renames a custom-type-definition. Atomically emits the rename event
  plus one `*-updated` event for every event-, entity- and
  command-definition that typed a property with `previous-name`, and
  for every projection-definition issuing it, with every occurrence
  replaced by `name`.
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: custom-type-definition-rename
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    previous-name:
      type: string
    name:
      type: string
  required: [dcb-model-id, previous-name, name]
  additionalProperties: false
publishes:
  - custom-type-definition-renamed
  - custom-type-definition-updated
  - event-definition-updated
  - entity-definition-updated
  - command-definition-updated
  - projection-definition-updated
constraints:
  - name: rewrite-property-type-references
    rule: |
      Emit exactly one `*-updated` event for every event-, entity- and
      command-definition currently in the model with at least one
      property typed `previous-name`, with every occurrence replaced
      by `name`. Emit nothing for definitions that did not reference
      the renamed type.
  - name: rewrite-composite-field-types
    rule: |
      Emit exactly one `custom-type-definition-updated` for every
      *other* composite custom-type-definition currently in the model
      with at least one field typed `previous-name`, with every
      occurrence replaced by `name`. Emit nothing for scalar types,
      which reference nothing, nor for composites that did not name the
      renamed type.
  - name: rewrite-projection-value-types
    rule: |
      Emit exactly one `projection-definition-updated` for every
      projection-definition currently in the model whose `valueType`
      is `previous-name`, replaced by `name`. Emit nothing for
      projections holding another type.
actors:
  - modeler
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-custom-type-definition
scope:
  domain: dcb-playground
  boundedContext: dcb-model-authoring
  dynamicConsistencyBoundary: custom-type-definition-removal
data:
  type: object
  properties:
    dcb-model-id:
      type: string
    name:
      type: string
  required: [dcb-model-id, name]
  additionalProperties: false
publishes:
  - custom-type-definition-removed
actors:
  - modeler
