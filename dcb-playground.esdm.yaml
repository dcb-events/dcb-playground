apiVersion: schema.esdm.io/core/v1
kind: domain
name: dcb-playground
description: |
  A modeling tool to design and test DCB-based systems. Authors build
  DCB Contexts — collections of custom-type, event, entity, projection
  and command definitions — and (in a later iteration) validate them against
  scenarios. Entities are the organising unit: each owns its
  identifier type, its lifecycle status and every projection describing
  it. This document models the playground's own domain; the DCB-based
  systems users build *inside* it are not the subject of this model.
